<script>
var DATA=[{"id":"saffi-character","work":"《莎菲女士的日记》","workKey":"saffi","type":"人物形象","title":"莎菲的矛盾形象","prompt":"分析莎菲女士的性格与内心世界。","keywords":["莎菲","矛盾","灵肉冲突","觉醒","孤独","女性"],"thesis":"丁玲通过莎菲的心理描写，写出五四新女性在觉醒后仍无法摆脱灵肉冲突与现实困境的复杂状态。","points":[{"point":"莎菲追求个性解放，敢于表达欲望和自我。","evidence":"“我的欲望……所以我只得忍耐着，低下头去。”","location":"莎菲认识凌吉士后，反复书写自己情感与欲望的日记段落。","explain":"这些表达显示她不再完全服从传统女性规范，敢于承认自己的情感需要。","link":"这为下文写她的内心冲突提供了前提。","page":"P5","edition":"课程资料《丁玲全集 学生背诵版本》"},{"point":"莎菲在灵与肉之间反复摇摆，觉醒并没有带来真正自由。","evidence":"莎菲逐渐发现凌吉士美丽外表下隐藏的“卑劣灵魂”。","location":"莎菲看清凌吉士真实面目后，对他由迷恋转为厌恶的日记段落。","explain":"丁玲把欲望、理性与失望放在同一个人物身上，让读者看到觉醒后的女性仍要面对选择和代价。","link":"这说明莎菲的困境不只是爱情问题，也是时代问题。","page":"P3","edition":"课程资料《丁玲全集 学生背诵版本》"},{"point":"莎菲的孤独来自觉醒之后找不到真正理解她的人。","evidence":"“一个女人这样放肆，是不会得到好结果的。”","location":"莎菲与朋友、爱人相处时反复出现的独白和情绪变化。","explain":"人物越清醒，越难与周围环境相容，孤独感因此成为她精神困境的外在表现。","link":"结尾回扣题目时，应落在五四新女性觉醒后的现实处境。","page":"P3","edition":"课程资料《丁玲全集 学生背诵版本》"}],"traps":["只把莎菲写成追求爱情的女性，忽略觉醒与困境的矛盾。","只写“心理描写很细腻”，没有说明哪个词句表现了什么心理。"]},{"id":"saffi-awakening","work":"《莎菲女士的日记》","workKey":"saffi","type":"主题思想","title":"觉醒后的困境","prompt":"结合文本，谈谈莎菲的觉醒与困境。","keywords":["觉醒","困境","五四","新女性","自由","现实"],"thesis":"莎菲的觉醒让她看清传统束缚，却也让她陷入无路可走的现实困境。","points":[{"point":"她在思想上已经不再接受传统女性角色。","evidence":"“一个女人这样放肆，是不会得到好结果的。”","location":"莎菲面对爱情、身体和社交规范时的日记独白。","explain":"觉醒首先表现为她有了自我判断，不再完全依附外部规范。","link":"但觉醒并不自动带来出路。","page":"P3","edition":"课程资料《丁玲全集 学生背诵版本》"},{"point":"她的现实环境没有为她提供新的精神位置。","evidence":"“一个正经女人所做不出来的。”","location":"莎菲与朋友、凌吉士相处时产生的失望和疏离。","explain":"新思想已经进入她的意识，旧环境仍然包围着她，两者之间形成反差。","link":"困境来自个人觉醒与社会条件之间的落差。","page":"P5","edition":"课程资料《丁玲全集 学生背诵版本》"},{"point":"丁玲借莎菲写出五四女性的真实处境。","evidence":"莎菲是“时代的产儿，也是女性独特心理体验的代表”。","location":"全篇日记的情绪推进和结尾的失落感。","explain":"作品没有把觉醒写成简单胜利，而是让读者看到觉醒之后的代价。","link":"结论要回到“觉醒与困境并存”这一核心判断。","page":"P6","edition":"课程资料《丁玲全集 学生背诵版本》"}],"traps":["把觉醒写成彻底解放，忽略觉醒后仍处于困境。","只谈五四背景，不引用莎菲的具体心理和行为。"]},{"id":"saffi-psychology","work":"《莎菲女士的日记》","workKey":"saffi","type":"艺术手法","title":"心理描写的作用","prompt":"分析《莎菲女士的日记》中心理描写的作用。","keywords":["心理描写","日记体","内心","手法","作用","独白"],"thesis":"丁玲用日记体心理描写把莎菲的欲望、羞耻、清醒与孤独直接呈现在读者面前，使人物矛盾具有真实的心理层次。","points":[{"point":"日记体让人物可以不断暴露真实想法。","evidence":"课程资料概括日记体的情感私人性，认为这种写法使小说“真实可信”。","location":"全篇以莎菲第一人称写成的日记段落。","explain":"第一人称让读者看到人物不愿公开说出的欲望和羞耻，人物因此更立体。","link":"这使作品不同于只写外部行动的叙事。","page":"P7","edition":"课程资料《丁玲全集 学生背诵版本》"},{"point":"心理描写把抽象的灵肉冲突变成可读的情绪过程。","evidence":"“我的欲望……所以我只得忍耐着，低下头去。”","location":"莎菲与凌吉士关系变化前后的反复书写。","explain":"等待、否定、迷恋、厌恶这些心理动作交替出现，读者能看见冲突如何发生。","link":"手法分析要说明效果，不能只报“心理描写”这个术语。","page":"P5","edition":"课程资料《丁玲全集 学生背诵版本》"},{"point":"心理描写同时承担揭示主题的功能。","evidence":"莎菲通过静夜的安宁还自己一个“完全身躯”。","location":"日记中孤独感和失望感逐渐加重的段落。","explain":"个人的心理困境被写成了时代转型期女性的精神困境。","link":"结尾要回到心理描写与主题之间的关系。","page":"P4","edition":"课程资料《丁玲全集 学生背诵版本》"}],"traps":["只写“大量心理描写”，没有分析具体心理变化。","引用后不解释，直接下“人物很矛盾”的结论。"]},{"id":"saffi-love","work":"《莎菲女士的日记》","workKey":"saffi","type":"人物关系","title":"莎菲与凌吉士","prompt":"分析莎菲对凌吉士的感情变化及其意义。","keywords":["凌吉士","爱情","迷恋","厌恶","欲望","选择"],"thesis":"莎菲对凌吉士的感情经历由迷恋、期待到厌恶的转变，集中体现了她的灵肉冲突与自我意识。","points":[{"point":"莎菲最初被凌吉士的外貌和气质吸引。","evidence":"“颀长的身躯，白嫩的面庞，薄薄的小嘴唇，柔软的头发。”","location":"莎菲初次接触并观察凌吉士的日记段落。","explain":"这些描写让欲望变得具体，也表现出她对自我感受的正视。","link":"但外貌吸引并不能带来真正理解。","page":"P2","edition":"课程资料《丁玲全集 学生背诵版本》"},{"point":"当她看清凌吉士的精神世界后，迷恋转为厌恶。","evidence":"凌吉士美丽外表下隐藏着“卑劣灵魂”。","location":"莎菲认清凌吉士真实面目后的心理转折。","explain":"感情变化说明她不只追求欲望满足，也在判断对方是否配得上自己的爱。","link":"这正是她自我意识觉醒的体现。","page":"P3","edition":"课程资料《丁玲全集 学生背诵版本》"},{"point":"这段关系没有给莎菲带来解放，反而加深了她的孤独。","evidence":"莎菲承认自己“想念那高个儿的影子”，却又因礼教顾虑不敢主动。","location":"莎菲与凌吉士关系结束前后的日记内容。","explain":"爱情成为照见她内心矛盾的镜子，也暴露出她所处环境的局限。","link":"结尾应把感情变化放回人物与时代的关系中理解。","page":"P3","edition":"课程资料《丁玲全集 学生背诵版本》"}],"traps":["把感情变化写成简单恋爱故事，忽略灵肉冲突。","只写莎菲爱凌吉士或不爱凌吉士，没有写变化过程。"]},{"id":"water-symbol","work":"《水》","workKey":"water","type":"意象象征","title":"水的多重象征","prompt":"分析《水》中“水”的象征意义。","keywords":["水","象征","洪水","灾难","压迫","反抗"],"thesis":"水既是自然灾害，也是社会压迫和群众力量的象征，丁玲借水的形态变化写出灾民的苦难与觉醒。","points":[{"point":"水首先表现为不可控制的自然灾害。","evidence":"“黄色的滔滔大水”吞噬房屋、淹没田地。","location":"小说开头洪水逼近、村民逃难和恐慌的段落。","explain":"自然灾害建立全篇危机，也为社会矛盾的出现提供背景。","link":"但水的意义没有停留在自然灾害上。","page":"P12","edition":"课程资料《丁玲全集 学生背诵版本》"},{"point":"水又象征官僚压迫下不断加剧的社会危机。","evidence":"官府不修堤坝、不施救济并调兵镇压，水灾与社会压迫合为一体。","location":"灾民与地方官员交涉、官员转移财物等情节。","explain":"洪水之外还有人为压迫，灾民面对的是自然和社会双重困境。","link":"这层象征把自然灾害推向社会批判。","page":"P12","edition":"课程资料《丁玲全集 学生背诵版本》"},{"point":"水最终转化为群众觉醒和反抗的力量。","evidence":"“比水还凶猛的，朝镇上扑了过去。”","location":"结尾群众集体行动和裸身汉子带领反抗的段落。","explain":"水的力量从摧毁灾民转向冲击压迫秩序，象征群众觉醒。","link":"结论必须写成多重象征，不能只写“水代表灾难”。","page":"P9","edition":"课程资料《丁玲全集 学生背诵版本》"}],"traps":["只写水是自然灾害，忽略社会压迫和群众力量。","象征分析只有结论，没有引文和情节定位。"]},{"id":"water-change","work":"《水》","workKey":"water","type":"主题思想","title":"从灾难到抗争","prompt":"结合文本，分析《水》中灾民由恐惧到反抗的变化。","keywords":["灾民","恐惧","反抗","觉醒","群众","变化"],"thesis":"《水》通过灾民由恐惧到联合反抗的变化，表现底层群众在灾难和压迫中逐渐觉醒。","points":[{"point":"灾难初期，灾民主要处于恐惧和无助中。","evidence":"灾民“抱头大哭”“失去了精神，失去了勇气”。","location":"洪水到来前后灾民逃难、求生的情节。","explain":"恐惧状态说明他们还没有形成集体行动能力。","link":"接下来的社会压迫改变了人物关系。","page":"P10","edition":"课程资料《丁玲全集 学生背诵版本》"},{"point":"官僚冷漠和剥削让灾民看清现实。","evidence":"他们认识到自己“与其说是自然事件毋宁说是社会境况的牺牲品”。","location":"灾民与县长、官员发生冲突的段落。","explain":"灾难不再只是自然问题，也成为阶级矛盾的显现。","link":"认识的变化推动群众走向联合。","page":"P9","edition":"课程资料《丁玲全集 学生背诵版本》"},{"point":"结尾的反抗说明群众力量开始形成。","evidence":"“比水还凶猛的，朝镇上扑了过去。”","location":"小说结尾群众反抗的高潮部分。","explain":"反抗把分散的个人痛苦转化为集体行动，完成主题升华。","link":"结尾要点明群众觉醒与作品的社会意义。","page":"P9","edition":"课程资料《丁玲全集 学生背诵版本》"}],"traps":["只概括变化，不写每个阶段的文本依据。","把反抗写成突然发生，忽略压迫推动变化的过程。"]},{"id":"water-hero","work":"《水》","workKey":"water","type":"人物形象","title":"裸身汉子与群众形象","prompt":"分析《水》中裸身汉子或群众形象。","keywords":["裸身汉子","群众","群像","反抗","力量","领袖"],"thesis":"裸身汉子不是孤立的英雄，而是群众力量逐渐形成的集中体现。","points":[{"point":"群众在灾难中承受最直接的苦难。","evidence":"灾民“抱头大哭”“失去了精神，失去了勇气”。","location":"洪水灾害和村民逃难段落。","explain":"群像先以受害者身份出现，奠定作品的现实基础。","link":"苦难为后续反抗积蓄力量。","page":"P10","edition":"课程资料《丁玲全集 学生背诵版本》"},{"point":"群体在压迫中逐渐由分散走向联合。","evidence":"王大保说：“哭有什么用，死的死去了，哭得转来吗？”","location":"灾民与官僚冲突的情节。","explain":"共同处境让个人情绪转化为集体情绪。","link":"裸身汉子的行动正是这种转化的表现。","page":"P10","edition":"课程资料《丁玲全集 学生背诵版本》"},{"point":"裸身汉子代表群体的行动意志。","evidence":"“比水还凶猛的，朝镇上扑了过去。”","location":"小说结尾的高潮段。","explain":"人物与群体合在一起，说明反抗不是个人冲动，而是群众觉醒。","link":"分析人物时要把他放回群众关系，不只写个人性格。","page":"P9","edition":"课程资料《丁玲全集 学生背诵版本》"}],"traps":["把裸身汉子写成传统个人英雄，忽略群众基础。","只描述人物动作，不解释动作的象征意义。"]},{"id":"water-theme","work":"《水》","workKey":"water","type":"主题思想","title":"灾难与社会批判","prompt":"分析《水》的主题思想。","keywords":["主题","灾难","社会批判","阶级","群众","觉醒"],"thesis":"《水》以洪水灾难为表层事件，揭示官僚压迫下底层群众的苦难、觉醒与反抗。","points":[{"point":"作品首先呈现自然灾害带来的生存危机。","evidence":"“黄色的滔滔大水”造成底层民众的生存危机。","location":"小说开篇洪水灾害的描写。","explain":"灾难构成情节起点，也集中呈现底层人民的脆弱处境。","link":"作品并未把灾难只当作自然现象。","page":"P12","edition":"课程资料《丁玲全集 学生背诵版本》"},{"point":"官僚不作为把自然灾害推向社会悲剧。","evidence":"帆船运来的不是赈济米粮，而是军火。","location":"官员处理灾情、灾民求助受阻的情节。","explain":"社会批判由此成为作品的核心主题之一。","link":"社会压迫进一步推动群众态度变化。","page":"P9","edition":"课程资料《丁玲全集 学生背诵版本》"},{"point":"群众觉醒和反抗是作品的主题方向。","evidence":"“比水还凶猛的，朝镇上扑了过去。”","location":"小说结尾群众冲向镇上的段落。","explain":"作品不仅展示苦难，也写出苦难中生长的力量。","link":"结论应同时覆盖灾难、批判和觉醒三层。","page":"P9","edition":"课程资料《丁玲全集 学生背诵版本》"}],"traps":["只写灾难主题，删掉社会批判和群众觉醒。","只写主题判断，不回到情节和人物。"]},{"id":"hospital-luping","work":"《在医院中》","workKey":"hospital","type":"人物形象","title":"陆萍的性格与理想","prompt":"分析陆萍的人物形象。","keywords":["陆萍","性格","理想","批判","善良","坚持"],"thesis":"陆萍是怀抱革命理想的青年知识分子，她在艰苦环境中坚持工作，也因清醒和批判精神与医院现实不断冲突。","points":[{"point":"陆萍有明确的革命理想和责任感。","evidence":"陆萍毕业于上海产科学校，带着系统的现代医学知识投身边区医疗。","location":"陆萍初到医院、投入工作的情节。","explain":"理想驱动她行动，也让她对现实问题格外敏感。","link":"理想与环境的矛盾由此展开。","page":"P14","edition":"课程资料《丁玲全集 学生背诵版本》"},{"point":"她能吃苦，在恶劣条件中仍然坚持。","evidence":"她“为了不愿病人产妇多受苦痛，便自己去替几个开刀了的，发炎的换药”。","location":"陆萍在严寒中奔波、照顾病人的段落。","explain":"身体细节和动作描写让她的坚韧具体可见。","link":"坚韧性格也使她面对问题时不愿妥协。","page":"P8","edition":"课程资料《丁玲全集 学生背诵版本》"},{"point":"她的善良和批判精神使她与环境发生冲突。","evidence":"她提出很多人“不敢讲的，不愿讲的”意见书，被视为医院里“小小的怪人”。","location":"陆萍照顾产妇、新生儿，以及批评医院问题的情节。","explain":"人物形象的价值不只在善良，还在于她敢于提出问题。","link":"结尾要写出陆萍与环境之间的张力。","page":"P8","edition":"课程资料《丁玲全集 学生背诵版本》"}],"traps":["只把陆萍写成善良坚强的医护人员，忽略批判精神。","把身份写成产婆或普通护士，忽略她作为青年知识分子的处境。"]},{"id":"hospital-growth","work":"《在医院中》","workKey":"hospital","type":"主题思想","title":"陆萍的成长","prompt":"分析陆萍在医院中的成长变化。","keywords":["成长","变化","转折","老兵","挫折","理想"],"thesis":"陆萍在医院中的经历不是简单的理想受挫，而是在冲突、挫折和他人启发中重新理解革命工作的过程。","points":[{"point":"进入医院初期，陆萍的理想带有强烈的改造冲动。","evidence":"她提出意见书并被许多人看作“小小的怪人”。","location":"陆萍初到医院后的工作愿望和观察。","explain":"理想让她积极，也使她对现实的复杂性估计不足。","link":"现实中的阻力随即出现。","page":"P8","edition":"课程资料《丁玲全集 学生背诵版本》"},{"point":"挫折让她逐渐看到个人理想与环境之间的距离。","evidence":"她承受流言蜚语，却仍为产妇和婴儿的细小需要去和管理人员争执。","location":"陆萍与医院同事、管理人员发生矛盾的情节。","explain":"她经历的不是能力失败，而是理想与现实之间的磨合。","link":"关键转折需要落到具体人物和事件上。","page":"P9","edition":"课程资料《丁玲全集 学生背诵版本》"},{"point":"没有脚的老兵等人使她重新理解坚持和革命工作。","evidence":"“记挂着头天晚上黎涯送来的消息”，说明她受挫后仍牵挂朋友和病人。","location":"陆萍遇到没有脚的老兵并受到触动的情节。","explain":"成长来自具体经验，而不是突然醒悟。","link":"结尾要落在她更成熟、更踏实的认识上。","page":"P11","edition":"课程资料《丁玲全集 学生背诵版本》"}],"traps":["把成长写成从坏人变好人，人物层次会被简化。","只写受伤和挫折，不写转折事件如何改变陆萍。"]},{"id":"hospital-environment","work":"《在医院中》","workKey":"hospital","type":"艺术手法","title":"环境描写的作用","prompt":"分析《在医院中》环境描写的作用。","keywords":["环境描写","医院","寒冷","混乱","气氛","作用"],"thesis":"医院环境既是人物活动的现实空间，也映照出革命理想与落后现实之间的冲突。","points":[{"point":"寒冷和简陋写出物质条件的困难。","evidence":"陕北冬季的“一场雪”既写自然寒冷，也暗示人文环境冷漠。","location":"陆萍在冬天奔波的段落。","explain":"环境细节让她的坚持有了具体重量。","link":"环境也会影响人物对工作的感受。","page":"P4","edition":"课程资料《丁玲全集 学生背诵版本》"},{"point":"医院管理的混乱营造压抑气氛。","evidence":"整座医院仅配备一个针头弯曲的注射器，手术室也没有供暖火炉。","location":"陆萍观察医院日常工作的情节。","explain":"环境描写把制度的落后和人际矛盾变得可见。","link":"环境由此成为冲突的推力。","page":"P13","edition":"课程资料《丁玲全集 学生背诵版本》"},{"point":"环境与人物形成对照，突出理想主义的力量和困境。","evidence":"陆萍成为医院里“小小的怪人”，被大多数人用异样眼光看待。","location":"陆萍救人、受挫和反思的连续情节。","explain":"外部环境越艰难，人物坚持与批判的价值越清楚。","link":"结尾回答环境描写如何服务人物和主题。","page":"P8","edition":"课程资料《丁玲全集 学生背诵版本》"}],"traps":["只摘抄环境，不解释环境与人物的关系。","只写寒冷，忽略医院制度和人际环境。"]},{"id":"hospital-intellectual","work":"《在医院中》","workKey":"hospital","type":"人物关系","title":"知识分子与医院环境","prompt":"分析陆萍与医院环境的冲突。","keywords":["知识分子","医院","冲突","环境","改革","误解"],"thesis":"陆萍与医院的冲突，是青年知识分子的改革热情同落后环境、复杂人际关系之间的冲突。","points":[{"point":"陆萍带着改造现实的愿望进入医院。","evidence":"陆萍坚持医疗规范化和卫生标准化，拒绝认同“经验化”的医疗模式。","location":"陆萍到医院初期的工作表现。","explain":"愿望本身积极，但现实的复杂性超出她的预期。","link":"冲突不是个人恩怨，而是理想与环境的碰撞。","page":"P14","edition":"课程资料《丁玲全集 学生背诵版本》"},{"point":"医院中的制度化问题和人际冷漠让她的努力受阻。","evidence":"院长不以为然，同事不配合并给她贴上“小资产阶级意识”的标签。","location":"陆萍与同事、管理者发生矛盾的情节。","explain":"环境没有为改革提供支持，反而消解个人热情。","link":"这让陆萍不得不重新思考怎样工作。","page":"P14","edition":"课程资料《丁玲全集 学生背诵版本》"},{"point":"冲突最终推动陆萍成熟。","evidence":"她最后仍准备抓住下一次手术机会：“如何可以使自己不失去这一个机会。”","location":"小说后段陆萍反思和转变的部分。","explain":"人物没有被失败打倒，而是在现实教育中成长。","link":"结尾要回扣知识分子如何面对现实。","page":"P9","edition":"课程资料《丁玲全集 学生背诵版本》"}],"traps":["把冲突写成陆萍与某个人的私人矛盾。","只写环境落后，不写陆萍自身的成长。"]},{"id":"fortress-fang","work":"《围城》","workKey":"fortress","type":"人物形象","title":"方鸿渐的性格困境","prompt":"分析方鸿渐的人物形象。","keywords":["方鸿渐","性格","软弱","虚荣","围城","失败"],"thesis":"方鸿渐并非单纯的无能者，他有自省和善意，却缺少行动力，在爱情、事业和婚姻中不断被自己的软弱推入新的围城。","points":[{"point":"方鸿渐具有自省能力，却缺少改变现实的行动力。","evidence":"“小小一方纸能把一个人的空疏、寡陋、愚笨都掩盖起来。”","location":"买假文凭、回国后面对家庭与工作安排的情节。","explain":"清醒与软弱同时存在，让人物既可悲又真实。","link":"这构成他反复进入围城的内在原因。","page":"P10","edition":"人民文学出版社软皮版"},{"point":"他的爱情选择体现犹豫和被动的性格。","evidence":"“这姓方的不合式，气量太小，把钱看得太重。”","location":"方鸿渐与苏文纨、唐晓芙、孙柔嘉的关系变化。","explain":"感情失败不只是外部误会，也来自他不敢做出明确选择。","link":"爱情围城由此成为人物性格的投射。","page":"P44","edition":"人民文学出版社软皮版"},{"point":"他的事业困境体现知识分子的无力。","evidence":"方鸿渐在三闾大学任教，看见韩学愈同样持有假文凭却担任系主任。","location":"方鸿渐赴三闾大学任教及婚姻开始的情节。","explain":"他希望改变处境，却总被环境推动，形成事业与婚姻的双重困境。","link":"结尾要把人物放回“围城”主题。","page":"待核","edition":"人民文学出版社软皮版"}],"traps":["只写方鸿渐懦弱，忽略他能自省、有善意的一面。","把人物失败全部归因于外部环境，不分析他的选择。"]},{"id":"fortress-satire","work":"《围城》","workKey":"fortress","type":"艺术手法","title":"讽刺艺术","prompt":"分析《围城》的讽刺艺术。","keywords":["讽刺","反讽","比喻","虚伪","知识分子","手法"],"thesis":"《围城》通过反讽、比喻和人物对照，揭示知识分子在社会生活中的虚荣、虚伪与无力。","points":[{"point":"假文凭情节讽刺知识分子的虚荣。","evidence":"“小小一方纸能把一个人的空疏、寡陋、愚笨都掩盖起来。”","location":"方鸿渐留学归来和求职初期相关情节。","explain":"反讽让学历、体面和真实能力之间的裂缝暴露出来。","link":"讽刺首先指向个体人格，也延伸到社会风气。","page":"P10","edition":"人民文学出版社软皮版"},{"point":"三闾大学的情节讽刺学术圈的虚伪。","evidence":"张家对“这姓方的不合式”的评价，显示人情与婚姻中的功利计算。","location":"方鸿渐到三闾大学任教后的校园与人事情节。","explain":"把知识分子群体放进日常权力关系，能显出崇高称号背后的庸俗。","link":"这里体现作品对社会群体的批判。","page":"P44","edition":"人民文学出版社软皮版"},{"point":"婚姻围城和人物关系用比喻强化讽刺效果。","evidence":"“结婚仿佛金漆的鸟笼，笼子外面的鸟想住进去，笼内的鸟想飞出来。”","location":"方鸿渐爱情、婚姻和职业连续受挫的情节线。","explain":"围城比喻把欲望、失望和现实困境压缩成一个可反复回扣的意象。","link":"结尾要点明讽刺不是搞笑，而是对人生处境的揭示。","page":"待核","edition":"人民文学出版社软皮版"}],"traps":["只写“运用比喻和讽刺”，没有解释讽刺指向什么。","把讽刺理解成单纯搞笑，忽略其中的社会批判。"]},{"id":"fortress-marriage","work":"《围城》","workKey":"fortress","type":"主题思想","title":"婚姻围城","prompt":"结合文本，分析《围城》中婚姻围城的含义。","keywords":["婚姻","围城","爱情","失望","选择","方鸿渐"],"thesis":"婚姻围城在小说中表现为对理想生活的想象和进入现实后的失望，方鸿渐与孙柔嘉的婚姻集中写出这种困境。","points":[{"point":"婚姻在人物想象中代表着理想和归属。","evidence":"“结婚仿佛金漆的鸟笼，笼子外面的鸟想住进去，笼内的鸟想飞出来。”","location":"方鸿渐与苏文纨、唐晓芙、孙柔嘉关系发展的情节。","explain":"婚姻寄托了他的期待，也暴露了他对自我和责任认识不足。","link":"期待越高，进入现实后的落差越明显。","page":"待核","edition":"人民文学出版社软皮版"},{"point":"进入婚姻后，日常矛盾和现实压力打破理想。","evidence":"张家对“这姓方的不合式”的评价，显示婚姻选择中的现实考量。","location":"方鸿渐与孙柔嘉结婚后相处的情节。","explain":"婚姻不是浪漫结局，而是另一种现实困境的开始。","link":"这正是围城隐喻在婚姻线上的体现。","page":"P44","edition":"人民文学出版社软皮版"},{"point":"婚姻围城与事业围城互相映照。","evidence":"方鸿渐与孙柔嘉婚后争执不断，婚姻成为另一种围城。","location":"方鸿渐在三闾大学任教并进入婚姻阶段的情节。","explain":"个人在爱情、事业、家庭中不断进入新困境，构成更普遍的人生困局。","link":"结尾要回到“围城”作为人生困境的象征。","page":"待核","edition":"人民文学出版社软皮版"}],"traps":["只写某段感情失败，忽略婚姻围城的普遍含义。","只讲婚姻，不断开事业围城的互相映照。"]},{"id":"fortress-parallel","work":"《围城》","workKey":"fortress","type":"人物关系","title":"赵辛楣与方鸿渐","prompt":"分析赵辛楣与方鸿渐的平行关系及其作用。","keywords":["赵辛楣","方鸿渐","平行","对照","三闾大学","知识分子"],"thesis":"赵辛楣和方鸿渐构成平行对照关系，两人共同暴露知识分子的困境，也通过性格和处世方式的差异加深人物塑造与社会讽刺。","points":[{"point":"两人都卷入爱情和职业困境，构成平行线。","evidence":"赵辛楣和方鸿渐在爱情、事业、婚姻中经历不同却互相映照的困境。","location":"方鸿渐与赵辛楣在国内相处、赴三闾大学任教的情节线。","explain":"平行关系说明困境不只属于某个人，而是知识分子群体共同面对的问题。","link":"平行并不意味着人物完全相同。","page":"待核","edition":"人民文学出版社软皮版"},{"point":"两人的性格和处世方式形成对照。","evidence":"赵辛楣自信强势，方鸿渐犹疑被动，性格差异在相处中不断显露。","location":"两人处理爱情、工作和人际关系的相关情节。","explain":"对照突出方鸿渐的软弱，也说明个人选择如何影响命运。","link":"人物关系因此承担塑造和讽刺的双重功能。","page":"待核","edition":"人民文学出版社软皮版"},{"point":"两人的关系映射三闾大学和知识圈的虚伪。","evidence":"三闾大学的人际与权力关系使两人的共同处境进一步显现。","location":"三闾大学教师群体和人事矛盾情节。","explain":"通过一对人物关系，作品把个人困境扩展到群体批判。","link":"结尾要回到作品对知识分子处境的整体表现。","page":"待核","edition":"人民文学出版社软皮版"}],"traps":["只并列写两个人，不说明二者如何对照。","把赵辛楣写成完人，忽略他也处在同样的社会困境中。"]},{"id":"saffi-loneliness","work":"《莎菲女士的日记》","workKey":"saffi","type":"主题思想","title":"莎菲的孤独","prompt":"分析莎菲孤独感的来源及其意义。","keywords":["孤独","寂寞","无人理解","疾病","蕴姊","新女性"],"thesis":"莎菲的孤独既来自病体和亲友的不理解，也来自她觉醒后找不到同路人的精神处境。","points":[{"point":"疾病和独居放大了莎菲的寂寞。","evidence":"她独自煨牛奶、看报、生气，独处生活不断加深敏感。","location":"莎菲日常生活中反复出现的独处与病中场景。","page":"P7","edition":"课程资料《丁玲全集 学生背诵版本》","explain":"私人生活细节让孤独不只是一种情绪，而成为可见的生活状态。","link":"孤独因此成为人物心理和时代困境的共同表现。"},{"point":"亲友的照顾无法真正理解她的精神需求。","evidence":"毓芳只会“忠实地替我盖被子，留心我的药”，却无法与莎菲真正对话。","location":"莎菲与毓芳、云霖、苇弟相处的日记段落。","page":"P4","edition":"课程资料《丁玲全集 学生背诵版本》","explain":"生活照顾和精神共鸣之间存在落差，说明莎菲需要的是理解而非同情。","link":"这使她不断退回日记和自我内部。"},{"point":"蕴姊之死让莎菲失去唯一可能理解自己的人。","evidence":"蕴姊去世后，莎菲感到更加无助，只能通过记日记保持心灵沟通。","location":"关于蕴姊去世和莎菲继续写日记的段落。","page":"P4","edition":"课程资料《丁玲全集 学生背诵版本》","explain":"日记成为她与外界隔绝后的精神出口。","link":"结尾应把个人孤独与五四新女性的处境联系起来。"}],"traps":["只写莎菲性格孤僻，忽略社会和时代原因。","把孤独和爱情困惑混为一谈，没有分层。"]},{"id":"saffi-weidi","work":"《莎菲女士的日记》","workKey":"saffi","type":"人物关系","title":"莎菲与苇弟","prompt":"分析苇弟形象及其对莎菲人物塑造的作用。","keywords":["苇弟","软弱","陪伴","拒绝","依赖","矛盾"],"thesis":"苇弟的真诚与软弱既是莎菲寂寞时的依靠，也是她反感和拒绝的对象，由此显出莎菲对爱情和精神共鸣的双重要求。","points":[{"point":"苇弟真诚体贴，是莎菲生活中稳定的陪伴者。","evidence":"他关心莎菲身体，在莎菲孤独时前来陪伴。","location":"苇弟多次看望、照顾莎菲的日记段落。","page":"P2","edition":"课程资料《丁玲全集 学生背诵版本》","explain":"陪伴满足莎菲的部分情感需要，也让她看到自己对他人的依赖。","link":"陪伴并不能自动转化为爱情。"},{"point":"苇弟的软弱和眼泪引起莎菲的反感。","evidence":"莎菲厌烦他哭哭啼啼和卑微的表达方式。","location":"莎菲描写苇弟情感反应和自身态度的段落。","page":"P5","edition":"课程资料《丁玲全集 学生背诵版本》","explain":"苇弟的被动强化了莎菲对成熟、理解和精神力量的期待。","link":"她拒绝苇弟，并不是拒绝真诚本身。"},{"point":"苇弟使莎菲的矛盾更加具体。","evidence":"她既期待苇弟陪伴，又在他离开后感到惆怅。","location":"苇弟来看望和离开前后的情绪变化。","page":"P5","edition":"课程资料《丁玲全集 学生背诵版本》","explain":"人物关系把莎菲“需要爱又无法接受现成爱情”的矛盾具体化。","link":"分析时要把苇弟当作映照莎菲的镜子。"}],"traps":["只评价苇弟软弱，忽略他对莎菲情感的支撑。","把苇弟写成单纯工具人，不分析关系作用。"]},{"id":"saffi-diary-form","work":"《莎菲女士的日记》","workKey":"saffi","type":"艺术手法","title":"日记体的叙事效果","prompt":"分析《莎菲女士的日记》的日记体特征及其表达效果。","keywords":["日记体","第一人称","私人性","即时性","独语","真实感"],"thesis":"日记体让莎菲的私人情感、即时情绪和内心独语直接呈现，使人物矛盾具有现场感和真实感。","points":[{"point":"私人性使莎菲能够说出不愿公开的欲望与羞耻。","evidence":"日记写下爱情困惑、身体欲望和自我怀疑。","location":"全篇带有自我倾诉性质的日记内容。","page":"P7","edition":"课程资料《丁玲全集 学生背诵版本》","explain":"读者看到的是未经过度整理的心理原貌，人物因此真实。","link":"私人性也使作品具有心理暴露的冲击力。"},{"point":"即时性让情绪变化呈现为连续过程。","evidence":"莎菲当天的期待、懊悔、厌恶和空虚被依次记录。","location":"莎菲与凌吉士关系变化前后的日记。","page":"P7","edition":"课程资料《丁玲全集 学生背诵版本》","explain":"情绪没有被事后总结成单一结论，读者能追踪它的起伏。","link":"这使人物矛盾具有动态过程。"},{"point":"独语性把人物内心冲突写成两个自我的争辩。","evidence":"她一边渴望亲近凌吉士，一边警告自己不要主动。","location":"“难道我去找他吗”等内心争辩。","page":"P7","edition":"课程资料《丁玲全集 学生背诵版本》","explain":"日记形式让理智和欲望同时发声，冲突不需要外部解释。","link":"结尾要回到形式与主题的统一。"}],"traps":["只写第一人称，不分析它对心理、节奏和主题的作用。","把日记体当作内容复述。"]},{"id":"water-contrast","work":"《水》","workKey":"water","type":"艺术手法","title":"《水》中的对比","prompt":"分析《水》中对比手法的运用。","keywords":["对比","官民","灾民","军火","希望","反抗"],"thesis":"《水》通过官与民、希望与失望、求生与反抗的对比，揭示天灾背后的人祸并推动群众觉醒。","points":[{"point":"灾民的痛苦与官员的冷漠形成对比。","evidence":"灾民缺粮求生，官员却严防灾民并维护自身利益。","location":"长岭岗镇外士兵警戒、灾民得不到救济的段落。","page":"P9","edition":"课程资料《丁玲全集 学生背诵版本》","explain":"对比让灾难从自然事件转向社会批判。","link":"矛盾推动群众态度发生变化。"},{"point":"赈济希望与军火现实形成反差。","evidence":"帆船运来的不是米粮，而是军火。","location":"灾民等待救济、看见船只靠岸的段落。","page":"P9","edition":"课程资料《丁玲全集 学生背诵版本》","explain":"期待的落空让群众看清官府立场。","link":"失望由此转化为愤怒。"},{"point":"水的凶猛与人群反抗形成力量对照。","evidence":"结尾群众“比水还凶猛”地冲向镇上。","location":"小说第四部分和结尾高潮。","page":"P9","edition":"课程资料《丁玲全集 学生背诵版本》","explain":"原本摧毁生命的水，转化为反抗力量的比喻。","link":"对比完成意象意义的反转。"}],"traps":["只列对比对象，不解释对比产生什么效果。","把官民对比写成简单善恶。"]},{"id":"water-wangdabao","work":"《水》","workKey":"water","type":"人物形象","title":"王大保和李塌鼻","prompt":"分析王大保和李塌鼻在灾民群体中的作用。","keywords":["王大保","李塌鼻","群众","求生","觉醒","组织"],"thesis":"王大保和李塌鼻分别以号召力和现实经验推动群众从绝望求生走向集体反抗。","points":[{"point":"王大保用直接有力的话语打破群体绝望。","evidence":"“哭有什么用，死的死去了，哭得转来吗？”","location":"洪水过后灾民抱头大哭、王大保站出来讲话的段落。","page":"P10","edition":"课程资料《丁玲全集 学生背诵版本》","explain":"他的语言把悲痛转化为行动要求，群体开始讨论求生计划。","link":"他是群众情绪转折的推动者。"},{"point":"李塌鼻用对地主存粮的了解增强行动信心。","evidence":"他说“打开他们的仓，够我们一渡口的人吃几年”。","location":"灾民商议前往长岭岗求生的段落。","page":"P11","edition":"课程资料《丁玲全集 学生背诵版本》","explain":"具体信息让求生不再是空想，也使群众看到现实可能性。","link":"他代表底层经验与实干力量。"},{"point":"两人共同推动群体从求生走向反抗。","evidence":"王大保的号召和李塌鼻对官府不修堤的控诉，为后续愤怒埋下伏笔。","location":"前往长岭岗及发现官府镇压灾民的前后情节。","page":"P11","edition":"课程资料《丁玲全集 学生背诵版本》","explain":"个人言论汇聚为集体意识，说明觉醒具有群众基础。","link":"分析人物时要落到群体作用，不只写性格。"}],"traps":["把王大保写成孤胆英雄，忽略群众反应。","只写台词，不分析语言如何推动集体情绪。"]},{"id":"hospital-group","work":"《在医院中》","workKey":"hospital","type":"人物形象","title":"医院人物群像","prompt":"分析《在医院中》医院人物群像的作用。","keywords":["院长","黄守荣","张芳子","群像","官僚","冷漠"],"thesis":"医院人物群像分别代表外行领导、敷衍中层、麻木同事和疏离专业人员，共同构成陆萍改革受阻的现实环境。","points":[{"point":"院长代表外行领导和官僚作风。","evidence":"院长对专业建议不积极回应，对女同志缺乏尊重。","location":"陆萍提交意见书、与院长发生接触的情节。","page":"P6","edition":"课程资料《丁玲全集 学生背诵版本》","explain":"权力层的问题使改革无法获得制度支持。","link":"这构成陆萍改革失败的外部原因。"},{"point":"张芳子等同事代表麻木与随波逐流。","evidence":"他们对医院乱象习以为常，也不配合陆萍的整改。","location":"陆萍与同事工作相处及提出意见的情节。","page":"P6","edition":"课程资料《丁玲全集 学生背诵版本》","explain":"群体麻木让个人热情难以转化为集体改变。","link":"群像揭示了环境改造的复杂。"},{"point":"群像共同突出陆萍的孤立与坚持。","evidence":"陆萍被视为“怪人”“不合群”，却仍坚持专业标准。","location":"医院对陆萍的议论和排斥情节。","page":"P8","edition":"课程资料《丁玲全集 学生背诵版本》","explain":"他人的冷淡成为映照陆萍责任感和批评精神的背景。","link":"分析群像要回到主人公处境和主题。"}],"traps":["只列人物名字，不写他们各自代表的问题。","群像分析与陆萍无关，文章被拆成人物介绍。"]},{"id":"hospital-gas","work":"《在医院中》","workKey":"hospital","type":"主题思想","title":"手术室中毒事件","prompt":"分析手术室中毒事件在小说中的作用。","keywords":["中毒","手术室","黎涯","冲突","成长","制度问题"],"thesis":"中毒事件把医院长期存在的设备、管理与人际问题集中引爆，也迫使陆萍重新思考个人理想和革命现实的关系。","points":[{"point":"事件暴露医院设备和管理的严重问题。","evidence":"手术室没有煤炉，只能烧木炭火，最终导致人员中毒。","location":"陆萍申请火炉、手术室烧炭和事故发生的情节。","page":"P10","edition":"课程资料《丁玲全集 学生背诵版本》","explain":"事故不是偶发，而是长期敷衍和条件落后共同造成的结果。","link":"这使得陆萍此前的批评得到事实印证。"},{"point":"事件让陆萍与环境的矛盾全面爆发。","evidence":"事故后她情绪失控，又承受流言和误解。","location":"中毒事件后陆萍生病、被议论和反思的段落。","page":"P15","edition":"课程资料《丁玲全集 学生背诵版本》","explain":"个人热情与冷漠环境之间的冲突不再能被回避。","link":"冲突推动人物进入新的认识阶段。"},{"point":"事件成为陆萍成长的关键转折。","evidence":"她受挫后仍牵挂朋友和病人。","location":"她醒来后记挂黎涯和病人的段落。","page":"P11","edition":"课程资料《丁玲全集 学生背诵版本》","explain":"善良、责任感和专业理想在打击后仍然存在。","link":"成长不是热情消失，而是对现实有更复杂的理解。"}],"traps":["只复述事故经过，不分析事件对人物和主题的作用。","把事故写成偶然，忽略此前铺垫。"]},{"id":"hospital-ending","work":"《在医院中》","workKey":"hospital","type":"主题思想","title":"结尾与成长方向","prompt":"分析《在医院中》结尾对陆萍成长的意义。","keywords":["结尾","成长","革命","反思","机会","理想"],"thesis":"结尾没有把陆萍写成被现实击垮的人，而是让她在反思后仍准备回到工作中，显示成长后的坚持更成熟。","points":[{"point":"结尾让陆萍从情绪失控回到理性反思。","evidence":"经历中毒和流言后，她开始重新理解自己与革命的关系。","location":"小说后段陆萍的反思和情绪变化。","page":"P15","edition":"课程资料《丁玲全集 学生背诵版本》","explain":"成长首先表现为自我认识的变化，而不只是外部环境改变。","link":"这使人物没有停留在受害者位置。"},{"point":"朋友的关怀帮助她恢复行动意志。","evidence":"朋友与她的交流让她重新获得热情。","location":"陆萍与朋友谈心后恢复状态的部分。","page":"P9","edition":"课程资料《丁玲全集 学生背诵版本》","explain":"个人成长离不开社会关系和群体支持。","link":"革命不是孤立的个人理想。"},{"point":"最后仍准备抓住下一场手术机会，体现坚持。","evidence":"“听说郑鹏有个大开刀，她正准备着如何可以使自己不失去这一个机会。”","location":"小说结尾附近。","page":"P9","edition":"课程资料《丁玲全集 学生背诵版本》","explain":"她没有被挫折击垮，而是继续寻找工作机会。","link":"结尾应落到理想经过现实磨炼后的延续。"}],"traps":["把结尾理解成理想彻底失败。","只写事件结束，不回答成长了什么。"]},{"id":"fortress-diploma","work":"《围城》","workKey":"fortress","type":"主题思想","title":"假文凭的象征意义","prompt":"分析方鸿渐假文凭事件的讽刺意义。","keywords":["假文凭","克莱登","虚荣","学历","知识分子","围城"],"thesis":"假文凭既讽刺社会对学历的盲目崇拜，也象征方鸿渐用虚荣掩盖空疏、从而进入人生围城的起点。","points":[{"point":"假文凭掩盖了方鸿渐的空疏和无能。","evidence":"“小小一方纸能把一个人的空疏、寡陋、愚笨都掩盖起来。”","location":"方鸿渐决定购买学位、回国前面对文凭问题处。","page":"P10","edition":"人民文学出版社软皮版","explain":"文凭本应证明能力，却在小说中变成遮羞工具。","link":"虚荣因此成为人物悲剧的内在起点。"},{"point":"社会对洋文凭的迷信使骗局得以成立。","evidence":"假学历被报刊和社交圈当成荣誉传播。","location":"方鸿渐回国后报纸登载、社交圈追捧其博士身份的情节。","page":"待核","edition":"人民文学出版社软皮版","explain":"讽刺不只指向个人，也指向社会评价体系。","link":"个人虚荣与社会崇拜互相推动。"},{"point":"假文凭成为方鸿渐后续困境的伏笔。","evidence":"学历问题影响他的职业、婚恋和自尊。","location":"求职、三闾大学任教及与唐晓芙关系变化的情节线。","page":"待核","edition":"人民文学出版社软皮版","explain":"虚假身份无法提供真正稳定，只会不断制造新的困境。","link":"结尾要回扣“围城”主题。"}],"traps":["只批判方鸿渐个人，不分析社会崇拜学历的现象。","把假文凭当作孤立事件，不联系职业和婚恋困境。"]},{"id":"fortress-intellectuals","work":"《围城》","workKey":"fortress","type":"主题思想","title":"三闾大学与知识分子群像","prompt":"分析《围城》中的知识分子群像。","keywords":["三闾大学","知识分子","虚伪","派系","李梅亭","韩学愈"],"thesis":"《围城》通过三闾大学的派系斗争和学者群像，讽刺知识分子在名利、权力和虚荣中的庸俗化。","points":[{"point":"三闾大学呈现学术机构的派系争斗。","evidence":"教师之间争权夺利，职位安排充满算计。","location":"第五至第七章三闾大学任教情节。","page":"待核","edition":"人民文学出版社软皮版","explain":"学术空间被权力关系主导，知识理想受到讽刺。","link":"个体困境由此扩展为群体批判。"},{"point":"人物行为暴露道貌岸然与个人私利。","evidence":"李梅亭表面讲道德，实际偷藏药品、偷吃红薯。","location":"赴三闾大学旅途中李梅亭的相关情节。","page":"待核","edition":"人民文学出版社软皮版","explain":"人物反差使虚伪人格通过行动暴露出来。","link":"讽刺通过情节而非作者议论完成。"},{"point":"知识分子在虚荣和现实压力下失去方向。","evidence":"方鸿渐、韩学愈等人围绕学历和职位不断受困。","location":"三闾大学学历、职位和人际关系情节。","page":"待核","edition":"人民文学出版社软皮版","explain":"知识分子的精神困境与社会环境互相作用。","link":"结论要把群像与作品的整体讽刺主题连接起来。"}],"traps":["只罗列人物丑事，不分析群体象征。","把讽刺写成简单道德批判，忽略时代环境。"]},{"id":"fortress-metaphor","work":"《围城》","workKey":"fortress","type":"艺术手法","title":"比喻与围城意象","prompt":"分析《围城》中比喻和意象的艺术作用。","keywords":["比喻","意象","鸟笼","围城","人生困境","讽刺"],"thesis":"《围城》用鸟笼、城堡和围城等比喻，把婚姻、职业与人生困境具象化，使讽刺具有反复回扣的结构力量。","points":[{"point":"鸟笼比喻把婚姻中的进出欲具象化。","evidence":"“结婚仿佛金漆的鸟笼，笼子外面的鸟想住进去，笼内的鸟想飞出来。”","location":"小说人物谈论婚姻与围城的相关情节。","page":"待核","edition":"人民文学出版社软皮版","explain":"鸟笼把愿望、进入现实后的失望和再次逃离压缩成一个形象。","link":"这一比喻构成全文围城主题的直观基础。"},{"point":"围城意象反复出现在爱情、职业和婚姻中。","evidence":"人物不断进入新的关系、职位和身份，又不断想要离开。","location":"方鸿渐从爱情到三闾大学再到婚姻的连续经历。","page":"待核","edition":"人民文学出版社软皮版","explain":"同一意象在不同生活领域重复出现，形成结构回环。","link":"比喻因此不仅属于语言，也属于叙事结构。"},{"point":"比喻还承担讽刺和人性揭示。","evidence":"对文凭、知识分子和社交场面采用夸张比喻。","location":"假文凭、三闾大学和社交圈相关描写。","page":"待核","edition":"人民文学出版社软皮版","explain":"比喻让抽象的社会病态和性格缺陷变得可见。","link":"结尾要落回比喻与主题、讽刺的统一。"}],"traps":["只摘抄比喻，不解释比喻和行为、主题的关系。","把所有意象都说成围城，忽略具体语境。"]}];
var WORKS={"saffi":"《莎菲女士的日记》","water":"《水》","hospital":"《在医院中》","fortress":"《围城》"};
var state={mode:"list",work:"all",query:"",selected:null,matchQuery:"",hide:false};
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function workName(k){return WORKS[k]||k}
function norm(s){return String(s||"").toLowerCase().replace(/[\s，。！？；：、“”‘’（）《》〈〉·,.!?;:'"()\[\]{}<>\/\\-]/g,"")}
function grams(s,n){s=norm(s);var out=[];for(var i=0;i<=s.length-n;i++)out.push(s.slice(i,i+n));return out}
function itemText(x){return [x.title,x.prompt,x.work,x.type,x.keywords.join(" "),x.thesis,x.points.map(function(p){return p.point+" "+p.evidence+" "+p.location}).join(" ")].join(" ")}
function scoreItem(x,q){q=norm(q);if(!q)return 0;var score=0;x.keywords.forEach(function(k){if(q.indexOf(norm(k))>=0)score+=18});if(q.indexOf(norm(x.title))>=0)score+=28;if(norm(x.prompt).indexOf(q)>=0)score+=28;var target=itemText(x);[2,3,4].forEach(function(n){grams(q,n).forEach(function(g){if(target.indexOf(g)>=0)score+=g.length*g.length})});return score}
function matchedKeywords(x,q){q=norm(q);return x.keywords.filter(function(k){return q.indexOf(norm(k))>=0})}
function listView(){var q=state.query;var arr=DATA.filter(function(x){return (state.work==="all"||x.workKey===state.work)&&(!q||itemText(x).indexOf(q)>=0)});var chips='<div class="chips"><button class="'+(state.work==="all"?"on":"")+'" data-work="all">全部</button>'+Object.keys(WORKS).map(function(k){return '<button class="'+(state.work===k?"on":"")+'" data-work="'+k+'">'+esc(WORKS[k])+'</button>'}).join("")+'</div>';var cards=arr.map(function(x){return '<div class="card" data-open="'+x.id+'"><div class="meta"><span class="tag">'+esc(workName(x.workKey))+'</span><span class="tag">'+esc(x.type)+'</span></div><h3>'+esc(x.title)+'</h3><p>'+esc(x.prompt)+'</p></div>'}).join("")||'<div class="empty">没有找到匹配的母题</div>';return '<input class="search" id="search" placeholder="搜索题目、作品或关键词" value="'+esc(q)+'">'+chips+'<div class="count">共 '+arr.length+' 道母题</div>'+cards}
function matchView(){var results=DATA.map(function(x){return {item:x,score:scoreItem(x,state.matchQuery)}}).filter(function(x){return x.score>0}).sort(function(a,b){return b.score-a.score}).slice(0,3);var html='<textarea class="matchBox" id="matchBox" placeholder="粘贴题目，例如：分析《围城》的讽刺艺术">'+esc(state.matchQuery)+'</textarea><button class="primary" id="doMatch">匹配母题</button>';if(state.matchQuery&&results.length){html+='<div class="hint">最接近的母题</div>'+results.map(function(r){var kws=matchedKeywords(r.item,state.matchQuery).join("、");return '<div class="result" data-open="'+r.item.id+'"><span class="score">匹配 '+r.score+'</span><h3>'+esc(r.item.title)+'</h3><p>'+esc(r.item.work)+' · '+esc(r.item.type)+(kws?' · '+esc(kws):'')+'</p><p>'+esc(r.item.thesis)+'</p></div>'}).join("")}else if(state.matchQuery){html+='<div class="empty">暂时没有匹配到母题，换一个题目关键词试试</div>'}return html}
function detailView(x){var points=x.points.map(function(p,i){var page=p.page?' · 页码：'+esc(p.page)+(p.edition?'（'+esc(p.edition)+'）':''):'';return '<div class="point"><div class="pointTitle">论点 '+(i+1)+'：'+esc(p.point)+'</div><div class="field"><b>原文依据</b>'+esc(p.evidence)+'</div><div class="loc">定位：'+esc(p.location)+page+'</div><div class="field"><b>Explain</b>'+esc(p.explain)+'</div><div class="field"><b>Link</b>'+esc(p.link)+'</div></div>'}).join("");var traps=x.traps.map(function(t){return '<div class="warn">'+esc(t)+'</div>'}).join("");return '<span class="back" id="back">← 返回</span><div class="panel"><div class="meta"><span class="tag">'+esc(workName(x.workKey))+'</span><span class="tag">'+esc(x.type)+'</span></div><h2>'+esc(x.title)+'</h2><p>'+esc(x.prompt)+'</p><div class="thesis"><b>中心论点</b><br>'+esc(x.thesis)+'</div></div><div class="panel"><button class="ghost" id="toggleHide">'+(state.hide?"显示论点与原文定位":"先自己想，遮住答案")+'</button><div class="'+(state.hide?"hide":"")+'" id="answerBox" style="margin-top:12px"><h3>三个论点</h3>'+points+'</div></div><div class="panel"><h3>扣题提醒</h3>'+traps+'</div>'}
function render(){var app=document.getElementById("app");if(state.selected){var item=DATA.find(function(x){return x.id===state.selected});app.innerHTML=item?detailView(item):'<div class="empty">没有找到这道题</div>'}else{app.innerHTML=state.mode==="match"?matchView():listView()}bind()}
function bind(){document.querySelectorAll("#tabs button").forEach(function(b){b.className=b.dataset.mode===state.mode?"on":"";b.onclick=function(){state.mode=b.dataset.mode;state.selected=null;state.hide=false;render()}});var search=document.getElementById("search");if(search)search.oninput=function(){state.query=this.value.trim();render();var el=document.getElementById("search");if(el){el.focus();el.selectionStart=el.selectionEnd=el.value.length}};document.querySelectorAll("[data-work]").forEach(function(b){b.onclick=function(){state.work=b.dataset.work;render()}});document.querySelectorAll("[data-open]").forEach(function(el){el.onclick=function(){state.selected=el.dataset.open;state.hide=false;render();window.scrollTo(0,0)}});var box=document.getElementById("matchBox");if(box)box.oninput=function(){state.matchQuery=this.value};var doMatch=document.getElementById("doMatch");if(doMatch)doMatch.onclick=function(){state.matchQuery=document.getElementById("matchBox").value.trim();render()};var back=document.getElementById("back");if(back)back.onclick=function(){state.selected=null;render()};var toggle=document.getElementById("toggleHide");if(toggle)toggle.onclick=function(){state.hide=!state.hide;render()}}
render();
</script>
