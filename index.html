var DATA=[{"id":"fortress-tang-relationship","work":"《围城》","workKey":"fortress","type":"人物关系","title":"苏文纨、唐晓芙与方鸿渐","prompt":"分析苏文纨如何挑拨唐晓芙与方鸿渐的关系，并说明这段感情破裂的原因。","keywords":["苏文纨","唐晓芙","方鸿渐","挑拨","爱情理想","分手"],"thesis":"苏文纨被方鸿渐拒绝后，把信件、感情经历和学历传闻转给唐晓芙，击中她对爱情纯度的要求。唐晓芙希望方鸿渐证明自己，却用连续追问堵住回应；方鸿渐羞愧退缩，无法完成有效解释。挑拨、爱情理想和沟通失败共同造成关系破裂。","points":[{"point":"唐晓芙把爱情理解为需要经受曲折和考验的伟大情感，对恋人的诚信提出极高要求。","evidence":"“自己决不会爱方鸿渐，爱是又曲折又伟大的情感，决非那么轻易简单。”“方先生的过去太丰富了！我爱的人，我要能够占领他整个生命，他在碰见我以前，没有过去，留着空白等待我——”","location":"第三章：唐晓芙与方鸿渐往来渐多，却仍以理想标准审视这段感情。","explain":"唐晓芙把爱情理解为曲折、伟大、需要经受内心确认的情感，又要求恋人过去完全空白。她追求的是绝对纯粹和被完整占有的关系，因此现实中任何旧关系、隐瞒和身份问题都会被看成对爱情的背叛。这一理想标准使她保持骄傲和自持，也使苏文纨提供的负面信息具有巨大杀伤力。由此，前段的爱情理想为后文信任崩塌埋下心理基础。","link":"前段的爱情理想为后文信任崩塌埋下心理基础。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第三章","searchPhrase":"爱是又曲折又伟大的情感","pdfPage":"待核","stage":"前","chain":{"who":"唐晓芙","action":"唐晓芙把爱情理解为需要经受曲折和考验的伟大情感，对恋人的诚信提出极高要求。","reason":"唐晓芙把爱情理解为曲折、伟大、需要经受内心确认的情感，又要求恋人过去完全空白","consequence":"前段的爱情理想为后文信任崩塌埋下心理基础。"}},{"point":"苏文纨被拒绝后，借信件和经过筛选的往事把方鸿渐塑造成不诚实、有婚史且学历可疑的人。","evidence":"“你——你这浑蛋！”苏小姐用中文骂他，声音似乎微颤。“表姐给我看的，她并且把从船上到那天晚上的事全告诉我。”“方先生现在住的周家，听说并不是普通的亲戚，是贵岳家，方先生以前结过婚——”“据说方先生在欧洲念书，得到过美国学位——”","location":"第四章：唐晓芙质问方鸿渐，说明苏文纨已把信件、船上关系和学历传闻全部告诉她。","explain":"方鸿渐拒绝苏文纨后，她先用怒骂表现自尊受损，随后把私人信件交给唐晓芙，再把方鸿渐与鲍小姐的关系、周家的婚约背景和假文凭传闻组织成一整套不诚信证据。苏文纨掌握信息解释权，唐晓芙只能从她筛选过的事实中认识方鸿渐。感情经历和学历同时失去可信度，唐晓芙的爱情理想因此迅速转成审判。由此，中段挑拨把私人误会变成道德审判，并直接摧毁双方信任。","link":"中段挑拨把私人误会变成道德审判，并直接摧毁双方信任。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第四章","searchPhrase":"表姐给我看的","pdfPage":"待核","stage":"中","chain":{"who":"苏文纨","action":"苏文纨被拒绝后，借信件和经过筛选的往事把方鸿渐塑造成不诚实、有婚史且学历可疑的人。","reason":"方鸿渐拒绝苏文纨后，她先用怒骂表现自尊受损，随后把私人信件交给唐晓芙，再把方鸿渐与鲍小姐的关系、周家的婚约背景和假文凭传闻组织成一整套不诚信证据","consequence":"中段挑拨把私人误会变成道德审判，并直接摧毁双方信任。"}},{"point":"唐晓芙等待辩护，方鸿渐却以沉默和自我否定回应，两人共同锁定分手结局。","evidence":"“唐小姐恨不能说：‘你为什么不辩护呢？我会相信你，’可是只说：‘那么再会。’”“你说得对。我是个骗子，我不敢再辩，以后决不来讨厌了。”","location":"第四章：唐晓芙当面质问后提出决裂，方鸿渐没有完成有效辩护。","explain":"唐晓芙内心希望方鸿渐辩护，外表却用连续盘问和决绝语气逼他立刻给出答案。方鸿渐羞愧、自卑又害怕失去，把无法解释理解成自己确实不值得原谅，于是主动承认是骗子并离开。一个等待对方先挽留，一个等待对方先原谅，两个人都没有说出真正想说的话。苏文纨制造了破裂条件，唐晓芙的理想要求和方鸿渐的逃避性格最终把关系推到无法挽回。由此，后段把责任从单一第三者扩展为挑拨、理想主义和性格沟通共同作用的结果。","link":"后段把责任从单一第三者扩展为挑拨、理想主义和性格沟通共同作用的结果。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第四章","searchPhrase":"我没有借口，我无法解释","pdfPage":"待核","stage":"后","chain":{"who":"唐晓芙","action":"唐晓芙等待辩护，方鸿渐却以沉默和自我否定回应，两人共同锁定分手结局。","reason":"唐晓芙内心希望方鸿渐辩护，外表却用连续盘问和决绝语气逼他立刻给出答案","consequence":"后段把责任从单一第三者扩展为挑拨、理想主义和性格沟通共同作用的结果。"}}],"traps":["把分手全部归因于苏文纨挑拨，忽略唐晓芙和方鸿渐自身的作用。","只写唐晓芙被骗，不分析她的爱情理想如何放大了挑拨效果。","只写方鸿渐软弱，不区分他在沉默背后的羞愧、敬爱和害怕失去。"]},{"id":"saffi-character","work":"《莎菲女士的日记》","workKey":"saffi","type":"人物形象","title":"莎菲的主体性矛盾","prompt":"分析莎菲女士的性格矛盾及其思想意义。","keywords":["莎菲","矛盾","灵肉冲突","觉醒","孤独","女性"],"thesis":"莎菲的矛盾体现五四新一代知识女性在身体欲望、精神道德、自我尊严与父权现实之间形成的主体性冲突，远超一般性格反复。","points":[{"point":"她的孤独来自主体觉醒后缺乏能够承载新女性的社会关系和共同体。","evidence":"“我总愿意有那么一个人能了解得我清清楚楚的。”","location":"莎菲与亲友、爱人相处时反复出现的失望和独处。","explain":"亲友的照料只触及生活层面，无法回应人物对深度理解的要求；爱情对象也缺少相称的精神能力。周围关系越密集，她越感到没有人能够真正进入自己的内心，孤独因而来自社会关系无法承接新的自我意识，不只来自个人性格。由此，矛盾形象由此通向五四新女性的结构性困境。","link":"矛盾形象由此通向五四新女性的结构性困境。","page":"P40","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"前","chain":{"who":"莎菲","action":"她的孤独来自主体觉醒后缺乏能够承载新女性的社会关系和共同体。","reason":"亲友的照料只触及生活层面，无法回应人物对深度理解的要求","consequence":"矛盾形象由此通向五四新女性的结构性困境。"}},{"point":"她以精神契合和人格尊严为最高标准，拒绝让肉体欲望凌驾于道德判断。","evidence":"“当我明白了那使我爱慕的一个高贵的美形里，是安置着如此一个卑劣灵魂。”","location":"莎菲看清凌吉士真实面目后的心理转折。","explain":"外貌带来的吸引与人格判断发生冲突时，人物没有停在感官迷恋中。她对爱情对象的要求包含精神品质和人格尊严，因此仍会受吸引，却能重新收回感情。这一选择把私人恋爱提升为价值判断，显示新知识女性开始决定何种关系值得进入，也拒绝让身体欲望取代道德主体。由此，她的拒绝因此是一次主体判断，同时也结束了一段无法继续的恋爱关系。","link":"她的拒绝因此是一次主体判断，同时也结束了一段无法继续的恋爱关系。","page":"P58","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"莎菲","action":"她以精神契合和人格尊严为最高标准，拒绝让肉体欲望凌驾于道德判断。","reason":"外貌带来的吸引与人格判断发生冲突时，人物没有停在感官迷恋中","consequence":"她的拒绝因此是一次主体判断，同时也结束了一段无法继续的恋爱关系。"}},{"point":"莎菲敢于承认欲望，开始以女性自身感受确认主体存在。","evidence":"“我压制住我那狂热的欲念，我未曾请求他多留一会儿。”","location":"莎菲认识凌吉士后，反复书写情感与欲望的日记段落。","explain":"这一心理瞬间把人物感受与自我约束同时呈现出来。她承认身体经验的存在，却在外部规范和自尊压力下收回行动，由此形成既渴望自主又不断自我审判的心理结构。莎菲的主体意识正是在这种张力中显现，她不再完全接受被规定的女性角色，也尚未获得无负担的自由。由此，欲望的觉醒因此成为理解莎菲全部矛盾的前提。","link":"欲望的觉醒因此成为理解莎菲全部矛盾的前提。","page":"P61","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"莎菲","action":"莎菲敢于承认欲望，开始以女性自身感受确认主体存在。","reason":"这一心理瞬间把人物感受与自我约束同时呈现出来","consequence":"欲望的觉醒因此成为理解莎菲全部矛盾的前提。"}}],"traps":["把莎菲的矛盾只解释为摇摆不定的性格。","只写灵肉冲突，不说明她为何拒绝凌吉士以及这一拒绝的道德意义。"]},{"id":"saffi-awakening","work":"《莎菲女士的日记》","workKey":"saffi","type":"主题思想","title":"觉醒后的困境","prompt":"结合文本，谈谈莎菲的觉醒与困境。","keywords":["觉醒","困境","五四","新女性","自由","现实"],"thesis":"莎菲的觉醒让她看清传统束缚，却也让她陷入无路可走的现实困境。","points":[{"point":"病中独居和单调等待构成莎菲觉醒前的现实处境。","evidence":"“我每天都在等着，挨着，只想这冬天快点过去”","location":"前三则日记：莎菲独居北京、久病未愈，每天煨牛奶、读报来消磨时间。","explain":"等待和重复生活把人物困在狭窄空间里，疾病又不断提醒她身体和未来的不确定。这样的处境使莎菲急于寻找爱情和理解，也使她日后获得新意识时缺少稳定的现实基础。由此，觉醒之前的孤寂和病痛，成为全文困境的起点。","link":"觉醒之前的孤寂和病痛，成为全文困境的起点。","page":"待核","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"前","chain":{"who":"莎菲","action":"病中独居和单调等待构成莎菲觉醒前的现实处境。","reason":"这样的处境使莎菲急于寻找爱情和理解，也使她日后获得新意识时缺少稳定的现实基础","consequence":"觉醒之前的孤寂和病痛，成为全文困境的起点。"}},{"point":"莎菲在爱情和身体问题上已经质疑旧式女性规范。","evidence":"“一个女人这样放肆，是不会得到好结果的。”","location":"莎菲与凌吉士交往阶段的日记，重点看人物对这句话的反复反思。","explain":"莎菲把这句社会评价写进日记，说明她清楚外界如何用“好结果”约束女性的身体和情感。她能够识别这种规训，也会因此犹疑，旧规范已经失去天然正当性，却仍在现实中有效。由此，新意识与旧评价的冲突，使觉醒无法带来稳定自由。","link":"新意识与旧评价的冲突，使觉醒无法带来稳定自由。","page":"P45","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"莎菲","action":"莎菲在爱情和身体问题上已经质疑旧式女性规范。","reason":"莎菲把这句社会评价写进日记，说明她清楚外界如何用“好结果”约束女性的身体和情感","consequence":"新意识与旧评价的冲突，使觉醒无法带来稳定自由。"}},{"point":"离开北京的选择说明觉醒后的莎菲仍找不到新的社会位置。","evidence":"“我又将一人寂寂寞寞地离开这古城了。”","location":"小说结尾：莎菲擦去泪痕，决定独自离城。","explain":"离开使她摆脱旧关系和屈辱，却只能以独自远行结束，无法建立新的生活和共同体。人物保住了自我判断，现实条件没有为她提供新的位置，觉醒因此同时表现为清醒和无路可走。由此，结尾把个人困境推到社会结构层面，回扣“觉醒与困境并存”。","link":"结尾把个人困境推到社会结构层面，回扣“觉醒与困境并存”。","page":"待核","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"莎菲","action":"离开北京的选择说明觉醒后的莎菲仍找不到新的社会位置。","reason":"离开使她摆脱旧关系和屈辱，却只能以独自远行结束，无法建立新的生活和共同体","consequence":"结尾把个人困境推到社会结构层面，回扣“觉醒与困境并存”。"}}],"traps":["把觉醒写成彻底解放，忽略觉醒后仍处于困境。","只谈五四背景，不引用莎菲的具体心理和行为。"]},{"id":"saffi-psychology","work":"《莎菲女士的日记》","workKey":"saffi","type":"艺术手法","title":"心理描写的作用","prompt":"分析《莎菲女士的日记》中心理描写的作用。","keywords":["心理描写","日记体","内心","手法","作用","独白"],"thesis":"丁玲用日记体心理描写把莎菲的欲望、羞耻、清醒与孤独直接呈现在读者面前，使人物矛盾具有真实的心理层次。","points":[{"point":"心理描写同时承担揭示主题的功能。","evidence":"“我总愿意有那么一个人能了解得我清清楚楚的。”","location":"莎菲与亲友、爱人相处时反复出现的失望和独处。","explain":"私人书写同时制造坦诚与隔膜。人物愿意把内心留下，却又意识到任何表达都无法完整呈现自我，于是读者看到她不断解释自己，却始终没有得到真正回应。第一人称因此把心理真实和无法沟通的孤独放进同一个形式中。由此，心理描写由此承担揭示时代困境的功能。","link":"心理描写由此承担揭示时代困境的功能。","page":"P40","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"前","chain":{"who":"作者与叙事者","action":"心理描写同时承担揭示主题的功能。","reason":"人物愿意把内心留下，却又意识到任何表达都无法完整呈现自我，于是读者看到她不断解释自己，却始终没有得到真正回应","consequence":"心理描写由此承担揭示时代困境的功能。"}},{"point":"心理描写把抽象的灵肉冲突变成可读的情绪过程。","evidence":"“我恨不得用脚尖踢出他去，不过我又为了另一种情绪所支配，我向他摇了头，表示是不厌烦他的来到。”","location":"莎菲与凌吉士关系变化前后的反复书写。","explain":"同一瞬间容纳两种相反行动：怒火要求拒绝，另一股力量又迫使她掩饰。人物的决定先于清晰认识发生，身体、尊严和欲望同时拉扯，读者因此能够追踪内心冲突怎样转化为具体表情和动作，抽象的人性矛盾获得了过程感。","link":"手法分析要说明效果，不能只报“心理描写”这个术语。","page":"P61","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"作者与叙事者","action":"心理描写把抽象的灵肉冲突变成可读的情绪过程。","reason":"同一瞬间容纳两种相反行动：怒火要求拒绝，另一股力量又迫使她掩饰","consequence":"人物的决定先于清晰认识发生，身体、尊严和欲望同时拉扯，读者因此能够追踪内心冲突怎样转化为具体表情和动作，抽象的人性矛盾获得了过程感"}},{"point":"日记体让人物可以不断暴露真实想法。","evidence":"“我每天都在等着，挨着，只想这冬天快点过去”","location":"前三则日记：莎菲独居北京、久病未愈，以煨牛奶和读报消磨时间。","explain":"日记直接写出人物如何等待冬天过去，也让她不必在他人面前维持体面。读者由此进入莎菲漫长、封闭而敏感的日常生活，第一人称私人书写因此成为暴露真实精神状态的形式。由此，前段生活记录建立日记体的真实感和内心暴露功能。","link":"前段生活记录建立日记体的真实感和内心暴露功能。","page":"待核","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"作者与叙事者","action":"日记体让人物可以不断暴露真实想法。","reason":"日记直接写出人物如何等待冬天过去，也让她不必在他人面前维持体面","consequence":"前段生活记录建立日记体的真实感和内心暴露功能。"}}],"traps":["只写“大量心理描写”，没有分析具体心理变化。","引用后不解释，直接下“人物很矛盾”的结论。"]},{"id":"saffi-love","work":"《莎菲女士的日记》","workKey":"saffi","type":"人物关系","title":"精神标准与世俗人格的冲突","prompt":"分析莎菲对凌吉士由倾慕转为鄙弃的原因及其思想意义。","keywords":["凌吉士","爱情","迷恋","厌恶","欲望","选择"],"thesis":"莎菲对凌吉士的否定体现新知识女性以精神契合、人格独立和道德自持为标准，抗拒以金钱、肉欲和自我享受为核心的世俗人格，意义已经超出普通爱情幻灭。","points":[{"point":"莎菲主动凝视并承认欲望，体现女性作为欲望主体的觉醒。","evidence":"“颀长的身躯，白嫩的面庞，薄薄的小嘴唇，柔软的头发。”","location":"莎菲初次接触并观察凌吉士的日记段落。","explain":"男性身体进入女性人物的观察范围，叙述位置随之改变。人物主动感受、选择和评价对方，不再只是被观看或被挑选的对象，欲望经验因此获得主体性。这一转变是新女性意识的重要部分，但它仍以恋爱关系为出口。由此，欲望主体性的获得，为后文她拒绝凌吉士提供了精神前提。","link":"欲望主体性的获得，为后文她拒绝凌吉士提供了精神前提。","page":"P43","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"前","chain":{"who":"莎菲","action":"莎菲主动凝视并承认欲望，体现女性作为欲望主体的觉醒。","reason":"男性身体进入女性人物的观察范围，叙述位置随之改变","consequence":"欲望主体性的获得，为后文她拒绝凌吉士提供了精神前提。"}},{"point":"凌吉士的卑劣在于把金钱、肉欲和自我享受当作人生目的，莎菲以精神契合和道德自持否定这种世俗人格。","evidence":"“当我明白了那使我爱慕的一个高贵的美形里，是安置着如此一个卑劣灵魂。”","location":"莎菲认清凌吉士真实面目后的心理转折。","explain":"外在吸引与内在人格发生剧烈冲突后，人物重新行使判断权。她仍承认欲望存在，却拒绝接受以金钱、肉欲和自我享乐为中心的人生态度，恋爱问题因此上升为道德和价值选择，女性的精神标准不再由男性或礼教代替制定。由此，这场拒绝把恋爱问题提升为知识女性的人格选择。","link":"这场拒绝把恋爱问题提升为知识女性的人格选择。","page":"P58","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"莎菲","action":"凌吉士的卑劣在于把金钱、肉欲和自我享受当作人生目的，莎菲以精神契合和道德自持否定这种世俗人格。","reason":"外在吸引与内在人格发生剧烈冲突后，人物重新行使判断权","consequence":"这场拒绝把恋爱问题提升为知识女性的人格选择。"}},{"point":"拒绝凌吉士和离开北京使莎菲守住人格，却没有解决现实孤独。","evidence":"“我又将一人寂寂寞寞地离开这古城了。”","location":"小说结尾：莎菲拒绝凌吉士后决定独自离开北京。","explain":"莎菲没有为了欲望重新接受一个精神上无法认同的人，离开因此保存了道德和人格边界。可是她仍然只能一个人承受失落，新的爱情理想和生活共同体都没有出现，胜利与孤独同时存在。由此，人物关系题最终回扣新女性缺少社会支持的结构性处境。","link":"人物关系题最终回扣新女性缺少社会支持的结构性处境。","page":"待核","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"莎菲","action":"拒绝凌吉士和离开北京使莎菲守住人格，却没有解决现实孤独。","reason":"莎菲没有为了欲望重新接受一个精神上无法认同的人，离开因此保存了道德和人格边界","consequence":"人物关系题最终回扣新女性缺少社会支持的结构性处境。"}}],"traps":["只把关系变化写成恋爱失败或“从爱到恨”。","只写灵肉冲突，不解释凌吉士的世俗人格和莎菲的道德标准。"]},{"id":"water-symbol","work":"《水》","workKey":"water","type":"意象象征","title":"水的多重象征","prompt":"分析《水》中“水”的象征意义。","keywords":["水","象征","洪水","灾难","压迫","反抗"],"thesis":"水既是自然灾害，也是社会压迫和群众力量的象征，丁玲借水的形态变化写出灾民的苦难与觉醒。","points":[{"point":"水首先表现为不可控制的自然灾害。","evidence":"“愁惨的天照着黄色的滔滔的大水，那一夜淹了汤家阙，又淹了一渡口的一片汪洋的大水。”","location":"第一部分开头：洪水逼近汤家阙、一渡口时的全景描写，重点找颜色、声音和吞没村庄的动词。","explain":"色彩、规模和破坏结果被连成整体，灾害因此具有压倒性的力量。它先摧毁生活空间，又把底层推入饥饿和流离失所，作品由此从生存危机进入社会观察，水的第一层意义是超出个人控制的自然暴力。由此，但水的意义没有停留在自然灾害上。","link":"但水的意义没有停留在自然灾害上。","page":"P226","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"前","chain":{"who":"小说中的“水”","action":"水首先表现为不可控制的自然灾害。","reason":"由此，但水的意义没有停留在自然灾害上","consequence":"但水的意义没有停留在自然灾害上。"}},{"point":"水又象征官僚压迫下不断加剧的社会危机。","evidence":"“帆船却又带来了一些军火，并没有带救济米。”","location":"第二部分：灾民等待救济，帆船靠岸后发现运来军火而非米粮；重点找镇长和官员的话语与物资对比。","explain":"两种物资同船出现，权力机构在灾民最需要救助时的选择被直接暴露。水灾因此获得社会属性，自然灾害同时成为官僚控制和阶级压迫的现场，象征意义从环境描写推进到制度批判。由此，这层象征把自然灾害推向社会批判。","link":"这层象征把自然灾害推向社会批判。","page":"P231","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"小说中的“水”","action":"水又象征官僚压迫下不断加剧的社会危机。","reason":"两种物资同船出现，权力机构在灾民最需要救助时的选择被直接暴露","consequence":"这层象征把自然灾害推向社会批判。"}},{"point":"水最终转化为群众觉醒和反抗的力量。","evidence":"“比水还凶猛的，朝镇上扑了过去。”","location":"第四部分结尾：灾民冲向长岭岗粮仓，裸身汉子带头行动；重点找“比水还凶猛”与前文洪水描写的呼应。","explain":"结尾把洪水的破坏力转写为人群的行动力。原本被迫承受灾难的底层开始冲击既有秩序，力量方向的改变完成意象反转，也把作品主题从苦难记录推向集体反抗。","link":"结论必须写成多重象征，不能只写“水代表灾难”。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"群众","action":"水最终转化为群众觉醒和反抗的力量。","reason":"结尾把洪水的破坏力转写为人群的行动力","consequence":"原本被迫承受灾难的底层开始冲击既有秩序，力量方向的改变完成意象反转，也把作品主题从苦难记录推向集体反抗"}}],"traps":["只写水是自然灾害，忽略社会压迫和群众力量。","象征分析只有结论，没有引文和情节定位。"]},{"id":"water-change","work":"《水》","workKey":"water","type":"主题思想","title":"从灾难到抗争","prompt":"结合文本，分析《水》中灾民由恐惧到反抗的变化。","keywords":["灾民","求神","官府","压迫","绝望","阶级意识","集体反抗"],"thesis":"《水》通过灾民从求神等待、受压绝望到集体反抗的过程，写出底层群众在现实教育中逐渐形成阶级意识。","points":[{"point":"灾难初期，群众承受死亡和流离，也把获救希望交给神佛。","evidence":"“求老天爷保护，保护呀，地藏王菩萨，龙王菩萨”","location":"第一部分：洪水逼近一渡口，人群跪地呼救。","explain":"群众先是灾难的直接承受者，又把无法控制的自然力量交给神佛处理。祈祷没有阻止堤岸崩溃，生存危机却不断加深，作品由此建立旧信仰与现实灾难之间的落差。由此，前段的信仰和等待为后文希望破灭提供起点。","link":"前段的信仰和等待为后文希望破灭提供起点。","page":"P226","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"前","chain":{"who":"群众","action":"灾难初期，群众承受死亡和流离，也把获救希望交给神佛。","reason":"群众先是灾难的直接承受者，又把无法控制的自然力量交给神佛处理","consequence":"前段的信仰和等待为后文希望破灭提供起点。"}},{"point":"官员克扣、军队威胁和救济落空使灾民由期待转向愤怒与绝望。","evidence":"“动不动天灾，菩萨发气，就真是菩萨发气，可不应该发我们的气！为什么他们那些拿了钱不管事，刮尽了地皮，成年打仗杀人的人又不倒霉呢？”","location":"中段：赈灾迟迟不至，军火和士兵进入长岭岗，饥民开始对官府解释和命运说法提出质疑。","explain":"群众把神意解释重新落到掌握权力和财富的人身上，开始意识到灾难后果由普通农民承担，官员和地主却继续获利。质疑虽已出现，群众仍被饥饿、军队和冲突的意见牵制，这段愤怒因此带有绝望色彩。由此，怀疑旧解释以后，群众需要一个新的行动方向。","link":"怀疑旧解释以后，群众需要一个新的行动方向。","page":"待核","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"灾民","action":"官员克扣、军队威胁和救济落空使灾民由期待转向愤怒与绝望。","reason":"由此，怀疑旧解释以后，群众需要一个新的行动方向","consequence":"怀疑旧解释以后，群众需要一个新的行动方向。"}},{"point":"裸身汉子指出受害的根源，带领群众从求生行动转为集体反抗。","evidence":"“他们吃的什么？吃的我们力气和精血呀！”“比水还凶猛的，朝镇上扑过去。”","location":"结尾长岭岗：裸身汉子揭露统治阶级依靠农民劳动生活，群众随后集体冲向镇上。","explain":"裸身汉子把贫穷和饥饿从个人命运改成阶级剥削，群众由此明白等待无法改变处境。集体冲向镇上意味着抗争目标从寻找救济转向夺回劳动成果，小说的主题也从灾难苦难推进到阶级觉醒。由此，群众形象的变化因此同时完成情节高潮和主题升华。","link":"群众形象的变化因此同时完成情节高潮和主题升华。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"裸身汉子","action":"裸身汉子指出受害的根源，带领群众从求生行动转为集体反抗。","reason":"裸身汉子把贫穷和饥饿从个人命运改成阶级剥削，群众由此明白等待无法改变处境","consequence":"群众形象的变化因此同时完成情节高潮和主题升华。"}}],"traps":["把灾民的变化写成突然觉醒，忽略求神、等待、受骗和绝望的中间过程。","只写官员冷漠，不写这种冷漠如何改变群众对官府和神佛的态度。","把结尾反抗写成单纯求生，忽略夺回劳动成果的阶级意义。"]},{"id":"water-hero","work":"《水》","workKey":"water","type":"人物形象","title":"裸身汉子与群众形象","prompt":"分析《水》中裸身汉子或群众形象。","keywords":["裸身汉子","群众形象","神佛","官府","绝望","阶级觉醒","集体反抗"],"thesis":"《水》中的群众形象经历了从信仰和等待外部救援，到遭受压迫后陷入绝望，再到接受真相并集体反抗的变化。裸身汉子既是这一变化的说破者，也是把分散饥民组织起来的人。","points":[{"point":"灾难初期，群众直接承受死亡和流离，并把获救希望交给神佛。","evidence":"“求老天爷保护，保护呀，地藏王菩萨，龙王菩萨”","location":"第一部分：洪水逼近一渡口，人群跪地呼救。","explain":"祈祷是灾民面对不可控水势时唯一能够采取的行动，却没有阻止洪水冲毁家园。他们既是灾难的直接受害者，也把生存希望寄托在超越自身的力量上，这种被动等待成为后文觉醒的起点。由此，前段的信仰和等待为官府失信后的幻灭埋下伏笔。","link":"前段的信仰和等待为官府失信后的幻灭埋下伏笔。","page":"P226","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"前","chain":{"who":"群众","action":"灾难初期，群众直接承受死亡和流离，并把获救希望交给神佛。","reason":"祈祷是灾民面对不可控水势时唯一能够采取的行动，却没有阻止洪水冲毁家园","consequence":"前段的信仰和等待为官府失信后的幻灭埋下伏笔。"}},{"point":"统治阶级的欺骗、威胁和拖延让群众逐渐绝望，等待救济的幻想被现实摧毁。","evidence":"“他们曾经被一些告示，被一些甜蜜的话，被一些希望，被一些和着糠的树叶安慰过的。现在呢，他们了解了，了解的是无希望。”","location":"中段长岭岗：官府用告示、口头承诺和少量粮食安抚灾民，同时派兵维持秩序，救济迟迟不到。","explain":"告示、许诺和极少的食物曾经维持群众的幻想，现实中的饥饿和死亡却不断加深。群众的绝望经过一次次等待、受骗和失望逐渐形成，他们也由此认清官方救助的限度，这种共同经验为接受新的解释准备了心理条件。由此，绝望切断了对旧秩序的信任，也使真正可行的行动方案有了出现的必要。","link":"绝望切断了对旧秩序的信任，也使真正可行的行动方案有了出现的必要。","page":"待核","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"群众","action":"统治阶级的欺骗、威胁和拖延让群众逐渐绝望，等待救济的幻想被现实摧毁。","reason":"告示、许诺和极少的食物曾经维持群众的幻想，现实中的饥饿和死亡却不断加深","consequence":"绝望切断了对旧秩序的信任，也使真正可行的行动方案有了出现的必要。"}},{"point":"裸身汉子揭穿官府和地主依靠农民劳动获利的事实，推动群众从等待救援转向集体反抗。","evidence":"“还打算有人来救我们？哼！等着吧，把肠子也饿了出来，你看有不有米会送来？”“比水还凶猛的，朝镇上扑过去。”","location":"结尾长岭岗：裸身汉子在树上向群众揭露剥削关系，随后带领饥民冲向镇上。","explain":"裸身汉子把救济、命运和天灾等说法重新解释为统治阶级维持控制的工具，并指出财富来自农民劳动。群众接受这种解释后，求生目标从等待施舍变成夺回自己的劳动成果，集体行动因此拥有共同理由。结尾把水的破坏力转写成人群的行动力，说明觉醒已经转化为组织化反抗。由此，裸身汉子的作用落在说破真相和组织群众，不宜写成孤立的个人英雄。","link":"裸身汉子的作用落在说破真相和组织群众，不宜写成孤立的个人英雄。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"裸身汉子","action":"裸身汉子揭穿官府和地主依靠农民劳动获利的事实，推动群众从等待救援转向集体反抗。","reason":"裸身汉子把救济、命运和天灾等说法重新解释为统治阶级维持控制的工具，并指出财富来自农民劳动","consequence":"裸身汉子的作用落在说破真相和组织群众，不宜写成孤立的个人英雄。"}}],"traps":["把群众写成一开始就觉醒，跳过求神和等待官府救助的阶段。","只写群众受苦，不写官府欺骗和压迫如何使等待转化为绝望。","把裸身汉子写成孤胆英雄，忽略他表达的是众人的共同经验。"]},{"id":"water-theme","work":"《水》","workKey":"water","type":"主题思想","title":"灾难与社会批判","prompt":"分析《水》的主题思想。","keywords":["主题","灾难","社会批判","阶级","群众","觉醒"],"thesis":"《水》以洪水灾难为表层事件，揭示官僚压迫下底层群众的苦难、觉醒与反抗。","points":[{"point":"作品首先呈现自然灾害带来的生存危机。","evidence":"“愁惨的天照着黄色的滔滔的大水，那一夜淹了汤家阙，又淹了一渡口的一片汪洋的大水。”","location":"第一部分开头：洪水毁坏村庄和田地的全景描写，先建立自然灾害的生存危机。","explain":"具体生活空间被灾难吞没，作品把注意力放在村庄、田地和家庭的毁坏上。灾害成为观察底层贫困与社会脆弱性的起点，主题从自然危机展开。由此，作品并未把灾难只当作自然现象。","link":"作品并未把灾难只当作自然现象。","page":"P226","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"前","chain":{"who":"灾民群众","action":"作品首先呈现自然灾害带来的生存危机。","reason":"具体生活空间被灾难吞没，作品把注意力放在村庄、田地和家庭的毁坏上","consequence":"作品并未把灾难只当作自然现象。"}},{"point":"官僚不作为把自然灾害推向社会悲剧。","evidence":"“帆船却又带来了一些军火，并没有带救济米。”","location":"第二至三部分：官员处理灾情、灾民求助受阻，帆船运来军火而非米粮。","explain":"权力机构在救灾时刻选择的物资方向，直接揭开天灾背后的人为因素。批判对象由洪水转向制度，作品的社会悲剧性质因此确立。由此，社会压迫进一步推动群众态度变化。","link":"社会压迫进一步推动群众态度变化。","page":"P231","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"灾民群众","action":"官僚不作为把自然灾害推向社会悲剧。","reason":"权力机构在救灾时刻选择的物资方向，直接揭开天灾背后的人为因素","consequence":"社会压迫进一步推动群众态度变化。"}},{"point":"群众觉醒和反抗是作品的主题方向。","evidence":"“比水还凶猛的，朝镇上扑了过去。”","location":"第四部分结尾：群众冲向粮仓并反抗官府与地主，观察主题如何由苦难推进到斗争。","explain":"底层从被动承受转为主动冲击，叙述也由揭露苦难走向想象变革。反抗成为小说的主题方向，并承担连接现实批判与革命叙事的任务。","link":"结论应同时覆盖灾难、批判和觉醒三层。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"群众","action":"群众觉醒和反抗是作品的主题方向。","reason":"底层从被动承受转为主动冲击，叙述也由揭露苦难走向想象变革","consequence":"反抗成为小说的主题方向，并承担连接现实批判与革命叙事的任务"}}],"traps":["只写灾难主题，删掉社会批判和群众觉醒。","只写主题判断，不回到情节和人物。"]},{"id":"hospital-luping","work":"《在医院中》","workKey":"hospital","type":"人物形象","title":"陆萍的多重主体与理想锋芒","prompt":"分析陆萍的人物形象及其复杂性。","keywords":["陆萍","性格","理想","批判","善良","坚持"],"thesis":"陆萍兼具新女性、现代医学知识者和共产党员三重身份；她以专业责任和革命理想进入医院，又在现实冲突中显出敏感、热烈、缺乏世故和强烈的批判精神。","points":[{"point":"陆萍把生活管理和医疗改善当成自己的职责，并因此不断与旧工作方式发生冲突。","evidence":"“她常常为了他们的生活管理，和医疗的改善与很多人发生冲突。”","location":"第一部分：陆萍到院后，从生活和医疗管理入手提出改进意见。","explain":"她把病人的日常需要和医疗质量视为自己的职责，因此不会为了维持人情而放弃意见。现代医学标准与医院旧习惯在这里正面碰撞，陆萍的行动锋芒和现实冲突由此同时出现。由此，前段的职责意识与旧环境的冲突，成为人物后续受挫的起点。","link":"前段的职责意识与旧环境的冲突，成为人物后续受挫的起点。","page":"P387","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"前","chain":{"who":"陆萍","action":"陆萍把生活管理和医疗改善当成自己的职责，并因此不断与旧工作方式发生冲突。","reason":"她把病人的日常需要和医疗质量视为自己的职责，因此不会为了维持人情而放弃意见","consequence":"前段的职责意识与旧环境的冲突，成为人物后续受挫的起点。"}},{"point":"她把医疗理想落实为护理、换药和照顾产妇的具体劳动。","evidence":"“为了不愿病人产妇多受苦痛，便自己去替几个开刀了的，发炎的换药。”","location":"第二部分：陆萍主动承担护理工作，照顾病人和产妇。","explain":"责任感落在身体劳累和具体病痛上，理想因此获得具体实践。她越深入医疗现场，越能看见制度、技术和人员问题，人物形象也获得专业能力与情感关怀的双重基础。由此，中段的劳动经验为她后来批判医院提供事实依据。","link":"中段的劳动经验为她后来批判医院提供事实依据。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"陆萍与医院环境","action":"她把医疗理想落实为护理、换药和照顾产妇的具体劳动。","reason":"责任感落在身体劳累和具体病痛上，理想因此获得具体实践","consequence":"中段的劳动经验为她后来批判医院提供事实依据。"}},{"point":"受挫之后她仍继续为病人争取资源，理想转化为持续实践。","evidence":"“她仍然是那样兴致很浓厚的去照顾着那些产妇，那些婴儿，为着她们一点点的需索，去同管理员，总务处，秘书长，甚至院长去争执。”","location":"第三至四部分：中毒事件后，陆萍继续照顾产妇和婴儿，并与管理者交涉。","explain":"人物在失望之后没有离开医疗责任，关怀被落实为反复交涉和长期承担。理想锋芒因此从冲动转入韧性，她也从单纯批评者成长为能够面对现实复杂性的实践者。由此，后段行动完成人物从热情到坚韧的转化。","link":"后段行动完成人物从热情到坚韧的转化。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"陆萍与医院环境","action":"受挫之后她仍继续为病人争取资源，理想转化为持续实践。","reason":"人物在失望之后没有离开医疗责任，关怀被落实为反复交涉和长期承担","consequence":"后段行动完成人物从热情到坚韧的转化。"}}],"traps":["把陆萍写成毫无缺点、永远正确的英雄。","只写她受委屈，不分析她的专业责任、批判精神和理想锋芒。"]},{"id":"hospital-growth","work":"《在医院中》","workKey":"hospital","type":"主题思想","title":"愤怒、反思与未完成的成长","prompt":"分析陆萍在医院中的受挫、反思与成长。","keywords":["成长","变化","转折","老兵","挫折","理想"],"thesis":"陆萍敏感、热情、重感情，也把革命集体想象成彼此关爱的共同体。中毒事件让她亲眼看到同志间缺少基本关心，理想因此受创；她由愤怒、动摇和反思逐渐走向继续学习与实践。","points":[{"point":"陆萍的成长起点是她对病人和产妇痛苦的敏锐感受，以及愿意亲自承担护理工作的行动。","evidence":"“为了不愿病人产妇多受苦痛，便自己去替几个开刀了的，发炎的换药。”","location":"第二部分：陆萍主动替开刀和发炎的病人换药，照顾病人与产妇。","explain":"她不仅对病痛敏感，也愿意用换药和护理等具体劳动回应。这种责任感让成长拥有真实行动基础，也使她很快看见医疗条件和管理中的问题。由此，前段的具体劳动为后文改革受挫和反思提供经验。","link":"前段的具体劳动为后文改革受挫和反思提供经验。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"前","chain":{"who":"陆萍","action":"陆萍的成长起点是她对病人和产妇痛苦的敏锐感受，以及愿意亲自承担护理工作的行动。","reason":"她不仅对病痛敏感，也愿意用换药和护理等具体劳动回应","consequence":"前段的具体劳动为后文改革受挫和反思提供经验。"}},{"point":"医院的标签化批评迫使陆萍重新认识个人英雄主义的局限。","evidence":"“小资产阶级意识、知识分子的英雄主义、自由主义等等的帽子都往她头上戴。”","location":"第二至三部分：陆萍提出意见、发生冲突后被贴上多重身份标签。","explain":"标签把医疗管理问题转成个人立场问题，她因此承受误解，也开始发现仅凭热情无法改变机构。外部批评带有粗暴成分，却推动她思考群众、策略和长期实践。由此，中段冲突把成长从情绪受挫推进到自我认识。","link":"中段冲突把成长从情绪受挫推进到自我认识。","page":"P394","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"陆萍","action":"医院的标签化批评迫使陆萍重新认识个人英雄主义的局限。","reason":"标签把医疗管理问题转成个人立场问题，她因此承受误解，也开始发现仅凭热情无法改变机构","consequence":"中段冲突把成长从情绪受挫推进到自我认识。"}},{"point":"陆萍经过毒气中毒和集体冷漠后选择继续成长。","evidence":"“新的生活虽要开始，然而还有新的荆棘。人是要经过千锤百炼而不消溶才能真真有用。人是在艰苦中成长。”","location":"第四部分：中毒事件后，陆萍反思医院、革命工作和个人选择。","explain":"结尾承认理想实现必然伴随困难，也要求人物在现实中保持自我而不被环境消磨。陆萍没有停止行动，她接受成长需要长期实践，人物因此获得开放而未完成的成熟。由此，后段把受挫转化为继续承担，回扣未完成的成长主题。","link":"后段把受挫转化为继续承担，回扣未完成的成长主题。","page":"P393","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"陆萍","action":"陆萍经过毒气中毒和集体冷漠后选择继续成长。","reason":"陆萍没有停止行动，她接受成长需要长期实践，人物因此获得开放而未完成的成熟","consequence":"后段把受挫转化为继续承担，回扣未完成的成长主题。"}}],"traps":["只写中毒事件暴露制度问题，忽略它对陆萍性格和情感信念的打击。","把成长理解成陆萍被环境彻底驯服。","只写结尾振作，不分析中间的愤怒、动摇和反思。"]},{"id":"hospital-environment","work":"《在医院中》","workKey":"hospital","type":"艺术手法","title":"环境描写的作用","prompt":"分析《在医院中》环境描写的作用。","keywords":["环境描写","医院","寒冷","混乱","气氛","作用"],"thesis":"医院环境既是人物活动的现实空间，也映照出革命理想与落后现实之间的冲突。","points":[{"point":"寒冷和简陋写出陆萍进入医院时的自然与物质条件。","evidence":"“窗户外无声地飘着雪片。”","location":"第一部分：陆萍初到陕北山沟医院，窗外雪景与室内简陋形成整体环境。","explain":"安静雪景营造封闭和寒冷气氛，也预示医疗条件的艰苦。自然环境的压抑与人物初到时的身体感受相连，为后续每一次奔波增加现实重量。由此，前段环境先建立医院生活的基本困难。","link":"前段环境先建立医院生活的基本困难。","page":"P390","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"前","chain":{"who":"陆萍","action":"寒冷和简陋写出陆萍进入医院时的自然与物质条件。","reason":"安静雪景营造封闭和寒冷气氛，也预示医疗条件的艰苦","consequence":"前段环境先建立医院生活的基本困难。"}},{"point":"基本医疗和生活需要难以满足，暴露医院管理的混乱。","evidence":"“她替她们要清洁的被袄，暖和的住室，滋补的营养，有次序的生活。”","location":"第二至三部分：陆萍为病人和产妇争取日常生活与医疗条件。","explain":"她争取的都是最基本的需要，却要反复交涉才能获得，说明问题来自长期管理和责任缺失。环境描写因此直接落在病人身体和日常处境中，承担社会批判功能。由此，中段环境把制度问题具体化为病人的现实困难。","link":"中段环境把制度问题具体化为病人的现实困难。","page":"P387","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"陆萍与医院环境","action":"基本医疗和生活需要难以满足，暴露医院管理的混乱。","reason":"她争取的都是最基本的需要，却要反复交涉才能获得，说明问题来自长期管理和责任缺失","consequence":"中段环境把制度问题具体化为病人的现实困难。"}},{"point":"事故后的群体注视把环境压力转成人物持续承受的孤独。","evidence":"“她已经成为医院里小小的怪人，被大多数人用异样的眼睛看着。”","location":"第三至四部分：中毒事件后，陆萍继续与医院旧习惯发生冲突。","explain":"异样目光把环境冷漠具体化为群体排斥，坚持专业标准的人反而被当作异类。环境由此参与人物孤立和成长，医院空间、群像关系与主题冲突连成一体。由此，后段环境压力把改革困境推进到组织文化层面。","link":"后段环境压力把改革困境推进到组织文化层面。","page":"P387","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"陆萍与医院环境","action":"事故后的群体注视把环境压力转成人物持续承受的孤独。","reason":"异样目光把环境冷漠具体化为群体排斥，坚持专业标准的人反而被当作异类","consequence":"后段环境压力把改革困境推进到组织文化层面。"}}],"traps":["只摘抄环境，不解释环境与人物的关系。","只写寒冷，忽略医院制度和人际环境。"]},{"id":"hospital-intellectual","work":"《在医院中》","workKey":"hospital","type":"人物关系","title":"知识分子与医院环境","prompt":"分析陆萍与医院环境的冲突。","keywords":["知识分子","医院","冲突","环境","改革","误解"],"thesis":"陆萍与医院的冲突，是青年知识分子的改革热情同落后环境、复杂人际关系之间的冲突。","points":[{"point":"陆萍把专业责任落实为改善病人基本生活和医疗条件的具体要求。","evidence":"“她替她们要清洁的被袄，暖和的住室，滋补的营养，有次序的生活。”","location":"第二至三部分：陆萍替病人和产妇争取清洁、保暖、营养与日常秩序。","explain":"她提出的要求都落在最基本的生活与医疗需要上，因此冲突来自公共职责和现实差距。知识分子形象兼具专业判断与具体关怀，也很快暴露出医院管理和资源分配的问题。由此，前段的专业实践为后续与环境发生冲突建立事实依据。","link":"前段的专业实践为后续与环境发生冲突建立事实依据。","page":"P387","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"前","chain":{"who":"陆萍","action":"陆萍把专业责任落实为改善病人基本生活和医疗条件的具体要求。","reason":"她提出的要求都落在最基本的生活与医疗需要上，因此冲突来自公共职责和现实差距","consequence":"前段的专业实践为后续与环境发生冲突建立事实依据。"}},{"point":"制度标签和人际冷漠使她的改革无法进入正常讨论。","evidence":"“小资产阶级意识、知识分子的英雄主义、自由主义等等的帽子都往她头上戴。”","location":"第二至三部分：陆萍提出意见书并与同事、管理者发生冲突。","explain":"问题由医疗和管理转向身份判断，她的建议因此失去被认真回应的机会。个体表达受阻，也暴露制度内部缺少自我纠正能力。由此，中段冲突把知识分子困境扩展为组织文化问题。","link":"中段冲突把知识分子困境扩展为组织文化问题。","page":"P394","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"陆萍与医院环境","action":"制度标签和人际冷漠使她的改革无法进入正常讨论。","reason":"个体表达受阻，也暴露制度内部缺少自我纠正能力","consequence":"中段冲突把知识分子困境扩展为组织文化问题。"}},{"point":"经历冲突后，陆萍把批判热情转为持续的专业实践。","evidence":"“她仍然是那样兴致很浓厚的去照顾着那些产妇，那些婴儿，为着她们一点点的需索，去同管理员，总务处，秘书长，甚至院长去争执。”","location":"第四部分：陆萍在中毒事件后继续照顾病人、争取资源。","explain":"人物在受挫后继续承担现实责任，也学会在制度阻力中持续交涉。知识分子的理想因此获得更实际的行动方式，也让人物从热血批评者走向实践者。由此，后段行动回应了知识分子如何处理理想与环境关系的问题。","link":"后段行动回应了知识分子如何处理理想与环境关系的问题。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"陆萍","action":"经历冲突后，陆萍把批判热情转为持续的专业实践。","reason":"人物在受挫后继续承担现实责任，也学会在制度阻力中持续交涉","consequence":"后段行动回应了知识分子如何处理理想与环境关系的问题。"}}],"traps":["把冲突写成陆萍与某个人的私人矛盾。","只写环境落后，不写陆萍自身的成长。"]},{"id":"fortress-fang","work":"《围城》","workKey":"fortress","type":"人物形象","title":"方鸿渐的性格困境","prompt":"分析方鸿渐的人物形象。","keywords":["方鸿渐","性格","软弱","虚荣","围城","失败"],"thesis":"方鸿渐具有自省和善意，却缺少行动力，在爱情、事业和婚姻中不断被自己的软弱推入新的围城。","points":[{"point":"方鸿渐依赖外在身份掩盖内在空虚，性格困境从虚假体面开始。","evidence":"“小小一方纸能把一个人的空疏、寡陋、愚笨都掩盖起来。”","location":"第一章：方鸿渐在欧洲购买假文凭，准备回国交代。","explain":"人物清楚自己的能力与身份不相称，仍选择借文凭维持体面。清醒没有转化为行动，反而让他长期承受羞愧和自欺，这构成性格困境的起点。由此，前段假文凭建立人物的自我怀疑与行动软弱。","link":"前段假文凭建立人物的自我怀疑与行动软弱。","page":"P10","edition":"人民文学出版社软皮版","chapter":"第一章","searchPhrase":"小小一方纸","pdfPage":"19","stage":"前","chain":{"who":"方鸿渐","action":"方鸿渐依赖外在身份掩盖内在空虚，性格困境从虚假体面开始。","reason":"人物清楚自己的能力与身份不相称，仍选择借文凭维持体面","consequence":"前段假文凭建立人物的自我怀疑与行动软弱。"}},{"point":"进入职场后，他继续用被动和敷衍面对准备不足。","evidence":"“自己毫无经验，更无准备，教的功课又非出自愿，要参考也没有书，当然教不好。”","location":"第六章：方鸿渐在三闾大学承担并非自己选择的课程，教学效果不佳。","explain":"人物能够准确分析失败原因，却没有主动改变处境。经验、态度和外部条件同时不足，他却仍以消极承受延续问题，性格困境在职业空间中获得具体表现。由此，中段职场失败证明自省无法替代行动。","link":"中段职场失败证明自省无法替代行动。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第二章","searchPhrase":"这姓方的不合式","pdfPage":"52","stage":"中","chain":{"who":"方鸿渐及相关人物","action":"进入职场后，他继续用被动和敷衍面对准备不足。","reason":"人物能够准确分析失败原因，却没有主动改变处境","consequence":"中段职场失败证明自省无法替代行动。"}},{"point":"婚姻后期，方鸿渐把自己过去的失败看成无法清理的遗骸。","evidence":"“有几个自己，仿佛是路毙的，不去收拾，让它们烂掉化掉，给鸟兽吃掉——不过始终消灭不了，譬如向爱尔兰人买文凭的自己。”","location":"第九章：婚姻危机深化后，方鸿渐回想过去不同阶段的自己。","explain":"过去没有消失，造假文凭等经历持续构成身份羞耻。人物能够回望失败，却缺少重新生活的方向，自我认识最终停留在无力和感伤中，性格困境延续到全书结尾。由此，后段回望把个人性格问题推进为人生无法重建的困境。","link":"后段回望把个人性格问题推进为人生无法重建的困境。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第六章","searchPhrase":"从没听过三闾大学","pdfPage":"223","stage":"后","chain":{"who":"方鸿渐","action":"婚姻后期，方鸿渐把自己过去的失败看成无法清理的遗骸。","reason":"过去没有消失，造假文凭等经历持续构成身份羞耻","consequence":"后段回望把个人性格问题推进为人生无法重建的困境。"}}],"traps":["只写方鸿渐懦弱，忽略他能自省、有善意的一面。","把人物失败全部归因于外部环境，不分析他的选择。"]},{"id":"fortress-satire","work":"《围城》","workKey":"fortress","type":"艺术手法","title":"讽刺艺术","prompt":"分析《围城》的讽刺艺术。","keywords":["讽刺","反讽","比喻","虚伪","知识分子","手法"],"thesis":"《围城》的讽刺从前中后三个阶段展开：早期从身体观看和社交虚伪切入，中段扩大到知识分子的身份包装和丑陋处境，结尾借一只走错时间的旧钟，把针对人物的笑提升为对人生和时间的感伤反思。","points":[{"point":"早期讽刺从社交场中的身体观看切入，同时暴露男性欲望和所谓的趣味。","evidence":"“有人叫她‘熟食铺子’（charcuterie），因为只有熟食店会把那许多颜色暖热的肉公开陈列；又有人叫她‘真理’，因为据说‘真理是赤裸裸的’。”","location":"第一章：回国邮船上，男学生议论鲍小姐的穿着和身材。","explain":"男性把女性身体切成可供公开欣赏和消费的对象，又借文化和机智为这种观看寻找体面理由。被谈论者本人没有获得解释权，反而成为众人表演趣味和优越感的媒介。讽刺对象因此从个人外貌扩展到围观者的欲望、性别双标和自命风雅。由此，开篇由身体观看建立讽刺基调，也预示人物常把私欲包装成高明见解。","link":"开篇由身体观看建立讽刺基调，也预示人物常把私欲包装成高明见解。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第一章","searchPhrase":"有人叫她“熟食铺子”","pdfPage":"待核","stage":"前","chain":{"who":"方鸿渐及相关人物","action":"早期讽刺从社交场中的身体观看切入，同时暴露男性欲望和所谓的趣味。","reason":"被谈论者本人没有获得解释权，反而成为众人表演趣味和优越感的媒介","consequence":"开篇由身体观看建立讽刺基调，也预示人物常把私欲包装成高明见解。"}},{"point":"进入旅途和三闾大学后，讽刺转向知识分子，人物体面外表在现实处境中被拆穿。","evidence":"“下身的裤管，肥粗圆满，毫无折痕，可以无需人腿而卓立地上，像一对空心的国家柱石。”","location":"第五章：前往三闾大学的泥泞旅途中，李梅亭淋雨后的衣裤形状。","explain":"湿透又烤干的衣裤脱离人的支撑仍能站立，把衣冠体面和内在空洞同时写成一幅滑稽图像。李梅亭重视身份、资格和派头，却在大雨和泥水里失去所有风度。作者用夸张物件把知识分子的社会包装拉回身体和物质现实，讽刺其脆弱、虚荣和可笑。由此，中段讽刺从个人姿态扩展到整个知识群体的体面幻觉。","link":"中段讽刺从个人姿态扩展到整个知识群体的体面幻觉。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第五章","searchPhrase":"像一对空心的国家柱石","pdfPage":"待核","stage":"中","chain":{"who":"三闾大学知识分子群体","action":"进入旅途和三闾大学后，讽刺转向知识分子，人物体面外表在现实处境中被拆穿。","reason":"湿透又烤干的衣裤脱离人的支撑仍能站立，把衣冠体面和内在空洞同时写成一幅滑稽图像","consequence":"中段讽刺从个人姿态扩展到整个知识群体的体面幻觉。"}},{"point":"结尾把家庭和学校并置成造谣学校，使讽刺从个体扩展到共同的人际结构。","evidence":"“School for scandal，全是School for scandal，家庭罢，学校罢，彼此彼此。”","location":"第九章：方鸿渐经历大家庭摩擦后，把家庭和三闾大学并称为“造谣学校”。","explain":"家庭和大学在流言、算计和人际消耗上变得没有区别，人物从一个围城进入另一个围城。讽刺因此不只嘲笑某个坏人，而揭示不同社会空间共享的精神环境，也回扣全书的循环结构。由此，后段把人物笑料提升为对社会关系和人生处境的整体反思。","link":"后段把人物笑料提升为对社会关系和人生处境的整体反思。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第九章","searchPhrase":"这个时间落伍的计时机","pdfPage":"待核","stage":"后","chain":{"who":"方鸿渐及相关人物","action":"结尾把家庭和学校并置成造谣学校，使讽刺从个体扩展到共同的人际结构。","reason":"家庭和大学在流言、算计和人际消耗上变得没有区别，人物从一个围城进入另一个围城","consequence":"后段把人物笑料提升为对社会关系和人生处境的整体反思。"}}],"traps":["三个主体段反复使用同一条比喻，无法证明讽刺贯穿全书。","只写人物可笑，不分析叙述者在何种角度和语气中完成讽刺。","忽略结尾旧钟带来的感伤，把《围城》写成单纯挖苦小说。"]},{"id":"fortress-marriage","work":"《围城》","workKey":"fortress","type":"主题思想","title":"婚姻围城","prompt":"结合文本，分析《围城》中婚姻围城的含义。","keywords":["婚姻","围城","爱情","失望","选择","方鸿渐"],"thesis":"婚姻围城在小说中表现为对理想生活的想象和进入现实后的失望，方鸿渐与孙柔嘉的婚姻集中写出这种困境。","points":[{"point":"婚姻在人物想象中代表着理想和归属。","evidence":"“结婚仿佛金漆的鸟笼，笼子外面的鸟想住进去，笼内的鸟想飞出来。”","location":"第三至四章上海爱情线，以及第五至九章方鸿渐与孙柔嘉相识、结婚和婚后生活；重点看人物对婚姻的想象如何变化。","explain":"人物把进入关系理解为获得归属和完整，外壳的体面感又加强这种想象。期待中缺少对责任和现实生活的准备，婚姻从一开始就承担了解决人生问题的幻想。由此，期待越高，进入现实后的落差越明显。","link":"期待越高，进入现实后的落差越明显。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第三章","searchPhrase":"结婚仿佛金漆的鸟笼","pdfPage":"101","stage":"前","chain":{"who":"方鸿渐与孙柔嘉","action":"婚姻在人物想象中代表着理想和归属。","reason":"期待中缺少对责任和现实生活的准备，婚姻从一开始就承担了解决人生问题的幻想","consequence":"期待越高，进入现实后的落差越明显。"}},{"point":"进入婚姻后，日常矛盾和现实压力把幻想推向破裂。","evidence":"“好，咱们算散伙。行李衣服，你自己去办，别再来找我。”","location":"第九章：方鸿渐失业后与孙柔嘉在上海发生激烈争执，孙柔嘉提出散伙并回姑母家。","explain":"关系破裂被写成合作清算，情感退场后只剩具体事务的分割。日常压力不断累积，原先的期待被现实磨掉，新的束缚由此形成。由此，婚姻困境与事业失败互相推动，使“围城”脱离单纯爱情比喻。","link":"婚姻困境与事业失败互相推动，使“围城”脱离单纯爱情比喻。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第九章","searchPhrase":"这姓方的不合式","pdfPage":"341","stage":"中","chain":{"who":"方鸿渐与孙柔嘉","action":"进入婚姻后，日常矛盾和现实压力把幻想推向破裂。","reason":"关系破裂被写成合作清算，情感退场后只剩具体事务的分割","consequence":"婚姻困境与事业失败互相推动，使“围城”脱离单纯爱情比喻。"}},{"point":"三闾大学的婚姻议论显示婚姻也会被职位、人情和组织利益利用。","evidence":"“在这儿结婚成家，就安定下来，走不了，学校借光不少。”","location":"第六章：汪处厚劝方鸿渐和孙柔嘉成家，把婚姻与学校留人联系起来。","explain":"婚姻被当成稳定教师的工具，私人关系进入学校的人情和岗位安排。人物以为结婚能解决漂泊，实际却进一步被组织和关系网络固定，围城结构由此扩展到职业空间。由此，中段把婚姻围城与三闾大学的人事关系连接起来。","link":"中段把婚姻围城与三闾大学的人事关系连接起来。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第三章","searchPhrase":"城外的人想冲进去","pdfPage":"101","stage":"后","chain":{"who":"方鸿渐与孙柔嘉","action":"三闾大学的婚姻议论显示婚姻也会被职位、人情和组织利益利用。","reason":"婚姻被当成稳定教师的工具，私人关系进入学校的人情和岗位安排","consequence":"中段把婚姻围城与三闾大学的人事关系连接起来。"}}],"traps":["只写某段感情失败，忽略婚姻围城的普遍含义。","只讲婚姻，不断开事业围城的互相映照。"]},{"id":"fortress-parallel","work":"《围城》","workKey":"fortress","type":"人物关系","title":"赵辛楣与方鸿渐","prompt":"分析赵辛楣与方鸿渐的平行关系及其作用。","keywords":["赵辛楣","方鸿渐","平行","对照","三闾大学","知识分子"],"thesis":"赵辛楣和方鸿渐构成同途殊态的对照关系。两人都追求爱情、职业和婚姻中的出路，却分别表现出主动精明与被动退让。作者借两人互相映照，既写出方鸿渐的软弱，也说明知识分子无论善于处世还是逃避现实，都难以真正走出社会与自我共同造成的围城。","points":[{"point":"初次见面时，赵辛楣精于社交、自信主动，方鸿渐敏感退让，两人的身份感和行动力立即显出高低。","evidence":"“赵辛楣和鸿渐拉拉手，傲兀地把他从头到脚看一下，好像鸿渐是页一览而尽的大字幼稚园读本。”“鸿渐诧异，这姓赵的怎会知道自己，忽然想也许这人看过《沪报》那条新闻，立刻局促难受。”","location":"第三章：苏文纨家中初见赵辛楣。重点找赵辛楣审视方鸿渐时的动作，以及方鸿渐随后的心理反应。","explain":"赵辛楣对社交位置的自觉掌控来自家世、留学和外事经历，他很快把潜在竞争变成审视和控制。方鸿渐在对方的目光中迅速怀疑自己，尚未正面交锋，心理上已经退到被动位置。两人的相似处境来自同一场爱情竞争，社会能力和性格力量却有明显差距。这一组对照先建立强弱关系，也为后文两人在爱情、职业和婚姻中的不同走向埋下性格基础。由此，因此，平行关系首先表现为同一处境中的不同姿态，两人的差异使互相对照的作用更加清楚。","link":"因此，平行关系首先表现为同一处境中的不同姿态，两人的差异使互相对照的作用更加清楚。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第三章","searchPhrase":"赵辛楣和鸿渐拉拉手","pdfPage":"59","stage":"前","chain":{"who":"方鸿渐","action":"初次见面时，赵辛楣精于社交、自信主动，方鸿渐敏感退让，两人的身份感和行动力立即显出高低。","reason":"赵辛楣对社交位置的自觉掌控来自家世、留学和外事经历，他很快把潜在竞争变成审视和控制","consequence":"因此，平行关系首先表现为同一处境中的不同姿态，两人的差异使互相对照的作用更加清楚。"}},{"point":"三闾大学时期，赵辛楣的资源使方鸿渐接受安排并处于依附位置。","evidence":"“鸿渐自知在学校的地位不稳固，又经辛楣细陈利害，刘东方恳切劝驾，居然大胆老脸、低头小心教起英文来。”","location":"第六章：刘东方不愿继续代课，赵辛楣推荐方鸿渐，方鸿渐接受安排。","explain":"方鸿渐没有能力自主争取职位，只能依靠赵辛楣分析利害并接受教学任务。友情中的帮助同时带来依赖，两人的性格、资源和职场能力差异进一步显现。由此，中段关系从爱情竞争转入职业依附。","link":"中段关系从爱情竞争转入职业依附。","page":"P221","edition":"人民文学出版社软皮版","chapter":"第三章","searchPhrase":"她喜欢赵方二人斗法比武抢自己","pdfPage":"62","stage":"中","chain":{"who":"方鸿渐","action":"三闾大学时期，赵辛楣的资源使方鸿渐接受安排并处于依附位置。","reason":"方鸿渐没有能力自主争取职位，只能依靠赵辛楣分析利害并接受教学任务","consequence":"中段关系从爱情竞争转入职业依附。"}},{"point":"婚姻危机后，方鸿渐再次把重庆和赵辛楣当成出路，依附关系延续到结尾。","evidence":"“辛楣既然一番好意，我很想再到里面去碰碰运气。”","location":"第九章：赵辛楣来信劝方鸿渐去重庆，方鸿渐向孙柔嘉提出计划。","explain":"人物在事业和婚姻同时受挫时，又把朋友的介绍当成新的出口，并准备独自先行。赵辛楣始终象征更可行的社会路径，方鸿渐却仍在依靠他人安排，两人的对照延续到全书结尾。由此，后段关系证明人物困境没有因环境变化自动解决。","link":"后段关系证明人物困境没有因环境变化自动解决。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第六章","searchPhrase":"鸿渐自知在学校的地位不稳固","pdfPage":"221","stage":"后","chain":{"who":"方鸿渐","action":"婚姻危机后，方鸿渐再次把重庆和赵辛楣当成出路，依附关系延续到结尾。","reason":"由此，后段关系证明人物困境没有因环境变化自动解决","consequence":"后段关系证明人物困境没有因环境变化自动解决。"}}],"traps":["只并列写两个人，不说明二者在哪些层面相似、哪些层面相反。","把赵辛楣写成完人，忽略他的精明、虚荣、权力表演和两面性。","把方鸿渐的困境全部归因于赵辛楣，忽略方鸿渐自身的犹豫和依附。"]},{"id":"saffi-loneliness","work":"《莎菲女士的日记》","workKey":"saffi","type":"主题思想","title":"莎菲的孤独","prompt":"分析莎菲孤独感的来源及其意义。","keywords":["孤独","寂寞","无人理解","疾病","蕴姊","新女性"],"thesis":"莎菲的孤独既来自病体和亲友的不理解，也来自她觉醒后找不到同路人的精神处境。","points":[{"point":"疾病和独居放大了莎菲的寂寞。","evidence":"“我总愿意有那么一个人能了解得我清清楚楚的。”","location":"莎菲日常生活中反复出现的独处与病中场景。","page":"P40","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"人物对关系质量的要求指向完整精神理解，照料和安慰无法替代。疾病与独处增加内省时间，也使她不断确认周围关怀的限度，寂寞由生活状态深化为精神困境。由此，孤独因此成为人物心理和时代困境的共同表现。","link":"孤独因此成为人物心理和时代困境的共同表现。","stage":"前","chain":{"who":"莎菲","action":"疾病和独居放大了莎菲的寂寞。","reason":"人物对关系质量的要求指向完整精神理解，照料和安慰无法替代","consequence":"孤独因此成为人物心理和时代困境的共同表现。"}},{"point":"爱情关系中的隔膜加深了莎菲对理解的失望。","evidence":"“他仅仅只懂得我的无用，我的不可轻侮，而不够了解他之在我心中所占的是一种怎样的地位！”","location":"莎菲与凌吉士交往中的日记段落，重点看她渴望被理解却不断失望的心理。","page":"P61","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"莎菲要求的是有人准确理解她在关系中的位置和情感重量，照料和表面好感无法满足。对方只能看到病弱和自尊，无法进入她的精神世界，爱情因此非但没有消除孤独，反而使她更清楚自己的隔绝。由此，关系中的误解让孤独从生活处境深化为精神困境。","link":"关系中的误解让孤独从生活处境深化为精神困境。","stage":"中","chain":{"who":"莎菲","action":"爱情关系中的隔膜加深了莎菲对理解的失望。","reason":"莎菲要求的是有人准确理解她在关系中的位置和情感重量，照料和表面好感无法满足","consequence":"关系中的误解让孤独从生活处境深化为精神困境。"}},{"point":"蕴姊之死让莎菲失去唯一可能理解自己的人。","evidence":"“谁能懂得我呢，便能懂得这只能表现我万分之一的日记。”","location":"关于蕴姊去世和莎菲继续写日记的段落。","page":"P65","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"重要亲友的死亡带走最可能理解她的人，留下的是精神空间的空缺。日记随后成为维持自我、对抗沉默的方式，孤独也成为觉醒后长期存在的处境。由此，结尾应把个人孤独与五四新女性的处境联系起来。","link":"结尾应把个人孤独与五四新女性的处境联系起来。","stage":"后","chain":{"who":"莎菲","action":"蕴姊之死让莎菲失去唯一可能理解自己的人。","reason":"重要亲友的死亡带走最可能理解她的人，留下的是精神空间的空缺","consequence":"结尾应把个人孤独与五四新女性的处境联系起来。"}}],"traps":["只写莎菲性格孤僻，忽略社会和时代原因。","把孤独和爱情困惑混为一谈，没有分层。"]},{"id":"saffi-diary-form","work":"《莎菲女士的日记》","workKey":"saffi","type":"艺术手法","title":"日记体的叙事效果","prompt":"分析《莎菲女士的日记》的日记体特征及其表达效果。","keywords":["日记体","第一人称","私人性","即时性","独语","真实感"],"thesis":"日记体让莎菲的私人情感、即时情绪和内心独语直接呈现，使人物矛盾具有现场感和真实感。","points":[{"point":"私人性使莎菲能够说出不愿公开的欲望与羞耻。","evidence":"“我恨不得用脚尖踢出他去，不过我又为了另一种情绪所支配，我向他摇了头，表示是不厌烦他的来到。”","location":"莎菲与凌吉士关系变化前后的日记，重点看同一瞬间的冲动和掩饰。","page":"P61","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"第一人称记录让莎菲可以同时写下愤怒、依恋和掩饰，不必先整理成符合社会期待的形象。读者看到的是未经外部审查的内心现场，羞耻、欲望与自我辩解彼此交叠，日记体的私人性因此带来强烈真实感。由此，形式上的私密，使人物的矛盾能够直接暴露。","link":"形式上的私密，使人物的矛盾能够直接暴露。","stage":"前","chain":{"who":"莎菲","action":"私人性使莎菲能够说出不愿公开的欲望与羞耻。","reason":"第一人称记录让莎菲可以同时写下愤怒、依恋和掩饰，不必先整理成符合社会期待的形象","consequence":"形式上的私密，使人物的矛盾能够直接暴露。"}},{"point":"即时性让情绪变化呈现为连续过程。","evidence":"“我只得忍耐着，低下头去。”","location":"莎菲面对欲望和羞耻的即时日记，重点看人物当天的克制动作。","page":"P43","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"自我压抑被立刻记录在当天，读者能够看见冲动与羞耻如何在同一时刻形成。日记没有经过事后整理，情绪因此保留现场感，人物变化也呈现为连续的心理过程。由此，后段即时记录使日记体的时间感和心理真实同时成立。","link":"后段即时记录使日记体的时间感和心理真实同时成立。","stage":"中","chain":{"who":"莎菲","action":"即时性让情绪变化呈现为连续过程。","reason":"日记没有经过事后整理，情绪因此保留现场感，人物变化也呈现为连续的心理过程","consequence":"后段即时记录使日记体的时间感和心理真实同时成立。"}},{"point":"独语性把人物内心冲突写成两个自我的争辩。","evidence":"“一个女人这样放肆，是不会得到好结果的。”","location":"“难道我去找他吗”等内心争辩。","page":"P45","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"外部规范进入人物内心后，与自身欲望形成争辩。两种声音同时被记录，冲突不需要旁白解释，人物在自问自答中显出分裂而清醒的主体。","link":"结尾要回到形式与主题的统一。","stage":"后","chain":{"who":"莎菲","action":"独语性把人物内心冲突写成两个自我的争辩。","reason":"两种声音同时被记录，冲突不需要旁白解释，人物在自问自答中显出分裂而清醒的主体","consequence":"外部规范进入人物内心后，与自身欲望形成争辩"}}],"traps":["只写第一人称，不分析它对心理、节奏和主题的作用。","把日记体当作内容复述。"]},{"id":"water-contrast","work":"《水》","workKey":"water","type":"艺术手法","title":"《水》中的对比","prompt":"分析《水》中对比手法的运用。","keywords":["对比","官民","灾民","军火","希望","反抗"],"thesis":"《水》通过官与民、希望与失望、求生与反抗的对比，揭示天灾背后的人祸并推动群众觉醒。","points":[{"point":"灾民在灾难中的痛苦和流离构成人道关怀的起点。","evidence":"“那些被骂着的女人，一批一批的，在无可奈何之中，含着眼泪，含着一线希望，扶老携幼向着相反的方向跑去，带着哭和叫，带着骚扰和不安，向原野的四方伸去。”","location":"第一部分：洪水到来时妇女、老人和儿童逃难，重点看家庭被卷入迁徙的群像。","page":"P226","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"家庭、老人和孩子被卷入逃亡，表现一家一户失去住所和生存保障的过程。作品先呈现普通人的具体苦难，再进入官员和军队的冷漠，社会批判因此获得真实的人性基础。由此，灾难后果与官民反差由此形成第一层对照。","link":"灾难后果与官民反差由此形成第一层对照。","stage":"前","chain":{"who":"灾民","action":"灾民在灾难中的痛苦和流离构成人道关怀的起点。","reason":"家庭、老人和孩子被卷入逃亡，表现一家一户失去住所和生存保障的过程","consequence":"灾难后果与官民反差由此形成第一层对照。"}},{"point":"赈济希望与军火现实形成反差。","evidence":"“帆船却又带来了一些军火，并没有带救济米。”","location":"第二部分：灾民等待船只和救济，船靠岸后却卸下军火；重点看期待与结果的同场反差。","page":"P231","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"具体希望被另一种现实物资取代，落差迫使群众重新理解自身位置。心理转折由现实证据推动，等待救助逐渐转向准备反抗。由此，失望由此转化为愤怒。","link":"失望由此转化为愤怒。","stage":"中","chain":{"who":"灾民群众","action":"赈济希望与军火现实形成反差。","reason":"具体希望被另一种现实物资取代，落差迫使群众重新理解自身位置","consequence":"失望由此转化为愤怒。"}},{"point":"水的凶猛与人群反抗形成力量对照。","evidence":"“比水还凶猛的，朝镇上扑过去。”","location":"第四部分结尾：洪水破坏村庄与群众冲向镇上形成前后对照，观察破坏力量怎样转为反抗力量。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"不可控灾难与组织行动被放入同一力量结构中，后者对前者形成反转。主题因此从承受苦难走向创造改变现实的力量。由此，对比完成意象意义的反转。","link":"对比完成意象意义的反转。","stage":"后","chain":{"who":"小说中的“水”","action":"水的凶猛与人群反抗形成力量对照。","reason":"不可控灾难与组织行动被放入同一力量结构中，后者对前者形成反转","consequence":"对比完成意象意义的反转。"}}],"traps":["只列对比对象，不解释对比产生什么效果。","把官民对比写成简单善恶。"]},{"id":"water-wangdabao","work":"《水》","workKey":"water","type":"人物形象","title":"王大保和李塌鼻","prompt":"分析王大保和李塌鼻在灾民群体中的作用。","keywords":["王大保","李塌鼻","群众","求生","觉醒","组织"],"thesis":"王大保和李塌鼻分别以号召力和现实经验推动群众从绝望求生走向集体反抗。","points":[{"point":"灾难初期，群众在恐惧和饥饿中承受最直接的苦难。","evidence":"“那些被骂着的女人，一批一批的，在无可奈何之中，含着眼泪，含着一线希望，扶老携幼向着相反的方向跑去，带着哭和叫，带着骚扰和不安，向原野的四方伸去。”","location":"第一部分：洪水到来时妇女、老人和儿童仓促逃难。","page":"P226","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"家庭、老人和儿童被洪水驱赶，求生本能与无助同时出现。群体还只是被灾难推着移动的受害者，这种共同处境使后续有人站出来组织行动显得必要。由此，群体苦难为王大保和李塌鼻的动员提供现实基础。","link":"群体苦难为王大保和李塌鼻的动员提供现实基础。","stage":"前","chain":{"who":"群众","action":"灾难初期，群众在恐惧和饥饿中承受最直接的苦难。","reason":"家庭、老人和儿童被洪水驱赶，求生本能与无助同时出现","consequence":"群体苦难为王大保和李塌鼻的动员提供现实基础。"}},{"point":"王大保用直接的反问打断哭声，把悲痛转成求生行动。","evidence":"“哭有什么用，死的死了，哭得转来吗？”","location":"第一至二部分：洪水过后灾民抱头大哭，王大保在人群中发问。","page":"P228","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"反问先否认无休止痛哭能改变死亡，再迫使群众面对活人的出路。人物语言因此承担动员功能，零散情绪开始转向对食物、道路和目的地的共同讨论。由此，群体从绝望中被推向求生计划。","link":"群体从绝望中被推向求生计划。","stage":"中","chain":{"who":"王大保","action":"王大保用直接的反问打断哭声，把悲痛转成求生行动。","reason":"反问先否认无休止痛哭能改变死亡，再迫使群众面对活人的出路","consequence":"群体从绝望中被推向求生计划。"}},{"point":"李塌鼻用对地主存粮的了解把求生愿望变成可执行方案。","evidence":"“他们仓里多得很，别处我不晓得，三富庄我是清楚的，只要他们肯打开，够我们大家好久吃呢。”","location":"第三至四部分：长岭岗灾民商议粮食来源，李塌鼻指出三富庄存粮。","page":"待核","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"人物提供具体仓粮和地点判断，底层经验因此成为行动资源。群众由被动等待救济转向考虑打开地主粮仓，求生方向逐渐具有阶级反抗性质。由此，人物言论最终汇入结尾的集体行动，推动群体成为反抗主体。","link":"人物言论最终汇入结尾的集体行动，推动群体成为反抗主体。","stage":"后","chain":{"who":"李塌鼻","action":"李塌鼻用对地主存粮的了解把求生愿望变成可执行方案。","reason":"人物提供具体仓粮和地点判断，底层经验因此成为行动资源","consequence":"人物言论最终汇入结尾的集体行动，推动群体成为反抗主体。"}}],"traps":["把王大保写成孤胆英雄，忽略群众反应。","只写台词，不分析语言如何推动集体情绪。"]},{"id":"hospital-group","work":"《在医院中》","workKey":"hospital","type":"人物形象","title":"医院人物群像","prompt":"分析《在医院中》医院人物群像的作用。","keywords":["院长","黄守荣","张芳子","群像","官僚","冷漠"],"thesis":"医院人物群像分别代表外行领导、敷衍中层、麻木同事和疏离专业人员，共同构成陆萍改革受阻的现实环境。","points":[{"point":"医院群体用异样目光排斥坚持专业标准的陆萍。","evidence":"“她已经成为医院里小小的怪人，被大多数人用异样的眼睛看着。”","location":"第一至二部分：陆萍初到医院并提出改进意见后，群体态度逐渐形成。","page":"P387","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"统一而不友善的注视显示医院已经形成排斥异见的共同习惯。陆萍被视为不合群的人，说明专业标准和旧工作方式之间存在结构性冲突。由此，前段群像首先形成对改革者的共同压力。","link":"前段群像首先形成对改革者的共同压力。","stage":"前","chain":{"who":"陆萍","action":"医院群体用异样目光排斥坚持专业标准的陆萍。","reason":"统一而不友善的注视显示医院已经形成排斥异见的共同习惯","consequence":"前段群像首先形成对改革者的共同压力。"}},{"point":"院方和管理层忽视基本医疗条件，官僚作风制造现实风险。","evidence":"“手术室不装煤炉怎么行呢？”","location":"第三部分：手术室缺少供暖，陆萍提出最低医疗安全要求。","page":"P390","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"关键岗位却得不到基本保障，说明管理层把行政方便放在病人安全之前。后续中毒事故来自长期敷衍和资源安排失当，偶发性只是表象。由此，中段群像问题从态度冷漠上升到制度失职。","link":"中段群像问题从态度冷漠上升到制度失职。","stage":"中","chain":{"who":"陆萍与医院环境","action":"院方和管理层忽视基本医疗条件，官僚作风制造现实风险。","reason":"后续中毒事故来自长期敷衍和资源安排失当，偶发性只是表象","consequence":"中段群像问题从态度冷漠上升到制度失职。"}},{"point":"事故后的标签化进一步显示群体如何保护旧秩序。","evidence":"“小资产阶级意识、知识分子的英雄主义、自由主义等等的帽子都往她头上戴。”","location":"第三至四部分：中毒事件后，医院群体把陆萍的批评转成身份问题。","page":"P394","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"群体没有追查设备和管理责任，反而用标签消解异议。这种做法既伤害陆萍，也使医院失去修正错误的机会，群像因此成为制度惰性的直接承担者。由此，后段群像把个人冲突推进为组织自省能力缺失的问题。","link":"后段群像把个人冲突推进为组织自省能力缺失的问题。","stage":"后","chain":{"who":"陆萍与医院环境","action":"事故后的标签化进一步显示群体如何保护旧秩序。","reason":"群体没有追查设备和管理责任，反而用标签消解异议","consequence":"后段群像把个人冲突推进为组织自省能力缺失的问题。"}}],"traps":["只列人物名字，不写他们各自代表的问题。","群像分析与陆萍无关，文章被拆成人物介绍。"]},{"id":"hospital-gas","work":"《在医院中》","workKey":"hospital","type":"主题思想","title":"手术室中毒事件与制度问题","prompt":"分析手术室中毒事件在小说中的作用。","keywords":["中毒","手术室","黎涯","冲突","成长","制度问题"],"thesis":"中毒事件把医疗条件、官僚管理、人际冷漠和陆萍的心理危机集中引爆，成为人物成长与作品社会批判的关键转折。","points":[{"point":"供暖缺失暴露医疗条件和管理责任的长期问题。","evidence":"“手术室不装煤炉怎么行呢？”","location":"第三部分开头：手术室缺少煤炉，只能临时烧木炭取暖。","explain":"基本安全条件被忽略，事故因此具有可预见性。院方节省和管理敷衍把病人和医护人员置于风险之中，为中毒事件建立直接因果。由此，事件发生前的问题铺垫让事故承担制度批判作用。","link":"事件发生前的问题铺垫让事故承担制度批判作用。","page":"P390","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"前","chain":{"who":"陆萍与医院环境","action":"供暖缺失暴露医疗条件和管理责任的长期问题。","reason":"基本安全条件被忽略，事故因此具有可预见性","consequence":"事件发生前的问题铺垫让事故承担制度批判作用。"}},{"point":"中毒事件把陆萍推到身体和精神的双重低点。","evidence":"“她已经完全清楚，她需要静静的睡眠，可是被一种不知是什么东西压迫着，忍不住要哭要叫。”","location":"第三部分高潮：陆萍中毒后醒来，身体虚弱并承受强烈精神压力。","explain":"中毒事件让疲惫和压迫同时出现，人物无法再靠忙碌遮掩问题。事故让她直面个人理想、医院现实和革命工作之间的裂缝，中段由此完成从行动到反思的转折。由此，事故成为人物认识和成长过程的核心节点。","link":"事故成为人物认识和成长过程的核心节点。","page":"P393","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"陆萍","action":"中毒事件把陆萍推到身体和精神的双重低点。","reason":"中毒事件让疲惫和压迫同时出现，人物无法再靠忙碌遮掩问题","consequence":"事故成为人物认识和成长过程的核心节点。"}},{"point":"事故后的标签化说明医院没有从灾难中转向责任反思。","evidence":"“小资产阶级意识、知识分子的英雄主义、自由主义等等的帽子都往她头上戴。”","location":"第三至四部分：中毒事件后，陆萍受到议论和身份批判。","explain":"组织把医疗事故转成个人立场问题，实际责任因此被遮蔽。事故不仅暴露设备和管理的缺陷，也暴露群体缺少自我批评和纠错能力。由此，后段处理方式说明中毒事件的意义延伸到组织文化和思想机制。","link":"后段处理方式说明中毒事件的意义延伸到组织文化和思想机制。","page":"P394","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"陆萍与医院环境","action":"事故后的标签化说明医院没有从灾难中转向责任反思。","reason":"事故不仅暴露设备和管理的缺陷，也暴露群体缺少自我批评和纠错能力","consequence":"后段处理方式说明中毒事件的意义延伸到组织文化和思想机制。"}}],"traps":["只复述中毒经过，不分析制度、人物和主题。","把事故当作偶然意外，忽略此前的资源申请和管理问题。"]},{"id":"hospital-ending","work":"《在医院中》","workKey":"hospital","type":"主题思想","title":"开放结尾与继续成长","prompt":"分析《在医院中》结尾对陆萍成长的意义。","keywords":["结尾","成长","革命","反思","机会","理想"],"thesis":"结尾让陆萍在痛苦反思后继续寻找学习和实践的机会，人物没有被现实击垮，也没有完成一次性改造，成长因此保持开放。","points":[{"point":"结尾的继续成长建立在陆萍最初主动处理生活和医疗问题的责任意识之上。","evidence":"“她常常为了他们的生活管理，和医疗的改善与很多人发生冲突。”","location":"第一部分：陆萍到院后持续争取生活和医疗条件的改善。","explain":"她从一开始就把具体改进当成自己的责任，因此不会因环境冷淡轻易放弃。这一行动底色使结尾的继续学习和工作具有前文基础，开放结局也更可信。由此，前段责任意识为结尾继续实践提供性格依据。","link":"前段责任意识为结尾继续实践提供性格依据。","page":"P387","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"前","chain":{"who":"陆萍","action":"结尾的继续成长建立在陆萍最初主动处理生活和医疗问题的责任意识之上。","reason":"她从一开始就把具体改进当成自己的责任，因此不会因环境冷淡轻易放弃","consequence":"前段责任意识为结尾继续实践提供性格依据。"}},{"point":"中毒和冲突后的反思让陆萍重新理解成长需要长期实践。","evidence":"“新的生活虽要开始，然而还有新的荆棘。人是要经过千锤百炼而不消溶才能真真有用。人是在艰苦中成长。”","location":"第三至四部分：中毒事件后，陆萍面对新的工作和思想考验。","explain":"人物承认未来仍有困难，也要求自己在现实中保持完整。成长由此从情绪变化转为长期实践和人格坚持，结尾保持开放而不退回悲观。由此，中后段反思把开放结尾建立在具体经历之上。","link":"中后段反思把开放结尾建立在具体经历之上。","page":"P393","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"陆萍","action":"中毒和冲突后的反思让陆萍重新理解成长需要长期实践。","reason":"人物承认未来仍有困难，也要求自己在现实中保持完整","consequence":"中后段反思把开放结尾建立在具体经历之上。"}},{"point":"陆萍继续照顾病人和争取资源，使成长落在持续行动中。","evidence":"“她仍然是那样兴致很浓厚的去照顾着那些产妇，那些婴儿，为着她们一点点的需索，去同管理员，总务处，秘书长，甚至院长去争执。”","location":"第四部分结尾：陆萍继续工作，并为产妇和婴儿的具体需求交涉。","explain":"结尾通过行动显示人物选择，没有依赖宣言，她没有放弃关怀和责任，也学会在制度限制中持续争取。开放结局因此指向继续成长，也没有把成长写成一次性完成。由此，后段行动直接回答结尾保留何种成长希望。","link":"后段行动直接回答结尾保留何种成长希望。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"陆萍","action":"陆萍继续照顾病人和争取资源，使成长落在持续行动中。","reason":"结尾通过行动显示人物选择，没有依赖宣言，她没有放弃关怀和责任，也学会在制度限制中持续争取","consequence":"后段行动直接回答结尾保留何种成长希望。"}}],"traps":["把结尾理解成陆萍理想彻底破灭。","只写她离开医院，不分析离开后继续学习和实践的选择。"]},{"id":"fortress-diploma","work":"《围城》","workKey":"fortress","type":"主题思想","title":"假文凭的象征意义","prompt":"分析方鸿渐假文凭事件的讽刺意义。","keywords":["假文凭","克莱登","虚荣","学历","知识分子","围城"],"thesis":"假文凭既讽刺社会对学历的盲目崇拜，也象征方鸿渐用虚荣掩盖空疏、从而进入人生围城的起点。","points":[{"point":"假文凭首先满足方鸿渐对体面和家人期待的需要。","evidence":"“自己买张假文凭回去哄人，岂非也成了骗子？”","location":"第一章：方鸿渐收到爱尔兰人的假文凭广告，犹豫是否购买。","page":"P10","edition":"人民文学出版社软皮版","explain":"人物清楚购买文凭会改变自己的道德身份，却在家庭和现实压力下逐渐替骗局寻找理由。假文凭从一开始就同时代表体面、羞耻和自我欺骗。由此，前段建立文凭与诚信冲突的象征基础。","link":"前段建立文凭与诚信冲突的象征基础。","chapter":"第一章","searchPhrase":"小小一方纸","pdfPage":"19","stage":"前","chain":{"who":"方鸿渐","action":"假文凭首先满足方鸿渐对体面和家人期待的需要。","reason":"人物清楚购买文凭会改变自己的道德身份，却在家庭和现实压力下逐渐替骗局寻找理由","consequence":"前段建立文凭与诚信冲突的象征基础。"}},{"point":"三闾大学中的类似骗局说明假文凭已成社会病，个人并不孤立。","evidence":"“韩学愈撒他的谎，并非跟自己同谋，但有了他，似乎自己的欺骗减轻了罪名。”","location":"第六章：方鸿渐发现韩学愈也以克莱登学历维持教授身份。","page":"待核","edition":"人民文学出版社软皮版","explain":"多个人共用同类假学历，使文凭骗局从个人道德问题扩展为学术评价制度的病症。方鸿渐看到别人撒谎后轻视自己的羞耻，也说明虚假环境会继续削弱个人良知。由此，中段证明假文凭不仅属于个人选择，也属于社会结构。","link":"中段证明假文凭不仅属于个人选择，也属于社会结构。","chapter":"第一章","searchPhrase":"小小一方纸","pdfPage":"19","stage":"中","chain":{"who":"三闾大学知识分子群体","action":"三闾大学中的类似骗局说明假文凭已成社会病，个人并不孤立。","reason":"多个人共用同类假学历，使文凭骗局从个人道德问题扩展为学术评价制度的病症","consequence":"中段证明假文凭不仅属于个人选择，也属于社会结构。"}},{"point":"婚姻后期，假文凭仍像无法清理的过去，持续制造身份羞耻。","evidence":"“有几个自己，仿佛是路毙的，不去收拾，让它们烂掉化掉，给鸟兽吃掉——不过始终消灭不了，譬如向爱尔兰人买文凭的自己。”","location":"第九章：方鸿渐回望过去不同阶段的自己。","page":"待核","edition":"人民文学出版社软皮版","explain":"假文凭没有被时间冲淡，反而成为无法埋葬的旧我。人物可以承认过去，却无法重新建立完整身份，文凭象征的虚假体面因此贯穿整个婚姻和人生结局。由此，后段把一张文凭扩展为长期身份创伤和人生困境。","link":"后段把一张文凭扩展为长期身份创伤和人生困境。","chapter":"第一章","searchPhrase":"克莱登法商专门学校函授部","pdfPage":"20","stage":"后","chain":{"who":"方鸿渐与孙柔嘉","action":"婚姻后期，假文凭仍像无法清理的过去，持续制造身份羞耻。","reason":"假文凭没有被时间冲淡，反而成为无法埋葬的旧我","consequence":"后段把一张文凭扩展为长期身份创伤和人生困境。"}}],"traps":["只批判方鸿渐个人，不分析社会崇拜学历的现象。","把假文凭当作孤立事件，不联系职业和婚恋困境。"]},{"id":"fortress-intellectuals","work":"《围城》","workKey":"fortress","type":"主题思想","title":"三闾大学与知识分子群像","prompt":"分析《围城》中的知识分子群像。","keywords":["三闾大学","知识分子","虚伪","派系","李梅亭","韩学愈"],"thesis":"《围城》通过三闾大学的派系斗争和学者群像，讽刺知识分子在名利、权力和虚荣中的庸俗化。","points":[{"point":"赴校旅途中，同行知识分子的庸俗让方鸿渐产生堕落感。","evidence":"“与李梅亭顾尔谦等为伍，就是可耻的堕落。”","location":"第五章：方鸿渐与李梅亭、顾尔谦等人在赴三闾大学途中同行。","page":"待核","edition":"人民文学出版社软皮版","explain":"知识分子体面在日常旅行中被反复消解，人物的抱怨也暴露他对自身群体既厌恶又无法脱离。群像批判从旅途开始进入具体生活。由此，前段旅途先建立知识群体的庸俗印象。","link":"前段旅途先建立知识群体的庸俗印象。","chapter":"第八章","searchPhrase":"从没听过三闾大学","pdfPage":"273","stage":"前","chain":{"who":"方鸿渐","action":"赴校旅途中，同行知识分子的庸俗让方鸿渐产生堕落感。","reason":"知识分子体面在日常旅行中被反复消解，人物的抱怨也暴露他对自身群体既厌恶又无法脱离","consequence":"前段旅途先建立知识群体的庸俗印象。"}},{"point":"到校后，学术准备不足和课堂敷衍揭穿教师的体面。","evidence":"“自己毫无经验，更无准备，教的功课又非出自愿，要参考也没有书，当然教不好。”","location":"第六章：方鸿渐在三闾大学承担并非自己选择的课程，教学效果不佳。","page":"待核","edition":"人民文学出版社软皮版","explain":"人物连失败原因都看得清楚，却没有能力或意愿改变。学校和教师共同消耗课堂，高等教育的形式与真实知识能力之间存在明显断裂。由此，中段把群像批判落到教学和专业能力。","link":"中段把群像批判落到教学和专业能力。","chapter":"第六章","searchPhrase":"从没听过三闾大学","pdfPage":"213","stage":"中","chain":{"who":"三闾大学知识分子群体","action":"到校后，学术准备不足和课堂敷衍揭穿教师的体面。","reason":"人物连失败原因都看得清楚，却没有能力或意愿改变","consequence":"中段把群像批判落到教学和专业能力。"}},{"point":"后期聘约处理暴露机构失信和权力任性。","evidence":"“高松年省他起稿子写信的麻烦，干脆不送聘约给他。”","location":"第八章：下学年聘约发出，高松年不把方鸿渐的聘约送来，也不作解释。","page":"待核","edition":"人民文学出版社软皮版","explain":"职业前途被当作行政琐事，权力者甚至可以用沉默结束一个人的位置。三闾大学表面有程序和制度，实际安排却随权力意志改变，知识分子缺少稳定保障。由此，后段把旅途丑态和课堂困境推进到制度失信。","link":"后段把旅途丑态和课堂困境推进到制度失信。","chapter":"第六章","searchPhrase":"从没听过三闾大学","pdfPage":"213","stage":"后","chain":{"who":"方鸿渐及相关人物","action":"后期聘约处理暴露机构失信和权力任性。","reason":"三闾大学表面有程序和制度，实际安排却随权力意志改变，知识分子缺少稳定保障","consequence":"后段把旅途丑态和课堂困境推进到制度失信。"}}],"traps":["只罗列人物丑事，不分析群体象征。","把讽刺写成简单道德批判，忽略时代环境。"]},{"id":"fortress-metaphor","work":"《围城》","workKey":"fortress","type":"艺术手法","title":"比喻与围城意象","prompt":"分析《围城》中比喻和意象的艺术作用。","keywords":["比喻","意象","鸟笼","围城","人生困境","讽刺"],"thesis":"《围城》用鸟笼、城堡和围城等比喻，把婚姻、职业与人生困境具象化，使讽刺具有反复回扣的结构力量。","points":[{"point":"鸟笼比喻把婚姻中的进出欲望具象化。","evidence":"“结婚仿佛金漆的鸟笼，笼子外面的鸟想住进去，笼内的鸟想飞出来。”","location":"第三章：人物谈论爱情和婚姻，鸟笼比喻由此进入全书主题。","page":"待核","edition":"人民文学出版社软皮版","explain":"体面外壳和封闭空间被压在同一形象中，人物只看到进入前的光亮，进入后又想离开。婚姻愿望与限制因此同时获得可感形态。由此，前段鸟笼先建立围城意象的基本结构。","link":"前段鸟笼先建立围城意象的基本结构。","chapter":"第三章","searchPhrase":"结婚仿佛金漆的鸟笼","pdfPage":"101","stage":"前","chain":{"who":"作者与叙事者","action":"鸟笼比喻把婚姻中的进出欲望具象化。","reason":"体面外壳和封闭空间被压在同一形象中，人物只看到进入前的光亮，进入后又想离开","consequence":"前段鸟笼先建立围城意象的基本结构。"}},{"point":"肉骨头和水中倒影把得到之后的失望写成欲望循环。","evidence":"“狗为着追求水里肉骨头的影子，丧失了到嘴的肉骨头！跟爱人如愿以偿结了婚，恐怕那时候肉骨头下肚，倒要对水怅惜这不可再见的影子了。”","location":"第五章：方鸿渐与赵辛楣谈婚姻和人生选择。","page":"待核","edition":"人民文学出版社软皮版","explain":"现实拥有和想象目标被拆成两个不可兼得的东西，人物追逐幻影时失去已经得到的幸福。比喻因此揭示欲望难以满足，也把婚姻加入围城结构。由此，中段比喻从婚姻扩展到职业和普遍人生选择。","link":"中段比喻从婚姻扩展到职业和普遍人生选择。","chapter":"第三章","searchPhrase":"结婚仿佛金漆的鸟笼","pdfPage":"101","stage":"中","chain":{"who":"方鸿渐及相关人物","action":"肉骨头和水中倒影把得到之后的失望写成欲望循环。","reason":"现实拥有和想象目标被拆成两个不可兼得的东西，人物追逐幻影时失去已经得到的幸福","consequence":"中段比喻从婚姻扩展到职业和普遍人生选择。"}},{"point":"结尾把家庭和三闾大学并称为是非窝，使围城结构贯穿私人生活与组织空间。","evidence":"“家里真跟三闾大学一样是个是非窝。”","location":"第九章：方鸿渐在上海婚姻和家庭关系中，回想三闾大学的人事经验。","page":"待核","edition":"人民文学出版社软皮版","explain":"学校与家庭被并置，说明围城已经不局限于爱情或婚姻，而指向一切充满算计和束缚的人际空间。人物离开一个环境后进入另一个相似环境，主题结构在全书结尾完成。由此，后段把比喻从单段关系提升为整部小说的结构原则。","link":"后段把比喻从单段关系提升为整部小说的结构原则。","chapter":"第三章","searchPhrase":"城外的人想冲进去","pdfPage":"101","stage":"后","chain":{"who":"三闾大学知识分子群体","action":"结尾把家庭和三闾大学并称为是非窝，使围城结构贯穿私人生活与组织空间。","reason":"学校与家庭被并置，说明围城已经不局限于爱情或婚姻，而指向一切充满算计和束缚的人际空间","consequence":"后段把比喻从单段关系提升为整部小说的结构原则。"}}],"traps":["只摘抄比喻，不解释比喻和行为、主题的关系。","把所有意象都说成围城，忽略具体语境。"]},{"id":"fortress-group-portrait","work":"《围城》","workKey":"fortress","type":"人物形象","title":"知识分子群像的病态","prompt":"结合方鸿渐及周围人物，分析《围城》如何塑造战时知识分子群像。","keywords":["群像","知识分子","方鸿渐","虚荣","三闾大学","病态"],"thesis":"小说以方鸿渐为线索，把学历、爱情和职业空间中的知识分子连成群像，写出他们在理想与现实之间的虚荣、摇摆和无力。","points":[{"point":"学历崇拜掩盖群像的精神空疏。","evidence":"“小小一方纸能把一个人的空疏、寡陋、愚笨都掩盖起来。”","location":"第一至二章：方鸿渐购买文凭、回国后被报刊和社交圈当成博士追捧。","explain":"人物宁愿相信外在证明，也不愿检验真实能力。学历崇拜表现个人虚荣，也说明社会评价体系共同维持知识分子群像的虚假体面。由此，前段从学历和社交追捧建立群像病态。","link":"前段从学历和社交追捧建立群像病态。","page":"P10","edition":"人民文学出版社软皮版","stage":"前","chain":{"who":"三闾大学知识分子群体","action":"学历崇拜掩盖群像的精神空疏。","reason":"人物宁愿相信外在证明，也不愿检验真实能力","consequence":"前段从学历和社交追捧建立群像病态。"}},{"point":"三闾大学的教学与人事问题暴露知识群体的专业空心。","evidence":"“他动不动就写黑板，黑板上写一个字要嘴里讲十个字那些时间。”","location":"第六章：方鸿渐在三闾大学上课，用写黑板拖延课堂时间。","explain":"教学形式被用来掩盖内容不足，教师身份与真实能力形成反差。个人敷衍背后还有职位、派系和知识准备问题，群像批判因此进入学术机构内部。由此，中段群像问题从学历虚荣转入职业能力与制度环境。","link":"中段群像问题从学历虚荣转入职业能力与制度环境。","page":"待核","edition":"人民文学出版社软皮版","stage":"中","chain":{"who":"三闾大学知识分子群体","action":"三闾大学的教学与人事问题暴露知识群体的专业空心。","reason":"教学形式被用来掩盖内容不足，教师身份与真实能力形成反差","consequence":"中段群像问题从学历虚荣转入职业能力与制度环境。"}},{"point":"后期的报馆和城市文化空间继续暴露知识群体的平庸与自我重复。","evidence":"“她自己写的东西，今天明天，搬来搬去，老是那几句话，倒也省事。”","location":"第九章：方鸿渐在上海报馆工作，孙柔嘉议论沈太太重复使用文章内容。","explain":"文化工作被写成重复、敷衍和经营名声，知识群体的空洞从大学延伸到报馆和城市社交。人物虽然换了空间和工作，精神问题仍然延续，群像批判因此贯穿全书。由此，后段证明知识群体的病态没有随离开三闾大学而结束。","link":"后段证明知识群体的病态没有随离开三闾大学而结束。","page":"待核","edition":"人民文学出版社软皮版","stage":"后","chain":{"who":"方鸿渐及相关人物","action":"后期的报馆和城市文化空间继续暴露知识群体的平庸与自我重复。","reason":"由此，后段证明知识群体的病态没有随离开三闾大学而结束","consequence":"后段证明知识群体的病态没有随离开三闾大学而结束。"}}],"traps":["只介绍方鸿渐一个人物，没有群像之间的互相映照。","把人物缺点简单归为个人品行，忽略学历、职业和时代压力。"]},{"id":"fortress-language-satire","work":"《围城》","workKey":"fortress","type":"艺术手法","title":"语言讽刺的三种方式","prompt":"分析《围城》如何通过比喻、人物语言和叙事判断实现讽刺。","keywords":["语言讽刺","比喻","幽默","人物语言","叙事判断","围城"],"thesis":"钱钟书通过叙事反讽、人物语言和自我暴露式论说，让褚慎明、曹元朗和高松年分别在学术、艺术和管理领域表演聪明，读者却从他们的语言和行动中看见虚荣与操控。","points":[{"point":"叙述用平静罗列事实的方式拆穿褚慎明的学术神话。","evidence":"“他常翻外国哲学杂志，查出世界大哲学家的通信处，写信给他们，说自己如何爱读他们的书，把哲学杂志书评栏里赞美他们著作的话，改头换面算自己的意见。”","location":"第三章：赵辛楣宴客前介绍褚慎明的经历，重点看叙述者怎样逐项说明他的成名方法。","explain":"一连串具体动作构成完整的自我包装流程，通信、抄录改换和借名家回信提升名声都有清楚步骤。叙述者不加怒骂，读者却能自行判断这套学术权威如何生产。反讽的力量来自事实顺序和冷静语气，人物越显得高深，骗术越显得可笑。由此，语言讽刺首先表现为叙述事实与人物名誉之间的巨大落差。","link":"语言讽刺首先表现为叙述事实与人物名誉之间的巨大落差。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第三章","searchPhrase":"他常翻外国哲学杂志","pdfPage":"待核","stage":"前","chain":{"who":"褚慎明","action":"叙述用平静罗列事实的方式拆穿褚慎明的学术神话。","reason":"一连串具体动作构成完整的自我包装流程，通信、抄录改换和借名家回信提升名声都有清楚步骤","consequence":"语言讽刺首先表现为叙述事实与人物名誉之间的巨大落差。"}},{"point":"人物语言会自我暴露，曹元朗把诗的无意义包装成高级趣味。","evidence":"“诗有意义是诗的不幸！”","location":"第三章：苏文纨家中，曹元朗向众人解释新诗《拼盘姘伴》。","explain":"诗人把缺乏内容和逻辑说成超越意义，借中外杂糅和晦涩表达占据审美高地。听者若不认同，似乎便不懂艺术，这句话因此同时完成自我夸耀和对读者的压制。作者让人物亲手拆掉诗歌标准，讽刺现代文艺圈以新名词掩盖空洞的现象。由此，人物语言不再证明才学，反而成为读者判断其虚伪的直接证据。","link":"人物语言不再证明才学，反而成为读者判断其虚伪的直接证据。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第三章","searchPhrase":"诗有意义是诗的不幸","pdfPage":"待核","stage":"中","chain":{"who":"曹元朗","action":"人物语言会自我暴露，曹元朗把诗的无意义包装成高级趣味。","reason":"诗人把缺乏内容和逻辑说成超越意义，借中外杂糅和晦涩表达占据审美高地","consequence":"人物语言不再证明才学，反而成为读者判断其虚伪的直接证据。"}},{"point":"结尾用一只走错时间的旧钟完成语言反讽和人生感伤。","evidence":"“这个时间落伍的计时机无意中包涵对人生的讽刺和感伤，深于一切语言、一切啼笑。”","location":"第九章结尾：方鸿渐与孙柔嘉争吵后，祖传老钟晚响。","explain":"物件记录过去的期待和善意，响起时相关愿望已经无法挽回。叙述用一件日常物品集中写出时间错位、行动迟缓和关系破裂，把语言讽刺推进到整部小说的人生反思。由此，后段把人物语言和比喻收束为全书的讽刺与感伤。","link":"后段把人物语言和比喻收束为全书的讽刺与感伤。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第六章","searchPhrase":"那野兽给你催眠了不敢扑你","pdfPage":"待核","stage":"后","chain":{"who":"作者与叙事者","action":"结尾用一只走错时间的旧钟完成语言反讽和人生感伤。","reason":"物件记录过去的期待和善意，响起时相关愿望已经无法挽回","consequence":"后段把人物语言和比喻收束为全书的讽刺与感伤。"}}],"traps":["只列举比喻句，不区分叙述反讽、人物语言和伪科学论证。","三条论证都选同一时期的材料，看不出语言策略在全书中反复变化。","把作者的叙述判断直接当作人物原话，忽略叙述视角。"]},{"id":"fortress-concrete-balance","work":"《围城》","workKey":"fortress","type":"艺术手法","title":"讽刺的具象化与平衡视角","prompt":"分析《围城》如何通过具象化描写和平衡视角完成讽刺。","keywords":["具象化","平衡视角","隐喻","结构","冷峻","笑中带泪"],"thesis":"《围城》用具体物象和对称冲突承载讽刺：早期把善恶混合写成日常触感，中段用名片等物件暴露身份虚荣，结尾让夫妻冲突同时呈现双方的伤害，叙述因此保持冷峻距离，也保留笑中带泪的复杂感。","points":[{"point":"叙述者用饭中砂砾和鱼刺形容忠厚者的恶意，使抽象人性获得日常触感。","evidence":"“忠厚老实人的恶毒，像饭里的砂砾或者出骨鱼片里未净的刺，会给人一种不期待的伤痛。”","location":"第一章：孙太太议论方鸿渐和鲍小姐后，叙述者作出这句概括。","explain":"砂砾和鱼刺都来自日常饮食，伤害不大，却会在最放松时突然刺中人。比喻把“老实人”从单一道德标签中解放出来，承认善意、世俗判断和恶意可以并存。叙述者因此不替任何人物作简单定性，读者也会对群像保持警惕和同情。由此，冷峻视角从开篇就奠定，使讽刺避免落入辱骂。","link":"冷峻视角从开篇就奠定，使讽刺避免落入辱骂。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第一章","searchPhrase":"饭里的砂砾或者出骨鱼片里未净的刺","pdfPage":"待核","stage":"前","chain":{"who":"方鸿渐及相关人物","action":"叙述者用饭中砂砾和鱼刺形容忠厚者的恶意，使抽象人性获得日常触感。","reason":"砂砾和鱼刺都来自日常饮食，伤害不大，却会在最放松时突然刺中人","consequence":"冷峻视角从开篇就奠定，使讽刺避免落入辱骂。"}},{"point":"名片把李梅亭虚增身份的虚荣变成可以看见的物质证据。","evidence":"“上面并列着三行衔头：‘国立三闾大学主任’、‘新闻学研究所所长’，还有一条是一个什么县党部的前任秘书。”","location":"第五章：旅途买票受阻，李梅亭拿出珍藏名片充当资历证明。","explain":"纸片上的头衔排列整齐，实际机构却被人物自己承认经过增减和重组。名片本应证明身份，在这场交涉中却暴露身份可以被制造、排版和夸大。具体物件使知识分子的体面焦虑可见，也把讽刺从性格批评推进到社会评价制度。由此，身份包装越具体，人物精神上的虚弱越容易被读者看见。","link":"身份包装越具体，人物精神上的虚弱越容易被读者看见。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第五章","searchPhrase":"国立三闾大学主任","pdfPage":"待核","stage":"中","chain":{"who":"李梅亭","action":"名片把李梅亭虚增身份的虚荣变成可以看见的物质证据。","reason":"纸片上的头衔排列整齐，实际机构却被人物自己承认经过增减和重组","consequence":"身份包装越具体，人物精神上的虚弱越容易被读者看见。"}},{"point":"结尾用夫妻双方的对白呈现对称伤害，叙述不替任何一方作简单裁决。","evidence":"“我谁都不靠。我告诉你，我今天已经拍电报给赵辛楣，方才跟转运公司的人全讲好了。”“好，咱们算散伙。行李衣服，你自己去办，别再来找我。”","location":"第九章：方鸿渐决定投奔赵辛楣，孙柔嘉以清算和分手回应，婚姻冲突全面爆发。","explain":"方鸿渐用独立行动维护自尊，孙柔嘉用关系清算和实际事务回应，双方都在愤怒中把关系推向破裂。叙述没有提供单一受害者，家庭成员、经济压力和性格弱点同时进入冲突。讽刺因此带出悲凉，读者能笑人物的执拗，也能看到婚姻结构对人的消耗。由此，从日常比喻到婚姻结尾，冷峻视角始终保持，形成笑中带泪的复杂效果。","link":"从日常比喻到婚姻结尾，冷峻视角始终保持，形成笑中带泪的复杂效果。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第九章","searchPhrase":"好，咱们算散伙","pdfPage":"待核","stage":"后","chain":{"who":"方鸿渐与孙柔嘉","action":"结尾用夫妻双方的对白呈现对称伤害，叙述不替任何一方作简单裁决。","reason":"叙述没有提供单一受害者，家庭成员、经济压力和性格弱点同时进入冲突","consequence":"从日常比喻到婚姻结尾，冷峻视角始终保持，形成笑中带泪的复杂效果。"}}],"traps":["只写人物可笑，不解释叙述者如何让评价者和被评价者同时暴露。","把结尾写成方鸿渐或孙柔嘉单方面造成婚姻失败。","三个主体段都用围城比喻，缺少人物、物件和关系的具体证据。"]},{"id":"saffi-imperfect-vanguard","work":"《莎菲女士的日记》","workKey":"saffi","type":"人物形象","title":"“不完美”莎菲的先锋性","prompt":"莎菲自我分裂、反复彷徨是否削弱了人物的先锋性？结合文本分析。","keywords":["不完美","先锋性","自我分裂","女性主义","主体","抵抗"],"thesis":"莎菲的先锋性不在于她成为道德完美的新女性，而在于她敢于承认欲望、行使对男性人格的精神评判权，并拒绝用物质和肉欲替代灵魂契合。","points":[{"point":"莎菲承认自我欲望，打破传统女性只能沉默和被安排的处境。","evidence":"“我要，我要使我快乐。”","location":"患病独居阶段的日记，莎菲面对疾病、爱情和生活苦闷时直接写下个人欲求。","explain":"人物把快乐和生命感受说成自己有权追求的目标，私人欲望因此取得公开表达的资格。她还没有找到实现这些要求的道路，冲破沉默本身已经构成新女性意识的先声。由此，先锋性从承认个人的身体和精神需要开始。","link":"先锋性从承认个人的身体和精神需要开始。","page":"待核","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"前","chain":{"who":"莎菲","action":"莎菲承认自我欲望，打破传统女性只能沉默和被安排的处境。","reason":"她还没有找到实现这些要求的道路，冲破沉默本身已经构成新女性意识的先声","consequence":"先锋性从承认个人的身体和精神需要开始。"}},{"point":"她拒绝凌吉士，是在行使女性对欲望对象进行精神评判和道德选择的权利。","evidence":"“当我明白了那使我爱慕的一个高贵的美形里，是安置着如此一个卑劣灵魂。”","location":"莎菲看清凌吉士真实面目后的心理转折。","explain":"人物没有因为欲望放弃判断，在发现对象的人格问题后主动收回感情。拒绝体现女性决定何种人值得进入关系、何种价值不能被交易的权利，与被迫失恋无关。由此，先锋性由此从身体欲望推进到精神评判和道德主体。","link":"先锋性由此从身体欲望推进到精神评判和道德主体。","page":"P58","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"凌吉士","action":"她拒绝凌吉士，是在行使女性对欲望对象进行精神评判和道德选择的权利。","reason":"人物没有因为欲望放弃判断，在发现对象的人格问题后主动收回感情","consequence":"先锋性由此从身体欲望推进到精神评判和道德主体。"}},{"point":"日记中的独语构成女性自我空间的建构。","evidence":"“谁能懂得我呢，便能懂得这只能表现我万分之一的日记。”","location":"全篇以第一人称日记持续展开的内心独白。","explain":"私人书写承认表达永远不完整，却也是人物可以脱离社会角色说话的空间。她保留欲望、羞耻、反思和判断，拒绝被外界固定成单一形象，书写因此成为抵抗误解和建构自我的方式。由此，这种私人空间使“不完美”获得了抵抗父权主体神话的意义。","link":"这种私人空间使“不完美”获得了抵抗父权主体神话的意义。","page":"P65","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"莎菲","action":"日记中的独语构成女性自我空间的建构。","reason":"私人书写承认表达永远不完整，却也是人物可以脱离社会角色说话的空间","consequence":"这种私人空间使“不完美”获得了抵抗父权主体神话的意义。"}}],"traps":["把莎菲的犹豫和反复只当作性格缺点。","只写女性欲望，不分析她拒绝凌吉士时所表现的精神标准和主体判断。"]},{"id":"saffi-awakening-tragedy","work":"《莎菲女士的日记》","workKey":"saffi","type":"主题思想","title":"觉醒之后的结构性悲剧","prompt":"分析莎菲觉醒后的精神困境及其结构性悲剧。","keywords":["觉醒","精神困境","悲剧","孤独","理解","爱情"],"thesis":"莎菲的悲剧源于个体解放思想先于社会结构变化：她获得了判断、拒绝和保持尊严的权利，却没有得到新的关系、女性共同体与社会出路。","points":[{"point":"莎菲最初试图以个人欲望和快乐对抗沉闷现实。","evidence":"“我要，我要使我快乐。”","location":"病中独居阶段的日记，人物直接表达对生命快乐和自我满足的渴望。","explain":"这句自我要求把快乐从道德负担中解放出来，显示莎菲已经不愿只按社会期待生活。她没有外部条件支持，只能以强烈的主观愿望维持自我，这为后来的失望和漂泊埋下起点。由此，个人觉醒已经发生，现实基础仍然薄弱。","link":"个人觉醒已经发生，现实基础仍然薄弱。","page":"待核","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"前","chain":{"who":"莎菲","action":"莎菲最初试图以个人欲望和快乐对抗沉闷现实。","reason":"她没有外部条件支持，只能以强烈的主观愿望维持自我，这为后来的失望和漂泊埋下起点","consequence":"个人觉醒已经发生，现实基础仍然薄弱。"}},{"point":"外部评价把女性欲望和选择转成道德风险，持续压制莎菲。","evidence":"“一个女人这样放肆，是不会得到好结果的。”","location":"莎菲与凌吉士交往及自我反思阶段的日记。","explain":"这句话把社会规训伪装成对女性命运的提醒，莎菲能够怀疑它，却无法摆脱它造成的羞耻和恐惧。觉醒越深，她越能感到外部评价的控制，日常选择因此始终伴随代价。由此，个体解放与社会结构之间的落差构成悲剧的现实基础。","link":"个体解放与社会结构之间的落差构成悲剧的现实基础。","page":"P45","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"莎菲","action":"外部评价把女性欲望和选择转成道德风险，持续压制莎菲。","reason":"这句话把社会规训伪装成对女性命运的提醒，莎菲能够怀疑它，却无法摆脱它造成的羞耻和恐惧","consequence":"个体解放与社会结构之间的落差构成悲剧的现实基础。"}},{"point":"独自离城说明人物只能以撤退保存觉醒，无法完成真正解放。","evidence":"“我又将一人寂寂寞寞地离开这古城了。”","location":"小说结尾：莎菲决定搭车南下，离开北京和既有关系。","explain":"离开让她停止继续妥协，也把全部后果留给自己，新的关系、组织和公共空间都没有出现。丁玲由此写出觉醒新女性的结构困境，思想已经变化，社会环境仍无法承接这种变化。由此，结尾把个人悲剧提升为时代和结构性问题。","link":"结尾把个人悲剧提升为时代和结构性问题。","page":"待核","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"莎菲","action":"独自离城说明人物只能以撤退保存觉醒，无法完成真正解放。","reason":"离开让她停止继续妥协，也把全部后果留给自己，新的关系、组织和公共空间都没有出现","consequence":"结尾把个人悲剧提升为时代和结构性问题。"}}],"traps":["把悲剧归因于莎菲性格敏感、犹豫或不懂珍惜。","把离开写成彻底解放，忽略她缺少社会支持和现实出路。"]},{"id":"saffi-enlightenment-revolution","work":"《莎菲女士的日记》","workKey":"saffi","type":"主题思想","title":"自由恋爱的启蒙悖论","prompt":"结合启蒙与革命语境，分析莎菲的“自由恋爱”为什么没有带来真正解放。","keywords":["启蒙","革命","自由恋爱","个性解放","女性","悖论"],"thesis":"自由恋爱把个人从传统中解放出来，却没有提供能够承接女性主体性的社会结构和精神共同体；莎菲拒绝凌吉士，正暴露启蒙话语在性别和阶级层面的边界。","points":[{"point":"自由恋爱最初表现为女性主动追求个人欲望和情感选择。","evidence":"“颀长的身躯，白嫩的面庞，薄薄的小嘴唇，柔软的头发。”","location":"莎菲初次接触并观察凌吉士的日记段落。","explain":"女性从被选择和被观看的位置转为欲望主体，主动感受、选择和追求。自由恋爱因此首先是权利意识觉醒，但解放仍寄托在具体男性身上，尚未触及社会独立条件。由此，启蒙给了她爱的自由，却没有同时给她独立的现实基础。","link":"启蒙给了她爱的自由，却没有同时给她独立的现实基础。","page":"P43","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"前","chain":{"who":"莎菲","action":"自由恋爱最初表现为女性主动追求个人欲望和情感选择。","reason":"由此，启蒙给了她爱的自由，却没有同时给她独立的现实基础","consequence":"启蒙给了她爱的自由，却没有同时给她独立的现实基础。"}},{"point":"凌吉士的拜金、肉欲和自我享乐人格，暴露自由恋爱背后的资本主义男权逻辑。","evidence":"“当我明白了那使我爱慕的一个高贵的美形里，是安置着如此一个卑劣灵魂。”","location":"莎菲认清凌吉士真实面目后的心理转折。","explain":"爱情对象代表现代都市身份与情场魅力，其价值观仍以金钱、肉欲和自我享乐为中心。人物拒绝后，启蒙自由的局限被揭开，两性关系中的权力和欲望结构并未自动改变。由此，恋爱自由因此显现出性别与阶级的双重边界。","link":"恋爱自由因此显现出性别与阶级的双重边界。","page":"P58","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"凌吉士","action":"凌吉士的拜金、肉欲和自我享乐人格，暴露自由恋爱背后的资本主义男权逻辑。","reason":"爱情对象代表现代都市身份与情场魅力，其价值观仍以金钱、肉欲和自我享乐为中心","consequence":"恋爱自由因此显现出性别与阶级的双重边界。"}},{"point":"找不到新的精神共同体，使个体只能退回日记并保持孤独。","evidence":"“谁能懂得我呢，便能懂得这只能表现我万分之一的日记。”","location":"莎菲与亲友、爱人关系受挫后继续写日记的段落。","explain":"私人书写保存不愿妥协的自我，却无法建立新的社会联系。女性没有共同体、公共空间或制度承接觉醒，自由只能由个人承担后果，思想解放因此留下精神漂流。由此，莎菲的困境为丁玲及新文学主体其后转向革命提供了深层注脚。","link":"莎菲的困境为丁玲及新文学主体其后转向革命提供了深层注脚。","page":"P65","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"莎菲","action":"找不到新的精神共同体，使个体只能退回日记并保持孤独。","reason":"私人书写保存不愿妥协的自我，却无法建立新的社会联系","consequence":"莎菲的困境为丁玲及新文学主体其后转向革命提供了深层注脚。"}}],"traps":["把自由恋爱写成纯粹的个性胜利。","只批判凌吉士个人道德，不分析他所代表的物质主义和男权逻辑。"]},{"id":"water-intellectual-stance","work":"《水》","workKey":"water","type":"主题思想","title":"《水》中的知识分子立场","prompt":"分析《水》如何体现作者的知识分子立场。","keywords":["知识分子立场","第三种声音","人道主义","隐含作者","群众","反思"],"thesis":"《水》在左翼革命叙事之外保留了知识分子的同情、观察和反思，使灾难书写不仅歌颂群众，也追问人的尊严和社会责任。","points":[{"point":"作品首先以人的苦难作为叙事起点。","evidence":"“那些被骂着的女人，一批一批的，在无可奈何之中，含着眼泪，含着一线希望，扶老携幼向着相反的方向跑去，带着哭和叫，带着骚扰和不安，向原野的四方伸去。”","location":"第一部分灾民逃难：重点找作者如何写眼泪、希望、妇女和儿童的具体处境。","explain":"群像细节先呈现具体生命的恐惧和挣扎，作者保留对个体尊严的关注。群众没有直接成为抽象革命力量，人的苦难构成知识分子立场的情感基础。由此，人道关怀构成知识分子立场的基础。","link":"人道关怀构成知识分子立场的基础。","page":"P226","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"前","chain":{"who":"作者与叙事者","action":"作品首先以人的苦难作为叙事起点。","reason":"群众没有直接成为抽象革命力量，人的苦难构成知识分子立场的情感基础","consequence":"人道关怀构成知识分子立场的基础。"}},{"point":"人物语言呈现对现实原因的追问。","evidence":"“哭有什么用，死的死去了，哭得转来吗？”","location":"第一至二部分王大保讲话及灾民与官员交涉：人物语言如何把苦难引向对现实原因的追问。","explain":"人物语言把行动问题交给底层自己回答，提问同时追问灾害为何不断加重。读者因此看到具体权力关系，单一天灾解释无法覆盖社会根源。由此，群众叙述和知识分子反思由此同时存在。","link":"群众叙述和知识分子反思由此同时存在。","page":"P228","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"作者与叙事者","action":"人物语言呈现对现实原因的追问。","reason":"读者因此看到具体权力关系，单一天灾解释无法覆盖社会根源","consequence":"群众叙述和知识分子反思由此同时存在。"}},{"point":"结尾的集体反抗仍保留作者对力量转向的观察。","evidence":"“比水还凶猛的，朝镇上扑了过去。”","location":"第四部分结尾：群众集体冲向镇上，重点看作者怎样肯定反抗力量，又保留对人物情感和处境的观察。","explain":"叙述肯定底层获得行动能力，也没有省略力量形成过程。作者既认可反抗，又持续观察恐惧、饥饿和愤怒如何转化，革命叙事中仍保留知识分子的反思。","link":"结论要把“向人”和“向左”连接起来。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"作者","action":"结尾的集体反抗仍保留作者对力量转向的观察。","reason":"叙述肯定底层获得行动能力，也没有省略力量形成过程","consequence":"作者既认可反抗，又持续观察恐惧、饥饿和愤怒如何转化，革命叙事中仍保留知识分子的反思"}}],"traps":["只把《水》解释成左翼口号，忽略人道关怀。","只谈灾害，不分析作者和隐含叙事者的立场。"]},{"id":"water-1930s-ecology","work":"《水》","workKey":"water","type":"比较阅读","title":"灾害书写与1930年代文学生态","prompt":"结合1930年代上海文学生态，分析《水》灾害书写中的左翼文学特征。","keywords":["1930年代","文学生态","灾害书写","左翼文学","比较","上海"],"thesis":"《水》把自然灾害、官僚压迫和群众觉醒接合起来，体现左翼文学关注底层和社会改造的方向，也显示1930年代文学思潮相互碰撞的多元生态。","points":[{"point":"灾害描写一开始就和社会环境连在一起。","evidence":"“愁惨的天照着黄色的滔滔的大水，那一夜淹了汤家阙，又淹了一渡口的一片汪洋的大水。”","location":"第一部分开头：洪水逼近并毁坏村庄，重点看自然环境怎样立即带出贫困和社会脆弱。","explain":"具体生活空间被灾难吞没，村庄、田地和家庭成为破坏对象。作品从生存危机进入底层贫困和社会脆弱性，灾害书写带有明显社会观察。由此，灾害因此成为观察社会结构的入口。","link":"灾害因此成为观察社会结构的入口。","page":"P226","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"前","chain":{"who":"灾民群众","action":"灾害描写一开始就和社会环境连在一起。","reason":"具体生活空间被灾难吞没，村庄、田地和家庭成为破坏对象","consequence":"灾害因此成为观察社会结构的入口。"}},{"point":"官僚和军队的行为把天灾转化为社会悲剧。","evidence":"“帆船却又带来了一些军火，并没有带救济米。”","location":"第二至三部分：官府处理灾情、军火替代救济米，重点找权力和阶级关系。","explain":"权力机构在救灾时刻的实际选择揭示阶级立场。政治反差把灾害记录推向社会批判，并与左翼文学对权力结构的关注相连。","link":"这种问题意识与左翼文学的社会分析相呼应。","page":"P231","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"灾民群众","action":"官僚和军队的行为把天灾转化为社会悲剧。","reason":"权力机构在救灾时刻的实际选择揭示阶级立场","consequence":"政治反差把灾害记录推向社会批判，并与左翼文学对权力结构的关注相连"}},{"point":"群众反抗体现文学从揭露问题走向行动想象。","evidence":"“比水还凶猛的，朝镇上扑了过去。”","location":"第四部分结尾：群众集体反抗，重点看作品如何从揭露问题走向社会改造想象。","explain":"灾害的破坏力被改写为集体行动力，作品从揭露问题走向行动想象。这种转向呼应1930年代左翼文学对社会出路的探索。","link":"结尾要说明它和1930年代多元文学思潮之间的互动。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"群众","action":"群众反抗体现文学从揭露问题走向行动想象。","reason":"灾害的破坏力被改写为集体行动力，作品从揭露问题走向行动想象","consequence":"这种转向呼应1930年代左翼文学对社会出路的探索"}}],"traps":["把灾害小说仅仅当作灾难记录。","比较时只写共同点，不说明《水》的政治指向。"]},{"id":"water-discourse-tension","work":"《水》","workKey":"water","type":"主题思想","title":"个性话语与革命话语的张力","prompt":"分析《水》如何呈现个性话语与革命话语之间的张力。","keywords":["个性话语","革命话语","冯雪峰","左翼批评","群众","情感"],"thesis":"《水》一方面走向宏大的革命和群众叙事，另一方面仍保存个体恐惧、悲痛和复杂情感，文本因此留下个性话语与革命话语相互牵引的张力。","points":[{"point":"个体苦难仍然是革命叙事不可抹去的部分。","evidence":"“那些被骂着的女人，一批一批的，在无可奈何之中，含着眼泪，含着一线希望，扶老携幼向着相反的方向跑去，带着哭和叫，带着骚扰和不安，向原野的四方伸去。”","location":"第一部分灾民逃难：重点找妇女哭喊、扶老携幼等个体情感，看它们如何保留在革命叙事中。","explain":"逃亡、哭叫和家庭迁徙构成叙事最强的现实压力。革命叙事必须先承载个体痛苦，集体觉醒才有真实的人性根底。由此，这构成文本中个性话语的留存。","link":"这构成文本中个性话语的留存。","page":"P226","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"前","chain":{"who":"作者与叙事者","action":"个体苦难仍然是革命叙事不可抹去的部分。","reason":"逃亡、哭叫和家庭迁徙构成叙事最强的现实压力","consequence":"这构成文本中个性话语的留存。"}},{"point":"革命话语通过政治反差把个人苦难引向社会批判。","evidence":"“帆船却又带来了一些军火，并没有带救济米。”","location":"第二至三部分：军火与救济米的反差把求生问题引向权力批判。","explain":"物资反差把个人求生引向权力质疑，革命话语从现实利益判断中生长。个体苦难获得社会批判方向，群众觉醒与现实处境相连。由此，两种话语彼此依存并互相推动。","link":"两种话语彼此依存并互相推动。","page":"P231","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"灾民群众","action":"革命话语通过政治反差把个人苦难引向社会批判。","reason":"物资反差把个人求生引向权力质疑，革命话语从现实利益判断中生长","consequence":"两种话语彼此依存并互相推动。"}},{"point":"集体行动仍然包含鲜明的情感力量。","evidence":"“比水还凶猛的，朝镇上扑了过去。”","location":"第四部分结尾：群众行动由悲痛、饥饿和愤怒积聚而成，重点看集体行动中的情感动力。","explain":"集体行动的力量来自悲痛、饥饿和愤怒，群众保持具体情感，并未成为抽象主体。革命话语与个性话语因此互相依赖，也持续拉扯。","link":"结尾要说明革命转向背后的复杂情感动力。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"灾民群众","action":"集体行动仍然包含鲜明的情感力量。","reason":"集体行动的力量来自悲痛、饥饿和愤怒，群众保持具体情感，并未成为抽象主体","consequence":"革命话语与个性话语因此互相依赖，也持续拉扯"}}],"traps":["把个性话语和革命话语看作完全对立。","只讨论革命主题，不分析个体情感怎样进入集体叙事。"]},{"id":"hospital-individual-collective","work":"《在医院中》","workKey":"hospital","type":"主题思想","title":"个体理想与集体秩序","prompt":"分析《在医院中》如何思考个体理想与集体秩序之间的关系。","keywords":["个体","集体","理想","秩序","陆萍","改造"],"thesis":"医院同时是个体实践的场所和集体秩序的现场。小说把陆萍的专业理想、组织纪律和医院现实放在同一空间中，呈现个体需要实践、集体需要反思的双向磨合。","points":[{"point":"陆萍把病人和产妇的基本需要带进医院管理，使个人专业理想指向公共服务。","evidence":"“为了不愿病人产妇多受苦痛，便自己去替几个开刀了的，发炎的换药。”","location":"第二部分：陆萍主动承担护理劳动，以行动回应病人和产妇的痛苦。","explain":"个人理想首先表现为照顾具体生命和承担实际劳动，因此其方向指向集体服务。冲突来自改善现实的方法、顺序和资源限制，不能用简单的个人对抗集体概括。由此，个体与集体关系的起点落在共同服务病人的实践目标上。","link":"个体与集体关系的起点落在共同服务病人的实践目标上。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"前","chain":{"who":"陆萍","action":"陆萍把病人和产妇的基本需要带进医院管理，使个人专业理想指向公共服务。","reason":"冲突来自改善现实的方法、顺序和资源限制，不能用简单的个人对抗集体概括","consequence":"个体与集体关系的起点落在共同服务病人的实践目标上。"}},{"point":"集体中的标签化使工作问题无法被正常讨论。","evidence":"“小资产阶级意识、知识分子的英雄主义、自由主义等等的帽子都往她头上戴。”","location":"第二至三部分：她提出意见书、与同事和管理者发生冲突，并被贴上“小资产阶级意识”等标签。","explain":"身份判断取代具体分析，人物的意见失去被理解的机会。集体以标签维护旧秩序，也压抑专业改进可能，官僚和麻木成为内部阻力。由此，个体需要调整，集体同样需要自我反思。","link":"个体需要调整，集体同样需要自我反思。","page":"P394","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"陆萍与医院环境","action":"集体中的标签化使工作问题无法被正常讨论。","reason":"由此，个体需要调整，集体同样需要自我反思","consequence":"个体需要调整，集体同样需要自我反思。"}},{"point":"朋友、病人和老同志的帮助使陆萍转向更成熟的实践。","evidence":"“她仍然是那样兴致很浓厚的去照顾着那些产妇，那些婴儿，为着她们一点点的需索，去同管理员，总务处，秘书长，甚至院长去争执。”","location":"第四部分：陆萍与朋友、老同志交流后继续照顾病人并为资源交涉，观察个人行动方式的变化。","explain":"朋友、病人和老同志的支持让人物继续为具体需要奔走，并学会让理想适应现实节奏。个体与集体关系从单纯冲突转向实践调整，关怀仍处于核心。","link":"结论应落在个体与集体的双向成长。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"陆萍","action":"朋友、病人和老同志的帮助使陆萍转向更成熟的实践。","reason":"朋友、病人和老同志的支持让人物继续为具体需要奔走，并学会让理想适应现实节奏","consequence":"个体与集体关系从单纯冲突转向实践调整，关怀仍处于核心"}}],"traps":["把陆萍写成完全正确、集体完全错误的二元对立。","只谈组织纪律，不分析医院管理中的官僚主义和专业缺失。"]},{"id":"hospital-dual-luping","work":"《在医院中》","workKey":"hospital","type":"人物形象","title":"“产科助手”与“理想人物”的双重分裂","prompt":"为什么说陆萍是在“产科助手”与“理想人物”之间游移、分裂的形象？","keywords":["陆萍","产科助手","理想人物","双重分裂","身份","成长"],"thesis":"陆萍的复杂性来自现实中的产科助手、五四新女性、现代医学知识者和理想革命者等多重身份。创作理想不断要求她成为坚强人物，现实细节却不断暴露她的脆弱、热情和困惑。","points":[{"point":"理想自我要求她用理智压住脆弱，努力建设新的希望。","evidence":"“她竭力安慰自己，鼓励自己，骂自己，又替自己建筑着新的希望的楼阁，努力使自己在这楼阁中睡去。”","location":"第一部分：陆萍在窑洞中反复安慰自己、鼓励自己、骂自己，努力把不安压下去。","explain":"人物用多种方式要求自己维持坚强，希望因此带有自我麻醉成分。理想自我与现实感受没有真正调和，主体分裂在反复自我说服中显现。由此，人物的坚强和脆弱在同一种自我调整中同时出现。","link":"人物的坚强和脆弱在同一种自我调整中同时出现。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"前","chain":{"who":"陆萍与医院环境","action":"理想自我要求她用理智压住脆弱，努力建设新的希望。","reason":"人物用多种方式要求自己维持坚强，希望因此带有自我麻醉成分","consequence":"人物的坚强和脆弱在同一种自我调整中同时出现。"}},{"point":"产科助手的现实身份不断把她拉回具体、琐碎而疼痛的医疗工作。","evidence":"“为了不愿病人产妇多受苦痛，便自己去替几个开刀了的，发炎的换药。”","location":"第一部分至第二部分：她替开刀、发炎的病人换药，照料产妇和婴儿，把理想落实为产科助手的劳动。","explain":"理想期待无法替代护理和换药等实际劳动，具体工作让她看见病人、产妇和医疗条件的真实处境。现实身份给批判提供经验，也持续拉扯理想自我。由此，两种身份的冲突推动人物由想象走向实践。","link":"两种身份的冲突推动人物由想象走向实践。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"陆萍与医院环境","action":"产科助手的现实身份不断把她拉回具体、琐碎而疼痛的医疗工作。","reason":"理想期待无法替代护理和换药等实际劳动，具体工作让她看见病人、产妇和医疗条件的真实处境","consequence":"两种身份的冲突推动人物由想象走向实践。"}},{"point":"受挫后的陆萍没有被彻底改造，却在继续行动中逐渐弥合主体裂隙。","evidence":"“她仍然是那样兴致很浓厚的去照顾着那些产妇，那些婴儿，为着她们一点点的需索，去同管理员，总务处，秘书长，甚至院长去争执。”","location":"第三至四部分：中毒事件后她情绪崩溃，随后仍照顾病人、争取资源，并准备继续学习和工作。","explain":"受挫后继续为具体需要奔走，说明理想并未被现实完全击碎。人物把愿望落实为可持续行动，分裂逐渐转向稳定责任意识，她从热血青年成长为实践者。由此，成长的价值在于主体裂隙得到实践中的调整，人物并未被抹平。","link":"成长的价值在于主体裂隙得到实践中的调整，人物并未被抹平。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"陆萍","action":"受挫后的陆萍没有被彻底改造，却在继续行动中逐渐弥合主体裂隙。","reason":"受挫后继续为具体需要奔走，说明理想并未被现实完全击碎","consequence":"成长的价值在于主体裂隙得到实践中的调整，人物并未被抹平。"}}],"traps":["把陆萍的分裂简单归因于性格前后矛盾。","只写她最终成为有用的人，忽略她保留的敏感、脆弱和主体复杂性。"]},{"id":"hospital-growth-useful","work":"《在医院中》","workKey":"hospital","type":"主题思想","title":"从迷惘青年到更清醒的实践者","prompt":"分析陆萍如何从迷惘青年走向“有用的人”。","keywords":["成长叙事","有用的人","多重主体","蜕变","革命","青年"],"thesis":"陆萍的成长体现一个复合主体从理想冲动走向现实实践的过程。她保留批判意识，也逐渐理解革命工作的艰难、策略和持续学习的重要性。","points":[{"point":"陆萍的专业训练和公共责任使她持续发现问题，并在反馈受阻时陷入现实裂隙。","evidence":"“她常常为了他们的生活管理，和医疗的改善与很多人发生冲突。”","location":"第一部分：陆萍从生活管理和医疗改善入手提出意见，并因此与多人发生冲突。","explain":"她能够发现问题，来自专业训练与主动承担公共责任；她遭遇阻力，则暴露个人行动与现实制度之间的距离。成长问题因此表现为如何继续负责，又减少盲目冲突。由此，前段冲突让“有用的人”需要在实践中重新理解个人与集体。","link":"前段冲突让“有用的人”需要在实践中重新理解个人与集体。","page":"P387","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"前","chain":{"who":"陆萍","action":"陆萍的专业训练和公共责任使她持续发现问题，并在反馈受阻时陷入现实裂隙。","reason":"她能够发现问题，来自专业训练与主动承担公共责任","consequence":"前段冲突让“有用的人”需要在实践中重新理解个人与集体。"}},{"point":"外部误解和自我怀疑迫使她重新认识个人英雄主义的局限。","evidence":"“小资产阶级意识、知识分子的英雄主义、自由主义等等的帽子都往她头上戴。”","location":"第二至三部分：意见书被排斥、中毒事件爆发、流言和病痛叠加，重点看她如何重新认识自己。","explain":"身份化批评方式粗暴，却迫使人物面对个人热情的局限。她逐渐认识到改善机构和关系还需要理解群众、策略和长期实践。由此，成长来自对自我与环境的双重认识。","link":"成长来自对自我与环境的双重认识。","page":"P394","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"陆萍与医院环境","action":"外部误解和自我怀疑迫使她重新认识个人英雄主义的局限。","reason":"她逐渐认识到改善机构和关系还需要理解群众、策略和长期实践","consequence":"成长来自对自我与环境的双重认识。"}},{"point":"结尾选择继续学习和实践，使“有用的人”具有开放而积极的含义。","evidence":"“她准备着如何可以使自己不失去这一个机会。”","location":"第四部分结尾：陆萍接受朋友和老同志的开导，准备抓住新的工作与学习机会。","explain":"人物没有停在受害者位置，也不把离开视为成长失败，她继续寻找能够发挥价值的行动机会。有用因此意味着经历困难后仍保持责任、持续学习并选择实践。由此，结尾把成长写成开放过程，而非封闭的成功或失败。","link":"结尾把成长写成开放过程，而非封闭的成功或失败。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"陆萍与医院环境","action":"结尾选择继续学习和实践，使“有用的人”具有开放而积极的含义。","reason":"人物没有停在受害者位置，也不把离开视为成长失败，她继续寻找能够发挥价值的行动机会","consequence":"结尾把成长写成开放过程，而非封闭的成功或失败。"}}],"traps":["把“有用的人”简化为对组织的被动服从。","把开放结尾判定为完全失败，忽略人物的主动选择。"]}];

function predictionCard(x){var first=firstRelated(x);return '<div class="point"'+(first?' data-open="'+esc(first.id)+'" style="cursor:pointer"':'')+'><div class="meta"><span class="tag">'+esc(x.confidence)+'概率</span><span class="tag">预测方向</span></div><div class="pointTitle">'+esc(x.title)+'</div><div class="field"><b>题目在问什么</b>'+esc(x.plain||x.question)+'</div><div class="field"><b>考场设问</b>'+esc(x.question)+'</div>'+(first?'<div class="field"><b>写作起点</b>'+esc(first.thesis)+'</div><button type="button" class="primary" data-open="'+esc(first.id)+'">打开对应答题页</button><div class="hint">进入后查看完整母题和 Paper 3 写作路径。</div>':'')+'<div class="field"><b>判断依据</b>'+esc(x.basis)+'</div>'+relatedButtons(x.relatedIds)+'</div>'}
function pastView(){var chips='<div class="chips"><button class="'+(state.work==="all"?"on":"")+'" data-past-work="all">全部</button>'+Object.keys(WORKS).map(function(k){return '<button class="'+(state.work===k?"on":"")+'" data-past-work="'+k+'">'+esc(WORKS[k])+'</button>'}).join("")+'</div>';var past=PAST.past.filter(function(x){return state.work==="all"||x.workKey===state.work});var preds=PAST.predictions.filter(function(x){return state.work==="all"||x.workKey===state.work});return chips+'<div class="panel"><h2>历年真题与时考方向</h2><p>'+esc(PAST.coverageNote)+'</p><p style="margin-top:7px">'+esc(PAST.structureNote)+'</p><div class="hint">'+esc(PAST.sourceNote)+'</div></div><div class="panel"><h3>已考真题与官方样卷</h3>'+past.map(pastCard).join("")+'</div><div class="panel"><h3>高概率预测方向</h3>'+preds.map(predictionCard).join("")+'</div>'}
function drawView(){var pool=DATA.filter(function(x){return state.work==="all"||x.workKey===state.work});var remaining=pool.filter(function(x){return state.drawHistory.indexOf(x.id)<0});var chips='<div class="chips"><button class="'+(state.work==="all"?"on":"")+'" data-draw-work="all">全部</button>'+Object.keys(WORKS).map(function(k){return '<button class="'+(state.work===k?"on":"")+'" data-draw-work="'+k+'">'+esc(WORKS[k])+'</button>'}).join("")+'</div>';if(state.drawItem){var x=state.drawItem;return chips+'<div class="panel"><div class="meta"><span class="tag">'+esc(workName(x.workKey))+'</span><span class="tag">'+esc(x.type)+'</span></div><h2>'+esc(x.title)+'</h2><p>'+esc(x.prompt)+'</p><div class="hint">先自己想：对应哪几个论点？分别在原文哪里？</div><button class="primary" id="openDraw">看论点与原文定位</button><button class="ghost" id="drawAgain" style="margin-top:8px">再抽一道</button></div><div class="hint">本轮已抽 '+state.drawHistory.length+' 道</div>'}return chips+'<div class="panel"><h2>随机抽取一道文学赏析题</h2><p>抽题后先自己组织论点，再点开看原文定位。</p><button class="primary" id="doDraw">抽取题目</button></div>'+(remaining.length?'<div class="hint">当前范围还可抽 '+remaining.length+' 道</div>':'<div class="hint">当前范围已经抽完，再抽一轮会自动重新开始。</div>')}
function detailView(x){var points=x.points.map(function(p,i){var bits=[];var stageNames={前:"前段",中:"中段",后:"后段"};if(p.stage)bits.push('全书阶段：'+esc(stageNames[p.stage]||p.stage));if(p.chapter)bits.push('章节：'+esc(p.chapter));if(p.pdfPage)bits.push('电子版PDF页：P'+esc(p.pdfPage));if(p.searchPhrase)bits.push('检索：'+esc(p.searchPhrase));if(p.page)bits.push('纸质页码：'+esc(p.page)+(p.edition?'（'+esc(p.edition)+'）':''));var page=bits.length?' · '+bits.join(' · '):'';return '<div class="point"><div class="pointTitle">主体段 '+(i+1)+'｜论点句：'+esc(p.point)+'</div><div class="field"><b>引用原文</b>'+esc(p.evidence)+'</div><div class="loc">引文定位：'+esc(p.location)+page+'</div><div class="field"><b>文学论证</b>'+esc(p.explain)+'</div><div class="field"><b>回扣题目</b>'+esc(p.link)+'</div></div>'}).join("");var guide='<div class="panel"><h3>Paper 3 写作路径</h3><div class="field"><b>第一步 审题</b>确认题目要分析的对象、任务和限定语：'+esc(x.prompt)+'</div><div class="field"><b>第二步 定中心</b>开头直接给出文章判断：'+esc(x.thesis)+'</div><div class="field"><b>第三步 写主体段</b>每一段按照“论点句、引用原文、文学论证、回扣题目”的顺序推进。下面的三个主体段就是可以直接模仿的写法。</div><div class="field"><b>第四步 收束全文</b>结尾回答题目中的核心问题，并回扣人物、主题或时代意义，不再增加新的论点。</div></div>';var traps=x.traps.map(function(t){return '<div class="warn"><b>不扣题写法</b>'+esc(t)+'</div>'}).join("");var focus='<div class="good"><b>扣题写法</b>每一段都要回答题目：“'+esc(x.prompt)+'”。引用后必须说明这句话怎样证明中心判断：“'+esc(x.thesis)+'”。</div>';return '<span class="back" id="back">← 返回</span><div class="panel"><div class="meta"><span class="tag">'+esc(workName(x.workKey))+'</span><span class="tag">'+esc(x.type)+'</span></div><h2>'+esc(x.title)+'</h2><p>'+esc(x.prompt)+'</p><div class="thesis"><b>中心论点</b><br>'+esc(x.thesis)+'</div></div>'+guide+'<div class="panel"><button class="ghost" id="toggleHide">'+(state.hide?"显示论点与原文定位":"先自己想，遮住答案")+'</button><div class="'+(state.hide?"hide":"")+'" id="answerBox" style="margin-top:12px"><h3>三个主体段</h3>'+points+'</div></div><div class="panel"><h3>扣题检查</h3><div class="hint">下面的提醒都是容易导致扣题失败的写法，不是答案示例。</div>'+focus+traps+'</div>'}
function render(){var app=document.getElementById("app");if(state.selected){var item=DATA.find(function(x){return x.id===state.selected});app.innerHTML=item?detailView(item):'<div class="empty">没有找到这道题</div>'}else{app.innerHTML=state.mode==="match"?matchView():state.mode==="past"?pastView():state.mode==="draw"?drawView():listView()}bind()}
function bind(){document.querySelectorAll("#tabs button").forEach(function(b){b.className=b.dataset.mode===state.mode?"on":"";b.onclick=function(){state.mode=b.dataset.mode;state.selected=null;state.hide=false;render()}});var search=document.getElementById("search");if(search)search.oninput=function(){state.query=this.value.trim();render();var el=document.getElementById("search");if(el){el.focus();el.selectionStart=el.selectionEnd=el.value.length}};document.querySelectorAll("[data-work]").forEach(function(b){b.onclick=function(){state.work=b.dataset.work;render()}});document.querySelectorAll("[data-past-work]").forEach(function(b){b.onclick=function(){state.work=b.dataset.pastWork;render()}});document.querySelectorAll("[data-draw-work]").forEach(function(b){b.onclick=function(){state.work=b.dataset.drawWork;state.drawItem=null;render()}});document.querySelectorAll("[data-open]").forEach(function(el){el.onclick=function(e){e.stopPropagation();state.selected=el.dataset.open;state.hide=false;render();window.scrollTo(0,0)}});document.querySelectorAll("[data-open] a").forEach(function(a){a.onclick=function(e){e.stopPropagation()}});document.querySelectorAll("[data-related]").forEach(function(b){b.onclick=function(e){e.stopPropagation();state.selected=b.dataset.related;state.hide=false;render();window.scrollTo(0,0)}});var box=document.getElementById("matchBox");if(box)box.oninput=function(){state.matchQuery=this.value};var doMatch=document.getElementById("doMatch");if(doMatch)doMatch.onclick=function(){state.matchQuery=document.getElementById("matchBox").value.trim();render()};var doDraw=document.getElementById("doDraw");if(doDraw)doDraw.onclick=function(){var pool=DATA.filter(function(x){return state.work==="all"||x.workKey===state.work});var remaining=pool.filter(function(x){return state.drawHistory.indexOf(x.id)<0});if(!remaining.length){state.drawHistory=[];remaining=pool}state.drawItem=remaining[Math.floor(Math.random()*remaining.length)];state.drawHistory.push(state.drawItem.id);render();window.scrollTo(0,0)};var openDraw=document.getElementById("openDraw");if(openDraw)openDraw.onclick=function(){state.selected=state.drawItem.id;state.hide=false;render();window.scrollTo(0,0)};var drawAgain=document.getElementById("drawAgain");if(drawAgain)drawAgain.onclick=function(){state.drawItem=null;render()};var back=document.getElementById("back");if(back)back.onclick=function(){state.selected=null;render()};var toggle=document.getElementById("toggleHide");if(toggle)toggle.onclick=function(){state.hide=!state.hide;render()}}
render();
</script>
</body>
</html>
