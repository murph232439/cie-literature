<script>
var DATA=[{"id":"saffi-character","work":"《莎菲女士的日记》","workKey":"saffi","type":"人物形象","title":"莎菲的主体性矛盾","prompt":"分析莎菲女士的性格矛盾及其思想意义。","keywords":["莎菲","矛盾","灵肉冲突","觉醒","孤独","女性"],"thesis":"莎菲的矛盾体现五四新一代知识女性在身体欲望、精神道德、自我尊严与父权现实之间形成的主体性冲突，远超一般性格反复。","points":[{"point":"莎菲敢于承认欲望，开始以女性自身感受确认主体存在。","evidence":"“我压制住我那狂热的欲念，我未曾请求他多留一会儿。”","location":"莎菲认识凌吉士后，反复书写情感与欲望的日记段落。","explain":"“狂热的欲念”正面写出莎菲对身体感受的确认，“压制住”和“未曾请求”又显示她仍在礼教与自尊的压力下收回行动。她保有欲望，也保留自我约束，在主动感受和被迫克制之间形成了刚刚萌生的主体意识。","link":"欲望的觉醒因此成为理解莎菲全部矛盾的前提。","page":"P61","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"她以精神契合和人格尊严为最高标准，拒绝让肉体欲望凌驾于道德判断。","evidence":"“当我明白了那使我爱慕的一个高贵的美形里，是安置着如此一个卑劣灵魂。”","location":"莎菲看清凌吉士真实面目后的心理转折。","explain":"“高贵的美形”与“卑劣灵魂”的对照超出外貌与内在的一般差异，它把凌吉士所代表的金钱、肉欲和自我享乐人格暴露出来。莎菲仍然受到欲望吸引，却拒绝用精神尊严换取感官满足，这种克制显示她对传统贞操观的超越，也体现新知识女性对爱情对象和自身人格提出的更高道德要求。","link":"她的拒绝因此是一次主体判断，同时也结束了一段无法继续的恋爱关系。","page":"P58","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"她的孤独来自主体觉醒后缺乏能够承载新女性的社会关系和共同体。","evidence":"“我总愿意有那么一个人能了解得我清清楚楚的。”","location":"莎菲与亲友、爱人相处时反复出现的失望和独处。","explain":"莎菲要求的是对完整精神世界的理解，普通的照顾无法满足这一尺度。亲友可以提供陪伴，却仍用传统标准衡量她；爱情对象也无法回应她的精神尺度，因此她越坚持自我，越缺少能够安放自我的关系。孤独来自个体觉醒快于社会关系变革，与天生性格孤僻无关。","link":"矛盾形象由此通向五四新女性的结构性困境。","page":"P40","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把莎菲的矛盾只解释为摇摆不定的性格。","只写灵肉冲突，不说明她为何拒绝凌吉士以及这一拒绝的道德意义。"]},{"id":"saffi-awakening","work":"《莎菲女士的日记》","workKey":"saffi","type":"主题思想","title":"觉醒后的困境","prompt":"结合文本，谈谈莎菲的觉醒与困境。","keywords":["觉醒","困境","五四","新女性","自由","现实"],"thesis":"莎菲的觉醒让她看清传统束缚，却也让她陷入无路可走的现实困境。","points":[{"point":"她在思想上已经不再接受传统女性角色。","evidence":"“一个女人这样放肆，是不会得到好结果的。”","location":"莎菲面对爱情、身体和社交规范时的日记独白。","explain":"“一个女人这样放肆，是不会得到好结果的”表面上是在评价莎菲，实际暴露了外部世界对女性身体和情感的规训。莎菲意识到这句话的不合理，说明她已经不再把“好女人”的标准视为天然真理，但外界仍旧用它来界定她。","link":"但觉醒并不自动带来出路。","page":"P45","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"她的现实环境没有为她提供新的精神位置。","evidence":"“一个正经女人所做不出来的。”","location":"莎菲与朋友、凌吉士相处时产生的失望和疏离。","explain":"“一个正经女人所做不出来的”将私人选择变成道德审判，显示莎菲面对的是具体的人际压力和舆论限制，新旧冲突因此落在她的日常生活中。她即使产生了新的自我意识，也找不到新的社会位置，只能在旧标准内部反复解释和挣扎。","link":"困境来自个人觉醒与社会条件之间的落差。","page":"P46","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"丁玲借莎菲写出五四女性的真实处境。","evidence":"“我总愿意有那么一个人能了解得我清清楚楚的。”","location":"全篇日记的情绪推进和结尾的失落感。","explain":"“我总愿意有那么一个人能了解得我清清楚楚的”把人物的渴望从爱情提升到精神理解。莎菲需要的是有人进入她的内心、承认她的复杂，简单的陪伴或劝告无法替代这种理解；这种理解始终落空，正说明五四女性觉醒后仍缺少能够承载她们新意识的关系和空间。","link":"结论要回到“觉醒与困境并存”这一核心判断。","page":"P40","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把觉醒写成彻底解放，忽略觉醒后仍处于困境。","只谈五四背景，不引用莎菲的具体心理和行为。"]},{"id":"saffi-psychology","work":"《莎菲女士的日记》","workKey":"saffi","type":"艺术手法","title":"心理描写的作用","prompt":"分析《莎菲女士的日记》中心理描写的作用。","keywords":["心理描写","日记体","内心","手法","作用","独白"],"thesis":"丁玲用日记体心理描写把莎菲的欲望、羞耻、清醒与孤独直接呈现在读者面前，使人物矛盾具有真实的心理层次。","points":[{"point":"日记体让人物可以不断暴露真实想法。","evidence":"“谁能懂得我呢，便能懂得这只能表现我万分之一的日记。”","location":"全篇以莎菲第一人称写成的日记段落。","explain":"“谁能懂得我”与“万分之一的日记”形成矛盾：日记让她说出不愿示人的心理，却又强调这种表达永远不完整。第一人称因此既制造了坦诚感，也制造了无法被完全理解的孤独，读者看到的是一个人不断解释自己、却始终得不到回应的过程。","link":"这使作品不同于只写外部行动的叙事。","page":"P65","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"心理描写把抽象的灵肉冲突变成可读的情绪过程。","evidence":"“我恨不得用脚尖踢出他去，不过我又为了另一种情绪所支配，我向他摇了头，表示是不厌烦他的来到。”","location":"莎菲与凌吉士关系变化前后的反复书写。","explain":"“恨不得踢出他去”写出恼怒和拒绝，“另一种情绪”又迫使她摇头掩饰，两个动作在一句话中互相冲突。莎菲的行动先于清晰的自我总结，她在欲望、自尊和羞耻同时作用下不断改变表情与决定，心理描写因此把抽象的灵肉冲突变成了可追踪的意识过程。","link":"手法分析要说明效果，不能只报“心理描写”这个术语。","page":"P61","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"心理描写同时承担揭示主题的功能。","evidence":"“谁能懂得我呢，便能懂得这只能表现我万分之一的日记。”","location":"日记中孤独感和失望感逐渐加重的段落。","explain":"“谁能懂得我”反复出现，使日记不再只是记录事件的工具，而成为人物寻找自我的方式。莎菲越是在日记中追问，越说明现实中没有可以承接她的话，个人心理因此直接通向五四新女性被时代困住的主题。","link":"结尾要回到心理描写与主题之间的关系。","page":"P65","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["只写“大量心理描写”，没有分析具体心理变化。","引用后不解释，直接下“人物很矛盾”的结论。"]},{"id":"saffi-love","work":"《莎菲女士的日记》","workKey":"saffi","type":"人物关系","title":"精神标准与世俗人格的冲突","prompt":"分析莎菲对凌吉士由倾慕转为鄙弃的原因及其思想意义。","keywords":["凌吉士","爱情","迷恋","厌恶","欲望","选择"],"thesis":"莎菲对凌吉士的否定体现新知识女性以精神契合、人格独立和道德自持为标准，抗拒以金钱、肉欲和自我享受为核心的世俗人格，意义已经超出普通爱情幻灭。","points":[{"point":"莎菲主动凝视并承认欲望，体现女性作为欲望主体的觉醒。","evidence":"“颀长的身躯，白嫩的面庞，薄薄的小嘴唇，柔软的头发。”","location":"莎菲初次接触并观察凌吉士的日记段落。","explain":"“颀长”“白嫩”“柔软”等细节来自莎菲对男性身体的主动审视，打破了男性目光对女性的塑造。她拥有感受、欲望和评价权力，已经从被观看、被选择的对象转为欲望主体，这正是她与传统女性形象最明显的分野。","link":"欲望主体性的获得，为后文她拒绝凌吉士提供了精神前提。","page":"P43","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"凌吉士的卑劣在于把金钱、肉欲和自我享受当作人生目的，莎菲以精神契合和道德自持否定这种世俗人格。","evidence":"“当我明白了那使我爱慕的一个高贵的美形里，是安置着如此一个卑劣灵魂。”","location":"莎菲认清凌吉士真实面目后的心理转折。","explain":"凌吉士的美貌原本能够激起莎菲的欲望，但“卑劣灵魂”揭穿了他追求金钱、情欲和个人享乐的市侩本质。莎菲在欲望尚未消失时仍选择推开他，说明她要求爱情中必须有精神共鸣和人格尊严；拒绝凌吉士，实际上是否定一种以物质和肉欲为中心的现代男性价值观。","link":"这场拒绝把恋爱问题提升为知识女性的人格选择。","page":"P58","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"拒绝凌吉士使她守住自我，却也因为没有新的社会出路而加深孤独。","evidence":"“你是在想念那高个儿的影子呢！”","location":"莎菲与凌吉士关系结束前后的日记内容。","explain":"这句独白说明莎菲仍会思念凌吉士的身体和暧昧经验，她对感情的拒绝因此并不轻率。可是她无法为了欲望重新接受一个精神卑劣的人，只能在理性与依恋之间独自承受失落。她保住了道德和人格，却没有找到能够代替旧爱情关系的新生活，因此胜利与孤独同时出现。","link":"这一矛盾使人物超越个人恋爱，指向新女性缺少社会支持的处境。","page":"P45","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["只把关系变化写成恋爱失败或“从爱到恨”。","只写灵肉冲突，不解释凌吉士的世俗人格和莎菲的道德标准。"]},{"id":"water-symbol","work":"《水》","workKey":"water","type":"意象象征","title":"水的多重象征","prompt":"分析《水》中“水”的象征意义。","keywords":["水","象征","洪水","灾难","压迫","反抗"],"thesis":"水既是自然灾害，也是社会压迫和群众力量的象征，丁玲借水的形态变化写出灾民的苦难与觉醒。","points":[{"point":"水首先表现为不可控制的自然灾害。","evidence":"“愁惨的天照着黄色的滔滔的大水，那一夜淹了汤家阙，又淹了一渡口的一片汪洋的大水。”","location":"小说开头洪水逼近、村民逃难和恐慌的段落。","explain":"“黄色的滔滔的大水”与“淹了汤家阙”“淹了一渡口”把洪水的颜色、规模和破坏结果连在一起。水首先表现为无法控制的自然暴力，它摧毁村庄、驱赶村民，也迅速把底层民众推入饥饿和流离失所的生存危机。","link":"但水的意义没有停留在自然灾害上。","page":"P226","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"水又象征官僚压迫下不断加剧的社会危机。","evidence":"“帆船却又带来了一些军火，并没有带救济米。”","location":"灾民与地方官员交涉、官员转移财物等情节。","explain":"“军火”与“救济米”被放在同一艘帆船上，反差直接说明权力机构面对灾民时选择的是控制而非救助。水灾在这里不再只是自然现象，它同时揭露官僚机器如何把灾难转化为维护秩序和压迫底层的工具。","link":"这层象征把自然灾害推向社会批判。","page":"P231","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"水最终转化为群众觉醒和反抗的力量。","evidence":"“比水还凶猛的，朝镇上扑了过去。”","location":"结尾群众集体行动和裸身汉子带领反抗的段落。","explain":"“比水还凶猛的，朝镇上扑了过去”将原本破坏生命的水转化为群众行动的力量。水灾的凶猛和人群的愤怒被并置，说明底层在长期压迫中完成了从求生到反抗的转变，作品的主题也从苦难书写推进到革命想象。","link":"结论必须写成多重象征，不能只写“水代表灾难”。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["只写水是自然灾害，忽略社会压迫和群众力量。","象征分析只有结论，没有引文和情节定位。"]},{"id":"water-change","work":"《水》","workKey":"water","type":"主题思想","title":"从灾难到抗争","prompt":"结合文本，分析《水》中灾民由恐惧到反抗的变化。","keywords":["灾民","恐惧","反抗","觉醒","群众","变化"],"thesis":"《水》通过灾民由恐惧到联合反抗的变化，表现底层群众在灾难和压迫中逐渐觉醒。","points":[{"point":"灾难初期，灾民主要处于恐惧和无助中。","evidence":"“那些被骂着的女人，一批一批的，在无可奈何之中，含着眼泪，含着一线希望，扶老携幼向着相反的方向跑去，带着哭和叫，带着骚扰和不安，向原野的四方伸去。”","location":"洪水到来前后灾民逃难、求生的情节。","explain":"“含着眼泪”与“含着一线希望”同时出现，写出灾民在绝境中求生却找不到方向的处境。扶老携幼、向四方奔逃的群像把洪水造成的混乱具体化，也说明灾难初期的人们只能被动承受，尚未形成改变现实的力量。","link":"接下来的社会压迫改变了人物关系。","page":"P226","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"官僚冷漠和剥削让灾民看清现实。","evidence":"“帆船却又带来了一些军火，并没有带救济米。”","location":"灾民与县长、官员发生冲突的段落。","explain":"“帆船却又带来了一些军火，并没有带救济米”把灾民的期待与官府的冷漠同时呈现。求生的现实需要被军火取代，迫使他们认识到灾难背后还有阶级和权力压迫，群众的态度因此由等待救助转向怀疑和愤怒。","link":"认识的变化推动群众走向联合。","page":"P231","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"结尾的反抗说明群众力量开始形成。","evidence":"“比水还凶猛的，朝镇上扑了过去。”","location":"小说结尾群众反抗的高潮部分。","explain":"“比水还凶猛的，朝镇上扑了过去”表明分散的个人痛苦已经汇聚为集体行动。结尾的反抗已经从单纯求生转向对权力秩序的冲击，把灾害积压的愤怒转化为行动，群众力量由此成为小说最明确的主题方向。","link":"结尾要点明群众觉醒与作品的社会意义。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["只概括变化，不写每个阶段的文本依据。","把反抗写成突然发生，忽略压迫推动变化的过程。"]},{"id":"water-hero","work":"《水》","workKey":"water","type":"人物形象","title":"裸身汉子与群众形象","prompt":"分析《水》中裸身汉子或群众形象。","keywords":["裸身汉子","群众","群像","反抗","力量","领袖"],"thesis":"裸身汉子集中体现群众力量逐渐形成，人物形象带有鲜明的集体行动色彩。","points":[{"point":"群众在灾难中承受最直接的苦难。","evidence":"“那些被骂着的女人，一批一批的，在无可奈何之中，含着眼泪，含着一线希望，扶老携幼向着相反的方向跑去，带着哭和叫，带着骚扰和不安，向原野的四方伸去。”","location":"洪水灾害和村民逃难段落。","explain":"“无可奈何”与“一线希望”并置，写出灾民同时承受绝望和求生本能。流离失所的群像先以受害者身份出现，为后文他们从分散逃难走向集体反抗提供了情感和现实基础。","link":"苦难为后续反抗积蓄力量。","page":"P226","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"群体在压迫中逐渐由分散走向联合。","evidence":"“哭有什么用，死的死了，哭得转来吗？不死的总得鼓着气想法，未必也死去吗？”","location":"灾民与官僚冲突的情节。","explain":"“哭有什么用”连续的反问打断了集体绝望，把悲痛转成对行动的追问。原本各自逃命的灾民开始围绕粮食和生存商议，个人情绪就此进入共同处境，群体的联合在具体危机中被迫形成，带有被逼上行动道路的紧迫感。","link":"裸身汉子的行动正是这种转化的表现。","page":"P228","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"裸身汉子代表群体的行动意志。","evidence":"“比水还凶猛的，朝镇上扑了过去。”","location":"小说结尾的高潮段。","explain":"“比水还凶猛的”把裸身汉子与群众行动合为一体，说明反抗具有群众行动性质，已经超出个人英雄行为。人物的身体力量被赋予群体意志，水灾造成的破坏最终转化为冲击压迫秩序的动能，群众成为推动情节和主题转变的主体。","link":"分析人物时要把他放回群众关系，不只写个人性格。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把裸身汉子写成传统个人英雄，忽略群众基础。","只描述人物动作，不解释动作的象征意义。"]},{"id":"water-theme","work":"《水》","workKey":"water","type":"主题思想","title":"灾难与社会批判","prompt":"分析《水》的主题思想。","keywords":["主题","灾难","社会批判","阶级","群众","觉醒"],"thesis":"《水》以洪水灾难为表层事件，揭示官僚压迫下底层群众的苦难、觉醒与反抗。","points":[{"point":"作品首先呈现自然灾害带来的生存危机。","evidence":"“愁惨的天照着黄色的滔滔的大水，那一夜淹了汤家阙，又淹了一渡口的一片汪洋的大水。”","location":"小说开篇洪水灾害的描写。","explain":"“汤家阙”“一渡口”等具体地名说明这场灾害覆盖了真实的生活空间，洪水不仅是一个宏大背景，更直接摧毁村庄、田地和家庭。作品从生存危机入手，使灾害成为观察底层贫困和社会脆弱性的起点。","link":"作品并未把灾难只当作自然现象。","page":"P226","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"官僚不作为把自然灾害推向社会悲剧。","evidence":"“帆船却又带来了一些军火，并没有带救济米。”","location":"官员处理灾情、灾民求助受阻的情节。","explain":"“军火”替代“救济米”直接揭示天灾背后的人祸。官员和军队并没有把灾民的生命放在首位，反而用武器维持旧有秩序，这种选择把自然灾害推向社会悲剧，也把批判对象从洪水转向权力结构。","link":"社会压迫进一步推动群众态度变化。","page":"P231","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"群众觉醒和反抗是作品的主题方向。","evidence":"“比水还凶猛的，朝镇上扑了过去。”","location":"小说结尾群众冲向镇上的段落。","explain":"“比水还凶猛的，朝镇上扑了过去”让群众从被灾难推着走的人变成主动冲击秩序的人。小说从揭露苦难继续推进，写出压迫如何积聚力量，群众觉醒和反抗因此构成作品从现实批判走向革命叙事的核心路线。","link":"结论应同时覆盖灾难、批判和觉醒三层。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["只写灾难主题，删掉社会批判和群众觉醒。","只写主题判断，不回到情节和人物。"]},{"id":"hospital-luping","work":"《在医院中》","workKey":"hospital","type":"人物形象","title":"陆萍的多重主体与理想锋芒","prompt":"分析陆萍的人物形象及其复杂性。","keywords":["陆萍","性格","理想","批判","善良","坚持"],"thesis":"陆萍兼具新女性、现代医学知识者和共产党员三重身份；她以专业责任和革命理想进入医院，又在现实冲突中显出敏感、热烈、缺乏世故和强烈的批判精神。","points":[{"point":"陆萍带着现代教育理想和改变现实的热情进入医院。","evidence":"“她总是爱飞。总不满于现状。”","location":"陆萍初到医院、观察环境并希望改革的情节。","explain":"“爱飞”写出她不断追求进步的精神姿态，“不满于现状”则说明她把理想落实为对现实问题的敏感。现代教育和革命热情共同塑造了她，使她不会满足于医院敷衍、落后的日常状态。","link":"这种理想锋芒既推动她行动，也埋下与现实冲突的根源。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"她把专业责任落实为照顾病人和改善医疗的具体行动。","evidence":"“为了不愿病人产妇多受苦痛，便自己去替几个开刀了的，发炎的换药。”","location":"陆萍在严寒中照顾病人、承担换药工作的段落。","explain":"“不愿病人产妇多受苦痛”显示她关怀具体的人，“自己去替”则说明责任感落在护理、换药和奔波等劳动中。陆萍的理想因此具有专业和身体经验的双重基础，并非停留在口头热情。","link":"她的理想主义因具体行动而获得可信度。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"她坚持批判现实，因而在麻木环境中成为被排斥的异类。","evidence":"“她已经成为医院里小小的怪人，被大多数人用异样的眼睛看着。”","location":"陆萍提出意见、照顾病人并受到议论的连续情节。","explain":"“小小的怪人”说明她的专业标准和批判意识与医院惯例发生冲突，也反映群体习惯如何把提出问题的人视为不合群。陆萍的孤立既是她的局限，也是她责任感、正直和知识分子敏锐性的证明。","link":"人物魅力与人物困境在这一点上同时成立。","page":"P387","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把陆萍写成毫无缺点、永远正确的英雄。","只写她受委屈，不分析她的专业责任、批判精神和理想锋芒。"]},{"id":"hospital-growth","work":"《在医院中》","workKey":"hospital","type":"主题思想","title":"愤怒、反思与未完成的成长","prompt":"分析陆萍在医院中的受挫、反思与成长。","keywords":["成长","变化","转折","老兵","挫折","理想"],"thesis":"陆萍的成长经历热烈的理想、现实的碰撞、情绪的崩溃和主动选择。她并未一次性完成成熟，却在反复调整中逐渐理解革命工作的艰难，并选择继续学习和实践。","points":[{"point":"陆萍最初依靠理性自我鼓励，试图把不安转化为新的希望。","evidence":"“她竭力安慰自己，鼓励自己，骂自己，又替自己建筑着新的希望的楼阁，努力使自己在这楼阁中睡去。”","location":"陆萍初到医院、面对陌生环境后的内心调适。","explain":"安慰、鼓励、责骂和建构希望连续出现，说明陆萍的乐观依靠强烈的自我说服。她能够压住一时的不安，却没有真正解决理想与现实之间的距离，这种“强打精神”的调整方式也预告了后来的情绪危机。","link":"成长首先表现为她如何理解自己的情绪和环境。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"中毒事件让她从热情行动转向痛苦质疑。","evidence":"“她已经完全清楚，她需要静静的睡眠，可是被一种不知是什么东西压迫着，忍不住要哭要叫。”","location":"手术室中毒事件后陆萍生病和反思的段落。","explain":"“需要静静的睡眠”表现身体的疲惫，“不知是什么东西压迫着”则写出精神压力的来源无法被简单命名。陆萍在中毒事件后无法再靠热情维持行动，她必须面对个人理想和现实环境之间的深层冲突。","link":"成长从幻觉破灭和重新认识现实开始。","page":"P393","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"她接受老同志和朋友的开导，转向继续学习和实践。","evidence":"“她仍然是那样兴致很浓厚的去照顾着那些产妇，那些婴儿，为着她们一点点的需索，去同管理员，总务处，秘书长，甚至院长去争执。”","location":"小说结尾附近陆萍准备参加下一场手术并继续学习的情节。","explain":"“兴致很浓厚”与多次“争执”说明陆萍并未因受挫放弃病人和婴儿。她把关心落实到一次次具体交涉之中，理想因此从抽象热情变成持续行动的伦理选择；人物成长依靠反复实践，并没有依赖一次顿悟完成。","link":"结尾保持开放，人物并未完成蜕变，却选择了继续成长。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把成长理解成陆萍被环境彻底驯服。","只写结尾振作，不分析中间的怀疑、痛苦和自我调整。"]},{"id":"hospital-environment","work":"《在医院中》","workKey":"hospital","type":"艺术手法","title":"环境描写的作用","prompt":"分析《在医院中》环境描写的作用。","keywords":["环境描写","医院","寒冷","混乱","气氛","作用"],"thesis":"医院环境既是人物活动的现实空间，也映照出革命理想与落后现实之间的冲突。","points":[{"point":"寒冷和简陋写出物质条件的困难。","evidence":"“窗户外无声地飘着雪片。”","location":"陆萍在冬天奔波的段落。","explain":"“窗户外无声地飘着雪片”既写出陕北冬天的寒冷，也用“无声”营造出封闭和压抑的气氛。自然环境的艰苦与医院条件的落后互相映照，使陆萍每一次奔波都带上实际的身体重量。","link":"环境也会影响人物对工作的感受。","page":"P390","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"医院管理的混乱营造压抑气氛。","evidence":"“她替她们要清洁的被袄，暖和的住室，滋补的营养，有次序的生活。”","location":"陆萍观察医院日常工作的情节。","explain":"“清洁的被袄”“暖和的住室”“滋补的营养”“有次序的生活”都是最基本的医疗与生活需要，却被她反复争取。所求之物越普通，越说明医院管理的混乱直接落在病人的日常处境中，连基本需要都难以得到保障。","link":"环境由此成为冲突的推力。","page":"P387","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"环境与人物形成对照，突出理想主义的力量和困境。","evidence":"“她已经成为医院里小小的怪人，被大多数人用异样的眼睛看着。”","location":"陆萍救人、受挫和反思的连续情节。","explain":"“异样的眼睛”把环境压力具体化为群体注视。陆萍的坚持越突出，周围人的冷淡越明显，环境描写直接参与人物孤立、成长和主题冲突，已经超出单纯的背景作用；医院越冷、越乱、越排斥异见，陆萍的坚持就越显出具体重量。","link":"结尾回答环境描写如何服务人物和主题。","page":"P387","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["只摘抄环境，不解释环境与人物的关系。","只写寒冷，忽略医院制度和人际环境。"]},{"id":"hospital-intellectual","work":"《在医院中》","workKey":"hospital","type":"人物关系","title":"知识分子与医院环境","prompt":"分析陆萍与医院环境的冲突。","keywords":["知识分子","医院","冲突","环境","改革","误解"],"thesis":"陆萍与医院的冲突，是青年知识分子的改革热情同落后环境、复杂人际关系之间的冲突。","points":[{"point":"陆萍带着改造现实的愿望进入医院。","evidence":"“她常常为了他们的生活管理，和医疗的改善与很多人发生冲突。”","location":"陆萍到医院初期的工作表现。","explain":"“为了他们的生活管理，和医疗的改善”说明陆萍的冲突来自公共职责，与私人情绪无关。她把现代医学标准带进边区医院，希望通过管理改革减少病人的痛苦，因此她的抗议具有明确的专业理想。","link":"冲突由理想与环境的碰撞产生，已经超越个人恩怨。","page":"P387","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"医院中的制度化问题和人际冷漠让她的努力受阻。","evidence":"“小资产阶级意识、知识分子的英雄主义、自由主义等等的帽子都往她头上戴。”","location":"陆萍与同事、管理者发生矛盾的情节。","explain":"“小资产阶级意识”“英雄主义”“自由主义”等标签把具体问题转化为身份批判。医院没有讨论她提出的医疗问题，反而用政治帽子消解她的意见，这既显示个体表达受阻，也暴露制度内部缺少自我纠正能力。","link":"这让陆萍不得不重新思考怎样工作。","page":"P394","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"冲突最终推动陆萍成熟。","evidence":"“她总是爱飞，总不满于现状。”","location":"小说后段陆萍反思和转变的部分。","explain":"结尾仍保留“爱飞”和“不满于现状”的行动气质，说明陆萍并未被现实彻底击垮。她经过冲突后从冲动改革转向对环境和自身局限的理解，继续寻找实践机会，人物由此显出成熟后的韧性。","link":"结尾要回扣知识分子如何面对现实。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把冲突写成陆萍与某个人的私人矛盾。","只写环境落后，不写陆萍自身的成长。"]},{"id":"fortress-fang","work":"《围城》","workKey":"fortress","type":"人物形象","title":"方鸿渐的性格困境","prompt":"分析方鸿渐的人物形象。","keywords":["方鸿渐","性格","软弱","虚荣","围城","失败"],"thesis":"方鸿渐具有自省和善意，却缺少行动力，在爱情、事业和婚姻中不断被自己的软弱推入新的围城。","points":[{"point":"方鸿渐具有自省能力，却缺少改变现实的行动力。","evidence":"“小小一方纸能把一个人的空疏、寡陋、愚笨都掩盖起来。”","location":"买假文凭、回国后面对家庭与工作安排的情节。","explain":"“小小一方纸”把文凭写成遮盖“空疏、寡陋、愚笨”的屏障，方鸿渐明白自己的能力和身份并不相称，却仍选择用虚假证明维持体面。他的清醒使他能够自嘲，也使他无法像真正无知的人那样心安，但清醒始终没有转化为改变行动。","link":"这构成他反复进入围城的内在原因。","page":"P10","edition":"人民文学出版社软皮版","chapter":"第一章","searchPhrase":"小小一方纸","pdfPage":"19"},{"point":"他的爱情选择体现犹豫和被动的性格。","evidence":"“这姓方的不合式，气量太小，把钱看得太重。”","location":"方鸿渐与苏文纨、唐晓芙、孙柔嘉的关系变化。","explain":"“气量太小”“把钱看得太重”出自别人的评价，却揭示方鸿渐在婚恋中的被动位置。他无法坚定选择，也无法有效处理误会和外部压力，最后只能接受关系变化，这说明他的失败来自犹豫性格在现实关系中的连续后果，单一事件无法解释。","link":"爱情围城由此成为人物性格的投射。","page":"P44","edition":"人民文学出版社软皮版","chapter":"第二章","searchPhrase":"这姓方的不合式","pdfPage":"52"},{"point":"他的事业困境体现知识分子的无力。","evidence":"“从没听过三闾大学，想是个战后新开的大学。”","location":"方鸿渐赴三闾大学任教及婚姻开始的情节。","explain":"“从没听过三闾大学”写出他对新环境的陌生和缺少判断。进入陌生大学后，他既没有真正的学术资本，也没有足够的处世能力，只能随着人情和职位安排漂流，事业困境因此体现出知识分子的无根与无力。","link":"结尾要把人物放回“围城”主题。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第三章","searchPhrase":"从没听过三闾大学","pdfPage":"110"}],"traps":["只写方鸿渐懦弱，忽略他能自省、有善意的一面。","把人物失败全部归因于外部环境，不分析他的选择。"]},{"id":"fortress-satire","work":"《围城》","workKey":"fortress","type":"艺术手法","title":"讽刺艺术","prompt":"分析《围城》的讽刺艺术。","keywords":["讽刺","反讽","比喻","虚伪","知识分子","手法"],"thesis":"《围城》通过反讽、比喻和人物对照，揭示知识分子在社会生活中的虚荣、虚伪与无力。","points":[{"point":"假文凭情节讽刺知识分子的虚荣。","evidence":"“小小一方纸能把一个人的空疏、寡陋、愚笨都掩盖起来。”","location":"方鸿渐留学归来和求职初期相关情节。","explain":"“小小一方纸能把一个人的空疏、寡陋、愚笨都掩盖起来”表面是俏皮判断，实际把文凭和真实能力之间最荒诞的裂缝暴露出来。方鸿渐买假学历，社会却愿意相信那张纸，讽刺因此同时指向个人的虚荣和群体对学历的迷信。","link":"讽刺首先指向个体人格，也延伸到社会风气。","page":"P10","edition":"人民文学出版社软皮版","chapter":"第一章","searchPhrase":"小小一方纸","pdfPage":"19"},{"point":"三闾大学的情节讽刺学术圈的虚伪。","evidence":"“这姓方的不合式，气量太小，把钱看得太重，给我一试就露出本相。”","location":"方鸿渐到三闾大学任教后的校园与人事情节。","explain":"“气量太小，把钱看得太重”把婚恋评价落在金钱和性情上，使人物关系显出世俗算计。接受这种评价的人自认为看透方鸿渐，却也暴露自己的势利，讽刺在双方之间来回折射，不停留在单一人物的道德批判。","link":"这里体现作品对社会群体的批判。","page":"P44","edition":"人民文学出版社软皮版","chapter":"第二章","searchPhrase":"这姓方的不合式","pdfPage":"52"},{"point":"婚姻围城和人物关系用比喻强化讽刺效果。","evidence":"“结婚仿佛金漆的鸟笼，笼子外面的鸟想住进去，笼内的鸟想飞出来。”","location":"方鸿渐爱情、婚姻和职业连续受挫的情节线。","explain":"“金漆的鸟笼”以美丽外壳包住封闭空间，把婚姻的向往、进入和逃离压缩成一个可见形象。比喻既写出人物欲望的循环，也让他们自以为自由的选择显出荒诞，讽刺因此具有结构性和普遍性。","link":"结尾要点明讽刺对人生处境的揭示，避免写成单纯搞笑。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第三章","searchPhrase":"结婚仿佛金漆的鸟笼","pdfPage":"101"}],"traps":["只写“运用比喻和讽刺”，没有解释讽刺指向什么。","把讽刺理解成单纯搞笑，忽略其中的社会批判。"]},{"id":"fortress-marriage","work":"《围城》","workKey":"fortress","type":"主题思想","title":"婚姻围城","prompt":"结合文本，分析《围城》中婚姻围城的含义。","keywords":["婚姻","围城","爱情","失望","选择","方鸿渐"],"thesis":"婚姻围城在小说中表现为对理想生活的想象和进入现实后的失望，方鸿渐与孙柔嘉的婚姻集中写出这种困境。","points":[{"point":"婚姻在人物想象中代表着理想和归属。","evidence":"“结婚仿佛金漆的鸟笼，笼子外面的鸟想住进去，笼内的鸟想飞出来。”","location":"方鸿渐与苏文纨、唐晓芙、孙柔嘉关系发展的情节。","explain":"“笼子外面的鸟想住进去”写出人物对婚姻的想象：他们把进入关系等同于获得归属和完整。鸟笼的“金漆”又暗示这种理想带有体面和虚荣，方鸿渐期待婚姻解决人生问题，却并未准备好承担关系中的责任。","link":"期待越高，进入现实后的落差越明显。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第三章","searchPhrase":"结婚仿佛金漆的鸟笼","pdfPage":"101"},{"point":"进入婚姻后，日常矛盾和现实压力打破理想。","evidence":"“这姓方的不合式，气量太小，把钱看得太重，给我一试就露出本相。”","location":"方鸿渐与孙柔嘉结婚后相处的情节。","explain":"“不合式”“气量太小”“把钱看得太重”把婚姻选择变成家世、金钱和性情的综合计算。婚前的期待一旦进入日常，人物缺点和现实压力便不断放大，婚姻于是不再是浪漫结局，而成为另一种需要应对的困境。","link":"这正是围城隐喻在婚姻线上的体现。","page":"P44","edition":"人民文学出版社软皮版","chapter":"第二章","searchPhrase":"这姓方的不合式","pdfPage":"52"},{"point":"婚姻围城与事业围城互相映照。","evidence":"“城外的人想冲进去，城里的人想逃出来。”","location":"方鸿渐在三闾大学任教并进入婚姻阶段的情节。","explain":"“城外的人想冲进去，城里的人想逃出来”把婚姻与职业、人生选择放在同一结构中。方鸿渐在三闾大学想离开，进入婚姻后又面对新的失望，反复的进入和逃离说明围城指向人物面对欲望与现实时的普遍心理，已经超出某一段关系。","link":"结尾要回到“围城”作为人生困境的象征。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第三章","searchPhrase":"城外的人想冲进去","pdfPage":"101"}],"traps":["只写某段感情失败，忽略婚姻围城的普遍含义。","只讲婚姻，不断开事业围城的互相映照。"]},{"id":"fortress-parallel","work":"《围城》","workKey":"fortress","type":"人物关系","title":"赵辛楣与方鸿渐","prompt":"分析赵辛楣与方鸿渐的平行关系及其作用。","keywords":["赵辛楣","方鸿渐","平行","对照","三闾大学","知识分子"],"thesis":"赵辛楣和方鸿渐构成平行对照关系，两人共同暴露知识分子的困境，也通过性格和处世方式的差异加深人物塑造与社会讽刺。","points":[{"point":"两人都卷入爱情和职业困境，构成平行线。","evidence":"“赵辛楣和鸿渐拉拉手，傲兀地把他从头到脚看一下。”","location":"方鸿渐与赵辛楣在国内相处、赴三闾大学任教的情节线。","explain":"“拉拉手”后的“傲兀”审视写出赵辛楣和方鸿渐初见时的暗中较劲。两人都试图在爱情和身份中确认自己，也都会进入职业和婚姻困境，这种相似处境使他们成为互相映照的平行人物。","link":"平行并不意味着人物完全相同。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第三章","searchPhrase":"赵辛楣和鸿渐拉拉手","pdfPage":"59"},{"point":"两人的性格和处世方式形成对照。","evidence":"“他的傲慢无礼，是学墨索里尼和希特勒接见小国外交代表开谈判时的态度。”","location":"两人处理爱情、工作和人际关系的相关情节。","explain":"将赵辛楣的傲慢写成独裁者接见外交代表，夸张而带嘲讽，立刻显出他的自信、强势和权力表演。方鸿渐的犹疑恰好与之形成对照，两人的性格差异不仅制造幽默，也让个人选择如何影响命运变得清楚。","link":"人物关系因此承担塑造和讽刺的双重功能。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第三章","searchPhrase":"他的傲慢无礼","pdfPage":"62"},{"point":"两人的关系映射三闾大学和知识圈的虚伪。","evidence":"“从没听过三闾大学，想是个战后新开的大学。”","location":"三闾大学教师群体和人事矛盾情节。","explain":"“三闾大学”把他们共同带入一个陌生而充满人事算计的空间。赵辛楣与方鸿渐的交往不只是私人友谊，还映出知识圈中的职位、面子和派系关系，个人关系由此扩展为群体批判。","link":"结尾要回到作品对知识分子处境的整体表现。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第三章","searchPhrase":"从没听过三闾大学","pdfPage":"110"}],"traps":["只并列写两个人，不说明二者如何对照。","把赵辛楣写成完人，忽略他也处在同样的社会困境中。"]},{"id":"saffi-loneliness","work":"《莎菲女士的日记》","workKey":"saffi","type":"主题思想","title":"莎菲的孤独","prompt":"分析莎菲孤独感的来源及其意义。","keywords":["孤独","寂寞","无人理解","疾病","蕴姊","新女性"],"thesis":"莎菲的孤独既来自病体和亲友的不理解，也来自她觉醒后找不到同路人的精神处境。","points":[{"point":"疾病和独居放大了莎菲的寂寞。","evidence":"“我总愿意有那么一个人能了解得我清清楚楚的。”","location":"莎菲日常生活中反复出现的独处与病中场景。","page":"P40","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"“了解得我清清楚楚”是莎菲对关系质量的最高要求，她需要有人准确理解自己的心理，安慰或照顾无法替代这种精神理解。疾病和独居让她有更多时间反观自身，也让她发现身边的人只能提供表面的关怀，寂寞因此由生活处境转化为精神困境。","link":"孤独因此成为人物心理和时代困境的共同表现。"},{"point":"亲友的照顾无法真正理解她的精神需求。","evidence":"“一个女人这样放肆，是不会得到好结果的。”","location":"莎菲与毓芳、云霖、苇弟相处的日记段落。","page":"P45","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"“一个女人这样放肆”说明亲友的照顾并不等于接纳，他们仍以传统性别标准衡量莎菲。她越感到自己被误解，就越退回私人感受，表面上的陪伴因此无法消除内在的隔膜，反而不断提醒她与周围人的精神距离。","link":"这使她不断退回日记和自我内部。"},{"point":"蕴姊之死让莎菲失去唯一可能理解自己的人。","evidence":"“谁能懂得我呢，便能懂得这只能表现我万分之一的日记。”","location":"关于蕴姊去世和莎菲继续写日记的段落。","page":"P65","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"“谁能懂得我呢”把一个具体的失去写成精神世界的空洞。蕴姊之死带走的不仅是一个亲友，也是莎菲可能获得理解的希望；此后日记成为她维持自我、对抗沉默的方式，孤独也由此成为她觉醒之后无法摆脱的处境。","link":"结尾应把个人孤独与五四新女性的处境联系起来。"}],"traps":["只写莎菲性格孤僻，忽略社会和时代原因。","把孤独和爱情困惑混为一谈，没有分层。"]},{"id":"saffi-diary-form","work":"《莎菲女士的日记》","workKey":"saffi","type":"艺术手法","title":"日记体的叙事效果","prompt":"分析《莎菲女士的日记》的日记体特征及其表达效果。","keywords":["日记体","第一人称","私人性","即时性","独语","真实感"],"thesis":"日记体让莎菲的私人情感、即时情绪和内心独语直接呈现，使人物矛盾具有现场感和真实感。","points":[{"point":"私人性使莎菲能够说出不愿公开的欲望与羞耻。","evidence":"“我只得忍耐着，低下头去。”","location":"全篇带有自我倾诉性质的日记内容。","page":"P43","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"“我只得忍耐着，低下头去”把无法公开的欲望和当下的自我压制写在同一个瞬间。日记没有经过事后修饰，使读者直接看到莎菲羞耻、冲动与克制交叠的心理，第一人称的私人性因此成为人物真实感的重要来源。","link":"私人性也使作品具有心理暴露的冲击力。"},{"point":"即时性让情绪变化呈现为连续过程。","evidence":"“我只得忍耐着，低下头去。”","location":"莎菲与凌吉士关系变化前后的日记。","page":"P43","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"同一句自我压抑在不同日期中反复出现，说明这种情绪持续回返，在多个日期中反复出现，已经超过一次性的宣泄。日记按日期推进，让期待、失望、羞愧和反抗各自占有一刻，读者由此能够追踪莎菲如何在一个个瞬间里重新认识自己。","link":"这使人物矛盾具有动态过程。"},{"point":"独语性把人物内心冲突写成两个自我的争辩。","evidence":"“一个女人这样放肆，是不会得到好结果的。”","location":"“难道我去找他吗”等内心争辩。","page":"P45","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"“一个女人这样放肆”是外部规范进入莎菲内心的声音，与她的欲望形成自我争辩。日记让这两种声音同时被记录，冲突不必依靠旁白解释，人物在自问自答中呈现出分裂而清醒的主体。","link":"结尾要回到形式与主题的统一。"}],"traps":["只写第一人称，不分析它对心理、节奏和主题的作用。","把日记体当作内容复述。"]},{"id":"water-contrast","work":"《水》","workKey":"water","type":"艺术手法","title":"《水》中的对比","prompt":"分析《水》中对比手法的运用。","keywords":["对比","官民","灾民","军火","希望","反抗"],"thesis":"《水》通过官与民、希望与失望、求生与反抗的对比，揭示天灾背后的人祸并推动群众觉醒。","points":[{"point":"灾民的痛苦与官员的冷漠形成对比。","evidence":"“帆船却又带来了一些军火，并没有带救济米。”","location":"长岭岗镇外士兵警戒、灾民得不到救济的段落。","page":"P231","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"灾民急需粮食，而帆船带来的却是军火，两种物资构成直接的官民对照。这个细节超出单纯的情节转折，揭示权力机关面对灾民时选择的是防范和镇压，从而使自然灾害迅速转化为社会批判。","link":"矛盾推动群众态度发生变化。"},{"point":"赈济希望与军火现实形成反差。","evidence":"“帆船却又带来了一些军火，并没有带救济米。”","location":"灾民等待救济、看见船只靠岸的段落。","page":"P231","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"“救济米”本是灾民最具体的希望，“军火”则代表官府对灾民的戒备。希望与现实的落差越强，群众越容易看清自己的处境；对比在这里不仅制造冲突，也完成了从等待救助到准备反抗的心理转折。","link":"失望由此转化为愤怒。"},{"point":"水的凶猛与人群反抗形成力量对照。","evidence":"“比水还凶猛的，朝镇上扑过去。”","location":"小说第四部分和结尾高潮。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"水曾经摧毁村庄，而群众最终“比水还凶猛”地冲向镇上，两个力量意象形成反转。前者代表不可控制的灾难，后者代表人组织起来的行动，对比使小说的主题从承受苦难转向创造改变现实的力量。","link":"对比完成意象意义的反转。"}],"traps":["只列对比对象，不解释对比产生什么效果。","把官民对比写成简单善恶。"]},{"id":"water-wangdabao","work":"《水》","workKey":"water","type":"人物形象","title":"王大保和李塌鼻","prompt":"分析王大保和李塌鼻在灾民群体中的作用。","keywords":["王大保","李塌鼻","群众","求生","觉醒","组织"],"thesis":"王大保和李塌鼻分别以号召力和现实经验推动群众从绝望求生走向集体反抗。","points":[{"point":"王大保用直接有力的话语打破群体绝望。","evidence":"“哭有什么用，死的死去了，哭得转来吗？”","location":"洪水过后灾民抱头大哭、王大保站出来讲话的段落。","page":"P228","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"“哭有什么用”先用反问否定了无效的悲痛，接着用“不死的总得鼓着气想法”把注意力拉回现实。王大保的话要求灾民寻找办法，承担了把绝望转成行动的社会动员功能。","link":"他是群众情绪转折的推动者。"},{"point":"李塌鼻用对地主存粮的了解增强行动信心。","evidence":"“打开他们的仓，够我们一渡口的人吃几年。”","location":"灾民商议前往长岭岗求生的段落。","page":"P228","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"“打开他们的仓，够我们一渡口的人吃几年”把抽象的求生愿望落实为具体方案。李塌鼻了解地主存粮，说明底层经验本身就是行动资源；他提供的是让群众相信反抗可行的现实依据，语言带有实干色彩。","link":"他代表底层经验与实干力量。"},{"point":"两人共同推动群体从求生走向反抗。","evidence":"“老子们家破人亡，就留下这条命，还得算算账呢！”","location":"前往长岭岗及发现官府镇压灾民的前后情节。","page":"P228","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"“家破人亡”“还得算算账”把灾民的损失明确转化为对压迫者的追讨。王大保的号召和李塌鼻的现实判断在这一刻合流，个人求救变成群体清算，群众反抗因此有了情绪基础和组织方向。","link":"分析人物时要落到群体作用，不只写性格。"}],"traps":["把王大保写成孤胆英雄，忽略群众反应。","只写台词，不分析语言如何推动集体情绪。"]},{"id":"hospital-group","work":"《在医院中》","workKey":"hospital","type":"人物形象","title":"医院人物群像","prompt":"分析《在医院中》医院人物群像的作用。","keywords":["院长","黄守荣","张芳子","群像","官僚","冷漠"],"thesis":"医院人物群像分别代表外行领导、敷衍中层、麻木同事和疏离专业人员，共同构成陆萍改革受阻的现实环境。","points":[{"point":"院长代表外行领导和官僚作风。","evidence":"“她已经成为医院里小小的怪人，被大多数人用异样的眼睛在看着。”","location":"陆萍提交意见书、与院长发生接触的情节。","page":"P387","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"陆萍被群像视为“怪人”，说明医院内部已经形成一套排斥异见的共同眼光。院长的官僚、同事的敷衍和群众的麻木不需要逐一说明，单是这种一致排斥，就足以显示改革者为何难以获得制度支持。","link":"这构成陆萍改革失败的外部原因。"},{"point":"张芳子等同事代表麻木与随波逐流。","evidence":"“她已经成为医院里小小的怪人，被大多数人用异样的眼睛在看着。”","location":"陆萍与同事工作相处及提出意见的情节。","page":"P387","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"“大多数人”的异样目光把张芳子等同事的随波逐流写成集体氛围。他们未必都主动迫害陆萍，却通过默认和旁观维持了旧秩序，使个人热情无法转化为共同改变，群体麻木因此成为改革受阻的重要原因。","link":"群像揭示了环境改造的复杂。"},{"point":"群像共同突出陆萍的孤立与坚持。","evidence":"“她已经成为医院里小小的怪人，被大多数人用异样的眼睛在看着。”","location":"医院对陆萍的议论和排斥情节。","page":"P387","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"群像的排斥将陆萍置于孤立位置，也使她的坚持被反衬得更清楚。周围人越冷淡，她照顾病人、提出意见和维护专业标准的选择越显出责任感，人物与环境之间的张力由此推动主题发展。","link":"分析群像要回到主人公处境和主题。"}],"traps":["只列人物名字，不写他们各自代表的问题。","群像分析与陆萍无关，文章被拆成人物介绍。"]},{"id":"hospital-gas","work":"《在医院中》","workKey":"hospital","type":"主题思想","title":"手术室中毒事件与制度问题","prompt":"分析手术室中毒事件在小说中的作用。","keywords":["中毒","手术室","黎涯","冲突","成长","制度问题"],"thesis":"中毒事件把医疗条件、官僚管理、人际冷漠和陆萍的心理危机集中引爆，成为人物成长与作品社会批判的关键转折。","points":[{"point":"缺失煤炉使事故成为医疗条件长期落后的必然结果。","evidence":"“手术室不装煤炉怎么行呢？”","location":"陆萍申请供暖、手术室烧木炭并发生中毒的情节。","explain":"反问句直接指出手术室最基本的保暖条件都未得到保障，事故因此不能简单归为偶然。医院在资源分配和管理决策上忽视医疗安全，长期积累的官僚和敷衍最终以中毒事件的形式爆发。","link":"事件把个人抱怨变成具有公共性的制度问题。","page":"P390","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"事故后的冷漠和流言使陆萍彻底看清环境。","evidence":"“她已经完全清楚，她需要静静的睡眠，可是被一种不知是什么东西压迫着，忍不住要哭要叫。”","location":"中毒事件后陆萍生病、被议论和反思的段落。","explain":"身体痛苦与精神压迫叠在一起，使陆萍无法再以忙碌和乐观掩盖问题。她开始质疑医院为何缺少关爱，也发现个人热情难以改变制度化冷漠，事故因此成为她认识现实的转折点。","link":"事件推动陆萍从行动热情进入痛苦反思。","page":"P393","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"事故之后继续寻找实践机会，使危机转化为成长动力。","evidence":"“她已经完全清楚，她需要静静的睡眠，可是被一种不知是什么东西压迫着，忍不住要哭要叫。”","location":"小说结尾附近陆萍准备投入新的工作与学习。","explain":"这句话把中毒事件后的陆萍推到精神和身体的双重低点。她无法再用忙碌遮掩痛苦，只能直面自己与环境的关系；成长因此从幻觉破灭开始，顺利成功无法承担这一转折。","link":"危机成为人物重新理解革命和自我的起点。","page":"P393","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["只复述中毒经过，不分析制度、人物和主题。","把事故当作偶然意外，忽略此前的资源申请和管理问题。"]},{"id":"hospital-ending","work":"《在医院中》","workKey":"hospital","type":"主题思想","title":"开放结尾与继续成长","prompt":"分析《在医院中》结尾对陆萍成长的意义。","keywords":["结尾","成长","革命","反思","机会","理想"],"thesis":"结尾没有把陆萍写成被现实击垮或彻底完成改造的人，而是让她在痛苦反思后继续寻找学习和实践的机会，显示成长仍然开放。","points":[{"point":"中毒事件后的压迫感使陆萍进入痛苦而清醒的反思。","evidence":"“她已经完全清楚，她需要静静的睡眠，可是被一种不知是什么东西压迫着，忍不住要哭要叫。”","location":"手术室中毒事件后陆萍生病和自我质疑的段落。","explain":"身体的疲惫与精神的压迫同时出现，说明陆萍已经无法用“强打精神”解决全部问题。她开始追问医院为何冷漠、革命工作为何艰难，也第一次认真面对自己与环境、组织和理想之间的裂隙。","link":"反思使结尾不再停留在事件结果，而进入主体的重新选择。","page":"P393","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"朋友和老同志的劝解帮助她重新获得理解和行动方向。","evidence":"“她仍然是那样兴致很浓厚的去照顾着那些产妇，那些婴儿，为着她们一点点的需索，去同管理员，总务处，秘书长，甚至院长去争执。”","location":"陆萍与朋友、老同志交流后继续照顾病人的情节。","explain":"陆萍在受到挫折后仍愿意为产妇和婴儿的需要奔走，说明她并未放弃关怀与责任。朋友的理解和老同志的经验使她认识到，坚持理想需要耐心和策略，个人成长也离不开他人和群体。","link":"社会关系为陆萍从孤立走向继续实践提供支持。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"抓住新的学习机会，使结尾保持继续成长的开放性。","evidence":"“她准备着如何可以使自己不失去这一个机会。”","location":"小说结尾附近陆萍准备继续工作、学习并提升自己。","explain":"“准备着”写出陆萍重新获得主动性，她不再停留在控诉和抱怨，而是选择通过学习提升自己。离开医院并非简单失败，它意味着人物拒绝被环境同化，也承认成长需要新的经验和更长的时间。","link":"开放结尾回扣“人是在艰苦中成长”的主题。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把结尾理解成陆萍理想彻底破灭。","只写她离开医院，不分析离开后继续学习和实践的选择。"]},{"id":"fortress-diploma","work":"《围城》","workKey":"fortress","type":"主题思想","title":"假文凭的象征意义","prompt":"分析方鸿渐假文凭事件的讽刺意义。","keywords":["假文凭","克莱登","虚荣","学历","知识分子","围城"],"thesis":"假文凭既讽刺社会对学历的盲目崇拜，也象征方鸿渐用虚荣掩盖空疏、从而进入人生围城的起点。","points":[{"point":"假文凭掩盖了方鸿渐的空疏和无能。","evidence":"“小小一方纸能把一个人的空疏、寡陋、愚笨都掩盖起来。”","location":"方鸿渐决定购买学位、回国前面对文凭问题处。","page":"P10","edition":"人民文学出版社软皮版","explain":"“空疏、寡陋、愚笨”本应决定一个人的能力，却被“小小一方纸”轻易遮住。方鸿渐明知文凭虚假，仍依赖它获得体面，因此假文凭不只是骗局道具，也象征他用外在身份弥补内在虚弱。","link":"虚荣因此成为人物悲剧的内在起点。","chapter":"第一章","searchPhrase":"小小一方纸","pdfPage":"19"},{"point":"社会对洋文凭的迷信使骗局得以成立。","evidence":"“小小一方纸能把一个人的空疏、寡陋、愚笨都掩盖起来。”","location":"方鸿渐回国后报纸登载、社交圈追捧其博士身份的情节。","page":"P10","edition":"人民文学出版社软皮版","explain":"社会愿意相信洋文凭，才让“克莱登”式骗局得以成立。方鸿渐的虚荣和周围人的盲目崇拜互相配合，讽刺因此从个人道德扩展到学历评价体系，说明骗局依赖个人虚荣与社会崇拜共同维持。","link":"个人虚荣与社会崇拜互相推动。","chapter":"第一章","searchPhrase":"小小一方纸","pdfPage":"19"},{"point":"假文凭成为方鸿渐后续困境的伏笔。","evidence":"“克莱登法商专门学校函授部”","location":"求职、三闾大学任教及与唐晓芙关系变化的情节线。","page":"待核","edition":"人民文学出版社软皮版","explain":"“克莱登法商专门学校函授部”以煞有介事的名称包装虚假学历，显出骗局的荒诞。这个身份无法提供真正学问，却会影响他求职、任教和婚恋，虚假开端因此像伏笔一样不断制造新的困境。","link":"结尾要回扣“围城”主题。","chapter":"第一章","searchPhrase":"克莱登法商专门学校函授部","pdfPage":"19"}],"traps":["只批判方鸿渐个人，不分析社会崇拜学历的现象。","把假文凭当作孤立事件，不联系职业和婚恋困境。"]},{"id":"fortress-intellectuals","work":"《围城》","workKey":"fortress","type":"主题思想","title":"三闾大学与知识分子群像","prompt":"分析《围城》中的知识分子群像。","keywords":["三闾大学","知识分子","虚伪","派系","李梅亭","韩学愈"],"thesis":"《围城》通过三闾大学的派系斗争和学者群像，讽刺知识分子在名利、权力和虚荣中的庸俗化。","points":[{"point":"三闾大学呈现学术机构的派系争斗。","evidence":"“从没听过三闾大学，想是个战后新开的大学。”","location":"第五至第七章三闾大学任教情节。","page":"待核","edition":"人民文学出版社软皮版","explain":"“从没听过三闾大学”写出这所机构在人物心中的突然和陌生，也暗示其权力结构并不透明。教师进入其中后围绕职位、派系和面子争斗，学术空间被世俗权力侵占，知识理想因此受到讽刺。","link":"个体困境由此扩展为群体批判。","chapter":"第三章","searchPhrase":"从没听过三闾大学","pdfPage":"110"},{"point":"人物行为暴露道貌岸然与个人私利。","evidence":"“从没听过三闾大学，想是个战后新开的大学。”","location":"赴三闾大学旅途中李梅亭的相关情节。","page":"待核","edition":"人民文学出版社软皮版","explain":"陌生机构成为人物暴露真实品行的场所。方鸿渐、高松年、李梅亭等人面对职位和利益时各有算计，行动与口头上的道德姿态形成反差，使知识分子的虚伪通过情节自然显现。","link":"讽刺通过情节而非作者议论完成。","chapter":"第三章","searchPhrase":"从没听过三闾大学","pdfPage":"110"},{"point":"知识分子在虚荣和现实压力下失去方向。","evidence":"“从没听过三闾大学，想是个战后新开的大学。”","location":"三闾大学学历、职位和人际关系情节。","page":"待核","edition":"人民文学出版社软皮版","explain":"“战后新开”的背景让三闾大学带有时代动荡和临时性。人物在这里既失去稳定的文化根基，又被名利和生存压力推着走，学历、职位和身份因此成为他们寻找方向却不断迷失的证据。","link":"结论要把群像与作品的整体讽刺主题连接起来。","chapter":"第三章","searchPhrase":"从没听过三闾大学","pdfPage":"110"}],"traps":["只罗列人物丑事，不分析群体象征。","把讽刺写成简单道德批判，忽略时代环境。"]},{"id":"fortress-metaphor","work":"《围城》","workKey":"fortress","type":"艺术手法","title":"比喻与围城意象","prompt":"分析《围城》中比喻和意象的艺术作用。","keywords":["比喻","意象","鸟笼","围城","人生困境","讽刺"],"thesis":"《围城》用鸟笼、城堡和围城等比喻，把婚姻、职业与人生困境具象化，使讽刺具有反复回扣的结构力量。","points":[{"point":"鸟笼比喻把婚姻中的进出欲具象化。","evidence":"“结婚仿佛金漆的鸟笼，笼子外面的鸟想住进去，笼内的鸟想飞出来。”","location":"小说人物谈论婚姻与围城的相关情节。","page":"待核","edition":"人民文学出版社软皮版","explain":"“金漆的鸟笼”把婚姻的吸引力与封闭感放在同一形象里。金漆代表体面和欲望，鸟笼代表限制，人物只看见进入前的光亮，却忽略进入后的空间，比喻因此把想象中的幸福与现实束缚同时写出。","link":"这一比喻构成全文围城主题的直观基础。","chapter":"第三章","searchPhrase":"结婚仿佛金漆的鸟笼","pdfPage":"101"},{"point":"围城意象反复出现在爱情、职业和婚姻中。","evidence":"“结婚仿佛金漆的鸟笼，笼子外面的鸟想住进去，笼内的鸟想飞出来。”","location":"方鸿渐从爱情到三闾大学再到婚姻的连续经历。","page":"待核","edition":"人民文学出版社软皮版","explain":"鸟笼中“想住进去”和“想飞出来”的循环不只属于婚姻，也能对应方鸿渐在三闾大学和人生选择中的处境。意象在不同阶段重复出现，使爱情、职业和婚姻共享同一结构，作品因此获得整体性的讽刺框架。","link":"比喻因此不仅属于语言，也属于叙事结构。","chapter":"第三章","searchPhrase":"结婚仿佛金漆的鸟笼","pdfPage":"101"},{"point":"比喻还承担讽刺和人性揭示。","evidence":"“城外的人想冲进去，城里的人想逃出来。”","location":"假文凭、三闾大学和社交圈相关描写。","page":"待核","edition":"人民文学出版社软皮版","explain":"“城外的人想冲进去，城里的人想逃出来”用通俗比喻说出人物不断追逐又不断失望的心理。它让欲望看起来自由，实际却像固定轨道一样反复运行，既讽刺人物，也揭示人性中难以满足的普遍状态。","link":"结尾要落回比喻与主题、讽刺的统一。","chapter":"第三章","searchPhrase":"城外的人想冲进去","pdfPage":"101"}],"traps":["只摘抄比喻，不解释比喻和行为、主题的关系。","把所有意象都说成围城，忽略具体语境。"]},{"id":"fortress-group-portrait","work":"《围城》","workKey":"fortress","type":"人物形象","title":"知识分子群像的病态","prompt":"结合方鸿渐及周围人物，分析《围城》如何塑造战时知识分子群像。","keywords":["群像","知识分子","方鸿渐","虚荣","三闾大学","病态"],"thesis":"小说以方鸿渐为线索，把学历、爱情和职业空间中的知识分子连成群像，写出他们在理想与现实之间的虚荣、摇摆和无力。","points":[{"point":"学历崇拜掩盖了人物精神上的空疏。","evidence":"“小小一方纸能把一个人的空疏、寡陋、愚笨都掩盖起来。”","location":"方鸿渐购买文凭以及回国后面对学历问题的情节。","explain":"“小小一方纸”把文凭变成遮盖“空疏、寡陋、愚笨”的工具，群像对学历和体面的依赖由此暴露。人物明知自身能力有限，仍宁愿相信外在证明，学历崇拜因此成为知识分子精神虚弱的表现。","link":"这为后文职业和婚恋中的困境埋下伏笔。","page":"P10","edition":"人民文学出版社软皮版"},{"point":"人物关系中的功利计算暴露出婚恋的世俗逻辑。","evidence":"“这姓方的不合式，气量太小，把钱看得太重。”","location":"方鸿渐与苏文纨、唐晓芙、孙柔嘉关系变化的相关情节。","explain":"“不合式”“把钱看得太重”把婚恋评价压缩成金钱和性情判断。个人情感被家世、体面和功利计算包围，人物关系不再只是私人选择，也反映群体如何用世俗标准衡量人的价值。","link":"个体婚恋困境由此扩展为群体和社会的讽刺。","page":"P44","edition":"人民文学出版社软皮版"},{"point":"人物互相映照，构成知识分子群体的普遍困境。","evidence":"“他的傲慢无礼，是学墨索里尼和希特勒接见小国外交代表开谈判时的态度。”","location":"赵辛楣与方鸿渐交往以及三闾大学人事关系中的情节。","explain":"把赵辛楣的傲慢比作独裁者接见外交代表，夸张地写出人物的自负和权力幻想。这个人物并不孤立，他的姿态与方鸿渐的虚弱、其他人的算计互相映照，共同构成知识分子的病态群像。","link":"分析群像时要说明人物关系如何共同揭示时代和精神问题。","page":"待核","edition":"人民文学出版社软皮版"}],"traps":["只介绍方鸿渐一个人物，没有群像之间的互相映照。","把人物缺点简单归为个人品行，忽略学历、职业和时代压力。"]},{"id":"fortress-language-satire","work":"《围城》","workKey":"fortress","type":"艺术手法","title":"语言讽刺的三种方式","prompt":"分析《围城》如何通过比喻、人物语言和叙事判断实现讽刺。","keywords":["语言讽刺","比喻","幽默","人物语言","叙事判断","围城"],"thesis":"钱钟书把比喻、人物语言和冷静的判断交织在一起，使讽刺既能制造幽默，也能揭露人物和社会的真实处境。","points":[{"point":"具象比喻把抽象的人生困境转成可感形象。","evidence":"“结婚仿佛金漆的鸟笼，笼子外面的鸟想住进去，笼内的鸟想飞出来。”","location":"小说人物谈论婚姻以及方鸿渐婚恋经历的相关段落。","explain":"“金漆的鸟笼”将婚姻的诱惑、体面和封闭感压缩成一个可感形象，读者先被比喻的机趣吸引，随后才意识到其中包含的束缚。语言在这里承担讽刺功能，把抽象的人生困境具体化。","link":"比喻因此同时承担描写、讽刺和主题揭示功能。","page":"待核","edition":"人民文学出版社软皮版"},{"point":"人物语言的夸张反差暴露其虚伪和自负。","evidence":"“他的傲慢无礼，是学墨索里尼和希特勒接见小国外交代表开谈判时的态度。”","location":"赵辛楣与方鸿渐交往及三闾大学人物的社交情节。","explain":"以独裁者接见外交代表形容赵辛楣的傲慢，宏大政治场景被用于私人交往，反差立即把人物的自信变成装腔作势。夸张语言没有直接评判，却让读者从失衡的比喻中看出人物的虚伪和可笑。","link":"讽刺通过语言自身完成，作者很少直接出面批评。","page":"待核","edition":"人民文学出版社软皮版"},{"point":"叙事判断把轻松语言引向严肃批判。","evidence":"“小小一方纸能把一个人的空疏、寡陋、愚笨都掩盖起来。”","location":"假文凭情节及社会对洋学历的追捧。","explain":"“小小一方纸”语气轻巧，指向的却是学历社会和知识分子的自我欺骗。幽默句式为批判披上轻松外衣，读者一笑之后仍会看到背后的荒诞，讽刺因此既能娱乐阅读，也能推动主题。","link":"结语应回到幽默与批判并存的语言特点。","page":"P10","edition":"人民文学出版社软皮版"}],"traps":["只摘比喻说有趣，不解释比喻揭穿了什么。","把讽刺理解为单纯搞笑，忽略其中的社会批判。"]},{"id":"fortress-concrete-balance","work":"《围城》","workKey":"fortress","type":"艺术手法","title":"讽刺的具象化与平衡视角","prompt":"分析《围城》如何通过具象化描写和平衡视角完成讽刺。","keywords":["具象化","平衡视角","隐喻","结构","冷峻","笑中带泪"],"thesis":"小说用具体物象承载抽象情绪，又以冷峻而有距离的视角观察不同人物，使讽刺不流于辱骂，而呈现出复杂的“笑中带泪”。","points":[{"point":"具体物象让抽象情感变得可见。","evidence":"“结婚仿佛金漆的鸟笼，笼子外面的鸟想住进去，笼内的鸟想飞出来。”","location":"小说中关于婚姻、职业和人生选择的比喻段落。","explain":"“金漆的鸟笼”给婚姻困境一个可以看见的外形，欲望、限制和进退都在同一物件中呈现。比喻避免了抽象议论，使读者既感到幽默，又能体会人物在“想进去”和“想出来”之间反复摇摆的复杂心理。","link":"具象化使讽刺具有画面和回味。","page":"待核","edition":"人民文学出版社软皮版"},{"point":"冷峻视角避免把人物简单分成善恶两方。","evidence":"“这姓方的不合式，气量太小，把钱看得太重。”","location":"张家评价方鸿渐及苏家、方家等人物关系的情节。","explain":"“这姓方的不合式”既是对方鸿渐的评价，也是评价者势利和偏见的暴露。叙述让双方都在人物判断中受到讽刺，人物因此无法被简单分成善恶两方，冷峻视角也使群像更接近真实的灰色状态。","link":"平衡视角让人物世界更接近真实的灰色状态。","page":"P44","edition":"人民文学出版社软皮版"},{"point":"结构上的反复让围城意象贯穿不同人生阶段。","evidence":"“城外的人想冲进去，城里的人想逃出来。”","location":"爱情、三闾大学任教和婚姻等连续经历。","explain":"“冲进去”和“逃出来”的结构在爱情、职业和婚姻中反复出现，说明围城指向普遍的人生心理，已经超出单一关系的结果。每一次进入都被当作解决方案，随后又产生新的失望，重复结构使个人困境上升为普遍人生经验。","link":"结尾应回扣内容与形式统一的讽刺美学。","page":"待核","edition":"人民文学出版社软皮版"}],"traps":["只谈具象化，不分析平衡视角带来的复杂性。","把反讽写成简单的贬低或道德审判。"]},{"id":"saffi-imperfect-vanguard","work":"《莎菲女士的日记》","workKey":"saffi","type":"人物形象","title":"“不完美”莎菲的先锋性","prompt":"莎菲自我分裂、反复彷徨是否削弱了人物的先锋性？结合文本分析。","keywords":["不完美","先锋性","自我分裂","女性主义","主体","抵抗"],"thesis":"莎菲的先锋性不在于她成为道德完美的新女性，而在于她敢于承认欲望、行使对男性人格的精神评判权，并拒绝用物质和肉欲替代灵魂契合。","points":[{"point":"欲望和自我表达打破了传统女性的沉默。","evidence":"“我压制住我那狂热的欲念，我未曾请求他多留一会儿。”","location":"莎菲认识凌吉士后反复书写欲望与克制的日记段落。","explain":"莎菲把女性欲望写成需要承认的真实经验，同时又暴露礼教造成的压抑。她展示新意识如何在旧规范内部艰难生长，人物并未成为完全解放的胜利者；这种未完成状态使人物比单纯的觉醒符号更真实，也更有先锋性。","link":"“不完美”构成对虚假统一主体的拒绝，也让人物更具先锋性。","page":"P61","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"她拒绝凌吉士，是在行使女性对欲望对象进行精神评判和道德选择的权利。","evidence":"“当我明白了那使我爱慕的一个高贵的美形里，是安置着如此一个卑劣灵魂。”","location":"莎菲看清凌吉士真实面目后的心理转折。","explain":"莎菲并没有因为欲望而放弃判断，相反，她在“高贵美形”中发现“卑劣灵魂”后主动收回情感。凌吉士的金钱、肉欲和自我享受人格不符合她对爱情和精神尊严的想象，因此拒绝体现女性决定什么样的人配得上自己、什么价值不能被交易，与被迫失恋无关。","link":"先锋性由此从身体欲望推进到精神评判和道德主体。","page":"P58","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"日记中的独语构成女性自我空间的建构。","evidence":"“谁能懂得我呢，便能懂得这只能表现我万分之一的日记。”","location":"全篇以第一人称日记持续展开的内心独白。","explain":"“万分之一的日记”既承认表达不完整，也说明日记是莎菲唯一可以不按社会角色说话的空间。她在其中保留欲望、羞耻、反思和判断，拒绝接受外界赋予的稳定形象，私人书写因此成为女性抵抗误解、建构自我的方式。","link":"这种私人空间使“不完美”获得了抵抗父权主体神话的意义。","page":"P65","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把莎菲的犹豫和反复只当作性格缺点。","只写女性欲望，不分析她拒绝凌吉士时所表现的精神标准和主体判断。"]},{"id":"saffi-awakening-tragedy","work":"《莎菲女士的日记》","workKey":"saffi","type":"主题思想","title":"觉醒之后的结构性悲剧","prompt":"分析莎菲觉醒后的精神困境及其结构性悲剧。","keywords":["觉醒","精神困境","悲剧","孤独","理解","爱情"],"thesis":"莎菲的悲剧源于个体解放思想先于社会结构变化：她获得了判断、拒绝和保持尊严的权利，却没有得到新的关系、女性共同体与社会出路。","points":[{"point":"觉醒使她拒绝旧规范，却无法摆脱外部评价和制度压力。","evidence":"“一个女人这样放肆，是不会得到好结果的。”","location":"莎菲面对爱情、身体和社交规范时的日记独白。","explain":"“放肆”与“好结果”把父权规范伪装成对女性命运的善意提醒。莎菲虽然能够质疑这种评判，却仍生活在一个会按它分配羞辱和孤立的世界中，因此她的新意识越清楚，日常承受的冲突越尖锐。","link":"觉醒没有自动带来自由，反而暴露了思想解放与社会条件之间的落差。","page":"P45","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"她渴望真正的精神理解，却没有女性共同体或社会力量承接她的觉醒。","evidence":"“我总愿意有那么一个人能了解得我清清楚楚的。”","location":"莎菲与蕴姊、毓芳及苇弟相处时的日记内容。","explain":"莎菲所求的是完整而准确的理解，但亲友的关心无法进入她的精神世界，蕴姊去世后又切断了最可能的情感纽带。作品中没有出现女性互助组织或能够支持新女性的社会力量，她只能把日记当作最后的精神空间，孤独因此是结构性缺席，而非个人选择。","link":"精神困境由此从私人关系上升到女性共同体的缺失。","page":"P40","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"离开和拒绝构成她的道德自救，同时无法解决矛盾的现实出路。","evidence":"“我又将一人寂寂寞寞地离开这古城了。”","location":"2026 May/June Paper 3 选文所取的莎菲离开北京前日记段落。","explain":"“一人”和“寂寂寞寞”同时写出莎菲保存自我的决心与无人同行的处境。离开使她暂时摆脱需要妥协的关系，守住精神和道德边界，却没有改变造成困境的社会结构，也没有建立新的生活共同体，因此这种自救只能终止旧关系，无法真正完成解放。","link":"莎菲的悲剧性因此在于她只能退出，而不能改造世界。","page":"待核","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把悲剧归因于莎菲性格敏感、犹豫或不懂珍惜。","把离开写成彻底解放，忽略她缺少社会支持和现实出路。"]},{"id":"saffi-enlightenment-revolution","work":"《莎菲女士的日记》","workKey":"saffi","type":"主题思想","title":"自由恋爱的启蒙悖论","prompt":"结合启蒙与革命语境，分析莎菲的“自由恋爱”为什么没有带来真正解放。","keywords":["启蒙","革命","自由恋爱","个性解放","女性","悖论"],"thesis":"自由恋爱把个人从传统中解放出来，却没有提供能够承接女性主体性的社会结构和精神共同体；莎菲拒绝凌吉士，正暴露启蒙话语在性别和阶级层面的边界。","points":[{"point":"自由恋爱最初表现为女性主动追求个人欲望和情感选择。","evidence":"“颀长的身躯，白嫩的面庞，薄薄的小嘴唇，柔软的头发。”","location":"莎菲初次接触并观察凌吉士的日记段落。","explain":"这段凝视把女性从被选择、被观看的位置推向欲望主体。莎菲主动创造相处机会，也主动表达对男性身体的感受，自由恋爱因此首先是个人权利意识的觉醒；但它仍把解放寄托在一个具体男性身上，尚未触及女性获得社会独立的条件。","link":"启蒙给了她爱的自由，却没有同时给她独立的现实基础。","page":"P43","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"凌吉士的拜金、肉欲和自我享乐人格，暴露自由恋爱背后的资本主义男权逻辑。","evidence":"“当我明白了那使我爱慕的一个高贵的美形里，是安置着如此一个卑劣灵魂。”","location":"莎菲认清凌吉士真实面目后的心理转折。","explain":"凌吉士的吸引力来自现代都市男性的外貌、身份和情场经验，但“卑劣灵魂”揭示其价值观仍以金钱、肉欲和自我享受为中心。莎菲的拒绝说明启蒙倡导的自由并没有自动改变两性关系中的权力和欲望结构，女性若不掌握精神与人格的评判权，自由恋爱仍可能成为新的依附。","link":"恋爱自由因此显现出性别与阶级的双重边界。","page":"P58","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"找不到新的精神共同体，使个体只能退回日记并保持孤独。","evidence":"“谁能懂得我呢，便能懂得这只能表现我万分之一的日记。”","location":"莎菲与亲友、爱人关系受挫后继续写日记的段落。","explain":"日记保存了莎菲不愿妥协的真实自我，却无法建立新的社会联系。她能拒绝不合适的男性，却没有女性共同体、公共空间或社会制度承接这种觉醒，于是“自由”只剩下一个人承担后果。作品由此指出，启蒙若只完成个人思想的解放，就会把新女性留在精神漂流中。","link":"莎菲的困境为丁玲及新文学主体其后转向革命提供了深层注脚。","page":"P65","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把自由恋爱写成纯粹的个性胜利。","只批判凌吉士个人道德，不分析他所代表的物质主义和男权逻辑。"]},{"id":"water-intellectual-stance","work":"《水》","workKey":"water","type":"主题思想","title":"《水》中的知识分子立场","prompt":"分析《水》如何体现作者的知识分子立场。","keywords":["知识分子立场","第三种声音","人道主义","隐含作者","群众","反思"],"thesis":"《水》在左翼革命叙事之外保留了知识分子的同情、观察和反思，使灾难书写不仅歌颂群众，也追问人的尊严和社会责任。","points":[{"point":"作品首先以人的苦难作为叙事起点。","evidence":"“那些被骂着的女人，一批一批的，在无可奈何之中，含着眼泪，含着一线希望，扶老携幼向着相反的方向跑去，带着哭和叫，带着骚扰和不安，向原野的四方伸去。”","location":"洪水到来前后灾民逃难、求生的情节。","explain":"“眼泪”“一线希望”“扶老携幼”等细节让读者先看到具体的人在灾难中的恐惧和挣扎。作者保留了对个体生命和尊严的关注，没有把群众直接写成抽象革命力量，这构成作品知识分子立场的情感基础。","link":"人道关怀构成知识分子立场的基础。","page":"P226","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"人物语言呈现对现实原因的追问。","evidence":"“哭有什么用，死的死去了，哭得转来吗？”","location":"洪水过后灾民抱头大哭、王大保站出来讲话的段落。","explain":"“哭有什么用”把灾民的行动问题交给底层人物自己回答，但提问本身也反映了作者对官僚和制度的追问。人物语言既表现群众求生，又让读者意识到灾难由具体权力关系不断加重，天降厄运的解释无法说明其社会根源。","link":"群众叙述和知识分子反思由此同时存在。","page":"P228","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"结尾的集体反抗仍保留作者对力量转向的观察。","evidence":"“比水还凶猛的，朝镇上扑了过去。”","location":"小说结尾群众集体行动和裸身汉子带领反抗的段落。","explain":"“比水还凶猛的”显示群众最终获得行动能力，但叙述并没有掩盖力量形成的过程。丁玲既肯定底层反抗，又持续观察它如何由恐惧、饥饿和愤怒转化而来，因此作品在“向左”的革命叙事之外仍保有知识分子的反思。","link":"结论要把“向人”和“向左”连接起来。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["只把《水》解释成左翼口号，忽略人道关怀。","只谈灾害，不分析作者和隐含叙事者的立场。"]},{"id":"water-1930s-ecology","work":"《水》","workKey":"water","type":"比较阅读","title":"灾害书写与1930年代文学生态","prompt":"结合1930年代上海文学生态，分析《水》灾害书写中的左翼文学特征。","keywords":["1930年代","文学生态","灾害书写","左翼文学","比较","上海"],"thesis":"《水》把自然灾害、官僚压迫和群众觉醒接合起来，体现左翼文学关注底层和社会改造的方向，也显示1930年代文学思潮相互碰撞的多元生态。","points":[{"point":"灾害描写一开始就和社会环境连在一起。","evidence":"“愁惨的天照着黄色的滔滔的大水，那一夜淹了汤家阙，又淹了一渡口的一片汪洋的大水。”","location":"小说开篇洪水逼近、村民逃难和恐慌的段落。","explain":"“汤家阙”“一渡口”等具体地名说明这场灾害覆盖了真实的生活空间，洪水不仅是一个宏大背景，更直接摧毁村庄、田地和家庭。作品从生存危机入手，使灾害成为观察底层贫困和社会脆弱性的起点。","link":"灾害因此成为观察社会结构的入口。","page":"P226","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"官僚和军队的行为把天灾转化为社会悲剧。","evidence":"“帆船却又带来了一些军火，并没有带救济米。”","location":"灾民与地方官员交涉、官员转移财物等情节。","explain":"“军火”替代“救济米”，揭示了官府和军队在灾难中的真实立场。这个政治反差把小说从灾害记录推进到社会批判，也使它接近左翼文学对阶级关系和权力结构的关注。","link":"这种问题意识与左翼文学的社会分析相呼应。","page":"P231","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"群众反抗体现文学从揭露问题走向行动想象。","evidence":"“比水还凶猛的，朝镇上扑了过去。”","location":"小说第四部分和结尾高潮。","explain":"“比水还凶猛的，朝镇上扑了过去”把灾害的破坏力转化为群众反抗的行动力。作品从揭露问题走向对群众集体行动的想象，这与1930年代左翼文学对社会出路的探索相呼应。","link":"结尾要说明它和1930年代多元文学思潮之间的互动。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把灾害小说仅仅当作灾难记录。","比较时只写共同点，不说明《水》的政治指向。"]},{"id":"water-discourse-tension","work":"《水》","workKey":"water","type":"主题思想","title":"个性话语与革命话语的张力","prompt":"分析《水》如何呈现个性话语与革命话语之间的张力。","keywords":["个性话语","革命话语","冯雪峰","左翼批评","群众","情感"],"thesis":"《水》一方面走向宏大的革命和群众叙事，另一方面仍保存个体恐惧、悲痛和复杂情感，文本因此留下个性话语与革命话语相互牵引的张力。","points":[{"point":"个体苦难仍然是革命叙事不可抹去的部分。","evidence":"“那些被骂着的女人，一批一批的，在无可奈何之中，含着眼泪，含着一线希望，扶老携幼向着相反的方向跑去，带着哭和叫，带着骚扰和不安，向原野的四方伸去。”","location":"洪水灾害和村民逃难段落。","explain":"灾民逃跑、哭叫和扶老携幼的具体经验构成文本最强的现实压力。革命叙事若要成立，必须先承载这些个体痛苦；个性话语由此成为集体觉醒无法删除的情感根底，也使后来的群众反抗具备真实的人性依据。","link":"这构成文本中个性话语的留存。","page":"P226","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"革命话语通过政治反差把个人苦难引向社会批判。","evidence":"“帆船却又带来了一些军火，并没有带救济米。”","location":"灾民等待救济、官员与军队维护秩序的情节。","explain":"“军火”与“救济米”的反差把个人求生引向对权力结构的质问。革命话语从灾民对现实利益的判断中生长出来，个体苦难因此获得社会批判的方向，也显示群众觉醒与现实利益之间的联系。","link":"两种话语彼此依存并互相推动。","page":"P231","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"集体行动仍然包含鲜明的情感力量。","evidence":"“比水还凶猛的，朝镇上扑了过去。”","location":"结尾群众集体反抗的高潮部分。","explain":"“比水还凶猛的”写出集体行动的力量，但行动由悲痛、饥饿和愤怒积聚而成。群众并不只是抽象的革命主体，他们的情感经验仍在推动叙事，使革命话语与个性话语保持彼此依赖又互相拉扯的关系。","link":"结尾要说明革命转向背后的复杂情感动力。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把个性话语和革命话语看作完全对立。","只讨论革命主题，不分析个体情感怎样进入集体叙事。"]},{"id":"hospital-individual-collective","work":"《在医院中》","workKey":"hospital","type":"主题思想","title":"个体理想与集体秩序","prompt":"分析《在医院中》如何思考个体理想与集体秩序之间的关系。","keywords":["个体","集体","理想","秩序","陆萍","改造"],"thesis":"医院既不是单纯的个人舞台，也不是抽象的集体符号。小说把陆萍的专业理想、组织纪律和医院现实放在同一空间中，呈现个体需要实践、集体需要反思的双向磨合。","points":[{"point":"陆萍希望用专业标准改善医院，使个体理想服务于集体。","evidence":"“她总是爱飞。总不满于现状。”","location":"陆萍初到医院并尝试改革医疗与管理的情节。","explain":"陆萍的不满足来自她看见病人和产妇的具体痛苦，也来自现代医学对管理与卫生的要求。她的个体理想指向公共服务，个人与集体之间的矛盾来源于改善现实的方式和节奏出现冲突，无法用简单对立概括。","link":"冲突的起点是理想与现实之间的距离。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"集体中的标签化使工作问题无法被正常讨论。","evidence":"“小资产阶级意识、知识分子的英雄主义、自由主义等等的帽子都往她头上戴。”","location":"陆萍与同事、管理者发生矛盾的情节。","explain":"“帽子”替代了对医疗和管理问题的具体分析，使陆萍的意见失去被理解的机会。集体用身份判断保护既有秩序，也压抑了专业人员改进现实的可能性，官僚主义和麻木因此成为损害革命事业的内部阻力。","link":"个体需要调整，集体同样需要自我反思。","page":"P394","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"朋友、病人和老同志的帮助使陆萍转向更成熟的实践。","evidence":"“她仍然是那样兴致很浓厚的去照顾着那些产妇，那些婴儿，为着她们一点点的需索，去同管理员，总务处，秘书长，甚至院长去争执。”","location":"陆萍与朋友谈心、继续照顾病人并争取资源的情节。","explain":"陆萍仍然关心产妇和婴儿的具体需要，也仍然愿意为一点点改善去交涉。她逐渐学会让理想适应现实节奏，同时保持对个体生命的关注；个体与集体的关系因此从单纯冲突转向实践中的调整。","link":"结论应落在个体与集体的双向成长。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把陆萍写成完全正确、集体完全错误的二元对立。","只谈组织纪律，不分析医院管理中的官僚主义和专业缺失。"]},{"id":"hospital-dual-luping","work":"《在医院中》","workKey":"hospital","type":"人物形象","title":"“产科助手”与“理想人物”的双重分裂","prompt":"为什么说陆萍是在“产科助手”与“理想人物”之间游移、分裂的形象？","keywords":["陆萍","产科助手","理想人物","双重分裂","身份","成长"],"thesis":"陆萍的复杂性来自现实中的产科助手、五四新女性、现代医学知识者和理想革命者等多重身份。创作理想不断要求她成为坚强人物，现实细节却不断暴露她的脆弱、热情和困惑。","points":[{"point":"理想自我要求她用理智压住脆弱，努力建设新的希望。","evidence":"“她竭力安慰自己，鼓励自己，骂自己，又替自己建筑着新的希望的楼阁，努力使自己在这楼阁中睡去。”","location":"陆萍初到医院后自我调适和压抑不安的段落。","explain":"陆萍用安慰、鼓励和责骂同时对付自己，说明她试图以理性维持理想人物应有的坚强。可是“楼阁”“睡去”也暗示这种希望带有自我麻醉的成分，理想自我与现实感受之间的分裂并未真正消失。","link":"人物的坚强和脆弱在同一种自我调整中同时出现。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"产科助手的现实身份不断把她拉回具体、琐碎而疼痛的医疗工作。","evidence":"“为了不愿病人产妇多受苦痛，便自己去替几个开刀了的，发炎的换药。”","location":"陆萍替病人换药、照料产妇的日常劳动。","explain":"陆萍的理想人物期待无法取代护理和换药这些具体劳动，正是这些工作让她看见病人、产妇和医疗条件的真实处境。理想自我与现实身份互相拉扯，也使她的批判具有实际经验而非空洞姿态。","link":"两种身份的冲突推动人物由想象走向实践。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"受挫后的陆萍没有被彻底改造，却在继续行动中逐渐弥合主体裂隙。","evidence":"“她仍然是那样兴致很浓厚的去照顾着那些产妇，那些婴儿，为着她们一点点的需索，去同管理员，总务处，秘书长，甚至院长去争执。”","location":"陆萍经历误解和挫折后继续照顾病人、争取资源的情节。","explain":"陆萍在受挫后仍为产妇和婴儿的具体需要奔走，说明理想自我并未被现实完全击碎。她开始把理想落实为能持续的行动，人物分裂因此逐渐转化为更稳定的责任意识，也让人物从热血青年走向能够承担现实工作的实践者。","link":"成长的价值在于主体裂隙得到实践中的调整，人物并未被抹平。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把陆萍的分裂简单归因于性格前后矛盾。","只写她最终成为有用的人，忽略她保留的敏感、脆弱和主体复杂性。"]},{"id":"hospital-growth-useful","work":"《在医院中》","workKey":"hospital","type":"主题思想","title":"从迷惘青年到更清醒的实践者","prompt":"分析陆萍如何从迷惘青年走向“有用的人”。","keywords":["成长叙事","有用的人","多重主体","蜕变","革命","青年"],"thesis":"陆萍的成长体现一个复合主体从理想冲动走向现实实践的过程。她保留批判意识，也逐渐理解革命工作的艰难、策略和持续学习的重要性。","points":[{"point":"陆萍的多重身份使她既能发现问题，也容易与现实产生裂隙。","evidence":"“她总是爱飞。总不满于现状。”","location":"陆萍在医院工作、试图改革并持续照顾病人的情节。","explain":"五四新女性、现代医学知识者和共产党员三重身份共同塑造了陆萍：她敏锐、负责、追求进步，也因此难以容忍医院中的慵懒、外行和冷漠。多重身份给她行动力量，也让她对现实的复杂性准备不足。","link":"成长问题是多重主体如何与现实重新建立联系。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"外部误解和自我怀疑迫使她重新认识个人英雄主义的局限。","evidence":"“小资产阶级意识、知识分子的英雄主义、自由主义等等的帽子都往她头上戴。”","location":"陆萍提出改革意见并遭到排斥的情节。","explain":"标签化批评不乏粗暴成分，却也使陆萍开始面对自己“足够热情、很少世故”的局限。她意识到仅凭个人热情难以改善机构和人际关系，革命工作还需要理解群众、策略和长期实践。","link":"成长来自对自我与环境的双重认识。","page":"P394","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"结尾选择继续学习和实践，使“有用的人”具有开放而积极的含义。","evidence":"“她准备着如何可以使自己不失去这一个机会。”","location":"小说结尾附近陆萍准备抓住新的工作与学习机会。","explain":"陆萍没有停在受害者的位置，也没有把离开医院等同于成长失败，而是继续寻找能够发挥价值的行动机会。“有用的人”因此指能够经历艰苦后保持责任、持续学习并选择实践的人。","link":"结尾把成长写成开放过程，而非封闭的成功或失败。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把“有用的人”简化为对组织的被动服从。","把开放结尾判定为完全失败，忽略人物的主动选择。"]}];

function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function workName(k){return WORKS[k]||k}
function norm(s){return String(s||"").toLowerCase().replace(/[\s，。！？；：、“”‘’（）《》〈〉·,.!?;:'"()\[\]{}<>\/\\-]/g,"")}
function grams(s,n){s=norm(s);var out=[];for(var i=0;i<=s.length-n;i++)out.push(s.slice(i,i+n));return out}
function itemText(x){return [x.title,x.prompt,x.work,x.type,x.keywords.join(" "),x.thesis,x.points.map(function(p){return p.point+" "+p.evidence+" "+p.location}).join(" ")].join(" ")}
function scoreItem(x,q){q=norm(q);if(!q)return 0;var score=0;x.keywords.forEach(function(k){if(q.indexOf(norm(k))>=0)score+=18});if(q.indexOf(norm(x.title))>=0)score+=28;if(norm(x.prompt).indexOf(q)>=0)score+=28;var target=itemText(x);[2,3,4].forEach(function(n){grams(q,n).forEach(function(g){if(target.indexOf(g)>=0)score+=g.length*g.length})});return score}
function matchedKeywords(x,q){q=norm(q);return x.keywords.filter(function(k){return q.indexOf(norm(k))>=0})}

function detailView(x){var points=x.points.map(function(p,i){var bits=[];if(p.chapter)bits.push('章节：'+esc(p.chapter));if(p.pdfPage)bits.push('电子版PDF页：P'+esc(p.pdfPage));if(p.searchPhrase)bits.push('检索：'+esc(p.searchPhrase));if(p.page)bits.push('纸质页码：'+esc(p.page)+(p.edition?'（'+esc(p.edition)+'）':''));var page=bits.length?' · '+bits.join(' · '):'';return '<div class="point"><div class="pointTitle">主体段 '+(i+1)+'｜论点句：'+esc(p.point)+'</div><div class="field"><b>引用原文</b>'+esc(p.evidence)+'</div><div class="loc">引文定位：'+esc(p.location)+page+'</div><div class="field"><b>文学论证</b>'+esc(p.explain)+'</div><div class="field"><b>回扣题目</b>'+esc(p.link)+'</div></div>'}).join("");var guide='<div class="panel"><h3>Paper 3 写作路径</h3><div class="field"><b>第一步 审题</b>确认题目要分析的对象、任务和限定语：'+esc(x.prompt)+'</div><div class="field"><b>第二步 定中心</b>开头直接给出文章判断：'+esc(x.thesis)+'</div><div class="field"><b>第三步 写主体段</b>每一段按照“论点句、引用原文、文学论证、回扣题目”的顺序推进。下面的三个主体段就是可以直接模仿的写法。</div><div class="field"><b>第四步 收束全文</b>结尾回答题目中的核心问题，并回扣人物、主题或时代意义，不再增加新的论点。</div></div>';var traps=x.traps.map(function(t){return '<div class="warn">'+esc(t)+'</div>'}).join("");return '<span class="back" id="back">← 返回</span><div class="panel"><div class="meta"><span class="tag">'+esc(workName(x.workKey))+'</span><span class="tag">'+esc(x.type)+'</span></div><h2>'+esc(x.title)+'</h2><p>'+esc(x.prompt)+'</p><div class="thesis"><b>中心论点</b><br>'+esc(x.thesis)+'</div></div>'+guide+'<div class="panel"><button class="ghost" id="toggleHide">'+(state.hide?"显示论点与原文定位":"先自己想，遮住答案")+'</button><div class="'+(state.hide?"hide":"")+'" id="answerBox" style="margin-top:12px"><h3>三个主体段</h3>'+points+'</div></div><div class="panel"><h3>扣题提醒</h3>'+traps+'</div>'}
function render(){var app=document.getElementById("app");if(state.selected){var item=DATA.find(function(x){return x.id===state.selected});app.innerHTML=item?detailView(item):'<div class="empty">没有找到这道题</div>'}else{app.innerHTML=state.mode==="match"?matchView():state.mode==="past"?pastView():state.mode==="draw"?drawView():listView()}bind()}
function bind(){document.querySelectorAll("#tabs button").forEach(function(b){b.className=b.dataset.mode===state.mode?"on":"";b.onclick=function(){state.mode=b.dataset.mode;state.selected=null;state.hide=false;render()}});var search=document.getElementById("search");if(search)search.oninput=function(){state.query=this.value.trim();render();var el=document.getElementById("search");if(el){el.focus();el.selectionStart=el.selectionEnd=el.value.length}};document.querySelectorAll("[data-work]").forEach(function(b){b.onclick=function(){state.work=b.dataset.work;render()}});document.querySelectorAll("[data-past-work]").forEach(function(b){b.onclick=function(){state.work=b.dataset.pastWork;render()}});document.querySelectorAll("[data-draw-work]").forEach(function(b){b.onclick=function(){state.work=b.dataset.drawWork;state.drawItem=null;render()}});document.querySelectorAll("[data-open]").forEach(function(el){el.onclick=function(){state.selected=el.dataset.open;state.hide=false;render();window.scrollTo(0,0)}});document.querySelectorAll("[data-related]").forEach(function(b){b.onclick=function(){state.selected=b.dataset.related;state.hide=false;render();window.scrollTo(0,0)}});var box=document.getElementById("matchBox");if(box)box.oninput=function(){state.matchQuery=this.value};var doMatch=document.getElementById("doMatch");if(doMatch)doMatch.onclick=function(){state.matchQuery=document.getElementById("matchBox").value.trim();render()};var doDraw=document.getElementById("doDraw");if(doDraw)doDraw.onclick=function(){var pool=DATA.filter(function(x){return state.work==="all"||x.workKey===state.work});var remaining=pool.filter(function(x){return state.drawHistory.indexOf(x.id)<0});if(!remaining.length){state.drawHistory=[];remaining=pool}state.drawItem=remaining[Math.floor(Math.random()*remaining.length)];state.drawHistory.push(state.drawItem.id);render();window.scrollTo(0,0)};var openDraw=document.getElementById("openDraw");if(openDraw)openDraw.onclick=function(){state.selected=state.drawItem.id;state.hide=false;render();window.scrollTo(0,0)};var drawAgain=document.getElementById("drawAgain");if(drawAgain)drawAgain.onclick=function(){state.drawItem=null;render()};var back=document.getElementById("back");if(back)back.onclick=function(){state.selected=null;render()};var toggle=document.getElementById("toggleHide");if(toggle)toggle.onclick=function(){state.hide=!state.hide;render()}}
render();
</script>
