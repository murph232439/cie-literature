由此认清官方救助的限度，这种共同经验为接受新的解释准备了心理条件。由此，绝望切断了对旧秩序的信任，也使真正可行的行动方案有了出现的必要。","link":"绝望切断了对旧秩序的信任，也使真正可行的行动方案有了出现的必要。","page":"P235","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"群众","action":"统治阶级的欺骗、威胁和拖延让群众逐渐绝望，等待救济的幻想被现实摧毁。","reason":"告示、许诺和极少的食物曾经维持群众的幻想，现实中的饥饿和死亡却不断加深","consequence":"绝望切断了对旧秩序的信任，也使真正可行的行动方案有了出现的必要。"},"searchPhrase":"他们曾经被一些告示，被一些甜蜜的话，","chapter":"","pdfPage":"246"},{"point":"裸身汉子揭穿官府和地主依靠农民劳动获利的事实，推动群众从等待救援转向集体反抗。","evidence":"“还打算有人来救我们？哼！等着吧，把肠子也饿了出来，你看有不有米会送来？”“比水还凶猛的，朝镇上扑过去。”","location":"结尾长岭岗：裸身汉子在树上向群众揭露剥削关系，随后带领饥民冲向镇上。","explain":"裸身汉子把救济、命运和天灾等说法重新解释为统治阶级维持控制的工具，并指出财富来自农民劳动。群众接受这种解释后，求生目标从等待施舍变成夺回自己的劳动成果，集体行动因此拥有共同理由。结尾把水的破坏力转写成人群的行动力，说明觉醒已经转化为组织化反抗。由此，裸身汉子的作用落在说破真相和组织群众，不宜写成孤立的个人英雄。","link":"裸身汉子的作用落在说破真相和组织群众，不宜写成孤立的个人英雄。","page":"P238","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"裸身汉子","action":"裸身汉子揭穿官府和地主依靠农民劳动获利的事实，推动群众从等待救援转向集体反抗。","reason":"裸身汉子把救济、命运和天灾等说法重新解释为统治阶级维持控制的工具，并指出财富来自农民劳动","consequence":"裸身汉子的作用落在说破真相和组织群众，不宜写成孤立的个人英雄。"},"searchPhrase":"还打算有人来救我们？哼！等着吧，把肠","chapter":"","pdfPage":"249"}],"traps":["把群众写成一开始就觉醒，跳过求神和等待官府救助的阶段。","只写群众受苦，不写官府欺骗和压迫如何使等待转化为绝望。","把裸身汉子写成孤胆英雄，忽略他表达的是众人的共同经验。"],"learningLevel":"variation","studyPriority":"高频变式","parentQuestionId":"water-change","doNotMemorizeSeparately":true,"questionFocus":"先判断题目只问裸身汉子、只问群众，还是两者一起问；再选择对应路线。","socraticQuestions":["裸身汉子怎样从受难者变成说破根源的人？","群众最初在等待谁救自己？","现实逼迫和裸身汉子的说破怎样共同推动反抗？"],"notAsking":["不要默认必须同时写裸身汉子和群众。","不要把群众写成天然英雄。","不要把裸身汉子写成孤胆英雄。"],"threePartPlan":[{"step":"第一段","focus":"灾难初期，群众直接承受死亡和流离，并把获救希望交给神佛。","useFromCore":"调用《从灾难到抗争》主体段 1","miniSentence":"首先，灾难初期，群众直接承受死亡和流离，并把获救希望交给神佛"},{"step":"第二段","focus":"统治阶级的欺骗、威胁和拖延让群众逐渐绝望，等待救济的幻想被现实摧毁。","useFromCore":"调用《从灾难到抗争》主体段 2","miniSentence":"其次，统治阶级的欺骗、威胁和拖延让群众逐渐绝望，等待救济的幻想被现实摧毁"},{"step":"第三段","focus":"裸身汉子揭穿官府和地主依靠农民劳动获利的事实，推动群众从等待救援转向集体反抗。","useFromCore":"调用《从灾难到抗争》主体段 3","miniSentence":"最后，裸身汉子揭穿官府和地主依靠农民劳动获利的事实，推动群众从等待救援转向集体反抗"}],"commonMistakes":[{"mistake":"只写人物性格词。","why":"没有证明性格怎样影响行动。","fix":"补充具体行动、原因和后果。"},{"mistake":"把别人的反应当主体。","why":"题干要求的人物流失了。","fix":"每段回到题干人物。"}],"summary":"裸身汉子与群众形象：抓主体、变化与后果。","studentNote":"先看题目问谁；两条路线不要机械混答。","needsManualReview":false,"answerRoutes":[{"routeName":"如果题目只问裸身汉子","plan":["灾难中的受难者形象","说破灾难根源的启蒙者","组织群众行动的推动者"]},{"routeName":"如果题目只问群众形象","plan":["恐惧、求神与等待","希望破灭后的绝望和愤怒","在现实逼迫与启蒙下走向集体反抗"]}]},{"id":"water-theme","work":"《水》","workKey":"water","type":"主题思想","title":"灾难与社会批判","prompt":"分析《水》的主题思想。","keywords":["主题","灾难","社会批判","阶级","群众","觉醒"],"thesis":"《水》以洪水灾难为表层事件，揭示官僚压迫下底层群众的苦难、觉醒与反抗。","points":[{"point":"作品首先呈现自然灾害带来的生存危机。","evidence":"“愁惨的天照着黄色的滔滔的大水，那一夜淹了汤家阙，又淹了一渡口的一片汪洋的大水。”","location":"第一部分开头：洪水毁坏村庄和田地的全景描写，先建立自然灾害的生存危机。","explain":"具体生活空间被灾难吞没，作品把注意力放在村庄、田地和家庭的毁坏上。灾害成为观察底层贫困与社会脆弱性的起点，主题从自然危机展开。由此，作品并未把灾难只当作自然现象。家庭、土地和生计的损失让自然灾难立刻转化为社会问题。","link":"作品并未把灾难只当作自然现象。","page":"P226","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"前","chain":{"who":"灾民群众","action":"作品首先呈现自然灾害带来的生存危机。","reason":"具体生活空间被灾难吞没，作品把注意力放在村庄、田地和家庭的毁坏上","consequence":"作品并未把灾难只当作自然现象。"},"searchPhrase":"愁惨的天照着黄色的滔滔的大水，那一夜","chapter":"","pdfPage":"237"},{"point":"官僚不作为把自然灾害推向社会悲剧。","evidence":"“帆船却又带来了一些军火，并没有带救济米。”","location":"第二至三部分：官员处理灾情、灾民求助受阻，帆船运来军火而非米粮。","explain":"权力机构在救灾时刻选择的物资方向，直接揭开天灾背后的人为因素。批判对象由洪水转向制度，作品的社会悲剧性质因此确立。由此，社会压迫进一步推动群众态度变化。物资选择把官僚的阶级立场暴露出来，也使灾害责任从自然转向制度。","link":"社会压迫进一步推动群众态度变化。","page":"P231","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"灾民群众","action":"官僚不作为把自然灾害推向社会悲剧。","reason":"权力机构在救灾时刻选择的物资方向，直接揭开天灾背后的人为因素","consequence":"社会压迫进一步推动群众态度变化。"},"searchPhrase":"帆船却又带来了一些军火，并没有带救济","chapter":"","pdfPage":"242"},{"point":"群众觉醒和反抗是作品的主题方向。","evidence":"“比水还凶猛的，朝镇上扑了过去。”","location":"第四部分结尾：群众冲向粮仓并反抗官府与地主，观察主题如何由苦难推进到斗争。","explain":"底层从被动承受转为主动冲击，叙述也由揭露苦难走向想象变革。反抗成为小说的主题方向，并承担连接现实批判与革命叙事的任务。作品把苦难叙事推到革命方向，说明群众已经成为改变现实的力量。群众从受害者转为行动主体，也完成从现实批判到革命想象的推进。","link":"结论应同时覆盖灾难、批判和觉醒三层。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"群众","action":"群众觉醒和反抗是作品的主题方向。","reason":"底层从被动承受转为主动冲击，叙述也由揭露苦难走向想象变革","consequence":"群众从受害者转为行动主体，也完成从现实批判到革命想象的推进"},"searchPhrase":"比水还凶猛的，朝镇上扑了过去。","chapter":"","pdfPage":"251"}],"traps":["只写灾难主题，删掉社会批判和群众觉醒。","只写主题判断，不回到情节和人物。"],"learningLevel":"core","studyPriority":"必背","parentQuestionId":null,"doNotMemorizeSeparately":false,"questionFocus":"这题要说明作品通过哪些人物和情节表现“灾难与社会批判”，每段形成因果推进。","socraticQuestions":["题干要求你始终分析的主体是谁？","第一段的核心判断在文本中由什么行动支持？","三段怎样共同回答题干，而不是各讲一个知识点？"],"notAsking":["不要只复述情节。","不要把主题写成空泛口号。"],"threePartPlan":[{"step":"第一段","focus":"作品首先呈现自然灾害带来的生存危机。","useFromCore":"本题核心 Point 1","miniSentence":"首先，作品首先呈现自然灾害带来的生存危机"},{"step":"第二段","focus":"官僚不作为把自然灾害推向社会悲剧。","useFromCore":"本题核心 Point 2","miniSentence":"其次，官僚不作为把自然灾害推向社会悲剧"},{"step":"第三段","focus":"群众觉醒和反抗是作品的主题方向。","useFromCore":"本题核心 Point 3","miniSentence":"最后，群众觉醒和反抗是作品的主题方向"}],"commonMistakes":[{"mistake":"只复述情节。","why":"没有说明主题怎样形成。","fix":"写人物行动、原因和主题后果。"},{"mistake":"用抽象口号代替分析。","why":"缺少原文支撑。","fix":"每个观点配具体情节。"}],"summary":"灾难与社会批判：抓主体、变化与后果。","studentNote":"先背这一题，再练同一母题下的变式。","needsManualReview":false},{"id":"hospital-luping","work":"《在医院中》","workKey":"hospital","type":"人物形象","title":"陆萍的多重主体与理想锋芒","prompt":"分析陆萍的人物形象及其复杂性。","keywords":["陆萍","性格","理想","批判","善良","坚持"],"thesis":"陆萍兼具新女性、现代医学知识者和共产党员三重身份。她先以具体护理行动承担专业责任，随后因缺少人际经验而与旧环境正面冲突；经历受挫和情绪崩溃后，她仍继续照顾病人并争取资源，行动、冲突和继续实践共同构成复杂主体。","points":[{"stage":"前","point":"陆萍首先通过亲自承担护理劳动表现专业责任，她的理想落在病人身体上的具体痛苦，而非停留在政治口号。","evidence":"“为了不愿病人产妇多受苦痛，便自己去替几个开刀了的，发炎的换药。”","location":"第一部分至第二部分：陆萍为开刀和发炎的病人换药，并照料产妇与婴儿。","explain":"她把医学训练转化为直接行动，看见病人的痛苦便亲自处理治疗和护理。专业判断与道德关怀在这里结合，使她与只满足于维持现状的人产生区别。理想因此既是服务患者的动力，也让她对低标准特别敏感。专业行动由此建立理想锋芒，同时使她的高标准更容易同旧工作环境发生直接碰撞。","link":"前段的专业行动建立人物理想锋芒，后文这种高标准会在旧工作环境中触发直接冲突。","page":"P386","edition":"浙江文艺出版社《丁玲小说》（标注版）","chapter":"","searchPhrase":"为了不愿病人产妇多受苦痛","pdfPage":"397","chain":{"who":"陆萍","action":"陆萍首先通过亲自承担护理劳动表现专业责任，她的理想落在病人身体上的具体痛苦，而非停留在政治口号。","reason":"她把医学训练转化为直接行动，看见病人的痛苦便亲自处理治疗和护理","consequence":"前段的专业行动建立人物理想锋芒，后文这种高标准会在旧工作环境中触发直接冲突。"}},{"stage":"中","point":"陆萍把专业判断直接带入公开讨论，却缺少世故和沟通策略，因此改革意见不断转化为与群体的冲突。","evidence":"“她有足够的热情，和很少的世故。她陈述着，辩论着，倾吐着她成天所见到的一些不合理的事。她不懂得观察别人的颜色，把很多人不敢讲的，不愿讲的都讲出来了。”“她常常为了他们的生活管理，和医疗的改善与很多人发生冲突。”","location":"第二部分至第三部分：陆萍围绕病房管理、卫生和医疗条件提出意见，并因此与同事及管理人员发生冲突。","explain":"她能够发现问题并主动表达，说明专业标准和责任感都很强；但她对他人的情绪、等级和接受方式不够敏感，常用辩论和倾吐代替协商。意见虽然来自真实问题，却很快被周围人理解为挑战，冲突因此不断加深别人对她的排斥。人物的敏锐与不成熟同时显现，专业理想缺少现实沟通能力时会转化为群体冲突，接下来只能由受挫后的继续实践检验她的成长。","link":"中段说明专业理想缺少现实沟通能力时会被转化为群体冲突，后文受挫则考验她能否继续承担专业责任。","page":"","edition":"浙江文艺出版社《丁玲小说》（标注版）","chapter":"","searchPhrase":"她有足够的热情，和很少的世故","pdfPage":"","chain":{"who":"陆萍","action":"陆萍把专业判断直接带入公开讨论，却缺少世故和沟通策略，因此改革意见不断转化为与群体的冲突。","reason":"意见虽然来自真实问题，却很快被周围人理解为挑战，冲突因此不断加深别人对她的排斥","consequence":"中段说明专业理想缺少现实沟通能力时会被转化为群体冲突，后文受挫则考验她能否继续承担专业责任。"}},{"stage":"后","point":"经历事故、批评和情绪低谷后，陆萍仍以持续照顾和交涉回应现实，人物没有停在受害者位置。","evidence":"“她仍然是那样兴致很浓厚的去照顾着那些产妇，那些婴儿，为着她们一点点的需索，去同管理员，总务处，秘书长，甚至院长去争执。”","location":"第三部分至第四部分：手术室中毒事件后，陆萍继续照顾产妇和婴儿，并为她们的日常需求与管理者交涉。","explain":"她经历了身体中毒、舆论标签和精神衰弱，却没有放弃具体工作。继续照料和反复交涉表明她的责任感已经从热情转为韧性，同时仍未放弃对更好条件的争取。人物因此既暴露脆弱，也保留行动能力，成长呈现为未完成但持续的过程。","link":"后段将前面的行动与冲突收束为继续实践，回答陆萍作为复杂人物为何没有停留在迷惘或崩溃中。","page":"P388-P389","edition":"浙江文艺出版社《丁玲小说》（标注版）","chapter":"","searchPhrase":"她仍然是那样兴致很浓厚的去照顾着那些","pdfPage":"399-400","chain":{"who":"陆萍","action":"经历事故、批评和情绪低谷后，陆萍仍以持续照顾和交涉回应现实，人物没有停在受害者位置。","reason":"她经历了身体中毒、舆论标签和精神衰弱，却没有放弃具体工作","consequence":"后段将前面的行动与冲突收束为继续实践，回答陆萍作为复杂人物为何没有停留在迷惘或崩溃中。"}}],"traps":["只写陆萍热情、勇敢，忽略她缺少世故和处理人际冲突的能力。","只写她受挫和脆弱，不分析她仍继续承担专业责任的一面。","把三段写成同一句“责任感很强”的重复表述，没有呈现行动、冲突和继续实践的递进。"],"learningLevel":"core","studyPriority":"必背","parentQuestionId":null,"doNotMemorizeSeparately":false,"questionFocus":"这题要写“陆萍的多重主体与理想锋芒”的关键性格怎样影响具体选择和后果，不能只列性格词。","socraticQuestions":["题干要求你始终分析的主体是谁？","第一段的核心判断在文本中由什么行动支持？","三段怎样共同回答题干，而不是各讲一个知识点？"],"notAsking":["不要只列性格形容词。","不要把其他人物写成段落主体。"],"threePartPlan":[{"step":"第一段","focus":"陆萍首先通过亲自承担护理劳动表现专业责任，她的理想落在病人身体上的具体痛苦，而非停留在政治口号。","useFromCore":"本题核心 Point 1","miniSentence":"首先，陆萍首先通过亲自承担护理劳动表现专业责任，她的理想落在病人身体上的具体痛苦，而非"},{"step":"第二段","focus":"陆萍把专业判断直接带入公开讨论，却缺少世故和沟通策略，因此改革意见不断转化为与群体的冲突。","useFromCore":"本题核心 Point 2","miniSentence":"其次，陆萍把专业判断直接带入公开讨论，却缺少世故和沟通策略，因此改革意见不断转化为与群"},{"step":"第三段","focus":"经历事故、批评和情绪低谷后，陆萍仍以持续照顾和交涉回应现实，人物没有停在受害者位置。","useFromCore":"本题核心 Point 3","miniSentence":"最后，经历事故、批评和情绪低谷后，陆萍仍以持续照顾和交涉回应现实，人物没有停在受害者位"}],"commonMistakes":[{"mistake":"只写人物性格词。","why":"没有证明性格怎样影响行动。","fix":"补充具体行动、原因和后果。"},{"mistake":"把别人的反应当主体。","why":"题干要求的人物流失了。","fix":"每段回到题干人物。"}],"summary":"陆萍的多重主体与理想锋芒：抓主体、变化与后果。","studentNote":"先背这一题，再练同一母题下的变式。","needsManualReview":false},{"id":"hospital-growth","work":"《在医院中》","workKey":"hospital","type":"主题思想","title":"愤怒、反思与未完成的成长","prompt":"分析陆萍在医院中的受挫、反思与成长。","keywords":["成长","变化","转折","老兵","挫折","理想"],"thesis":"陆萍敏感、热情、重感情，也把革命集体想象成彼此关爱的共同体。中毒事件让她亲眼看到同志间缺少基本关心，理想因此受创；她由愤怒、动摇和反思逐渐走向继续学习与实践。","points":[{"point":"陆萍的成长起点是她对病人和产妇痛苦的敏锐感受，以及愿意亲自承担护理工作的行动。","evidence":"“为了不愿病人产妇多受苦痛，便自己去替几个开刀了的，发炎的换药。”","location":"第二部分：陆萍主动替开刀和发炎的病人换药，照顾病人与产妇。","explain":"她不仅对病痛敏感，也愿意用换药和护理等具体劳动回应。这种责任感让成长拥有真实行动基础，也使她很快看见医疗条件和管理中的问题。由此，前段的具体劳动为后文改革受挫和反思提供经验。这份具体劳动建立起人物与民众的真实联系，也让她后续批评医院时具有经验依据。","link":"前段的具体劳动为后文改革受挫和反思提供经验。","page":"P386","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"前","searchPhrase":"为了不愿病人产妇多受苦痛，便自己去替","chapter":"","chain":{"who":"陆萍","action":"陆萍的成长起点是她对病人和产妇痛苦的敏锐感受，以及愿意亲自承担护理工作的行动。","reason":"她不仅对病痛敏感，也愿意用换药和护理等具体劳动回应","consequence":"前段的具体劳动为后文改革受挫和反思提供经验。"},"pdfPage":"397"},{"point":"医院的标签化批评迫使陆萍重新认识个人英雄主义的局限。","evidence":"“小资产阶级意识、知识分子的英雄主义、自由主义等等的帽子都往她头上戴。”","location":"第二至三部分：陆萍提出意见、发生冲突后被贴上多重身份标签。","explain":"标签把医疗管理问题转成个人立场问题，她因此承受误解，也开始发现仅凭热情无法改变机构。外部批评带有粗暴成分，却推动她思考群众、策略和长期实践。由此，中段冲突把成长从情绪受挫推进到自我认识。标签化让个人受挫，也暴露集体缺乏反思能力，双向问题推动她重新理解改革。","link":"中段冲突把成长从情绪受挫推进到自我认识。","page":"P394","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"陆萍","action":"医院的标签化批评迫使陆萍重新认识个人英雄主义的局限。","reason":"标签把医疗管理问题转成个人立场问题，她因此承受误解，也开始发现仅凭热情无法改变机构","consequence":"中段冲突把成长从情绪受挫推进到自我认识。"},"searchPhrase":"小资产阶级意识、知识分子的英雄主义、","chapter":"","pdfPage":"405"},{"point":"陆萍经过毒气中毒和集体冷漠后选择继续成长。","evidence":"“新的生活虽要开始，然而还有新的荆棘。人是要经过千锤百炼而不消溶才能真真有用。人是在艰苦中成长。”","location":"第四部分：中毒事件后，陆萍反思医院、革命工作和个人选择。","explain":"结尾承认理想实现必然伴随困难，也要求人物在现实中保持自我而不被环境消磨。陆萍没有停止行动，她接受成长需要长期实践，人物因此获得开放而未完成的成熟。由此，后段把受挫转化为继续承担，回扣未完成的成长主题。","link":"后段把受挫转化为继续承担，回扣未完成的成长主题。","page":"P396","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"陆萍","action":"陆萍经过毒气中毒和集体冷漠后选择继续成长。","reason":"陆萍没有停止行动，她接受成长需要长期实践，人物因此获得开放而未完成的成熟","consequence":"后段把受挫转化为继续承担，回扣未完成的成长主题。"},"searchPhrase":"新的生活虽要开始，然而还有新的荆棘。","chapter":"","pdfPage":"407"}],"traps":["只写中毒事件暴露制度问题，忽略它对陆萍性格和情感信念的打击。","把成长理解成陆萍被环境彻底驯服。","只写结尾振作，不分析中间的愤怒、动摇和反思。"],"learningLevel":"core","studyPriority":"必背","parentQuestionId":null,"doNotMemorizeSeparately":false,"questionFocus":"这题要说明作品通过哪些人物和情节表现“愤怒、反思与未完成的成长”，每段形成因果推进。","socraticQuestions":["题干要求你始终分析的主体是谁？","第一段的核心判断在文本中由什么行动支持？","三段怎样共同回答题干，而不是各讲一个知识点？"],"notAsking":["不要只复述情节。","不要把主题写成空泛口号。"],"threePartPlan":[{"step":"第一段","focus":"陆萍的成长起点是她对病人和产妇痛苦的敏锐感受，以及愿意亲自承担护理工作的行动。","useFromCore":"本题核心 Point 1","miniSentence":"首先，陆萍的成长起点是她对病人和产妇痛苦的敏锐感受，以及愿意亲自承担护理工作的行动"},{"step":"第二段","focus":"医院的标签化批评迫使陆萍重新认识个人英雄主义的局限。","useFromCore":"本题核心 Point 2","miniSentence":"其次，医院的标签化批评迫使陆萍重新认识个人英雄主义的局限"},{"step":"第三段","focus":"陆萍经过毒气中毒和集体冷漠后选择继续成长。","useFromCore":"本题核心 Point 3","miniSentence":"最后，陆萍经过毒气中毒和集体冷漠后选择继续成长"}],"commonMistakes":[{"mistake":"只复述情节。","why":"没有说明主题怎样形成。","fix":"写人物行动、原因和主题后果。"},{"mistake":"用抽象口号代替分析。","why":"缺少原文支撑。","fix":"每个观点配具体情节。"}],"summary":"愤怒、反思与未完成的成长：抓主体、变化与后果。","studentNote":"先背这一题，再练同一母题下的变式。","needsManualReview":false},{"id":"hospital-environment","work":"《在医院中》","workKey":"hospital","type":"艺术手法","title":"环境描写的作用","prompt":"分析《在医院中》环境描写的作用。","keywords":["环境描写","医院","寒冷","混乱","气氛","作用"],"thesis":"医院环境既是人物活动的现实空间，也映照出革命理想与落后现实之间的冲突。","points":[{"point":"寒冷和简陋写出陆萍进入医院时的自然与物质条件。","evidence":"“窗户外无声地飘着雪片。”","location":"第一部分：陆萍初到陕北山沟医院，窗外雪景与室内简陋形成整体环境。","explain":"安静雪景营造封闭和寒冷气氛，也预示医疗条件的艰苦。自然环境的压抑与人物初到时的身体感受相连，为后续每一次奔波增加现实重量。由此，前段环境先建立医院生活的基本困难。自然寒冷与室内简陋叠加，环境从一开始就成为人物行动的现实阻力。","link":"前段环境先建立医院生活的基本困难。","page":"P390","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"前","chain":{"who":"陆萍","action":"寒冷和简陋写出陆萍进入医院时的自然与物质条件。","reason":"安静雪景营造封闭和寒冷气氛，也预示医疗条件的艰苦","consequence":"前段环境先建立医院生活的基本困难。"},"searchPhrase":"窗户外无声地飘着雪片。","chapter":"","pdfPage":"401"},{"point":"基本医疗和生活需要难以满足，暴露医院管理的混乱。","evidence":"“她替她们要清洁的被袄，暖和的住室，滋补的营养，有次序的生活。”","location":"第二至三部分：陆萍为病人和产妇争取日常生活与医疗条件。","explain":"她争取的都是最基本的需要，却要反复交涉才能获得，说明问题来自长期管理和责任缺失。环境描写因此直接落在病人身体和日常处境中，承担社会批判功能。由此，中段环境把制度问题具体化为病人的现实困难。连最基本的医疗需要都要反复争取，说明问题来自制度惯性和责任缺失。","link":"中段环境把制度问题具体化为病人的现实困难。","page":"P387","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"陆萍与医院环境","action":"基本医疗和生活需要难以满足，暴露医院管理的混乱。","reason":"她争取的都是最基本的需要，却要反复交涉才能获得，说明问题来自长期管理和责任缺失","consequence":"中段环境把制度问题具体化为病人的现实困难。"},"searchPhrase":"她替她们要清洁的被袄，暖和的住室，滋","chapter":"","pdfPage":"398"},{"point":"事故后的群体注视把环境压力转成人物持续承受的孤独。","evidence":"“她已经成为医院里小小的怪人，被大多数人用异样的眼睛看着。”","location":"第三至四部分：中毒事件后，陆萍继续与医院旧习惯发生冲突。","explain":"异样目光把环境冷漠具体化为群体排斥，坚持专业标准的人反而被当作异类。环境由此参与人物孤立和成长，医院空间、群像关系与主题冲突连成一体。由此，后段环境压力把改革困境推进到组织文化层面。这种注视逐渐固定成群体秩序，使异见者长期承受孤立。","link":"后段环境压力把改革困境推进到组织文化层面。","page":"P387","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"陆萍与医院环境","action":"事故后的群体注视把环境压力转成人物持续承受的孤独。","reason":"异样目光把环境冷漠具体化为群体排斥，坚持专业标准的人反而被当作异类","consequence":"后段环境压力把改革困境推进到组织文化层面。"},"searchPhrase":"她已经成为医院里小小的怪人，被大多数","chapter":"","pdfPage":"398"}],"traps":["只摘抄环境，不解释环境与人物的关系。","只写寒冷，忽略医院制度和人际环境。"],"learningLevel":"core","studyPriority":"必背","parentQuestionId":null,"doNotMemorizeSeparately":false,"questionFocus":"这题不是让你列医院多冷多破，而是写环境怎样压迫人物并深化专业理想与组织现实的矛盾。","socraticQuestions":["寒冷和资源匮乏怎样影响人物的身体与情绪？","为什么最基本的医疗需要也要反复交涉？","冷落和异样目光怎样把环境压力推进到组织文化？"],"notAsking":["不要只写医院很冷、很破、很乱。","不要只列环境细节。","不要脱离人物和主题。"],"threePartPlan":[{"step":"第一段","focus":"写寒冷、简陋和资源匮乏构成人物行动的现实处境。","useFromCore":"医院环境的现实处境段落","miniSentence":"首先，医院寒冷而简陋，基本条件长期不足。"},{"step":"第二段","focus":"写环境怎样压迫陆萍的身体和情绪，并激化她与旧习惯的冲突。","useFromCore":"陆萍与医院环境冲突段落","miniSentence":"其次，恶劣条件持续消耗陆萍，也使她不断与旧习惯冲突。"},{"step":"第三段","focus":"写环境怎样深化专业标准与组织现实的矛盾，完成主题。","useFromCore":"专业理想与组织现实矛盾段落","miniSentence":"最后，环境不只是背景，它把专业理想与组织现实的矛盾推向深处。"}],"commonMistakes":[{"mistake":"只列手法名称。","why":"没有说明怎样产生效果。","fix":"补文本表现和表达效果。"},{"mistake":"引用后不分析。","why":"引文无法证明手法作用。","fix":"解释语言、结构或意象怎样影响理解。"}],"summary":"环境描写的作用：抓主体、变化与后果。","studentNote":"三段依次写现实处境、对人物行动的压迫、对主题的深化。","needsManualReview":false},{"id":"hospital-intellectual","work":"《在医院中》","workKey":"hospital","type":"人物与环境冲突","title":"知识分子与医院环境","prompt":"分析陆萍与医院环境的冲突。","keywords":["知识分子","医院","冲突","环境","改革","误解"],"thesis":"陆萍与医院的冲突，是青年知识分子的改革热情同落后环境、复杂人际关系之间的冲突。","points":[{"point":"陆萍把专业责任落实为改善病人基本生活和医疗条件的具体要求。","evidence":"“她替她们要清洁的被袄，暖和的住室，滋补的营养，有次序的生活。”","location":"第二至三部分：陆萍替病人和产妇争取清洁、保暖、营养与日常秩序。","explain":"她提出的要求都落在最基本的生活与医疗需要上，因此冲突来自公共职责和现实差距。知识分子形象兼具专业判断与具体关怀，也很快暴露出医院管理和资源分配的问题。由此，前段的专业实践为后续与环境发生冲突建立事实依据。","link":"前段的专业实践为后续与环境发生冲突建立事实依据。","page":"P387","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"前","searchPhrase":"她替她们要清洁的被袄，暖和的住室，滋","chapter":"","chain":{"who":"陆萍","action":"陆萍把专业责任落实为改善病人基本生活和医疗条件的具体要求。","reason":"她提出的要求都落在最基本的生活与医疗需要上，因此冲突来自公共职责和现实差距","consequence":"前段的专业实践为后续与环境发生冲突建立事实依据。"},"pdfPage":"398"},{"point":"制度标签和人际冷漠使她的改革无法进入正常讨论。","evidence":"“小资产阶级意识、知识分子的英雄主义、自由主义等等的帽子都往她头上戴。”","location":"第二至三部分：陆萍提出意见书并与同事、管理者发生冲突。","explain":"问题由医疗和管理转向身份判断，她的建议因此失去被认真回应的机会。个体表达受阻，也暴露制度内部缺少自我纠正能力。由此，中段冲突把知识分子困境扩展为组织文化问题。标签取代讨论后，组织失去吸纳专业意见的渠道，也无法从实际问题中获得反馈。","link":"中段冲突把知识分子困境扩展为组织文化问题。","page":"P394","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"陆萍与医院环境","action":"制度标签和人际冷漠使她的改革无法进入正常讨论。","reason":"个体表达受阻，也暴露制度内部缺少自我纠正能力","consequence":"中段冲突把知识分子困境扩展为组织文化问题。"},"searchPhrase":"小资产阶级意识、知识分子的英雄主义、","chapter":"","pdfPage":"405"},{"point":"经历冲突后，陆萍把批判热情转为持续的专业实践。","evidence":"“她仍然是那样兴致很浓厚的去照顾着那些产妇，那些婴儿，为着她们一点点的需索，去同管理员，总务处，秘书长，甚至院长去争执。”","location":"第四部分：陆萍在中毒事件后继续照顾病人、争取资源。","explain":"人物在受挫后继续承担现实责任，也学会在制度阻力中持续交涉。知识分子的理想因此获得更实际的行动方式，也让人物从热血批评者走向实践者。由此，后段行动回应了知识分子如何处理理想与环境关系的问题。批判因此从情绪表达转向具体行动，人物也由热血青年成长为承担现实工作的实践者。","link":"后段行动回应了知识分子如何处理理想与环境关系的问题。","page":"P388-P389","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"陆萍","action":"经历冲突后，陆萍把批判热情转为持续的专业实践。","reason":"人物在受挫后继续承担现实责任，也学会在制度阻力中持续交涉","consequence":"后段行动回应了知识分子如何处理理想与环境关系的问题。"},"searchPhrase":"她仍然是那样兴致很浓厚的去照顾着那些","chapter":"","pdfPage":"399-400"}],"traps":["把冲突写成陆萍与某个人的私人矛盾。","只写环境落后，不写陆萍自身的成长。"],"learningLevel":"variation","studyPriority":"高频变式","parentQuestionId":"hospital-individual-collective","doNotMemorizeSeparately":true,"questionFocus":"这题要围绕“知识分子与医院环境”回答题干任务，写清行动、原因和后果。","socraticQuestions":["题干要求你始终分析的主体是谁？","第一段的核心判断在文本中由什么行动支持？","三段怎样共同回答题干，而不是各讲一个知识点？"],"notAsking":["不要只概括内容。","不要把无关知识点拼进答案。"],"threePartPlan":[{"step":"第一段","focus":"陆萍把专业责任落实为改善病人基本生活和医疗条件的具体要求。","useFromCore":"调用《个体理想与集体秩序》主体段 1","miniSentence":"首先，陆萍把专业责任落实为改善病人基本生活和医疗条件的具体要求"},{"step":"第二段","focus":"制度标签和人际冷漠使她的改革无法进入正常讨论。","useFromCore":"调用《个体理想与集体秩序》主体段 2","miniSentence":"其次，制度标签和人际冷漠使她的改革无法进入正常讨论"},{"step":"第三段","focus":"经历冲突后，陆萍把批判热情转为持续的专业实践。","useFromCore":"调用《个体理想与集体秩序》主体段 3","miniSentence":"最后，经历冲突后，陆萍把批判热情转为持续的专业实践"}],"commonMistakes":[{"mistake":"答案没有中心判断。","why":"三段像知识拼盘。","fix":"先用 thesis 统一三段。"},{"mistake":"只有结论，没有因果。","why":"无法形成文学论证。","fix":"每段补齐行动、原因和后果。"}],"summary":"知识分子与医院环境：抓主体、变化与后果。","studentNote":"不必单独背全文，调用《个体理想与集体秩序》的材料，重点练习问法变化。","needsManualReview":false},{"id":"fortress-fang","work":"《围城》","workKey":"fortress","type":"人物形象","title":"方鸿渐的性格困境","prompt":"分析方鸿渐的人物形象。","keywords":["方鸿渐","性格","软弱","虚荣","围城","失败"],"thesis":"方鸿渐兼具自省、善意和虚荣、软弱。他能够辨认自己的缺点，却在关键时刻缺少承担和行动，常用体面、妥协与回避维持眼前平衡。爱情、职业和婚姻中的失败反复由这项性格矛盾推动，人物因此不断从一个困境进入另一个困境。","points":[{"stage":"前","point":"方鸿渐把社会认可看得高于真实能力，习惯借助外在凭证遮盖学识和身份的不足。","evidence":"“小小一方纸能把一个人的空疏、寡陋、愚笨都掩盖起来。”","location":"第一章：方鸿渐为了向父亲和岳家交代，购买并不存在的克莱登大学博士文凭。","explain":"人物清楚文凭无法代替真实学问，也知道父母和岳家期待一个体面的博士身份。他没有选择坦白，而是用虚假证件同时满足家庭期待、个人虚荣和求职需要。自省因此没有转化为诚实行动，反而变成维持外表后的长期羞耻，构成方鸿渐全部困境的性格起点。","link":"第一段说明他解决问题的首要方式是维护体面，这一选择直接引向后面的职业依附和婚姻危机。","page":"","edition":"人民文学出版社软皮版","chapter":"第一章","searchPhrase":"小小一方纸能把一个人的空疏、寡陋、愚","pdfPage":"","chain":{"who":"方鸿渐","action":"方鸿渐把社会认可看得高于真实能力，习惯借助外在凭证遮盖学识和身份的不足。","reason":"人物清楚文凭无法代替真实学问，也知道父母和岳家期待一个体面的博士身份","consequence":"第一段说明他解决问题的首要方式是维护体面，这一选择直接引向后面的职业依附和婚姻危机。"}},{"stage":"中","point":"面对失信和不公，方鸿渐缺少正面争取的勇气，习惯接受安排并用自我安慰消解不满。","evidence":"“鸿渐只好第二次声明没收到信，同时觉得降级为副教授已经天恩高厚了。”","location":"第六章：高松年曾承诺聘方鸿渐为教授，到校后却只给副教授职位，方鸿渐没有继续追责。","explain":"职位降低意味着承诺失效和职业尊严受损，方鸿渐本可追问聘约或拒绝接受。他却反复声明自己没有收到信，又用“天恩高厚”降低要求，把对方失信转化为自己的感恩。回避冲突暂时减轻压力，也使他失去主动争取和改变处境的机会，职业困境因此不是单纯环境造成，也来自他的被动选择。","link":"第二段把前段的体面焦虑落实到职场选择，说明自省缺少行动时只会转化为更深的依附。","page":"","edition":"人民文学出版社软皮版","chapter":"第六章","searchPhrase":"降级为副教授已经天恩高厚","pdfPage":"","chain":{"who":"方鸿渐","action":"面对失信和不公，方鸿渐缺少正面争取的勇气，习惯接受安排并用自我安慰消解不满。","reason":"他却反复声明自己没有收到信，又用“天恩高厚”降低要求，把对方失信转化为自己的感恩","consequence":"第二段把前段的体面焦虑落实到职场选择，说明自省缺少行动时只会转化为更深的依附。"}},{"stage":"后","point":"婚姻冲突中，方鸿渐能够意识到自己的过错，却因自尊和逃避拒绝修复关系，使矛盾持续升级。","evidence":"“鸿渐自知说话太重，心里懊悔，但一时上不愿屈服。”","location":"第九章：方鸿渐与孙柔嘉因工作、家庭和苏文纨争吵，方鸿渐说出重话后选择僵持。","explain":"方鸿渐知道语言伤害了妻子，也产生悔意，却把道歉理解成屈服和失去面子。于是他没有采取实际行动修复关系，双方只能在沉默和新的争吵中累积怨恨。与前两段相同，他具备判断问题的能力，却在需要承担后果时退缩，婚姻围城因此由他的软弱和对方的反击共同锁死。","link":"第三段完成性格因果闭环：体面焦虑、回避行动和拒绝修复最终使人物在婚姻中再次失败。","page":"","edition":"人民文学出版社软皮版","chapter":"第九章","searchPhrase":"自知说话太重","pdfPage":"","chain":{"who":"方鸿渐","action":"婚姻冲突中，方鸿渐能够意识到自己的过错，却因自尊和逃避拒绝修复关系，使矛盾持续升级。","reason":"于是他没有采取实际行动修复关系，双方只能在沉默和新的争吵中累积怨恨","consequence":"第三段完成性格因果闭环：体面焦虑、回避行动和拒绝修复最终使人物在婚姻中再次失败。"}}],"traps":["只写方鸿渐懦弱，忽略他能自省、有善意的一面。","只归因于环境，不说明他明知问题却仍回避行动。","分别罗列爱情、职业和婚姻失败，不写出相同的性格因果如何反复出现。"],"learningLevel":"core","studyPriority":"必背","parentQuestionId":null,"doNotMemorizeSeparately":false,"questionFocus":"这题要写“方鸿渐的性格困境”的关键性格怎样影响具体选择和后果，不能只列性格词。","socraticQuestions":["题干要求你始终分析的主体是谁？","第一段的核心判断在文本中由什么行动支持？","三段怎样共同回答题干，而不是各讲一个知识点？"],"notAsking":["不要只列性格形容词。","不要把其他人物写成段落主体。"],"threePartPlan":[{"step":"第一段","focus":"方鸿渐把社会认可看得高于真实能力，习惯借助外在凭证遮盖学识和身份的不足。","useFromCore":"本题核心 Point 1","miniSentence":"首先，方鸿渐把社会认可看得高于真实能力，习惯借助外在凭证遮盖学识和身份的不足"},{"step":"第二段","focus":"面对失信和不公，方鸿渐缺少正面争取的勇气，习惯接受安排并用自我安慰消解不满。","useFromCore":"本题核心 Point 2","miniSentence":"其次，面对失信和不公，方鸿渐缺少正面争取的勇气，习惯接受安排并用自我安慰消解不满"},{"step":"第三段","focus":"婚姻冲突中，方鸿渐能够意识到自己的过错，却因自尊和逃避拒绝修复关系，使矛盾持续升级。","useFromCore":"本题核心 Point 3","miniSentence":"最后，婚姻冲突中，方鸿渐能够意识到自己的过错，却因自尊和逃避拒绝修复关系，使矛盾持续升"}],"commonMistakes":[{"mistake":"只写人物性格词。","why":"没有证明性格怎样影响行动。","fix":"补充具体行动、原因和后果。"},{"mistake":"把别人的反应当主体。","why":"题干要求的人物流失了。","fix":"每段回到题干人物。"}],"summary":"方鸿渐的性格困境：抓主体、变化与后果。","studentNote":"先背这一题，再练同一母题下的变式。","needsManualReview":false},{"id":"fortress-satire","work":"《围城》","workKey":"fortress","type":"艺术手法","title":"讽刺艺术","prompt":"分析《围城》的讽刺艺术。","keywords":["讽刺","反讽","比喻","虚伪","知识分子","手法"],"thesis":"《围城》的讽刺从前中后三个阶段展开：早期从身体观看和社交虚伪切入，中段扩大到知识分子的身份包装和丑陋处境，结尾借一只走错时间的旧钟，把针对人物的笑提升为对人生和时间的感伤反思。","points":[{"point":"讽刺可以从日常社交行为切入，揭示观看者自身的欲望和道德双重标准。","evidence":"“有人叫她‘熟食铺子’（charcuterie），因为只有熟食店会把那许多颜色暖热的肉公开陈列；又有人叫她‘真理’，因为据说‘真理是赤裸裸的’。”","location":"第一章：回国邮船上，男学生议论鲍小姐的穿着和身材。","explain":"男性把女性身体切成可供公开欣赏和消费的对象，又借文化和机智为这种观看寻找体面理由。被谈论者本人没有获得解释权，反而成为众人表演趣味和优越感的媒介。讽刺对象因此从个人外貌扩展到围观者的欲望、性别双标和自命风雅。由此，开篇由身体观看建立讽刺基调，也预示人物常把私欲包装成高明见解。","link":"开篇由身体观看建立讽刺基调，也预示人物常把私欲包装成高明见解。","page":"","edition":"人民文学出版社软皮版","chapter":"第一章","searchPhrase":"有人叫她‘熟食铺子’（charcut","pdfPage":"","stage":"前","chain":{"who":"方鸿渐及相关人物","action":"讽刺可以从日常社交行为切入，揭示观看者自身的欲望和道德双重标准。","reason":"被谈论者本人没有获得解释权，反而成为众人表演趣味和优越感的媒介","consequence":"开篇由身体观看建立讽刺基调，也预示人物常把私欲包装成高明见解。"}},{"point":"人物在恶劣现实中失去体面外表，讽刺由个人姿态扩展到知识群体的共同幻觉。","evidence":"“下身的裤管，肥粗圆满，毫无折痕，可以无需人腿而卓立地上，像一对空心的国家柱石。”","location":"第五章：前往三闾大学的泥泞旅途中，李梅亭淋雨后的衣裤形状。","explain":"湿透又烤干的衣裤脱离人的支撑仍能站立，把衣冠体面和内在空洞同时写成一幅滑稽图像。李梅亭重视身份、资格和派头，却在大雨和泥水里失去所有风度。作者用夸张物件把知识分子的社会包装拉回身体和物质现实，讽刺其脆弱、虚荣和可笑。由此，中段讽刺从个人姿态扩展到整个知识群体的体面幻觉。","link":"中段讽刺从个人姿态扩展到整个知识群体的体面幻觉。","page":"","edition":"人民文学出版社软皮版","chapter":"第五章","searchPhrase":"下身的裤管，肥粗圆满，毫无折痕，可以","pdfPage":"","stage":"中","chain":{"who":"方鸿渐及相关人物","action":"人物在恶劣现实中失去体面外表，讽刺由个人姿态扩展到知识群体的共同幻觉。","reason":"湿透又烤干的衣裤脱离人的支撑仍能站立，把衣冠体面和内在空洞同时写成一幅滑稽图像","consequence":"中段讽刺从个人姿态扩展到整个知识群体的体面幻觉。"}},{"point":"后期讽刺从具体人物扩展到社会关系，揭示不同空间共享的精神环境。","evidence":"“School for scandal，全是School for scandal，家庭罢，学校罢，彼此彼此。”","location":"第九章：方鸿渐经历大家庭摩擦后，把家庭和三闾大学并称为“造谣学校”。","explain":"家庭和大学在流言、算计和人际消耗上变得没有区别，人物从一个围城进入另一个围城。讽刺因此不只嘲笑某个坏人，而揭示不同社会空间共享的精神环境，也回扣全书的循环结构。由此，后段把人物笑料提升为对社会关系和人生处境的整体反思。","link":"后段把人物笑料提升为对社会关系和人生处境的整体反思。","page":"","edition":"人民文学出版社软皮版","chapter":"第九章","searchPhrase":"Schoolforscandal，全","pdfPage":"","stage":"后","chain":{"who":"方鸿渐及相关人物","action":"后期讽刺从具体人物扩展到社会关系，揭示不同空间共享的精神环境。","reason":"家庭和大学在流言、算计和人际消耗上变得没有区别，人物从一个围城进入另一个围城","consequence":"后段把人物笑料提升为对社会关系和人生处境的整体反思。"}}],"traps":["三个主体段反复使用同一条比喻，无法证明讽刺贯穿全书。","只写人物可笑，不分析叙述者在何种角度和语气中完成讽刺。","忽略结尾旧钟带来的感伤，把《围城》写成单纯挖苦小说。"],"learningLevel":"core","studyPriority":"必背","parentQuestionId":null,"doNotMemorizeSeparately":false,"questionFocus":"这题要写比喻、夸张、人物语言和叙事判断怎样把虚荣、虚伪与人生困境具体化。","socraticQuestions":["人物语言怎样让他们自我暴露，而不需要叙述者直接骂他们？","比喻和夸张怎样把抽象虚荣变成可见形象？","小说为什么一边讽刺人物，一边保留悲悯和人生困境意识？"],"notAsking":["不是只写小说讥讽了谁。","不要只列比喻、夸张等手法名称。","不要只有情节，没有语言效果。"],"threePartPlan":[{"step":"第一段","focus":"写夸张、比喻和人物语言怎样把虚荣与虚伪具体化。","useFromCore":"讽刺具象化段落","miniSentence":"首先，小说用夸张、比喻和人物语言把虚荣与虚伪变得可见。"},{"step":"第二段","focus":"写反讽叙述怎样揭示知识分子、社交关系和教育制度的空洞。","useFromCore":"语言与知识分子讽刺段落","miniSentence":"其次，反讽叙述让知识分子的体面包装自我瓦解。"},{"step":"第三段","focus":"写平衡视角怎样让讽刺同时包含批判、悲悯和人生困境。","useFromCore":"平衡视角段落","miniSentence":"最后，讽刺并非单向审判，它还包含悲悯和人生困境意识。"}],"commonMistakes":[{"mistake":"只列手法名称。","why":"没有说明怎样产生效果。","fix":"补文本表现和表达效果。"},{"mistake":"引用后不分析。","why":"引文无法证明手法作用。","fix":"解释语言、结构或意象怎样影响理解。"}],"summary":"讽刺艺术：抓主体、变化与后果。","studentNote":"每段都写“手法—文本表现—效果”，不要按前中后情节作流水账。","needsManualReview":false},{"id":"fortress-marriage","work":"《围城》","workKey":"fortress","type":"主题思想","title":"婚姻围城","prompt":"结合文本，分析《围城》中婚姻围城的含义。","keywords":["婚姻","围城","爱情","失望","选择","方鸿渐"],"thesis":"婚姻围城在小说中表现为对理想生活的想象和进入现实后的失望，方鸿渐与孙柔嘉的婚姻集中写出这种困境。","points":[{"point":"婚姻在人物想象中代表着理想和归属。","evidence":"“结婚仿佛金漆的鸟笼，笼子外面的鸟想住进去，笼内的鸟想飞出来。”","location":"第三至四章上海爱情线，以及第五至九章方鸿渐与孙柔嘉相识、结婚和婚后生活；重点看人物对婚姻的想象如何变化。","explain":"人物把进入关系理解为获得归属和完整，外壳的体面感又加强这种想象。期待中缺少对责任和现实生活的准备，婚姻从一开始就承担了解决人生问题的幻想。由此，期待越高，进入现实后的落差越明显。人物想象的完美关系与婚姻现实之间落差越大，围城的悲剧感越强。","link":"期待越高，进入现实后的落差越明显。","page":"","edition":"人民文学出版社软皮版","chapter":"第三章","searchPhrase":"结婚仿佛金漆的鸟笼，笼子外面的鸟想住","pdfPage":"","stage":"前","chain":{"who":"方鸿渐与孙柔嘉","action":"婚姻在人物想象中代表着理想和归属。","reason":"期待中缺少对责任和现实生活的准备，婚姻从一开始就承担了解决人生问题的幻想","consequence":"期待越高，进入现实后的落差越明显。"}},{"point":"进入婚姻后，日常矛盾和现实压力把幻想推向破裂。","evidence":"“好，咱们算散伙。行李衣服，你自己去办，别再来找我。”","location":"第九章：方鸿渐失业后与孙柔嘉在上海发生激烈争执，孙柔嘉提出散伙并回姑母家。","explain":"关系破裂被写成合作清算，情感退场后只剩具体事务的分割。日常压力不断累积，原先的期待被现实磨掉，新的束缚由此形成。由此，婚姻困境与事业失败互相推动，使“围城”脱离单纯爱情比喻。婚姻破裂因此不仅是爱情消失，也是经济、家庭和沟通压力共同作用的结果。","link":"婚姻困境与事业失败互相推动，使“围城”脱离单纯爱情比喻。","page":"","edition":"人民文学出版社软皮版","chapter":"第九章","searchPhrase":"好，咱们算散伙。行李衣服，你自己去办","pdfPage":"","stage":"中","chain":{"who":"方鸿渐与孙柔嘉","action":"进入婚姻后，日常矛盾和现实压力把幻想推向破裂。","reason":"关系破裂被写成合作清算，情感退场后只剩具体事务的分割","consequence":"婚姻困境与事业失败互相推动，使“围城”脱离单纯爱情比喻。"}},{"point":"三闾大学的婚姻议论显示婚姻也会被职位、人情和组织利益利用。","evidence":"“在这儿结婚成家，就安定下来，走不了，学校借光不少。”","location":"第六章：汪处厚劝方鸿渐和孙柔嘉成家，把婚姻与学校留人联系起来。","explain":"婚姻被当成稳定教师的工具，私人关系进入学校的人情和岗位安排。人物以为结婚能解决漂泊，实际却进一步被组织和关系网络固定，围城结构由此扩展到职业空间。由此，中段把婚姻围城与三闾大学的人事关系连接起来。","link":"中段把婚姻围城与三闾大学的人事关系连接起来。","page":"","edition":"人民文学出版社软皮版","chapter":"第六章","searchPhrase":"在这儿结婚成家，就安定下来，走不了，","pdfPage":"","stage":"后","chain":{"who":"方鸿渐与孙柔嘉","action":"三闾大学的婚姻议论显示婚姻也会被职位、人情和组织利益利用。","reason":"婚姻被当成稳定教师的工具，私人关系进入学校的人情和岗位安排","consequence":"中段把婚姻围城与三闾大学的人事关系连接起来。"}}],"traps":["只写某段感情失败，忽略婚姻围城的普遍含义。","只讲婚姻，不断开事业围城的互相映照。"],"learningLevel":"core","studyPriority":"必背","parentQuestionId":null,"doNotMemorizeSeparately":false,"questionFocus":"这题要说明作品通过哪些人物和情节表现“婚姻围城”，每段形成因果推进。","socraticQuestions":["题干要求你始终分析的主体是谁？","第一段的核心判断在文本中由什么行动支持？","三段怎样共同回答题干，而不是各讲一个知识点？"],"notAsking":["不要只复述情节。","不要把主题写成空泛口号。"],"threePartPlan":[{"step":"第一段","focus":"婚姻在人物想象中代表着理想和归属。","useFromCore":"本题核心 Point 1","miniSentence":"首先，婚姻在人物想象中代表着理想和归属"},{"step":"第二段","focus":"进入婚姻后，日常矛盾和现实压力把幻想推向破裂。","useFromCore":"本题核心 Point 2","miniSentence":"其次，进入婚姻后，日常矛盾和现实压力把幻想推向破裂"},{"step":"第三段","focus":"三闾大学的婚姻议论显示婚姻也会被职位、人情和组织利益利用。","useFromCore":"本题核心 Point 3","miniSentence":"最后，三闾大学的婚姻议论显示婚姻也会被职位、人情和组织利益利用"}],"commonMistakes":[{"mistake":"只复述情节。","why":"没有说明主题怎样形成。","fix":"写人物行动、原因和主题后果。"},{"mistake":"用抽象口号代替分析。","why":"缺少原文支撑。","fix":"每个观点配具体情节。"}],"summary":"婚姻围城：抓主体、变化与后果。","studentNote":"先背这一题，再练同一母题下的变式。","needsManualReview":false},{"id":"fortress-parallel","work":"《围城》","workKey":"fortress","type":"人物关系","title":"赵辛楣与方鸿渐","prompt":"分析赵辛楣与方鸿渐的平行关系及其作用。","keywords":["赵辛楣","方鸿渐","平行","对照","三闾大学","知识分子"],"thesis":"赵辛楣和方鸿渐构成同途殊态的对照关系。两人都追求爱情、职业和婚姻中的出路，却分别表现出主动精明与被动退让。作者借两人互相映照，既写出方鸿渐的软弱，也说明知识分子无论善于处世还是逃避现实，都难以真正走出社会与自我共同造成的围城。","points":[{"point":"初次见面时，赵辛楣精于社交、自信主动，方鸿渐敏感退让，两人的身份感和行动力立即显出高低。","evidence":"“赵辛楣和鸿渐拉拉手，傲兀地把他从头到脚看一下，好像鸿渐是页一览而尽的大字幼稚园读本。”“鸿渐诧异，这姓赵的怎会知道自己，忽然想也许这人看过《沪报》那条新闻，立刻局促难受。”","location":"第三章：苏文纨家中初见赵辛楣。重点找赵辛楣审视方鸿渐时的动作，以及方鸿渐随后的心理反应。","explain":"赵辛楣对社交位置的自觉掌控来自家世、留学和外事经历，他很快把潜在竞争变成审视和控制。方鸿渐在对方的目光中迅速怀疑自己，尚未正面交锋，心理上已经退到被动位置。两人的相似处境来自同一场爱情竞争，社会能力和性格力量却有明显差距。这一组对照先建立强弱关系，也为后文两人在爱情、职业和婚姻中的不同走向埋下性格基础。由此，因此，平行关系首先表现为同一处境中的不同姿态，两人的差异使互相对照的作用更加清楚。","link":"因此，平行关系首先表现为同一处境中的不同姿态，两人的差异使互相对照的作用更加清楚。","page":"","edition":"人民文学出版社软皮版","chapter":"第三章","searchPhrase":"赵辛楣和鸿渐拉拉手，傲兀地把他从头到","pdfPage":"","stage":"前","chain":{"who":"方鸿渐","action":"初次见面时，赵辛楣精于社交、自信主动，方鸿渐敏感退让，两人的身份感和行动力立即显出高低。","reason":"赵辛楣对社交位置的自觉掌控来自家世、留学和外事经历，他很快把潜在竞争变成审视和控制","consequence":"因此，平行关系首先表现为同一处境中的不同姿态，两人的差异使互相对照的作用更加清楚。"}},{"point":"三闾大学时期，赵辛楣的资源使方鸿渐接受安排并处于依附位置。","evidence":"“鸿渐自知在学校的地位不稳固，又经辛楣细陈利害，刘东方恳切劝驾，居然大胆老脸、低头小心教起英文来。”","location":"第六章：刘东方不愿继续代课，赵辛楣推荐方鸿渐，方鸿渐接受安排。","explain":"方鸿渐没有能力自主争取职位，只能依靠赵辛楣分析利害并接受教学任务。友情中的帮助同时带来依赖，两人的性格、资源和职场能力差异进一步显现。由此，中段关系从爱情竞争转入职业依附。这种提携包含善意，也把方鸿渐的职场生存绑定在赵辛楣的资源上。","link":"中段关系从爱情竞争转入职业依附。","page":"","edition":"人民文学出版社软皮版","chapter":"第六章","searchPhrase":"鸿渐自知在学校的地位不稳固，又经辛楣","pdfPage":"","stage":"中","chain":{"who":"方鸿渐","action":"三闾大学时期，赵辛楣的资源使方鸿渐接受安排并处于依附位置。","reason":"方鸿渐没有能力自主争取职位，只能依靠赵辛楣分析利害并接受教学任务","consequence":"中段关系从爱情竞争转入职业依附。"}},{"point":"两人的不同结局共同构成对照作用：既突出方鸿渐的依附性格，也说明不同个人仍受战时知识界环境限制。","evidence":"“辛楣既然一番好意，我很想再到里面去碰碰运气。”","location":"第九章：赵辛楣来信劝方鸿渐去重庆，方鸿渐向孙柔嘉提出计划。","explain":"方鸿渐在婚姻和事业受挫后，又把赵辛楣的介绍当成新的出路。赵辛楣拥有更多资源和行动能力，却同样面对战争、职业与人际关系的限制。作者借两人的不同走向对照方鸿渐的被动，同时说明个人能力并不能自动解决时代环境造成的困境。","link":"因此，对照作用同时服务于人物塑造和社会环境批判。","page":"","edition":"人民文学出版社软皮版","chapter":"第九章","searchPhrase":"辛楣既然一番好意，我很想再到里面去碰","pdfPage":"","stage":"后","chain":{"who":"方鸿渐","action":"婚姻危机后，方鸿渐再次把重庆和赵辛楣当成出路，依附关系延续到结尾。","reason":"由此，后段关系证明人物困境没有因环境变化自动解决","consequence":"后段关系证明人物困境没有因环境变化自动解决。"}}],"traps":["只并列写两个人，不说明二者在哪些层面相似、哪些层面相反。","把赵辛楣写成完人，忽略他的精明、虚荣、权力表演和两面性。","把方鸿渐的困境全部归因于赵辛楣，忽略方鸿渐自身的犹豫和依附。"],"learningLevel":"variation","studyPriority":"高频变式","parentQuestionId":"fortress-fang","doNotMemorizeSeparately":true,"questionFocus":"这题要比较两人在爱情、职业和结局中的选择，并回答这种平行关系有什么作用。","socraticQuestions":["为什么同样面对爱情和职业困境，赵辛楣更主动，方鸿渐更被动？","赵辛楣的资源怎样帮助方鸿渐，也怎样形成依附？","两人的不同结局为什么仍然共同表现战时知识分子的困境？"],"notAsking":["不是只写赵辛楣或方鸿渐的人物小传。","不要只列性格差异。","不要把赵辛楣的结局写成脱离时代的成功。"],"threePartPlan":[{"step":"第一段","focus":"写两人在爱情追求中面对理想与现实，但选择不同。","useFromCore":"对应对照关系前段","miniSentence":"首先，两人都面对爱情理想与现实落差，但选择不同。"},{"step":"第二段","focus":"写事业和社交中的行动能力、资源与依附差异。","useFromCore":"对应对照关系中段","miniSentence":"其次，赵辛楣更有资源和行动力，方鸿渐更容易依附。"},{"step":"第三段","focus":"明确写出对照作用：突出方鸿渐困境，也说明两人共同受困于社会环境。","useFromCore":"对应对照关系后段","miniSentence":"最后，这种对照既突出方鸿渐的性格困境，也说明两人仍受共同时代环境限制。"}],"commonMistakes":[{"mistake":"只写两个人的性格。","why":"没有回答关系怎样变化。","fix":"写互动、态度变化和结果。"},{"mistake":"观察主体中途更换。","why":"答案会偏离题干。","fix":"每段先标清是谁对谁的看法。"}],"summary":"赵辛楣与方鸿渐：抓主体、变化与后果。","studentNote":"前两段写差异，第三段必须明确回答对照作用，不能停在经历比较。","needsManualReview":false},{"id":"saffi-loneliness","work":"《莎菲女士的日记》","workKey":"saffi","type":"主题思想","title":"莎菲的孤独","prompt":"分析莎菲孤独感的来源及其意义。","keywords":["孤独","寂寞","苇弟","蕴姊","无人理解","新女性"],"thesis":"莎菲的孤独由病中独居和亲友照料无法抵达精神世界而加深，苇弟的爱不能理解她，蕴姊去世又使她失去唯一真正的精神关系。人物因此既缺少陪伴之外的共鸣，也缺少能够承接新女性意识的女性共同体。","points":[{"stage":"前","point":"病中独居使莎菲需要陪伴，亲友的照料却只停留在生活层面，无法消除精神孤独。","evidence":"“我总愿意有那么一个人能了解得我清清楚楚的，如若不懂得我，我要那些爱，那些体贴做什么？”","location":"前三则日记：莎菲独居北京、久病未愈，苇弟反复来探望，她一面接受朋友的照料，一面不断确认这种关怀无法理解自己的内心。","explain":"苇弟和朋友的探望能够缓解病中的生活不便，却无法回答莎菲对人生、爱情和自我价值的追问。她把被理解放在被照顾之前，泛泛的爱与体贴因此不能填补精神空缺。陪伴越频繁，她越清楚周围的人只能看到她病弱、任性的表面，疾病和独居造成的孤独由此变成关系内部仍无人理解的孤独。","link":"前段的日常陪伴说明物质照顾无法替代精神理解，孤独已经超出一般的生活寂寞。","page":"P40","edition":"浙江文艺出版社《丁玲小说》（标注版）","chapter":"","searchPhrase":"我总愿意有那么一个人能了解得我清清楚","pdfPage":"51","chain":{"who":"莎菲","action":"病中独居使莎菲需要陪伴，亲友的照料却只停留在生活层面，无法消除精神孤独。","reason":"苇弟和朋友的探望能够缓解病中的生活不便，却无法回答莎菲对人生、爱情和自我价值的追问","consequence":"前段的日常陪伴说明物质照顾无法替代精神理解，孤独已经超出一般的生活寂寞。"}},{"stage":"中","point":"苇弟真诚而软弱的追求无法与莎菲形成平等对话，使亲密关系反而成为负担。","evidence":"“他又尽他唯一的本能在哭。”","location":"苇弟多次探望莎菲，受冷遇后反复哭泣；莎菲在日记中写下他表达感情的方式，也记录自己的厌烦、愧疚和无法回应的矛盾。","explain":"苇弟把爱落实为陪伴、顺从和眼泪，这种方式证明他的真诚，也暴露他缺少独立的精神回应。莎菲需要能够理解她思想变化的同路人，苇弟却把关系变成依赖和情绪索取。她因此既感到他的爱是一种温暖，又把它看成无法承受的负担，越接近这种不对等的亲密关系，越确认自己仍没有可以平等交流的人。","link":"苇弟的爱无法解决理解问题，使莎菲在友情和爱情之间同时感到孤立。","page":"P42","edition":"浙江文艺出版社《丁玲小说》（标注版）","chapter":"","searchPhrase":"他又尽他唯一的本能在哭","pdfPage":"53","chain":{"who":"莎菲","action":"苇弟真诚而软弱的追求无法与莎菲形成平等对话，使亲密关系反而成为负担。","reason":"苇弟把爱落实为陪伴、顺从和眼泪，这种方式证明他的真诚，也暴露他缺少独立的精神回应","consequence":"苇弟的爱无法解决理解问题，使莎菲在友情和爱情之间同时感到孤立。"}},{"stage":"后","point":"蕴姊之死让莎菲失去唯一能够承接情感和理解的精神关系，孤独由此固定为长期处境。","evidence":"“虽说有几个朋友，他们也很体惜我，但在我所感应得出的我和他们的关系能和蕴姊的爱在一个天平上相称吗？”“想起蕴姊，我是真应当像从前在蕴姊面前撒娇一样的纵声大哭。”","location":"三月二十一夜：莎菲回忆蕴姊婚后的遭遇和死亡，将她与身边朋友的体惜进行比较。","explain":"莎菲承认朋友们也在照顾自己，却认为这些关系无法与蕴姊的爱相等。蕴姊既理解她的敏感，也承接她可以坦白撒娇、哭泣和追问自我的部分，她的死亡因此切断莎菲与过去生活及女性共同体之间的联系。此后日记代替蕴姊成为诉说对象，孤独也从一时缺少陪伴变成长期没有精神同盟的处境。","link":"结尾把个人的孤独推进到五四新女性缺少精神共同体的社会困境。","page":"P62-P65","edition":"浙江文艺出版社《丁玲小说》（标注版）","chapter":"","searchPhrase":"能和蕴姊的爱在一个天平上相称","pdfPage":"73-76","chain":{"who":"莎菲","action":"蕴姊之死让莎菲失去唯一能够承接情感和理解的精神关系，孤独由此固定为长期处境。","reason":"莎菲承认朋友们也在照顾自己，却认为这些关系无法与蕴姊的爱相等","consequence":"结尾把个人的孤独推进到五四新女性缺少精神共同体的社会困境。"}}],"traps":["只把孤独解释为莎菲性格孤僻，忽略身边亲友无法理解她的原因。","写苇弟只强调他真诚深情，没有解释他的爱为什么无法进入莎菲的精神世界。","提到蕴姊只写死亡本身，不说明她曾经承担的理解功能和女性共同体意义。"],"learningLevel":"variation","studyPriority":"高频变式","parentQuestionId":"saffi-awakening","doNotMemorizeSeparately":true,"questionFocus":"这题要说明作品通过哪些人物和情节表现“莎菲的孤独”，每段形成因果推进。","socraticQuestions":["题干要求你始终分析的主体是谁？","第一段的核心判断在文本中由什么行动支持？","三段怎样共同回答题干，而不是各讲一个知识点？"],"notAsking":["不要只复述情节。","不要把主题写成空泛口号。"],"threePartPlan":[{"step":"第一段","focus":"病中独居使莎菲需要陪伴，亲友的照料却只停留在生活层面，无法消除精神孤独。","useFromCore":"调用《觉醒后的困境》主体段 1","miniSentence":"首先，病中独居使莎菲需要陪伴，亲友的照料却只停留在生活层面，无法消除精神孤独"},{"step":"第二段","focus":"苇弟真诚而软弱的追求无法与莎菲形成平等对话，使亲密关系反而成为负担。","useFromCore":"调用《觉醒后的困境》主体段 2","miniSentence":"其次，苇弟真诚而软弱的追求无法与莎菲形成平等对话，使亲密关系反而成为负担"},{"step":"第三段","focus":"蕴姊之死让莎菲失去唯一能够承接情感和理解的精神关系，孤独由此固定为长期处境。","useFromCore":"调用《觉醒后的困境》主体段 3","miniSentence":"最后，蕴姊之死让莎菲失去唯一能够承接情感和理解的精神关系，孤独由此固定为长期处境"}],"commonMistakes":[{"mistake":"只复述情节。","why":"没有说明主题怎样形成。","fix":"写人物行动、原因和主题后果。"},{"mistake":"用抽象口号代替分析。","why":"缺少原文支撑。","fix":"每个观点配具体情节。"}],"summary":"莎菲的孤独：抓主体、变化与后果。","studentNote":"不必单独背全文，调用《觉醒后的困境》的材料，重点练习问法变化。","needsManualReview":false},{"id":"saffi-diary-form","work":"《莎菲女士的日记》","workKey":"saffi","type":"艺术手法","title":"日记体的叙事效果","prompt":"分析《莎菲女士的日记》的日记体特征及其表达效果。","keywords":["日记体","第一人称","私人性","即时性","独语","真实感"],"thesis":"日记体让莎菲的私人情感、即时情绪和内心独语直接呈现，使人物矛盾具有现场感和真实感。","points":[{"point":"即时性让情绪变化呈现为连续过程。","evidence":"“我只得忍耐着，低下头去。”","location":"莎菲面对欲望和羞耻的即时日记，重点看人物当天的克制动作。","page":"P43","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"自我压抑被立刻记录在当天，读者能够看见冲动与羞耻如何在同一时刻形成。日记没有经过事后整理，情绪因此保留现场感，人物变化也呈现为连续的心理过程。由此，后段即时记录使日记体的时间感和心理真实同时成立。","link":"后段即时记录使日记体的时间感和心理真实同时成立。","stage":"前","chain":{"who":"莎菲","action":"即时性让情绪变化呈现为连续过程。","reason":"日记没有经过事后整理，情绪因此保留现场感，人物变化也呈现为连续的心理过程","consequence":"后段即时记录使日记体的时间感和心理真实同时成立。"},"searchPhrase":"我只得忍耐着，低下头去。","chapter":"","pdfPage":"54"},{"point":"独语性把人物内心冲突写成两个自我的争辩。","evidence":"“一个女人这样放肆，是不会得到好结果的。”","location":"“难道我去找他吗”等内心争辩。","page":"P45","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"外部规范进入人物内心后，与自身欲望形成争辩。两种声音同时被记录，冲突不需要旁白解释，人物在自问自答中显出分裂而清醒的主体。日记把相互冲突的声音并置，读者无需旁白即可看见人物如何被自我规训又试图反抗。","link":"结尾要回到形式与主题的统一。","stage":"中","chain":{"who":"莎菲","action":"独语性把人物内心冲突写成两个自我的争辩。","reason":"两种声音同时被记录，冲突不需要旁白解释，人物在自问自答中显出分裂而清醒的主体","consequence":"日记把相互冲突的声音并置，读者无需旁白即可看见人物如何被自我规训又试图反抗"},"searchPhrase":"一个女人这样放肆，是不会得到好结果的","chapter":"","pdfPage":"56"},{"point":"私人性使莎菲能够说出不愿公开的欲望与羞耻。","evidence":"“我恨不得用脚尖踢出他去，不过我又为了另一种情绪所支配，我向他摇了头，表示是不厌烦他的来到。”","location":"莎菲与凌吉士关系变化前后的日记，重点看同一瞬间的冲动和掩饰。","page":"P61","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"第一人称记录让莎菲可以同时写下愤怒、依恋和掩饰，不必先整理成符合社会期待的形象。读者看到的是未经外部审查的内心现场，羞耻、欲望与自我辩解彼此交叠，日记体的私人性因此带来强烈真实感。由此，形式上的私密，使人物的矛盾能够直接暴露。","link":"形式上的私密，使人物的矛盾能够直接暴露。","stage":"后","chain":{"who":"莎菲","action":"私人性使莎菲能够说出不愿公开的欲望与羞耻。","reason":"第一人称记录让莎菲可以同时写下愤怒、依恋和掩饰，不必先整理成符合社会期待的形象","consequence":"形式上的私密，使人物的矛盾能够直接暴露。"},"searchPhrase":"我恨不得用脚尖踢出他去，不过我又为了","chapter":"","pdfPage":"72"}],"traps":["只写第一人称，不分析它对心理、节奏和主题的作用。","把日记体当作内容复述。"],"learningLevel":"core","studyPriority":"必背","parentQuestionId":null,"doNotMemorizeSeparately":false,"questionFocus":"这题要写“日记体的叙事效果”使用的手法、文本表现和效果，不能只报术语。","socraticQuestions":["题干要求你始终分析的主体是谁？","第一段的核心判断在文本中由什么行动支持？","三段怎样共同回答题干，而不是各讲一个知识点？"],"notAsking":["不要只报手法名称。","不要引用原文却不分析效果。"],"threePartPlan":[{"step":"第一段","focus":"即时性让情绪变化呈现为连续过程。","useFromCore":"本题核心 Point 1","miniSentence":"首先，即时性让情绪变化呈现为连续过程"},{"step":"第二段","focus":"独语性把人物内心冲突写成两个自我的争辩。","useFromCore":"本题核心 Point 2","miniSentence":"其次，独语性把人物内心冲突写成两个自我的争辩"},{"step":"第三段","focus":"私人性使莎菲能够说出不愿公开的欲望与羞耻。","useFromCore":"本题核心 Point 3","miniSentence":"最后，私人性使莎菲能够说出不愿公开的欲望与羞耻"}],"commonMistakes":[{"mistake":"只列手法名称。","why":"没有说明怎样产生效果。","fix":"补文本表现和表达效果。"},{"mistake":"引用后不分析。","why":"引文无法证明手法作用。","fix":"解释语言、结构或意象怎样影响理解。"}],"summary":"日记体的叙事效果：抓主体、变化与后果。","studentNote":"先背这一题，再练同一母题下的变式。","needsManualReview":false},{"id":"water-contrast","work":"《水》","workKey":"water","type":"艺术手法","ti ,"needsManualReview":false},{"id":"hospital-group","work":"《在医院中》","workKey":"hospital","type":"人物形象","title":"医院人物群像的三层结构","prompt":"分析《在医院中》医院人物群像的构成及其作用。","keywords":["病员","老百姓","张医生太太","看护","勤务人员","外行管理","院长"],"thesis":"《在医院中》的医院人物群像按社会位置分为三层：老区病员既是恶劣医疗条件的受害者，也受生活习惯和认知条件限制；院方工作人员由家属型看护、短期培训人员和勤务人员构成，服务意识与专业能力不足；院方管理人员又大多不懂医务，却掌握资源和权力。三层人物共同形成陆萍改革受阻的现实环境。","points":[{"stage":"前","point":"病员是恶劣医疗和生活条件的直接承受者，但受旧习惯和谣言影响，对改革者的支持并不稳定。","evidence":"“她形容这些病员的生活，简直像受罪。”“一些病员，老百姓，连看护在内都围着看她。不一会，她们又把院子弄成原来的样子了。谁也不会感觉到有什么抱歉。”“病员们也对她冷淡了，说她浪漫。”","location":"第一至第四部分：陆萍巡视病房、打扫院子时，病员和老百姓围看；中毒事件后，病员又受流言影响疏远她。","explain":"原文把他们的处境概括为难以忍受的痛苦，说明群众承受疾病、贫穷和医疗条件不足的多重压力。周围人也会在围看之后恢复原有卫生习惯，未意识到清洁工作与自身康复之间的关系。流言出现后，他们又把陆萍视为“浪漫”的怪人。群众因此既是受害者，也会因生活习惯和外部舆论与改革者疏远。病员构成群像的社会基础，下一层应转向从这一环境中产生、又负责具体护理和勤务工作的院方人员。","link":"病员构成群像的社会基础，下一层是从这一环境中产生、又负责具体护理和勤务工作的院方人员。","page":"","edition":"浙江文艺出版社《丁玲小说》（标注版）","chapter":"","searchPhrase":"她形容这些病员的生活","pdfPage":"","chain":{"who":"陆萍与医院环境","action":"病员是恶劣医疗和生活条件的直接承受者，但受旧习惯和谣言影响，对改革者的支持并不稳定。","reason":"原文把他们的处境概括为难以忍受的痛苦，说明群众承受疾病、贫穷和医疗条件不足的多重压力","consequence":"病员构成群像的社会基础，下一层是从这一环境中产生、又负责具体护理和勤务工作的院方人员。"}},{"stage":"中","point":"院方工作人员由家属型看护、短期培训人员和勤务人员构成，服务意识、专业能力和责任感普遍不足。","evidence":"“住着一个姓张的医生的老婆，是一个看护。”“她们都是产科室的看护，学了三个月看护知识，可以认几十个字，记得十几个中国药名。她们对看护工作既没有兴趣，也没有认识。”“她们毫无服务的精神，又懒又脏，只有时对于鞋袜的缝补，衣服的浆洗才表示兴趣。”","location":"第一至第三部分：张医生的妻子和总务处长的妻子在产科室做看护，其他勤务人员负责打扫和照料病员。","explain":"看护岗位依靠家属关系和短期培训补充，人员只掌握少量药名和基础操作，缺少职业训练与责任意识。她们不关心护理工作，却关注鞋袜缝补和衣服浆洗等私人事务。工作最终由陆萍监督或代替，医院的专业护理无法形成稳定制度。工作人员因此既是条件不足的受害者，也是造成护理混乱的直接行动者。","link":"工作人员的专业与责任不足使具体医疗工作依赖陆萍，外行管理层又把资源和管理权掌握在不了解医疗的人手中。","page":"","edition":"浙江文艺出版社《丁玲小说》（标注版）","chapter":"","searchPhrase":"学了三个月看护知识","pdfPage":"","chain":{"who":"陆萍与医院环境","action":"院方工作人员由家属型看护、短期培训人员和勤务人员构成，服务意识、专业能力和责任感普遍不足。","reason":"看护岗位依靠家属关系和短期培训补充，人员只掌握少量药名和基础操作，缺少职业训练与责任意识","consequence":"工作人员的专业与责任不足使具体医疗工作依赖陆萍，外行管理层又把资源和管理权掌握在不了解医疗的人手中。"}},{"stage":"后","point":"院方管理人员由不懂医务的行政干部掌握资源与权力，并以轻视态度对待专业女性。","evidence":"“院长是一个四川人，种田的出身，后来在军队里工作很久，对医务完全是外行。他以一种对女同志并不需要尊敬和客气的态度接见陆萍。”","location":"第一部分：院长接见陆萍时，叙述者直接说明他的出身和军旅经历，并写他轻视女性专业人员的态度。","explain":"院长拥有管理、资源和人事权力，却没有医疗专业背景，因此很难从专业标准判断医院问题。接见陆萍时的轻慢又说明，他掌握权力却不尊重女性专业人员。专业意见能否进入决策，首先取决于权力者的态度，而不是医学依据。","link":"管理层的外行权力使专业建议难以进入决策，下一层自然通向制度规范缺失所造成的事故风险。","page":"","edition":"浙江文艺出版社《丁玲小说》（标注版）","chapter":"","searchPhrase":"对医务完全是外行","pdfPage":"","chain":{"who":"陆萍与医院环境","action":"院方管理人员由不懂医务的行政干部掌握资源与权力，并以轻视态度对待专业女性。","reason":"院长拥有管理、资源和人事权力，却没有医疗专业背景，因此很难从专业标准判断医院问题","consequence":"管理层的外行权力使专业建议难以进入决策，下一层自然通向制度规范缺失所造成的事故风险。"}}],"traps":["只写医院人物冷漠，不区分病员、院方工作人员和外行管理层。","只批评院长，不写出医院人员构成和专业能力不足怎样共同造成问题。","把病员写成纯粹的反对者，忽略他们同时是医疗条件恶化的受害者。"],"learningLevel":"variation","studyPriority":"高频变式","parentQuestionId":"hospital-individual-collective","doNotMemorizeSeparately":true,"questionFocus":"这题要写“医院人物群像的三层结构”的关键性格怎样影响具体选择和后果，不能只列性格词。","socraticQuestions":["题干要求你始终分析的主体是谁？","第一段的核心判断在文本中由什么行动支持？","三段怎样共同回答题干，而不是各讲一个知识点？"],"notAsking":["不要只列性格形容词。","不要把其他人物写成段落主体。"],"threePartPlan":[{"step":"第一段","focus":"病员是恶劣医疗和生活条件的直接承受者，但受旧习惯和谣言影响，对改革者的支持并不稳定。","useFromCore":"调用《个体理想与集体秩序》主体段 1","miniSentence":"首先，病员是恶劣医疗和生活条件的直接承受者，但受旧习惯和谣言影响，对改革者的支持并不稳"},{"step":"第二段","focus":"院方工作人员由家属型看护、短期培训人员和勤务人员构成，服务意识、专业能力和责任感普遍不足。","useFromCore":"调用《个体理想与集体秩序》主体段 2","miniSentence":"其次，院方工作人员由家属型看护、短期培训人员和勤务人员构成，服务意识、专业能力和责任感"},{"step":"第三段","focus":"院方管理人员由不懂医务的行政干部掌握资源与权力，并以轻视态度对待专业女性。","useFromCore":"调用《个体理想与集体秩序》主体段 3","miniSentence":"最后，院方管理人员由不懂医务的行政干部掌握资源与权力，并以轻视态度对待专业女性"}],"commonMistakes":[{"mistake":"只写人物性格词。","why":"没有证明性格怎样影响行动。","fix":"补充具体行动、原因和后果。"},{"mistake":"把别人的反应当主体。","why":"题干要求的人物流失了。","fix":"每段回到题干人物。"}],"summary":"医院人物群像的三层结构：抓主体、变化与后果。","studentNote":"不必单独背全文，调用《个体理想与集体秩序》的材料，重点练习问法变化。","needsManualReview":false},{"id":"hospital-gas","work":"《在医院中》","workKey":"hospital","type":"主题思想","title":"手术室中毒事件与制度问题","prompt":"分析手术室中毒事件在小说中的作用。","keywords":["中毒","手术室","黎涯","冲突","成长","制度问题"],"thesis":"中毒事件把医疗条件、官僚管理、人际冷漠和陆萍的心理危机集中引爆，成为人物成长与作品社会批判的关键转折。","points":[{"point":"供暖缺失暴露医疗条件和管理责任的长期问题。","evidence":"“手术室不装煤炉怎么行呢？”","location":"第三部分开头：手术室缺少煤炉，只能临时烧木炭取暖。","explain":"基本安全条件被忽略，事故因此具有可预见性。院方节省和管理敷衍把病人和医护人员置于风险之中，为中毒事件建立直接因果。由此，事件发生前的问题铺垫让事故承担制度批判作用。对基本条件的忽视使事故具有可预见性，也把医疗问题推进为管理责任问题。","link":"事件发生前的问题铺垫让事故承担制度批判作用。","page":"P390","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"前","chain":{"who":"陆萍与医院环境","action":"供暖缺失暴露医疗条件和管理责任的长期问题。","reason":"基本安全条件被忽略，事故因此具有可预见性","consequence":"事件发生前的问题铺垫让事故承担制度批判作用。"},"searchPhrase":"手术室不装煤炉怎么行呢？","chapter":"","pdfPage":"401"},{"point":"中毒事件把陆萍推到身体和精神的双重低点。","evidence":"“她已经完全清楚，她需要静静的睡眠，可是被一种不知是什么东西压迫着，忍不住要哭要叫。”","location":"第三部分高潮：陆萍中毒后醒来，身体虚弱并承受强烈精神压力。","explain":"中毒事件让疲惫和压迫同时出现，人物无法再靠忙碌遮掩问题。事故让她直面个人理想、医院现实和革命工作之间的裂缝，中段由此完成从行动到反思的转折。由此，事故成为人物认识和成长过程的核心节点。身体虚弱与精神压迫相互加重，使她不得不重新认识理想、环境与自我的关系。","link":"事故成为人物认识和成长过程的核心节点。","page":"P393","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"陆萍","action":"中毒事件把陆萍推到身体和精神的双重低点。","reason":"中毒事件让疲惫和压迫同时出现，人物无法再靠忙碌遮掩问题","consequence":"事故成为人物认识和成长过程的核心节点。"},"searchPhrase":"她已经完全清楚，她需要静静的睡眠，可","chapter":"","pdfPage":"404"},{"point":"事故后的标签化说明医院没有从灾难中转向责任反思。","evidence":"“小资产阶级意识、知识分子的英雄主义、自由主义等等的帽子都往她头上戴。”","location":"第三至四部分：中毒事件后，陆萍受到议论和身份批判。","explain":"组织把医疗事故转成个人立场问题，实际责任因此被遮蔽。事故不仅暴露设备和管理的缺陷，也暴露群体缺少自我批评和纠错能力。由此，后段处理方式说明中毒事件的意义延伸到组织文化和思想机制。标签化处理让事故责任被转成个人问题，组织因此错失公开反思和改进制度的机会。","link":"后段处理方式说明中毒事件的意义延伸到组织文化和思想机制。","page":"P394","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"陆萍与医院环境","action":"事故后的标签化说明医院没有从灾难中转向责任反思。","reason":"事故不仅暴露设备和管理的缺陷，也暴露群体缺少自我批评和纠错能力","consequence":"后段处理方式说明中毒事件的意义延伸到组织文化和思想机制。"},"searchPhrase":"小资产阶级意识、知识分子的英雄主义、","chapter":"","pdfPage":"405"}],"traps":["只复述中毒经过，不分析制度、人物和主题。","把事故当作偶然意外，忽略此前的资源申请和管理问题。"],"learningLevel":"variation","studyPriority":"高频变式","parentQuestionId":"hospital-growth","doNotMemorizeSeparately":true,"questionFocus":"这题要说明作品通过哪些人物和情节表现“手术室中毒事件与制度问题”，每段形成因果推进。","socraticQuestions":["题干要求你始终分析的主体是谁？","第一段的核心判断在文本中由什么行动支持？","三段怎样共同回答题干，而不是各讲一个知识点？"],"notAsking":["不要只复述情节。","不要把主题写成空泛口号。"],"threePartPlan":[{"step":"第一段","focus":"供暖缺失暴露医疗条件和管理责任的长期问题。","useFromCore":"调用《愤怒、反思与未完成的成长》主体段 1","miniSentence":"首先，供暖缺失暴露医疗条件和管理责任的长期问题"},{"step":"第二段","focus":"中毒事件把陆萍推到身体和精神的双重低点。","useFromCore":"调用《愤怒、反思与未完成的成长》主体段 2","miniSentence":"其次，中毒事件把陆萍推到身体和精神的双重低点"},{"step":"第三段","focus":"事故后的标签化说明医院没有从灾难中转向责任反思。","useFromCore":"调用《愤怒、反思与未完成的成长》主体段 3","miniSentence":"最后，事故后的标签化说明医院没有从灾难中转向责任反思"}],"commonMistakes":[{"mistake":"只复述情节。","why":"没有说明主题怎样形成。","fix":"写人物行动、原因和主题后果。"},{"mistake":"用抽象口号代替分析。","why":"缺少原文支撑。","fix":"每个观点配具体情节。"}],"summary":"手术室中毒事件与制度问题：抓主体、变化与后果。","studentNote":"不必单独背全文，调用《愤怒、反思与未完成的成长》的材料，重点练习问法变化。","needsManualReview":false},{"id":"hospital-ending","work":"《在医院中》","workKey":"hospital","type":"主题思想","title":"开放结尾与继续成长","prompt":"分析《在医院中》结尾对陆萍成长的意义。","keywords":["结尾","成长","革命","反思","机会","理想"],"thesis":"结尾让陆萍在痛苦反思后继续寻找学习和实践的机会，人物没有被现实击垮，也没有完成一次性改造，成长因此保持开放。","points":[{"point":"结尾的继续成长建立在陆萍最初主动处理生活和医疗问题的责任意识之上。","evidence":"“她常常为了他们的生活管理，和医疗的改善与很多人发生冲突。”","location":"第一部分：陆萍到院后持续争取生活和医疗条件的改善。","explain":"她从一开始就把具体改进当成自己的责任，因此不会因环境冷淡轻易放弃。这一行动底色使结尾的继续学习和工作具有前文基础，开放结局也更可信。由此，前段责任意识为结尾继续实践提供性格依据。从最初的责任意识回看结尾，人物没有被现实完全改变，成长因此具有连续性。","link":"前段责任意识为结尾继续实践提供性格依据。","page":"P387","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"前","searchPhrase":"她常常为了他们的生活管理，和医疗的改","chapter":"","chain":{"who":"陆萍","action":"结尾的继续成长建立在陆萍最初主动处理生活和医疗问题的责任意识之上。","reason":"从最初的责任意识回看结尾，人物没有被现实完全改变，成长因此具有连续性","consequence":"前段责任意识为结尾继续实践提供性格依据。"},"pdfPage":"398"},{"point":"中毒和冲突后的反思让陆萍重新理解成长需要长期实践。","evidence":"“新的生活虽要开始，然而还有新的荆棘。人是要经过千锤百炼而不消溶才能真真有用。人是在艰苦中成长。”","location":"第三至四部分：中毒事件后，陆萍面对新的工作和思想考验。","explain":"人物承认未来仍有困难，也要求自己在现实中保持完整。成长由此从情绪变化转为长期实践和人格坚持，结尾保持开放而不退回悲观。由此，中后段反思把开放结尾建立在具体经历之上。这句反思把成长定义为长期承受困难并保持自我，也避免开放结局沦为单纯的悲观。","link":"中后段反思把开放结尾建立在具体经历之上。","page":"P396","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"陆萍","action":"中毒和冲突后的反思让陆萍重新理解成长需要长期实践。","reason":"人物承认未来仍有困难，也要求自己在现实中保持完整","consequence":"中后段反思把开放结尾建立在具体经历之上。"},"searchPhrase":"新的生活虽要开始，然而还有新的荆棘。","chapter":"","pdfPage":"407"},{"point":"陆萍继续照顾病人和争取资源，使成长落在持续行动中。","evidence":"“她仍然是那样兴致很浓厚的去照顾着那些产妇，那些婴儿，为着她们一点点的需索，去同管理员，总务处，秘书长，甚至院长去争执。”","location":"第四部分结尾：陆萍继续工作，并为产妇和婴儿的具体需求交涉。","explain":"结尾通过行动显示人物选择，没有依赖宣言，她没有放弃关怀和责任，也学会在制度限制中持续争取。开放结局因此指向继续成长，也没有把成长写成一次性完成。由此，后段行动直接回答结尾保留何种成长希望。行动让开放结尾具有现实方向，人物没有停在受伤和控诉的位置。","link":"后段行动直接回答结尾保留何种成长希望。","page":"P388-P389","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"陆萍","action":"陆萍继续照顾病人和争取资源，使成长落在持续行动中。","reason":"结尾通过行动显示人物选择，没有依赖宣言，她没有放弃关怀和责任，也学会在制度限制中持续争取","consequence":"后段行动直接回答结尾保留何种成长希望。"},"searchPhrase":"她仍然是那样兴致很浓厚的去照顾着那些","chapter":"","pdfPage":"399-400"}],"traps":["把结尾理解成陆萍理想彻底破灭。","只写她离开医院，不分析离开后继续学习和实践的选择。"],"learningLevel":"variation","studyPriority":"高频变式","parentQuestionId":"hospital-growth","doNotMemorizeSeparately":true,"questionFocus":"这题要说明作品通过哪些人物和情节表现“开放结尾与继续成长”，每段形成因果推进。","socraticQuestions":["题干要求你始终分析的主体是谁？","第一段的核心判断在文本中由什么行动支持？","三段怎样共同回答题干，而不是各讲一个知识点？"],"notAsking":["不要只复述情节。","不要把主题写成空泛口号。"],"threePartPlan":[{"step":"第一段","focus":"结尾的继续成长建立在陆萍最初主动处理生活和医疗问题的责任意识之上。","useFromCore":"调用《愤怒、反思与未完成的成长》主体段 1","miniSentence":"首先，结尾的继续成长建立在陆萍最初主动处理生活和医疗问题的责任意识之上"},{"step":"第二段","focus":"中毒和冲突后的反思让陆萍重新理解成长需要长期实践。","useFromCore":"调用《愤怒、反思与未完成的成长》主体段 2","miniSentence":"其次，中毒和冲突后的反思让陆萍重新理解成长需要长期实践"},{"step":"第三段","focus":"陆萍继续照顾病人和争取资源，使成长落在持续行动中。","useFromCore":"调用《愤怒、反思与未完成的成长》主体段 3","miniSentence":"最后，陆萍继续照顾病人和争取资源，使成长落在持续行动中"}],"commonMistakes":[{"mistake":"只复述情节。","why":"没有说明主题怎样形成。","fix":"写人物行动、原因和主题后果。"},{"mistake":"用抽象口号代替分析。","why":"缺少原文支撑。","fix":"每个观点配具体情节。"}],"summary":"开放结尾与继续成长：抓主体、变化与后果。","studentNote":"不必单独背全文，调用《愤怒、反思与未完成的成长》的材料，重点练习问法变化。","needsManualReview":false},{"id":"fortress-diploma","work":"《围城》","workKey":"fortress","type":"主题思想","title":"假文凭与方鸿渐的三座围城","prompt":"分析方鸿渐的假文凭如何影响他的爱情、事业和婚姻，并说明其讽刺意义。","keywords":["假文凭","爱情围城","事业围城","婚姻围城","诚信","方鸿渐"],"thesis":"方鸿渐的假文凭并非一次孤立的道德污点。它在爱情中摧毁信任，使唐晓芙的理想爱情无法继续；在事业中成为高松年压低职位和操纵聘约的借口，强化方鸿渐对关系的依附；在婚姻中又沉淀为无法清理的旧我，持续制造羞耻。虚假学历因此把方鸿渐同时困在爱情、事业和婚姻三座围城中。","points":[{"stage":"前","point":"爱情围城：假文凭破坏恋人之间的诚信，使方鸿渐在唐晓芙质问时失去解释能力。","evidence":"“据说方先生在欧洲念书，得到过美国学位——”“鸿渐顿足发恨道：‘我跟你吹过我有学位没有？这是闹着玩儿的。’”","location":"第四章：唐晓芙从苏文纨处得知方鸿渐的学历和感情经历后当面质问，方鸿渐无法完成有效解释。","explain":"方鸿渐把假文凭看成可以维持体面的玩笑，唐晓芙却把它视为对爱情诚信的欺骗。苏文纨将学历传闻交给唐晓芙后，唐晓芙把所有疑点连成完整证据；方鸿渐既不能承认真相，也不能提供可信辩护。信任崩塌后，他的沉默和自责加速分手，文凭首先在他最重视的爱情中造成不可逆的损失。","link":"第一段说明假学历直接摧毁爱情信任，下一段中的事业困境则来自同一份学历在职业制度中的双重作用。","page":"","edition":"人民文学出版社软皮版","chapter":"第四章","searchPhrase":"据说方先生在欧洲念书","pdfPage":"","chain":{"who":"唐晓芙","action":"爱情围城：假文凭破坏恋人之间的诚信，使方鸿渐在唐晓芙质问时失去解释能力。","reason":"方鸿渐把假文凭看成可以维持体面的玩笑，唐晓芙却把它视为对爱情诚信的欺骗","consequence":"第一段说明假学历直接摧毁爱情信任，下一段中的事业困境则来自同一份学历在职业制度中的双重作用。"}},{"stage":"中","point":"事业围城：假文凭既用来求职，也成为权力者压低职称和操纵聘约的理由。","evidence":"“当然，我决不计较学位，我只讲真才实学。不过部里定的规矩呆板得很，照先生的学历，至多只能当专任讲师，教授待遇呈报上去一定要驳下来的。我相信辛楣的保荐不会错，所以破格聘先生为副教授。”","location":"第六章：方鸿渐到三闾大学报到，高松年用学历不符合部里规定为由解释教授改副教授。","explain":"方鸿渐凭虚假学历获得机会，却没有真实学位可以验证，高松年便同时利用声称不看学位和强调学历不合规定这两套说法控制他。承诺被推翻后，方鸿渐无法据理争取，只能接受降级。假文凭因此既是他进入职场的资本，也是别人压低他的把柄，职业位置从一开始便不稳定。","link":"第二段证明文凭在事业中既提供入口又制造控制，第三段进一步说明它如何在婚姻中长期转化为身份羞耻。","page":"","edition":"人民文学出版社软皮版","chapter":"第六章","searchPhrase":"照先生的学历","pdfPage":"","chain":{"who":"方鸿渐及相关人物","action":"事业围城：假文凭既用来求职，也成为权力者压低职称和操纵聘约的理由。","reason":"方鸿渐凭虚假学历获得机会，却没有真实学位可以验证，高松年便同时利用声称不看学位和强调学历不合规定这两套说法控制他","consequence":"第二段证明文凭在事业中既提供入口又制造控制，第三段进一步说明它如何在婚姻中长期转化为身份羞耻。"}},{"stage":"后","point":"婚姻围城：假文凭沉淀成无法清理的旧我，婚姻中的方鸿渐仍被过去持续羞辱。","evidence":"“有几个自己，仿佛是路毙的，不去收拾，让它们烂掉化掉，给鸟兽吃掉——不过始终消灭不了，譬如向爱尔兰人买文凭的自己。”","location":"第九章：方鸿渐婚后回望过去不同阶段的自己，购买假文凭的经历仍无法被埋葬。","explain":"婚姻没有让方鸿渐建立稳定的新身份，反而让他更清楚自己一路失败。购买文凭的旧我没有随时间消失，也不能通过道歉或遗忘处理，成为长期自我羞耻的来源。他在婚姻冲突中无法建立自信，部分原因正是虚假身份始终提醒自己不值得被信任，文凭最终把爱情和事业的失败延伸为婚姻困境。","link":"三段合起来说明，假文凭在爱情中破坏信任，在事业中削弱独立，在婚姻中固化羞耻，共同完成方鸿渐的人生围城。","page":"","edition":"人民文学出版社软皮版","chapter":"第九章","searchPhrase":"仿佛是路毙的","pdfPage":"","chain":{"who":"方鸿渐","action":"婚姻围城：假文凭沉淀成无法清理的旧我，婚姻中的方鸿渐仍被过去持续羞辱。","reason":"婚姻没有让方鸿渐建立稳定的新身份，反而让他更清楚自己一路失败","consequence":"三段合起来说明，假文凭在爱情中破坏信任，在事业中削弱独立，在婚姻中固化羞耻，共同完成方鸿渐的人生围城。"}}],"traps":["只写假文凭是道德错误，不分析它在爱情、事业和婚姻中的连续后果。","把它当作恋爱失败的唯一原因，忽略唐晓芙的理想标准、苏文纨的挑拨和方鸿渐的逃避。","只写文凭导致事业降级，不说明虚假身份怎样长期影响方鸿渐的自我判断和婚姻。"],"learningLevel":"core","studyPriority":"必背","parentQuestionId":null,"doNotMemorizeSeparately":false,"questionFocus":"这题要分别写假文凭怎样伤害爱情、事业和婚姻，并解释讽刺意义。","socraticQuestions":["假文凭为什么会让唐晓芙无法继续相信方鸿渐？","高松年怎样利用方鸿渐没有真实学位这一点压低他？","为什么婚姻没有消除文凭带来的羞耻，反而延续了失败感？"],"notAsking":["不是只写方鸿渐买了一张假文凭。","不要只把文凭解释为道德错误。","不要把三段都写成学历崇拜。"],"threePartPlan":[{"step":"第一段","focus":"爱情围城：假文凭破坏恋人之间的诚信，使方鸿渐在唐晓芙质问时失去解释能力。","useFromCore":"本题核心 Point 1","miniSentence":"首先，爱情围城：假文凭破坏恋人之间的诚信，使方鸿渐在唐晓芙质问时失去解释能力"},{"step":"第二段","focus":"事业围城：假文凭既用来求职，也成为权力者压低职称和操纵聘约的理由。","useFromCore":"本题核心 Point 2","miniSentence":"其次，事业围城：假文凭既用来求职，也成为权力者压低职称和操纵聘约的理由"},{"step":"第三段","focus":"婚姻围城：假文凭沉淀成无法清理的旧我，婚姻中的方鸿渐仍被过去持续羞辱。","useFromCore":"本题核心 Point 3","miniSentence":"最后，婚姻围城：假文凭沉淀成无法清理的旧我，婚姻中的方鸿渐仍被过去持续羞辱"}],"commonMistakes":[{"mistake":"只复述情节。","why":"没有说明主题怎样形成。","fix":"写人物行动、原因和主题后果。"},{"mistake":"用抽象口号代替分析。","why":"缺少原文支撑。","fix":"每个观点配具体情节。"}],"summary":"假文凭与方鸿渐的三座围城：抓主体、变化与后果。","studentNote":"固定按爱情、事业、婚姻三座围城写，结尾再概括学历崇拜。","needsManualReview":false},{"id":"fortress-intellectuals","work":"《围城》","workKey":"fortress","type":"主题思想","title":"三闾大学中的权力与知识分子群像","prompt":"分析三闾大学如何通过高松年、汪处厚和教师群体表现知识分子在名利与权力中的庸俗化。","keywords":["三闾大学","高松年","汪处厚","聘约","派系","知识分子群像"],"thesis":"三闾大学暴露了知识机构失去公共准则后的连续病态：聘约和职称由行政权力随意改变，系主任职位成为派系争夺对象，虚假学历又在教师群体的相互默许中获得保护。学校因此不再是共同治学和承担社会责任的空间。","points":[{"stage":"前","point":"高松年把聘任和职称当作管理工具，根据教师是否容易控制决定职位高低。","evidence":"“这姓方的青年人是容易对付的。”“他自己开来的学历，并没有学位，只是个各国游荡的‘游学生’，并且并非学政治的，聘他当教授太冤枉了！至多做副教授，循序渐升，年轻人做事不应该爬得太高，这话可以叫辛楣对他说。”","location":"第六章：方鸿渐到校后，高松年在办公室盘算如何解释教授改副教授，并认定方鸿渐容易控制。","explain":"高松年先判断方鸿渐容易对付，再用学历、专业和年龄为自己的降级决定寻找理由。他掌握聘任权，却没有按公开标准重新审核，而是把“是否需要服从”“是否便于管理”放在学术评价之前。年轻和不擅交涉成为压低职位的方便借口，校长权力由此直接决定教师的职业命运。","link":"高松年把职位当作控制工具，汪处厚则进一步把系主任职位变成私人派系争夺对象。","page":"","edition":"人民文学出版社软皮版","chapter":"第六章","searchPhrase":"这姓方的青年人是容易对付的","pdfPage":"","chain":{"who":"高松年","action":"高松年把聘任和职称当作管理工具，根据教师是否容易控制决定职位高低。","reason":"他掌握聘任权，却没有按公开标准重新审核，而是把“是否需要服从”“是否便于管理”放在学术评价之前","consequence":"高松年把职位当作控制工具，汪处厚则进一步把系主任职位变成私人派系争夺对象。"}},{"stage":"中","point":"系主任职位成为派系争夺对象，欢迎仪式被改造成制造既成事实的权力手段。","evidence":"“原来，今天欢迎会是汪处厚安排好的，兵法上有名的‘敌人喘息未定，即予以迎头痛击’。先来校的四个中国文学系讲师和助教早和他打成一片，学生也唯命是听。”","location":"第六章：李梅亭到校前，汪处厚已经安排欢迎会、联络教师和学生，使自己先以主任身份活动。","explain":"欢迎会并非单纯礼节，而是汪处厚提前建立关系的工具。先到校的教师已经与他形成稳固关系，学生也听从他的安排，李梅亭即使得到过聘约，抵达时也只能面对既成事实。行政职位由关系网络和先手优势决定，公开资格和学校程序被绕过，派系因此取代制度。","link":"派系操纵说明职位竞争已经失去程序约束，而虚假学历进一步瓦解教师群体的评价标准。","page":"","edition":"人民文学出版社软皮版","chapter":"第六章","searchPhrase":"原来，今天欢迎会是汪处厚安排好的","pdfPage":"","chain":{"who":"方鸿渐及相关人物","action":"系主任职位成为派系争夺对象，欢迎仪式被改造成制造既成事实的权力手段。","reason":"欢迎会并非单纯礼节，而是汪处厚提前建立关系的工具","consequence":"派系操纵说明职位竞争已经失去程序约束，而虚假学历进一步瓦解教师群体的评价标准。"}},{"stage":"后","point":"虚假学历在教师群体中获得相互掩护，学历评价因此失去验证学术能力的功能。","evidence":"“韩学愈撒他的谎，并非跟自己同谋，但有了他，似乎自己的欺骗减轻了罪名。”","location":"第六章：方鸿渐发现韩学愈同样使用克莱登大学学历，并由对方的欺骗获得心理安慰。","explain":"方鸿渐明知文凭是假的，却在发现韩学愈也有同样经历后减轻羞耻。两人没有揭穿彼此，反而因为共同隐瞒形成默契。虚假学历因此不只属于个人道德问题，也在群体关系中变成可以互相庇护的身份资本。学校评价教师时，文凭和头衔仍然有效，真实学识却无人核验。","link":"三层问题共同说明：权力失信、派系争夺和学历失真正在把大学变成身份交换场。","page":"","edition":"人民文学出版社软皮版","chapter":"第六章","searchPhrase":"韩学愈撒他的谎","pdfPage":"","chain":{"who":"三闾大学知识分子群体","action":"虚假学历在教师群体中获得相互掩护，学历评价因此失去验证学术能力的功能。","reason":"两人没有揭穿彼此，反而因为共同隐瞒形成默契","consequence":"三层问题共同说明：权力失信、派系争夺和学历失真正在把大学变成身份交换场。"}}],"traps":["只列举高松年、汪处厚和韩学愈的缺点，不写出制度怎样让个人问题反复发生。","把聘约、职位和学历当作三个互不相干的笑料，不说明三者共同构成学校的评价失灵。","只批评个人道德，忽略战时大学本应承担的公共教育责任。"],"learningLevel":"core","studyPriority":"必背","parentQuestionId":null,"doNotMemorizeSeparately":false,"questionFocus":"这题要说明作品通过哪些人物和情节表现“三闾大学中的权力与知识分子群像”，每段形成因果推进。","socraticQuestions":["题干要求你始终分析的主体是谁？","第一段的核心判断在文本中由什么行动支持？","三段怎样共同回答题干，而不是各讲一个知识点？"],"notAsking":["不要只复述情节。","不要把主题写成空泛口号。"],"threePartPlan":[{"step":"第一段","focus":"高松年把聘任和职称当作管理工具，根据教师是否容易控制决定职位高低。","useFromCore":"本题核心 Point 1","miniSentence":"首先，高松年把聘任和职称当作管理工具，根据教师是否容易控制决定职位高低"},{"step":"第二段","focus":"系主任职位成为派系争夺对象，欢迎仪式被改造成制造既成事实的权力手段。","useFromCore":"本题核心 Point 2","miniSentence":"其次，系主任职位成为派系争夺对象，欢迎仪式被改造成制造既成事实的权力手段"},{"step":"第三段","focus":"虚假学历在教师群体中获得相互掩护，学历评价因此失去验证学术能力的功能。","useFromCore":"本题核心 Point 3","miniSentence":"最后，虚假学历在教师群体中获得相互掩护，学历评价因此失去验证学术能力的功能"}],"commonMistakes":[{"mistake":"只复述情节。","why":"没有说明主题怎样形成。","fix":"写人物行动、原因和主题后果。"},{"mistake":"用抽象口号代替分析。","why":"缺少原文支撑。","fix":"每个观点配具体情节。"}],"summary":"三闾大学中的权力与知识分子群像：抓主体、变化与后果。","studentNote":"先背这一题，再练同一母题下的变式。","needsManualReview":false},{"id":"fortress-metaphor","work":"《围城》","workKey":"fortress","type":"艺术手法","title":"比喻与围城意象","prompt":"分析《围城》中比喻和意象的艺术作用。","keywords":["比喻","意象","鸟笼","围城","人生困境","讽刺"],"thesis":"《围城》用鸟笼、城堡和围城等比喻，把婚姻、职业与人生困境具象化，使讽刺具有反复回扣的结构力量。","points":[{"point":"比喻把抽象的人生欲望和关系限制转化为可感形象。","evidence":"“结婚仿佛金漆的鸟笼，笼子外面的鸟想住进去，笼内的鸟想飞出来。”","location":"第三章：人物谈论爱情和婚姻，鸟笼比喻由此进入全书主题。","page":"","edition":"人民文学出版社软皮版","explain":"体面外壳和封闭空间被压在同一形象中，人物只看到进入前的光亮，进入后又想离开。婚姻愿望与限制因此同时获得可感形态。由此，前段鸟笼先建立围城意象的基本结构。比喻把心理欲望转为可反复出现的叙事形象，也让个人关系上升为普遍经验。","link":"前段鸟笼先建立围城意象的基本结构。","chapter":"第三章","searchPhrase":"结婚仿佛金漆的鸟笼，笼子外面的鸟想住","pdfPage":"","stage":"前","chain":{"who":"作者与叙事者","action":"比喻把抽象的人生欲望和关系限制转化为可感形象。","reason":"体面外壳和封闭空间被压在同一形象中，人物只看到进入前的光亮，进入后又想离开","consequence":"前段鸟笼先建立围城意象的基本结构。"}},{"point":"同一比喻能够揭示愿望实现后的失落和欲望循环。","evidence":"“狗为着追求水里肉骨头的影子，丧失了到嘴的肉骨头！跟爱人如愿以偿结了婚，恐怕那时候肉骨头下肚，倒要对水怅惜这不可再见的影子了。”","location":"第五章：方鸿渐与赵辛楣谈婚姻和人生选择。","page":"","edition":"人民文学出版社软皮版","explain":"现实拥有和想象目标被拆成两个不可兼得的东西，人物追逐幻影时失去已经得到的幸福。比喻因此揭示欲望难以满足，也把婚姻加入围城结构。由此，中段比喻从婚姻扩展到职业和普遍人生选择。这一循环把婚姻、职业和人生选择放在同一结构中，强化围城主题的反复回还。","link":"中段比喻从婚姻扩展到职业和普遍人生选择。","chapter":"第五章","searchPhrase":"狗为着追求水里肉骨头的影子，丧失了到","pdfPage":"","stage":"中","chain":{"who":"作者与叙事者","action":"同一比喻能够揭示愿望实现后的失落和欲望循环。","reason":"现实拥有和想象目标被拆成两个不可兼得的东西，人物追逐幻影时失去已经得到的幸福","consequence":"中段比喻从婚姻扩展到职业和普遍人生选择。"}},{"point":"意象在不同生活空间重复出现，形成贯通的叙事结构和主题回环。","evidence":"“家里真跟三闾大学一样是个是非窝。”","location":"第九章：方鸿渐在上海婚姻和家庭关系中，回想三闾大学的人事经验。","page":"","edition":"人民文学出版社软皮版","explain":"学校与家庭被并置，说明围城已经不局限于爱情或婚姻，而指向一切充满算计和束缚的人际空间。人物离开一个环境后进入另一个相似环境，主题结构在全书结尾完成。由此，后段把比喻从单段关系提升为整部小说的结构原则。","link":"后段把比喻从单段关系提升为整部小说的结构原则。","chapter":"第九章","searchPhrase":"家里真跟三闾大学一样是个是非窝。","pdfPage":"","stage":"后","chain":{"who":"作者与叙事者","action":"意象在不同生活空间重复出现，形成贯通的叙事结构和主题回环。","reason":"学校与家庭被并置，说明围城已经不局限于爱情或婚姻，而指向一切充满算计和束缚的人际空间","consequence":"后段把比喻从单段关系提升为整部小说的结构原则。"}}],"traps":["只摘抄比喻，不解释比喻和行为、主题的关系。","把所有意象都说成围城，忽略具体语境。"],"learningLevel":"variation","studyPriority":"高频变式","parentQuestionId":"fortress-satire","doNotMemorizeSeparately":true,"questionFocus":"这题要写“比喻与围城意象”使用的手法、文本表现和效果，不能只报术语。","socraticQuestions":["题干要求你始终分析的主体是谁？","第一段的核心判断在文本中由什么行动支持？","三段怎样共同回答题干，而不是各讲一个知识点？"],"notAsking":["不要只报手法名称。","不要引用原文却不分析效果。"],"threePartPlan":[{"step":"第一段","focus":"比喻把抽象的人生欲望和关系限制转化为可感形象。","useFromCore":"调用《讽刺艺术》主体段 1","miniSentence":"首先，比喻把抽象的人生欲望和关系限制转化为可感形象"},{"step":"第二段","focus":"同一比喻能够揭示愿望实现后的失落和欲望循环。","useFromCore":"调用《讽刺艺术》主体段 2","miniSentence":"其次，同一比喻能够揭示愿望实现后的失落和欲望循环"},{"step":"第三段","focus":"意象在不同生活空间重复出现，形成贯通的叙事结构和主题回环。","useFromCore":"调用《讽刺艺术》主体段 3","miniSentence":"最后，意象在不同生活空间重复出现，形成贯通的叙事结构和主题回环"}],"commonMistakes":[{"mistake":"只列手法名称。","why":"没有说明怎样产生效果。","fix":"补文本表现和表达效果。"},{"mistake":"引用后不分析。","why":"引文无法证明手法作用。","fix":"解释语言、结构或意象怎样影响理解。"}],"summary":"比喻与围城意象：抓主体、变化与后果。","studentNote":"不必单独背全文，调用《讽刺艺术》的材料，重点练习问法变化。","needsManualReview":false},{"id":"fortress-group-portrait","work":"《围城》","workKey":"fortress","type":"人物形象","title":"知识分子群像的三个阶段","prompt":"分析《围城》如何通过不同阶段的知识分子人物，表现战时知识群体的病态。","keywords":["知识分子群像","褚慎明","曹元朗","李梅亭","顾尔谦","高松年","汪处厚"],"thesis":"《围城》沿方鸿渐的行踪塑造三类知识群体：上海文化圈以学问姿态争夺身份，赴校旅途中的人物把资历、人脉和职位变成交换资本，三闾大学管理层又把教师视为可支配的行政资源。三类人物共同表现知识身份和社会责任不断分离。","points":[{"stage":"前","point":"上海文化圈以学识姿态和审美口号争夺身份，真实学问反而退居其次。","evidence":"“他常翻外国哲学杂志，查出世界大哲学家的通信处，写信给他们，说自己如何爱读他们的书，把哲学杂志书评栏里赞美他们著作的话，改头换面算自己的意见。”“诗有意义是诗的不幸！”","location":"第三章：方鸿渐进入苏文纨和赵辛楣所在的上海文化社交圈，先后接触褚慎明与曹元朗。","explain":"褚慎明通过抄改书评和借用外国哲学家回信制造权威，曹元朗用晦涩口号掩饰诗歌内容的空洞。两人都把文化姿态当作社会通行证，因为圈内评价重视名声和趣味，而不是知识和创作本身。身份越显得高深，真实能力越容易被掩盖，群像的病态首先表现为学问表演化。","link":"文化圈把身份与真实学识分离，旅途阶段则把这种分离进一步转化为职位和利益竞争。","page":"","edition":"人民文学出版社软皮版","chapter":"第三章","searchPhrase":"他常翻外国哲学杂志","pdfPage":"","chain":{"who":"方鸿渐及相关人物","action":"上海文化圈以学识姿态和审美口号争夺身份，真实学问反而退居其次。","reason":"两人都把文化姿态当作社会通行证，因为圈内评价重视名声和趣味，而不是知识和创作本身","consequence":"文化圈把身份与真实学识分离，旅途阶段则把这种分离进一步转化为职位和利益竞争。"}},{"stage":"中","point":"赴校旅途中的知识分子把资历、人脉和职位视为交换资本，公共责任被私人利益取代。","evidence":"“上面并列着三行衔头：‘国立三闾大学主任’、‘新闻学研究所所长’，还有一条是一个什么县党部的前任秘书。”“顾尔谦，是高松年的远亲，好像没梦想到会被聘为历史系副教授的，快乐像沸水似的洋溢满桌，对赵李两位尤为殷勤。”","location":"第五章：前往三闾大学的旅途中，李梅亭用名片证明身份，顾尔谦借亲戚关系获得职位并殷勤逢迎。","explain":"李梅亭需要名片打开交通和机构关系，顾尔谦则依靠亲戚身份得到职位。两人关心的核心都是资历、关系和职位能够换来什么，教育和抗战责任没有进入他们的行动逻辑。旅途形成一个小型利益共同体，既有资源者获得奉承，关系网络进一步巩固，群像病态由此从文化虚荣转向现实功利。","link":"旅途让身份变成交换资本，三闾大学管理层则把这种交换制度化。","page":"","edition":"人民文学出版社软皮版","chapter":"第五章","searchPhrase":"上面并列着三行衔头","pdfPage":"","chain":{"who":"三闾大学知识分子群体","action":"赴校旅途中的知识分子把资历、人脉和职位视为交换资本，公共责任被私人利益取代。","reason":"李梅亭需要名片打开交通和机构关系，顾尔谦则依靠亲戚身份得到职位","consequence":"旅途让身份变成交换资本，三闾大学管理层则把这种交换制度化。"}},{"stage":"后","point":"三闾大学管理层把教师视为可支配的行政资源，职位竞争服从权力与派系。","evidence":"“找一批没有名望的人来，他们要借学校的光，他们要靠学校才有地位，而学校并非非有他们不可，这种人才真能跟学校合为一体，真肯出力为公家做事。”“当系主任和结婚一样，‘先进门三日就是大’。”","location":"第六章开头：高松年主张聘用缺乏名望的教师，汪处厚又用先占优势争夺系主任。","explain":"高松年选择缺乏外部地位的教师，是为了让他们依赖学校并服从管理；汪处厚用先到一步制造职位事实，显示行政竞争依靠派系和速度。两人的管理行为都把大学看作权力机关，教师不再以独立研究和服务社会为首要身份。前两阶段的文化虚荣和功利交换，最终被制度化为行政控制。","link":"三个阶段共同证明，知识群体的病态并非个别性格，而是身份、利益和权力持续取代公共责任。","page":"","edition":"人民文学出版社软皮版","chapter":"第六章","searchPhrase":"找一批没有名望的人来","pdfPage":"","chain":{"who":"三闾大学知识分子群体","action":"三闾大学管理层把教师视为可支配的行政资源，职位竞争服从权力与派系。","reason":"高松年选择缺乏外部地位的教师，是为了让他们依赖学校并服从管理","consequence":"三个阶段共同证明，知识群体的病态并非个别性格，而是身份、利益和权力持续取代公共责任。"}}],"traps":["只按章节列举人物，不说明三组知识群像之间的递进关系。","把褚慎明、曹元朗、李梅亭等人写成彼此无关的笑料。","只写知识分子虚伪，不联系学校管理和战时社会环境。"],"learningLevel":"teacher-extension","studyPriority":"拓展","parentQuestionId":"fortress-intellectuals","doNotMemorizeSeparately":true,"questionFocus":"这题要写“知识分子群像的三个阶段”的关键性格怎样影响具体选择和后果，不能只列性格词。","socraticQuestions":["题干要求你始终分析的主体是谁？","第一段的核心判断在文本中由什么行动支持？","三段怎样共同回答题干，而不是各讲一个知识点？"],"notAsking":["不要只列性格形容词。","不要把其他人物写成段落主体。"],"threePartPlan":[{"step":"第一段","focus":"上海文化圈以学识姿态和审美口号争夺身份，真实学问反而退居其次。","useFromCore":"调用《三闾大学中的权力与知识分子群像》主体段 1","miniSentence":"首先，上海文化圈以学识姿态和审美口号争夺身份，真实学问反而退居其次"},{"step":"第二段","focus":"赴校旅途中的知识分子把资历、人脉和职位视为交换资本，公共责任被私人利益取代。","useFromCore":"调用《三闾大学中的权力与知识分子群像》主体段 2","miniSentence":"其次，赴校旅途中的知识分子把资历、人脉和职位视为交换资本，公共责任被私人利益取代"},{"step":"第三段","focus":"三闾大学管理层把教师视为可支配的行政资源，职位竞争服从权力与派系。","useFromCore":"调用《三闾大学中的权力与知识分子群像》主体段 3","miniSentence":"最后，三闾大学管理层把教师视为可支配的行政资源，职位竞争服从权力与派系"}],"commonMistakes":[{"mistake":"只写人物性格词。","why":"没有证明性格怎样影响行动。","fix":"补充具体行动、原因和后果。"},{"mistake":"把别人的反应当主体。","why":"题干要求的人物流失了。","fix":"每段回到题干人物。"}],"summary":"知识分子群像的三个阶段：抓主体、变化与后果。","studentNote":"教师拓展题，普通考试复习不必优先。","needsManualReview":true},{"id":"fortress-language-satire","work":"《围城》","workKey":"fortress","type":"艺术手法","title":"语言讽刺的三种方式","prompt":"分析《围城》如何通过比喻、人物语言和叙事判断实现讽刺。","keywords":["语言讽刺","比喻","幽默","人物语言","叙事判断","围城"],"thesis":"钱钟书通过叙事反讽、人物语言和自我暴露式论说，让褚慎明、曹元朗和高松年分别在学术、艺术和管理领域表演聪明，读者却从他们的语言和行动中看见虚荣与操控。","points":[{"point":"平淡叙述与事实罗列之间可以形成反讽张力，使人物荣誉自行失去可信度。","evidence":"“他常翻外国哲学杂志，查出世界大哲学家的通信处，写信给他们，说自己如何爱读他们的书，把哲学杂志书评栏里赞美他们著作的话，改头换面算自己的意见。”","location":"第三章：赵辛楣宴客前介绍褚慎明的经历，重点看叙述者怎样逐项说明他的成名方法。","explain":"一连串具体动作构成完整的自我包装流程，通信、抄录改换和借名家回信提升名声都有清楚步骤。叙述者不加怒骂，读者却能自行判断这套学术权威如何生产。反讽的力量来自事实顺序和冷静语气，人物越显得高深，骗术越显得可笑。由此，语言讽刺首先表现为叙述事实与人物名誉之间的巨大落差。","link":"语言讽刺首先表现为叙述事实与人物名誉之间的巨大落差。","page":"","edition":"人民文学出版社软皮版","chapter":"第三章","searchPhrase":"他常翻外国哲学杂志，查出世界大哲学家","pdfPage":"","stage":"前","chain":{"who":"方鸿渐及相关人物","action":"平淡叙述与事实罗列之间可以形成反讽张力，使人物荣誉自行失去可信度。","reason":"一连串具体动作构成完整的自我包装流程，通信、抄录改换和借名家回信提升名声都有清楚步骤","consequence":"语言讽刺首先表现为叙述事实与人物名誉之间的巨大落差。"}},{"point":"人物语言能够反向暴露其知识虚荣和审美空洞，无需叙述者直接评判。","evidence":"“诗有意义是诗的不幸！”","location":"第三章：苏文纨家中，曹元朗向众人解释新诗《拼盘姘伴》。","explain":"诗人把缺乏内容和逻辑说成超越意义，借中外杂糅和晦涩表达占据审美高地。听者若不认同，似乎便不懂艺术，这句话因此同时完成自我夸耀和对读者的压制。作者让人物亲手拆掉诗歌标准，讽刺现代文艺圈以新名词掩盖空洞的现象。由此，人物语言不再证明才学，反而成为读者判断其虚伪的直接证据。","link":"人物语言不再证明才学，反而成为读者判断其虚伪的直接证据。","page":"","edition":"人民文学出版社软皮版","chapter":"第三章","searchPhrase":"诗有意义是诗的不幸！","pdfPage":"","stage":"中","chain":{"who":"作者与叙事者","action":"人物语言能够反向暴露其知识虚荣和审美空洞，无需叙述者直接评判。","reason":"诗人把缺乏内容和逻辑说成超越意义，借中外杂糅和晦涩表达占据审美高地","consequence":"人物语言不再证明才学，反而成为读者判断其虚伪的直接证据。"}},{"point":"日常物件可以承担叙事反讽，并连接人物行动、时间错位与人生感伤。","evidence":"“这个时间落伍的计时机无意中包涵对人生的讽刺和感伤，深于一切语言、一切啼笑。”","location":"第九章结尾：方鸿渐与孙柔嘉争吵后，祖传老钟晚响。","explain":"物件记录过去的期待和善意，响起时相关愿望已经无法挽回。叙述用一件日常物品集中写出时间错位、行动迟缓和关系破裂，把语言讽刺推进到整部小说的人生反思。由此，后段把人物语言和比喻收束为全书的讽刺与感伤。","link":"后段把人物语言和比喻收束为全书的讽刺与感伤。","page":"","edition":"人民文学出版社软皮版","chapter":"第九章","searchPhrase":"这个时间落伍的计时机无意中包涵对人生","pdfPage":"","stage":"后","chain":{"who":"作者与叙事者","action":"日常物件可以承担叙事反讽，并连接人物行动、时间错位与人生感伤。","reason":"物件记录过去的期待和善意，响起时相关愿望已经无法挽回","consequence":"后段把人物语言和比喻收束为全书的讽刺与感伤。"}}],"traps":["只列举比喻句，不区分叙述反讽、人物语言和伪科学论证。","三条论证都选同一时期的材料，看不出语言策略在全书中反复变化。","把作者的叙述判断直接当作人物原话，忽略叙述视角。"],"learningLevel":"variation","studyPriority":"高频变式","parentQuestionId":"fortress-satire","doNotMemorizeSeparately":true,"questionFocus":"这题要写“语言讽刺的三种方式”使用的手法、文本表现和效果，不能只报术语。","socraticQuestions":["题干要求你始终分析的主体是谁？","第一段的核心判断在文本中由什么行动支持？","三段怎样共同回答题干，而不是各讲一个知识点？"],"notAsking":["不要只报手法名称。","不要引用原文却不分析效果。"],"threePartPlan":[{"step":"第一段","focus":"平淡叙述与事实罗列之间可以形成反讽张力，使人物荣誉自行失去可信度。","useFromCore":"调用《讽刺艺术》主体段 1","miniSentence":"首先，平淡叙述与事实罗列之间可以形成反讽张力，使人物荣誉自行失去可信度"},{"step":"第二段","focus":"人物语言能够反向暴露其知识虚荣和审美空洞，无需叙述者直接评判。","useFromCore":"调用《讽刺艺术》主体段 2","miniSentence":"其次，人物语言能够反向暴露其知识虚荣和审美空洞，无需叙述者直接评判"},{"step":"第三段","focus":"日常物件可以承担叙事反讽，并连接人物行动、时间错位与人生感伤。","useFromCore":"调用《讽刺艺术》主体段 3","miniSentence":"最后，日常物件可以承担叙事反讽，并连接人物行动、时间错位与人生感伤"}],"commonMistakes":[{"mistake":"只列手法名称。","why":"没有说明怎样产生效果。","fix":"补文本表现和表达效果。"},{"mistake":"引用后不分析。","why":"引文无法证明手法作用。","fix":"解释语言、结构或意象怎样影响理解。"}],"summary":"语言讽刺的三种方式：抓主体、变化与后果。","studentNote":"不必单独背全文，调用《讽刺艺术》的材料，重点练习问法变化。","needsManualReview":false},{"id":"fortress-concrete-balance","work":"《围城》","workKey":"fortress","type":"艺术手法","title":"讽刺的具象化与平衡视角","prompt":"分析《围城》如何通过具象化描写和平衡视角完成讽刺。","keywords":["具象化","平衡视角","隐喻","结构","冷峻","笑中带泪"],"thesis":"《围城》用具体物象和对称冲突承载讽刺：早期把善恶混合写成日常触感，中段用名片等物件暴露身份虚荣，结尾让夫妻冲突同时呈现双方的伤害，叙述因此保持冷峻距离，也保留笑中带泪的复杂感。","points":[{"point":"讽刺通过日常物象揭示人性中善恶并存和难以预判的复杂性。","evidence":"“忠厚老实人的恶毒，像饭里的砂砾或者出骨鱼片里未净的刺，会给人一种不期待的伤痛。”","location":"第一章：孙太太议论方鸿渐和鲍小姐后，叙述者作出这句概括。","explain":"砂砾和鱼刺都来自日常饮食，伤害不大，却会在最放松时突然刺中人。比喻把“老实人”从单一道德标签中解放出来，承认善意、世俗判断和恶意可以并存。叙述者因此不替任何人物作简单定性，读者也会对群像保持警惕和同情。由此，冷峻视角从开篇就奠定，使讽刺避免落入辱骂。","link":"冷峻视角从开篇就奠定，使讽刺避免落入辱骂。","page":"","edition":"人民文学出版社软皮版","chapter":"第一章","searchPhrase":"忠厚老实人的恶毒，像饭里的砂砾或者出","pdfPage":"","stage":"前","chain":{"who":"方鸿渐及相关人物","action":"讽刺通过日常物象揭示人性中善恶并存和难以预判的复杂性。","reason":"砂砾和鱼刺都来自日常饮食，伤害不大，却会在最放松时突然刺中人","consequence":"冷峻视角从开篇就奠定，使讽刺避免落入辱骂。"}},{"point":"身份符号能够把知识分子的虚荣和社会评价机制转化成可见对象。","evidence":"“上面并列着三行衔头：‘国立三闾大学主任’、‘新闻学研究所所长’，还有一条是一个什么县党部的前任秘书。”","location":"第五章：旅途买票受阻，李梅亭拿出珍藏名片充当资历证明。","explain":"纸片上的头衔排列整齐，实际机构却被人物自己承认经过增减和重组。名片本应证明身份，在这场交涉中却暴露身份可以被制造、排版和夸大。具体物件使知识分子的体面焦虑可见，也把讽刺从性格批评推进到社会评价制度。由此，身份包装越具体，人物精神上的虚弱越容易被读者看见。","link":"身份包装越具体，人物精神上的虚弱越容易被读者看见。","page":"","edition":"人民文学出版社软皮版","chapter":"第五章","searchPhrase":"上面并列着三行衔头：‘国立三闾大学主","pdfPage":"","stage":"中","chain":{"who":"三闾大学知识分子群体","action":"身份符号能够把知识分子的虚荣和社会评价机制转化成可见对象。","reason":"纸片上的头衔排列整齐，实际机构却被人物自己承认经过增减和重组","consequence":"身份包装越具体，人物精神上的虚弱越容易被读者看见。"}},{"point":"冷峻叙述通过对称冲突避免把责任归于单一人物，使讽刺同时包含批判与悲悯。","evidence":"“我谁都不靠。我告诉你，我今天已经拍电报给赵辛楣，方才跟转运公司的人全讲好了。”“好，咱们算散伙。行李衣服，你自己去办，别再来找我。”","location":"第九章：方鸿渐决定投奔赵辛楣，孙柔嘉以清算和分手回应，婚姻冲突全面爆发。","explain":"方鸿渐用独立行动维护自尊，孙柔嘉用关系清算和实际事务回应，双方都在愤怒中把关系推向破裂。叙述没有提供单一受害者，家庭成员、经济压力和性格弱点同时进入冲突。讽刺因此带出悲凉，读者能笑人物的执拗，也能看到婚姻结构对人的消耗。由此，从日常比喻到婚姻结尾，冷峻视角始终保持，形成笑中带泪的复杂效果。","link":"从日常比喻到婚姻结尾，冷峻视角始终保持，形成笑中带泪的复杂效果。","page":"","edition":"人民文学出版社软皮版","chapter":"第九章","searchPhrase":"我谁都不靠。我告诉你，我今天已经拍电","pdfPage":"","stage":"后","chain":{"who":"方鸿渐及相关人物","action":"冷峻叙述通过对称冲突避免把责任归于单一人物，使讽刺同时包含批判与悲悯。","reason":"叙述没有提供单一受害者，家庭成员、经济压力和性格弱点同时进入冲突","consequence":"从日常比喻到婚姻结尾，冷峻视角始终保持，形成笑中带泪的复杂效果。"}}],"traps":["只写人物可笑，不解释叙述者如何让评价者和被评价者同时暴露。","把结尾写成方鸿渐或孙柔嘉单方面造成婚姻失败。","三个主体段都用围城比喻，缺少人物、物件和关系的具体证据。"],"learningLevel":"variation","studyPriority":"高频变式","parentQuestionId":"fortress-satire","doNotMemorizeSeparately":true,"questionFocus":"这题要写“讽刺的具象化与平衡视角”使用的手法、文本表现和效果，不能只报术语。","socraticQuestions":["题干要求你始终分析的主体是谁？","第一段的核心判断在文本中由什么行动支持？","三段怎样共同回答题干，而不是各讲一个知识点？"],"notAsking":["不要只报手法名称。","不要引用原文却不分析效果。"],"threePartPlan":[{"step":"第一段","focus":"讽刺通过日常物象揭示人性中善恶并存和难以预判的复杂性。","useFromCore":"调用《讽刺艺术》主体段 1","miniSentence":"首先，讽刺通过日常物象揭示人性中善恶并存和难以预判的复杂性"},{"step":"第二段","focus":"身份符号能够把知识分子的虚荣和社会评价机制转化成可见对象。","useFromCore":"调用《讽刺艺术》主体段 2","miniSentence":"其次，身份符号能够把知识分子的虚荣和社会评价机制转化成可见对象"},{"step":"第三段","focus":"冷峻叙述通过对称冲突避免把责任归于单一人物，使讽刺同时包含批判与悲悯。","useFromCore":"调用《讽刺艺术》主体段 3","miniSentence":"最后，冷峻叙述通过对称冲突避免把责任归于单一人物，使讽刺同时包含批判与悲悯"}],"commonMistakes":[{"mistake":"只列手法名称。","why":"没有说明怎样产生效果。","fix":"补文本表现和表达效果。"},{"mistake":"引用后不分析。","why":"引文无法证明手法作用。","fix":"解释语言、结构或意象怎样影响理解。"}],"summary":"讽刺的具象化与平衡视角：抓主体、变化与后果。","studentNote":"不必单独背全文，调用《讽刺艺术》的材料，重点练习问法变化。","needsManualReview":false},{"id":"saffi-imperfect-vanguard","work":"《莎菲女士的日记》","workKey":"saffi","type":"人物形象","title":"“不完美”莎菲的先锋性","prompt":"莎菲自我分裂、反复彷徨是否削弱了人物的先锋性？结合文本分析。","keywords":["不完美","先锋性","自我分裂","女性主义","主体","抵抗"],"thesis":"莎菲的先锋性不在于她成为道德完美的新女性，而在于她敢于承认欲望、行使对男性人格的精神评判权，并拒绝用物质和肉欲替代灵魂契合。","points":[{"point":"莎菲承认自我欲望，打破传统女性只能沉默和被安排的处境。","evidence":"“我要，我要使我快乐。”","location":"患病独居阶段的日记，莎菲面对疾病、爱情和生活苦闷时直接写下个人欲求。","explain":"人物把快乐和生命感受说成自己有权追求的目标，私人欲望因此取得公开表达的资格。她还没有找到实现这些要求的道路，冲破沉默本身已经构成新女性意识的先声。由此，先锋性从承认个人的身体和精神需要开始。女性从被评价的位置走向自我确认，沉默因此转化为具有主体意识的表达。","link":"先锋性从承认个人的身体和精神需要开始。","page":"P44","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"前","chain":{"who":"莎菲","action":"莎菲承认自我欲望，打破传统女性只能沉默和被安排的处境。","reason":"她还没有找到实现这些要求的道路，冲破沉默本身已经构成新女性意识的先声","consequence":"先锋性从承认个人的身体和精神需要开始。"},"searchPhrase":"我要，我要使我快乐。","chapter":"","pdfPage":"55"},{"point":"她拒绝凌吉士，是在行使女性对欲望对象进行精神评判和道德选择的权利。","evidence":"“当我明白了那使我爱慕的一个高贵的美形里，是安置着如此一个卑劣灵魂。”","location":"莎菲看清凌吉士真实面目后的心理转折。","explain":"人物没有因为欲望放弃判断，在发现对象的人格问题后主动收回感情。拒绝体现女性决定何种人值得进入关系、何种价值不能被交易的权利，与被迫失恋无关。由此，先锋性由此从身体欲望推进到精神评判和道德主体。拒绝不仅是爱情选择，也是在决定何种人格和价值观配得上自己的情感。","link":"先锋性由此从身体欲望推进到精神评判和道德主体。","page":"P58","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"凌吉士","action":"她拒绝凌吉士，是在行使女性对欲望对象进行精神评判和道德选择的权利。","reason":"人物没有因为欲望放弃判断，在发现对象的人格问题后主动收回感情","consequence":"先锋性由此从身体欲望推进到精神评判和道德主体。"},"searchPhrase":"当我明白了那使我爱慕的一个高贵的美形","chapter":"","pdfPage":"69"},{"point":"日记中的独语构成女性自我空间的建构。","evidence":"“谁能懂得我呢，便能懂得这只能表现我万分之一的日记。”","location":"全篇以第一人称日记持续展开的内心独白。","explain":"私人书写承认表达永远不完整，却也是人物可以脱离社会角色说话的空间。她保留欲望、羞耻、反思和判断，拒绝被外界固定成单一形象，书写因此成为抵抗误解和建构自我的方式。由此，这种私人空间使“不完美”获得了抵抗父权主体神话的意义。","link":"这种私人空间使“不完美”获得了抵抗父权主体神话的意义。","page":"P65","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"莎菲","action":"日记中的独语构成女性自我空间的建构。","reason":"私人书写承认表达永远不完整，却也是人物可以脱离社会角色说话的空间","consequence":"这种私人空间使“不完美”获得了抵抗父权主体神话的意义。"},"searchPhrase":"谁能懂得我呢，便能懂得这只能表现我万","chapter":"","pdfPage":"76"}],"traps":["把莎菲的犹豫和反复只当作性格缺点。","只写女性欲望，不分析她拒绝凌吉士时所表现的精神标准和主体判断。"],"learningLevel":"variation","studyPriority":"高频变式","parentQuestionId":"saffi-character","doNotMemorizeSeparately":true,"questionFocus":"这题要写““不完美”莎菲的先锋性”的关键性格怎样影响具体选择和后果，不能只列性格词。","socraticQuestions":["题干要求你始终分析的主体是谁？","第一段的核心判断在文本中由什么行动支持？","三段怎样共同回答题干，而不是各讲一个知识点？"],"notAsking":["不要只列性格形容词。","不要把其他人物写成段落主体。"],"threePartPlan":[{"step":"第一段","focus":"莎菲承认自我欲望，打破传统女性只能沉默和被安排的处境。","useFromCore":"调用《莎菲的主体性矛盾》主体段 1","miniSentence":"首先，莎菲承认自我欲望，打破传统女性只能沉默和被安排的处境"},{"step":"第二段","focus":"她拒绝凌吉士，是在行使女性对欲望对象进行精神评判和道德选择的权利。","useFromCore":"调用《莎菲的主体性矛盾》主体段 2","miniSentence":"其次，她拒绝凌吉士，是在行使女性对欲望对象进行精神评判和道德选择的权利"},{"step":"第三段","focus":"日记中的独语构成女性自我空间的建构。","useFromCore":"调用《莎菲的主体性矛盾》主体段 3","miniSentence":"最后，日记中的独语构成女性自我空间的建构"}],"commonMistakes":[{"mistake":"只写人物性格词。","why":"没有证明性格怎样影响行动。","fix":"补充具体行动、原因和后果。"},{"mistake":"把别人的反应当主体。","why":"题干要求的人物流失了。","f 结尾把前段的人道关怀、中段的社会批判和群众力量汇成完整的作者立场。"}}],"traps":["只写作者同情灾民，不分析作者如何批判官府和权力结构。","只写群众反抗，不说明作者怎样从个体苦难和行动代价观察这一转变。","把“知识分子立场”写成作者生平介绍，没有回到《水》的叙事和人物。"],"learningLevel":"variation","studyPriority":"高频变式","parentQuestionId":"water-theme","doNotMemorizeSeparately":true,"questionFocus":"这题要说明作品通过哪些人物和情节表现“《水》的知识分子立场：人道关怀与左翼批判”，每段形成因果推进。","socraticQuestions":["题干要求你始终分析的主体是谁？","第一段的核心判断在文本中由什么行动支持？","三段怎样共同回答题干，而不是各讲一个知识点？"],"notAsking":["不要只复述情节。","不要把主题写成空泛口号。"],"threePartPlan":[{"step":"第一段","focus":"前段以灾民的个体苦难作为叙事起点，体现作者对底层生命的人道关怀。","useFromCore":"调用《灾难与社会批判》主体段 1","miniSentence":"首先，前段以灾民的个体苦难作为叙事起点，体现作者对底层生命的人道关怀"},{"step":"第二段","focus":"救助选择揭示权力机构的阶级立场，使作品从人道关怀走向社会批判。","useFromCore":"调用《灾难与社会批判》主体段 2","miniSentence":"其次，救助选择揭示权力机构的阶级立场，使作品从人道关怀走向社会批判"},{"step":"第三段","focus":"后段肯定群众集体反抗，同时保留作者对苦难、愤怒和行动代价的观察。","useFromCore":"调用《灾难与社会批判》主体段 3","miniSentence":"最后，后段肯定群众集体反抗，同时保留作者对苦难、愤怒和行动代价的观察"}],"commonMistakes":[{"mistake":"只复述情节。","why":"没有说明主题怎样形成。","fix":"写人物行动、原因和主题后果。"},{"mistake":"用抽象口号代替分析。","why":"缺少原文支撑。","fix":"每个观点配具体情节。"}],"summary":"《水》的知识分子立场：人道关怀与左翼批判：抓主体、变化与后果","studentNote":"不必单独背全文，调用《灾难与社会批判》的材料，重点练习问法变化。","needsManualReview":false},{"id":"water-1930s-ecology","work":"《水》","workKey":"water","type":"比较阅读","title":"灾害书写与1930年代文学生态","prompt":"结合1930年代上海文学生态，分析《水》灾害书写中的左翼文学特征。","keywords":["1930年代","文学生态","灾害书写","左翼文学","比较","上海"],"thesis":"《水》把自然灾害、官僚压迫和群众觉醒接合起来，体现左翼文学关注底层和社会改造的方向，也显示1930年代文学思潮相互碰撞的多元生态。","points":[{"point":"灾害描写一开始就和社会环境连在一起。","evidence":"“愁惨的天照着黄色的滔滔的大水，那一夜淹了汤家阙，又淹了一渡口的一片汪洋的大水。”","location":"第一部分开头：洪水逼近并毁坏村庄，重点看自然环境怎样立即带出贫困和社会脆弱。","explain":"具体生活空间被灾难吞没，村庄、田地和家庭成为破坏对象。作品从生存危机进入底层贫困和社会脆弱性，灾害书写带有明显社会观察。由此，灾害因此成为观察社会结构的入口。灾害记录由此脱离单一自然现象，开始承载底层贫困和社会脆弱性的观察。","link":"灾害因此成为观察社会结构的入口。","page":"P226","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"前","chain":{"who":"灾民群众","action":"灾害描写一开始就和社会环境连在一起。","reason":"具体生活空间被灾难吞没，村庄、田地和家庭成为破坏对象","consequence":"灾害因此成为观察社会结构的入口。"},"searchPhrase":"愁惨的天照着黄色的滔滔的大水，那一夜","chapter":"","pdfPage":"237"},{"point":"官僚和军队的行为把天灾转化为社会悲剧。","evidence":"“帆船却又带来了一些军火，并没有带救济米。”","location":"第二至三部分：官府处理灾情、军火替代救济米，重点找权力和阶级关系。","explain":"权力机构在救灾时刻的实际选择揭示阶级立场。政治反差把灾害记录推向社会批判，并与左翼文学对权力结构的关注相连。政治选择揭示阶级立场，也是左翼文学把自然灾难转写为社会问题的典型方式。这种转写让文学把灾荒经验纳入阶级分析和现代中国出路讨论。","link":"这种问题意识与左翼文学的社会分析相呼应。","page":"P231","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"灾民群众","action":"官僚和军队的行为把天灾转化为社会悲剧。","reason":"权力机构在救灾时刻的实际选择揭示阶级立场","consequence":"这种转写让文学把灾荒经验纳入阶级分析和现代中国出路讨论"},"searchPhrase":"帆船却又带来了一些军火，并没有带救济","chapter":"","pdfPage":"242"},{"point":"群众反抗体现文学从揭露问题走向行动想象。","evidence":"“比水还凶猛的，朝镇上扑了过去。”","location":"第四部分结尾：群众集体反抗，重点看作品如何从揭露问题走向社会改造想象。","explain":"灾害的破坏力被改写为集体行动力，作品从揭露问题走向行动想象。这种转向呼应1930年代左翼文学对社会出路的探索。群众反抗把社会批判推进为行动想象，并连接1930年代革命文学的历史方向。由此，灾害小说同时承载历史见证和社会改造的双重功能。","link":"结尾要说明它和1930年代多元文学思潮之间的互动。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"群众","action":"群众反抗体现文学从揭露问题走向行动想象。","reason":"灾害的破坏力被改写为集体行动力，作品从揭露问题走向行动想象","consequence":"由此，灾害小说同时承载历史见证和社会改造的双重功能"},"searchPhrase":"比水还凶猛的，朝镇上扑了过去。","chapter":"","pdfPage":"251"}],"traps":["把灾害小说仅仅当作灾难记录。","比较时只写共同点，不说明《水》的政治指向。"],"learningLevel":"teacher-extension","studyPriority":"拓展","parentQuestionId":"water-theme","doNotMemorizeSeparately":true,"questionFocus":"这题要围绕“灾害书写与1930年代文学生态”回答题干任务，写清行动、原因和后果。","socraticQuestions":["题干要求你始终分析的主体是谁？","第一段的核心判断在文本中由什么行动支持？","三段怎样共同回答题干，而不是各讲一个知识点？"],"notAsking":["不要只概括内容。","不要把无关知识点拼进答案。"],"threePartPlan":[{"step":"第一段","focus":"灾害描写一开始就和社会环境连在一起。","useFromCore":"调用《灾难与社会批判》主体段 1","miniSentence":"首先，灾害描写一开始就和社会环境连在一起"},{"step":"第二段","focus":"官僚和军队的行为把天灾转化为社会悲剧。","useFromCore":"调用《灾难与社会批判》主体段 2","miniSentence":"其次，官僚和军队的行为把天灾转化为社会悲剧"},{"step":"第三段","focus":"群众反抗体现文学从揭露问题走向行动想象。","useFromCore":"调用《灾难与社会批判》主体段 3","miniSentence":"最后，群众反抗体现文学从揭露问题走向行动想象"}],"commonMistakes":[{"mistake":"答案没有中心判断。","why":"三段像知识拼盘。","fix":"先用 thesis 统一三段。"},{"mistake":"只有结论，没有因果。","why":"无法形成文学论证。","fix":"每段补齐行动、原因和后果。"}],"summary":"灾害书写与1930年代文学生态：抓主体、变化与后果。","studentNote":"教师拓展题，普通考试复习不必优先。","needsManualReview":true},{"id":"water-discourse-tension","work":"《水》","workKey":"water","type":"主题思想","title":"个性话语与革命话语的张力","prompt":"分析《水》如何呈现个性话语与革命话语之间的张力。","keywords":["个性话语","革命话语","冯雪峰","左翼批评","群众","情感"],"thesis":"《水》一方面走向宏大的革命和群众叙事，另一方面仍保存个体恐惧、悲痛和复杂情感，文本因此留下个性话语与革命话语相互牵引的张力。","points":[{"point":"个体苦难仍然是革命叙事不可抹去的部分。","evidence":"“那些被骂着的女人，一批一批的，在无可奈何之中，含着眼泪，含着一线希望，扶老携幼向着相反的方向跑去，带着哭和叫，带着骚扰和不安，向原野的四方伸去。”","location":"第一部分灾民逃难：重点找妇女哭喊、扶老携幼等个体情感，看它们如何保留在革命叙事中。","explain":"逃亡、哭叫和家庭迁徙构成叙事最强的现实压力。革命叙事必须先承载个体痛苦，集体觉醒才有真实的人性根底。由此，这构成文本中个性话语的留存。个体哭声进入宏大叙事，使革命话语必须面对具体生命的痛苦和尊严。","link":"这构成文本中个性话语的留存。","page":"P224","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"前","chain":{"who":"作者与叙事者","action":"个体苦难仍然是革命叙事不可抹去的部分。","reason":"逃亡、哭叫和家庭迁徙构成叙事最强的现实压力","consequence":"这构成文本中个性话语的留存。"},"searchPhrase":"那些被骂着的女人，一批一批的，在无可","chapter":"","pdfPage":"235"},{"point":"革命话语通过政治反差把个人苦难引向社会批判。","evidence":"“帆船却又带来了一些军火，并没有带救济米。”","location":"第二至三部分：军火与救济米的反差把求生问题引向权力批判。","explain":"物资反差把个人求生引向权力质疑，革命话语从现实利益判断中生长。个体苦难获得社会批判方向，群众觉醒与现实处境相连。由此，两种话语彼此依存并互相推动。革命立场从群众切身利益和权力判断中生长，具有内在现实基础。","link":"两种话语彼此依存并互相推动。","page":"P231","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"灾民群众","action":"革命话语通过政治反差把个人苦难引向社会批判。","reason":"物资反差把个人求生引向权力质疑，革命话语从现实利益判断中生长","consequence":"两种话语彼此依存并互相推动。"},"searchPhrase":"帆船却又带来了一些军火，并没有带救济","chapter":"","pdfPage":"242"},{"point":"集体行动仍然包含鲜明的情感力量。","evidence":"“比水还凶猛的，朝镇上扑了过去。”","location":"第四部分结尾：群众行动由悲痛、饥饿和愤怒积聚而成，重点看集体行动中的情感动力。","explain":"集体行动的力量来自悲痛、饥饿和愤怒，群众保持具体情感，并未成为抽象主体。革命话语与个性话语因此互相依赖，也持续拉扯。情感并未被集体行动抹去，反而构成群众力量持续积聚的内在动力。这种情感基础也使革命叙事避免变成冷漠的政治口号。","link":"结尾要说明革命转向背后的复杂情感动力。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"灾民群众","action":"集体行动仍然包含鲜明的情感力量。","reason":"集体行动的力量来自悲痛、饥饿和愤怒，群众保持具体情感，并未成为抽象主体","consequence":"这种情感基础也使革命叙事避免变成冷漠的政治口号"},"searchPhrase":"比水还凶猛的，朝镇上扑了过去。","chapter":"","pdfPage":"251"}],"traps":["把个性话语和革命话语看作完全对立。","只讨论革命主题，不分析个体情感怎样进入集体叙事。"],"learningLevel":"teacher-extension","studyPriority":"拓展","parentQuestionId":"water-theme","doNotMemorizeSeparately":true,"questionFocus":"这题要说明作品通过哪些人物和情节表现“个性话语与革命话语的张力”，每段形成因果推进。","socraticQuestions":["题干要求你始终分析的主体是谁？","第一段的核心判断在文本中由什么行动支持？","三段怎样共同回答题干，而不是各讲一个知识点？"],"notAsking":["不要只复述情节。","不要把主题写成空泛口号。"],"threePartPlan":[{"step":"第一段","focus":"个体苦难仍然是革命叙事不可抹去的部分。","useFromCore":"调用《灾难与社会批判》主体段 1","miniSentence":"首先，个体苦难仍然是革命叙事不可抹去的部分"},{"step":"第二段","focus":"革命话语通过政治反差把个人苦难引向社会批判。","useFromCore":"调用《灾难与社会批判》主体段 2","miniSentence":"其次，革命话语通过政治反差把个人苦难引向社会批判"},{"step":"第三段","focus":"集体行动仍然包含鲜明的情感力量。","useFromCore":"调用《灾难与社会批判》主体段 3","miniSentence":"最后，集体行动仍然包含鲜明的情感力量"}],"commonMistakes":[{"mistake":"只复述情节。","why":"没有说明主题怎样形成。","fix":"写人物行动、原因和主题后果。"},{"mistake":"用抽象口号代替分析。","why":"缺少原文支撑。","fix":"每个观点配具体情节。"}],"summary":"个性话语与革命话语的张力：抓主体、变化与后果。","studentNote":"教师拓展题，普通考试复习不必优先。","needsManualReview":true},{"id":"hospital-individual-collective","work":"《在医院中》","workKey":"hospital","type":"主题思想","title":"个体理想与集体秩序","prompt":"分析《在医院中》如何思考个体理想与集体秩序之间的关系。","keywords":["个体","集体","理想","秩序","陆萍","改造"],"thesis":"医院同时是个体实践的场所和集体秩序的现场。小说把陆萍的专业理想、组织纪律和医院现实放在同一空间中，呈现个体需要实践、集体需要反思的双向磨合。","points":[{"point":"陆萍把病人和产妇的基本需要带进医院管理，使个人专业理想指向公共服务。","evidence":"“为了不愿病人产妇多受苦痛，便自己去替几个开刀了的，发炎的换药。”","location":"第二部分：陆萍主动承担护理劳动，以行动回应病人和产妇的痛苦。","explain":"个人理想首先表现为照顾具体生命和承担实际劳动，因此其方向指向集体服务。冲突来自改善现实的方法、顺序和资源限制，不能用简单的个人对抗集体概括。由此，个体与集体关系的起点落在共同服务病人的实践目标上。","link":"个体与集体关系的起点落在共同服务病人的实践目标上。","page":"P386","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"前","chain":{"who":"陆萍","action":"陆萍把病人和产妇的基本需要带进医院管理，使个人专业理想指向公共服务。","reason":"冲突来自改善现实的方法、顺序和资源限制，不能用简单的个人对抗集体概括","consequence":"个体与集体关系的起点落在共同服务病人的实践目标上。"},"searchPhrase":"为了不愿病人产妇多受苦痛，便自己去替","chapter":"","pdfPage":"397"},{"point":"集体中的标签化使工作问题无法被正常讨论。","evidence":"“小资产阶级意识、知识分子的英雄主义、自由主义等等的帽子都往她头上戴。”","location":"第二至三部分：她提出意见书、与同事和管理者发生冲突，并被贴上“小资产阶级意识”等标签。","explain":"身份判断取代具体分析，人物的意见失去被理解的机会。集体以标签维护旧秩序，也压抑专业改进可能，官僚和麻木成为内部阻力。由此，个体需要调整，集体同样需要自我反思。标签化让集体无法吸收不同意见，也使专业和伦理责任失去讨论空间。","link":"个体需要调整，集体同样需要自我反思。","page":"P394","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"陆萍与医院环境","action":"集体中的标签化使工作问题无法被正常讨论。","reason":"由此，个体需要调整，集体同样需要自我反思","consequence":"个体需要调整，集体同样需要自我反思。"},"searchPhrase":"小资产阶级意识、知识分子的英雄主义、","chapter":"","pdfPage":"405"},{"point":"朋友、病人和老同志的帮助使陆萍转向更成熟的实践。","evidence":"“她仍然是那样兴致很浓厚的去照顾着那些产妇，那些婴儿，为着她们一点点的需索，去同管理员，总务处，秘书长，甚至院长去争执。”","location":"第四部分：陆萍与朋友、老同志交流后继续照顾病人并为资源交涉，观察个人行动方式的变化。","explain":"朋友、病人和老同志的支持让人物继续为具体需要奔走，并学会让理想适应现实节奏。个体与集体关系从单纯冲突转向实践调整，关怀仍处于核心。人物继续行动说明个体并未放弃理想，集体关系也在具体合作中获得修正可能。","link":"结论应落在个体与集体的双向成长。","page":"P388-P389","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"陆萍","action":"朋友、病人和老同志的帮助使陆萍转向更成熟的实践。","reason":"朋友、病人和老同志的支持让人物继续为具体需要奔走，并学会让理想适应现实节奏","consequence":"人物继续行动说明个体并未放弃理想，集体关系也在具体合作中获得修正可能"},"searchPhrase":"她仍然是那样兴致很浓厚的去照顾着那些","chapter":"","pdfPage":"399-400"}],"traps":["把陆萍写成完全正确、集体完全错误的二元对立。","只谈组织纪律，不分析医院管理中的官僚主义和专业缺失。"],"learningLevel":"core","studyPriority":"必背","parentQuestionId":null,"doNotMemorizeSeparately":false,"questionFocus":"这题要说明作品通过哪些人物和情节表现“个体理想与集体秩序”，每段形成因果推进。","socraticQuestions":["题干要求你始终分析的主体是谁？","第一段的核心判断在文本中由什么行动支持？","三段怎样共同回答题干，而不是各讲一个知识点？"],"notAsking":["不要只复述情节。","不要把主题写成空泛口号。"],"threePartPlan":[{"step":"第一段","focus":"陆萍把病人和产妇的基本需要带进医院管理，使个人专业理想指向公共服务。","useFromCore":"本题核心 Point 1","miniSentence":"首先，陆萍把病人和产妇的基本需要带进医院管理，使个人专业理想指向公共服务"},{"step":"第二段","focus":"集体中的标签化使工作问题无法被正常讨论。","useFromCore":"本题核心 Point 2","miniSentence":"其次，集体中的标签化使工作问题无法被正常讨论"},{"step":"第三段","focus":"朋友、病人和老同志的帮助使陆萍转向更成熟的实践。","useFromCore":"本题核心 Point 3","miniSentence":"最后，朋友、病人和老同志的帮助使陆萍转向更成熟的实践"}],"commonMistakes":[{"mistake":"只复述情节。","why":"没有说明主题怎样形成。","fix":"写人物行动、原因和主题后果。"},{"mistake":"用抽象口号代替分析。","why":"缺少原文支撑。","fix":"每个观点配具体情节。"}],"summary":"个体理想与集体秩序：抓主体、变化与后果。","studentNote":"先背这一题，再练同一母题下的变式。","needsManualReview":false},{"id":"hospital-dual-luping","work":"《在医院中》","workKey":"hospital","type":"人物形象","title":"“产科助手”与“理想人物”的双重分裂","prompt":"为什么说陆萍是在“产科助手”与“理想人物”之间游移、分裂的形象？","keywords":["陆萍","产科助手","理想人物","双重分裂","身份","成长"],"thesis":"陆萍的复杂性来自现实中的产科助手、五四新女性、现代医学知识者和理想革命者等多重身份。创作理想不断要求她成为坚强人物，现实细节却不断暴露她的脆弱、热情和困惑。","points":[{"point":"理想自我要求她用理智压住脆弱，努力建设新的希望。","evidence":"“她竭力安慰自己，鼓励自己，骂自己，又替自己建筑着新的希望的楼阁，努力使自己在这楼阁中睡去。”","location":"第一部分：陆萍在窑洞中反复安慰自己、鼓励自己、骂自己，努力把不安压下去。","explain":"人物用多种方式要求自己维持坚强，希望因此带有自我麻醉成分。理想自我与现实感受没有真正调和，主体分裂在反复自我说服中显现。由此，人物的坚强和脆弱在同一种自我调整中同时出现。自我安慰暂时维持精神秩序，却把现实压力推向更深处，主体分裂因此更明显。","link":"人物的坚强和脆弱在同一种自我调整中同时出现。","page":"P382","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"前","chain":{"who":"陆萍与医院环境","action":"理想自我要求她用理智压住脆弱，努力建设新的希望。","reason":"人物用多种方式要求自己维持坚强，希望因此带有自我麻醉成分","consequence":"人物的坚强和脆弱在同一种自我调整中同时出现。"},"searchPhrase":"她竭力安慰自己，鼓励自己，骂自己，又","chapter":"","pdfPage":"393"},{"point":"产科助手的现实身份不断把她拉回具体、琐碎而疼痛的医疗工作。","evidence":"“为了不愿病人产妇多受苦痛，便自己去替几个开刀了的，发炎的换药。”","location":"第一部分至第二部分：她替开刀、发炎的病人换药，照料产妇和婴儿，把理想落实为产科助手的劳动。","explain":"理想期待无法替代护理和换药等实际劳动，具体工作让她看见病人、产妇和医疗条件的真实处境。现实身份给批判提供经验，也持续拉扯理想自我。由此，两种身份的冲突推动人物由想象走向实践。具体的护理经验不断校正理想期待，也使她能够把抽象责任感转化为可持续行动。","link":"两种身份的冲突推动人物由想象走向实践。","page":"P386","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"中","chain":{"who":"陆萍与医院环境","action":"产科助手的现实身份不断把她拉回具体、琐碎而疼痛的医疗工作。","reason":"理想期待无法替代护理和换药等实际劳动，具体工作让她看见病人、产妇和医疗条件的真实处境","consequence":"两种身份的冲突推动人物由想象走向实践。"},"searchPhrase":"为了不愿病人产妇多受苦痛，便自己去替","chapter":"","pdfPage":"397"},{"point":"受挫后的陆萍没有被彻底改造，却在继续行动中逐渐弥合主体裂隙。","evidence":"“她仍然是那样兴致很浓厚的去照顾着那些产妇，那些婴儿，为着她们一点点的需索，去同管理员，总务处，秘书长，甚至院长去争执。”","location":"第三至四部分：中毒事件后她情绪崩溃，随后仍照顾病人、争取资源，并准备继续学习和工作。","explain":"受挫后继续为具体需要奔走，说明理想并未被现实完全击碎。人物把愿望落实为可持续行动，分裂逐渐转向稳定责任意识，她从热血青年成长为实践者。由此，成长的价值在于主体裂隙得到实践中的调整，人物并未被抹平。","link":"成长的价值在于主体裂隙得到实践中的调整，人物并未被抹平。","page":"P388-P389","edition":"浙江文艺出版社《丁玲小说》（标注版）","stage":"后","chain":{"who":"陆萍","action":"受挫后的陆萍没有被彻底改造，却在继续行动中逐渐弥合主体裂隙。","reason":"受挫后继续为具体需要奔走，说明理想并未被现实完全击碎","consequence":"成长的价值在于主体裂隙得到实践中的调整，人物并未被抹平。"},"searchPhrase":"她仍然是那样兴致很浓厚的去照顾着那些","chapter":"","pdfPage":"399-400"}],"traps":["把陆萍的分裂简单归因于性格前后矛盾。","只写她最终成为有用的人，忽略她保留的敏感、脆弱和主体复杂性。"],"learningLevel":"teacher-extension","studyPriority":
