,"point":"在聘约问题上，高松年根据个人判断随意降低方鸿渐职称，并把年轻和资历当作控制教师的理由。","evidence":"“他自己开来的学历，并没有学位，只是个各国游荡的‘游学生’，并且并非学政治的，聘他当教授太冤枉了！至多做副教授，循序渐升，年轻人做事不应该爬得太高。”","location":"第六章：方鸿渐到校后，高松年把原先聘为教授的口头承诺改成副教授。","explain":"高松年先以学历和年龄为自己的决定寻找理由，再用“循序渐升”掩盖失信。职位升降缺少公开规则，教师只能接受行政意志。年龄和资历被用作压低年轻人的工具，学校的管理逻辑因此与学术能力评估脱节，知识分子的职业尊严也受到伤害。","link":"中段把精明落实到具体权术，说明高松年的行政能力主要表现为控制下属而非建设学术。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第六章","searchPhrase":"聘他当教授太冤枉了","pdfPage":"","chain":{"who":"方鸿渐","action":"在聘约问题上，高松年根据个人判断随意降低方鸿渐职称，并把年轻和资历当作控制教师的理由。","reason":"职位升降缺少公开规则，教师只能接受行政意志","consequence":"中段把精明落实到具体权术，说明高松年的行政能力主要表现为控制下属而非建设学术。"}},{"stage":"后","point":"当政治风险出现时，高松年以思想问题为由停聘方鸿渐，并借“可惜”维持自己公正惜才的形象。","evidence":"“我本来要升他一级，谁知道他思想有问题，下学期只能解聘。这个人倒是可造之才，可惜！可惜！”","location":"第八章：陆子潇发现方鸿渐房中有共产主义书籍，李梅亭书面报告，高松年决定下学期不再聘用方鸿渐。","explain":"高松年把一本书和一次报告直接等同于思想问题，用政治安全替代事实调查和职业程序。他先说自己原本准备升职，再把责任推给外部风险，从而既清除可能带来麻烦的教师，又维持惜才公正的外表。大学权力因此进一步向行政控制集中。","link":"结尾揭示高松年的精明包含趋利避害和政治卸责，使其官僚性格具有更广泛的社会讽刺意义。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第八章","searchPhrase":"我本来要升他一级","pdfPage":"","chain":{"who":"方鸿渐","action":"当政治风险出现时，高松年以思想问题为由停聘方鸿渐，并借“可惜”维持自己公正惜才的形象。","reason":"高松年把一本书和一次报告直接等同于思想问题，用政治安全替代事实调查和职业程序","consequence":"结尾揭示高松年的精明包含趋利避害和政治卸责，使其官僚性格具有更广泛的社会讽刺意义。"}}],"traps":["只列举高松年狡猾、虚伪，不分析他如何利用职位和制度。","把高松年写成单纯无能的人，忽略他行政操作上的精明。","只写他对个别教师的欺骗，不联系学校权力结构和社会环境。"],"learningLevel":"variation","studyPriority":"高频变式","parentQuestionId":"fortress-education-system-satire","doNotMemorizeSeparately":true,"questionFocus":"这题要写“高松年的行政权术”的关键性格怎样影响具体选择和后果，不能只列性格词。","socraticQuestions":["题干要求你始终分析的主体是谁？","第一段的核心判断在文本中由什么行动支持？","三段怎样共同回答题干，而不是各讲一个知识点？"],"notAsking":["不要只列性格形容词。","不要把其他人物写成段落主体。"],"threePartPlan":[{"step":"第一段","focus":"初登场时，高松年的勤敏和精明被夸张描写，叙述语气表面赞扬，实际暗示其精明服务于个人和行政权力。","useFromCore":"调用《战时高等教育制度的乱象》主体段 1","miniSentence":"首先，初登场时，高松年的勤敏和精明被夸张描写，叙述语气表面赞扬，实际暗示其精明服务于个"},{"step":"第二段","focus":"在聘约问题上，高松年根据个人判断随意降低方鸿渐职称，并把年轻和资历当作控制教师的理由。","useFromCore":"调用《战时高等教育制度的乱象》主体段 2","miniSentence":"其次，在聘约问题上，高松年根据个人判断随意降低方鸿渐职称，并把年轻和资历当作控制教师的"},{"step":"第三段","focus":"当政治风险出现时，高松年以思想问题为由停聘方鸿渐，并借“可惜”维持自己公正惜才的形象。","useFromCore":"调用《战时高等教育制度的乱象》主体段 3","miniSentence":"最后，当政治风险出现时，高松年以思想问题为由停聘方鸿渐，并借“可惜”维持自己公正惜才的"}],"commonMistakes":[{"mistake":"只写人物性格词。","why":"没有证明性格怎样影响行动。","fix":"补充具体行动、原因和后果。"},{"mistake":"把别人的反应当主体。","why":"题干要求的人物流失了。","fix":"每段回到题干人物。"}],"summary":"高松年的行政权术：抓主体、变化与后果。","studentNote":"不必单独背全文，调用《战时高等教育制度的乱象》的材料，重点练习问法变化。","needsManualReview":false},{"id":"fortress-li-meiting-character","work":"《围城》","workKey":"fortress","type":"人物形象","title":"李梅亭的虚荣与贪利","prompt":"分析李梅亭的性格特征及其讽刺意义。","keywords":["李梅亭","虚荣","贪利","西药","训导长","知识分子"],"thesis":"李梅亭重视体面、私利和个人权威，言行中不断暴露虚傲、贪利和道德表演。他把学历与头衔包装成身份，把西药变成牟利资本，又把训导权用于窥探和控制他人。这一人物集中讽刺战时知识群体的功利化和道德虚伪。","points":[{"stage":"前","point":"旅途初期，李梅亭通过衣着、姿态和冷漠显示身份优越感，外表体面成为遮盖功利品格的道具。","evidence":"“中国文学系主任李梅亭是高松年的老同事，四十来岁年纪，戴副墨晶眼镜，神情傲兀，不大理会人，并且对天气也鄙夷不理，因为这是夏历六月中旬，他穿的还是黑呢西装外套。”","location":"第五章：赵辛楣组织赴三闾大学的同行者见面，李梅亭以中国文学系主任身份首次出现。","explain":"李梅亭在盛夏坚持穿厚重西装，又对他人的寒暄保持高傲，说明他重视给外界留下严肃、尊贵的形象。体面并不来自真实学问，而由头衔、服饰和冷淡姿态共同制造。旁人越把他看成了不起的人物，他越容易隐藏自私和贪利。","link":"前段以外在体面和傲慢建立人物面具，为后文药箱和训导权暴露真实欲望作准备。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第五章","searchPhrase":"戴副墨晶眼镜","pdfPage":"","chain":{"who":"李梅亭","action":"旅途初期，李梅亭通过衣着、姿态和冷漠显示身份优越感，外表体面成为遮盖功利品格的道具。","reason":"体面并不来自真实学问，而由头衔、服饰和冷淡姿态共同制造","consequence":"前段以外在体面和傲慢建立人物面具，为后文药箱和训导权暴露真实欲望作准备。"}},{"stage":"中","point":"进入学校后，李梅亭把随身西药作为谈判资本，借学校缺药迫使其接受高价购买，显示明确的牟利动机。","evidence":"“这箱子里一半是西药，原瓶封口的消治龙、药特灵、金鸡纳霜、福美明达片，应有尽有。”“内地买不到西药，各位万一生起病来，那时候才知道我李梅亭的功劳呢！”","location":"第五章末至第六章：众人发现李梅亭铁箱中的大量西药，到校后他又要求学校按自己的价格收购。","explain":"李梅亭先以“为大家备药”的话掩饰药品的商业用途，随后利用学校缺药和自己掌握货源的条件提出交易。公共需要被转化为个人收益，他还在谈判中表现得理直气壮。头衔和知识身份因此成为经营私利的渠道，教育与公共服务被进一步商品化。","link":"中段揭示李梅亭体面外表下的逐利本质，使人物讽刺从作风夸张进入利益关系。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第五章","searchPhrase":"这箱子里一半是西药","pdfPage":"","chain":{"who":"李梅亭","action":"进入学校后，李梅亭把随身西药作为谈判资本，借学校缺药迫使其接受高价购买，显示明确的牟利动机。","reason":"公共需要被转化为个人收益，他还在谈判中表现得理直气壮","consequence":"中段揭示李梅亭体面外表下的逐利本质，使人物讽刺从作风夸张进入利益关系。"}},{"stage":"后","point":"担任训导长后，李梅亭用道德判断和流言窥探他人私生活，借管理职责扩大个人影响。","evidence":"“准出了乱子了，否则不会肯订婚的。你们瞧，订婚之后马上就会结婚。其实何必一番手脚两番做呢？干脆同居得了。”“这事有关学校风纪，我将来要唤起校长的注意，我管训导，有我的职责。”","location":"第七章：方鸿渐与孙柔嘉订婚后，李梅亭散布二人“出了问题”的猜测，并声称要从学校风纪角度报告校长。","explain":"李梅亭把私人婚姻解释成有损风纪的丑闻，用低俗猜测吸引同事注意，再以训导职责为自己的干涉寻找正当性。关注他人私生活能够满足他的窥探欲，也能强化他在学校中的权力感。道德话语因此成为控制和攻击他人的工具。","link":"结尾把虚荣和贪利推进到道德伪善，完成李梅亭作为庸俗官僚式知识分子的完整讽刺。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第七章","searchPhrase":"准出了乱子了","pdfPage":"","chain":{"who":"李梅亭","action":"担任训导长后，李梅亭用道德判断和流言窥探他人私生活，借管理职责扩大个人影响。","reason":"李梅亭把私人婚姻解释成有损风纪的丑闻，用低俗猜测吸引同事注意，再以训导职责为自己的干涉寻找正当性","consequence":"结尾把虚荣和贪利推进到道德伪善，完成李梅亭作为庸俗官僚式知识分子的完整讽刺。"}}],"traps":["只写李梅亭吝啬或好色，没有分析他如何利用身份、物资和管理权。","把西药事件写成笑料，不说明公共资源怎样被私人牟利。","只批评个人品格，不联系战时教育环境中的功利风气。"],"learningLevel":"variation","studyPriority":"高频变式","parentQuestionId":"fortress-intellectuals","doNotMemorizeSeparately":true,"questionFocus":"这题要写“李梅亭的虚荣与贪利”的关键性格怎样影响具体选择和后果，不能只列性格词。","socraticQuestions":["题干要求你始终分析的主体是谁？","第一段的核心判断在文本中由什么行动支持？","三段怎样共同回答题干，而不是各讲一个知识点？"],"notAsking":["不要只列性格形容词。","不要把其他人物写成段落主体。"],"threePartPlan":[{"step":"第一段","focus":"旅途初期，李梅亭通过衣着、姿态和冷漠显示身份优越感，外表体面成为遮盖功利品格的道具。","useFromCore":"调用《三闾大学中的权力与知识分子群像》主体段 1","miniSentence":"首先，旅途初期，李梅亭通过衣着、姿态和冷漠显示身份优越感，外表体面成为遮盖功利品格的道"},{"step":"第二段","focus":"进入学校后，李梅亭把随身西药作为谈判资本，借学校缺药迫使其接受高价购买，显示明确的牟利动机。","useFromCore":"调用《三闾大学中的权力与知识分子群像》主体段 2","miniSentence":"其次，进入学校后，李梅亭把随身西药作为谈判资本，借学校缺药迫使其接受高价购买，显示明确"},{"step":"第三段","focus":"担任训导长后，李梅亭用道德判断和流言窥探他人私生活，借管理职责扩大个人影响。","useFromCore":"调用《三闾大学中的权力与知识分子群像》主体段 3","miniSentence":"最后，担任训导长后，李梅亭用道德判断和流言窥探他人私生活，借管理职责扩大个人影响"}],"commonMistakes":[{"mistake":"只写人物性格词。","why":"没有证明性格怎样影响行动。","fix":"补充具体行动、原因和后果。"},{"mistake":"把别人的反应当主体。","why":"题干要求的人物流失了。","fix":"每段回到题干人物。"}],"summary":"李梅亭的虚荣与贪利：抓主体、变化与后果。","studentNote":"不必单独背全文，调用《三闾大学中的权力与知识分子群像》的材料，重点练习问法变化。","needsManualReview":false},{"id":"fortress-fang-father-character","work":"《围城》","workKey":"fortress","type":"人物形象","title":"方遯翁的封建家长面孔","prompt":"分析方遯翁的性格特征及其对作品主题的作用。","keywords":["方遯翁","方老先生","封建家长","科举","面子","父子关系"],"thesis":"方遯翁是衰落中的封建家长典型。他维护父权、重视家族体面，喜欢用古书和训诫证明自己高明，又常以便利自己的方式解释传统道德。这一形象把家庭内部的专制与国家旧文化中的僵化习惯联系起来。","points":[{"stage":"前","point":"方遯翁以父权、科举语言和道德训诫压制儿子的私人选择，家庭关系首先表现为不容挑战的命令关系。","evidence":"“吾不惜重资，命汝千里负笈，汝埋头攻读之不暇，而有余闲照镜耶？汝非妇人女子，何须置镜？”“当是汝校男女同学，汝睹色起意，见异思迁；汝托词悲秋，吾知汝实为怀春。”","location":"第一章至第二章：方鸿渐留学前请求解除旧婚约，方遯翁立即回信痛骂并威胁停止寄款。","explain":"方遯翁把教育投入理解为支配儿子的权利，又用性别等级和道德指控堵住解释。讨论私人婚姻本应涉及当事人的意愿，他却把它变成孝道和家族服从问题。父权通过经济威胁得到执行，方鸿渐由此形成畏惧权威和回避冲突的性格起点。","link":"前段建立方遯翁严厉、专断的家长形象，也为方鸿渐长期依赖又畏惧父亲埋下原因。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第一章","searchPhrase":"汝非妇人女子","pdfPage":"","chain":{"who":"作者与叙事者","action":"方遯翁以父权、科举语言和道德训诫压制儿子的私人选择，家庭关系首先表现为不容挑战的命令关系。","reason":"方遯翁把教育投入理解为支配儿子的权利，又用性别等级和道德指控堵住解释","consequence":"前段建立方遯翁严厉、专断的家长形象，也为方鸿渐长期依赖又畏惧父亲埋下原因。"}},{"stage":"中","point":"方遯翁把日常言行整理成日记、自传和训子材料，表现强烈的自我欣赏和表演意识。","evidence":"“鸿渐知道这些话虽然对自己说，而主要是记载在日记和回忆录里给天下后世看方遯翁怎样教子以义方的。”“这种精神上的顾影自怜使他写自传、写日记。”","location":"第四章：方鸿渐准备前往三闾大学，方遯翁发表成套临别赠言，日记中又对事实进行修饰。","explain":"方遯翁把教育儿子、评论亲友和家庭冲突都改写成自己高明仁厚的证据。日记本应记录事实，却成为塑造个人形象的工具，他还会借文字褒贬他人。传统道德话语因此服务于自我神化，旧式读书人的学问也退化成摆姿态和写批语。","link":"中段揭示方遯翁的旧学权威带有强烈表演性，讽刺家庭与知识分子生活中的自恋和虚假。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第四章","searchPhrase":"给天下后世看方遯翁","pdfPage":"","chain":{"who":"方鸿渐及相关人物","action":"方遯翁把日常言行整理成日记、自传和训子材料，表现强烈的自我欣赏和表演意识。","reason":"方遯翁把教育儿子、评论亲友和家庭冲突都改写成自己高明仁厚的证据","consequence":"中段揭示方遯翁的旧学权威带有强烈表演性，讽刺家庭与知识分子生活中的自恋和虚假。"}},{"stage":"后","point":"儿子婚后，方遯翁仍以家长身份安排媳妇角色，用家庭秩序阻止孙柔嘉保有独立工作。","evidence":"“我有句话劝你。做事固然很好，不过夫妇俩同在外面做事，‘家无主，扫帚倒竖’，乱七八糟，家庭就有名无实了。我并不是顽固的人，我总觉得女人的责任是管家。”","location":"第九章：孙柔嘉第一次正式到方家，方遯翁当面劝她不要外出做事。","explain":"方遯翁先承认女性工作并非坏事，随后又借家庭秩序和性别分工否定共同工作的可能。这种表达保留开明姿态，实际仍要求媳妇服从夫家秩序。家庭体面因此建立在女性放弃职业自主的基础上，方鸿渐和孙柔嘉的婚姻冲突也被父权观念进一步放大。","link":"结尾让家庭旧伦理直接进入婚姻矛盾，说明围城不只来自夫妻性格，也来自更传统的家庭权力结构。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第九章","se 活的能力。","link":"前段建立母爱的具体温度，也埋下母亲包办生活继续干预成年婚姻的伏笔。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第二章","searchPhrase":"我想你在外国四年真可怜","pdfPage":"","chain":{"who":"方鸿渐及相关人物","action":"方老太太对儿子的关怀集中于吃穿和身体照料，表现真挚母爱，也显示她理解亲子关系的主要方式是生活包办。","reason":"她把儿子的生活需要长期视为自己的责任，也从照料中获得母亲价值","consequence":"前段建立母爱的具体温度，也埋下母亲包办生活继续干预成年婚姻的伏笔。"}},{"stage":"中","point":"面对儿子的自由婚姻，方老太太首先要求父母知情权，并以地域偏见判断未来媳妇是否适合家庭。","evidence":"“方老太太尤其怪儿子冒失，怎么不先征求父母同意就订婚了。”“她是不是外省人？外省人的脾气总带点儿蛮，跟咱们合不来的。”","location":"第九章：方鸿渐来信报告与孙柔嘉订婚，方家父母在饭前关门研究此事。","explain":"方老太太把成年儿子的婚姻视为必须由父母批准的家庭事务，又把地域差异解释成品性不合。她关心的不只是儿子是否幸福，还包括媳妇能否服从既有家庭习惯。传统母亲身份因此与地域偏见、家庭边界和面子观念结合，孙柔嘉还未见面便已被置于审视位置。母爱的占有性由此转化成婆媳结构中的防备，为后续冲突提供条件。","link":"中段说明母爱的占有性会转化成婆媳结构中的防备，为后续冲突提供条件。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第九章","searchPhrase":"怎么不先征求父母同意","pdfPage":"","chain":{"who":"方鸿渐与孙柔嘉","action":"面对儿子的自由婚姻，方老太太首先要求父母知情权，并以地域偏见判断未来媳妇是否适合家庭。","reason":"方老太太把成年儿子的婚姻视为必须由父母批准的家庭事务，又把地域差异解释成品性不合","consequence":"中段说明母爱的占有性会转化成婆媳结构中的防备，为后续冲突提供条件。"}},{"stage":"后","point":"婚后相处中，方老太太用照顾儿子的话题批评媳妇忙碌，继续以母亲身份争夺对儿子生活的支配权。","evidence":"“你近来瘦了，脸上一点不滋润。在家里吃些什么东西？柔嘉做事忙，没工夫当心你，你为什么不到这儿来吃饭？”","location":"第九章：方鸿渐和孙柔嘉回方家吃饭，方老太太当众质问儿子饮食，并把责任推给孙柔嘉。","explain":"方老太太用关心身体的方式指出媳妇失职，又把家中饭菜和母爱记忆作为比较标准。孙柔嘉的职业和独立生活因此被解释为对丈夫照顾不周，婆媳关系成为家庭权力竞争。母爱若不能退出成年儿子的婚姻边界，就会持续制造压力和疏离。","link":"结尾显示方老太太既是慈母也是传统家庭秩序的维护者，她放大了方鸿渐婚姻中的围城感。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第九章","searchPhrase":"柔嘉做事忙，没工夫当心你","pdfPage":"","chain":{"who":"方鸿渐及相关人物","action":"婚后相处中，方老太太用照顾儿子的话题批评媳妇忙碌，继续以母亲身份争夺对儿子生活的支配权。","reason":"方老太太用关心身体的方式指出媳妇失职，又把家中饭菜和母爱记忆作为比较标准","consequence":"结尾显示方老太太既是慈母也是传统家庭秩序的维护者，她放大了方鸿渐婚姻中的围城感。"}}],"traps":["只写方老太太慈爱，不分析母爱中的占有和家庭控制。","把婆媳矛盾全部归罪于孙柔嘉，忽略方老太太的等级观念。","只写她照顾饮食，不联系地域偏见和对职业女性的否定。"],"learningLevel":"teacher-extension","studyPriority":"拓展","parentQuestionId":"fortress-marriage","doNotMemorizeSeparately":true,"questionFocus":"这题要写“方老太太的溺爱与婆媳压力”的关键性格怎样影响具体选择和后果，不能只列性格词。","socraticQuestions":["题干要求你始终分析的主体是谁？","第一段的核心判断在文本中由什么行动 身体与婚姻换取机会，苏文纨用学历和身价控制追求者，唐晓芙坚守纯爱理想，孙柔嘉以主见和现实计算争取婚姻安全，汪太太则把性别与婚姻转化为幕后支配力。她们都试图掌握选择权，又都受到男性中心秩序限制。","points":[{"stage":"前","point":"早期新女性把教育与婚恋选择结合起来，用现代身份争取机会，同时仍把男性和婚姻视为上升渠道。","evidence":"“她宁可跟一个比自己年龄长十二岁的人订婚，有机会出洋。”“那时候苏小姐把自己的爱情看得太名贵了，不肯随便施与。”","location":"第一章：鲍小姐与苏文纨同船回国，两人的婚恋选择与留学经历同时进入叙述。","explain":"鲍小姐用订婚换取出国和改变生活的机会，说明她懂得利用婚姻制度，却没有完全获得自主。苏文纨把爱情看成稀缺而有身价的赠予，希望通过男性追求确证优越地位。两人都受过现代教育，也都把婚恋与身份利益联系在一起，新女性的自主诉求由此从一开始就带着功利和妥协。","link":"鲍小姐与苏文纨呈现新女性的策略型婚恋，唐晓芙与孙柔嘉则把这种差异推进到理想和现实两种选择。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第一章","searchPhrase":"有机会出洋","pdfPage":"","chain":{"who":"方鸿渐与孙柔嘉","action":"早期新女性把教育与婚恋选择结合起来，用现代身份争取机会，同时仍把男性和婚姻视为上升渠道。","reason":"鲍小姐用订婚换取出国和改变生活的机会，说明她懂得利用婚姻制度，却没有完全获得自主","consequence":"鲍小姐与苏文纨呈现新女性的策略型婚恋，唐晓芙与孙柔嘉则把这种差异推进到理想和现实两种选择。"}},{"stage":"中","point":"唐晓芙与孙柔嘉分别代表理想化和现实化的新女性道路，前者要求爱情绝对纯洁，后者用主见维护婚姻中的现实安全。","evidence":"“自己决不会爱方鸿渐，爱是又曲折又伟大的情感，决非那么轻易简单。”“鸿渐最初以为她只是个女孩子，事事要请教自己；订婚以后，他渐渐发现她不但很有主见，而且主见很牢固。”","location":"第三章至第八章：唐晓芙与方鸿渐在恋爱阶段往来，孙柔嘉则从恋爱进入订婚并与方鸿渐共同面对职业问题。","explain":"唐晓芙用理想标准审视爱情，拒绝接受方鸿渐复杂的过去；孙柔嘉更重视职位、收入和婚姻稳定，主动干预现实选择。两人都坚持自己的判断，却把主体性分别投向精神纯度和生活控制。唐晓芙的不可让步与孙柔嘉的现实算计，共同说明新女性的自主意识会因处境和能力不同而走向不同结果。","link":"唐晓芙和孙柔嘉的差异说明自主意识不等于统一人格，汪太太则进一步揭示新女性如何进入男性权力规则内部。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第三章","searchPhrase":"爱是又曲折又伟大的情感","pdfPage":"","chain":{"who":"唐晓芙","action":"唐晓芙与孙柔嘉分别代表理想化和现实化的新女性道路，前者要求爱情绝对纯洁，后者用主见维护婚姻中的现实安全。","reason":"唐晓芙用理想标准审视爱情，拒绝接受方鸿渐复杂的过去","consequence":"唐晓芙和孙柔嘉的差异说明自主意识不等于统一人格，汪太太则进一步揭示新女性如何进入男性权力规则内部。"}},{"stage":"后","point":"汪太太主动学习和运用男性中心秩序中的性别权力，她的幕后支配显示新女性的聪明反抗，也显示这种反抗仍受婚姻身份限制。","evidence":"“汪太太是聪明人，一口拒绝。一来她自知资格不好，至多做个小职员，有伤体面。二来她知道这是男人的世界，女权那样发达的国家像英美，还只请男人去当上帝，只说He，不说She。女人出来做事，无论地位怎么高，还是给男人利用，只有不出面躲在幕后，可以用太太或情妇的资格来指使和摆布男人。”","location":"第七章：高松年邀请汪太太到学校做事，她拒绝公开任职，却在私人关系中影响赵辛楣、高松年和丈夫。","explain":"汪太太看见职场仍由男性掌控，于是选择放弃公开职位，利用容貌、智力和妻子身份操纵男性的欲望与竞争。她比苏文纨更成熟，也更清楚社会的性别规则，能够主动利用规则维护自身影响。代价是她仍须躲在婚姻和暧昧关系背后，不能建立独立平等的公共位置。","link":"汪太太说明新女性能够在旧秩序中争夺主动，但个人策略无法自动改变造成束缚的社会结构。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第七章","searchPhrase":"可以用太太或情妇的资格","pdfPage":"","chain":{"who":"方鸿渐与孙柔嘉","action":"汪太太主动学习和运用男性中心秩序中的性别权力，她的幕后支配显示新女性的聪明反抗，也显示这种反抗仍受婚姻身份限制。","reason":"她比苏文纨更成熟，也更清楚社会的性别规则，能够主动利用规则维护自身影响","consequence":"汪太太说明新女性能够在旧秩序中争夺主动，但个人策略无法自动改变造成束缚的社会结构。"}}],"traps":["把所有新女性写成追求自由的正面人物，忽略婚恋计算、控制和相互竞争。","只分别介绍五个人物，不比较她们在自主意识和现实限制上的共同问题。","把汪太太简单写成不守妇道的坏女人，忽略她对社会性别规则的清醒判断。"],"learningLevel":"teacher-extension","studyPriority":"拓展","parentQuestionId":"fortress-tang-relationship","doNotMemorizeSeparately":true,"questionFocus":"这题要比较鲍小姐、苏文纨、唐晓芙、孙柔嘉和汪太太的选择，并说明女性自主与限制。","socraticQuestions":["这些女性为什么都以不同方式争夺婚恋选择权？","她们的选择为什么同时包含自主和功利？","男性中心秩序怎样限制她们的公共位置？"],"notAsking":["不要用“好女性／坏女性”分类。","不要只列人物性格。","不要遗漏她们的社会限制。"],"threePartPlan":[{"step":"第一段","focus":"早期新女性把教育与婚恋选择结合起来，用现代身份争取机会，同时仍把男性和婚姻视为上升渠道。","useFromCore":"调用《苏文纨的挑拨与感情破裂》主体段 1","miniSentence":"首先，早期新女性把教育与婚恋选择结合起来，用现代身份争取机会，同时仍把男性和婚姻视为上"},{"step":"第二段","focus":"唐晓芙与孙柔嘉分别代表理想化和现实化的新女性道路，前者要求爱情绝对纯洁，后者用主见维护婚姻中的现实安全。","useFromCore":"调用《苏文纨的挑拨与感情破裂》主体段 2","miniSentence":"其次，唐晓芙与孙柔嘉分别代表理想化和现实化的新女性道路，前者要求爱情绝对纯洁，后者用主"},{"step":"第三段","focus":"汪太太主动学习和运用男性中心秩序中的性别权力，她的幕后支配显示新女性的聪明反抗，也显示这种反抗仍受婚姻身份限制。","useFromCore":"调用《苏文纨的挑拨与感情破裂》主体段 3","miniSentence":"最后，汪太太主动学习和运用男性中心秩序中的性别权力，她的幕后支配显示新女性的聪明反抗，"}],"commonMistakes":[{"mistake":"答案没有中心判断。","why":"三段像知识拼盘。","fix":"先用 thesis 统一三段。"},{"mistake":"只有结论，没有因果。","why":"无法形成文学论证。","fix":"每段补齐行动、原因和后果。"}],"summary":"新女性群像：自主、功利与困境：抓主体、变化与后果。","studentNote":"教师拓展题：比较五位女性，不要用“纯洁”或“心机”作道德标签。","needsManualReview":true},{"id":"fortress-old-women-choices","work":"《围城》","workKey":"fortress","type":"人物群像","title":"旧式女性与方鸿渐的婚恋选择","prompt":"结合周小姐、周太太、方老太太等人物，分析旧式家庭和婚姻关系如何影响方鸿渐的婚恋选择。","keywords":["旧式女性","周小姐","周太太","方老太太","旧婚约","婚姻制度"],"thesis":"周小姐、周太太和方老太太分别体现包办婚约中的失语者、掌握金钱和长辈权威的城市妇人，以及把家庭照顾转化为婆媳控制的传统母亲。方鸿渐反对旧式婚配，却长期依赖周家和方家，他既不能接受旧女性角色，也无法真正适应孙柔嘉代表的新女性自主。","points":[{"stage":"前","point":"在包办婚约中，女性首先被安排为家庭交换关系的未婚妻，个人性格和意愿没有进入婚姻视野。","evidence":"“未婚妻并没见面，只瞻仰过一张半身照相，也漠不关心。”“想起未婚妻高中读了一年书，便不进学校，在家实习家务，等嫁过来做能干媳妇，不由自主地对她厌恨。”","location":"第一章：方鸿渐高中时由双方家庭作主与周小姐订婚，后来在大学写信要求解除婚约。","explain":"周小姐在小说中从未以完整人物出现，方鸿渐认识她只靠一张照片。他反对婚约的原因既包括对方被培养成传统媳妇，也包括自己被排除在婚姻决定之外。周小姐因此成为旧婚姻中的沉默符号，代表女性在家庭安排里没有选择权。","link":"周小姐体现旧婚约对女性的隐形和对象化，周太太则显示旧式权威如何由经济资源获得力量。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第一章","searchPhrase":"未婚妻并没见面","pdfPage":"","chain":{"who":"方鸿渐与孙柔嘉","action":"在包办婚约中，女性首先被安排为家庭交换关系的未婚妻，个人性格和意愿没有进入婚姻视野。","reason":"周小姐因此成为旧婚姻中的沉默符号，代表女性在家庭安排里没有选择权","consequence":"周小姐体现旧婚约对女性的隐形和对象化，周太太则显示旧式权威如何由经济资源获得力量。"}},{"stage":"中","point":"周太太以资助者和长辈身份行使旧式权威，金钱、住房、职业和报恩关系都被用来规训方鸿渐。","evidence":"“现在他吃我周家的饭，住周家的房子，赚我周家的钱，瞒了我外面去胡闹，一早出门，也不来请安，目无尊长，成什么规矩！”","location":"第四章：方鸿渐失恋后仍住在周家、在点金银行工作，周太太因其私人生活失控而严厉指责他。","explain":"周太太把周家提供的教育和职业机会视为要求顺从的债权，方鸿渐的私人选择因此被解释成忘恩和失礼。她不同于完全受家庭支配的周小姐，而是借助财富和长辈身份掌握实际权力。旧式女性角色与家庭权力互相支持，方鸿渐也因经济依赖无法真正摆脱控制。","link":"周太太说明旧秩序可以通过金钱和人情继续支配成年子女，方老太太则把这种秩序延伸进婚姻内部。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第四章","searchPhrase":"现在他吃我周家的饭","pdfPage":"","chain":{"who":"方鸿渐","action":"周太太以资助者和长辈身份行使旧式权威，金钱、住房、职业和报恩关系都被用来规训方鸿渐。","reason":"旧式女性角色与家庭权力互相支持，方鸿渐也因经济依赖无法真正摆脱控制","consequence":"周太太说明旧秩序可以通过金钱和人情继续支配成年子女，方老太太则把这种秩序延伸进婚姻内部。"}},{"stage":"后","point":"方老太太维护父母决定婚姻和媳妇服务夫家的传统规范，说明旧式女性也会在成为婆婆后复制家庭等级。","evidence":"“方老太太尤其怪儿子冒失，怎么不先征求父母同意就订婚了。”“你近来瘦了，脸上一点不滋润。在家里吃些什么东西？柔嘉做事忙，没工夫当心你，你为什么不到这儿来吃饭？”","location":"第九章：方鸿渐与孙柔嘉订婚后，方老太太责怪儿子未经父母同意；婚后她又用照顾儿子的话题批评孙柔嘉。","explain":"方老太太把婚姻视为家庭共同决定的事务，因此无法接受儿子的自由选择。婚后她又以母亲身份衡量媳妇是否尽责，把职业忙碌解释为照顾丈夫不周。她的关心真实存在，却与旧家庭权威结合，持续挤压孙柔嘉的独立空间。方鸿渐既拒绝旧式安排，又依赖家庭支持和母亲照顾，最终也无法承受新女性的独立，婚恋困境由此形成。","link":"三种女性形象连接家庭、金钱和婆媳权力，说明方鸿渐的婚恋困境来自个人依赖和旧制度的共同作用。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第九章","searchPhrase":"怎么不先征求父母同意","pdfPage":"","chain":{"who":"方鸿渐与孙柔嘉","action":"方老太太维护父母决定婚姻和媳妇服务夫家的传统规范，说明旧式女性也会在成为婆婆后复制家庭等级。","reason":"方老太太把婚姻视为家庭共同决定的事务，因此无法接受儿子的自由选择","consequence":"三种女性形象连接家庭、金钱和婆媳权力，说明方鸿渐的婚恋困境来自个人依赖和旧制度的共同作用。"}}],"traps":["只写旧女性落后，不分析婚约、金钱和家庭制度怎样塑造她们。","遗漏周小姐，无法完整体现方鸿渐最初对旧式婚配的拒绝。","把方鸿渐婚后的失败全部归咎于孙柔嘉，忽略他依赖旧家庭又追求新关系。"],"learningLevel":"teacher-extension","studyPriority":"拓展","parentQuestionId":"fortress-marriage","doNotMemorizeSeparately":true,"questionFocus":"这题要用周小姐、周太太、方老太太说明旧式家庭和婚姻关系如何影响方鸿渐的选择。","socraticQuestions":["周小姐为什么几乎没有自己的声音？","周太太为什么能用金钱和人情支配方鸿渐？","方老太太怎样把母爱变成婆媳压力？"],"notAsking":["不要把这些女性简单写成落后和坏。","不要只写婆媳矛盾。","不要忽略方鸿渐的经济依赖。"],"threePartPlan":[{"step":"第一段","focus":"在包办婚约中，女性首先被安排为家庭交换关系的未婚妻，个人性格和意愿没有进入婚姻视野。","useFromCore":"调用《婚姻围城》主体段 1","miniSentence":"首先，在包办婚约中，女性首先被安排为家庭交换关系的未婚妻，个人性格和意愿没有进入婚姻视"},{"step":"第二段","focus":"周太太以资助者和长辈身份行使旧式权威，金钱、住房、职业和报恩关系都被用来规训方鸿渐。","useFromCore":"调用《婚姻围城》主体段 2","miniSentence":"其次，周太太以资助者和长辈身份行使旧式权威，金钱、住房、职业和报恩关系都被用来规训方鸿"},{"step":"第三段","focus":"方老太太维护父母决定婚姻和媳妇服务夫家的传统规范，说明旧式女性也会在成为婆婆后复制家庭等级。","useFromCore":"调用《婚姻围城》主体段 3","miniSentence":"最后，方老太太维护父母决定婚姻和媳妇服务夫家的传统规范，说明旧式女性也会在成为婆婆后复"}],"commonMistakes":[{"mistake":"答案没有中心判断。","why":"三段像知识拼盘。","fix":"先用 thesis 统一三段。"},{"mistake":"只有结论，没有因果。","why":"无法形成文学论证。","fix":"每段补齐行动、原因和后果。"}],"summary":"旧式女性与方鸿渐的婚恋选择：抓主体、变化与后果。","studentNote":"教师拓展题：人物、家庭和婚恋结构同时涉及，不作为普通学生的必背题。","needsManualReview":true},{"id":"fortress-education-system-satire","work":"《围城》","workKey":"fortress","type":"主题思想","title":"战时高等教育制度的乱象","prompt":"分析《围城》如何批判战时高等教育制度的乱象，并说明这种批判的讽刺意义。","keywords":["教育制度","假文凭","聘约","派系","导师制","抗日战争"],"thesis":"《围城》的战时大学批判直指制度失灵：文凭能够买卖，聘约可以被校长失信，职位依靠派系和先手，导师制又变成控制学生和交换利益的手段。国家危难本应促使知识分子合作救亡，校园中的人却忙于权力、身份和私利，教育的公共使命因此被讽刺性掏空。","points":[{"stage":"前","point":"学历制度失去真实性，文凭成为进入知识界和维持社会体面的交易凭证。","evidence":"“自己买张假文凭回去哄人，岂非也成了骗子？”“韩学愈撒他的谎，并非跟自己同谋，但有了他，似乎自己的欺骗减轻了罪名。”","location":"第一章与第六章：方鸿渐购买克莱登大学文凭，到三闾大学后又发现韩学愈使用同样学历。","explain":"方鸿渐和韩学愈都需要学位证明自己的留学价值，购买文凭比完成真实研究更省力。两人又因为彼此都造假而产生安慰，证明虚假学历能够形成群体默契。学校如果没有能力核验学历，头衔就会取代知识能力，教育评价从第一道门槛开始失真。","link":"学历失真使身份可以购买，聘任制度则让职位可以随权力和派系而改变。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第一章","searchPhrase":"自己买张假文凭","pdfPage":"","chain":{"who":"方鸿渐及相关人物","action":"学历制度失去真实性，文凭成为进入知识界和维持社会体面的交易凭证。","reason":"方鸿渐和韩学愈都需要学位证明自己的留学价值，购买文凭比完成真实研究更省力","consequence":"学历失真使身份可以购买，聘任制度则让职位可以随权力和派系而改变。"}},{"stage":"中","point":"聘约和职位不服从公开规则，行政权力与派系先手可以直接改变教师的职业命运。","evidence":"“鸿渐只好第二次声明没收到信，同时觉得降级为副教授已经天恩高厚了。”“原来，今天欢迎会是汪处厚安排好的，兵法上有名的‘敌人喘息未定，即予以迎头痛击’。”","location":"第六章：高松年取消方鸿渐的教授承诺，汪处厚又提前组织欢迎会争夺中国文学系主任职位。","explain":"高松年可以用一封“没收到”的信否认承诺，汪处厚则通过关系网络和欢迎仪式抢占职位。一个依靠校长权力，一个依靠派系先手，共同证明聘约和程序没有稳定效力。教师无法凭能力预期职业前景，只能依赖或服从掌权者，大学人事因此变成权力游戏。","link":"人事制度变成权力游戏后，导师制也被用来制造个人忠诚，而不是促进教育与学术。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第六章","searchPhrase":"降级为副教授已经天恩高厚","pdfPage":"","chain":{"who":"三闾大学知识分子群体","action":"聘约和职位不服从公开规则，行政权力与派系先手可以直接改变教师的职业命运。","reason":"一个依靠校长权力，一个依靠派系先手，共同证明聘约和程序没有稳定效力","consequence":"人事制度变成权力游戏后，导师制也被用来制造个人忠诚，而不是促进教育与学术。"}},{"stage":"后","point":"导师制在实施中失去教育功能，转化为行政控制、责任转嫁和私人恩惠。","evidence":"“他叫这学生到自己卧房里密切训导了半天，告诉他怎样人人要开除他，汪处厚毫无办法，全亏自己保全，那学生红着眼圈感谢。”“导师制变成这么一个东西。从前明成祖诛方孝孺十族，听说方孝孺的先生都牵连杀掉的。将来还有人敢教书么？”","location":"第七章：李梅亭借训导学生建立个人恩情，教育部导师规程又让教师为学生未来的社会行为承担责任。","explain":"李梅亭没有真正解决学生行为问题，而是通过秘密谈话制造被拯救的错觉，让学生感激自己。制度又要求导师为学生毕业后的行为连带负责，使教师承担无限责任却缺少实际教育条件。管理变成控制，教育关系变成恩情和风险，知识分子无法把精力投入共同的学术和社会责任。","link":"学历、聘约和导师制三层问题共同指向教育制度失灵，使抗战时期大学背离培育人才和承担国家责任的目标。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第七章","searchPhrase":"导师制变成这么一个东西","pdfPage":"","chain":{"who":"方鸿渐及相关人物","action":"导师制在实施中失去教育功能，转化为行政控制、责任转嫁和私人恩惠。","reason":"李梅亭没有真正解决学生行为问题，而是通过秘密谈话制造被拯救的错觉，让学生感激自己","consequence":"学历、聘约和导师制三层问题共同指向教育制度失灵，使抗战时期大学背离培育人才和承担国家责任的目标。"}}],"traps":["只写个别教师道德败坏，不分析学历、聘约和导师制度怎样持续制造问题。","只把它当校园笑话，不联系抗日战争背景下知识分子本应承担的救亡责任。","把所有弊端都归给高松年，忽略派系、教师群体和制度执行者的共同作用。"],"learningLevel":"core","studyPriority":"必背","parentQuestionId":null,"doNotMemorizeSeparately":false,"questionFocus":"这题要说明作品通过哪些人物和情节表现“战时高等教育制度的乱象”，每段形成因果推进。","socraticQuestions":["题干要求你始终分析的主体是谁？","第一段的核心判断在文本中由什么行动支持？","三段怎样共同回答题干，而不是各讲一个知识点？"],"notAsking":["不要只复述情节。","不要把主题写成空泛口号。"],"threePartPlan":[{"step":"第一段","focus":"学历制度失去真实性，文凭成为进入知识界和维持社会体面的交易凭证。","useFromCore":"本题核心 Point 1","miniSentence":"首先，学历制度失去真实性，文凭成为进入知识界和维持社会体面的交易凭证"},{"step":"第二段","focus":"聘约和职位不服从公开规则，行政权力与派系先手可以直接改变教师的职业命运。","useFromCore":"本题核心 Point 2","miniSentence":"其次，聘约和职位不服从公开规则，行政权力与派系先手可以直接改变教师的职业命运"},{"step":"第三段","focus":"导师制在实施中失去教育功能，转化为行政控制、责任转嫁和私人恩惠。","useFromCore":"本题核心 Point 3","miniSentence":"最后，导师制在实施中失去教育功能，转化为行政控制、责任转嫁和私人恩惠"}],"commonMistakes":[{"mistake":"只复述情节。","why":"没有说明主题怎样形成。","fix":"写人物行动、原因和主题后果。"},{"mistake":"用抽象口号代替分析。","why":"缺少原文支撑。","fix":"每个观点配具体情节。"}],"summary":"战时高等教育制度的乱象：抓主体、变化与后果。","studentNote":"先背这一题，再练同一母题下的变式。","needsManualReview":false},{"id":"fortress-zhao-sun-view","work":"《围城》","workKey":"fortress","type":"人物关系","title":"赵辛楣对孙柔嘉的看法","prompt":"赵辛楣对孙柔嘉有哪些看法？请举例分析。","keywords":["赵辛楣","孙柔嘉","保护","心机","第三者","看法变化"],"thesis":"赵辛楣最初因受孙父委托而保护孙柔嘉，把她看作需要照顾的年轻晚辈；旅途中逐渐察觉她善于装作无知，评价转为警惕和“刁滑”；到方鸿渐订婚、结婚后，他又以旁观者身份认为孙柔嘉很有心计，同时受朋友关系限制，只能以玩笑和提醒表达。","points":[{"stage":"前","point":"赵辛楣最初把孙柔嘉看作受父亲委托、需要自己保护的年轻晚辈。","evidence":"“孙小姐，你爸爸把你交给我的，我要强迫你回舱了，别着了凉——”“辛楣自从船上那一夜以后，对孙小姐疏远得很。这时候，他深恐济危扶困，做‘叔叔’的责无旁贷，这侠骨柔肠的好差使让给鸿渐罢。”","location":"第五章：众人乘船前往内地，孙柔嘉父亲曾把她托付给赵辛楣，旅途中赵辛楣承担保护责任。","explain":"赵辛楣与孙柔嘉不是普通男女关系，而是“赵叔叔”和晚辈的受托关系。他关心她的身体和安全，也主动与她的课业、住宿和旅途安全保持距离，以免造成流言。责任感和避嫌意识同时存在，构成他最初看法的核心。这样的保护者身份，为后文态度转向警惕形成了清楚的前后落差。","link":"前段先建立保护者身份，后文他对孙柔嘉的心机判断才会形成明显转折。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第五章","searchPhrase":"你爸爸把你交给我的","pdfPage":"","chain":{"who":"赵辛楣","action":"赵辛楣最初把孙柔嘉看作受父亲委托、需要自己保护的年轻晚辈。","reason":"这样的保护者身份，为后文态度转向警惕形成了清楚的前后落差","consequence":"前段先建立保护者身份，后文他对孙柔嘉的心机判断才会形成明显转折。"}},{"stage":"中","point":"旅途中，赵辛楣发现孙柔嘉会利用貌似幼稚的举止推动关系，对她的看法从保护转为警惕。","evidence":"“你这人没良心！方才我旁观者看得清清楚楚，孙小姐——唉！这女孩子刁滑得很，我带她来，上了大当——孙小姐就像那条鲸鱼，张开了口，你这糊涂虫就像送上门去的那条船。”","location":"第五章：孙柔嘉在船上向方鸿渐示弱，赵辛楣从旁观察，认为她并非完全无知被动。","explain":"赵辛楣看见孙柔嘉的安静和求助并非单纯天真，而是能够影响方鸿渐判断的社交策略。他开始把她看成有目的的选择者，也担心方鸿渐会陷入被动。评价由保护转为警惕，但赵辛楣仍处于旁观位置，没有正式干涉。这说明他能够识破表面柔弱，并由此形成后来“孙柔嘉有深心”的判断。","link":"中段说明赵辛楣能够识破表面柔弱，这为他在婚姻阶段评价孙柔嘉“有深心”提供依据。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第五章","searchPhrase":"这女孩子刁滑得很","pdfPage":"","chain":{"who":"赵辛楣","action":"旅途中，赵辛楣发现孙柔嘉会利用貌似幼稚的举止推动关系，对她的看法从保护转为警惕。","reason":"评价由保护转为警惕，但赵辛楣仍处于旁观位置，没有正式干涉","consequence":"中段说明赵辛楣能够识破表面柔弱，这为他在婚姻阶段评价孙柔嘉“有深心”提供依据。"}},{"stage":"后","point":"方鸿渐订婚后，赵辛楣把孙柔嘉看成精心争取婚姻、能够控制丈夫的人，并以“第三者”身份提醒方鸿渐。","evidence":"“我不是跟你讲过，孙小姐这人很深心么？你们这一次，照我第三者看起来，她煞费苦心——”","location":"第九章：方鸿渐与孙柔嘉在香港与赵辛楣会面，赵辛楣谈到自己如何看这段婚姻。","explain":"赵辛楣从外部观察两人的相处，认为孙柔嘉主动设计并推动婚姻，方鸿渐则缺少判断。他掌握一些方鸿渐未看清的信息，却因为朋友已经结婚而主动收回批评，说成酒后胡话。关心、保留和人际分寸共同限制了他表达真实看法的程度。","link":"结尾表明赵辛楣对孙柔嘉的评价包含警惕和关怀，他的旁观位置也反衬方鸿渐在婚姻中的被动。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第九章","searchPhrase":"她煞费苦心","pdfPage":"","chain":{"who":"方鸿渐","action":"方鸿渐订婚后，赵辛楣把孙柔嘉看成精心争取婚姻、能够控制丈夫的人，并以“第三者”身份提醒方鸿渐。","reason":"赵辛楣从外部观察两人的相处，认为孙柔嘉主动设计并推动婚姻，方鸿渐则缺少判断","consequence":"结尾表明赵辛楣对孙柔嘉的评价包含警惕和关怀，他的旁观位置也反衬方鸿渐在婚姻中的被动。"}}],"traps":["只写赵辛楣批评孙柔嘉，忽略他受孙父委托的保护责任。","只写赵辛楣和方鸿渐的友情，没有回答他对孙柔嘉的看法如何变化。","把赵辛楣的判断写成事实，不区分他的旁观者视角和有限信息。"],"learningLevel":"variation","studyPriority":"高频变式","parentQuestionId":"fortress-sun-character","doNotMemorizeSeparately":true,"questionFocus":"这题要写赵辛楣怎样看孙柔嘉，观察主体始终是赵辛楣，不是孙柔嘉的人物传记。","socraticQuestions":["赵辛楣最初为什么照顾孙柔嘉，又为什么刻意保持距离？","他怎样发现孙柔嘉表面柔弱背后的主动和心思？","为什么订婚后他只暗示提醒，没有直接干预方鸿渐的婚姻？"],"notAsking":["不是介绍孙柔嘉性格。","不要写方鸿渐对孙柔嘉的看法。","不要把旁观者判断写成客观事实。"],"threePartPlan":[{"step":"第一段","focus":"赵辛楣最初把孙柔嘉看作受父亲委托、需要自己保护的年轻晚辈。","useFromCore":"调用《孙柔嘉的外柔内刚》主体段 1","miniSentence":"首先，赵辛楣最初把孙柔嘉看作受父亲委托、需要自己保护的年轻晚辈"},{"step":"第二段","focus":"旅途中，赵辛楣发现孙柔嘉会利用貌似幼稚的举止推动关系，对她的看法从保护转为警惕。","useFromCore":"调用《孙柔嘉的外柔内刚》主体段 2","miniSentence":"其次，旅途中，赵辛楣发现孙柔嘉会利用貌似幼稚的举止推动关系，对她的看法从保护转为警惕"},{"step":"第三段","focus":"方鸿渐订婚后，赵辛楣把孙柔嘉看成精心争取婚姻、能够控制丈夫的人，并以“第三者”身份提醒方鸿渐。","useFromCore":"调用《孙柔嘉的外柔内刚》主体段 3","miniSentence":"最后，方鸿渐订婚后，赵辛楣把孙柔嘉看成精心争取婚姻、能够控制丈夫的人，并以“第三者”身"}],"commonMistakes":[{"mistake":"只写两个人的性格。","why":"没有回答关系怎样变化。","fix":"写互动、态度变化和结果。"},{"mistake":"观察主体中途更换。","why":"答案会偏离题干。","fix":"每段先标清是谁对谁的看法。"}],"summary":"赵辛楣对孙柔嘉的看法：抓主体、变化与后果。","studentNote":"每一段开头都必须是赵辛楣，写他为什么这样看、看到了什么。","needsManualReview":false},{"id":"fortress-gao-fang-attitude","work":"《围城》","workKey":"fortress","type":"人物关系","title":"高松年对方鸿渐的态度变化","prompt":"请通过高松年对方鸿渐所持态度的变化来分析高松年这个人物。","keywords":["高松年","方鸿渐","态度变化","聘任","控制","解聘"],"thesis":"高松年对方鸿渐的态度始终服从自己的管理利益：学校缺教师时，他用教授职位招揽方鸿渐；方鸿渐到校后，他认定对方容易控制，便违背聘约改聘副教授；出现所谓思想问题时，他又迅速解聘并切割风险。这三次变化集中暴露高松年如何利用职位、制度和信息维护权力。","points":[{"stage":"前","point":"学校缺教师时，高松年用教授职位、薪金和路费招揽方鸿渐。","evidence":"“敬聘为教捋月薪三百四十元酌送路费盼电霸国立三闾大学校长高松年。”","location":"第四章：方鸿渐收到高松年从平成发来的电报，聘请他赴三闾大学任教。","explain":"学校新办、教师难聘，高松年需要尽快补充师资。方鸿渐由赵辛楣介绍，拥有留学经历，因此被作为可以招来的教授人选。电报中的职位、薪金和路费都围绕学校招人需要设置，这次招揽因此建立在现实利益上。高松年此时主动承诺教授职位，也建立起方鸿渐对聘约的信赖，为后文突然降级形成明显反差。","link":"招聘阶段的承诺建立关系，方鸿渐到校后的权力处境却完全不同。","page":"","edition":"人民文学出版社软皮版","chapter":"第四章","searchPhrase":"敬聘为教捋月薪三百四十元","pdfPage":"","subject":"高松年","chain":{"who":"高松年","action":"用教授职位、薪金和路费招揽方鸿渐","reason":"新办学校缺少教师，需要尽快补充师资","consequence":"方鸿渐接受聘约并形成信赖，为后文降级埋下反差"}},{"stage":"中","point":"方鸿渐到校后，高松年认定他容易控制，违背原聘约并改聘副教授。","evidence":"“这姓方的青年人是容易对付的。”“聘他当教授太冤枉了！至多做副教授，循序渐升，年轻人做事不应该爬得太高，这话可以叫辛楣对他说。”","location":"第六章：方鸿渐到三闾大学报到，高松年在办公室盘算如何解释教授改副教授。","explain":"高松年先判断方鸿渐容易对付，再用学历、专业和年龄为自己的降级决定寻找理由。原聘承诺因此被行政意志推翻，教师是否容易控制取代了公开资格和专业评价。校长的行政决定直接改变方鸿渐的职位和收入，也暴露高松年只维护学校管理便利。高松年对方鸿渐的态度从主动招揽转为强势压制。","link":"降级说明高松年敢于对弱势教师背信，最后一段则表现他面对政治风险时的迅速切割。","page":"","edition":"人民文学出版社软皮版","chapter":"第六章","searchPhrase":"这姓方的青年人是容易对付的","pdfPage":"","subject":"高松年","chain":{"who":"高松年","action":"违背原聘约，把方鸿渐改聘为副教授","reason":"认定方鸿渐容易控制，并希望压低其职位","consequence":"校长权力推翻公开承诺，方鸿渐进入被动受压的职位"}},{"stage":"后","point":"出现所谓思想问题时，高松年立即取消续聘并切割风险。","evidence":"“我本来要升他一级，谁知道他思想有问题，下学期只能解聘。这个人倒是可造之才，可惜！可惜！”","location":"第八章：陆子潇发现方鸿渐房中有共产主义书籍，李梅亭书面报告，高松年决定不再聘用方鸿渐。","explain":"高松年没有调查书籍来源，也没有给予充分申辩机会，而是把报告直接转化为解聘理由。他先说原本准备升职，再将责任推给思想风险，保留自己惜才公正的形象。取消续聘不仅切断方鸿渐的职业出路，也把政治和管理风险从学校转嫁给个人。高松年对方鸿渐的态度最终由自身安全和管理利益决定。","link":"招揽、降级和解聘三次变化共同说明高松年始终按自身权力需要处理方鸿渐。","page":"","edition":"人民文学出版社软皮版","chapter":"第八章","searchPhrase":"下学期只能解聘","pdfPage":"","subject":"高松年","chain":{"who":"高松年","action":"取消方鸿渐的续聘并切割风险","reason":"书籍和报告被解释成思想问题，威胁学校管理安全","consequence":"方鸿渐失去职位，高松年把风险转嫁给个人并保住自身形象"}}],"traps":["只说高松年欺骗方鸿渐，不写出他态度变化的利益逻辑。","把高松年写成单纯冷淡，忽略他也曾主动招聘和继续使用方鸿渐。","只批评高松年个人，不说明职称、委任和思想报告怎样成为他的权力工具。"],"learningLevel":"variation","studyPriority":"高频变式","parentQuestionId":"fortress-education-system-satire","doNotMemorizeSeparately":true,"questionFocus":"这题要写高松年如何利用职位、制度、信息和风险对待方鸿渐，主体始终是高松年。","socraticQuestions":["学校缺教师时，高松年为什么愿意用教授职位招揽方鸿渐？","方鸿渐到校后，高松年为什么敢违背原来的聘约？","方鸿渐被报告思想问题后，高松年为什么立即切割风险？"],"notAsking":["不是分析方鸿渐的人物形象。","不要写高松年和方鸿渐的友谊。","不要只说高松年欺骗。"],"threePartPlan":[{"step":"第一段","focus":"学校缺教师时，高松年用教授职位招揽方鸿渐。","useFromCore":"招揽阶段","miniSentence":"首先，学校缺教师时，高松年用教授职位招揽方鸿渐。"},{"step":"第二段","focus":"方鸿渐到校后，高松年认定他容易控制并降为副教授。","useFromCore":"降级阶段","miniSentence":"其次，方鸿渐到校后，高松年违背聘约并把他降为副教授。"},{"step":"第三段","focus":"出现思想问题后，高松年立即解聘并切割风险。","useFromCore":"解聘阶段","miniSentence":"最后，出现思想问题后，高松年立即解聘并切割风险。"}],"commonMistakes":[{"mistake":"只写两个人的性格。","why":"没有回答关系怎样变化。","fix":"写互动、态度变化和结果。"},{"mistake":"观察主体中途更换。","why":"答案会偏离题干。","fix":"每段先标清是谁对谁的看法。"}],"summary":"高松年对方鸿渐的态度变化：抓主体、变化与后果。","studentNote":"本题按“招揽—控制—切割”重组；原有关于降级和额外教学安排的证据已完整保留在“补充证据”中。","needsManualReview":false,"supplementaryEvidence":[{"purpose":"说明高松年认定方鸿渐容易控制，并借此违背聘约、降为副教授。","evidence":"“这姓方的青年人是容易对付的。”“他自己开来的学历，并没有学位，只是个各国游荡的‘游学生’，并且并非学政治的，聘他当教授太冤枉了！至多做副教授，循序渐升，年轻人做事不应该爬得太高。”","location":"第六章：方鸿渐到三闾大学报到，高松年在办公室盘算如何解释教授改副教授。","chapter":"第六章","searchPhrase":"这姓方的青年人是容易对付的","source":"改版前原 Point 1"},{"purpose":"说明高松年在需要填补教学空缺时，继续把方鸿渐当作可调度劳动力。","evidence":"“松年说：‘嗯，这倒不失为好办法，方先生钟点本来太少，不知道他的英文怎样？’”“鸿渐自知在学校的地位不稳固，又经辛楣细陈利害，刘东方恳切劝驾，居然大胆老脸、低头小心教起英文来。”","location":"第七章：孙柔嘉的课程无人代，赵辛楣推荐方鸿渐，高松年同意让他增加英文课。","chapter":"第七章","searchPhrase":"方先生钟点本来太少","source":"改版前原 Point 2"}]},{"id":"fortress-fang-leaves-university","work":"《围城》","workKey":"fortress","type":"主题思想","title":"方鸿渐离开三闾大学的原因","prompt":"请讨论导致方鸿渐离开三闾大学的具体原因。","keywords":["方鸿渐","三闾大学","离职","副教授","派系","思想问题"],"thesis":"方鸿渐离开三闾大学由个人能力、校内权力关系和外部政治判断共同造成。他既没有稳定专业位置，也在派系环境中缺少主动争取的能力；高松年最终又以思想问题为理由取消续聘，把个人性格困境和学校制度失序连接在一起。","points":[{"stage":"前","point":"方鸿渐缺少专业定位和教学准备，使他从一开始就处于不稳定的职业位置。","evidence":"“自己毫无经验，更无准备，教的功课又非出自愿，要参考也没有书，当然教不好。”","location":"第六章：方鸿渐到三闾大学后被安排教授并非自己选择的课程，教学效果不佳。","explain":"方鸿渐并非按专业被聘任，也没有为课程准备充分条件。他能够分析失败原因，却没有主动建立稳定学术方向，因此难以在学校中获得不可替代的地位。个人准备不足使他容易成为人事调整中的牺牲者，但离开的原因不止个人能力。","link":"前段建立个人职业根基薄弱，下一段显示派系环境进一步削弱他的地位。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第六章","searchPhrase":"自己毫无经验，更无准备","pdfPage":"","chain":{"who":"方鸿渐","action":"方鸿渐缺少专业定位和教学准备，使他从一开始就处于不稳定的职业位置。","reason":"方鸿渐并非按专业被聘任，也没有为课程准备充分条件","consequence":"前段建立个人职业根基薄弱，下一段显示派系环境进一步削弱他的地位。"}},{"stage":"中","point":"三闾大学的人事与派系关系使方鸿渐不断处于可替代位置，他只能被动接受额外课程安排。","evidence":"“鸿渐自知在学校的地位不稳固，又经辛楣细陈利害，刘东方恳切劝驾，居然大胆老脸、低头小心教起英文来。”","location":"第七章：孙柔嘉的课程无人承担，赵辛楣推荐方鸿渐，刘东方劝说他接受英文教学。","explain":"方鸿渐缺乏稳定的院系归属，别人安排课程时可以利用他的空余和弱势处境。他知道自己的职位随时可能被调整，却没有能力自主争取条件，只能接受对自己不利的安排。学校权力关系不断证明他可以被调动和替换，离开的可能性因此持续累积。","link":"职场地位不稳为政治性解聘提供条件，最终一本被报告的书直接触发离职。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第七章","searchPhrase":"地位不稳固","pdfPage":"","chain":{"who":"方鸿渐","action":"三闾大学的人事与派系关系使方鸿渐不断处于可替代位置，他只能被动接受额外课程安排。","reason":"他知道自己的职位随时可能被调整，却没有能力自主争取条件，只能接受对自己不利的安排","consequence":"职场地位不稳为政治性解聘提供条件，最终一本被报告的书直接触发离职。"}},{"stage":"后","point":"高松年把一本共产主义书籍和他人报告等同于思想风险，直接取消方鸿渐的续聘。","evidence":"“我本来要升他一级，谁知道他思想有问题，下学期只能解聘。这个人倒是可造之才，可惜！可惜！”","location":"第八章：陆子潇发现方鸿渐房中有共产主义书籍，李梅亭书面报告，高松年决定下学期不再聘用。","explain":"高松年没有核实书籍来源，也没有给予申辩和正式处理，直接把政治标签当成解除聘用的理由。他同时声称原本准备升职，把责任推给方鸿渐。制度处理缺少程序，个人权力借政治风险清除不稳定的教师，方鸿渐最终离开。","link":"结尾把个人能力不足、派系环境和行政卸责合并解释，说明离职是人物与制度共同作用的结果。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第八章","searchPhrase":"下学期只能解聘","pdfPage":"","chain":{"who":"方鸿渐","action":"高松年把一本共产主义书籍和他人报告等同于思想风险，直接取消方鸿渐的续聘。","reason":"高松年没有核实书籍来源，也没有给予申辩和正式处理，直接把政治标签当成解除聘用的理由","consequence":"结尾把个人能力不足、派系环境和行政卸责合并解释，说明离职是人物与制度共同作用的结果。"}}],"traps":["只责怪方鸿渐不会教书，忽略学校人事和派系问题。","只责怪高松年，不分析方鸿渐为什么长期处于可替代位置。","把书籍事件写成偶然，不说明制度如何处理所谓思想问题。"],"learningLevel":"variation","studyPriority":"高频变式","parentQuestionId":"fortress-intellectuals","doNotMemorizeSeparately":true,"questionFocus":"这题要说明作品通过哪些人物和情节表现“方鸿渐离开三闾大学的原因”，每段形成因果推进。","socraticQuestions":["题干要求你始终分析的主体是谁？","第一段的核心判断在文本中由什么行动支持？","三段怎样共同回答题干，而不是各讲一个知识点？"],"notAsking":["不要只复述情节。","不要把主题写成空泛口号。"],"threePartPlan":[{"step":"第一段","focus":"方鸿渐缺少专业定位和教学准备，使他从一开始就处于不稳定的职业位置。","useFromCore":"调用《三闾大学中的权力与知识分子群像》主体段 1","miniSentence":"首先，方鸿渐缺少专业定位和教学准备，使他从一开始就处于不稳定的职业位置"},{"step":"第二段","focus":"三闾大学的人事与派系关系使方鸿渐不断处于可替代位置，他只能被动接受额外课程安排。","useFromCore":"调用《三闾大学中的权力与知识分子群像》主体段 2","miniSentence":"其次，三闾大学的人事与派系关系使方鸿渐不断处于可替代位置，他只能被动接受额外课程安排"},{"step":"第三段","focus":"高松年把一本共产主义书籍和他人报告等同于思想风险，直接取消方鸿渐的续聘。","useFromCore":"调用《三闾大学中的权力与知识分子群像》主体段 3","miniSentence":"最后，高松年把一本共产主义书籍和他人报告等同于思想风险，直接取消方鸿渐的续聘"}],"commonMistakes":[{"mistake":"只复述情节。","why":"没有说明主题怎样形成。","fix":"写人物行动、原因和主题后果。"},{"mistake":"用抽象口号代替分析。","why":"缺少原文支撑。","fix":"每个观点配具体情节。"}],"summary":"方鸿渐离开三闾大学的原因：抓主体、变化与后果。","studentNote":"不必单独背全文，调用《三闾大学中的权力与知识分子群像》的材料，重点练习问法变化。","needsManualReview":false},{"id":"fortress-travel-social-problems","work":"《围城》","workKey":"fortress","type":"主题思想","title":"赴三闾大学旅途中的社会问题","prompt":"前往三闾大学的一路艰难反映出当时的哪些社会问题？请举例讨论。","keywords":["旅途","三闾大学","抗战","交通","特权","投机"],"thesis":"赴三闾大学的旅途集中呈现战时社会失序：交通资源紧张、机关特权与身份歧视并存，投机者又借物资短缺牟利。知识分子群体在旅途中也暴露功利和依附，个人行路困难因此成为国家制度和社会道德的缩影。","points":[{"stage":"前","point":"战时交通资源紧张，普通旅客无法按正常规则获得车票，身份和机关关系成为优先通行条件。","evidence":"“这车票难买得很，天没亮就得上车站去挤，还抢买不到，除非有证件的机关人员，可以通融早买票子。”","location":"第五章：众人在途中需要购买公共汽车票，旅店主人说明普通旅客与机关人员的差别待遇。","explain":"运输能力不足使车票成为稀缺资源，稀缺又催生身份特权。普通旅客只能拥挤等待，有机关证件的人可以提前购买。公共规则因此让位于关系和身份，交通困难不仅是自然条件，也反映行政资源分配的不公平。身份优先保证少数人通行，普通人的时间和安全被系统性压低，这构成旅途社会批判的第一层。","link":"交通特权只是旅途问题的第一层，军政人员的直接拒绝和歧视又进一步伤害普通人。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第五章","searchPhrase":"除非有证件的机关人员","pdfPage":"","chain":{"who":"方鸿渐及相关人物","action":"战时交通资源紧张，普通旅客无法按正常规则获得车票，身份和机关关系成为优先通行条件。","reason":"运输能力不足使车票成为稀缺资源，稀缺又催生身份特权","consequence":"交通特权只是旅途问题的第一层，军政人员的直接拒绝和歧视又进一步伤害普通人。"}},{"stage":"中","point":"军政人员掌握交通资源，可以随意拒绝普通乘客，并对女性进行羞辱，显示权力缺乏约束。","evidence":"“要是女人可以带，我早带小王一二一，开步走了，哈哈。”“孙小姐气得嘤然作声，鸿渐等侯营长进了对门，向他已消灭的阔背出声骂：‘浑蛋！’”","location":"第五章：众人尝试搭乘军车，侯营长以女人不能上车为由拒绝，同时用轻蔑语言羞辱孙柔嘉。","explain":"侯营长控制车辆和通行资格，却不说明公开规则，而是以私人好恶和性别偏见决定谁能上车。方鸿渐等人的愤怒无法形成约束，只能在背后咒骂。资源和武力结合后，普通人既得不到救济，也无法维护尊严。权力可以逃避监督，公共资源便不再服务公共利益，进一步加深整个社会的不信任。","link":"军政特权制造直接压迫，商人、教师和投机者又在生存压力下形成另一套利益交换。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第五章","searchPhrase":"要是女人可以带","pdfPage":"","chain":{"who":"方鸿渐及相关人物","action":"军政人员掌握交通资源，可以随意拒绝普通乘客，并对女性进行羞辱，显示权力缺乏约束。","reason":"方鸿渐等人的愤怒无法形成约束，只能在背后咒骂","consequence":"军政特权制造直接压迫，商人、教师和投机者又在生存压力下形成另一套利益交换。"}},{"stage":"后","point":"物资短缺使部分知识分子把公共需求转化为牟利机会，旅途也暴露教育和道德共同面临的功利化。","evidence":"“他的药是带到学校去卖好价钱的，留着原封不动，准备十倍原价去卖给穷乡僻壤的学校医院。”","location":"第五章：李梅亭带着大量西药上路，明知学校医院缺药，却计划以十倍价格出售。","explain":"学校医院缺药属于公共需求，李梅亭掌握药品后不把它首先用于救人，而把它看成趁短缺获利的商品。教育身份没有带来公共责任，反而被用来寻找利润空间。旅途因此不仅表现交通和军政问题，也揭示社会失序怎样进入知识群体内部。","link":"三层问题共同说明旅途困难不是单一交通事故，而是资源分配、权力约束和社会道德同时失效。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第五章","searchPhrase":"准备十倍原价去卖给穷乡僻壤","pdfPage":"","chain":{"who":"三闾大学知识分子群体","action":"物资短缺使部分知识分子把公共需求转化为牟利机会，旅途也暴露教育和道德共同面临的功利化。","reason":"教育身份没有带来公共责任，反而被用来寻找利润空间","consequence":"三层问题共同说明旅途困难不是单一交通事故，而是资源分配、权力约束和社会道德同时失效。"}}],"traps":["只复述路途艰难，不分类说明交通、权力和物资制度问题。","只写自然环境和战争，忽略机关特权、性别歧视和投机行为。","把所有问题都归给日本人或战争，不分析中国社会内部的管理与道德危机。"],"learningLevel":"variation","studyPriority":"高频变式","parentQuestionId":"fortress-education-system-satire","doNotMemorizeSeparately":true,"questionFocus":"这题要说明作品通过哪些人物和情节表现“赴三闾大学旅途中的社会问题”，每段形成因果推进。","socraticQuestions":["题干要求你始终分析的主体是谁？","第一段的核心判断在文本中由什么行动支持？","三段怎样共同回答题干，而不是各讲一个知识点？"],"notAsking":["不要只复述情节。","不要把主题写成空泛口号。"],"threePartPlan":[{"step":"第一段","focus":"战时交通资源紧张，普通旅客无法按正常规则获得车票，身份和机关关系成为优先通行条件。","useFromCore":"调用《战时高等教育制度的乱象》主体段 1","miniSentence":"首先，战时交通资源紧张，普通旅客无法按正常规则获得车票，身份和机关关系成为优先通行条件"},{"step":"第二段","focus":"军政人员掌握交通资源，可以随意拒绝普通乘客，并对女性进行羞辱，显示权力缺乏约束。","useFromCore" ":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第一章","searchPhrase":"本埠商界闻人点金银行","pdfPage":"","classRecordPage":29,"pageSource":"课堂页码记录","pageStatus":"课堂记录已定位；待统一版本逐字核验","chain":{"who":"方鸿渐与孙柔嘉","action":"家庭与周家把留学经历包装成婚姻、财富和社会声望相加的公开履历。","reason":"新闻把出资人、婚姻关系、留学城市、学科、成绩和博士头衔叠加在一起，使方鸿渐成为家庭体面的展示品","consequence":"报纸把个人的虚假身份放大为公开形象，下一段则揭示这种履历语言本身如何成为空洞套话。"}},{"stage":"后","point":"宣传文字依靠固定套话制造人才形象，讽刺社会把文凭和名号置于真实学问之上。","evidence":"“鸿渐恨不能把报一撕两半，把那王什么主任的喉咙扼着，看还挤得出多少开履历用的肉麻公式。”","location":"第一章：方鸿渐看到报纸对自己的夸张宣传，意识到新闻语言和履历包装的庸俗公式。","explain":"报纸并不核实学位和学问，只依照留学、名校、优异成绩、礼聘等套话制造体面人物。方鸿渐厌恶这段文字，既因为它是虚假的，也因为他知道其中每个光辉名号都反衬自己的空疏。学历崇拜和个人虚荣互相支持，形成一种公开而空洞的人才评价方式。","link":"三段共同说明，假文凭的社会后果不仅来自个人欺骗，也来自家庭和舆论共同制造虚假价值。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第一章","searchPhrase":"开履历用的肉麻公式","pdfPage":"","classRecordPage":29,"pageSource":"课堂页码记录","pageStatus":"课堂记录已定位；待统一版本逐字核验","chain":{"who":"方鸿渐及相关人物","action":"宣传文字依靠固定套话制造人才形象，讽刺社会把文凭和名号置于真实学问之上。","reason":"方鸿渐厌恶这段文字，既因为它是虚假的，也因为他知道其中每个光辉名号都反衬自己的空疏","consequence":"三段共同说明，假文凭的社会后果不仅来自个人欺骗，也来自家庭和舆论共同制造虚假价值。"}}],"traps":["只批评方鸿渐个人造假，不分析家庭包装、报纸宣传和社会学历崇拜。","把课堂记录直接改写成正式引文，未核对指定文本。","把文凭只当作道德问题，不联系婚姻体面、社会身份和人物羞耻。"],"learningLevel":"variation","studyPriority":"高频变式","parentQuestionId":"fortress-diploma","doNotMemorizeSeparately":true,"questionFocus":"这题不新增背诵任务，要解释假文凭为什么能被个人、家庭和社会的学历崇拜共同制造和接受。","socraticQuestions":["方鸿渐为什么需要文凭来遮住自己的焦虑？","周家和报纸怎样把留学经历包装成社会资本？","社会为什么只看名号，而不追问真实学问？"],"notAsking":["不是只分析方鸿渐的道德错误。","不要重复爱情、事业、婚姻三座围城。","不要只写社会学历崇拜。"],"threePartPlan":[{"step":"第一段","focus":"文凭被当作遮盖能力空缺和身份焦虑的体面外壳。","useFromCore":"调用《假文凭与方鸿渐的三座围城》主体段 1","miniSentence":"首先，文凭被当作遮盖能力空缺和身份焦虑的体面外壳"},{"step":"第二段","focus":"家庭与周家把留学经历包装成婚姻、财富和社会声望相加的公开履历。","useFromCore":"调用《假文凭与方鸿渐的三座围城》主体段 2","miniSentence":"其次，家庭与周家把留学经历包装成婚姻、财富和社会声望相加的公开履历"},{"step":"第三段","focus":"宣传文字依靠固定套话制造人才形象，讽刺社会把文凭和名号置于真实学问之上。","useFromCore":"调用《假文凭与方鸿渐的三座围城》主体段 3","miniSentence":"最后，宣传文字依靠固定套话制造人才形象，讽刺社会把文凭和名号置于真实学问之上"}],"commonMistakes":[{"mistake":"只复述情节。","why":"没有说明主题怎样形 "苏文纨","暧昧","逃避","面子","责任"],"thesis":"方鸿渐欣赏苏文纨带来的体面和关注，却没有与她建立爱情关系的意愿；他因好面子、怕尴尬和逃避冲突不断拖延，既不明确接受也不及时拒绝。暧昧持续越久，对苏文纨的伤害越大，也暴露方鸿渐在亲密责任上的软弱。","points":[{"stage":"前","point":"方鸿渐把苏文纨看作体面的社交伴侣，欣赏她的身份和青睐，却没有真实的爱情投入。","evidence":"“苏小姐是最理想的女朋友，有头脑，有身分，态度相貌算得上大家闺秀，和她同上饭馆戏院并不失自己的面子。他们俩虽然十分亲密，方鸿渐自信对她的情谊到此而止。”","location":"第三章：方鸿渐与苏文纨在香港和上海持续交往，叙述者说明他对这段关系的实际定位。","explain":"苏文纨能够满足方鸿渐对体面、社交和女性青睐的需要，因此被视为理想伴侣；但“女朋友”与“情人”的区别说明他并未产生真正爱情。他享受关系带来的面子，却不愿承担明确承诺。关系的不对等从一开始就存在。前段因此建立欣赏与爱情之间的落差，为后文长期拖延提供前提。","link":"前段建立欣赏与爱情之间的落差，后文拖延不拒绝会让这种不对等持续扩大。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第三章","searchPhrase":"最理想的女朋友","pdfPage":"","classRecordPage":24,"pageSource":"课堂页码记录","pageStatus":"课堂记录已定位；待统一版本逐字核验","subject":"方鸿渐","chain":{"who":"方鸿渐","action":"方鸿渐把苏文纨看作体面的社交伴侣，欣赏她的身份和青睐，却没有真实的爱情投入。","reason":"苏文纨能够满足方鸿渐对体面、社交和女性青睐的需要，因此被视为理想伴侣","consequence":"前段建立欣赏与爱情之间的落差，后文拖延不拒绝会让这种不对等持续扩大。"}},{"stage":"中","point":"方鸿渐清楚自己不爱苏文纨，却因心软、怕伤害和逃避冲突，持续维持暧昧关系。","evidence":"“方鸿渐迫于苏小姐的恩威并施，还不得不常向苏家走动。苏小姐只等他正式求爱，心里怪他太浮太慢。他只等机会向她声明并不爱她，恨自己心肠太软，没有快刀斩乱丝的勇气。”","location":"第三章：苏文纨期待正式求爱，方鸿渐却寻找机会拒绝，双方目的长期相反。","explain":"方鸿渐知道继续往来会让误会加深，却缺少及时说明的勇气。他害怕场面难堪，也舍不得失去苏文纨的青睐，于是拖延成为最省力的选择。表面温和实际延长了伤害，所谓心软包含明显的自利和回避责任。拖延由软弱和面子共同造成，最终会把双方推向更激烈的冲突。","link":"中段证明拖延由软弱和面子共同造成，后文被迫摊牌时会形成更激烈的伤害。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第三章","searchPhrase":"没有快刀斩乱丝的勇气","pdfPage":"","classRecordPage":24,"pageSource":"课堂页码记录","pageStatus":"课堂记录已定位；待统一版本逐字核验","subject":"方鸿渐","chain":{"who":"方鸿渐","action":"方鸿渐清楚自己不爱苏文纨，却因心软、怕伤害和逃避冲突，持续维持暧昧关系。","reason":"方鸿渐知道继续往来会让误会加深，却缺少及时说明的勇气","consequence":"中段证明拖延由软弱和面子共同造成，后文被迫摊牌时会形成更激烈的伤害。"}},{"stage":"后","point":"当关系无法继续拖延时，方鸿渐只能突然宣告另有所爱，仓促结束暧昧并造成双方难堪。","evidence":"“不，苏小姐，不，我不敢见你——”“我另外有——有个人。”“你——你这浑蛋！”苏小姐用中文骂他，声音似乎微颤。”","location":"第四章：方鸿渐通过电话向苏文纨说明自己爱的是另一个人，苏文纨愤怒受辱。","explain":"方鸿渐没有在关系早期清楚拒绝，最终只能在压力下突然摊牌。他语言支吾、不敢当面说明，说明软弱并未解决，只是把责任推到最后一刻。苏文纨因长期期待落空而感到羞辱和欺骗。暧昧造成的情感损失，正来自方鸿渐既想保持体面又不愿承担选择的矛盾。","link":"结尾说明方鸿渐对苏文纨的伤害来自长期拖延和逃避，后续与唐晓芙的关系也因此更加复杂。","page":""," var ESSAYS=[{"id":"essay-01","title":"范文一：《莎菲女士的日记》——云霖、毓芳和蕴姊对莎菲的不同意义","work":"《莎菲女士的日记》","summary":"开头段： 《莎菲女士的日记》是丁玲在五四以后创作的日记体小说，作者用细腻而尖锐的心理描写，写出病中的莎菲对爱情、理解和陪伴的复杂感受。本文从云霖与毓芳对恋爱的克制、毓芳的理性提醒、蕴姊的深切理解三个角度，说明这些朋友分别显出莎菲对真挚感情的…","html":"<p>《莎菲女士的日记》是丁玲在五四以后创作的日记体小说，作者用细腻而尖锐的心理描写，写出病中的莎菲对爱情、理解和陪伴的复杂感受。本文从云霖与毓芳对恋爱的克制、毓芳的理性提醒、蕴姊的深切理解三个角度，说明这些朋友分别显出莎菲对真挚感情的怀疑、对理性劝告的保留和对深层理解的渴望。</p><p>云霖和毓芳虽是情侣，但他们的克制让莎菲怀疑这份感情是否足够真挚。莎菲忍不住写：“我忍不住嘲笑他们了，这禁欲主义者！”她又不相信恋爱会“如此的理智，如此的科学”。莎菲并不羡慕两人的交往方式，反而觉得他们过分压抑身体和感情的自然表现。她把这种克制看成不真诚、不热烈的爱情，也因此更坚持自己对情感强度的要求。她既然觉得云霖和毓芳太理智，就更会在意毓芳怎样判断她自己的感情。</p><p>毓芳不仅能陪伴莎菲，还会直接提醒她看清感情。小说中，毓芳曾说“你哪里会爱他”，这句判断让莎菲不得不重新面对自己的真实感受。毓芳善于用理智判断关系，能看出莎菲可能把一时情绪误认成爱情。可这种清醒也是莎菲先前怀疑的“过于理智”：它能纠正判断，却不能满足她对热烈理解的期待。毓芳只能替她分析爱情，却接不住她更难说出的那部分情绪。</p><p>蕴姊对莎菲的意义最深，因为她让莎菲能够毫无防备地坦露情绪。莎菲问，朋友“也很体惜我”，但这种关系“能和蕴姊的爱在一个天平上相称吗”；她又说，想起蕴姊，自己真想像从前那样“撒娇一样的纵声大哭”。这两句话把普通照顾和深层理解分开了。朋友会体惜她，毓芳会提醒她，蕴姊却让她可以撒娇、痛哭、露出最软弱的一面。蕴姊去世后，莎菲失去的正是这种能够完全理解自己的关系。云霖、毓芳和蕴姊分别代表日常陪伴、理性提醒和深层理解，也共同显出莎菲越来越难找到真正懂她的人。</p><p>云霖与毓芳显出莎菲对冷淡、克制恋爱的怀疑，毓芳给出理智判断，蕴姊则给予她最深的情绪接纳。三人对莎菲各有不同，不能互相替代。丁玲借此写出一个更难处理的问题：理智的劝告能够提醒莎菲，却不能替代她真正需要的热烈理解与情感回应。</p>"},{"id":"essay-02","title":"范文二：《水》——灾民在灾难中的心态转变","work":"《水》","summary":"开头段： 《水》是丁玲以水灾为背景创作的小说，作者用群像、对照和急促的场面写出灾民从承受毁坏、求神等待到共同行动的经过。本文从大水夺走生命和生计、灾民向神佛寄托希望、人群最终回应行动三个角度，说明灾民的心态怎样一步步发生变化。","html":"<p>《水》是丁玲以水灾为背景创作的小说，作者用群像、对照和急促的场面写出灾民从承受毁坏、求神等待到共同行动的经过。本文从大水夺走生命和生计、灾民向神佛寄托希望、人群最终回应行动三个角度，说明灾民的心态怎样一步步发生变化。</p><p>大水先直接吞没农人的生命、家属和劳动成果。水占领大片原野后，“埋在那下面的，是无数的农人的辛勤和农人自己，还有他们的家属”。这句话把损失落在农人和他们的家人身上，也写出长期劳动被水毁掉。生命和生计同时消失，灾难因此显得迫切而沉重。面对无法抵挡的毁坏，他们把活下去的希望转向神佛。</p><p>在无力控制灾害时，灾民先向神佛寻求保护。他们喊“求老天爷保护，保护呀，地藏王菩萨，龙王菩萨”。求神出现在生命受到威胁之后，说明面前的水势已经超出个人力量。灾民没有能力马上改变处境，只能把希望交给上天，这种反应让他们的无助更加具体。神佛没有止住大水，后来的告示和承诺也没有送来粮食，失望逐渐积累。</p><p>在等待落空后，群众借着集体回应转向行动。有人喊出“起来！跟它拚，全不过是死呀”，众人随后接住这一说法，结尾又写人群像水一样向镇上行动。起身的呼喊把灾民从等待中叫出，拼命又让共同绝境变成行动理由。结尾借用水的凶猛形容人群，使他们从受灾者变成行动的参与者。从求神到起身，小说完成了灾民心态的转折。</p><p>大水先夺走生命和生计，灾民转而求神，后来又在失望中走向共同行动。丁玲没有把这种变化写成突然的勇敢，而是让它从连续损失和等待落空中生出。作者由此写出，灾民不只会承受灾难，也会在绝境中重新作出选择。</p>"},{"id":"essay-03","title":"范文三：《在医院中》——陆萍的心态转变","work":"《在医院中》","summary":"开头段： 《在医院中》是丁玲描写根据地医院生活的小说，作者用环境细节和心理变化写出陆萍从热情进入现实、再到继续实践的成长过程。本文从最初主动照顾病人、与旧工作方式发生冲突、受挫后继续工作三个角度，分析陆萍从投入到受挫、再到坚持行动的心态变化…","html":"<p>《在医院中》是丁玲描写根据地医院生活的小说，作者用环境细节和心理变化写出陆萍从热情进入现实、再到继续实践的成长过程。本文从最初主动照顾病人、与旧工作方式发生冲突、受挫后继续工作三个角度，分析陆萍从投入到受挫、再到坚持行动的心态变化。</p><p>陆萍刚进入医院时，把理想落实为照顾病人的具体行动。“为了不愿病人产妇多受苦痛”，她亲自替开刀后发炎的人换药。这里的重点落在她愿意亲自动手。她看到病人的疼痛，便想改变眼前的医疗条件。这样的行动使陆萍一开始就与敷衍、懒散的工作态度拉开距离。正因为她对病人需要看得具体，她很快也会看到医院中不合她标准的地方。</p><p>陆萍很快从热情行动转向失望和冲突。小说说她“有足够的热情，和很少的世故”，她为生活管理和医疗改善与许多人发生冲突。陆萍的责任感并不缺，欠缺的是与人周旋的经验。她把问题直接摆到众人面前，结果要求越合理，冲突越明显。热情因此没有马上带来改变，反而先让她陷入被误解的处境。当冲突继续积累，一次事故把她推到了更低的情绪位置。</p><p>中毒事件后，陆萍经历怀疑和痛苦，但她没有停在委屈中。结尾说“新的生活虽要开始，然而还有新的荆棘”，随后又写她仍兴致浓厚地照顾产妇和婴儿，为她们的需要去找管理员、总务处、秘书长甚至院长争执。她遭遇挫折，却没有被它彻底打倒，也没有突然变得圆满。她仍会面对新的困难，却把注意力重新放回病人和具体工作。成长因此表现为继续行动，痛苦也并未从此消失。陆萍的变化由主动照顾、受挫冲突到继续实践，构成了一条没有结束的成长线。</p><p>陆萍从主动照顾病人，到因直言受挫，再到继续争取医疗条件，变化始终落在行动上。小说没有给她圆满结局，却让她在困难中保持行动。热情经历挫折后仍能继续做事，这样的成长才更接近真实的青年实践者。</p>"},{"id":"essay-04","title":"范文四：《围城》——三闾大学的教育乱象","work":"《围城》","summary":"开头段： 《围城》是钱钟书创作的长篇小说，作者用讽刺笔调和人物对话写出战时知识界中虚伪、势利和人事争夺。本文从假文凭、聘约与职位的安排、导师制的变味三个角度，说明三闾大学的教育乱象怎样通过文凭、人事和师生关系显出来。","html":"<p>《围城》是钱钟书创作的长篇小说，作者用讽刺笔调和人物对话写出战时知识界中虚伪、势利和人事争夺。本文从假文凭、聘约与职位的安排、导师制的变味三个角度，说明三闾大学的教育乱象怎样通过文凭、人事和师生关系显出来。</p><p>学历本应证明学识，在小说里却成了可以购买和互相遮掩的身份凭证。方鸿渐问自己，“自己买张假文凭回去哄人，岂非也成了骗子？”后来他发现韩学愈也有同样的问题，反而觉得自己的欺骗“减轻了罪名”。假文凭帮助方鸿渐维持体面，也说明学校判断教师时主要看头衔，而不一定追问真实能力。两个人都造假，又因为对方存在而获得安慰，学历的可信度因此进一步下降。学历既然可以造假，聘约和职位也可能随着掌权者的判断改变。</p><p>高松年和汪处厚的做法显示，聘任与职位安排并不稳定。高松年认为方鸿渐“容易对付”，又说“聘他当教授太冤枉了！至多做副教授”；汪处厚安排欢迎会，用“敌人喘息未定，即予以迎头痛击”抢占系主任位置。两人的动作不同，方向却一致：职位都服从于掌权者的利益。高松年借学历压低方鸿渐，汪处厚借先手制造事实，聘约和系主任位置因此不再尊重原先约定。职位安排已经显出问题，师生关系中的导师制也没有逃开同样的功利做法。</p><p>导师制本应帮助学生，却被李梅亭用来制造恩情和压力。他告诉学生“全亏自己保全”，学生听后“红着眼圈感谢”；叙述者后来追问“将来还有人敢教书么？”学生得到的不像是正常教育，而像私人施恩。导师制因此把师生关系变成感谢、服从和风险转嫁。如此一来，文凭、职位和师生来往都围着利益打转，教学反而退到后面。三组事件分别落在学历、人事和师生关系上，共同写出三闾大学教育乱象。</p><p>假文凭影响学历判断，职位争夺改变人事安排，导师制又落在师生关系中，三闾大学的教育乱象便从这些具体事情中显出。钱钟书把问题分散在多人身上，也使读者看到，教学和学问一旦让位于身份与利益，学校就会逐渐失去本来该有的作用。</p>"},{"id":"essay-05","title":"范文五：《围城》——赵辛楣与方鸿渐的平行对照","work":"《围城》","summary":"开头段： 《围城》是钱钟书创作的长篇小说，作者用对话、对比和人物行动写出知识分子的选择与人情。本文从学业资历、爱情中的主动安排、三闾大学里解决问题的方式三个角度，说明方鸿渐懦弱、虚伪、胆小逃避，赵辛楣大胆、主动、积极承担，两人构成鲜明的平行…","html":"<p>《围城》是钱钟书创作的长篇小说，作者用对话、对比和人物行动写出知识分子的选择与人情。本文从学业资历、爱情中的主动安排、三闾大学里解决问题的方式三个角度，说明方鸿渐懦弱、虚伪、胆小逃避，赵辛楣大胆、主动、积极承担，两人构成鲜明的平行对照。</p><p>在学业和资历上，赵辛楣有真才实学，方鸿渐却用假文凭掩饰无能。赵辛楣是“美国留学生，本在外交公署当处长”，后来又在华美新闻社做政治编辑；方鸿渐则问过自己，“自己买张假文凭回去哄人，岂非也成了骗子？”赵辛楣的留学经历、外交公署职位和政治编辑身份能够互相证明，说明他敢凭真实资历进入社会竞争。方鸿渐的文凭来历不正，连他自己都担心成为骗子，却仍用它换体面和职位，懦弱和虚伪由此显露。他害怕别人追查学历，所以只能靠遮掩维持身份，职业基础从一开始就不稳。到了爱情关系里，这种退缩和逃避继续表现出来。</p><p>在爱情上，赵辛楣主动设法把方鸿渐调离苏文纨身边。他“忽然记起她说过鸿渐急欲在国立大学里谋个事，便偷偷拍电报介绍鸿渐给高松年，好教苏小姐跟鸿渐疏远”。赵辛楣没有只停在吃醋和冷淡上，而是利用自己的人情关系给方鸿渐安排工作，借此减少方鸿渐与苏文纨见面的机会。这个安排既表明他追求感情时的主动，也写出他会运用关系和机会解决问题。方鸿渐后来只“恍然大悟”并感谢对方替自己找到饭碗，完全没有察觉其中的情感安排，两人的行动方式形成直接对照。这种主动处理关系的性格，在赴三闾大学的旅途中也表现为承担责任。</p><p>面对三闾大学的现实处境，赵辛楣主动想办法，方鸿渐则接受别人的安排。辛楣说“话是空的，人是活的；不是人照着话做，是话跟着人变”；方鸿渐“自知在学校的地位不稳固”，经“辛楣细陈利害”后，才“低头小心”去教英文。赵辛楣不会死守原先说法，而是根据学校环境调整做法，主动为自己和方鸿渐寻找可行办法。方鸿渐明明知道职位不稳，却没有独立判断和行动，要等辛楣替他分析利害后，才勉强接受教英文的安排。一个会主动处理问题，一个只能依赖别人推动，两人的差别在职业处境中再次出现。从资历、爱情到应对现实，两人始终走在相近道路上，却作出相反选择。</p><p>在学业上，方鸿渐靠假文凭遮羞，赵辛楣凭真实资历立身；在爱情上，赵辛楣主动安排工作以调开方鸿渐，方鸿渐却被动接受并蒙在鼓里；到三闾大学后，赵辛楣会根据处境调整办法并替方鸿渐分析利害，方鸿渐却只能等人推动。两人的平行关系因此贯穿学历、爱情和职业现实，显出方鸿渐的懦弱逃避与赵辛楣的主动担当。作者通过两人在相近处境中的反复对照，写出不同选择怎样改变人生走向，也体现人在困境中主动承担的重要性。</p>"},{"id":"essay-06","title":"范文六：《水》中裸身汉子的作用","work":"《水》","summary":"开头段： 《水》是丁玲创作的水灾题材小说，作者用人物话语、群众回应和结尾的比喻写出灾民由等待转向行动的经过。本文从裸身汉子说破灾民受苦的原因、否定等待救助、推动群众回应行动三个角度，分析他怎样把个人话语同人群选择连接起来。","html":"<p>《水》是丁玲创作的水灾题材小说，作者用人物话语、群众回应和结尾的比喻写出灾民由等待转向行动的经过。本文从裸身汉子说破灾民受苦的原因、否定等待救助、推动群众回应行动三个角度，分析他怎样把个人话语同人群选择连接起来。</p><p>裸身汉子先从灾民为什么挨饿说起。他说“他们坐在衙门里拿捐款的人，坐在高房子里收谷子的人，他们吃的什么？吃的我们力气和精血呀！”句中那些人的吃用与灾民的力气、精血相连，说明灾民付出的劳动正在供养另一部分人。听见这句话后，灾民面对的就不仅是天灾，还有已经获利的人。既然如此，他接着否定了继续等人施恩的想法。</p><p>他进一步劝灾民不要再等外人来救。他说：“还把别人当好人，等别人来施恩，还打算有人来救我们？哼！等着吧，把肠子饿了出来，你看有不有米会送来？”连续反问表面上说粮食不会等来，实际上在拆掉众人对外力救援的最后期待。经过多次失望后，灾民需要有人把这种感受说清，他的话正好完成了这一步。出路因此从等待别人转为自己行动，话头也交给群众接下去。</p><p>群众很快接住他的话，并转向共同行动。有人喊“怕什么人？起来！跟它拚，全不过是死呀”，随后又有多人应和；结尾的人群则像水一样向镇上行动。回应不再停留在一个人的抱怨里。先有人喊出起身，再有人同意拼命，群众逐渐把共同绝境变成一起行动的理由。裸身汉子说清了原因，群众的接应则把话推成了行动。人物话语与群众回应相接，全文也由此走向结尾的集体行动。</p><p>裸身汉子先说明谁取得了灾民的劳力成果，再否定等待救援，最后得到群众回应。他的话让灾民重新判断自己的处境，也使行动不再只是个人的冲动。丁玲借这一人物写出个人话语怎样进入集体选择，群体的反抗因此有了共同的来路。</p>"},{"id":"essay-07","title":"范文七：《水》中水的不同阶段意义","work":"《水》","summary":"开头段： 《水》是丁玲创作的水灾题材小说，作者借水的不断变化，写出灾民从求神、等待到共同行动的整个过程。本文从大水夺走农人的生命和生计、有权者既不开放粮仓又运来军火准备镇压、裸身汉子引导群众走向行动三个阶段，分析水怎样由自然灾害变成阶级压迫…","html":"<p>《水》是丁玲创作的水灾题材小说，作者借水的不断变化，写出灾民从求神、等待到共同行动的整个过程。本文从大水夺走农人的生命和生计、有权者既不开放粮仓又运来军火准备镇压、裸身汉子引导群众走向行动三个阶段，分析水怎样由自然灾害变成阶级压迫和人群行动的象征。</p><p>在开头，水首先把灾民推入无法挽救的绝望处境。水占领大片原野后，“埋在那下面的，是无数的农人的辛勤和农人自己，还有他们的家属”。农人的辛勤代表生产材料和长期劳动，农人和家属则是他们最亲的家人。水把这些一起卷走，灾民赖以生活的家产、劳动成果和亲人都无法保住，他们也没有力量阻止大水。失去生计之后，灾民还要面对粮食无法获得的问题，绝望因此继续加深。</p><p>水灾继续时，水也成为阶级压迫的象征。群众中有人说：“说镇长好，知事好，他们为什么不把他们的仓打开，分给我们一点呢？……”另一处又写：“帆船却又带来了一些军火，并没有带救济米。”一边是灾民守着挨饿，粮仓却不肯开放；另一边是运来的物资不包括救命粮食，反而用于武力控制。拒粮与镇压同时出现，说明掌握权力的人只顾维持秩序，不把灾民的生存需要放在前面。阶级压迫因此不再抽象，而是落在粮仓和军火这两个具体选择上。</p><p>裸身汉子进一步说出谁占取了灾民的劳动成果，推动群众转向行动。他说：“坐在衙门里拿捐款的人，坐在高房子里收谷子的人，他们吃的什么？吃的我们力气和精血呀！”这句话把灾民的饥饿和拿捐款、收谷子者的所得连在一起，让众人看清自己被谁占取。等他们不再相信施恩和救援，水的凶猛就不再只意味着灾难，也变成人群共同行动时的力量。开头的水是压迫，结尾的水是行动，前后变化对应着灾民态度的改变。</p><p>开头的水夺走农人的生命和生计，后来他们既分不到粮仓里的粮食，又看到军火被运来维持控制。裸身汉子进一步指出，拿捐款、收谷子的人占取了他们的力气和精血。人群最终用行动回应。水的意义由灾害转向压迫，再转向反抗。丁玲让同一意象不断延伸，使自然灾害、阶级关系和集体行动彼此联系。</p>"},{"id":"essay-08","title":"范文八：《围城》——婚姻围城的象征意义","work":"《围城》","summary":"开头段： 《围城》是钱钟书创作的长篇小说，作者用比喻、讽刺和夫妻对话写出婚姻中的期待与失望。本文从婚前想象、婚后现实、学校把婚姻当作留人办法三个角度，分析婚姻围城怎样由人物自己的选择一步步形成。","html":"<p>《围城》是钱钟书创作的长篇小说，作者用比喻、讽刺和夫妻对话写出婚姻中的期待与失望。本文从婚前想象、婚后现实、学校把婚姻当作留人办法三个角度，分析婚姻围城怎样由人物自己的选择一步步形成。</p><p>婚姻在人物想象中代表理想和归属。“结婚仿佛金漆的鸟笼，笼子外面的鸟想住进去，笼内的鸟想飞出来。”鸟笼外面看起来漂亮，里面的人却想离开，这个比喻同时写出婚姻的吸引和束缚。人物把结婚看成获得归属、解决漂泊的办法，却没有准备承担共同生活中的责任。期待越接近理想，婚后的现实落差就越容易成为新的困境。</p><p>进入婚姻后，日常矛盾和现实压力把原先的期待推向破裂。“好，咱们算散伙。行李衣服，你自己去办，别再来找我。”夫妻争执最后落到行李、衣服这些具体事务上，感情已经退到后面。方鸿渐和孙柔嘉既不能解决工作、家庭和相处中的问题，也不肯在冲突中相信对方，婚姻便从共同生活变成互相清算。婚姻困境与事业失败互相推动，使“围城”不只写爱情，也写现实生活对人的束缚。</p><p>三闾大学的婚姻议论还写出婚姻会被职位和人情利用。“在这儿结婚成家，就安定下来，走不了，学校借光不少。”学校希望教师成家后更难离开，婚姻因此成了一种留人的安排。人物原想借婚姻获得稳定，结果也把自己固定在学校的人事关系里。从个人想象到婚后矛盾，再到学校留人，婚姻围城逐渐扩展到职业生活。</p><p>婚姻先是人物追求归属的美好想象，进入现实后又变成夫妻互相埋怨和算计的困境，到了三闾大学，还被学校当成稳定教师的办法。钱钟书借这些具体选择写出，围城的门并不只由外界锁上，人物自己的期待、依赖和退让也会把门越关越紧。</p>"},{"id":"essay-09","title":"范文九：《围城》——孙柔嘉的性格分析","work":"《围城》","summary":"开头段： 《围城》是钱钟书创作的长篇小说，作者用外貌、对话和婚后争执写出孙柔嘉的变化。本文从初登场时的羞怯、订婚后的牢固主见和婚姻破裂时的尖锐反击三个角度，分析她外柔内刚的性格。","html":"<p>《围城》是钱钟书创作的长篇小说，作者用外貌、对话和婚后争执写出孙柔嘉的变化。本文从初登场时的羞怯、订婚后的牢固主见和婚姻破裂时的尖锐反击三个角度，分析她外柔内刚的性格。</p><p>孙柔嘉初登场时用柔弱、怕生的样子进入男性知识圈。“打扮甚为素净，怕生得一句话也不敢讲，脸上滚滚不断的红晕。”她安静朴素，显得容易害羞，旁人因此把她当成需要照顾的小辈，也少了对她的防备。柔弱的外表先建立起来，后面显露的主见才更有反差。</p><p>订婚后，孙柔嘉逐渐显露牢固主见和现实判断。“鸿渐最初以为她只是个女孩子，事事要请教自己；订婚以后，他渐渐发现她不但很有主见，而且主见很牢固。”她还提醒方鸿渐“找事不容易”。方鸿渐原以为她事事依赖自己，后来才发现她判断坚定。面对职业选择，她提醒他不要凭一时意气丢开后路，也开始主动干预丈夫的决定。她有主见并不等于关系更稳固，夫妻在工作选择上的分歧反而逐渐增多。</p><p>婚姻危机爆发后，孙柔嘉用切断关系和否定人格的方式反击。“好，咱们算散伙。”她还要方鸿渐自己处理行李衣服，并说：“你不但本领没有，连志气都没有，别跟我讲什么气节了。”她把夫妻关系转成具体事务的清算，又直接否定方鸿渐的能力和志气。长期积累的不满变成攻击，她既保护自己，也撕开两人之间最后的体面。孙柔嘉的外柔内刚最终落在婚姻冲突中，她与方鸿渐共同把婚姻推向互相逃离的处境。</p><p>孙柔嘉先用安静和羞怯进入人群，订婚后显出牢固主见，婚姻破裂时又用散伙和责备保护自己。钱钟书没有把她写成单纯柔弱或单纯强硬的人，而是写出她在缺少安全感时不断收紧选择。她越想抓住婚姻中的位置，越显出控制与自保并存的一面，也让人看见婚姻围城如何由双方性格共同筑成。</p>"}];
var state={mode:"list",work:"all",query:"",selected:null,selectedEssay:null,matchQuery:"",hide:false,drawItem:null,drawHistory:[],learningMode:"student",levelFilter:"core",showTeacher:false,expandFull:false,showSkeleton:false,teacherLevel:"all",teacherType:"all",evidenceFilter:"all",reviewFilter:"all",expandedVariation:null};
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function workName(k){return WORKS[k]||k}
function norm(s){return String(s||"").toLowerCase().replace(/[\s，。！？；：、“”‘’（）《》〈〉·,.!?;:'"()\[\]{}<>\/\\-]/g,"")}
function grams(s,n){s=norm(s);var out=[];for(var i=0;i<=s.length-n;i++)out.push(s.slice(i,i+n));return out}
function itemText(x){return [x.title,x.prompt,x.work,x.type,x.keywords.join(" "),x.thesis,x.points.map(function(p){return p.point+" "+p.evidence+" "+p.location}).join(" ")].join(" ")}
function scoreItem(x,q){q=norm(q);if(!q)return 0;var score=0;x.keywords.forEach(function(k){if(q.indexOf(norm(k))>=0)score+=18});if(q.indexOf(norm(x.title))>=0)score+=28;if(norm(x.prompt).indexOf(q)>=0)score+=28;var target=itemText(x);[2,3,4].forEach(function(n){grams(q,n).forEach(function(g){if(target.indexOf(g)>=0)score+=g.length*g.length})});return score}
function matchedKeywords(x,q){q=norm(q);return x.keywords.filter(function(k){return q.indexOf(norm(k))>=0})}
function levelName(x){
  return x.learningLevel==="core"?"必背母题":x.learningLevel==="variation"?"高频变式":"教师拓展";
}
function evidenceComplete(x){
  var points=x.points||[];
  return points.length>0&&points.every(function(p){return !!(p.evidence&&p.explain&&p.location)});
}
function learningMatches(x){
  if(state.evidenceFilter==="complete"&&!evidenceComplete(x))return false;
  if(state.evidenceFilter==="missing"&&evidenceComplete(x))return false;
  if(state.reviewFilter==="needs"&&!x.needsManualReview)return false;
  if(state.reviewFilter==="clear"&&x.needsManualReview)return false;
  if(state.learningMode==="teacher"){
    if(state.teacherLevel!=="all"&&x.learningLevel!==state.teacherLevel)return false;
    if(state.teacherType!=="all"&&x.type!==state.teacherType)return false;
    return true;
  }
  if(state.learningMode==="full"){
    return x.learningLevel!=="teacher-extension"||state.showTeacher;
  }
  if(x.learningLevel==="teacher-extension")return state.showTeacher;
  if(state.levelFilter==="core")return x.learningLevel==="core";
  if(state.levelFilter==="variation")return x.learningLevel==="variation";
  return x.learningLevel==="core"||x.learningLevel==="variation";
}
function learningStats(){
  var keys=state.work==="all"?Object.keys(WORKS):[state.work];
  return '<div class="statsPanel"><b>先完成“必背母题”，再练“高频变式”。</b><div class="hint">高频变式不是新增背诵任务，而是练习同一套材料怎样应对不同问法。</div>'+keys.map(function(k){
    var arr=DATA.filter(function(x){return x.workKey===k});
    var core=arr.filter(function(x){return x.learningLevel==="core"}).length;
    var variation=arr.filter(function(x){return x.learningLevel==="variation"}).length;
    var extension=arr.filter(function(x){return x.learningLevel==="teacher-extension"}).length;
    return '<div class="statsLine"><b>'+esc(WORKS[k])+'</b><span>必背 '+core+' · 变式 '+variation+' · 拓展 '+extension+'</span></div>';
  }).join("")+'</div>';
}
function sharedFilters(){

  var box=document.getElementById("matchBox");if(box)box.oninput=function(){state.matchQuery=this.value};
  var doMatch=document.getElementById("doMatch");if(doMatch)doMatch.onclick=function(){state.matchQuery=document.getElementById("matchBox").value.trim();render()};
  var doDraw=document.getElementById("doDraw");if(doDraw)doDraw.onclick=function(){var pool=DATA.filter(function(x){return learningMatches(x)&&(state.work==="all"||x.workKey===state.work)});var remaining=pool.filter(function(x){return state.drawHistory.indexOf(x.id)<0});if(!remaining.length){state.drawHistory=[];remaining=pool}if(!remaining.length)return;state.drawItem=remaining[Math.floor(Math.random()*remaining.length)];state.drawHistory.push(state.drawItem.id);render();window.scrollTo(0,0)};
  var openDraw=document.getElementById("openDraw");if(openDraw)openDraw.onclick=function(){state.selected=state.drawItem.id;state.expandFull=false;state.showSkeleton=false;render();window.scrollTo(0,0)};
  var drawAgain=document.getElementById("drawAgain");if(drawAgain)drawAgain.onclick=function(){state.drawItem=null;render()};
  var back=document.getElementById("back");if(back)back.onclick=function(){state.selected=null;state.expandFull=false;state.showSkeleton=false;render()};
  var toggleFull=document.getElementById("toggleFull");if(toggleFull)toggleFull.onclick=function(){state.expandFull=!state.expandFull;render()};
  var toggleSkeleton=document.getElementById("toggleSkeleton");if(toggleSkeleton)toggleSkeleton.onclick=function(){state.showSkeleton=!state.showSkeleton;render()};
}
render();
</script>
</body>
</html>
