<script>
var DATA=[{"id":"saffi-character","work":"《莎菲女士的日记》","workKey":"saffi","type":"人物形象","title":"莎菲的主体性矛盾","prompt":"分析莎菲女士的性格矛盾及其思想意义。","keywords":["莎菲","矛盾","灵肉冲突","觉醒","孤独","女性"],"thesis":"莎菲的矛盾不是简单性格反复，而是五四新一代知识女性在身体欲望、精神道德、自我尊严与父权现实之间形成的主体性冲突。","points":[{"point":"莎菲敢于承认欲望，开始以女性自身感受确认主体存在。","evidence":"“我的欲望……所以我只得忍耐着，低下头去。”","location":"莎菲认识凌吉士后，反复书写情感与欲望的日记段落。","explain":"“我的欲望”使女性的身体感受第一次成为叙述中心，而“忍耐着，低下头去”又保留礼教规训造成的羞耻。莎菲不是被动地等待男性选择，而是在欲望与压抑之间确认自己的存在，这种不稳定的表达正是女性主体意识刚刚形成时的真实形态。","link":"欲望的觉醒因此成为理解莎菲全部矛盾的前提。","page":"P43","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"她以精神契合和人格尊严为最高标准，拒绝让肉体欲望凌驾于道德判断。","evidence":"“当我明白了那使我爱慕的一个高贵的美形里，是安置着如此一个卑劣灵魂。”","location":"莎菲看清凌吉士真实面目后的心理转折。","explain":"“高贵的美形”与“卑劣灵魂”并不是简单的外貌与内在对照，它把凌吉士所代表的金钱、肉欲和自我享乐人格暴露出来。莎菲仍然受到欲望吸引，却拒绝用精神尊严换取感官满足，这种克制不是退回传统贞操观，而是新知识女性对爱情对象和自身人格提出的更高道德要求。","link":"她的拒绝因此是一次主体判断，而不只是恋爱失败。","page":"P58","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"她的孤独来自主体觉醒后缺乏能够承载新女性的社会关系和共同体。","evidence":"“我总愿意有那么一个人能了解得我清清楚楚的。”","location":"莎菲与亲友、爱人相处时反复出现的失望和独处。","explain":"莎菲要求的不是照顾，而是对完整精神世界的理解。亲友可以提供陪伴，却仍用传统标准衡量她；爱情对象也无法回应她的精神尺度，因此她越坚持自我，越缺少能够安放自我的关系。孤独并非性格孤僻，而是个体觉醒快于社会关系变革的后果。","link":"矛盾形象由此通向五四新女性的结构性困境。","page":"P40","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把莎菲的矛盾只解释为摇摆不定的性格。","只写灵肉冲突，不说明她为何拒绝凌吉士以及这一拒绝的道德意义。"],"paperSources":["《莎菲女士的日记》中缺乏自我本位意识的角色先锋性探究","丁玲《莎菲女士的日记》中女性自我意识的觉醒与困境","女性意识的觉醒：谈莎菲女士的精神困境——评丁玲《莎菲女士的日记》","启蒙、革命与女性——重读丁玲《莎菲女士的日记》"],"examVariants":["为什么不能简单把莎菲评价为消极、放荡或缺乏自我本位意识？","分析莎菲的欲望、道德判断与孤独之间的关系。"]},{"id":"saffi-awakening","work":"《莎菲女士的日记》","workKey":"saffi","type":"主题思想","title":"觉醒后的困境","prompt":"结合文本，谈谈莎菲的觉醒与困境。","keywords":["觉醒","困境","五四","新女性","自由","现实"],"thesis":"莎菲的觉醒让她看清传统束缚，却也让她陷入无路可走的现实困境。","points":[{"point":"她在思想上已经不再接受传统女性角色。","evidence":"“一个女人这样放肆，是不会得到好结果的。”","location":"莎菲面对爱情、身体和社交规范时的日记独白。","explain":"“一个女人这样放肆，是不会得到好结果的”表面上是在评价莎菲，实际暴露了外部世界对女性身体和情感的规训。莎菲意识到这句话的不合理，说明她已经不再把“好女人”的标准视为天然真理，但外界仍旧用它来界定她。","link":"但觉醒并不自动带来出路。","page":"P45","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"她的现实环境没有为她提供新的精神位置。","evidence":"“一个正经女人所做不出来的。”","location":"莎菲与朋友、凌吉士相处时产生的失望和疏离。","explain":"“一个正经女人所做不出来的”将私人选择变成道德审判，显示莎菲面对的不是抽象的新旧冲突，而是具体的人际压力和舆论限制。她即使产生了新的自我意识，也找不到新的社会位置，只能在旧标准内部反复解释和挣扎。","link":"困境来自个人觉醒与社会条件之间的落差。","page":"P46","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"丁玲借莎菲写出五四女性的真实处境。","evidence":"“我总愿意有那么一个人能了解得我清清楚楚的。”","location":"全篇日记的情绪推进和结尾的失落感。","explain":"“我总愿意有那么一个人能了解得我清清楚楚的”把人物的渴望从爱情提升到精神理解。莎菲需要的是有人进入她的内心、承认她的复杂，而不是只给她陪伴或劝告；这种理解始终落空，正说明五四女性觉醒后仍缺少能够承载她们新意识的关系和空间。","link":"结论要回到“觉醒与困境并存”这一核心判断。","page":"P40","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把觉醒写成彻底解放，忽略觉醒后仍处于困境。","只谈五四背景，不引用莎菲的具体心理和行为。"]},{"id":"saffi-psychology","work":"《莎菲女士的日记》","workKey":"saffi","type":"艺术手法","title":"心理描写的作用","prompt":"分析《莎菲女士的日记》中心理描写的作用。","keywords":["心理描写","日记体","内心","手法","作用","独白"],"thesis":"丁玲用日记体心理描写把莎菲的欲望、羞耻、清醒与孤独直接呈现在读者面前，使人物矛盾具有真实的心理层次。","points":[{"point":"日记体让人物可以不断暴露真实想法。","evidence":"“谁能懂得我呢，便能懂得这只能表现我万分之一的日记。”","location":"全篇以莎菲第一人称写成的日记段落。","explain":"“谁能懂得我”与“万分之一的日记”形成矛盾：日记让她说出不愿示人的心理，却又强调这种表达永远不完整。第一人称因此既制造了坦诚感，也制造了无法被完全理解的孤独，读者看到的是一个人不断解释自己、却始终得不到回应的过程。","link":"这使作品不同于只写外部行动的叙事。","page":"P65","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"心理描写把抽象的灵肉冲突变成可读的情绪过程。","evidence":"“然而我搜遍了，在他的各种表示中，我得不着我所等待于他的赐与……我向他摇了头。”","location":"莎菲与凌吉士关系变化前后的反复书写。","explain":"“搜遍了”“等待”“摇了头”把内心的期待、失望和拒绝连成动作链条，灵肉冲突不再停留在概念上。莎菲不是先想清楚再行动，而是在一次次试探、否定和克制中暴露自己，心理描写由此呈现出人物意识流动的真实轨迹。","link":"手法分析要说明效果，不能只报“心理描写”这个术语。","page":"P61","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"心理描写同时承担揭示主题的功能。","evidence":"“谁能懂得我呢，便能懂得这只能表现我万分之一的日记。”","location":"日记中孤独感和失望感逐渐加重的段落。","explain":"“谁能懂得我”反复出现，使日记不再只是记录事件的工具，而成为人物寻找自我的方式。莎菲越是在日记中追问，越说明现实中没有可以承接她的话，个人心理因此直接通向五四新女性被时代困住的主题。","link":"结尾要回到心理描写与主题之间的关系。","page":"P65","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["只写“大量心理描写”，没有分析具体心理变化。","引用后不解释，直接下“人物很矛盾”的结论。"]},{"id":"saffi-love","work":"《莎菲女士的日记》","workKey":"saffi","type":"人物关系","title":"精神标准与世俗人格的冲突","prompt":"分析莎菲对凌吉士由倾慕转为鄙弃的原因及其思想意义。","keywords":["凌吉士","爱情","迷恋","厌恶","欲望","选择"],"thesis":"莎菲对凌吉士的否定不只是爱情幻灭，而是新知识女性以精神契合、人格独立和道德自持为标准，抗拒以金钱、肉欲和自我享受为核心的世俗人格。","points":[{"point":"莎菲主动凝视并承认欲望，体现女性作为欲望主体的觉醒。","evidence":"“颀长的身躯，白嫩的面庞，薄薄的小嘴唇，柔软的头发。”","location":"莎菲初次接触并观察凌吉士的日记段落。","explain":"“颀长”“白嫩”“柔软”等细节来自莎菲对男性身体的主动审视，而不是男性目光对女性的塑造。她不再只是被观看、被选择的对象，而是拥有感受、欲望和评价权力的主体，这正是她与传统女性形象最明显的分野。","link":"欲望主体性的获得，为后文她拒绝凌吉士提供了精神前提。","page":"P43","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"凌吉士的卑劣在于把金钱、肉欲和自我享受当作人生目的，莎菲以精神契合和道德自持否定这种世俗人格。","evidence":"“当我明白了那使我爱慕的一个高贵的美形里，是安置着如此一个卑劣灵魂。”","location":"莎菲认清凌吉士真实面目后的心理转折。","explain":"凌吉士的美貌原本能够激起莎菲的欲望，但“卑劣灵魂”揭穿了他追求金钱、情欲和个人享乐的市侩本质。莎菲在欲望尚未消失时仍选择推开他，说明她要求爱情中必须有精神共鸣和人格尊严；拒绝凌吉士，实际上是否定一种以物质和肉欲为中心的现代男性价值观。","link":"这场拒绝把恋爱问题提升为知识女性的人格选择。","page":"P58","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"拒绝凌吉士使她守住自我，却也因为没有新的社会出路而加深孤独。","evidence":"“你是在想念那高个儿的影子呢！”","location":"莎菲与凌吉士关系结束前后的日记内容。","explain":"这句独白证明莎菲并非轻率地斩断感情，她仍会思念凌吉士的身体和暧昧经验。可是她无法为了欲望重新接受一个精神卑劣的人，只能在理性与依恋之间独自承受失落。她保住了道德和人格，却没有找到能够代替旧爱情关系的新生活，因此胜利与孤独同时出现。","link":"这一矛盾使人物超越个人恋爱，指向新女性缺少社会支持的处境。","page":"P45","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["只把关系变化写成恋爱失败或“从爱到恨”。","只写灵肉冲突，不解释凌吉士的世俗人格和莎菲的道德标准。"],"paperSources":["《莎菲女士的日记》中缺乏自我本位意识的角色先锋性探究","丁玲《莎菲女士的日记》中女性自我意识的觉醒与困境","女性意识的觉醒：谈莎菲女士的精神困境——评丁玲《莎菲女士的日记》","启蒙、革命与女性——重读丁玲《莎菲女士的日记》"],"examVariants":["分析凌吉士形象所代表的世俗价值观。","莎菲为什么在仍被吸引的情况下选择拒绝凌吉士？"]},{"id":"water-symbol","work":"《水》","workKey":"water","type":"意象象征","title":"水的多重象征","prompt":"分析《水》中“水”的象征意义。","keywords":["水","象征","洪水","灾难","压迫","反抗"],"thesis":"水既是自然灾害，也是社会压迫和群众力量的象征，丁玲借水的形态变化写出灾民的苦难与觉醒。","points":[{"point":"水首先表现为不可控制的自然灾害。","evidence":"“黄色的滔滔大水”","location":"小说开头洪水逼近、村民逃难和恐慌的段落。","explain":"“黄色的滔滔大水”以颜色和动态写出洪水吞没一切的力量，水首先是一种无法控制的自然威胁。它把村民从日常生活推入求生状态，也使人的渺小、饥饿和恐惧立即显现，为后文社会矛盾的出现建立了危机背景。","link":"但水的意义没有停留在自然灾害上。","page":"P226","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"水又象征官僚压迫下不断加剧的社会危机。","evidence":"“帆船却又带来了一些军火，并没有带救济米。”","location":"灾民与地方官员交涉、官员转移财物等情节。","explain":"“军火”与“救济米”被放在同一艘帆船上，反差直接说明权力机构面对灾民时选择的是控制而非救助。水灾在这里不再只是自然现象，它同时揭露官僚机器如何把灾难转化为维护秩序和压迫底层的工具。","link":"这层象征把自然灾害推向社会批判。","page":"P231","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"水最终转化为群众觉醒和反抗的力量。","evidence":"“比水还凶猛的，朝镇上扑了过去。”","location":"结尾群众集体行动和裸身汉子带领反抗的段落。","explain":"“比水还凶猛的，朝镇上扑了过去”将原本破坏生命的水转化为群众行动的力量。水灾的凶猛和人群的愤怒被并置，说明底层在长期压迫中完成了从求生到反抗的转变，作品的主题也从苦难书写推进到革命想象。","link":"结论必须写成多重象征，不能只写“水代表灾难”。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["只写水是自然灾害，忽略社会压迫和群众力量。","象征分析只有结论，没有引文和情节定位。"]},{"id":"water-change","work":"《水》","workKey":"water","type":"主题思想","title":"从灾难到抗争","prompt":"结合文本，分析《水》中灾民由恐惧到反抗的变化。","keywords":["灾民","恐惧","反抗","觉醒","群众","变化"],"thesis":"《水》通过灾民由恐惧到联合反抗的变化，表现底层群众在灾难和压迫中逐渐觉醒。","points":[{"point":"灾难初期，灾民主要处于恐惧和无助中。","evidence":"“大家看见了都抱头大哭……这是失去了精神，失去了勇气，只剩饥饿的一群。”","location":"洪水到来前后灾民逃难、求生的情节。","explain":"“抱头大哭”“失去了勇气”“只剩饥饿”把灾民的精神崩溃写成集体状态，而不是个别人的脆弱。灾难刚开始时，他们缺少组织、方向和行动能力，只能以哭声回应死亡，这一状态为后文觉醒留下了明显的转折起点。","link":"接下来的社会压迫改变了人物关系。","page":"P226","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"官僚冷漠和剥削让灾民看清现实。","evidence":"“帆船却又带来了一些军火，并没有带救济米。”","location":"灾民与县长、官员发生冲突的段落。","explain":"“帆船却又带来了一些军火，并没有带救济米”把灾民的期待与官府的冷漠同时呈现。求生的现实需要被军火取代，迫使他们认识到灾难背后还有阶级和权力压迫，群众的态度因此由等待救助转向怀疑和愤怒。","link":"认识的变化推动群众走向联合。","page":"P231","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"结尾的反抗说明群众力量开始形成。","evidence":"“比水还凶猛的，朝镇上扑了过去。”","location":"小说结尾群众反抗的高潮部分。","explain":"“比水还凶猛的，朝镇上扑了过去”表明分散的个人痛苦已经汇聚为集体行动。结尾的反抗不再是单纯求生，而是把灾害积压的愤怒转向造成困境的权力秩序，群众力量由此成为小说最明确的主题方向。","link":"结尾要点明群众觉醒与作品的社会意义。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["只概括变化，不写每个阶段的文本依据。","把反抗写成突然发生，忽略压迫推动变化的过程。"]},{"id":"water-hero","work":"《水》","workKey":"water","type":"人物形象","title":"裸身汉子与群众形象","prompt":"分析《水》中裸身汉子或群众形象。","keywords":["裸身汉子","群众","群像","反抗","力量","领袖"],"thesis":"裸身汉子不是孤立的英雄，而是群众力量逐渐形成的集中体现。","points":[{"point":"群众在灾难中承受最直接的苦难。","evidence":"“大家看见了都抱头大哭……这是失去了精神，失去了勇气，只剩饥饿的一群。”","location":"洪水灾害和村民逃难段落。","explain":"“抱头大哭”“失去勇气”写出群众首先以受害者身份出现，他们没有能力阻止洪水，也无法得到有效救济。作品先承认底层人的脆弱和恐惧，使后面的觉醒不显突兀，也让群众形象具有真实的人性重量。","link":"苦难为后续反抗积蓄力量。","page":"P226","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"群体在压迫中逐渐由分散走向联合。","evidence":"“哭有什么用，死的死了，哭得转来吗？不死的总得鼓着气想法，未必也死去吗？”","location":"灾民与官僚冲突的情节。","explain":"“哭有什么用”连续的反问打断了集体绝望，把悲痛转成对行动的追问。原本各自逃命的灾民开始围绕粮食和生存商议，个人情绪就此进入共同处境，群体的联合并非口号，而是在具体危机中被逼出来的选择。","link":"裸身汉子的行动正是这种转化的表现。","page":"P228","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"裸身汉子代表群体的行动意志。","evidence":"“比水还凶猛的，朝镇上扑了过去。”","location":"小说结尾的高潮段。","explain":"“比水还凶猛的”把裸身汉子与群众行动合为一体，说明反抗不是个人英雄行为。人物的身体力量被赋予群体意志，水灾造成的破坏最终转化为冲击压迫秩序的动能，群众成为推动情节和主题转变的主体。","link":"分析人物时要把他放回群众关系，不只写个人性格。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把裸身汉子写成传统个人英雄，忽略群众基础。","只描述人物动作，不解释动作的象征意义。"]},{"id":"water-theme","work":"《水》","workKey":"water","type":"主题思想","title":"灾难与社会批判","prompt":"分析《水》的主题思想。","keywords":["主题","灾难","社会批判","阶级","群众","觉醒"],"thesis":"《水》以洪水灾难为表层事件，揭示官僚压迫下底层群众的苦难、觉醒与反抗。","points":[{"point":"作品首先呈现自然灾害带来的生存危机。","evidence":"“黄色的滔滔大水”","location":"小说开篇洪水灾害的描写。","explain":"“黄色的滔滔大水”一开始就写出灾害对生命、住所和粮食的直接破坏。底层民众没有能力抵御洪水，也没有足够的资源自救，作品把自然灾害与贫困、脆弱的生活条件联系起来，使生存危机成为社会书写的起点。","link":"作品并未把灾难只当作自然现象。","page":"P226","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"官僚不作为把自然灾害推向社会悲剧。","evidence":"“帆船却又带来了一些军火，并没有带救济米。”","location":"官员处理灾情、灾民求助受阻的情节。","explain":"“军火”替代“救济米”直接揭示天灾背后的人祸。官员和军队并没有把灾民的生命放在首位，反而用武器维持旧有秩序，这种选择把自然灾害推向社会悲剧，也把批判对象从洪水转向权力结构。","link":"社会压迫进一步推动群众态度变化。","page":"P231","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"群众觉醒和反抗是作品的主题方向。","evidence":"“比水还凶猛的，朝镇上扑了过去。”","location":"小说结尾群众冲向镇上的段落。","explain":"“比水还凶猛的，朝镇上扑了过去”让群众从被灾难推着走的人变成主动冲击秩序的人。小说没有停在揭露苦难，而是写出压迫如何积聚力量，群众觉醒和反抗因此构成作品从现实批判走向革命叙事的核心路线。","link":"结论应同时覆盖灾难、批判和觉醒三层。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["只写灾难主题，删掉社会批判和群众觉醒。","只写主题判断，不回到情节和人物。"]},{"id":"hospital-luping","work":"《在医院中》","workKey":"hospital","type":"人物形象","title":"陆萍的性格与理想","prompt":"分析陆萍的人物形象。","keywords":["陆萍","性格","理想","批判","善良","坚持"],"thesis":"陆萍是怀抱革命理想的青年知识分子，她在艰苦环境中坚持工作，也因清醒和批判精神与医院现实不断冲突。","points":[{"point":"陆萍有明确的革命理想和责任感。","evidence":"“她总是爱飞。总不满于现状。”","location":"陆萍初到医院、投入工作的情节。","explain":"“爱飞”把陆萍写成不愿停留、不断追求变化的人，“不满于现状”进一步说明她的理想不是抽象口号，而是对现实缺陷的敏感。正因为她总想改变环境，进入医院后才会立刻关注管理、卫生和医疗问题。","link":"理想与环境的矛盾由此展开。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"她能吃苦，在恶劣条件中仍然坚持。","evidence":"“为了不愿病人产妇多受苦痛，便自己去替几个开刀了的，发炎的换药。”","location":"陆萍在严寒中奔波、照顾病人的段落。","explain":"“不愿病人产妇多受苦痛”交代了她行动的情感动机，“自己去替”则显示她愿意承担最琐碎甚至最脏累的工作。陆萍的责任感不是通过宣言表现，而是在护理、换药和奔波中落实，这使她的理想具有身体经验支撑。","link":"坚韧性格也使她面对问题时不愿妥协。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"她的善良和批判精神使她与环境发生冲突。","evidence":"“她已经成为医院里小小的怪人，被大多数人用异样的眼睛看着。”","location":"陆萍照顾产妇、新生儿，以及批评医院问题的情节。","explain":"成为“小小的怪人”说明陆萍没有在群体压力中放弃判断。她因关心病人和提出意见而被异样看待，这种孤立既证明医院环境的排斥，也反衬她善良、认真和不肯随俗的性格。","link":"结尾要写出陆萍与环境之间的张力。","page":"P387","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["只把陆萍写成善良坚强的医护人员，忽略批判精神。","把身份写成产婆或普通护士，忽略她作为青年知识分子的处境。"]},{"id":"hospital-growth","work":"《在医院中》","workKey":"hospital","type":"主题思想","title":"陆萍的成长","prompt":"分析陆萍在医院中的成长变化。","keywords":["成长","变化","转折","老兵","挫折","理想"],"thesis":"陆萍在医院中的经历不是简单的理想受挫，而是在冲突、挫折和他人启发中重新理解革命工作的过程。","points":[{"point":"进入医院初期，陆萍的理想带有强烈的改造冲动。","evidence":"“她已经成为医院里小小的怪人，被大多数人用异样的眼睛看着。”","location":"陆萍初到医院后的工作愿望和观察。","explain":"“小小的怪人”写出陆萍的理想一开始以强烈改革冲动出现。她看到医院的问题便急于纠正，却没有充分估计制度、人际关系和现实条件的复杂，因此她的热情很快转化为与环境的正面碰撞。","link":"现实中的阻力随即出现。","page":"P387","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"挫折让她逐渐看到个人理想与环境之间的距离。","evidence":"“记挂着头天晚上黎涯送来的消息……似乎什么兴趣都没有了，只想就这么躺着不动。”","location":"陆萍与医院同事、管理人员发生矛盾的情节。","explain":"“什么兴趣都没有了，只想就这么躺着不动”写出受挫后的疲惫和失控，但前面仍“记挂着头天晚上黎涯送来的消息”，说明责任并未完全消失。陆萍开始意识到，个人热情不足以改变现实，理想必须经过挫折和关系的磨合。","link":"关键转折需要落到具体人物和事件上。","page":"P393","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"没有脚的老兵等人使她重新理解坚持和革命工作。","evidence":"“记挂着头天晚上黎涯送来的消息……”","location":"陆萍遇到没有脚的老兵并受到触动的情节。","explain":"她受伤后仍牵挂朋友和病人，说明成长并不等于变得冷漠。陆萍逐渐明白，坚持革命工作不只是保持热情，还要在具体的人、具体的事情和现实的限制中重新安排自己的行动。","link":"结尾要落在她更成熟、更踏实的认识上。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把成长写成从坏人变好人，人物层次会被简化。","只写受伤和挫折，不写转折事件如何改变陆萍。"]},{"id":"hospital-environment","work":"《在医院中》","workKey":"hospital","type":"艺术手法","title":"环境描写的作用","prompt":"分析《在医院中》环境描写的作用。","keywords":["环境描写","医院","寒冷","混乱","气氛","作用"],"thesis":"医院环境既是人物活动的现实空间，也映照出革命理想与落后现实之间的冲突。","points":[{"point":"寒冷和简陋写出物质条件的困难。","evidence":"“窗户外无声地飘着雪片。”","location":"陆萍在冬天奔波的段落。","explain":"“窗户外无声地飘着雪片”既写出陕北冬天的寒冷，也用“无声”营造出封闭和压抑的气氛。自然环境的艰苦与医院条件的落后互相映照，使陆萍每一次奔波都带上实际的身体重量。","link":"环境也会影响人物对工作的感受。","page":"P390","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"医院管理的混乱营造压抑气氛。","evidence":"“她替她们要清洁的被袄，暖和的住室，滋补的营养，有次序的生活。”","location":"陆萍观察医院日常工作的情节。","explain":"“清洁的被袄”“暖和的住室”“滋补的营养”“有次序的生活”都是最基本的医疗与生活需要，却被她反复争取。所求之物越普通，越说明医院管理的混乱不是抽象问题，而是直接落在病人日常处境中的失职。","link":"环境由此成为冲突的推力。","page":"P387","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"环境与人物形成对照，突出理想主义的力量和困境。","evidence":"“她已经成为医院里小小的怪人，被大多数人用异样的眼睛看着。”","location":"陆萍救人、受挫和反思的连续情节。","explain":"“异样的眼睛”把环境压力具体化为群体注视。陆萍的坚持越突出，周围人的冷淡越明显，环境描写因此不只是背景，而是直接参与到人物孤立、成长和主题冲突之中。","link":"结尾回答环境描写如何服务人物和主题。","page":"P387","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["只摘抄环境，不解释环境与人物的关系。","只写寒冷，忽略医院制度和人际环境。"]},{"id":"hospital-intellectual","work":"《在医院中》","workKey":"hospital","type":"人物关系","title":"知识分子与医院环境","prompt":"分析陆萍与医院环境的冲突。","keywords":["知识分子","医院","冲突","环境","改革","误解"],"thesis":"陆萍与医院的冲突，是青年知识分子的改革热情同落后环境、复杂人际关系之间的冲突。","points":[{"point":"陆萍带着改造现实的愿望进入医院。","evidence":"“她常常为了他们的生活管理，和医疗的改善与很多人发生冲突。”","location":"陆萍到医院初期的工作表现。","explain":"“为了他们的生活管理，和医疗的改善”说明陆萍的冲突来自公共职责，而不是私人脾气。她把现代医学标准带进边区医院，希望通过管理改革减少病人的痛苦，因此她的抗议具有明确的专业理想。","link":"冲突不是个人恩怨，而是理想与环境的碰撞。","page":"P387","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"医院中的制度化问题和人际冷漠让她的努力受阻。","evidence":"“小资产阶级意识、知识分子的英雄主义、自由主义等等的帽子都往她头上戴。”","location":"陆萍与同事、管理者发生矛盾的情节。","explain":"“小资产阶级意识”“英雄主义”“自由主义”等标签把具体问题转化为身份批判。医院没有讨论她提出的医疗问题，反而用政治帽子消解她的意见，这既显示个体表达受阻，也暴露制度内部缺少自我纠正能力。","link":"这让陆萍不得不重新思考怎样工作。","page":"P394","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"冲突最终推动陆萍成熟。","evidence":"“她总是爱飞，总不满于现状。”","location":"小说后段陆萍反思和转变的部分。","explain":"结尾仍保留“爱飞”和“不满于现状”的行动气质，说明陆萍并未被现实彻底击垮。她经过冲突后不再只是凭冲动改革，而是在理解环境和自身局限之后继续寻找实践机会，人物由此显出成熟后的韧性。","link":"结尾要回扣知识分子如何面对现实。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把冲突写成陆萍与某个人的私人矛盾。","只写环境落后，不写陆萍自身的成长。"]},{"id":"fortress-fang","work":"《围城》","workKey":"fortress","type":"人物形象","title":"方鸿渐的性格困境","prompt":"分析方鸿渐的人物形象。","keywords":["方鸿渐","性格","软弱","虚荣","围城","失败"],"thesis":"方鸿渐并非单纯的无能者，他有自省和善意，却缺少行动力，在爱情、事业和婚姻中不断被自己的软弱推入新的围城。","points":[{"point":"方鸿渐具有自省能力，却缺少改变现实的行动力。","evidence":"“小小一方纸能把一个人的空疏、寡陋、愚笨都掩盖起来。”","location":"买假文凭、回国后面对家庭与工作安排的情节。","explain":"“小小一方纸”把文凭写成遮盖“空疏、寡陋、愚笨”的屏障，方鸿渐明白自己的能力和身份并不相称，却仍选择用虚假证明维持体面。他的清醒使他能够自嘲，也使他无法像真正无知的人那样心安，但清醒始终没有转化为改变行动。","link":"这构成他反复进入围城的内在原因。","page":"P10","edition":"人民文学出版社软皮版","chapter":"第一章","searchPhrase":"小小一方纸","pdfPage":"19"},{"point":"他的爱情选择体现犹豫和被动的性格。","evidence":"“这姓方的不合式，气量太小，把钱看得太重。”","location":"方鸿渐与苏文纨、唐晓芙、孙柔嘉的关系变化。","explain":"“气量太小”“把钱看得太重”出自别人的评价，却揭示方鸿渐在婚恋中的被动位置。他无法坚定选择，也无法有效处理误会和外部压力，最后只能接受关系变化，这说明他的失败并非单一事件，而是犹豫性格在现实关系中的连续后果。","link":"爱情围城由此成为人物性格的投射。","page":"P44","edition":"人民文学出版社软皮版","chapter":"第二章","searchPhrase":"这姓方的不合式","pdfPage":"52"},{"point":"他的事业困境体现知识分子的无力。","evidence":"“从没听过三闾大学，想是个战后新开的大学。”","location":"方鸿渐赴三闾大学任教及婚姻开始的情节。","explain":"“从没听过三闾大学”写出他对新环境的陌生和缺少判断。进入陌生大学后，他既没有真正的学术资本，也没有足够的处世能力，只能随着人情和职位安排漂流，事业困境因此体现出知识分子的无根与无力。","link":"结尾要把人物放回“围城”主题。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第三章","searchPhrase":"从没听过三闾大学","pdfPage":"110"}],"traps":["只写方鸿渐懦弱，忽略他能自省、有善意的一面。","把人物失败全部归因于外部环境，不分析他的选择。"]},{"id":"fortress-satire","work":"《围城》","workKey":"fortress","type":"艺术手法","title":"讽刺艺术","prompt":"分析《围城》的讽刺艺术。","keywords":["讽刺","反讽","比喻","虚伪","知识分子","手法"],"thesis":"《围城》通过反讽、比喻和人物对照，揭示知识分子在社会生活中的虚荣、虚伪与无力。","points":[{"point":"假文凭情节讽刺知识分子的虚荣。","evidence":"“小小一方纸能把一个人的空疏、寡陋、愚笨都掩盖起来。”","location":"方鸿渐留学归来和求职初期相关情节。","explain":"“小小一方纸能把一个人的空疏、寡陋、愚笨都掩盖起来”表面是俏皮判断，实际把文凭和真实能力之间最荒诞的裂缝暴露出来。方鸿渐买假学历，社会却愿意相信那张纸，讽刺因此同时指向个人的虚荣和群体对学历的迷信。","link":"讽刺首先指向个体人格，也延伸到社会风气。","page":"P10","edition":"人民文学出版社软皮版","chapter":"第一章","searchPhrase":"小小一方纸","pdfPage":"19"},{"point":"三闾大学的情节讽刺学术圈的虚伪。","evidence":"“这姓方的不合式，气量太小，把钱看得太重，给我一试就露出本相。”","location":"方鸿渐到三闾大学任教后的校园与人事情节。","explain":"“气量太小，把钱看得太重”把婚恋评价落在金钱和性情上，使人物关系显出世俗算计。接受这种评价的人自认为看透方鸿渐，却也暴露自己的势利，讽刺在双方之间来回折射，不停留在单一人物的道德批判。","link":"这里体现作品对社会群体的批判。","page":"P44","edition":"人民文学出版社软皮版","chapter":"第二章","searchPhrase":"这姓方的不合式","pdfPage":"52"},{"point":"婚姻围城和人物关系用比喻强化讽刺效果。","evidence":"“结婚仿佛金漆的鸟笼，笼子外面的鸟想住进去，笼内的鸟想飞出来。”","location":"方鸿渐爱情、婚姻和职业连续受挫的情节线。","explain":"“金漆的鸟笼”以美丽外壳包住封闭空间，把婚姻的向往、进入和逃离压缩成一个可见形象。比喻既写出人物欲望的循环，也让他们自以为自由的选择显出荒诞，讽刺因此具有结构性和普遍性。","link":"结尾要点明讽刺不是搞笑，而是对人生处境的揭示。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第三章","searchPhrase":"结婚仿佛金漆的鸟笼","pdfPage":"101"}],"traps":["只写“运用比喻和讽刺”，没有解释讽刺指向什么。","把讽刺理解成单纯搞笑，忽略其中的社会批判。"]},{"id":"fortress-marriage","work":"《围城》","workKey":"fortress","type":"主题思想","title":"婚姻围城","prompt":"结合文本，分析《围城》中婚姻围城的含义。","keywords":["婚姻","围城","爱情","失望","选择","方鸿渐"],"thesis":"婚姻围城在小说中表现为对理想生活的想象和进入现实后的失望，方鸿渐与孙柔嘉的婚姻集中写出这种困境。","points":[{"point":"婚姻在人物想象中代表着理想和归属。","evidence":"“结婚仿佛金漆的鸟笼，笼子外面的鸟想住进去，笼内的鸟想飞出来。”","location":"方鸿渐与苏文纨、唐晓芙、孙柔嘉关系发展的情节。","explain":"“笼子外面的鸟想住进去”写出人物对婚姻的想象：他们把进入关系等同于获得归属和完整。鸟笼的“金漆”又暗示这种理想带有体面和虚荣，方鸿渐期待婚姻解决人生问题，却并未准备好承担关系中的责任。","link":"期待越高，进入现实后的落差越明显。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第三章","searchPhrase":"结婚仿佛金漆的鸟笼","pdfPage":"101"},{"point":"进入婚姻后，日常矛盾和现实压力打破理想。","evidence":"“这姓方的不合式，气量太小，把钱看得太重，给我一试就露出本相。”","location":"方鸿渐与孙柔嘉结婚后相处的情节。","explain":"“不合式”“气量太小”“把钱看得太重”把婚姻选择变成家世、金钱和性情的综合计算。婚前的期待一旦进入日常，人物缺点和现实压力便不断放大，婚姻于是不再是浪漫结局，而成为另一种需要应对的困境。","link":"这正是围城隐喻在婚姻线上的体现。","page":"P44","edition":"人民文学出版社软皮版","chapter":"第二章","searchPhrase":"这姓方的不合式","pdfPage":"52"},{"point":"婚姻围城与事业围城互相映照。","evidence":"“城外的人想冲进去，城里的人想逃出来。”","location":"方鸿渐在三闾大学任教并进入婚姻阶段的情节。","explain":"“城外的人想冲进去，城里的人想逃出来”把婚姻与职业、人生选择放在同一结构中。方鸿渐在三闾大学想离开，进入婚姻后又面对新的失望，反复的进入和逃离说明围城不是某一段关系，而是人物面对欲望与现实时的普遍心理。","link":"结尾要回到“围城”作为人生困境的象征。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第三章","searchPhrase":"城外的人想冲进去","pdfPage":"101"}],"traps":["只写某段感情失败，忽略婚姻围城的普遍含义。","只讲婚姻，不断开事业围城的互相映照。"]},{"id":"fortress-parallel","work":"《围城》","workKey":"fortress","type":"人物关系","title":"赵辛楣与方鸿渐","prompt":"分析赵辛楣与方鸿渐的平行关系及其作用。","keywords":["赵辛楣","方鸿渐","平行","对照","三闾大学","知识分子"],"thesis":"赵辛楣和方鸿渐构成平行对照关系，两人共同暴露知识分子的困境，也通过性格和处世方式的差异加深人物塑造与社会讽刺。","points":[{"point":"两人都卷入爱情和职业困境，构成平行线。","evidence":"“赵辛楣和鸿渐拉拉手，傲兀地把他从头到脚看一下。”","location":"方鸿渐与赵辛楣在国内相处、赴三闾大学任教的情节线。","explain":"“拉拉手”后的“傲兀”审视写出赵辛楣和方鸿渐初见时的暗中较劲。两人都试图在爱情和身份中确认自己，也都会进入职业和婚姻困境，这种相似处境使他们成为互相映照的平行人物。","link":"平行并不意味着人物完全相同。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第三章","searchPhrase":"赵辛楣和鸿渐拉拉手","pdfPage":"59"},{"point":"两人的性格和处世方式形成对照。","evidence":"“他的傲慢无礼，是学墨索里尼和希特勒接见小国外交代表开谈判时的态度。”","location":"两人处理爱情、工作和人际关系的相关情节。","explain":"将赵辛楣的傲慢写成独裁者接见外交代表，夸张而带嘲讽，立刻显出他的自信、强势和权力表演。方鸿渐的犹疑恰好与之形成对照，两人的性格差异不仅制造幽默，也让个人选择如何影响命运变得清楚。","link":"人物关系因此承担塑造和讽刺的双重功能。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第三章","searchPhrase":"他的傲慢无礼","pdfPage":"62"},{"point":"两人的关系映射三闾大学和知识圈的虚伪。","evidence":"“从没听过三闾大学，想是个战后新开的大学。”","location":"三闾大学教师群体和人事矛盾情节。","explain":"“三闾大学”把他们共同带入一个陌生而充满人事算计的空间。赵辛楣与方鸿渐的交往不只是私人友谊，还映出知识圈中的职位、面子和派系关系，个人关系由此扩展为群体批判。","link":"结尾要回到作品对知识分子处境的整体表现。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第三章","searchPhrase":"从没听过三闾大学","pdfPage":"110"}],"traps":["只并列写两个人，不说明二者如何对照。","把赵辛楣写成完人，忽略他也处在同样的社会困境中。"]},{"id":"saffi-loneliness","work":"《莎菲女士的日记》","workKey":"saffi","type":"主题思想","title":"莎菲的孤独","prompt":"分析莎菲孤独感的来源及其意义。","keywords":["孤独","寂寞","无人理解","疾病","蕴姊","新女性"],"thesis":"莎菲的孤独既来自病体和亲友的不理解，也来自她觉醒后找不到同路人的精神处境。","points":[{"point":"疾病和独居放大了莎菲的寂寞。","evidence":"“我总愿意有那么一个人能了解得我清清楚楚的。”","location":"莎菲日常生活中反复出现的独处与病中场景。","page":"P40","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"“了解得我清清楚楚”是莎菲对关系质量的最高要求，她需要的不是安慰或照顾，而是有人能够准确理解她的心理。疾病和独居让她有更多时间反观自身，也让她发现身边的人只能提供表面的关怀，寂寞因此由生活处境转化为精神困境。","link":"孤独因此成为人物心理和时代困境的共同表现。"},{"point":"亲友的照顾无法真正理解她的精神需求。","evidence":"“一个女人这样放肆，是不会得到好结果的。”","location":"莎菲与毓芳、云霖、苇弟相处的日记段落。","page":"P45","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"“一个女人这样放肆”说明亲友的照顾并不等于接纳，他们仍以传统性别标准衡量莎菲。她越感到自己被误解，就越退回私人感受，表面上的陪伴因此无法消除内在的隔膜，反而不断提醒她与周围人的精神距离。","link":"这使她不断退回日记和自我内部。"},{"point":"蕴姊之死让莎菲失去唯一可能理解自己的人。","evidence":"“谁能懂得我呢……”","location":"关于蕴姊去世和莎菲继续写日记的段落。","page":"P65","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"“谁能懂得我呢”把一个具体的失去写成精神世界的空洞。蕴姊之死带走的不仅是一个亲友，也是莎菲可能获得理解的希望；此后日记成为她维持自我、对抗沉默的方式，孤独也由此成为她觉醒之后无法摆脱的处境。","link":"结尾应把个人孤独与五四新女性的处境联系起来。"}],"traps":["只写莎菲性格孤僻，忽略社会和时代原因。","把孤独和爱情困惑混为一谈，没有分层。"]},{"id":"saffi-diary-form","work":"《莎菲女士的日记》","workKey":"saffi","type":"艺术手法","title":"日记体的叙事效果","prompt":"分析《莎菲女士的日记》的日记体特征及其表达效果。","keywords":["日记体","第一人称","私人性","即时性","独语","真实感"],"thesis":"日记体让莎菲的私人情感、即时情绪和内心独语直接呈现，使人物矛盾具有现场感和真实感。","points":[{"point":"私人性使莎菲能够说出不愿公开的欲望与羞耻。","evidence":"“我只得忍耐着，低下头去。”","location":"全篇带有自我倾诉性质的日记内容。","page":"P43","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"“我只得忍耐着，低下头去”把无法公开的欲望和当下的自我压制写在同一个瞬间。日记没有经过事后修饰，使读者直接看到莎菲羞耻、冲动与克制交叠的心理，第一人称的私人性因此成为人物真实感的重要来源。","link":"私人性也使作品具有心理暴露的冲击力。"},{"point":"即时性让情绪变化呈现为连续过程。","evidence":"“我只得忍耐着，低下头去。”","location":"莎菲与凌吉士关系变化前后的日记。","page":"P43","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"同一句自我压抑在不同日期中反复出现，说明情绪并不是一次性的宣泄，而是持续回返的心理过程。日记按日期推进，让期待、失望、羞愧和反抗各自占有一刻，读者由此能够追踪莎菲如何在一个个瞬间里重新认识自己。","link":"这使人物矛盾具有动态过程。"},{"point":"独语性把人物内心冲突写成两个自我的争辩。","evidence":"“一个女人这样放肆，是不会得到好结果的。”","location":"“难道我去找他吗”等内心争辩。","page":"P45","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"“一个女人这样放肆”是外部规范进入莎菲内心的声音，与她的欲望形成自我争辩。日记让这两种声音同时被记录，冲突不必依靠旁白解释，人物在自问自答中呈现出分裂而清醒的主体。","link":"结尾要回到形式与主题的统一。"}],"traps":["只写第一人称，不分析它对心理、节奏和主题的作用。","把日记体当作内容复述。"]},{"id":"water-contrast","work":"《水》","workKey":"water","type":"艺术手法","title":"《水》中的对比","prompt":"分析《水》中对比手法的运用。","keywords":["对比","官民","灾民","军火","希望","反抗"],"thesis":"《水》通过官与民、希望与失望、求生与反抗的对比，揭示天灾背后的人祸并推动群众觉醒。","points":[{"point":"灾民的痛苦与官员的冷漠形成对比。","evidence":"“帆船却又带来了一些军火，并没有带救济米。”","location":"长岭岗镇外士兵警戒、灾民得不到救济的段落。","page":"P231","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"灾民急需粮食，而帆船带来的却是军火，两种物资构成直接的官民对照。这个细节不是单纯的情节转折，它揭示权力机关面对灾民时选择的是防范和镇压，从而使自然灾害迅速转化为社会批判。","link":"矛盾推动群众态度发生变化。"},{"point":"赈济希望与军火现实形成反差。","evidence":"“帆船却又带来了一些军火，并没有带救济米。”","location":"灾民等待救济、看见船只靠岸的段落。","page":"P231","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"“救济米”本是灾民最具体的希望，“军火”则代表官府对灾民的戒备。希望与现实的落差越强，群众越容易看清自己的处境；对比在这里不仅制造冲突，也完成了从等待救助到准备反抗的心理转折。","link":"失望由此转化为愤怒。"},{"point":"水的凶猛与人群反抗形成力量对照。","evidence":"“比水还凶猛的，朝镇上扑过去。”","location":"小说第四部分和结尾高潮。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"水曾经摧毁村庄，而群众最终“比水还凶猛”地冲向镇上，两个力量意象形成反转。前者代表不可控制的灾难，后者代表人组织起来的行动，对比使小说的主题从承受苦难转向创造改变现实的力量。","link":"对比完成意象意义的反转。"}],"traps":["只列对比对象，不解释对比产生什么效果。","把官民对比写成简单善恶。"]},{"id":"water-wangdabao","work":"《水》","workKey":"water","type":"人物形象","title":"王大保和李塌鼻","prompt":"分析王大保和李塌鼻在灾民群体中的作用。","keywords":["王大保","李塌鼻","群众","求生","觉醒","组织"],"thesis":"王大保和李塌鼻分别以号召力和现实经验推动群众从绝望求生走向集体反抗。","points":[{"point":"王大保用直接有力的话语打破群体绝望。","evidence":"“哭有什么用，死的死去了，哭得转来吗？”","location":"洪水过后灾民抱头大哭、王大保站出来讲话的段落。","page":"P228","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"“哭有什么用”先用反问否定了无效的悲痛，接着用“不死的总得鼓着气想法”把注意力拉回现实。王大保的话不是在安慰灾民，而是在要求他们寻找办法，因此他承担了把绝望转成行动的社会动员功能。","link":"他是群众情绪转折的推动者。"},{"point":"李塌鼻用对地主存粮的了解增强行动信心。","evidence":"“打开他们的仓，够我们一渡口的人吃几年。”","location":"灾民商议前往长岭岗求生的段落。","page":"P228","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"“打开他们的仓，够我们一渡口的人吃几年”把抽象的求生愿望落实为具体方案。李塌鼻了解地主存粮，说明底层经验本身就是行动资源；他提供的不是豪言，而是让群众相信反抗可行的现实依据。","link":"他代表底层经验与实干力量。"},{"point":"两人共同推动群体从求生走向反抗。","evidence":"“老子们家破人亡，就留下这条命，还得算算账呢！”","location":"前往长岭岗及发现官府镇压灾民的前后情节。","page":"P228","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"“家破人亡”“还得算算账”把灾民的损失明确转化为对压迫者的追讨。王大保的号召和李塌鼻的现实判断在这一刻合流，个人求救变成群体清算，群众反抗因此有了情绪基础和组织方向。","link":"分析人物时要落到群体作用，不只写性格。"}],"traps":["把王大保写成孤胆英雄，忽略群众反应。","只写台词，不分析语言如何推动集体情绪。"]},{"id":"hospital-group","work":"《在医院中》","workKey":"hospital","type":"人物形象","title":"医院人物群像","prompt":"分析《在医院中》医院人物群像的作用。","keywords":["院长","黄守荣","张芳子","群像","官僚","冷漠"],"thesis":"医院人物群像分别代表外行领导、敷衍中层、麻木同事和疏离专业人员，共同构成陆萍改革受阻的现实环境。","points":[{"point":"院长代表外行领导和官僚作风。","evidence":"“她已经成为医院里小小的怪人，被大多数人用异样的眼睛在看着。”","location":"陆萍提交意见书、与院长发生接触的情节。","page":"P387","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"陆萍被群像视为“怪人”，说明医院内部已经形成一套排斥异见的共同眼光。院长的官僚、同事的敷衍和群众的麻木不需要逐一说明，单是这种一致排斥，就足以显示改革者为何难以获得制度支持。","link":"这构成陆萍改革失败的外部原因。"},{"point":"张芳子等同事代表麻木与随波逐流。","evidence":"“她已经成为医院里小小的怪人，被大多数人用异样的眼睛在看着。”","location":"陆萍与同事工作相处及提出意见的情节。","page":"P387","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"“大多数人”的异样目光把张芳子等同事的随波逐流写成集体氛围。他们未必都主动迫害陆萍，却通过默认和旁观维持了旧秩序，使个人热情无法转化为共同改变，群体麻木因此成为改革受阻的重要原因。","link":"群像揭示了环境改造的复杂。"},{"point":"群像共同突出陆萍的孤立与坚持。","evidence":"“她已经成为医院里小小的怪人，被大多数人用异样的眼睛在看着。”","location":"医院对陆萍的议论和排斥情节。","page":"P387","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"群像的排斥将陆萍置于孤立位置，也使她的坚持被反衬得更清楚。周围人越冷淡，她照顾病人、提出意见和维护专业标准的选择越显出责任感，人物与环境之间的张力由此推动主题发展。","link":"分析群像要回到主人公处境和主题。"}],"traps":["只列人物名字，不写他们各自代表的问题。","群像分析与陆萍无关，文章被拆成人物介绍。"]},{"id":"hospital-gas","work":"《在医院中》","workKey":"hospital","type":"主题思想","title":"手术室中毒事件","prompt":"分析手术室中毒事件在小说中的作用。","keywords":["中毒","手术室","黎涯","冲突","成长","制度问题"],"thesis":"中毒事件把医院长期存在的设备、管理与人际问题集中引爆，也迫使陆萍重新思考个人理想和革命现实的关系。","points":[{"point":"事件暴露医院设备和管理的严重问题。","evidence":"“手术室不装煤炉怎么行呢？”","location":"陆萍申请火炉、手术室烧炭和事故发生的情节。","page":"P390","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"“手术室不装煤炉怎么行呢”以近乎质问的语气指出最基本的安全条件缺失。中毒并非偶然事故，而是管理疏忽和物质落后积累到极点后的爆发，事件因此成为医院问题无法继续被掩盖的节点。","link":"这使得陆萍此前的批评得到事实印证。"},{"point":"事件让陆萍与环境的矛盾全面爆发。","evidence":"“似乎什么兴趣都没有了，只想就这么躺着不动。”","location":"中毒事件后陆萍生病、被议论和反思的段落。","page":"P393","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"“什么兴趣都没有了，只想就这么躺着不动”写出事故后陆萍的身体崩溃和心理低落。此前她还能通过行动抵抗环境，此时连维持兴趣都变得困难，说明个人理想与冷漠现实的矛盾已经被推到极限。","link":"冲突推动人物进入新的认识阶段。"},{"point":"事件成为陆萍成长的关键转折。","evidence":"“记挂着头天晚上黎涯送来的消息……”","location":"她醒来后记挂黎涯和病人的段落。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"“记挂着头天晚上黎涯送来的消息”说明陆萍在最低谷仍没有切断与他人的联系。责任感没有在事故中消失，只是从单纯的改革热情转向更复杂的理解，她因此能够把这次打击转化为重新认识现实的起点。","link":"成长不是热情消失，而是对现实有更复杂的理解。"}],"traps":["只复述事故经过，不分析事件对人物和主题的作用。","把事故写成偶然，忽略此前铺垫。"]},{"id":"hospital-ending","work":"《在医院中》","workKey":"hospital","type":"主题思想","title":"结尾与成长方向","prompt":"分析《在医院中》结尾对陆萍成长的意义。","keywords":["结尾","成长","革命","反思","机会","理想"],"thesis":"结尾没有把陆萍写成被现实击垮的人，而是让她在反思后仍准备回到工作中，显示成长后的坚持更成熟。","points":[{"point":"结尾让陆萍从情绪失控回到理性反思。","evidence":"“她需要静静的睡眠，可是被一种不知是什么东西压迫着。”","location":"小说后段陆萍的反思和情绪变化。","page":"P393","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"“需要静静的睡眠”与“不知是什么东西压迫着”并置，写出陆萍身体疲惫、精神仍未得到安宁。她不再只把问题归咎于医院，也开始感受自身与环境之间难以摆脱的压力，理性的重新认识正是在这种不安中发生。","link":"这使人物没有停留在受害者位置。"},{"point":"朋友的关怀帮助她恢复行动意志。","evidence":"“她总是爱飞。总不满于现状。”","location":"陆萍与朋友谈心后恢复状态的部分。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"“爱飞”“不满于现状”再次出现时，已经不再只是早期冲动，而成为经历挫折后仍然保留的行动意志。朋友和病人的存在使她意识到自己不是孤立个体，个人成长因此离不开社会关系和精神支持。","link":"革命不是孤立的个人理想。"},{"point":"最后仍准备抓住下一场手术机会，体现坚持。","evidence":"“她准备着如何可以使自己不失去这一个机会。”","location":"小说结尾附近。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"“如何可以使自己不失去这一个机会”把结尾落在具体行动上。陆萍没有停留在受伤和抱怨里，而是准备重新进入手术工作，说明成长后的坚持不是宏大宣言，而是在现实限制中继续选择承担。","link":"结尾应落到理想经过现实磨炼后的延续。"}],"traps":["把结尾理解成理想彻底失败。","只写事件结束，不回答成长了什么。"]},{"id":"fortress-diploma","work":"《围城》","workKey":"fortress","type":"主题思想","title":"假文凭的象征意义","prompt":"分析方鸿渐假文凭事件的讽刺意义。","keywords":["假文凭","克莱登","虚荣","学历","知识分子","围城"],"thesis":"假文凭既讽刺社会对学历的盲目崇拜，也象征方鸿渐用虚荣掩盖空疏、从而进入人生围城的起点。","points":[{"point":"假文凭掩盖了方鸿渐的空疏和无能。","evidence":"“小小一方纸能把一个人的空疏、寡陋、愚笨都掩盖起来。”","location":"方鸿渐决定购买学位、回国前面对文凭问题处。","page":"P10","edition":"人民文学出版社软皮版","explain":"“空疏、寡陋、愚笨”本应决定一个人的能力，却被“小小一方纸”轻易遮住。方鸿渐明知文凭虚假，仍依赖它获得体面，因此假文凭不只是骗局道具，也象征他用外在身份弥补内在虚弱。","link":"虚荣因此成为人物悲剧的内在起点。","chapter":"第一章","searchPhrase":"小小一方纸","pdfPage":"19"},{"point":"社会对洋文凭的迷信使骗局得以成立。","evidence":"“小小一方纸能把一个人的空疏、寡陋、愚笨都掩盖起来。”","location":"方鸿渐回国后报纸登载、社交圈追捧其博士身份的情节。","page":"P10","edition":"人民文学出版社软皮版","explain":"社会愿意相信洋文凭，才让“克莱登”式骗局得以成立。方鸿渐的虚荣和周围人的盲目崇拜互相配合，讽刺因此从个人道德扩展到学历评价体系，说明骗局并非一人能够独立完成。","link":"个人虚荣与社会崇拜互相推动。","chapter":"第一章","searchPhrase":"小小一方纸","pdfPage":"19"},{"point":"假文凭成为方鸿渐后续困境的伏笔。","evidence":"“克莱登法商专门学校函授部”","location":"求职、三闾大学任教及与唐晓芙关系变化的情节线。","page":"待核","edition":"人民文学出版社软皮版","explain":"“克莱登法商专门学校函授部”以煞有介事的名称包装虚假学历，显出骗局的荒诞。这个身份无法提供真正学问，却会影响他求职、任教和婚恋，虚假开端因此像伏笔一样不断制造新的困境。","link":"结尾要回扣“围城”主题。","chapter":"第一章","searchPhrase":"克莱登法商专门学校函授部","pdfPage":"19"}],"traps":["只批判方鸿渐个人，不分析社会崇拜学历的现象。","把假文凭当作孤立事件，不联系职业和婚恋困境。"]},{"id":"fortress-intellectuals","work":"《围城》","workKey":"fortress","type":"主题思想","title":"三闾大学与知识分子群像","prompt":"分析《围城》中的知识分子群像。","keywords":["三闾大学","知识分子","虚伪","派系","李梅亭","韩学愈"],"thesis":"《围城》通过三闾大学的派系斗争和学者群像，讽刺知识分子在名利、权力和虚荣中的庸俗化。","points":[{"point":"三闾大学呈现学术机构的派系争斗。","evidence":"“从没听过三闾大学，想是个战后新开的大学。”","location":"第五至第七章三闾大学任教情节。","page":"待核","edition":"人民文学出版社软皮版","explain":"“从没听过三闾大学”写出这所机构在人物心中的突然和陌生，也暗示其权力结构并不透明。教师进入其中后围绕职位、派系和面子争斗，学术空间被世俗权力侵占，知识理想因此受到讽刺。","link":"个体困境由此扩展为群体批判。","chapter":"第三章","searchPhrase":"从没听过三闾大学","pdfPage":"110"},{"point":"人物行为暴露道貌岸然与个人私利。","evidence":"“从没听过三闾大学，想是个战后新开的大学。”","location":"赴三闾大学旅途中李梅亭的相关情节。","page":"待核","edition":"人民文学出版社软皮版","explain":"陌生机构成为人物暴露真实品行的场所。方鸿渐、高松年、李梅亭等人面对职位和利益时各有算计，行动与口头上的道德姿态形成反差，使知识分子的虚伪通过情节自然显现。","link":"讽刺通过情节而非作者议论完成。","chapter":"第三章","searchPhrase":"从没听过三闾大学","pdfPage":"110"},{"point":"知识分子在虚荣和现实压力下失去方向。","evidence":"“从没听过三闾大学，想是个战后新开的大学。”","location":"三闾大学学历、职位和人际关系情节。","page":"待核","edition":"人民文学出版社软皮版","explain":"“战后新开”的背景让三闾大学带有时代动荡和临时性。人物在这里既失去稳定的文化根基，又被名利和生存压力推着走，学历、职位和身份因此成为他们寻找方向却不断迷失的证据。","link":"结论要把群像与作品的整体讽刺主题连接起来。","chapter":"第三章","searchPhrase":"从没听过三闾大学","pdfPage":"110"}],"traps":["只罗列人物丑事，不分析群体象征。","把讽刺写成简单道德批判，忽略时代环境。"]},{"id":"fortress-metaphor","work":"《围城》","workKey":"fortress","type":"艺术手法","title":"比喻与围城意象","prompt":"分析《围城》中比喻和意象的艺术作用。","keywords":["比喻","意象","鸟笼","围城","人生困境","讽刺"],"thesis":"《围城》用鸟笼、城堡和围城等比喻，把婚姻、职业与人生困境具象化，使讽刺具有反复回扣的结构力量。","points":[{"point":"鸟笼比喻把婚姻中的进出欲具象化。","evidence":"“结婚仿佛金漆的鸟笼，笼子外面的鸟想住进去，笼内的鸟想飞出来。”","location":"小说人物谈论婚姻与围城的相关情节。","page":"待核","edition":"人民文学出版社软皮版","explain":"“金漆的鸟笼”把婚姻的吸引力与封闭感放在同一形象里。金漆代表体面和欲望，鸟笼代表限制，人物只看见进入前的光亮，却忽略进入后的空间，比喻因此把想象中的幸福与现实束缚同时写出。","link":"这一比喻构成全文围城主题的直观基础。","chapter":"第三章","searchPhrase":"结婚仿佛金漆的鸟笼","pdfPage":"101"},{"point":"围城意象反复出现在爱情、职业和婚姻中。","evidence":"“结婚仿佛金漆的鸟笼，笼子外面的鸟想住进去，笼内的鸟想飞出来。”","location":"方鸿渐从爱情到三闾大学再到婚姻的连续经历。","page":"待核","edition":"人民文学出版社软皮版","explain":"鸟笼中“想住进去”和“想飞出来”的循环不只属于婚姻，也能对应方鸿渐在三闾大学和人生选择中的处境。意象在不同阶段重复出现，使爱情、职业和婚姻共享同一结构，作品因此获得整体性的讽刺框架。","link":"比喻因此不仅属于语言，也属于叙事结构。","chapter":"第三章","searchPhrase":"结婚仿佛金漆的鸟笼","pdfPage":"101"},{"point":"比喻还承担讽刺和人性揭示。","evidence":"“城外的人想冲进去，城里的人想逃出来。”","location":"假文凭、三闾大学和社交圈相关描写。","page":"待核","edition":"人民文学出版社软皮版","explain":"“城外的人想冲进去，城里的人想逃出来”用通俗比喻说出人物不断追逐又不断失望的心理。它让欲望看起来自由，实际却像固定轨道一样反复运行，既讽刺人物，也揭示人性中难以满足的普遍状态。","link":"结尾要落回比喻与主题、讽刺的统一。","chapter":"第三章","searchPhrase":"城外的人想冲进去","pdfPage":"101"}],"traps":["只摘抄比喻，不解释比喻和行为、主题的关系。","把所有意象都说成围城，忽略具体语境。"]},{"id":"fortress-group-portrait","work":"《围城》","workKey":"fortress","type":"人物形象","title":"知识分子群像的病态","prompt":"结合方鸿渐及周围人物，分析《围城》如何塑造战时知识分子群像。","keywords":["群像","知识分子","方鸿渐","虚荣","三闾大学","病态"],"thesis":"小说以方鸿渐为线索，把学历、爱情和职业空间中的知识分子连成群像，写出他们在理想与现实之间的虚荣、摇摆和无力。","examVariants":["《围城》中的知识分子群像反映了怎样的时代特征？","方鸿渐与其他知识分子形象的互相映照有什么作用？"],"paperSources":["钱钟书《围城》的知识分子形象与讽刺艺术研究","《围城》的讽刺艺术与知识分子群像塑造"],"points":[{"point":"学历崇拜掩盖了人物精神上的空疏。","evidence":"“小小一方纸能把一个人的空疏、寡陋、愚笨都掩盖起来。”","location":"方鸿渐购买文凭以及回国后面对学历问题的情节。","explain":"“小小一方纸”把文凭变成遮盖“空疏、寡陋、愚笨”的工具，群像对学历和体面的依赖由此暴露。人物不是不知道自身能力有限，而是宁愿相信外在证明，学历崇拜因此成为知识分子精神虚弱的表现。","link":"这为后文职业和婚恋中的困境埋下伏笔。","page":"P10","edition":"人民文学出版社软皮版"},{"point":"人物关系中的功利计算暴露出婚恋的世俗逻辑。","evidence":"“这姓方的不合式，气量太小，把钱看得太重。”","location":"方鸿渐与苏文纨、唐晓芙、孙柔嘉关系变化的相关情节。","explain":"“不合式”“把钱看得太重”把婚恋评价压缩成金钱和性情判断。个人情感被家世、体面和功利计算包围，人物关系不再只是私人选择，也反映群体如何用世俗标准衡量人的价值。","link":"个体婚恋困境由此扩展为群体和社会的讽刺。","page":"P44","edition":"人民文学出版社软皮版"},{"point":"人物互相映照，构成知识分子群体的普遍困境。","evidence":"“他的傲慢无礼，是学墨索里尼和希特勒接见小国外交代表开谈判时的态度。”","location":"赵辛楣与方鸿渐交往以及三闾大学人事关系中的情节。","explain":"把赵辛楣的傲慢比作独裁者接见外交代表，夸张地写出人物的自负和权力幻想。这个人物并不孤立，他的姿态与方鸿渐的虚弱、其他人的算计互相映照，共同构成知识分子的病态群像。","link":"分析群像时要说明人物关系如何共同揭示时代和精神问题。","page":"待核","edition":"人民文学出版社软皮版"}],"traps":["只介绍方鸿渐一个人物，没有群像之间的互相映照。","把人物缺点简单归为个人品行，忽略学历、职业和时代压力。"]},{"id":"fortress-language-satire","work":"《围城》","workKey":"fortress","type":"艺术手法","title":"语言讽刺的三种方式","prompt":"分析《围城》如何通过比喻、人物语言和叙事判断实现讽刺。","keywords":["语言讽刺","比喻","幽默","人物语言","叙事判断","围城"],"thesis":"钱钟书把比喻、人物语言和冷静的判断交织在一起，使讽刺既能制造幽默，也能揭露人物和社会的真实处境。","examVariants":["《围城》的语言风格如何服务于讽刺艺术？","从比喻的使用分析《围城》的讽刺特色。"],"paperSources":["《围城》的讽刺艺术与知识分子群像塑造","钱钟书作品《围城》的讽刺艺术研究"],"points":[{"point":"具象比喻把抽象的人生困境转成可感形象。","evidence":"“结婚仿佛金漆的鸟笼，笼子外面的鸟想住进去，笼内的鸟想飞出来。”","location":"小说人物谈论婚姻以及方鸿渐婚恋经历的相关段落。","explain":"“金漆的鸟笼”将婚姻的诱惑、体面和封闭感压缩成一个可感形象，读者先被比喻的机趣吸引，随后才意识到其中包含的束缚。语言因此不是装饰，而是把抽象的人生困境具体化的讽刺方式。","link":"比喻因此同时承担描写、讽刺和主题揭示功能。","page":"待核","edition":"人民文学出版社软皮版"},{"point":"人物语言的夸张反差暴露其虚伪和自负。","evidence":"“他的傲慢无礼，是学墨索里尼和希特勒接见小国外交代表开谈判时的态度。”","location":"赵辛楣与方鸿渐交往及三闾大学人物的社交情节。","explain":"以独裁者接见外交代表形容赵辛楣的傲慢，宏大政治场景被用于私人交往，反差立即把人物的自信变成装腔作势。夸张语言没有直接评判，却让读者从失衡的比喻中看出人物的虚伪和可笑。","link":"讽刺通过语言而不是作者的直接批评完成。","page":"待核","edition":"人民文学出版社软皮版"},{"point":"叙事判断把轻松语言引向严肃批判。","evidence":"“小小一方纸能把一个人的空疏、寡陋、愚笨都掩盖起来。”","location":"假文凭情节及社会对洋学历的追捧。","explain":"“小小一方纸”语气轻巧，指向的却是学历社会和知识分子的自我欺骗。幽默句式为批判披上轻松外衣，读者一笑之后仍会看到背后的荒诞，讽刺因此既能娱乐阅读，也能推动主题。","link":"结语应回到幽默与批判并存的语言特点。","page":"P10","edition":"人民文学出版社软皮版"}],"traps":["只摘比喻说有趣，不解释比喻揭穿了什么。","把讽刺理解为单纯搞笑，忽略其中的社会批判。"]},{"id":"fortress-concrete-balance","work":"《围城》","workKey":"fortress","type":"艺术手法","title":"讽刺的具象化与平衡视角","prompt":"分析《围城》如何通过具象化描写和平衡视角完成讽刺。","keywords":["具象化","平衡视角","隐喻","结构","冷峻","笑中带泪"],"thesis":"小说用具体物象承载抽象情绪，又以冷峻而有距离的视角观察不同人物，使讽刺不流于辱骂，而呈现出复杂的“笑中带泪”。","examVariants":["平衡视角在《围城》的讽刺叙事中有什么作用？","《围城》的情感具象化如何增强讽刺效果？"],"paperSources":["“讽刺”的情感具象化与平衡视角选择——《围城》中的讽刺艺术特色分析","钱钟书作品《围城》的讽刺艺术研究"],"points":[{"point":"具体物象让抽象情感变得可见。","evidence":"“结婚仿佛金漆的鸟笼，笼子外面的鸟想住进去，笼内的鸟想飞出来。”","location":"小说中关于婚姻、职业和人生选择的比喻段落。","explain":"“金漆的鸟笼”给婚姻困境一个可以看见的外形，欲望、限制和进退都在同一物件中呈现。比喻避免了抽象议论，使读者既感到幽默，又能体会人物在“想进去”和“想出来”之间反复摇摆的复杂心理。","link":"具象化使讽刺具有画面和回味。","page":"待核","edition":"人民文学出版社软皮版"},{"point":"冷峻视角避免把人物简单分成善恶两方。","evidence":"“这姓方的不合式，气量太小，把钱看得太重。”","location":"张家评价方鸿渐及苏家、方家等人物关系的情节。","explain":"“这姓方的不合式”既是对方鸿渐的评价，也是评价者势利和偏见的暴露。叙述没有把谁写成完全正确的一方，而是在人物互相判断中同时讽刺双方，冷峻视角因此让群像更接近真实的灰色状态。","link":"平衡视角让人物世界更接近真实的灰色状态。","page":"P44","edition":"人民文学出版社软皮版"},{"point":"结构上的反复让围城意象贯穿不同人生阶段。","evidence":"“城外的人想冲进去，城里的人想逃出来。”","location":"爱情、三闾大学任教和婚姻等连续经历。","explain":"“冲进去”和“逃出来”的结构在爱情、职业和婚姻中反复出现，说明围城并非单一关系的结果。每一次进入都被当作解决方案，随后又产生新的失望，重复结构使个人困境上升为普遍人生经验。","link":"结尾应回扣内容与形式统一的讽刺美学。","page":"待核","edition":"人民文学出版社软皮版"}],"traps":["只谈具象化，不分析平衡视角带来的复杂性。","把反讽写成简单的贬低或道德审判。"]},{"id":"saffi-imperfect-vanguard","work":"《莎菲女士的日记》","workKey":"saffi","type":"人物形象","title":"“不完美”莎菲的先锋性","prompt":"莎菲自我分裂、反复彷徨是否削弱了人物的先锋性？结合文本分析。","keywords":["不完美","先锋性","自我分裂","女性主义","主体","抵抗"],"thesis":"莎菲的先锋性不在于她成为道德完美的新女性，而在于她敢于承认欲望、行使对男性人格的精神评判权，并拒绝用物质和肉欲替代灵魂契合。","examVariants":["为什么说莎菲的“不完美”具有女性主义意义？","分析莎菲拒绝凌吉士所体现的主体意识与道德标准。"],"paperSources":["《莎菲女士的日记》中缺乏自我本位意识的角色先锋性探究","丁玲《莎菲女士的日记》中女性自我意识的觉醒与困境","女性意识的觉醒：谈莎菲女士的精神困境——评丁玲《莎菲女士的日记》","启蒙、革命与女性——重读丁玲《莎菲女士的日记》"],"points":[{"point":"欲望和自我表达打破了传统女性的沉默。","evidence":"“我的欲望……所以我只得忍耐着，低下头去。”","location":"莎菲认识凌吉士后反复书写欲望与克制的日记段落。","explain":"莎菲把女性欲望写成需要承认的真实经验，同时又暴露礼教造成的压抑。她没有呈现一个完全解放的胜利者，而是让人看到新意识如何在旧规范内部艰难生长；这种未完成状态使人物比单纯的觉醒符号更真实，也更有先锋性。","link":"“不完美”因此不是失败，而是拒绝虚假统一的主体姿态。","page":"P43","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"她拒绝凌吉士，是在行使女性对欲望对象进行精神评判和道德选择的权利。","evidence":"“当我明白了那使我爱慕的一个高贵的美形里，是安置着如此一个卑劣灵魂。”","location":"莎菲看清凌吉士真实面目后的心理转折。","explain":"莎菲并没有因为欲望而放弃判断，相反，她在“高贵美形”中发现“卑劣灵魂”后主动收回情感。凌吉士的金钱、肉欲和自我享受人格不符合她对爱情和精神尊严的想象，因此拒绝不是被迫失恋，而是女性决定什么样的人配得上自己、什么样的价值不能被交易。","link":"先锋性由此从身体欲望推进到精神评判和道德主体。","page":"P58","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"日记中的独语构成女性自我空间的建构。","evidence":"“谁能懂得我呢，便能懂得这只能表现我万分之一的日记。”","location":"全篇以第一人称日记持续展开的内心独白。","explain":"“万分之一的日记”既承认表达不完整，也说明日记是莎菲唯一可以不按社会角色说话的空间。她在其中保留欲望、羞耻、反思和判断，拒绝接受外界赋予的稳定形象，私人书写因此成为女性抵抗误解、建构自我的方式。","link":"这种私人空间使“不完美”获得了抵抗父权主体神话的意义。","page":"P65","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把莎菲的犹豫和反复只当作性格缺点。","只写女性欲望，不分析她拒绝凌吉士时所表现的精神标准和主体判断。"]},{"id":"saffi-awakening-tragedy","work":"《莎菲女士的日记》","workKey":"saffi","type":"主题思想","title":"觉醒之后的结构性悲剧","prompt":"分析莎菲觉醒后的精神困境及其结构性悲剧。","keywords":["觉醒","精神困境","悲剧","孤独","理解","爱情"],"thesis":"莎菲的悲剧不是因为觉醒失败，而是个体解放思想先于社会结构变化：她获得了判断、拒绝和保持尊严的权利，却没有得到新的关系、女性共同体与社会出路。","examVariants":["为什么说莎菲的悲剧是时代困境而不是个人缺陷？","分析莎菲的精神困境与她所处的社会支持系统之间的关系。"],"paperSources":["《莎菲女士的日记》中缺乏自我本位意识的角色先锋性探究","丁玲《莎菲女士的日记》中女性自我意识的觉醒与困境","女性意识的觉醒：谈莎菲女士的精神困境——评丁玲《莎菲女士的日记》","启蒙、革命与女性——重读丁玲《莎菲女士的日记》"],"points":[{"point":"觉醒使她拒绝旧规范，却无法摆脱外部评价和制度压力。","evidence":"“一个女人这样放肆，是不会得到好结果的。”","location":"莎菲面对爱情、身体和社交规范时的日记独白。","explain":"“放肆”与“好结果”把父权规范伪装成对女性命运的善意提醒。莎菲虽然能够质疑这种评判，却仍生活在一个会按它分配羞辱和孤立的世界中，因此她的新意识越清楚，日常承受的冲突越尖锐。","link":"觉醒没有自动带来自由，反而暴露了思想解放与社会条件之间的落差。","page":"P45","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"她渴望真正的精神理解，却没有女性共同体或社会力量承接她的觉醒。","evidence":"“我总愿意有那么一个人能了解得我清清楚楚的。”","location":"莎菲与蕴姊、毓芳及苇弟相处时的日记内容。","explain":"莎菲所求的是完整而准确的理解，但亲友的关心无法进入她的精神世界，蕴姊去世后又切断了最可能的情感纽带。作品中没有出现女性互助组织或能够支持新女性的社会力量，她只能把日记当作最后的精神空间，孤独因此是结构性缺席，而非个人选择。","link":"精神困境由此从私人关系上升到女性共同体的缺失。","page":"P40","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"离开和拒绝是她的道德自救，却不是解决矛盾的现实出路。","evidence":"“我又将一人寂寂寞寞地离开这古城了。”","location":"2026 May/June Paper 3 选文所取的莎菲离开北京前日记段落。","explain":"“一人”和“寂寂寞寞”同时写出莎菲保存自我的决心与无人同行的处境。离开使她暂时摆脱需要妥协的关系，守住精神和道德边界，却没有改变造成困境的社会结构，也没有建立新的生活共同体，因此这种自救只能终止旧关系，无法真正完成解放。","link":"莎菲的悲剧性因此在于她只能退出，而不能改造世界。","page":"待核","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把悲剧归因于莎菲性格敏感、犹豫或不懂珍惜。","把离开写成彻底解放，忽略她缺少社会支持和现实出路。"]},{"id":"saffi-enlightenment-revolution","work":"《莎菲女士的日记》","workKey":"saffi","type":"主题思想","title":"自由恋爱的启蒙悖论","prompt":"结合启蒙与革命语境，分析莎菲的“自由恋爱”为什么没有带来真正解放。","keywords":["启蒙","革命","自由恋爱","个性解放","女性","悖论"],"thesis":"自由恋爱把个人从传统中解放出来，却没有提供能够承接女性主体性的社会结构和精神共同体；莎菲拒绝凌吉士，正暴露启蒙话语在性别和阶级层面的边界。","examVariants":["分析凌吉士形象所体现的资本主义男权文化。","为什么莎菲的“自由恋爱”最终变成孤独的自我保存？"],"paperSources":["《莎菲女士的日记》中缺乏自我本位意识的角色先锋性探究","丁玲《莎菲女士的日记》中女性自我意识的觉醒与困境","女性意识的觉醒：谈莎菲女士的精神困境——评丁玲《莎菲女士的日记》","启蒙、革命与女性——重读丁玲《莎菲女士的日记》"],"points":[{"point":"自由恋爱最初表现为女性主动追求个人欲望和情感选择。","evidence":"“颀长的身躯，白嫩的面庞，薄薄的小嘴唇，柔软的头发。”","location":"莎菲初次接触并观察凌吉士的日记段落。","explain":"这段凝视把女性从被选择、被观看的位置推向欲望主体。莎菲主动创造相处机会，也主动表达对男性身体的感受，自由恋爱因此首先是个人权利意识的觉醒；但它仍把解放寄托在一个具体男性身上，尚未触及女性获得社会独立的条件。","link":"启蒙给了她爱的自由，却没有同时给她独立的现实基础。","page":"P43","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"凌吉士的拜金、肉欲和自我享乐人格，暴露自由恋爱背后的资本主义男权逻辑。","evidence":"“当我明白了那使我爱慕的一个高贵的美形里，是安置着如此一个卑劣灵魂。”","location":"莎菲认清凌吉士真实面目后的心理转折。","explain":"凌吉士的吸引力来自现代都市男性的外貌、身份和情场经验，但“卑劣灵魂”揭示其价值观仍以金钱、肉欲和自我享受为中心。莎菲的拒绝说明启蒙倡导的自由并没有自动改变两性关系中的权力和欲望结构，女性若不掌握精神与人格的评判权，自由恋爱仍可能成为新的依附。","link":"恋爱自由因此显现出性别与阶级的双重边界。","page":"P58","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"找不到新的精神共同体，使个体只能退回日记并保持孤独。","evidence":"“谁能懂得我呢，便能懂得这只能表现我万分之一的日记。”","location":"莎菲与亲友、爱人关系受挫后继续写日记的段落。","explain":"日记保存了莎菲不愿妥协的真实自我，却无法建立新的社会联系。她能拒绝不合适的男性，却没有女性共同体、公共空间或社会制度承接这种觉醒，于是“自由”只剩下一个人承担后果。作品由此指出，启蒙若只完成个人思想的解放，就会把新女性留在精神漂流中。","link":"莎菲的困境为丁玲及新文学主体其后转向革命提供了深层注脚。","page":"P65","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把自由恋爱写成纯粹的个性胜利。","只批判凌吉士个人道德，不分析他所代表的物质主义和男权逻辑。"]},{"id":"water-intellectual-stance","work":"《水》","workKey":"water","type":"主题思想","title":"《水》中的知识分子立场","prompt":"分析《水》如何体现作者的知识分子立场。","keywords":["知识分子立场","第三种声音","人道主义","隐含作者","群众","反思"],"thesis":"《水》在左翼革命叙事之外保留了知识分子的同情、观察和反思，使灾难书写不仅歌颂群众，也追问人的尊严和社会责任。","examVariants":["《水》中的“第三种声音”具体指什么？","丁玲的知识分子立场如何在《水》的形式和思想上体现？"],"paperSources":["论丁玲《水》中的知识分子立场"],"points":[{"point":"作品首先以人的苦难作为叙事起点。","evidence":"“大家看见了都抱头大哭……这是失去了精神，失去了勇气，只剩饥饿的一群。”","location":"洪水到来前后灾民逃难、求生的情节。","explain":"“抱头大哭”“失去勇气”“只剩饥饿”让读者先看到具体的人如何受伤，而不是把群众直接化约为革命符号。丁玲保留了对个体恐惧和尊严受损的关注，这种人的处境为作品中的知识分子立场提供了情感起点。","link":"人道关怀构成知识分子立场的基础。","page":"P226","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"人物语言呈现对现实原因的追问。","evidence":"“哭有什么用，死的死去了，哭得转来吗？”","location":"洪水过后灾民抱头大哭、王大保站出来讲话的段落。","explain":"“哭有什么用”把灾民的行动问题交给底层人物自己回答，但提问本身也反映了作者对官僚和制度的追问。人物语言既表现群众求生，又让读者意识到灾难不是天降厄运，而是由具体权力关系不断加重。","link":"群众叙述和知识分子反思由此同时存在。","page":"P228","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"结尾的集体反抗仍保留作者对力量转向的观察。","evidence":"“比水还凶猛的，朝镇上扑了过去。”","location":"小说结尾群众集体行动和裸身汉子带领反抗的段落。","explain":"“比水还凶猛的”显示群众最终获得行动能力，但叙述并没有掩盖力量形成的过程。丁玲既肯定底层反抗，又持续观察它如何由恐惧、饥饿和愤怒转化而来，因此作品在“向左”的革命叙事之外仍保有知识分子的反思。","link":"结论要把“向人”和“向左”连接起来。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["只把《水》解释成左翼口号，忽略人道关怀。","只谈灾害，不分析作者和隐含叙事者的立场。"]},{"id":"water-1930s-ecology","work":"《水》","workKey":"water","type":"比较阅读","title":"灾害书写与1930年代文学生态","prompt":"结合1930年代上海文学生态，分析《水》灾害书写中的左翼文学特征。","keywords":["1930年代","文学生态","灾害书写","左翼文学","比较","上海"],"thesis":"《水》把自然灾害、官僚压迫和群众觉醒接合起来，体现左翼文学关注底层和社会改造的方向，也显示1930年代文学思潮相互碰撞的多元生态。","examVariants":["《水》与同年灾害题材作品相比有什么独特之处？","为什么《水》既是灾害小说，也是社会政治小说？"],"paperSources":["1930年代上海多元化的文学生态——以丁玲《水》与赵清阁《旱》的比较为例"],"points":[{"point":"灾害描写一开始就和社会环境连在一起。","evidence":"“黄色的滔滔大水”","location":"小说开篇洪水逼近、村民逃难和恐慌的段落。","explain":"“黄色的滔滔大水”看似只是灾害场景，却立即带出村民在住所、粮食和交通上的脆弱。洪水因此成为观察社会结构的入口，作品把自然冲击、底层贫困和时代危机连在一起，体现了1930年代文学对社会问题的敏感。","link":"灾害因此成为观察社会结构的入口。","page":"P226","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"官僚和军队的行为把天灾转化为社会悲剧。","evidence":"“帆船却又带来了一些军火，并没有带救济米。”","location":"灾民与地方官员交涉、官员转移财物等情节。","explain":"“军火”而不是“救济米”揭示了官府和军队在灾难中的真实立场。这个政治反差把小说从灾害记录推进到社会批判，也使它接近左翼文学对阶级关系和权力结构的关注。","link":"这种问题意识与左翼文学的社会分析相呼应。","page":"P231","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"群众反抗体现文学从揭露问题走向行动想象。","evidence":"“比水还凶猛的，朝镇上扑了过去。”","location":"小说第四部分和结尾高潮。","explain":"“比水还凶猛的，朝镇上扑了过去”把灾害的破坏力转化为群众反抗的行动力。作品没有停在揭露问题，而是想象底层通过集体行动改变现实，这与1930年代左翼文学对社会出路的探索相呼应。","link":"结尾要说明它和1930年代多元文学思潮之间的互动。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把灾害小说仅仅当作灾难记录。","比较时只写共同点，不说明《水》的政治指向。"]},{"id":"water-discourse-tension","work":"《水》","workKey":"water","type":"主题思想","title":"个性话语与革命话语的张力","prompt":"分析《水》如何呈现个性话语与革命话语之间的张力。","keywords":["个性话语","革命话语","冯雪峰","左翼批评","群众","情感"],"thesis":"《水》一方面走向宏大的革命和群众叙事，另一方面仍保存个体恐惧、悲痛和复杂情感，文本因此留下个性话语与革命话语相互牵引的张力。","examVariants":["革命话语在《水》的创作中起到了怎样的作用与影响？","为什么《水》既可以被看作革命文学，也保留了个性化表达？"],"paperSources":["个性话语与革命话语的兼容与悖离——兼论丁玲小说《水》及冯雪峰《关于新的小说的诞生》对之的批评"],"points":[{"point":"个体苦难仍然是革命叙事不可抹去的部分。","evidence":"“大家看见了都抱头大哭……这是失去了精神，失去了勇气，只剩饥饿的一群。”","location":"洪水灾害和村民逃难段落。","explain":"“抱头大哭”“失去勇气”保留了灾民作为具体个体的恐惧和崩溃。革命叙事虽然要把他们组织成群众，但小说没有立即抹去个人经验，个性话语因此成为集体觉醒的情感底色。","link":"这构成文本中个性话语的留存。","page":"P226","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"革命话语通过政治反差把个人苦难引向社会批判。","evidence":"“帆船却又带来了一些军火，并没有带救济米。”","location":"灾民等待救济、官员与军队维护秩序的情节。","explain":"“军火”与“救济米”的反差把个人求生引向对权力结构的质问。革命话语在这里不是外加口号，而是从灾民对现实利益的判断中生长出来，个体苦难因此获得了社会批判的方向。","link":"两种话语不是互相取消，而是彼此推动。","page":"P231","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"集体行动仍然包含鲜明的情感力量。","evidence":"“比水还凶猛的，朝镇上扑了过去。”","location":"结尾群众集体反抗的高潮部分。","explain":"“比水还凶猛的”写出集体行动的力量，但行动由悲痛、饥饿和愤怒积聚而成。群众并不只是抽象的革命主体，他们的情感经验仍在推动叙事，使革命话语与个性话语保持彼此依赖又互相拉扯的关系。","link":"结尾要说明革命转向背后的复杂情感动力。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把个性话语和革命话语看作完全对立。","只讨论革命主题，不分析个体情感怎样进入集体叙事。"]},{"id":"hospital-individual-collective","work":"《在医院中》","workKey":"hospital","type":"主题思想","title":"个体理想与集体秩序","prompt":"分析《在医院中》如何思考个体理想与集体秩序之间的关系。","keywords":["个体","集体","理想","秩序","陆萍","改造"],"thesis":"小说既肯定陆萍改造现实的理想，也写出集体环境中的官僚和麻木，最终让个体在冲突中理解改造他人与改造自我的双重任务。","examVariants":["陆萍与医院集体的冲突说明了什么？","丁玲如何在《在医院中》处理青年知识分子与革命组织的关系？"],"paperSources":["革命语境下“以道抗势”的个体回响——《在医院中》《组织部来了个年轻人》的理想与秩序"],"points":[{"point":"陆萍把个体理想转化为改革医院的具体行动。","evidence":"“她总是爱飞。总不满于现状。”","location":"陆萍初到医院、投入工作的情节。","explain":"“爱飞”与“不满于现状”说明陆萍的个体理想最初带有强烈的改革冲动，她希望用专业标准改变医院。进入集体之后，这种理想必须面对人际关系、制度惯性和实际资源，个人与集体之间的张力由此展开。","link":"个体的积极性因此不是空想。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"集体环境中的标签化使个体意见难以被听取。","evidence":"“小资产阶级意识、知识分子的英雄主义、自由主义等等的帽子都往她头上戴。”","location":"陆萍与同事、管理者发生矛盾的情节。","explain":"“小资产阶级意识”“英雄主义”等标签使陆萍的意见无法被当成工作问题讨论。集体用身份判断替代具体分析，既压抑了个人表达，也失去吸收批评、改善管理的机会，问题因此不是单方面的，而是个体和秩序共同造成。","link":"冲突揭示了个体与秩序都需要反思。","page":"P394","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"陆萍的孤立促使她由单纯批评环境转向自我调整。","evidence":"“她已经成为医院里小小的怪人，被大多数人用异样的眼睛看着。”","location":"陆萍照顾病人、提出意见并受到排斥的连续情节。","explain":"成为“小小的怪人”使陆萍看见自己被环境排斥，也迫使她反问个人热情是否足够。她逐渐认识到，改变现实既要有理想，也要理解他人和自身局限；个体与集体的关系因此从对抗走向双向调整。","link":"结论应落在个体与集体的双向完善。","page":"P387","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把陆萍写成完全正确的英雄，忽略她的幼稚和局限。","只批判医院集体，不分析个体需要怎样调整。"]},{"id":"hospital-dual-luping","work":"《在医院中》","workKey":"hospital","type":"人物形象","title":"“产科助手”与“理想人物”的分裂","prompt":"为什么说陆萍是在“产科助手”与“理想人物”之间游移、分裂的形象？","keywords":["陆萍","产科助手","理想人物","双重分裂","身份","成长"],"thesis":"陆萍既有专业工作者的具体身份，又被赋予革命理想人物的期待；现实工作、个人情绪和集体要求之间的落差，使她不断在两种自我之间摆动。","examVariants":["如何理解陆萍人物形象的复杂性？","结合陆萍的感情与工作表现，分析她的双重自我。"],"paperSources":["“Lu Ping” between an “Obstetric Assistant” and “Ideal Figure”: Reexamining In the Hospital"],"points":[{"point":"理想自我使她不断要求超越现状。","evidence":"“她总是爱飞。总不满于现状。”","location":"陆萍初到医院、观察环境并希望改革的情节。","explain":"“爱飞”表现陆萍对进步和理想自我的追求，也解释她为何难以容忍医院的落后。她把自己设想成能够推动改变的人，这种期待既是动力，也是人物后来受挫的原因。","link":"理想构成她行动的动力，也带来与环境冲突。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"现实身份迫使她面对琐碎而具体的医疗工作。","evidence":"“为了不愿病人产妇多受苦痛，便自己去替几个开刀了的，发炎的换药。”","location":"陆萍在严寒中照顾病人、承担换药工作的段落。","explain":"“不愿病人产妇多受苦痛”把理想拉回护理、换药等具体劳动。陆萍无法只停留在理想人物的高度，她的专业身份要求她面对病人、同事和琐碎工作，两种自我因此不断发生碰撞。","link":"两种身份的落差由此显现。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"受挫后的牵挂说明理想自我并未完全消失。","evidence":"“记挂着头天晚上黎涯送来的消息……”","location":"陆萍生病、受挫后仍牵挂朋友和病人的段落。","explain":"“记挂着头天晚上黎涯送来的消息”说明她在低谷中仍牵念朋友和病人。理想自我没有完全消失，而是在受挫后被重新塑形：她不再只追求证明自己，而开始理解责任、关系和持续行动的意义。","link":"结尾应说明分裂如何推动人物重新形成自我。","page":"P393","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把陆萍的分裂简单理解为性格前后矛盾。","只看她的理想，不分析具体工作和情感脆弱。"]},{"id":"hospital-growth-useful","work":"《在医院中》","workKey":"hospital","type":"主题思想","title":"成长叙事与“有用的人”","prompt":"分析《在医院中》如何通过成长叙事写出陆萍从迷惘青年到“有用的人”。","keywords":["成长叙事","有用的人","多重主体","蜕变","革命","青年"],"thesis":"陆萍的成长不是简单克服缺点，而是在理想、受挫、反思和社会关系的作用下，逐步学会把个人热情转化为更稳定的工作责任感。","examVariants":["《在医院中》的成长叙事主要体现在哪些方面？","如何理解陆萍最后成为“有用的人”？"],"paperSources":["成长叙事与多重主体的弥合——细读《在医院中》","丁玲《在医院中》的陆萍形象赏析"],"points":[{"point":"陆萍初到医院时带着热情，也带着不成熟的英雄幻想。","evidence":"“她已经成为医院里小小的怪人，被大多数人用异样的眼睛看着。”","location":"陆萍提出意见、照顾病人却受到排斥的段落。","explain":"“小小的怪人”表明陆萍初到医院时已经能够发现问题，却尚未理解环境的结构和人的复杂性。她的批评带有理想主义锋芒，也带有个人英雄色彩，因此容易在集体中形成孤立。","link":"成长的起点是复杂主体之间的矛盾。","page":"P387","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"外部标签和挫折迫使她重新认识自己。","evidence":"“小资产阶级意识、知识分子的英雄主义、自由主义等等的帽子都往她头上戴。”","location":"陆萍与同事、管理者发生矛盾的情节。","explain":"“小资产阶级意识”“英雄主义”等标签虽有误解，却迫使陆萍面对自己与集体关系的问题。她开始意识到，单纯指责环境无法完成任务，个人理想需要在与他人的合作和自我反省中调整。","link":"这为多重主体的弥合提供条件。","page":"P394","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"结尾的行动选择显示成熟后的坚持。","evidence":"“她准备着如何可以使自己不失去这一个机会。”","location":"小说结尾附近陆萍准备参加下一场手术的情节。","explain":"“不失去这一个机会”把成长落实为行动。陆萍经过中毒、流言和病痛后仍选择回到工作，说明她没有放弃理想，而是从追求个人证明转向持续承担，这正是“有用的人”最具体的含义。","link":"结论要说明“有用的人”不是被动服从，而是在现实中选择继续承担。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把成长写成彻底否定陆萍原来的理想。","只写结尾振作，不分析中间的受挫和反思过程。"]}];

h-SbE9GrALP5trQDYUDUVxTneJTJDKY-cN1_b3pO-SWSTxloJu0c7kjEFQ0yok3SBusHbLBT9w4CpvGF5rddaVeVyGO3NIH7qdS11QSkD4J69ZGyad_SY5sFcRIj_sdRTDqAzH0Nm54WDMwd7DwEi9N6vMPsJbZL7a0pXKcRv5kAbEMaRCA==","abstract":"钱锺书的《围城》以讽刺的语言与结构艺术描摹了现代知识分子的精神困境与文化失落，传达出人生如“围困城堡”的典型社会心理，被视为中国现代讽刺小说的典范之作。小说中最鲜明的特点在于讽刺艺术手法的运用。《围城》的讽刺艺术主要体现在隐喻对象的具象化表现与平衡对称结构视角的选择，小说以具体物象承载抽象情绪，完成讽刺的幽默化转译；以冷峻中立的视角处理多阶层、多角色人物，呈现出讽刺叙事的平衡结构，由此实现了讽刺语言艺术上内容与形式的统一。本文旨在从“具象化隐喻”和“讽刺视角的平衡结构”这两个角度出发，结合现代文学语言理论和文化批评的视角，探讨钱锺书在《围城》中是如何在叙事理性与文学幽默之间，构建出一种“笑中带泪”的讽刺美学。","keywords":"情感具象化;平衡视角;《围城》;讽刺艺术;","outline":["一、讽刺具象化的幽默风趣","二、讽刺视角与结构的平衡","三、结语"],"researchQuestions":["平衡视角在《围城》讽刺叙事中的作用是什么？","《围城》的讽刺艺术如何反映现代知识分子的精神困境？","《围城》中情感具象化的手法如何增强讽刺效果？"]},{"workKey":"fortress","work":"《围城》","title":"钱钟书作品《围城》的讽刺艺术研究","author":"刘海山","source":"《大众文艺》","date":"2024","note":"综述型研究，适合作为讽刺艺术题的整体参考框架。","url":"https://kns.cnki.net/kcms2/article/abstract?v=tQWh-SbE9GrQ0IiD6vwxKvolvUbcCoHXCRYH0-UVGAAeBVmP-cpC3FihyKi3Hq2nM_Tc_AUYadN-I9T5AxHM8onGn1COJgjSeDZqu7dppNLhgWAdDkkwl4ix4biVdgBbYb6S-mB3dAuHxQVNJa_zgeXbBMot8x8qkW4ZDrOEVa2ynD0QfHRTyg==","abstract":"被誉为新“儒林外史”的《围城》最为读者津津乐道的当数其讽刺艺术的丰富多彩。钱钟书《围城》中讽刺艺术主要在对角色形象的描述、细节的刻画及各种比喻的广泛应用。相较其他讽刺小说，《围城》讽刺艺术独具特色之处在于其寓庄于谐、托实向虚、由此及彼。但在字里行间的讽刺艺术之下其实有着批判与反思的严肃思想与深刻探讨。因此，新时期读者对于《围城》讽刺艺术的审美鉴赏不能流于形式或浮于表面，而是要结合时代背景全面认知与理解，并且需要深入挖掘文字背后反映的文化冲突，同时需要透过现象看本质，拓展思维广度与深度。","keywords":"钱钟书;《围城》;讽刺艺术;表现形式;","outline":["一、钱钟书作品《围城》中讽刺艺术主要表现形式","（一）角色形象","（二）细节刻画","二、钱钟书作品《围城》中讽刺艺术的独特之处","（一）寓庄于谐","（二）托实向虚","（三）由此及彼","三、钱钟书作品《围城》中讽刺艺术下的思想底蕴","（一）批判","（二）反思","四、钱钟书作品《围城》中讽刺艺术的审美鉴赏途径","（一）结合时代背景全面认知与理解","（二）深入挖掘文字背后反映的文化冲突","（三）透过现象看本质，拓展思维广度与深度","五、结语"],"researchQuestions":["钱钟书《围城》讽刺艺术的表现形式有哪些？","《围城》讽刺艺术如何反映20世纪中国知识分子的精神困境？","钱钟书《围城》讽刺艺术与传统讽刺文学有何异同？"]},{"workKey":"saffi","work":"《莎菲女士的日记》","title":"《莎菲女士的日记》中缺乏自我本位意识的角色先锋性探究","author":"邱睿","source":"《名作欣赏》","date":"2026","pages":"141-143","doi":"10.20273/j.cnki.mzxs.2026.26.055","note":"论文不把莎菲的迟疑和自我分裂只当作缺点，而视为丁玲解构传统主体神话、暴露五四新女性困境的写作策略。其核心论证是：女性不仅拥有肉体欲望，更拥有对欲望对象进行精神评判的权利；莎菲拒绝凌吉士，即是对其物质化、男权化人格的否定。","url":"https://kns.cnki.net/kcms2/article/abstract?v=tQWh-SbE9GrMP7syjdQE2jxrG7ad2sgX53mQRiW8ndtbgHYUd1hxIMzViLHju_eUdDTTapnLFscqk7-wGfHx27mzpj1Ocd_lb6XxtfQWCPoCyhP5LOsKy9-uObLM2Dp_urdohTUy9zfnYYtjk3v3PbSV46YJz0khKUhSnRXIQ1SWYLQB4vq6Jg==","abstract":"丁玲的《莎菲女士的日记》自问世以来，其主人公莎菲的形象始终备受争议。一种批评认为，莎菲是一个沉溺于情感旋涡、缺乏明确自我本位意识的消极形象，并据此认为这是早期女性主义写作的不足。然而笔者认为，莎菲的混乱、彷徨与自我分裂并非其缺陷，而是丁玲采用的一种深刻的女性主义写作策略，通过解构父权制下稳定统一的主体神话，真实暴露了“五四”时期新女性的生存困境，用莎菲形象的“不完美”完成了对父权制度的深层批判。","keywords":"丁玲;《莎菲女士的日记》;女性主义写作;自我意识;","outline":["一、“缺乏自我本位意识”的误读与重审","二、“消极”的表现作为积极的抵抗策略","（一）“不完美受害者”的形象价值","（二）身体书写下的女性反抗","（三）女性自我空间的建构","三、历史语境下的时代困境","（一）“五四”启蒙的性别盲区","（二）个体觉醒与社会滞后的结构性困境","（三）传统崩塌后的精神漂流","四、超越“不足论”的先锋意义"],"researchQuestions":["丁玲通过莎菲形象的自我分裂是否具有先锋性意义？","《莎菲女士的日记》如何体现五四时期新女性的主体性困境？","《莎菲女士的日记》中女性自我意识的建构与解构关系如何？"]},{"workKey":"saffi","work":"《莎菲女士的日记》","title":"丁玲《莎菲女士的日记》中女性自我意识的觉醒与困境","author":"孙舒颖","source":"《青年文学家》","date":"2025","note":"把觉醒与困境放在同一逻辑中，重点分析莎菲的孤独、情智矛盾、自我怀疑，以及她对自我价值和道德底线的坚守。苇弟与凌吉士分别代表两类无法满足她精神需求的男性形象。","url":"https://kns.cnki.net/kcms2/article/abstract?v=tQWh-SbE9GoI1s0hXNO0oRCEBQPCEJ7ZVjjWSgF4-y-vxaUFQEY6xQotngJbMTVj1D_R0h23ZPZgglatCB84WoRmAjky9PkxMrM3FUq0ggUv7V4rW8ZpT3BIlB_z19Mn-KXFmoNMYsq2kEcXiMyWtLRN_iCzK5YKT0FGX4kJGqdMZG-KQSjfiA==","outline":["一、莎菲女士：自我意识觉醒的先锋","(一)叛逆与出走","(二)内心独白与自我认知","(三)理想与现实的矛盾","二、莎菲女士：自我意识觉醒的困境","(一)孤独与不被理解","(二)情智矛盾","(三)自我怀疑与挫败","三、其他女性人物：自我意识觉醒的多样表现","(一)蕴姊：传统与现代的桥梁","(二)毓芳：理性与独立的典范","(三)苇弟与凌吉士：男性视角下的女性觉醒","四、丁玲笔下的女性意识觉醒与困境的深远意义","(一)丁玲笔下的女性意识觉醒","(二)女性自我意识的困境","(三)丁玲对女性意识觉醒的独特贡献"],"researchQuestions":["《莎菲女士的日记》中的女性角色如何体现自我意识的觉醒？","《莎菲女士的日记》中，莎菲面对的社会和文化困境具体表现在哪些方面？","《莎菲女士的日记》中莎菲的情感经历如何影响她的自我认知？"]},{"workKey":"saffi","work":"《莎菲女士的日记》","title":"女性意识的觉醒：谈莎菲女士的精神困境——评丁玲《莎菲女士的日记》","author":"陶雨","source":"《雨露风》","date":"2024","note":"从精神困境切入女性意识，指出凌吉士在意的始终是金钱、肉欲和自我享受，而莎菲更看重思想共鸣与灵魂契合，甚至认为灵魂高于肉体。理智拒绝凌吉士是道德上的胜利，却也让她陷入更深的孤独。","url":"https://kns.cnki.net/kcms2/article/abstract?v=tQWh-SbE9GpUQDYSIi2T8x3W6tT-tONS-kZGABEVMalCUjQTT3Srk_jzHVp1bB4duD0Uv9ulLqQCB2tPfVXNJWEuWc4RIEAPTywjzlYCAvubQiUg0Ve1d55CBsrahp4zYS5uTwc02RAX4ugu-9hK0Tzn_LdaBjUoW0TYsmAP0RLizecCdnMXFQ==","outline":["一、女性意识的觉醒","二、莎菲女士的精神困境","三、莎菲的悲剧性","四、结语"],"researchQuestions":["《莎菲女士的日记》中的主人公莎菲面临的精神困境具体表现在哪些方面？","丁玲通过《莎菲女士的日记》表达了怎样的女性主义观点？","丁玲的作品《莎菲女士的日记》对当时社会产生了哪些影响？"]},{"workKey":"saffi","work":"《莎菲女士的日记》","title":"启蒙、革命与女性——重读丁玲《莎菲女士的日记》","author":"买琳芳、宋剑华","source":"《晋阳学刊》","date":"2023","note":"把莎菲放回启蒙、革命和女性解放的多重语境，指出“自由恋爱”若被推向绝对自我，会变成新的悖论。苇弟与凌吉士是莎菲及丁玲人格的两面，也构成时代镜像；个体若缺少社会支持，所谓自由仍可能走向虚无，并为其后的革命转向提供注脚。","url":"https://kns.cnki.net/kcms2/article/abstract?v=tQWh-SbE9GphT3h6PNDyJypYJFL3X8RwogJOb1k5M79kqXv0IC4Q4QleQ2UbxEQGjHxjStgTWzP2FZbzu7dOqQDAnHcCxsWH9W13tM_Yfix_vxWD-amzA6oE0KKGDsjPhpmCb1Ag90lAmKwTBD8w1WNhiIjntYDyJO1uURJyJooP_2DHDGtW2Q==","abstract":"《莎菲女士的日记》作为现代中国文学的经典作品，为重新认识丁玲的“不简单”与“复杂性”提供了重要的文本依据。日记中的莎菲与记录莎菲日记的丁玲同构，传达出丁玲有关启蒙、革命与女性的复杂态度。莎菲身体上的离家行为呈现出女性心理与启蒙话语的相互碰撞；莎菲情感上的“自由恋爱”则指向“个性解放”等同于绝对“自我”的逻辑悖论。苇弟与凌吉士作为莎菲与丁玲人格的两面，更体现为时代的双重镜像。这些矛盾又复杂的时代特质展现出新文学主体自我的生存困境，反映着五四青年在启蒙话语中的困惑与失落，揭示出新文学西化现代性的最大症结，也为其后知识群体思想的革命转向提供了注脚。","keywords":"《莎菲女士的日记》;丁玲;启蒙;革命;女性;","outline":["一、“莎菲”的反叛：女性心理与启蒙话语的相互碰撞","二、“莎菲”的追求：“自由恋爱”启蒙话语的性别悖论","三、“莎菲”的未来：新文学主体自我的生存困境与革命转变","四、结语"],"researchQuestions":["《莎菲女士的日记》中女性意识的觉醒体现在哪些方面？","丁玲笔下的苇弟与凌吉士角色设置有何深意？","《莎菲女士的日记》中的“自由恋爱”反映了怎样的社会背景？"]},{"workKey":"water","work":"《水》","title":"论丁玲《水》中的知识分子立场","author":"朱清如","source":"《文学教育》","date":"2023","doi":"10.16692/j.cnki.wxjys.2023.05.003","note":"论文关注《水》中除去左翼与人性之外的“知识分子立场”，并把这种立场与丁玲1930年代创作转型联系起来。","url":"https://kns.cnki.net/kcms2/article/abstract?v=tQWh-SbE9Gp9gntx0lNbnD9pLuswDaG-VpwCeAg8PL2jl_XJevtYNLZPHlwz7IoVpldL6JFUS28QC07SPtMiEtQtWdCmEie0JIbMl3_7yNZ-5kxKQnMMd-R-oWxyT9UME1dMxpwnAK8hpynpuPX_4qnAuWV2S6Tf4T3v-ZhiTahEo_WSEyckXQ==","abstract":"基于丁玲的革命作家身份来解读其中的左翼立场和人道主义立场，是小说《水》常见的两种研究思路。实际上，在“向左”和“向人”的转变以外，《水》中留下了属于知识分子立场的“残余”痕迹，以及由此而生的新的迹象。本文立足于1930年代的时代背景，从丁玲与知识分子之间的联系出发，挖掘《水》中的知识分子立场在形式、思想和作家创作追求上的文本证据，揭示小说在两大主流之外的“第三种声音”。同时，试图还原文本内部的“隐含作者”形象，进而展现丁玲作为知识分子作家走向自我探索、自我调适、自我改造的道路选择，旨在为丁玲30年代的创作转型研究打开新的窗口。","keywords":"《水》;丁玲;知识分子立场;隐含作者;","outline":["一.丁玲与知识分子立场","（一）知识分子的精神气质","（二）身为知识分子的丁玲","二.知识分子立场的文本证据","（一）形式上","（二）思想上","（三）创作追求上","三.“第三种声音”","（一）在“向左”与“向人”之外","（二）文本内部的“隐含作者”"],"researchQuestions":["丁玲《水》中的“第三种声音”具体指什么？","《水》中丁玲的知识分子立场如何体现？","1930年代的时代背景对丁玲《水》中的知识分子立场有何影响？"]},{"workKey":"water","work":"《水》","title":"1930年代上海多元化的文学生态——以丁玲《水》与赵清阁《旱》的比较为例","author":"赵焕亭、陈莹","source":"《鲁迅研究月刊》","date":"2019","note":"通过两篇灾害小说比较，说明《水》在左翼文学和社会书写中的位置。","url":"https://kns.cnki.net/kcms2/article/abstract?v=tQWh-SbE9Gp4BpCYYIn5ELpt8P-0VENJ3jUBobrm3CJIwt3Iekx8r4WKjQkR4xFw99GG6cubfiYruFQJKRMANIAoJtGwP235adNnDCksQ_i5MTxfX71MZQaLxSbD-AjNEwsK62bvg4LLlEEwXBt6ZdakUquau-dh-WyuSgK3TDHwmTDnFPW5eQ=="},{"workKey":"water","work":"《水》","title":"个性话语与革命话语的兼容与悖离——兼论丁玲小说《水》及冯雪峰《关于新的小说的诞生》对之的批评","author":"赵永刚","source":"《山东青年政治学院学报》","date":"2017","note":"讨论个体叙事和革命叙事之间的关系，适合分析群众觉醒和作者立场。","url":"https://kns.cnki.net/kcms2/article/abstract?v=tQWh-SbE9GoXRrPDrzTUvRdZIwVh64hCFVjhyGI9fDnjgInkv_CvKtiJf4uqZivykAKjEQigZhM-ztIfG0CBiSdkOIB6IwdHFMs8eNCmJ0o4Iqn9qsTTE0HlKZMJXLXJTRTsH3byZJzjX60qoBCyXN5DopUWOcUFUJXUpmTxSrax-d9JJTbKxA==","abstract":"小说《水》是丁玲以崭新的姿态,由自由的个性主义话语跨向革命话语宏大题材写作的艰难成长、嬗变。这一嬗变有着极为复杂的原因。丁玲小说《水》等文本心理驱力有着作家极为复杂的情感心理投射和主观意图的纠结。在历史情境中,冯雪峰《关于新的小说的诞生》对丁玲小说《水》的批评是其用笃信的革命话语对个性话语的规训与引导。其中,革命话语具有双刃作用:革命话语在引导\"小资作家\"坚定革命信念的方面,无疑有着强大的助推之功;但此一批评理路亦不乏偏颇之见,它排斥了个性话语的言说空间,忽视了作家极为丰富的写作情感内涵,对作家个人情感、心灵的深层开掘方面起了阻碍作用。","keywords":"丁玲;小说《水》;冯雪峰;革命话语;","outline":["一、规训与引导:无可抗拒的革命话语规范","二、焦虑与困惑:身不由已的两难情感","三、拯救抑或误导:批评范式的乏力与偏狭"],"researchQuestions":["冯雪峰对丁玲《水》的批评如何体现革命话语对个性话语的规训？","《关于新的小说的诞生》对丁玲小说的批评反映了当时文学思潮的何种倾向？","革命话语在丁玲小说《水》的创作中起到了怎样的作用与影响？"]},{"workKey":"hospital","work":"《在医院中》","title":"革命语境下“以道抗势”的个体回响——《在医院中》《组织部来了个年轻人》的理想与秩序","author":"王平、赵桐","source":"《红色文化研究》","date":"2026","pages":"41-51","note":"论文强调《在医院中》的核心不只是歌颂，而是反思革命现实中的“具体问题”，并关注个体精神与集体秩序之间的平衡。","url":"https://kns.cnki.net/kcms2/article/abstract?v=tQWh-SbE9Gr_Km9qvA2e5pbPeLBDa_xStzfZjrj1vZzkxrb35QKneNf1BnU5HZsWB7LJgtL035y4r7Xp5XLSPByD16Ap6B3sSnMlMKSUPmSv1PW05S54_ddKKyTOIY9tyuK3kUqOO_hcM33Fkmet407Jhk7nUAz-v4CgAFtcW9OLKS-JKw42ww==","abstract":"丁玲的《在医院中》和王蒙的《组织部来了个年轻人》这两部作品均不属于传统的红色经典小说,其核心是建设而非歌颂,作品对历史中的“具体问题”力求进行革命语境下的现实反思,与当代社会形成隐秘的呼应。对这些作品的多元化解读,让红色叙事不再停留于“过去的老故事”,而是成为回应现实困惑的精神资源。探究这两部作品在革命语境下对“个体价值”的关注,以及对“个体精神”与“集体秩序”平衡关系的思考,有助于凸显青年人主动融入集体和积极完善集体的精神内核,推动红色文化在当代找到更贴合人心的表达路径。","keywords":"丁玲;王蒙;革命语境;个体与集体;"},{"workKey":"hospital","work":"《在医院中》","title":"“Lu Ping” between an “Obstetric Assistant” and “Ideal Figure”: Reexamining In the Hospital","author":"宁媛媛","source":"《妇女研究论丛》","date":"2025","note":"围绕陆萍在“产科助手”和“理想人物”之间的身份张力，适合人物形象和身份转变题。","url":"https://kns.cnki.net/kcms2/article/abstract?v=tQWh-SbE9GqRTUhWcKwzJ-VpMmGUYYSb49FcjX4Vo-JwBUCV1h4k6bjzZpntoT1h5ijQpw8709BXJ7hQgM7gpdfbh8XtN4fJfv7IC5GWO6oyKosOXftNncmWqJwbefceCJIB_ySdNSxnYu3yqNJK_3dzdbCtp8-zrAiXRGYPiOYOuLgUAbaVXw==","abstract":"本文以丁玲为小说所作的检讨《关于〈在医院中〉》(草稿)为核心史料，通过细读分析还原小说主人公“陆萍”这一人物形象在“产科助手”与“理想人物”之间游移、断裂的复杂生成过程，及其在小说文本内容与形式上的呈现。同时，在小说与检讨稿的往返对读中细致剖析丁玲关于陆萍的创作初衷、创作观念、处理方式与最终呈现出的创作实际，并在视《在延安文艺座谈会上的讲话》为革命主体论的基础上，借“以历史—社会中的‘人’为媒介的社会史视野”重审《在医院中》及《关于〈在医院中〉》(草稿),尝试揭示出“陆萍”人物形象生成过程的背后作家丁玲的敏锐觉察与观念曲折在现代中国转型、中国共产主义革命运动、中国现当代文学史中的关键性和典型性。","keywords":"丁玲;《在医院中》;《关于〈在医院中〉》(草稿);《在延安文艺座谈会上的讲话》;","outline":["一、人物前史：“漂泊不群”的知识青年“到延安去”","二、创作初衷：从“产科助手”到“理想人物”","三、双重分裂：两个“陆萍”与两个“开头”","四、强打精神：以“理智”克服“感情脆弱”","五、他者理解：以“荆棘”衬托理想人物“力量”","六、革命的动力：“爱”还是“吃苦”","七、结语"],"researchQuestions":["如何理解《在医院中》中“陆萍”角色的复杂性及其象征意义？","《在延安文艺座谈会上的讲话》对丁玲的文学创作有何具体影响？","丁玲的作品如何体现了革命文艺理论中的“人”的概念？"]},{"workKey":"hospital","work":"《在医院中》","title":"成长叙事与多重主体的弥合——细读《在医院中》","author":"杨岳霖","source":"《文化学刊》","date":"2023","note":"从成长叙事和多重主体关系分析陆萍的变化，可用于“成长变化”和“人与环境冲突”题。","url":"https://kns.cnki.net/kcms2/article/abstract?v=tQWh-SbE9GojdksAc7woHn2EKGUFGsZL57--5R1Z_QPpI1d_hmABaB3I9ayqVisNVLCdCtGFrao_lVVdNrUL7_uHKgtR1Gfw4U4koSdB3OWLPegitWrb6C0gmXjDfjpn2WD2lPM4wp7_lqaSeV9DGc53AxQzbBINOMfHe6i6jYXjUyzuOY6wKw==","abstract":"小说《在医院中》是丁玲创作过程中的又一次转变之作，对该小说的评价众多。虽然各评论文章从不同方向对小说内容进 function researchView(){var html='<div class="hint">点击标题直接进入中国知网文献页；摘要、章节和论文研究问题已展开到题目下面。正文阅读权限以知网账户为准。</div>';Object.keys(WORKS).forEach(function(k){var arr=RESEARCH.filter(function(x){return x.workKey===k});if(!arr.length)return;html+='<div class="panel"><h3>'+esc(WORKS[k])+'</h3>'+arr.map(researchCard).join("")+'</div>'});return html}
function relatedButtons(ids){return (ids||[]).map(function(id){var item=DATA.find(function(x){return x.id===id});return item?'<button class="ghost" style="width:auto;display:inline-block;padding:7px 10px;margin:6px 6px 0 0;font-size:12.5px" data-related="'+esc(id)+'">'+esc(item.title)+'</button>':''}).join("")}
function pastCard(x){return '<div class="point"><div class="meta"><span class="tag">'+esc(x.year)+'</span><span class="tag">'+esc(x.session)+'</span><span class="tag">'+esc(x.paper)+'</span><span class="tag">第'+esc(x.questionNo)+'题</span><span class="tag">'+esc(x.kind)+'</span></div><div class="pointTitle">'+esc(x.question)+'</div><div class="field"><b>关键词</b>'+esc((x.keywords||[]).join("、"))+'</div>'+(x.excerptContext?'<div class="field"><b>选文提示</b>'+esc(x.excerptContext)+'</div>':'')+'<div class="field"><b>来源</b><a href="'+esc(x.sourceUrl)+'" target="_blank" rel="noopener">'+esc(x.sourceLabel)+'</a></div>'+relatedButtons(x.relatedIds)+'</div>'}
function predictionCard(x){return '<div class="point"><div class="meta"><span class="tag">'+esc(x.confidence)+'概率</span><span class="tag">预测方向</span></div><div class="pointTitle">'+esc(x.title)+'</div><div class="field"><b>可练设问</b>'+esc(x.question)+'</div><div class="field"><b>判断依据</b>'+esc(x.basis)+'</div>'+relatedButtons(x.relatedIds)+'</div>'}
function pastView(){var chips='<div class="chips"><button class="'+(state.work==="all"?"on":"")+'" data-past-work="all">全部</button>'+Object.keys(WORKS).map(function(k){return '<button class="'+(state.work===k?"on":"")+'" data-past-work="'+k+'">'+esc(WORKS[k])+'</button>'}).join("")+'</div>';var past=PAST.past.filter(function(x){return state.work==="all"||x.workKey===state.work});var preds=PAST.predictions.filter(function(x){return state.work==="all"||x.workKey===state.work});return chips+'<div class="panel"><h2>历年真题与时考方向</h2><p>'+esc(PAST.coverageNote)+'</p><p style="margin-top:7px">'+esc(PAST.structureNote)+'</p><div class="hint">'+esc(PAST.sourceNote)+'</div></div><div class="panel"><h3>已考真题与官方样卷</h3>'+past.map(pastCard).join("")+'</div><div class="panel"><h3>高概率预测方向</h3>'+preds.map(predictionCard).join("")+'</div>'}
function paperPanel(x){var sources=(x.paperSources||[]).map(function(v){return '<li>'+esc(v)+'</li>'}).join("");var variants=(x.examVariants||[]).map(function(v){return '<li>'+esc(v)+'</li>'}).join("");var papers=PAST.past.filter(function(p){return (p.relatedIds||[]).indexOf(x.id)>=0}).map(function(p){return '<li>'+esc(p.year+' '+p.session+' '+p.paper+' 第'+p.questionNo+'题')+'：'+esc(p.question)+'</li>'}).join("");if(!sources&&!variants&&!papers)return '';return '<div class="panel"><h3>转题与真题依据</h3>'+(sources?'<div class="field"><b>来源论文</b><ul class="paperList">'+sources+'</ul></div>':'')+(variants?'<div class="field"><b>可变形设问</b><ul class="paperList">'+variants+'</ul></div>':'')+(papers?'<div class="field"><b>相关历年真题</b><ul class="paperList">'+papers+'</ul></div>':'')+'</div>'}
function drawView(){var pool=DATA.filter(function(x){return state.work==="all"||x.workKey===state.work});var remaining=pool.filter(function(x){return state.drawHistory.indexOf(x.id)<0});var chips='<div class="chips"><button class="'+(state.work==="all"?"on":"")+'" data-draw-work="all">全部</button>'+Object.keys(WORKS).map(function(k){return '<button class="'+(state.work===k?"on":"")+'" data-draw-work="'+k+'">'+esc(WORKS[k])+'</button>'}).join("")+'</div>';if(state.drawItem){var x=state.drawItem;return chips+'<div class="panel"><div class="meta"><span class="tag">'+esc(workName(x.workKey))+'</span><span class="tag">'+esc(x.type)+'</span></div><h2>'+esc(x.title)+'</h2><p>'+esc(x.prompt)+'</p><div class="hint">先自己想：对应哪几个论点？分别在原文哪里？</div><button class="primary" id="openDraw">看论点与原文定位</button><button class="ghost" id="drawAgain" style="margin-top:8px">再抽一道</button></div><div class="hint">本轮已抽 '+state.drawHistory.length+' 道</div>'}return chips+'<div class="panel"><h2>随机抽取一道文学赏析题</h2><p>抽题后先自己组织论点，再点开看原文定位。</p><button class="primary" id="doDraw">抽取题目</button></div>'+(remaining.length?'<div class="hint">当前范围还可抽 '+remaining.length+' 道</div>':'<div class="hint">当前范围已经抽完，再抽一轮会自动重新开始。</div>')}
function detailView(x){var points=x.points.map(function(p,i){var bits=[];if(p.chapter)bits.push('章节：'+esc(p.chapter));if(p.pdfPage)bits.push('电子版PDF页：P'+esc(p.pdfPage));if(p.searchPhrase)bits.push('检索：'+esc(p.searchPhrase));if(p.page)bits.push('纸质页码：'+esc(p.page)+(p.edition?'（'+esc(p.edition)+'）':''));var page=bits.length?' · '+bits.join(' · '):'';return '<div class="point"><div class="pointTitle">论点 '+(i+1)+'：'+esc(p.point)+'</div><div class="field"><b>原文依据</b>'+esc(p.evidence)+'</div><div class="loc">定位：'+esc(p.location)+page+'</div><div class="field"><b>文学论证</b>'+esc(p.explain)+'</div><div class="field"><b>推进</b>'+esc(p.link)+'</div></div>'}).join("");var traps=x.traps.map(function(t){return '<div class="warn">'+esc(t)+'</div>'}).join("");var research=researchFor(x).map(researchCard).join("");return '<span class="back" id="back">← 返回</span><div class="panel"><div class="meta"><span class="tag">'+esc(workName(x.workKey))+'</span><span class="tag">'+esc(x.type)+'</span></div><h2>'+esc(x.title)+'</h2><p>'+esc(x.prompt)+'</p><div class="thesis"><b>中心论点</b><br>'+esc(x.thesis)+'</div></div>'+paperPanel(x)+'<div class="panel"><button class="ghost" id="toggleHide">'+(state.hide?"显示论点与原文定位":"先自己想，遮住答案")+'</button><div class="'+(state.hide?"hide":"")+'" id="answerBox" style="margin-top:12px"><h3>三个论点</h3>'+points+'</div></div><div class="panel"><h3>相关论文与可用观点</h3>'+research+'</div><div class="panel"><h3>扣题提醒</h3>'+traps+'</div>'}
function render(){var app=document.getElementById("app");if(state.selected){var item=DATA.find(function(x){return x.id===state.selected});app.innerHTML=item?detailView(item):'<div class="empty">没有找到这道题</div>'}else{app.innerHTML=state.mode==="match"?matchView():state.mode==="past"?pastView():state.mode==="research"?researchView():state.mode==="draw"?drawView():listView()}bind()}
function bind(){document.querySelectorAll("#tabs button").forEach(function(b){b.className=b.dataset.mode===state.mode?"on":"";b.onclick=function(){state.mode=b.dataset.mode;state.selected=null;state.hide=false;render()}});var search=document.getElementById("search");if(search)search.oninput=function(){state.query=this.value.trim();render();var el=document.getElementById("search");if(el){el.focus();el.selectionStart=el.selectionEnd=el.value.length}};document.querySelectorAll("[data-work]").forEach(function(b){b.onclick=function(){state.work=b.dataset.work;render()}});document.querySelectorAll("[data-past-work]").forEach(function(b){b.onclick=function(){state.work=b.dataset.pastWork;render()}});document.querySelectorAll("[data-draw-work]").forEach(function(b){b.onclick=function(){state.work=b.dataset.drawWork;state.drawItem=null;render()}});document.querySelectorAll("[data-open]").forEach(function(el){el.onclick=function(){state.selected=el.dataset.open;state.hide=false;render();window.scrollTo(0,0)}});document.querySelectorAll("[data-related]").forEach(function(b){b.onclick=function(){state.selected=b.dataset.related;state.hide=false;render();window.scrollTo(0,0)}});var box=document.getElementById("matchBox");if(box)box.oninput=function(){state.matchQuery=this.value};var doMatch=document.getElementById("doMatch");if(doMatch)doMatch.onclick=function(){state.matchQuery=document.getElementById("matchBox").value.trim();render()};var doDraw=document.getElementById("doDraw");if(doDraw)doDraw.onclick=function(){var pool=DATA.filter(function(x){return state.work==="all"||x.workKey===state.work});var remaining=pool.filter(function(x){return state.drawHistory.indexOf(x.id)<0});if(!remaining.length){state.drawHistory=[];remaining=pool}state.drawItem=remaining[Math.floor(Math.random()*remaining.length)];state.drawHistory.push(state.drawItem.id);render();window.scrollTo(0,0)};var openDraw=document.getElementById("openDraw");if(openDraw)openDraw.onclick=function(){state.selected=state.drawItem.id;state.hide=false;render();window.scrollTo(0,0)};var drawAgain=document.getElementById("drawAgain");if(drawAgain)drawAgain.onclick=function(){state.drawItem=null;render()};var back=document.getElementById("back");if(back)back.onclick=function(){state.selected=null;render()};var toggle=document.getElementById("toggleHide");if(toggle)toggle.onclick=function(){state.hide=!state.hide;render()}}
render();
</script>
</body>
</html>
