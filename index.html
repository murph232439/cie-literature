后","point":"婚姻危机爆发后，孙柔嘉用切断关系和否定人格的方式反击，情感冲突落实为对生活事务和尊严的全面清算。","evidence":"“好，咱们算散伙。行李衣服，你自己去办，别再来找我。”“你不但本领没有，连志气都没有，别跟我讲什么气节了。”","location":"第九章：方鸿渐准备去重庆投靠赵辛楣，孙柔嘉认为他既不独立也不可靠，夫妻争吵升级到分手。","explain":"婚姻没有给孙柔嘉稳定安全，她既要维持收入，又要承担家庭责任，还不断感到方鸿渐和方家轻视自己。长期委屈转化成攻击，她用散伙和侮辱切断关系，同时也暴露出强烈的自保意识。双方无法建立信任，婚姻最终成为彼此都想逃离的围城。","link":"结尾把孙柔嘉的性格变化与婚姻困境合在一起，说明围城由外部压力和双方性格共同形成。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第九章","searchPhrase":"好，咱们算散伙","pdfPage":"","chain":{"who":"孙柔嘉","action":"婚姻危机爆发后，孙柔嘉用切断关系和否定人格的方式反击，情感冲突落实为对生活事务和尊严的全面清算。","reason":"婚姻没有给孙柔嘉稳定安全，她既要维持收入，又要承担家庭责任，还不断感到方鸿渐和方家轻视自己","consequence":"结尾把孙柔嘉的性格变化与婚姻困境合在一起，说明围城由外部压力和双方性格共同形成。"}}],"traps":["只把孙柔嘉写成心机深重的恶人，忽略她在职业、经济和家庭关系中的现实压力。","只强调她柔弱或只强调她强势，没有写出订婚前后的变化过程。","把婚姻破裂全部归给孙柔嘉，忽略方鸿渐的逃避、依赖和沟通失败。"]},{"id":"fortress-tang-character","work":"《围城》","workKey":"fortress","type":"人物形象","title":"唐晓芙的真纯与爱情理想","prompt":"分析唐晓芙的性格特征，并说明这一形象在爱情主题中的作用。","keywords":["唐晓芙","真纯","爱情理想","骄傲","自尊","分手"],"thesis":"唐晓芙兼具自然真纯、聪明敏感和强烈自尊。她对爱情提出绝对纯粹、彼此完整占有的要求，这种理想使她区别于虚伪的社交人物，也使她无法接受方鸿渐复杂的过去和软弱。爱情理想的破裂由此成为方鸿渐成长中的重要转折。","points":[{"stage":"前","point":"唐晓芙以自然、未经矫饰的形象进入社交场，显示真挚和自主，与刻意制造时髦感的都市女性形成区别。","evidence":"“她头发没烫，眉毛不镊，口红也没有擦，似乎安心遵守天生的限止，不要弥补造化的缺陷。”","location":"第三章：方鸿渐初到苏文纨家，与唐晓芙第一次见面。","explain":"唐晓芙不借浓重装饰吸引注意，说明她对自身有稳定判断，也不愿完全服从社交场对女性外表的要求。她的自然感让方鸿渐把真诚和理想投射到她身上，这一形象因此成为小说爱情想象中最明亮的部分。自然外表同时让她获得主动评价他人的位置。","link":"初段用自然真纯建立唐晓芙的吸引力，也为后来爱情理想与现实人物之间的冲突埋下基础。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第三章","searchPhrase":"她头发没烫，眉毛不镊","pdfPage":"","chain":{"who":"唐晓芙","action":"唐晓芙以自然、未经矫饰的形象进入社交场，显示真挚和自主，与刻意制造时髦感的都市女性形成区别。","reason":"唐晓芙不借浓重装饰吸引注意，说明她对自身有稳定判断，也不愿完全服从社交场对女性外表的要求","consequence":"初段用自然真纯建立唐晓芙的吸引力，也为后来爱情理想与现实人物之间的冲突埋下基础。"}},{"stage":"中","point":"唐晓芙把爱情视为需要经受考验的崇高情感，并要求恋人的过去完全空白，体现坚定自尊和近乎绝对化的纯爱标准。","evidence":"“自己决不会爱方鸿渐，爱是又曲折又伟大的情感，决非那么轻易简单。”“我爱的人，我要能够占领他整个生命，他在碰见我以前，没有过去，留着空白等待我——”","location":"第三章末至第四章：唐晓芙与方鸿渐往来渐多，却始终用理想标准审视两人的关系。","explain":"唐晓芙不愿把爱情降为轻易获得的社交游戏，因此要求诚实、完整和唯一。绝对标准保护了她的人格尊严，也让她把恋人的过去理解为永久污点。方鸿渐既有婚约和旧关系，又以假文凭维持体面，这些现实经历注定无法进入她的纯爱理想。理想越崇高，双方越是缺少容纳人性弱点的空间。","link":"中段把唐晓芙的爱情观与方鸿渐的隐瞒连接起来，使分手具有性格和价值观的双重原因。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第三章","searchPhrase":"爱是又曲折又伟大的情感","pdfPage":"","chain":{"who":"唐晓芙","action":"唐晓芙把爱情视为需要经受考验的崇高情感，并要求恋人的过去完全空白，体现坚定自尊和近乎绝对化的纯爱标准。","reason":"方鸿渐既有婚约和旧关系，又以假文凭维持体面，这些现实经历注定无法进入她的纯爱理想","consequence":"中段把唐晓芙的爱情观与方鸿渐的隐瞒连接起来，使分手具有性格和价值观的双重原因。"}},{"stage":"后","point":"决裂时，唐晓芙用连续盘问守住自尊，也在真正希望听到解释时选择强硬语言，显示骄傲、受伤与情感克制并存。","evidence":"“唐小姐恨不能说：‘你为什么不辩护呢？我会相信你，’可是只说：‘那么再会。’”“唐小姐脾气高傲，宁可忍痛至于生病。”","location":"第四章：唐晓芙从苏文纨处得知方鸿渐过去和学历问题后当面质问，方鸿渐无法辩护并离去。","explain":"唐晓芙并不完全想结束关系，她等待方鸿渐给出可信解释；方鸿渐因羞愧和自卑主动承认欺骗，令她无法在维护自尊的同时挽回感情。她宁愿承受病痛，也不肯降低标准或主动示弱。分手既是方鸿渐懦弱的结果，也是唐晓芙理想主义和骄傲共同造成的选择。","link":"后段将唐晓芙的纯洁理想与性格硬度并置，她的爱情失败因此既是人物悲剧，也推动方鸿渐重新认识自己。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第四章","searchPhrase":"唐小姐恨不能说","pdfPage":"","chain":{"who":"唐晓芙","action":"决裂时，唐晓芙用连续盘问守住自尊，也在真正希望听到解释时选择强硬语言，显示骄傲、受伤与情感克制并存。","reason":"方鸿渐因羞愧和自卑主动承认欺骗，令她无法在维护自尊的同时挽回感情","consequence":"后段将唐晓芙的纯洁理想与性格硬度并置，她的爱情失败因此既是人物悲剧，也推动方鸿渐重新认识自己。"}}],"traps":["只把唐晓芙写成完美无缺的理想女性，忽略她爱情标准中的绝对化和骄傲。","只责怪苏文纨挑拨，不分析唐晓芙自身如何判断和结束关系。","只写她外貌清纯，不引用她关于爱情和未来的具体言语。"]},{"id":"fortress-gao-songnian-character","work":"《围城》","workKey":"fortress","type":"人物形象","title":"高松年的行政权术","prompt":"分析高松年的性格特征及其讽刺意义。","keywords":["高松年","校长","权术","官僚","信用","知识分子"],"thesis":"高松年精于行政算计、控制信息和维护个人权威。他用科学语言包装功利管理，把教师职位当作权力资源，并在政治风险出现时迅速推卸责任。这一形象讽刺了战时大学管理中官僚权术与学术理想的背离。","points":[{"stage":"前","point":"初登场时，高松年的勤敏和精明被夸张描写，叙述语气表面赞扬，实际暗示其精明服务于个人和行政权力。","evidence":"“高松年发奋办公，亲兼教务长，精明得真是睡觉还睁着眼睛，戴着眼镜，做梦都不含糊的。”","location":"第六章开头：三闾大学校长高松年正式进入叙述，叙述者介绍其资历与办事作风。","explain":"高松年同时掌握校长和教务长权力，工作能力越强，操纵人事的空间也越大。叙述者用近乎赞美的语句放大他的精明，随即展开聘约与职位安排中的算计，反差产生讽刺。效率成为权力集中和自我保护的包装。校务越被个人控制，教师评价和学术管理越容易退化为行政意志的执行。","link":"前段建立高松年强势能干的公共形象，并为后文揭示行政权术制造反差。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第六章","searchPhrase":"高松年发奋办公","pdfPage":"","chain":{"who":"高松年","action":"初登场时，高松年的勤敏和精明被夸张描写，叙述语气表面赞扬，实际暗示其精明服务于个人和行政权力。","reason":"高松年同时掌握校长和教务长权力，工作能力越强，操纵人事的空间也越大","consequence":"前段建立高松年强势能干的公共形象，并为后文揭示行政权术制造反差。"}},{"stage":"中","point":"在聘约问题上，高松年根据个人判断随意降低方鸿渐职称，并把年轻和资历当作控制教师的理由。","evidence":"“他自己开来的学历，并没有学位，只是个各国游荡的‘游学生’，并且并非学政治的，聘他当教授太冤枉了！至多做副教授，循序渐升，年轻人做事不应该爬得太高。”","location":"第六章：方鸿渐到校后，高松年把原先聘为教授的口头承诺改成副教授。","explain":"高松年先以学历和年龄为自己的决定寻找理由，再用“循序渐升”掩盖失信。职位升降缺少公开规则，教师只能接受行政意志。年龄和资历被用作压低年轻人的工具，学校的管理逻辑因此与学术能力评估脱节，知识分子的职业尊严也受到伤害。","link":"中段把精明落实到具体权术，说明高松年的行政能力主要表现为控制下属而非建设学术。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第六章","searchPhrase":"聘他当教授太冤枉了","pdfPage":"","chain":{"who":"方鸿渐","action":"在聘约问题上，高松年根据个人判断随意降低方鸿渐职称，并把年轻和资历当作控制教师的理由。","reason":"职位升降缺少公开规则，教师只能接受行政意志","consequence":"中段把精明落实到具体权术，说明高松年的行政能力主要表现为控制下属而非建设学术。"}},{"stage":"后","point":"当政治风险出现时，高松年以思想问题为由停聘方鸿渐，并借“可惜”维持自己公正惜才的形象。","evidence":"“我本来要升他一级，谁知道他思想有问题，下学期只能解聘。这个人倒是可造之才，可惜！可惜！”","location":"第八章：陆子潇发现方鸿渐房中有共产主义书籍，李梅亭书面报告，高松年决定下学期不再聘用方鸿渐。","explain":"高松年把一本书和一次报告直接等同于思想问题，用政治安全替代事实调查和职业程序。他先说自己原本准备升职，再把责任推给外部风险，从而既清除可能带来麻烦的教师，又维持惜才公正的外表。大学权力因此进一步向行政控制集中。","link":"结尾揭示高松年的精明包含趋利避害和政治卸责，使其官僚性格具有更广泛的社会讽刺意义。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第八章","searchPhrase":"我本来要升他一级","pdfPage":"","chain":{"who":"方鸿渐","action":"当政治风险出现时，高松年以思想问题为由停聘方鸿渐，并借“可惜”维持自己公正惜才的形象。","reason":"高松年把一本书和一次报告直接等同于思想问题，用政治安全替代事实调查和职业程序","consequence":"结尾揭示高松年的精明包含趋利避害和政治卸责，使其官僚性格具有更广泛的社会讽刺意义。"}}],"traps":["只列举高松年狡猾、虚伪，不分析他如何利用职位和制度。","把高松年写成单纯无能的人，忽略他行政操作上的精明。","只写他对个别教师的欺骗，不联系学校权力结构和社会环境。"]},{"id":"fortress-li-meiting-character","work":"《围城》","workKey":"fortress","type":"人物形象","title":"李梅亭的虚荣与贪利","prompt":"分析李梅亭的性格特征及其讽刺意义。","keywords":["李梅亭","虚荣","贪利","西药","训导长","知识分子"],"thesis":"李梅亭重视体面、私利和个人权威，言行中不断暴露虚傲、贪利和道德表演。他把学历与头衔包装成身份，把西药变成牟利资本，又把训导权用于窥探和控制他人。这一人物集中讽刺战时知识群体的功利化和道德虚伪。","points":[{"stage":"前","point":"旅途初期，李梅亭通过衣着、姿态和冷漠显示身份优越感，外表体面成为遮盖功利品格的道具。","evidence":"“中国文学系主任李梅亭是高松年的老同事，四十来岁年纪，戴副墨晶眼镜，神情傲兀，不大理会人，并且对天气也鄙夷不理，因为这是夏历六月中旬，他穿的还是黑呢西装外套。”","location":"第五章：赵辛楣组织赴三闾大学的同行者见面，李梅亭以中国文学系主任身份首次出现。","explain":"李梅亭在盛夏坚持穿厚重西装，又对他人的寒暄保持高傲，说明他重视给外界留下严肃、尊贵的形象。体面并不来自真实学问，而由头衔、服饰和冷淡姿态共同制造。旁人越把他看成了不起的人物，他越容易隐藏自私和贪利。","link":"前段以外在体面和傲慢建立人物面具，为后文药箱和训导权暴露真实欲望作准备。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第五章","searchPhrase":"戴副墨晶眼镜","pdfPage":"","chain":{"who":"李梅亭","action":"旅途初期，李梅亭通过衣着、姿态和冷漠显示身份优越感，外表体面成为遮盖功利品格的道具。","reason":"体面并不来自真实学问，而由头衔、服饰和冷淡姿态共同制造","consequence":"前段以外在体面和傲慢建立人物面具，为后文药箱和训导权暴露真实欲望作准备。"}},{"stage":"中","point":"进入学校后，李梅亭把随身西药作为谈判资本，借学校缺药迫使其接受高价购买，显示明确的牟利动机。","evidence":"“这箱子里一半是西药，原瓶封口的消治龙、药特灵、金鸡纳霜、福美明达片，应有尽有。”“内地买不到西药，各位万一生起病来，那时候才知道我李梅亭的功劳呢！”","location":"第五章末至第六章：众人发现李梅亭铁箱中的大量西药，到校后他又要求学校按自己的价格收购。","explain":"李梅亭先以“为大家备药”的话掩饰药品的商业用途，随后利用学校缺药和自己掌握货源的条件提出交易。公共需要被转化为个人收益，他还在谈判中表现得理直气壮。头衔和知识身份因此成为经营私利的渠道，教育与公共服务被进一步商品化。","link":"中段揭示李梅亭体面外表下的逐利本质，使人物讽刺从作风夸张进入利益关系。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第五章","searchPhrase":"这箱子里一半是西药","pdfPage":"","chain":{"who":"李梅亭","action":"进入学校后，李梅亭把随身西药作为谈判资本，借学校缺药迫使其接受高价购买，显示明确的牟利动机。","reason":"公共需要被转化为个人收益，他还在谈判中表现得理直气壮","consequence":"中段揭示李梅亭体面外表下的逐利本质，使人物讽刺从作风夸张进入利益关系。"}},{"stage":"后","point":"担任训导长后，李梅亭用道德判断和流言窥探他人私生活，借管理职责扩大个人影响。","evidence":"“准出了乱子了，否则不会肯订婚的。你们瞧，订婚之后马上就会结婚。其实何必一番手脚两番做呢？干脆同居得了。”“这事有关学校风纪，我将来要唤起校长的注意，我管训导，有我的职责。”","location":"第七章：方鸿渐与孙柔嘉订婚后，李梅亭散布二人“出了问题”的猜测，并声称要从学校风纪角度报告校长。","explain":"李梅亭把私人婚姻解释成有损风纪的丑闻，用低俗猜测吸引同事注意，再以训导职责为自己的干涉寻找正当性。关注他人私生活能够满足他的窥探欲，也能强化他在学校中的权力感。道德话语因此成为控制和攻击他人的工具。","link":"结尾把虚荣和贪利推进到道德伪善，完成李梅亭作为庸俗官僚式知识分子的完整讽刺。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第七章","searchPhrase":"准出了乱子了","pdfPage":"","chain":{"who":"李梅亭","action":"担任训导长后，李梅亭用道德判断和流言窥探他人私生活，借管理职责扩大个人影响。","reason":"李梅亭把私人婚姻解释成有损风纪的丑闻，用低俗猜测吸引同事注意，再以训导职责为自己的干涉寻找正当性","consequence":"结尾把虚荣和贪利推进到道德伪善，完成李梅亭作为庸俗官僚式知识分子的完整讽刺。"}}],"traps":["只写李梅亭吝啬或好色，没有分析他如何利用身份、物资和管理权。","把西药事件写成笑料，不说明公共资源怎样被私人牟利。","只批评个人品格，不联系战时教育环境中的功利风气。"]},{"id":"fortress-fang-father-character","work":"《围城》","workKey":"fortress","type":"人物形象","title":"方遯翁的封建家长面孔","prompt":"分析方遯翁的性格特征及其对作品主题的作用。","keywords":["方遯翁","方老先生","封建家长","科举","面子","父子关系"],"thesis":"方遯翁是衰落中的封建家长典型。他维护父权、重视家族体面，喜欢用古书和训诫证明自己高明，又常以便利自己的方式解释传统道德。这一形象把家庭内部的专制与国家旧文化中的僵化习惯联系起来。","points":[{"stage":"前","point":"方遯翁以父权、科举语言和道德训诫压制儿子的私人选择，家庭关系首先表现为不容挑战的命令关系。","evidence":"“吾不惜重资，命汝千里负笈，汝埋头攻读之不暇，而有余闲照镜耶？汝非妇人女子，何须置镜？”“当是汝校男女同学，汝睹色起意，见异思迁；汝托词悲秋，吾知汝实为怀春。”","location":"第一章至第二章：方鸿渐留学前请求解除旧婚约，方遯翁立即回信痛骂并威胁停止寄款。","explain":"方遯翁把教育投入理解为支配儿子的权利，又用性别等级和道德指控堵住解释。讨论私人婚姻本应涉及当事人的意愿，他却把它变成孝道和家族服从问题。父权通过经济威胁得到执行，方鸿渐由此形成畏惧权威和回避冲突的性格起点。","link":"前段建立方遯翁严厉、专断的家长形象，也为方鸿渐长期依赖又畏惧父亲埋下原因。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第一章","searchPhrase":"汝非妇人女子","pdfPage":"","chain":{"who":"作者与叙事者","action":"方遯翁以父权、科举语言和道德训诫压制儿子的私人选择，家庭关系首先表现为不容挑战的命令关系。","reason":"方遯翁把教育投入理解为支配儿子的权利，又用性别等级和道德指控堵住解释","consequence":"前段建立方遯翁严厉、专断的家长形象，也为方鸿渐长期依赖又畏惧父亲埋下原因。"}},{"stage":"中","point":"方遯翁把日常言行整理成日记、自传和训子材料，表现强烈的自我欣赏和表演意识。","evidence":"“鸿渐知道这些话虽然对自己说，而主要是记载在日记和回忆录里给天下后世看方遯翁怎样教子以义方的。”“这种精神上的顾影自怜使他写自传、写日记。”","location":"第四章：方鸿渐准备前往三闾大学，方遯翁发表成套临别赠言，日记中又对事实进行修饰。","explain":"方遯翁把教育儿子、评论亲友和家庭冲突都改写成自己高明仁厚的证据。日记本应记录事实，却成为塑造个人形象的工具，他还会借文字褒贬他人。传统道德话语因此服务于自我神化，旧式读书人的学问也退化成摆姿态和写批语。","link":"中段揭示方遯翁的旧学权威带有强烈表演性，讽刺家庭与知识分子生活中的自恋和虚假。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第四章","searchPhrase":"给天下后世看方遯翁","pdfPage":"","chain":{"who":"方鸿渐及相关人物","action":"方遯翁把日常言行整理成日记、自传和训子材料，表现强烈的自我欣赏和表演意识。","reason":"方遯翁把教育儿子、评论亲友和家庭冲突都改写成自己高明仁厚的证据","consequence":"中段揭示方遯翁的旧学权威带有强烈表演性，讽刺家庭与知识分子生活中的自恋和虚假。"}},{"stage":"后","point":"儿子婚后，方遯翁仍以家长身份安排媳妇角色，用家庭秩序阻止孙柔嘉保有独立工作。","evidence":"“我有句话劝你。做事固然很好，不过夫妇俩同在外面做事，‘家无主，扫帚倒竖’，乱七八糟，家庭就有名无实了。我并不是顽固的人，我总觉得女人的责任是管家。”","location":"第九章：孙柔嘉第一次正式到方家，方遯翁当面劝她不要外出做事。","explain":"方遯翁先承认女性工作并非坏事，随后又借家庭秩序和性别分工否定共同工作的可能。这种表达保留开明姿态，实际仍要求媳妇服从夫家秩序。家庭体面因此建立在女性放弃职业自主的基础上，方鸿渐和孙柔嘉的婚姻冲突也被父权观念进一步放大。","link":"结尾让家庭旧伦理直接进入婚姻矛盾，说明围城不只来自夫妻性格，也来自更传统的家庭权力结构。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第九章","searchPhrase":"家无主，扫帚倒竖","pdfPage":"","chain":{"who":"孙柔嘉","action":"儿子婚后，方遯翁仍以家长身份安排媳妇角色，用家庭秩序阻止孙柔嘉保有独立工作。","reason":"方遯翁先承认女性工作并非坏事，随后又借家庭秩序和性别分工否定共同工作的可能","consequence":"结尾让家庭旧伦理直接进入婚姻矛盾，说明围城不只来自夫妻性格，也来自更传统的家庭权力结构。"}}],"traps":["只把方遯翁写成搞笑的长辈，忽略父权、经济控制和文化保守。","只引用他讲古文，不解释这些训诫怎样影响方鸿渐和婚姻关系。","把他视为纯粹旧派人物，忽略他还会包装开明姿态维护权威。"]},{"id":"fortress-fang-mother-character","work":"《围城》","workKey":"fortress","type":"人物形象","title":"方老太太的溺爱与婆媳压力","prompt":"分析方老太太的性格特征及其在家庭关系中的作用。","keywords":["方老太太","母亲","溺爱","婆媳","传统家庭","孙柔嘉"],"thesis":"方老太太对儿子有深厚而具体的母爱，习惯以饮食、衣物和生活照顾表达情感。与此同时，她遵从旧家庭等级和地域偏见，期待媳妇服从并继续照顾儿子。母爱由此同时具有温暖、占有和压迫的性质。","points":[{"stage":"前","point":"方老太太对儿子的关怀集中于吃穿和身体照料，表现真挚母爱，也显示她理解亲子关系的主要方式是生活包办。","evidence":"“方老太太挑好的送到他饭碗上，说：‘我想你在外国四年真可怜，什么都没得吃！’”“方老太太说，明天叫裁缝来做他的纺绸大褂和里衣裤。”","location":"第二章：方鸿渐留学回国后返乡，方老太太立即安排裁衣、饮食和拜访亲友所需衣物。","explain":"方老太太用最好食物和及时置办衣物表达想念，关心具体而真切。她把儿子的生活需要长期视为自己的责任，也从照料中获得母亲价值。这种爱让家庭显得安定，同时使方鸿渐习惯被安排，成年后仍缺少独立处理生活的能力。","link":"前段建立母爱的具体温度，也埋下母亲包办生活继续干预成年婚姻的伏笔。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第二章","searchPhrase":"我想你在外国四年真可怜","pdfPage":"","chain":{"who":"方鸿渐及相关人物","action":"方老太太对儿子的关怀集中于吃穿和身体照料，表现真挚母爱，也显示她理解亲子关系的主要方式是生活包办。","reason":"她把儿子的生活需要长期视为自己的责任，也从照料中获得母亲价值","consequence":"前段建立母爱的具体温度，也埋下母亲包办生活继续干预成年婚姻的伏笔。"}},{"stage":"中","point":"面对儿子的自由婚姻，方老太太首先要求父母知情权，并以地域偏见判断未来媳妇是否适合家庭。","evidence":"“方老太太尤其怪儿子冒失，怎么不先征求父母同意就订婚了。”“她是不是外省人？外省人的脾气总带点儿蛮，跟咱们合不来的。”","location":"第九章：方鸿渐来信报告与孙柔嘉订婚，方家父母在饭前关门研究此事。","explain":"方老太太把成年儿子的婚姻视为必须由父母批准的家庭事务，又把地域差异解释成品性不合。她关心的不只是儿子是否幸福，还包括媳妇能否服从既有家庭习惯。传统母亲身份因此与地域偏见、家庭边界和面子观念结合，孙柔嘉还未见面便已被置于审视位置。母爱的占有性由此转化成婆媳结构中的防备，为后续冲突提供条件。","link":"中段说明母爱的占有性会转化成婆媳结构中的防备，为后续冲突提供条件。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第九章","searchPhrase":"怎么不先征求父母同意","pdfPage":"","chain":{"who":"方鸿渐与孙柔嘉","action":"面对儿子的自由婚姻，方老太太首先要求父母知情权，并以地域偏见判断未来媳妇是否适合家庭。","reason":"方老太太把成年儿子的婚姻视为必须由父母批准的家庭事务，又把地域差异解释成品性不合","consequence":"中段说明母爱的占有性会转化成婆媳结构中的防备，为后续冲突提供条件。"}},{"stage":"后","point":"婚后相处中，方老太太用照顾儿子的话题批评媳妇忙碌，继续以母亲身份争夺对儿子生活的支配权。","evidence":"“你近来瘦了，脸上一点不滋润。在家里吃些什么东西？柔嘉做事忙，没工夫当心你，你为什么不到这儿来吃饭？”","location":"第九章：方鸿渐和孙柔嘉回方家吃饭，方老太太当众质问儿子饮食，并把责任推给孙柔嘉。","explain":"方老太太用关心身体的方式指出媳妇失职，又把家中饭菜和母爱记忆作为比较标准。孙柔嘉的职业和独立生活因此被解释为对丈夫照顾不周，婆媳关系成为家庭权力竞争。母爱若不能退出成年儿子的婚姻边界，就会持续制造压力和疏离。","link":"结尾显示方老太太既是慈母也是传统家庭秩序的维护者，她放大了方鸿渐婚姻中的围城感。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第九章","searchPhrase":"柔嘉做事忙，没工夫当心你","pdfPage":"","chain":{"who":"方鸿渐及相关人物","action":"婚后相处中，方老太太用照顾儿子的话题批评媳妇忙碌，继续以母亲身份争夺对儿子生活的支配权。","reason":"方老太太用关心身体的方式指出媳妇失职，又把家中饭菜和母爱记忆作为比较标准","consequence":"结尾显示方老太太既是慈母也是传统家庭秩序的维护者，她放大了方鸿渐婚姻中的围城感。"}}],"traps":["只写方老太太慈爱，不分析母爱中的占有和家庭控制。","把婆媳矛盾全部归罪于孙柔嘉，忽略方老太太的等级观念。","只写她照顾饮食，不联系地域偏见和对职业女性的否定。"]},{"id":"fortress-su-wenwan-character","work":"《围城》","workKey":"fortress","type":"人物形象","title":"苏文纨的才女面具","prompt":"分析苏文纨的性格特征及其讽刺意义。","keywords":["苏文纨","女博士","虚荣","爱情","面子","大家闺秀"],"thesis":"苏文纨受过良好教育，也具备社交能力和自我判断，然而她过度重视身价、面子和他人仰慕。爱情被她理解为证明魅力和控制追求者的过程，受挫后又会转为报复和占有。婚姻中的商业利益与暧昧关系进一步揭穿才女外衣下的虚荣和世俗欲望。","points":[{"stage":"前","point":"苏文纨把爱情设计为让追求者仰慕、屈服的过程，从一开始就追求情感关系中的优越位置。","evidence":"“苏小姐理想的自己是：‘艳如桃李，冷若冰霜’，让方鸿渐卑逊地仰慕而后屈伏地求爱。”","location":"第一章：苏文纨与方鸿渐同船回国，她有意利用航行期间给方鸿渐亲近机会。","explain":"苏文纨拥有博士身份和社交自信，却在爱情中沿用高姿态策略。她希望被仰慕，又把对方主动追求视为自身价值的证明。鲍小姐轻易吸引方鸿渐，击伤了这种自我想象，也让她从竞争和面子角度理解感情。爱情因此接近一场位置争夺。","link":"前段建立苏文纨的优越感和征服式爱情观，为后来的报复与占有欲埋下原因。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第一章","searchPhrase":"艳如桃李，冷若冰霜","pdfPage":"","chain":{"who":"苏文纨","action":"苏文纨把爱情设计为让追求者仰慕、屈服的过程，从一开始就追求情感关系中的优越位置。","reason":"她希望被仰慕，又把对方主动追求视为自身价值的证明","consequence":"前段建立苏文纨的优越感和征服式爱情观，为后来的报复与占有欲埋下原因。"}},{"stage":"中","point":"恋情失败后，苏文纨的自尊迅速转为愤怒，她既不能接受拒绝，也希望继续保持对赵辛楣的情感影响。","evidence":"“你——你这浑蛋！”“她不嫁赵辛楣，可是她潜意识底，也许要赵辛楣从此不娶，耐心等曹元朗死了候补。”","location":"第四章：方鸿渐通过电话明确表示另有所爱，苏文纨受到羞辱；随后她与曹元朗订婚。","explain":"苏文纨无法忍受方鸿渐选择他人，也不肯承认自己在感情竞争中失败。她选择曹元朗能够迅速恢复婚姻体面，同时仍希望赵辛楣保持等待和仰慕。理智上的婚姻选择与潜意识中的占有欲同时存在，才女形象因此显出强烈的虚荣。","link":"中段揭示她的知识和体面没有转化成情感成熟，失恋反而暴露出强烈的面子与控制心理。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第四章","searchPhrase":"她不嫁赵辛楣","pdfPage":"","chain":{"who":"苏文纨","action":"恋情失败后，苏文纨的自尊迅速转为愤怒，她既不能接受拒绝，也希望继续保持对赵辛楣的情感影响。","reason":"苏文纨无法忍受方鸿渐选择他人，也不肯承认自己在感情竞争中失败","consequence":"中段揭示她的知识和体面没有转化成情感成熟，失恋反而暴露出强烈的面子与控制心理。"}},{"stage":"后","point":"婚后，苏文纨把社会关系转化为私货和商业利益，同时继续与赵辛楣保持暧昧拉扯，才女与闺秀身份进一步商品化。","evidence":"“她每次飞到重庆去，总带些新出的化装品、药品、高跟鞋、自来水笔之类去送人，也许是卖钱，我不清楚。”“她真会经纪呢！”","location":"第八章：方鸿渐与孙柔嘉在香港拜见赵老太太，苏文纨携带私货并借旧信与赵辛楣维持暧昧关系。","explain":"苏文纨利用战时物资流通和上层关系获取收益，还借保存旧信、逐封归还的方式继续影响赵辛楣。高雅身份、文化头衔和感情记忆都成为经营社会资本的工具。她对孙柔嘉的轻慢又表现阶级优越感，婚姻没有削弱虚荣，反而让她更熟练地追逐利益。","link":"结尾彻底揭开才女面具，苏文纨的形象讽刺主要集中在文化身份与世俗欲望之间的落差。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第八章","searchPhrase":"她每次飞到重庆去","pdfPage":"","chain":{"who":"苏文纨","action":"婚后，苏文纨把社会关系转化为私货和商业利益，同时继续与赵辛楣保持暧昧拉扯，才女与闺秀身份进一步商品化。","reason":"她对孙柔嘉的轻慢又表现阶级优越感，婚姻没有削弱虚荣，反而让她更熟练地追逐利益","consequence":"结尾彻底揭开才女面具，苏文纨的形象讽刺主要集中在文化身份与世俗欲望之间的落差。"}}],"traps":["只把苏文纨写成被方鸿渐辜负的女子，忽略她的控制欲和报复行为。","只强调她女博士、大家闺秀的身份，不分析这些身份如何服务于面子和利益。","把她的投机行为简单归因于婚姻不幸，忽略性格中长期的虚荣与占有欲。"]},{"id":"fortress-zhao-xinmei-character","work":"《围城》","workKey":"fortress","type":"人物形象","title":"赵辛楣的精明与义气","prompt":"分析赵辛楣的性格特征及其与方鸿渐的对照作用。","keywords":["赵辛楣","精明","义气","政治","朋友","方鸿渐","对照"],"thesis":"赵辛楣家世和能力资源充足，性格自信主动、熟悉人情与职业规则。他初期带有自负和竞争意识，逐渐显出务实、重情和帮助朋友的一面。其事业能力与社交适应力构成方鸿渐的重要对照，也说明清醒和资源未必能解决全部人生困境。","points":[{"stage":"前","point":"初次见面时，赵辛楣以社交审视和轻蔑姿态压制方鸿渐，表现强烈自信、竞争意识和阶级优越感。","evidence":"“赵辛楣和鸿渐拉拉手，傲兀地把他从头到脚看一下，好像鸿渐是页一览而尽的大字幼稚园读本。”“他的表情就仿佛鸿渐化为稀淡的空气，眼睛里没有这人。”","location":"第三章：赵辛楣在苏文纨家第一次见到方鸿渐，把他视为追求苏文纨的竞争者。","explain":"赵辛楣拥有家世、学历和体面职业，习惯在社交场中占据主动。他通过身体视线和冷淡态度否定方鸿渐，希望用优势地位吓退竞争者。方鸿渐迅速转为局促和自我怀疑，两人的心理强弱立即形成对照。赵辛楣的主动既有个人魅力，也包含傲慢和竞争性。","link":"前段以社交场建立两人的强弱差异，为后续友谊和职业依赖关系提供性格基础。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第三章","searchPhrase":"赵辛楣和鸿渐拉拉手","pdfPage":"","chain":{"who":"方鸿渐","action":"初次见面时，赵辛楣以社交审视和轻蔑姿态压制方鸿渐，表现强烈自信、竞争意识和阶级优越感。","reason":"他通过身体视线和冷淡态度否定方鸿渐，希望用优势地位吓退竞争者","consequence":"前段以社交场建立两人的强弱差异，为后续友谊和职业依赖关系提供性格基础。"}},{"stage":"中","point":"进入职场后，赵辛楣善于调整原则以适应现实，显示政治 pragmatism 与办事能力，也暴露知识分子对环境的妥协。","evidence":"“也许我说过的，可是我要训练的是人，不是训练些机器。并且此一时，彼一时。”“话是空的，人是活的；不是人照着话做，是话跟着人变。”","location":"第七章：赵辛楣在三闾大学感受到教育管理的问题，对原先关于教学和政治活动的理想作出修正。","explain":"赵辛楣能够理解制度和人际运作，因此发现理想中的教育方式难以实施。他根据新经验调整判断，显示务实和行动能力，同时也用情境变化为自己前后不一提供解释。与方鸿渐长期停留在懊悔和自我怀疑相比，赵辛楣更愿意承认现实并转向下一选择。","link":"中段说明赵辛楣的优势在于适应现实，代价是理想和原则会随处境被重新解释。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第七章","searchPhrase":"话是空的，人是活的","pdfPage":"","chain":{"who":"赵辛楣","action":"进入职场后，赵辛楣善于调整原则以适应现实，显示政治 pragmatism 与办事能力，也暴露知识分子对环境的妥协。","reason":"赵辛楣能够理解制度和人际运作，因此发现理想中的教育方式难以实施","consequence":"中段说明赵辛楣的优势在于适应现实，代价是理想和原则会随处境被重新解释。"}},{"stage":"后","point":"离开三闾大学后，赵辛楣的事业上升，仍持续帮助方鸿渐，表现重情义和社会行动能力，也再次形成方鸿渐的依附关系。","evidence":"“辛楣进了国防委员会，来信颇为得意，比起出走时的狼狈，像换了一个人。”“辛楣既然一番好意，我很想再到里面去碰碰运气。”","location":"第八章至第九章：赵辛楣进入国防委员会，方鸿渐失业后准备前往重庆投靠他。","explain":"赵辛楣善于重新寻找社会位置，离开学校后事业迅速好转，仍愿为方鸿渐提供工作机会。帮助显示义气和行动力，也使方鸿渐再次把朋友的资源当成自己的出路。两人能力、适应力和独立性差异因此延续到结尾，赵辛楣的成熟形象反衬出方鸿渐长期的被动。","link":"结尾通过友情中的帮助与依附，使赵辛楣同时成为可靠朋友和方鸿渐人生困境的照镜人物。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第八章","searchPhrase":"辛楣进了国防委员会","pdfPage":"","chain":{"who":"方鸿渐","action":"离开三闾大学后，赵辛楣的事业上升，仍持续帮助方鸿渐，表现重情义和社会行动能力，也再次形成方鸿渐的依附关系。","reason":"赵辛楣善于重新寻找社会位置，离开学校后事业迅速好转，仍愿为方鸿渐提供工作机会","consequence":"结尾通过友情中的帮助与依附，使赵辛楣同时成为可靠朋友和方鸿渐人生困境的照镜人物。"}}],"traps":["只把赵辛楣写成完美好友，忽略他早期的傲慢、竞争心和现实妥协。","只强调他比方鸿渐成功，不分析两人的家世、资源和行动方式差异。","把方鸿渐投靠赵辛楣只写成友情，不写出依赖关系带来的自我怀疑。"]},{"id":"fortress-new-women-portrait","work":"《围城》","workKey":"fortress","type":"人物群像","title":"新女性群像：自主、功利与困境","prompt":"分析《围城》中新女性群像的多样性及其局限。","keywords":["新女性","鲍小姐","苏文纨","唐晓芙","孙柔嘉","汪太太"],"thesis":"《围城》中的新女性并非统一形象：鲍小姐用身体与婚姻换取机会，苏文纨用学历和身价控制追求者，唐晓芙坚守纯爱理想，孙柔嘉以主见和现实计算争取婚姻安全，汪太太则把性别与婚姻转化为幕后支配力。她们都试图掌握选择权，又都受到男性中心秩序限制。","points":[{"stage":"前","point":"早期新女性把教育与婚恋选择结合起来，用现代身份争取机会，同时仍把男性和婚姻视为上升渠道。","evidence":"“她宁可跟一个比自己年龄长十二岁的人订婚，有机会出洋。”“那时候苏小姐把自己的爱情看得太名贵了，不肯随便施与。”","location":"第一章：鲍小姐与苏文纨同船回国，两人的婚恋选择与留学经历同时进入叙述。","explain":"鲍小姐用订婚换取出国和改变生活的机会，说明她懂得利用婚姻制度，却没有完全获得自主。苏文纨把爱情看成稀缺而有身价的赠予，希望通过男性追求确证优越地位。两人都受过现代教育，也都把婚恋与身份利益联系在一起，新女性的自主诉求由此从一开始就带着功利和妥协。","link":"鲍小姐与苏文纨呈现新女性的策略型婚恋，唐晓芙与孙柔嘉则把这种差异推进到理想和现实两种选择。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第一章","searchPhrase":"有机会出洋","pdfPage":"","chain":{"who":"方鸿渐与孙柔嘉","action":"早期新女性把教育与婚恋选择结合起来，用现代身份争取机会，同时仍把男性和婚姻视为上升渠道。","reason":"鲍小姐用订婚换取出国和改变生活的机会，说明她懂得利用婚姻制度，却没有完全获得自主","consequence":"鲍小姐与苏文纨呈现新女性的策略型婚恋，唐晓芙与孙柔嘉则把这种差异推进到理想和现实两种选择。"}},{"stage":"中","point":"唐晓芙与孙柔嘉分别代表理想化和现实化的新女性道路，前者要求爱情绝对纯洁，后者用主见维护婚姻中的现实安全。","evidence":"“自己决不会爱方鸿渐，爱是又曲折又伟大的情感，决非那么轻易简单。”“鸿渐最初以为她只是个女孩子，事事要请教自己；订婚以后，他渐渐发现她不但很有主见，而且主见很牢固。”","location":"第三章至第八章：唐晓芙与方鸿渐在恋爱阶段往来，孙柔嘉则从恋爱进入订婚并与方鸿渐共同面对职业问题。","explain":"唐晓芙用理想标准审视爱情，拒绝接受方鸿渐复杂的过去；孙柔嘉更重视职位、收入和婚姻稳定，主动干预现实选择。两人都坚持自己的判断，却把主体性分别投向精神纯度和生活控制。唐晓芙的不可让步与孙柔嘉的现实算计，共同说明新女性的自主意识会因处境和能力不同而走向不同结果。","link":"唐晓芙和孙柔嘉的差异说明自主意识不等于统一人格，汪太太则进一步揭示新女性如何进入男性权力规则内部。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第三章","searchPhrase":"爱是又曲折又伟大的情感","pdfPage":"","chain":{"who":"唐晓芙","action":"唐晓芙与孙柔嘉分别代表理想化和现实化的新女性道路，前者要求爱情绝对纯洁，后者用主见维护婚姻中的现实安全。","reason":"唐晓芙用理想标准审视爱情，拒绝接受方鸿渐复杂的过去","consequence":"唐晓芙和孙柔嘉的差异说明自主意识不等于统一人格，汪太太则进一步揭示新女性如何进入男性权力规则内部。"}},{"stage":"后","point":"汪太太主动学习和运用男性中心秩序中的性别权力，她的幕后支配显示新女性的聪明反抗，也显示这种反抗仍受婚姻身份限制。","evidence":"“汪太太是聪明人，一口拒绝。一来她自知资格不好，至多做个小职员，有伤体面。二来她知道这是男人的世界，女权那样发达的国家像英美，还只请男人去当上帝，只说He，不说She。女人出来做事，无论地位怎么高，还是给男人利用，只有不出面躲在幕后，可以用太太或情妇的资格来指使和摆布男人。”","location":"第七章：高松年邀请汪太太到学校做事，她拒绝公开任职，却在私人关系中影响赵辛楣、高松年和丈夫。","explain":"汪太太看见职场仍由男性掌控，于是选择放弃公开职位，利用容貌、智力和妻子身份操纵男性的欲望与竞争。她比苏文纨更成熟，也更清楚社会的性别规则，能够主动利用规则维护自身影响。代价是她仍须躲在婚姻和暧昧关系背后，不能建立独立平等的公共位置。","link":"汪太太说明新女性能够在旧秩序中争夺主动，但个人策略无法自动改变造成束缚的社会结构。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第七章","searchPhrase":"可以用太太或情妇的资格","pdfPage":"","chain":{"who":"方鸿渐与孙柔嘉","action":"汪太太主动学习和运用男性中心秩序中的性别权力，她的幕后支配显示新女性的聪明反抗，也显示这种反抗仍受婚姻身份限制。","reason":"她比苏文纨更成熟，也更清楚社会的性别规则，能够主动利用规则维护自身影响","consequence":"汪太太说明新女性能够在旧秩序中争夺主动，但个人策略无法自动改变造成束缚的社会结构。"}}],"traps":["把所有新女性写成追求自由的正面人物，忽略婚恋计算、控制和相互竞争。","只分别介绍五个人物，不比较她们在自主意识和现实限制上的共同问题。","把汪太太简单写成不守妇道的坏女人，忽略她对社会性别规则的清醒判断。"]},{"id":"fortress-old-women-choices","work":"《围城》","workKey":"fortress","type":"人物群像","title":"旧式女性与方鸿渐的婚恋选择","prompt":"分析《围城》中旧式或过渡女性形象，并说明方鸿渐的婚恋选择困境。","keywords":["旧式女性","周小姐","周太太","方老太太","旧婚约","婚姻制度"],"thesis":"周小姐、周太太和方老太太分别体现包办婚约中的失语者、掌握金钱和长辈权威的城市妇人，以及把家庭照顾转化为婆媳控制的传统母亲。方鸿渐反对旧式婚配，却长期依赖周家和方家，他既不能接受旧女性角色，也无法真正适应孙柔嘉代表的新女性自主。","points":[{"stage":"前","point":"在包办婚约中，女性首先被安排为家庭交换关系的未婚妻，个人性格和意愿没有进入婚姻视野。","evidence":"“未婚妻并没见面，只瞻仰过一张半身照相，也漠不关心。”“想起未婚妻高中读了一年书，便不进学校，在家实习家务，等嫁过来做能干媳妇，不由自主地对她厌恨。”","location":"第一章：方鸿渐高中时由双方家庭作主与周小姐订婚，后来在大学写信要求解除婚约。","explain":"周小姐在小说中从未以完整人物出现，方鸿渐认识她只靠一张照片。他反对婚约的原因既包括对方被培养成传统媳妇，也包括自己被排除在婚姻决定之外。周小姐因此成为旧婚姻中的沉默符号，代表女性在家庭安排里没有选择权。","link":"周小姐体现旧婚约对女性的隐形和对象化，周太太则显示旧式权威如何由经济资源获得力量。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第一章","searchPhrase":"未婚妻并没见面","pdfPage":"","chain":{"who":"方鸿渐与孙柔嘉","action":"在包办婚约中，女性首先被安排为家庭交换关系的未婚妻，个人性格和意愿没有进入婚姻视野。","reason":"周小姐因此成为旧婚姻中的沉默符号，代表女性在家庭安排里没有选择权","consequence":"周小姐体现旧婚约对女性的隐形和对象化，周太太则显示旧式权威如何由经济资源获得力量。"}},{"stage":"中","point":"周太太以资助者和长辈身份行使旧式权威，金钱、住房、职业和报恩关系都被用来规训方鸿渐。","evidence":"“现在他吃我周家的饭，住周家的房子，赚我周家的钱，瞒了我外面去胡闹，一早出门，也不来请安，目无尊长，成什么规矩！”","location":"第四章：方鸿渐失恋后仍住在周家、在点金银行工作，周太太因其私人生活失控而严厉指责他。","explain":"周太太把周家提供的教育和职业机会视为要求顺从的债权，方鸿渐的私人选择因此被解释成忘恩和失礼。她不同于完全受家庭支配的周小姐，而是借助财富和长辈身份掌握实际权力。旧式女性角色与家庭权力互相支持，方鸿渐也因经济依赖无法真正摆脱控制。","link":"周太太说明旧秩序可以通过金钱和人情继续支配成年子女，方老太太则把这种秩序延伸进婚姻内部。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第四章","searchPhrase":"现在他吃我周家的饭","pdfPage":"","chain":{"who":"方鸿渐","action":"周太太以资助者和长辈身份行使旧式权威，金钱、住房、职业和报恩关系都被用来规训方鸿渐。","reason":"旧式女性角色与家庭权力互相支持，方鸿渐也因经济依赖无法真正摆脱控制","consequence":"周太太说明旧秩序可以通过金钱和人情继续支配成年子女，方老太太则把这种秩序延伸进婚姻内部。"}},{"stage":"后","point":"方老太太维护父母决定婚姻和媳妇服务夫家的传统规范，说明旧式女性也会在成为婆婆后复制家庭等级。","evidence":"“方老太太尤其怪儿子冒失，怎么不先征求父母同意就订婚了。”“你近来瘦了，脸上一点不滋润。在家里吃些什么东西？柔嘉做事忙，没工夫当心你，你为什么不到这儿来吃饭？”","location":"第九章：方鸿渐与孙柔嘉订婚后，方老太太责怪儿子未经父母同意；婚后她又用照顾儿子的话题批评孙柔嘉。","explain":"方老太太把婚姻视为家庭共同决定的事务，因此无法接受儿子的自由选择。婚后她又以母亲身份衡量媳妇是否尽责，把职业忙碌解释为照顾丈夫不周。她的关心真实存在，却与旧家庭权威结合，持续挤压孙柔嘉的独立空间。方鸿渐既拒绝旧式安排，又依赖家庭支持和母亲照顾，最终也无法承受新女性的独立，婚恋困境由此形成。","link":"三种女性形象连接家庭、金钱和婆媳权力，说明方鸿渐的婚恋困境来自个人依赖和旧制度的共同作用。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第九章","searchPhrase":"怎么不先征求父母同意","pdfPage":"","chain":{"who":"方鸿渐与孙柔嘉","action":"方老太太维护父母决定婚姻和媳妇服务夫家的传统规范，说明旧式女性也会在成为婆婆后复制家庭等级。","reason":"方老太太把婚姻视为家庭共同决定的事务，因此无法接受儿子的自由选择","consequence":"三种女性形象连接家庭、金钱和婆媳权力，说明方鸿渐的婚恋困境来自个人依赖和旧制度的共同作用。"}}],"traps":["只写旧女性落后，不分析婚约、金钱和家庭制度怎样塑造她们。","遗漏周小姐，无法完整体现方鸿渐最初对旧式婚配的拒绝。","把方鸿渐婚后的失败全部归咎于孙柔嘉，忽略他依赖旧家庭又追求新关系。"]},{"id":"fortress-education-system-satire","work":"《围城》","workKey":"fortress","type":"主题思想","title":"战时高等教育制度的乱象","prompt":"分析《围城》如何批判战时高等教育制度的乱象，并说明这种批判的讽刺意义。","keywords":["教育制度","假文凭","聘约","派系","导师制","抗日战争"],"thesis":"《围城》的战时大学批判直指制度失灵：文凭能够买卖，聘约可以被校长失信，职位依靠派系和先手，导师制又变成控制学生和交换利益的手段。国家危难本应促使知识分子合作救亡，校园中的人却忙于权力、身份和私利，教育的公共使命因此被讽刺性掏空。","points":[{"stage":"前","point":"学历制度失去真实性，文凭成为进入知识界和维持社会体面的交易凭证。","evidence":"“自己买张假文凭回去哄人，岂非也成了骗子？”“韩学愈撒他的谎，并非跟自己同谋，但有了他，似乎自己的欺骗减轻了罪名。”","location":"第一章与第六章：方鸿渐购买克莱登大学文凭，到三闾大学后又发现韩学愈使用同样学历。","explain":"方鸿渐和韩学愈都需要学位证明自己的留学价值，购买文凭比完成真实研究更省力。两人又因为彼此都造假而产生安慰，证明虚假学历能够形成群体默契。学校如果没有能力核验学历，头衔就会取代知识能力，教育评价从第一道门槛开始失真。","link":"学历失真使身份可以购买，聘任制度则让职位可以随权力和派系而改变。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第一章","searchPhrase":"自己买张假文凭","pdfPage":"","chain":{"who":"方鸿渐及相关人物","action":"学历制度失去真实性，文凭成为进入知识界和维持社会体面的交易凭证。","reason":"方鸿渐和韩学愈都需要学位证明自己的留学价值，购买文凭比完成真实研究更省力","consequence":"学历失真使身份可以购买，聘任制度则让职位可以随权力和派系而改变。"}},{"stage":"中","point":"聘约和职位不服从公开规则，行政权力与派系先手可以直接改变教师的职业命运。","evidence":"“鸿渐只好第二次声明没收到信，同时觉得降级为副教授已经天恩高厚了。”“原来，今天欢迎会是汪处厚安排好的，兵法上有名的‘敌人喘息未定，即予以迎头痛击’。”","location":"第六章：高松年取消方鸿渐的教授承诺，汪处厚又提前组织欢迎会争夺中国文学系主任职位。","explain":"高松年可以用一封“没收到”的信否认承诺，汪处厚则通过关系网络和欢迎仪式抢占职位。一个依靠校长权力，一个依靠派系先手，共同证明聘约和程序没有稳定效力。教师无法凭能力预期职业前景，只能依赖或服从掌权者，大学人事因此变成权力游戏。","link":"人事制度变成权力游戏后，导师制也被用来制造个人忠诚，而不是促进教育与学术。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第六章","searchPhrase":"降级为副教授已经天恩高厚","pdfPage":"","chain":{"who":"三闾大学知识分子群体","action":"聘约和职位不服从公开规则，行政权力与派系先手可以直接改变教师的职业命运。","reason":"一个依靠校长权力，一个依靠派系先手，共同证明聘约和程序没有稳定效力","consequence":"人事制度变成权力游戏后，导师制也被用来制造个人忠诚，而不是促进教育与学术。"}},{"stage":"后","point":"导师制在实施中失去教育功能，转化为行政控制、责任转嫁和私人恩惠。","evidence":"“他叫这学生到自己卧房里密切训导了半天，告诉他怎样人人要开除他，汪处厚毫无办法，全亏自己保全，那学生红着眼圈感谢。”“导师制变成这么一个东西。从前明成祖诛方孝孺十族，听说方孝孺的先生都牵连杀掉的。将来还有人敢教书么？”","location":"第七章：李梅亭借训导学生建立个人恩情，教育部导师规程又让教师为学生未来的社会行为承担责任。","explain":"李梅亭没有真正解决学生行为问题，而是通过秘密谈话制造被拯救的错觉，让学生感激自己。制度又要求导师为学生毕业后的行为连带负责，使教师承担无限责任却缺少实际教育条件。管理变成控制，教育关系变成恩情和风险，知识分子无法把精力投入共同的学术和社会责任。","link":"学历、聘约和导师制三层问题共同指向教育制度失灵，使抗战时期大学背离培育人才和承担国家责任的目标。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第七章","searchPhrase":"导师制变成这么一个东西","pdfPage":"","chain":{"who":"方鸿渐及相关人物","action":"导师制在实施中失去教育功能，转化为行政控制、责任转嫁和私人恩惠。","reason":"李梅亭没有真正解决学生行为问题，而是通过秘密谈话制造被拯救的错觉，让学生感激自己","consequence":"学历、聘约和导师制三层问题共同指向教育制度失灵，使抗战时期大学背离培育人才和承担国家责任的目标。"}}],"traps":["只写个别教师道德败坏，不分析学历、聘约和导师制度怎样持续制造问题。","只把它当校园笑话，不联系抗日战争背景下知识分子本应承担的救亡责任。","把所有弊端都归给高松年，忽略派系、教师群体和制度执行者的共同作用。"]},{"id":"fortress-zhao-sun-view","work":"《围城》","workKey":"fortress","type":"人物关系","title":"赵辛楣对孙柔嘉的看法","prompt":"赵辛楣对孙柔嘉有哪些看法？请举例分析。","keywords":["赵辛楣","孙柔嘉","保护","心机","第三者","看法变化"],"thesis":"赵辛楣最初因受孙父委托而保护孙柔嘉，把她看作需要照顾的年轻晚辈；旅途中逐渐察觉她善于装作无知，评价转为警惕和“刁滑”；到方鸿渐订婚、结婚后，他又以旁观者身份认为孙柔嘉很有心计，同时受朋友关系限制，只能以玩笑和提醒表达。","points":[{"stage":"前","point":"赵辛楣最初把孙柔嘉看作受父亲委托、需要自己保护的年轻晚辈。","evidence":"“孙小姐，你爸爸把你交给我的，我要强迫你回舱了，别着了凉——”“辛楣自从船上那一夜以后，对孙小姐疏远得很。这时候，他深恐济危扶困，做‘叔叔’的责无旁贷，这侠骨柔肠的好差使让给鸿渐罢。”","location":"第五章：众人乘船前往内地，孙柔嘉父亲曾把她托付给赵辛楣，旅途中赵辛楣承担保护责任。","explain":"赵辛楣与孙柔嘉不是普通男女关系，而是“赵叔叔”和晚辈的受托关系。他关心她的身体和安全，也主动与她的课业、住宿和旅途安全保持距离，以免造成流言。责任感和避嫌意识同时存在，构成他最初看法的核心。这样的保护者身份，为后文态度转向警惕形成了清楚的前后落差。","link":"前段先建立保护者身份，后文他对孙柔嘉的心机判断才会形成明显转折。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第五章","searchPhrase":"你爸爸把你交给我的","pdfPage":"","chain":{"who":"赵辛楣","action":"赵辛楣最初把孙柔嘉看作受父亲委托、需要自己保护的年轻晚辈。","reason":"这样的保护者身份，为后文态度转向警惕形成了清楚的前后落差","consequence":"前段先建立保护者身份，后文他对孙柔嘉的心机判断才会形成明显转折。"}},{"stage":"中","point":"旅途中，赵辛楣发现孙柔嘉会利用貌似幼稚的举止推动关系，对她的看法从保护转为警惕。","evidence":"“你这人没良心！方才我旁观者看得清清楚楚，孙小姐——唉！这女孩子刁滑得很，我带她来，上了大当——孙小姐就像那条鲸鱼，张开了口，你这糊涂虫就像送上门去的那条船。”","location":"第五章：孙柔嘉在船上向方鸿渐示弱，赵辛楣从旁观察，认为她并非完全无知被动。","explain":"赵辛楣看见孙柔嘉的安静和求助并非单纯天真，而是能够影响方鸿渐判断的社交策略。他开始把她看成有目的的选择者，也担心方鸿渐会陷入被动。评价由保护转为警惕，但赵辛楣仍处于旁观位置，没有正式干涉。这说明他能够识破表面柔弱，并由此形成后来“孙柔嘉有深心”的判断。","link":"中段说明赵辛楣能够识破表面柔弱，这为他在婚姻阶段评价孙柔嘉“有深心”提供依据。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第五章","searchPhrase":"这女孩子刁滑得很","pdfPage":"","chain":{"who":"赵辛楣","action":"旅途中，赵辛楣发现孙柔嘉会利用貌似幼稚的举止推动关系，对她的看法从保护转为警惕。","reason":"评价由保护转为警惕，但赵辛楣仍处于旁观位置，没有正式干涉","consequence":"中段说明赵辛楣能够识破表面柔弱，这为他在婚姻阶段评价孙柔嘉“有深心”提供依据。"}},{"stage":"后","point":"方鸿渐订婚后，赵辛楣把孙柔嘉看成精心争取婚姻、能够控制丈夫的人，并以“第三者”身份提醒方鸿渐。","evidence":"“我不是跟你讲过，孙小姐这人很深心么？你们这一次，照我第三者看起来，她煞费苦心——”","location":"第九章：方鸿渐与孙柔嘉在香港与赵辛楣会面，赵辛楣谈到自己如何看这段婚姻。","explain":"赵辛楣从外部观察两人的相处，认为孙柔嘉主动设计并推动婚姻，方鸿渐则缺少判断。他掌握一些方鸿渐未看清的信息，却因为朋友已经结婚而主动收回批评，说成酒后胡话。关心、保留和人际分寸共同限制了他表达真实看法的程度。","link":"结尾表明赵辛楣对孙柔嘉的评价包含警惕和关怀，他的旁观位置也反衬方鸿渐在婚姻中的被动。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第九章","searchPhrase":"她煞费苦心","pdfPage":"","chain":{"who":"方鸿渐","action":"方鸿渐订婚后，赵辛楣把孙柔嘉看成精心争取婚姻、能够控制丈夫的人，并以“第三者”身份提醒方鸿渐。","reason":"赵辛楣从外部观察两人的相处，认为孙柔嘉主动设计并推动婚姻，方鸿渐则缺少判断","consequence":"结尾表明赵辛楣对孙柔嘉的评价包含警惕和关怀，他的旁观位置也反衬方鸿渐在婚姻中的被动。"}}],"traps":["只写赵辛楣批评孙柔嘉，忽略他受孙父委托的保护责任。","只写赵辛楣和方鸿渐的友情，没有回答他对孙柔嘉的看法如何变化。","把赵辛楣的判断写成事实，不区分他的旁观者视角和有限信息。"]},{"id":"fortress-gao-fang-attitude","work":"《围城》","workKey":"fortress","type":"人物关系","title":"高松年对方鸿渐的态度变化","prompt":"请通过高松年对方鸿渐所持态度的变化来分析高松年这个人物。","keywords":["高松年","方鸿渐","态度变化","聘任","控制","解聘"],"thesis":"高松年对方鸿渐的态度始终服从自身管理需要：需要教师时用教授职位把他招来，到校后因认定他容易控制而降为副教授；学校运作中继续利用他的劳动；一旦方鸿渐被报告为思想有问题，便立即解聘并推给政治风险。这种变化集中暴露高松年的权术和卸责。","points":[{"stage":"前","point":"方鸿渐到校后，高松年根据是否容易控制判断他的职位，把原定教授改为副教授。","evidence":"“这姓方的青年人是容易对付的。”“他自己开来的学历，并没有学位，只是个各国游荡的‘游学生’，并且并非学政治的，聘他当教授太冤枉了！至多做副教授，循序渐升，年轻人做事不应该爬得太高。”","location":"第六章：方鸿渐到三闾大学报到，高松年在办公室盘算如何解释教授改副教授。","explain":"高松年知道原聘条件，却从控制难易出发重新判断方鸿渐的价值。他认为方鸿渐容易对付，于是用学历、专业和年龄为自己的降级决定辩护。行政权力可以推翻承诺，教师的资历成为随时可解释的借口，这首先暴露高松年对下属的轻蔑。","link":"前段显示高松年根据控制难度压低方鸿渐，后文则说明他还会利用方鸿渐承担额外劳动。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第六章","searchPhrase":"这姓方的青年人是容易对付的","pdfPage":"","chain":{"who":"方鸿渐","action":"方鸿渐到校后，高松年根据是否容易控制判断他的职位，把原定教授改为副教授。","reason":"他认为方鸿渐容易对付，于是用学历、专业和年龄为自己的降级决定辩护","consequence":"前段显示高松年根据控制难度压低方鸿渐，后文则说明他还会利用方鸿渐承担额外劳动。"}},{"stage":"中","point":"学校需要代课时，高松年又根据现实利益使用方鸿渐，把他当作可调度的教学资源。","evidence":"“松年说：‘嗯，这倒不失为好办法，方先生钟点本来太少，不知道他的英文怎样？’”“鸿渐自知在学校的地位不稳固，又经辛楣细陈利害，刘东方恳切劝驾，居然大胆老脸、低头小心教起英文来。”","location":"第七章：孙柔嘉的课程无人代，赵辛楣推荐方鸿渐，高松年同意让他增加英文课。","explain":"高松年不在乎方鸿渐的专业和能力是否适合英文课，只关心课程能否有人承担、自己能否解决行政问题。方鸿渐地位不稳，又缺乏拒绝能力，只能接受安排。高松年对他的态度从压低职位转为继续使用，控制方式不变。所谓重视只来自眼前需要，并不代表他改变对方鸿渐能力和尊严的判断。","link":"中段说明高松年对方鸿渐的“重视”取决于学校需要，最后一段的政治风险则立即改变这种需要。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第七章","searchPhrase":"方先生钟点本来太少","pdfPage":"","chain":{"who":"方鸿渐","action":"学校需要代课时，高松年又根据现实利益使用方鸿渐，把他当作可调度的教学资源。","reason":"所谓重视只来自眼前需要，并不代表他改变对方鸿渐能力和尊严的判断","consequence":"中段说明高松年对方鸿渐的“重视”取决于学校需要，最后一段的政治风险则立即改变这种需要。"}},{"stage":"后","point":"一旦出现政治风险，高松年立即取消续聘，并借准备升职的说法维持自己公正惜才的形象。","evidence":"“我本来要升他一级，谁知道他思想有问题，下学期只能解聘。这个人倒是可造之才，可惜！可惜！”","location":"第八章：陆子潇发现方鸿渐房中有共产主义书籍，李梅亭书面报告，高松年决定不再聘用方鸿渐。","explain":"高松年没有调查书籍来源，也没有给方鸿渐解释机会，而是把报告直接转化为解聘决定。他先说原本准备升职，再强调可惜，把责任推给“思想问题”和政治风险，同时保留珍惜人才的姿态。对方鸿渐的态度完全由高松年的安全与利益决定。","link":"三次变化共同说明高松年不是按人物本身评价方鸿渐，而是按控制成本、使用价值和政治风险处理他。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第八章","searchPhrase":"我本来要升他一级","pdfPage":"","chain":{"who":"高松年","action":"一旦出现政治风险，高松年立即取消续聘，并借准备升职的说法维持自己公正惜才的形象。","reason":"高松年没有调查书籍来源，也没有给方鸿渐解释机会，而是把报告直接转化为解聘决定","consequence":"三次变化共同说明高松年不是按人物本身评价方鸿渐，而是按控制成本、使用价值和政治风险处理他。"}}],"traps":["只说高松年欺骗方鸿渐，不写出他态度变化的利益逻辑。","把高松年写成单纯冷淡，忽略他也曾主动招聘和继续使用方鸿渐。","只批评高松年个人，不说明职称、委任和思想报告怎样成为他的权力工具。"]},{"id":"fortress-fang-leaves-university","work":"《围城》","workKey":"fortress","type":"主题思想","title":"方鸿渐离开三闾大学的原因","prompt":"请讨论导致方鸿渐离开三闾大学的具体原因。","keywords":["方鸿渐","三闾大学","离职","副教授","派系","思想问题"],"thesis":"方鸿渐离开三闾大学由个人能力、校内权力关系和外部政治判断共同造成。他既没有稳定专业位置，也在派系环境中缺少主动争取的能力；高松年最终又以思想问题为理由取消续聘，把个人性格困境和学校制度失序连接在一起。","points":[{"stage":"前","point":"方鸿渐缺少专业定位和教学准备，使他从一开始就处于不稳定的职业位置。","evidence":"“自己毫无经验，更无准备，教的功课又非出自愿，要参考也没有书，当然教不好。”","location":"第六章：方鸿渐到三闾大学后被安排教授并非自己选择的课程，教学效果不佳。","explain":"方鸿渐并非按专业被聘任，也没有为课程准备充分条件。他能够分析失败原因，却没有主动建立稳定学术方向，因此难以在学校中获得不可替代的地位。个人准备不足使他容易成为人事调整中的牺牲者，但离开的原因不止个人能力。","link":"前段建立个人职业根基薄弱，下一段显示派系环境进一步削弱他的地位。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第六章","searchPhrase":"自己毫无经验，更无准备","pdfPage":"","chain":{"who":"方鸿渐","action":"方鸿渐缺少专业定位和教学准备，使他从一开始就处于不稳定的职业位置。","reason":"方鸿渐并非按专业被聘任，也没有为课程准备充分条件","consequence":"前段建立个人职业根基薄弱，下一段显示派系环境进一步削弱他的地位。"}},{"stage":"中","point":"三闾大学的人事与派系关系使方鸿渐不断处于可替代位置，他只能被动接受额外课程安排。","evidence":"“鸿渐自知在学校的地位不稳固，又经辛楣细陈利害，刘东方恳切劝驾，居然大胆老脸、低头小心教起英文来。”","location":"第七章：孙柔嘉的课程无人承担，赵辛楣推荐方鸿渐，刘东方劝说他接受英文教学。","explain":"方鸿渐缺乏稳定的院系归属，别人安排课程时可以利用他的空余和弱势处境。他知道自己的职位随时可能被调整，却没有能力自主争取条件，只能接受对自己不利的安排。学校权力关系不断证明他可以被调动和替换，离开的可能性因此持续累积。","link":"职场地位不稳为政治性解聘提供条件，最终一本被报告的书直接触发离职。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第七章","searchPhrase":"地位不稳固","pdfPage":"","chain":{"who":"方鸿渐","action":"三闾大学的人事与派系关系使方鸿渐不断处于可替代位置，他只能被动接受额外课程安排。","reason":"他知道自己的职位随时可能被调整，却没有能力自主争取条件，只能接受对自己不利的安排","consequence":"职场地位不稳为政治性解聘提供条件，最终一本被报告的书直接触发离职。"}},{"stage":"后","point":"高松年把一本共产主义书籍和他人报告等同于思想风险，直接取消方鸿渐的续聘。","evidence":"“我本来要升他一级，谁知道他思想有问题，下学期只能解聘。这个人倒是可造之才，可惜！可惜！”","location":"第八章：陆子潇发现方鸿渐房中有共产主义书籍，李梅亭书面报告，高松年决定下学期不再聘用。","explain":"高松年没有核实书籍来源，也没有给予申辩和正式处理，直接把政治标签当成解除聘用的理由。他同时声称原本准备升职，把责任推给方鸿渐。制度处理缺少程序，个人权力借政治风险清除不稳定的教师，方鸿渐最终离开。","link":"结尾把个人能力不足、派系环境和行政卸责合并解释，说明离职是人物与制度共同作用的结果。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第八章","searchPhrase":"下学期只能解聘","pdfPage":"","chain":{"who":"方鸿渐","action":"高松年把一本共产主义书籍和他人报告等同于思想风险，直接取消方鸿渐的续聘。","reason":"高松年没有核实书籍来源，也没有给予申辩和正式处理，直接把政治标签当成解除聘用的理由","consequence":"结尾把个人能力不足、派系环境和行政卸责合并解释，说明离职是人物与制度共同作用的结果。"}}],"traps":["只责怪方鸿渐不会教书，忽略学校人事和派系问题。","只责怪高松年，不分析方鸿渐为什么长期处于可替代位置。","把书籍事件写成偶然，不说明制度如何处理所谓思想问题。"]},{"id":"fortress-travel-social-problems","work":"《围城》","workKey":"fortress","type":"主题思想","title":"赴三闾大学旅途中的社会问题","prompt":"前往三闾大学的一路艰难反映出当时的哪些社会问题？请举例讨论。","keywords":["旅途","三闾大学","抗战","交通","特权","投机"],"thesis":"赴三闾大学的旅途集中呈现战时社会失序：交通资源紧张、机关特权与身份歧视并存，投机者又借物资短缺牟利。知识分子群体在旅途中也暴露功利和依附，个人行路困难因此成为国家制度和社会道德的缩影。","points":[{"stage":"前","point":"战时交通资源紧张，普通旅客无法按正常规则获得车票，身份和机关关系成为优先通行条件。","evidence":"“这车票难买得很，天没亮就得上车站去挤，还抢买不到，除非有证件的机关人员，可以通融早买票子。”","location":"第五章：众人在途中需要购买公共汽车票，旅店主人说明普通旅客与机关人员的差别待遇。","explain":"运输能力不足使车票成为稀缺资源，稀缺又催生身份特权。普通旅客只能拥挤等待，有机关证件的人可以提前购买。公共规则因此让位于关系和身份，交通困难不仅是自然条件，也反映行政资源分配的不公平。身份优先保证少数人通行，普通人的时间和安全被系统性压低，这构成旅途社会批判的第一层。","link":"交通特权只是旅途问题的第一层，军政人员的直接拒绝和歧视又进一步伤害普通人。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第五章","searchPhrase":"除非有证件的机关人员","pdfPage":"","chain":{"who":"方鸿渐及相关人物","action":"战时交通资源紧张，普通旅客无法按正常规则获得车票，身份和机关关系成为优先通行条件。","reason":"运输能力不足使车票成为稀缺资源，稀缺又催生身份特权","consequence":"交通特权只是旅途问题的第一层，军政人员的直接拒绝和歧视又进一步伤害普通人。"}},{"stage":"中","point":"军政人员掌握交通资源，可以随意拒绝普通乘客，并对女性进行羞辱，显示权力缺乏约束。","evidence":"“要是女人可以带，我早带小王一二一，开步走了，哈哈。”“孙小姐气得嘤然作声，鸿渐等侯营长进了对门，向他已消灭的阔背出声骂：‘浑蛋！’”","location":"第五章：众人尝试搭乘军车，侯营长以女人不能上车为由拒绝，同时用轻蔑语言羞辱孙柔嘉。","explain":"侯营长控制车辆和通行资格，却不说明公开规则，而是以私人好恶和性别偏见决定谁能上车。方鸿渐等人的愤怒无法形成约束，只能在背后咒骂。资源和武力结合后，普通人既得不到救济，也无法维护尊严。权力可以逃避监督，公共资源便不再服务公共利益，进一步加深整个社会的不信任。","link":"军政特权制造直接压迫，商人、教师和投机者又在生存压力下形成另一套利益交换。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第五章","searchPhrase":"要是女人可以带","pdfPage":"","chain":{"who":"方鸿渐及相关人物","action":"军政人员掌握交通资源，可以随意拒绝普通乘客，并对女性进行羞辱，显示权力缺乏约束。","reason":"方鸿渐等人的愤怒无法形成约束，只能在背后咒骂","consequence":"军政特权制造直接压迫，商人、教师和投机者又在生存压力下形成另一套利益交换。"}},{"stage":"后","point":"物资短缺使部分知识分子把公共需求转化为牟利机会，旅途也暴露教育和道德共同面临的功利化。","evidence":"“他的药是带到学校去卖好价钱的，留着原封不动，准备十倍原价去卖给穷乡僻壤的学校医院。”","location":"第五章：李梅亭带着大量西药上路，明知学校医院缺药，却计划以十倍价格出售。","explain":"学校医院缺药属于公共需求，李梅亭掌握药品后不把它首先用于救人，而把它看成趁短缺获利的商品。教育身份没有带来公共责任，反而被用来寻找利润空间。旅途因此不仅表现交通和军政问题，也揭示社会失序怎样进入知识群体内部。","link":"三层问题共同说明旅途困难不是单一交通事故，而是资源分配、权力约束和社会道德同时失效。","page":"","edition":"人民文学出版社软皮版（以章节、场景和检索词定位）","chapter":"第五章","searchPhrase":"准备十倍原价去卖给穷乡僻壤","pdfPage":"","chain":{"who":"三闾大学知识分子群体","action":"物资短缺使部分知识分子把公共需求转化为牟利机会，旅途也暴露教育和道德共同面临的功利化。","reason":"教育身份没有带来公共责任，反而被用来寻找利润空间","consequence":"三层问题共同说明旅途困难不是单一交通事故，而是资源分配、权力约束和社会道德同时失效。"}}],"traps":["只复述路途艰难，不分类说明交通、权力和物资制度问题。","只写自然环境和战争，忽略机关特权、性别歧视和投机行为。","把所有问题都归给日本人或战争，不分析中国社会内部的管理与道德危机。"]}];

function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function workName(k){return WORKS[k]||k}
function norm(s){return String(s||"").toLowerCase().replace(/[\s，。！？；：、“”‘’（）《》〈〉·,.!?;:'"()\[\]{}<>\/\\-]/g,"")}
function grams(s,n){s=norm(s);var out=[];for(var i=0;i<=s.length-n;i++)out.push(s.slice(i,i+n));return out}
function itemText(x){return [x.title,x.prompt,x.work,x.type,x.keywords.join(" "),x.thesis,x.points.map(function(p){return p.point+" "+p.evidence+" "+p.location}).join(" ")].join(" ")}
function scoreItem(x,q){q=norm(q);if(!q)return 0;var score=0;x.keywords.forEach(function(k){if(q.indexOf(norm(k))>=0)score+=18});if(q.indexOf(norm(x.title))>=0)score+=28;if(norm(x.prompt).indexOf(q)>=0)score+=28;var target=itemText(x);[2,3,4].forEach(function(n){grams(q,n).forEach(function(g){if(target.indexOf(g)>=0)score+=g.length*g.length})});return score}
function matchedKeywords(x,q){q=norm(q);return x.keywords.filter(function(k){return q.indexOf(norm(k))>=0})}

function pastView(){var chips='<div class="chips"><button class="'+(state.work==="all"?"on":"")+'" data-past-work="all">全部</button>'+Object.keys(WORKS).map(function(k){return '<button class="'+(state.work===k?"on":"")+'" data-past-work="'+k+'">'+esc(WORKS[k])+'</button>'}).join("")+'</div>';var past=PAST.past.filter(function(x){return state.work==="all"||x.workKey===state.work});var preds=PAST.predictions.filter(function(x){return state.work==="all"||x.workKey===state.work});return chips+'<div class="panel"><h2>历年真题与时考方向</h2><p>'+esc(PAST.coverageNote)+'</p><p style="margin-top:7px">'+esc(PAST.structureNote)+'</p><div class="hint">'+esc(PAST.sourceNote)+'</div></div><div class="panel"><h3>已考真题与官方样卷</h3>'+past.map(pastCard).join("")+'</div><div class="panel"><h3>高概率预测方向</h3>'+preds.map(predictionCard).join("")+'</div>'}
function drawView(){var pool=DATA.filter(function(x){return state.work==="all"||x.workKey===state.work});var remaining=pool.filter(function(x){return state.drawHistory.indexOf(x.id)<0});var chips='<div class="chips"><button class="'+(state.work==="all"?"on":"")+'" data-draw-work="all">全部</button>'+Object.keys(WORKS).map(function(k){return '<button class="'+(state.work===k?"on":"")+'" data-draw-work="'+k+'">'+esc(WORKS[k])+'</button>'}).join("")+'</div>';if(state.drawItem){var x=state.drawItem;return chips+'<div class="panel"><div class="meta"><span class="tag">'+esc(workName(x.workKey))+'</span><span class="tag">'+esc(x.type)+'</span></div><h2>'+esc(x.title)+'</h2><p>'+esc(x.prompt)+'</p><div class="hint">先自己想：对应哪几个论点？分别在原文哪里？</div><button class="primary" id="openDraw">看论点与原文定位</button><button class="ghost" id="drawAgain" style="margin-top:8px">再抽一道</button></div><div class="hint">本轮已抽 '+state.drawHistory.length+' 道</div>'}return chips+'<div class="panel"><h2>随机抽取一道文学赏析题</h2><p>抽题后先自己组织论点，再点开看原文定位。</p><button class="primary" id="doDraw">抽取题目</button></div>'+(remaining.length?'<div class="hint">当前范围还可抽 '+remaining.length+' 道</div>':'<div class="hint">当前范围已经抽完，再抽一轮会自动重新开始。</div>')}
function detailView(x){var points=x.points.map(function(p,i){var bits=[];var stageNames={前:"前段",中:"中段",后:"后段"};if(p.stage)bits.push('全书阶段：'+esc(stageNames[p.stage]||p.stage));if(p.chapter)bits.push('章节：'+esc(p.chapter));if(p.searchPhrase)bits.push('检索：'+esc(p.searchPhrase));if(p.page)bits.push('印刷页码：'+esc(p.page)+(p.edition?'（'+esc(p.edition)+'）':''));var page=bits.length?' · '+bits.join(' · '):'';return '<div class="point"><div class="pointTitle">主体段 '+(i+1)+'｜Point：'+esc(p.point)+'</div><div class="field"><b>Evidence</b>'+esc(p.evidence)+'</div><div class="loc">引文定位：'+esc(p.location)+page+'</div><div class="field"><b>Explain</b>'+esc(p.explain)+'</div><div class="field"><b>Link</b>'+esc(p.link)+'</div></div>'}).join("");var guide='<div class="panel"><h3>Paper 3 写作路径</h3><div class="field"><b>第一步 审题</b>确认题目要分析的对象、任务和限定语：'+esc(x.prompt)+'</div><div class="field"><b>第二步 定中心</b>开头直接给出文章判断：'+esc(x.thesis)+'</div><div class="field"><b>第三步 写主体段</b>每一段按照“Point、Evidence、Explain、Link”的顺序推进。下面的三个主体段就是可以直接模仿的写法。</div><div class="field"><b>第四步 收束全文</b>结尾回答题目中的核心问题，并回扣人物、主题或时代意义，不再增加新的论点。</div></div>';var traps=x.traps.map(function(t){return '<div class="warn"><b>不扣题写法</b>'+esc(t)+'</div>'}).join("");var focus='<div class="good"><b>扣题写法</b>每一段都要回答题目：“'+esc(x.prompt)+'”。引用后必须说明这句话怎样证明中心判断：“'+esc(x.thesis)+'”。</div>';return '<span class="back" id="back">← 返回</span><div class="panel"><div class="meta"><span class="tag">'+esc(workName(x.workKey))+'</span><span class="tag">'+esc(x.type)+'</span></div><h2>'+esc(x.title)+'</h2><p>'+esc(x.prompt)+'</p><div class="thesis"><b>中心论点</b><br>'+esc(x.thesis)+'</div></div>'+guide+'<div class="panel"><button class="ghost" id="toggleHide">'+(state.hide?"显示论点与原文定位":"先自己想，遮住答案")+'</button><div class="'+(state.hide?"hide":"")+'" id="answerBox" style="margin-top:12px"><h3>三个主体段</h3>'+points+'</div></div><div class="panel"><h3>扣题检查</h3><div class="hint">下面的提醒都是容易导致扣题失败的写法，不是答案示例。</div>'+focus+traps+'</div>'}
function render(){var app=document.getElementById("app");if(state.selected){var item=DATA.find(function(x){return x.id===state.selected});app.innerHTML=item?detailView(item):'<div class="empty">没有找到这道题</div>'}else{app.innerHTML=state.mode==="match"?matchView():state.mode==="past"?pastView():state.mode==="draw"?drawView():listView()}bind()}
function bind(){document.querySelectorAll("#tabs button").forEach(function(b){b.className=b.dataset.mode===state.mode?"on":"";b.onclick=function(){state.mode=b.dataset.mode;state.selected=null;state.hide=false;render()}});var search=document.getElementById("search");if(search)search.oninput=function(){state.query=this.value.trim();render();var el=document.getElementById("search");if(el){el.focus();el.selectionStart=el.selectionEnd=el.value.length}};document.querySelectorAll("[data-work]").forEach(function(b){b.onclick=function(){state.work=b.dataset.work;render()}});document.querySelectorAll("[data-past-work]").forEach(function(b){b.onclick=function(){state.work=b.dataset.pastWork;render()}});document.querySelectorAll("[data-draw-work]").forEach(function(b){b.onclick=function(){state.work=b.dataset.drawWork;state.drawItem=null;render()}});document.querySelectorAll("[data-open]").forEach(function(el){el.onclick=function(e){e.stopPropagation();state.selected=el.dataset.open;state.hide=false;render();window.scrollTo(0,0)}});document.querySelectorAll("[data-open] a").forEach(function(a){a.onclick=function(e){e.stopPropagation()}});document.querySelectorAll("[data-related]").forEach(function(b){b.onclick=function(e){e.stopPropagation();state.selected=b.dataset.related;state.hide=false;render();window.scrollTo(0,0)}});var box=document.getElementById("matchBox");if(box)box.oninput=function(){state.matchQuery=this.value};var doMatch=document.getElementById("doMatch");if(doMatch)doMatch.onclick=function(){state.matchQuery=document.getElementById("matchBox").value.trim();render()};var doDraw=document.getElementById("doDraw");if(doDraw)doDraw.onclick=function(){var pool=DATA.filter(function(x){return state.work==="all"||x.workKey===state.work});var remaining=pool.filter(function(x){return state.drawHistory.indexOf(x.id)<0});if(!remaining.length){state.drawHistory=[];remaining=pool}state.drawItem=remaining[Math.floor(Math.random()*remaining.length)];state.drawHistory.push(state.drawItem.id);render();window.scrollTo(0,0)};var openDraw=document.getElementById("openDraw");if(openDraw)openDraw.onclick=function(){state.selected=state.drawItem.id;state.hide=false;render();window.scrollTo(0,0)};var drawAgain=document.getElementById("drawAgain");if(drawAgain)drawAgain.onclick=function(){state.drawItem=null;render()};var back=document.getElementById("back");if(back)back.onclick=function(){state.selected=null;render()};var toggle=document.getElementById("toggleHide");if(toggle)toggle.onclick=function(){state.hide=!state.hide;render()}}
render();
</script>
</body>
</html>
