<script>
var DATA=[{"id":"saffi-character","work":"《莎菲女士的日记》","workKey":"saffi","type":"人物形象","title":"莎菲的矛盾形象","prompt":"分析莎菲女士的性格与内心世界。","keywords":["莎菲","矛盾","灵肉冲突","觉醒","孤独","女性"],"thesis":"丁玲通过莎菲的心理描写，写出五四新女性在觉醒后仍无法摆脱灵肉冲突与现实困境的复杂状态。","points":[{"point":"莎菲追求个性解放，敢于表达欲望和自我。","evidence":"莎菲对凌吉士外貌的迷恋，以及“我为什么要给人一些端庄呢”这类带有反抗意味的独白。","location":"莎菲认识凌吉士后，反复书写自己情感与欲望的日记段落。","explain":"这些表达显示她不再完全服从传统女性规范，敢于承认自己的情感需要。","link":"这为下文写她的内心冲突提供了前提。"},{"point":"莎菲在灵与肉之间反复摇摆，觉醒并没有带来真正自由。","evidence":"她既被凌吉士的外表吸引，又清醒地看到对方灵魂的卑劣，例如“高贵美形里安置着卑劣灵魂”的判断。","location":"莎菲看清凌吉士真实面目后，对他由迷恋转为厌恶的日记段落。","explain":"丁玲把欲望、理性与失望放在同一个人物身上，让读者看到觉醒后的女性仍要面对选择和代价。","link":"这说明莎菲的困境不只是爱情问题，也是时代问题。"},{"point":"莎菲的孤独来自觉醒之后找不到真正理解她的人。","evidence":"她对周围人的虚伪、平庸和不理解持续感到厌倦。","location":"莎菲与朋友、爱人相处时反复出现的独白和情绪变化。","explain":"人物越清醒，越难与周围环境相容，孤独感因此成为她精神困境的外在表现。","link":"结尾回扣题目时，应落在五四新女性觉醒后的现实处境。"}],"traps":["只把莎菲写成追求爱情的女性，忽略觉醒与困境的矛盾。","只写“心理描写很细腻”，没有说明哪个词句表现了什么心理。"]},{"id":"saffi-awakening","work":"《莎菲女士的日记》","workKey":"saffi","type":"主题思想","title":"觉醒后的困境","prompt":"结合文本，谈谈莎菲的觉醒与困境。","keywords":["觉醒","困境","五四","新女性","自由","现实"],"thesis":"莎菲的觉醒让她看清传统束缚，却也让她陷入无路可走的现实困境。","points":[{"point":"她在思想上已经不再接受传统女性角色。","evidence":"她敢于谈论欲望、拒绝伪装端庄，也敢质疑周围人的道德标准。","location":"莎菲面对爱情、身体和社交规范时的日记独白。","explain":"觉醒首先表现为她有了自我判断，不再完全依附外部规范。","link":"但觉醒并不自动带来出路。"},{"point":"她的现实环境没有为她提供新的精神位置。","evidence":"她周围的人无法理解她的矛盾，爱情也没有给她稳定的归属感。","location":"莎菲与朋友、凌吉士相处时产生的失望和疏离。","explain":"新思想已经进入她的意识，旧环境仍然包围着她，两者之间形成反差。","link":"困境来自个人觉醒与社会条件之间的落差。"},{"point":"丁玲借莎菲写出五四女性的真实处境。","evidence":"莎菲既有追求自由的冲动，也不断被孤独、疾病和情感挫败困住。","location":"全篇日记的情绪推进和结尾的失落感。","explain":"作品没有把觉醒写成简单胜利，而是让读者看到觉醒之后的代价。","link":"结论要回到“觉醒与困境并存”这一核心判断。"}],"traps":["把觉醒写成彻底解放，忽略觉醒后仍处于困境。","只谈五四背景，不引用莎菲的具体心理和行为。"]},{"id":"saffi-psychology","work":"《莎菲女士的日记》","workKey":"saffi","type":"艺术手法","title":"心理描写的作用","prompt":"分析《莎菲女士的日记》中心理描写的作用。","keywords":["心理描写","日记体","内心","手法","作用","独白"],"thesis":"丁玲用日记体心理描写把莎菲的欲望、羞耻、清醒与孤独直接呈现在读者面前，使人物矛盾具有真实的心理层次。","points":[{"point":"日记体让人物可以不断暴露真实想法。","evidence":"莎菲对爱情、身体、孤独和周围人的评价经常直接出现在她的独白中。","location":"全篇以莎菲第一人称写成的日记段落。","explain":"第一人称让读者看到人物不愿公开说出的欲望和羞耻，人物因此更立体。","link":"这使作品不同于只写外部行动的叙事。"},{"point":"心理描写把抽象的灵肉冲突变成可读的情绪过程。","evidence":"莎菲一边等待凌吉士，一边又因另一种情绪向他摇头。","location":"莎菲与凌吉士关系变化前后的反复书写。","explain":"等待、否定、迷恋、厌恶这些心理动作交替出现，读者能看见冲突如何发生。","link":"手法分析要说明效果，不能只报“心理描写”这个术语。"},{"point":"心理描写同时承担揭示主题的功能。","evidence":"莎菲越清醒，越感到与周围世界隔绝。","location":"日记中孤独感和失望感逐渐加重的段落。","explain":"个人的心理困境被写成了时代转型期女性的精神困境。","link":"结尾要回到心理描写与主题之间的关系。"}],"traps":["只写“大量心理描写”，没有分析具体心理变化。","引用后不解释，直接下“人物很矛盾”的结论。"]},{"id":"saffi-love","work":"《莎菲女士的日记》","workKey":"saffi","type":"人物关系","title":"莎菲与凌吉士","prompt":"分析莎菲对凌吉士的感情变化及其意义。","keywords":["凌吉士","爱情","迷恋","厌恶","欲望","选择"],"thesis":"莎菲对凌吉士的感情经历由迷恋、期待到厌恶的转变，集中体现了她的灵肉冲突与自我意识。","points":[{"point":"莎菲最初被凌吉士的外貌和气质吸引。","evidence":"她对凌吉士的身体与面容有细致观察，例如“颀长的身躯”“嫩玫瑰般的脸庞”。","location":"莎菲初次接触并观察凌吉士的日记段落。","explain":"这些描写让欲望变得具体，也表现出她对自我感受的正视。","link":"但外貌吸引并不能带来真正理解。"},{"point":"当她看清凌吉士的精神世界后，迷恋转为厌恶。","evidence":"她意识到对方高贵外形下是卑劣灵魂，情感开始转向否定。","location":"莎菲认清凌吉士真实面目后的心理转折。","explain":"感情变化说明她不只追求欲望满足，也在判断对方是否配得上自己的爱。","link":"这正是她自我意识觉醒的体现。"},{"point":"这段关系没有给莎菲带来解放，反而加深了她的孤独。","evidence":"她在期待、拒绝和失望之间反复摇摆。","location":"莎菲与凌吉士关系结束前后的日记内容。","explain":"爱情成为照见她内心矛盾的镜子，也暴露出她所处环境的局限。","link":"结尾应把感情变化放回人物与时代的关系中理解。"}],"traps":["把感情变化写成简单恋爱故事，忽略灵肉冲突。","只写莎菲爱凌吉士或不爱凌吉士，没有写变化过程。"]},{"id":"water-symbol","work":"《水》","workKey":"water","type":"意象象征","title":"水的多重象征","prompt":"分析《水》中“水”的象征意义。","keywords":["水","象征","洪水","灾难","压迫","反抗"],"thesis":"水既是自然灾害，也是社会压迫和群众力量的象征，丁玲借水的形态变化写出灾民的苦难与觉醒。","points":[{"point":"水首先表现为不可控制的自然灾害。","evidence":"洪水逼近村镇，灾民的生命和生活受到直接威胁。","location":"小说开头洪水逼近、村民逃难和恐慌的段落。","explain":"自然灾害建立全篇危机，也为社会矛盾的出现提供背景。","link":"但水的意义没有停留在自然灾害上。"},{"point":"水又象征官僚压迫下不断加剧的社会危机。","evidence":"县长和官员漠视灾民，甚至借灾难敛财。","location":"灾民与地方官员交涉、官员转移财物等情节。","explain":"洪水之外还有人为压迫，灾民面对的是自然和社会双重困境。","link":"这层象征把自然灾害推向社会批判。"},{"point":"水最终转化为群众觉醒和反抗的力量。","evidence":"群众从恐惧走向联合，结尾“比水还凶猛，朝镇上扑过去”具有反抗意味。","location":"结尾群众集体行动和裸身汉子带领反抗的段落。","explain":"水的力量从摧毁灾民转向冲击压迫秩序，象征群众觉醒。","link":"结论必须写成多重象征，不能只写“水代表灾难”。"}],"traps":["只写水是自然灾害，忽略社会压迫和群众力量。","象征分析只有结论，没有引文和情节定位。"]},{"id":"water-change","work":"《水》","workKey":"water","type":"主题思想","title":"从灾难到抗争","prompt":"结合文本，分析《水》中灾民由恐惧到反抗的变化。","keywords":["灾民","恐惧","反抗","觉醒","群众","变化"],"thesis":"《水》通过灾民由恐惧到联合反抗的变化，表现底层群众在灾难和压迫中逐渐觉醒。","points":[{"point":"灾难初期，灾民主要处于恐惧和无助中。","evidence":"洪水逼近时，村民惊慌逃散，对未来缺乏掌控。","location":"洪水到来前后灾民逃难、求生的情节。","explain":"恐惧状态说明他们还没有形成集体行动能力。","link":"接下来的社会压迫改变了人物关系。"},{"point":"官僚冷漠和剥削让灾民看清现实。","evidence":"官员不积极救灾，反而维护自身利益。","location":"灾民与县长、官员发生冲突的段落。","explain":"灾难不再只是自然问题，也成为阶级矛盾的显现。","link":"认识的变化推动群众走向联合。"},{"point":"结尾的反抗说明群众力量开始形成。","evidence":"群众集体冲向镇上，裸身汉子成为行动的组织者和象征。","location":"小说结尾群众反抗的高潮部分。","explain":"反抗把分散的个人痛苦转化为集体行动，完成主题升华。","link":"结尾要点明群众觉醒与作品的社会意义。"}],"traps":["只概括变化，不写每个阶段的文本依据。","把反抗写成突然发生，忽略压迫推动变化的过程。"]},{"id":"water-hero","work":"《水》","workKey":"water","type":"人物形象","title":"裸身汉子与群众形象","prompt":"分析《水》中裸身汉子或群众形象。","keywords":["裸身汉子","群众","群像","反抗","力量","领袖"],"thesis":"裸身汉子不是孤立的英雄，而是群众力量逐渐形成的集中体现。","points":[{"point":"群众在灾难中承受最直接的苦难。","evidence":"灾民流离失所，生活与生命都受到洪水威胁。","location":"洪水灾害和村民逃难段落。","explain":"群像先以受害者身份出现，奠定作品的现实基础。","link":"苦难为后续反抗积蓄力量。"},{"point":"群体在压迫中逐渐由分散走向联合。","evidence":"面对官员冷漠，灾民的不满不断扩大。","location":"灾民与官僚冲突的情节。","explain":"共同处境让个人情绪转化为集体情绪。","link":"裸身汉子的行动正是这种转化的表现。"},{"point":"裸身汉子代表群体的行动意志。","evidence":"结尾“比水还凶猛，朝镇上扑过去”写出反抗力量。","location":"小说结尾的高潮段。","explain":"人物与群体合在一起，说明反抗不是个人冲动，而是群众觉醒。","link":"分析人物时要把他放回群众关系，不只写个人性格。"}],"traps":["把裸身汉子写成传统个人英雄，忽略群众基础。","只描述人物动作，不解释动作的象征意义。"]},{"id":"water-theme","work":"《水》","workKey":"water","type":"主题思想","title":"灾难与社会批判","prompt":"分析《水》的主题思想。","keywords":["主题","灾难","社会批判","阶级","群众","觉醒"],"thesis":"《水》以洪水灾难为表层事件，揭示官僚压迫下底层群众的苦难、觉醒与反抗。","points":[{"point":"作品首先呈现自然灾害带来的生存危机。","evidence":"洪水摧毁家园，灾民被迫逃离。","location":"小说开篇洪水灾害的描写。","explain":"灾难构成情节起点，也集中呈现底层人民的脆弱处境。","link":"作品并未把灾难只当作自然现象。"},{"point":"官僚不作为把自然灾害推向社会悲剧。","evidence":"官员没有积极救援，反而利用灾情维护私利。","location":"官员处理灾情、灾民求助受阻的情节。","explain":"社会批判由此成为作品的核心主题之一。","link":"社会压迫进一步推动群众态度变化。"},{"point":"群众觉醒和反抗是作品的主题方向。","evidence":"结尾群众集体行动，形成反抗高潮。","location":"小说结尾群众冲向镇上的段落。","explain":"作品不仅展示苦难，也写出苦难中生长的力量。","link":"结论应同时覆盖灾难、批判和觉醒三层。"}],"traps":["只写灾难主题，删掉社会批判和群众觉醒。","只写主题判断，不回到情节和人物。"]},{"id":"hospital-luping","work":"《在医院中》","workKey":"hospital","type":"人物形象","title":"陆萍的性格与理想","prompt":"分析陆萍的人物形象。","keywords":["陆萍","性格","理想","批判","善良","坚持"],"thesis":"陆萍是怀抱革命理想的青年知识分子，她在艰苦环境中坚持工作，也因清醒和批判精神与医院现实不断冲突。","points":[{"point":"陆萍有明确的革命理想和责任感。","evidence":"她来到医院后希望改变现状，认真对待医疗和病人。","location":"陆萍初到医院、投入工作的情节。","explain":"理想驱动她行动，也让她对现实问题格外敏感。","link":"理想与环境的矛盾由此展开。"},{"point":"她能吃苦，在恶劣条件中仍然坚持。","evidence":"“她束紧一件棉衣”“脸都冻肿了，脚后跟常常裂口”“她从没有埋怨过”。","location":"陆萍在严寒中奔波、照顾病人的段落。","explain":"身体细节和动作描写让她的坚韧具体可见。","link":"坚韧性格也使她面对问题时不愿妥协。"},{"point":"她的善良和批判精神使她与环境发生冲突。","evidence":"她关心病人，也对医院管理混乱和不合理现象提出不满。","location":"陆萍照顾产妇、新生儿，以及批评医院问题的情节。","explain":"人物形象的价值不只在善良，还在于她敢于提出问题。","link":"结尾要写出陆萍与环境之间的张力。"}],"traps":["只把陆萍写成善良坚强的医护人员，忽略批判精神。","把身份写成产婆或普通护士，忽略她作为青年知识分子的处境。"]},{"id":"hospital-growth","work":"《在医院中》","workKey":"hospital","type":"主题思想","title":"陆萍的成长","prompt":"分析陆萍在医院中的成长变化。","keywords":["成长","变化","转折","老兵","挫折","理想"],"thesis":"陆萍在医院中的经历不是简单的理想受挫，而是在冲突、挫折和他人启发中重新理解革命工作的过程。","points":[{"point":"进入医院初期，陆萍的理想带有强烈的改造冲动。","evidence":"她对工作充满热情，希望通过努力改变医院面貌。","location":"陆萍初到医院后的工作愿望和观察。","explain":"理想让她积极，也使她对现实的复杂性估计不足。","link":"现实中的阻力随即出现。"},{"point":"挫折让她逐渐看到个人理想与环境之间的距离。","evidence":"医院管理混乱、人际关系复杂，她的努力没有立刻得到理解。","location":"陆萍与医院同事、管理人员发生矛盾的情节。","explain":"她经历的不是能力失败，而是理想与现实之间的磨合。","link":"关键转折需要落到具体人物和事件上。"},{"point":"没有脚的老兵等人使她重新理解坚持和革命工作。","evidence":"陆萍与老兵的交流，让她对苦难、责任和未来有了新的认识。","location":"陆萍遇到没有脚的老兵并受到触动的情节。","explain":"成长来自具体经验，而不是突然醒悟。","link":"结尾要落在她更成熟、更踏实的认识上。"}],"traps":["把成长写成从坏人变好人，人物层次会被简化。","只写受伤和挫折，不写转折事件如何改变陆萍。"]},{"id":"hospital-environment","work":"《在医院中》","workKey":"hospital","type":"艺术手法","title":"环境描写的作用","prompt":"分析《在医院中》环境描写的作用。","keywords":["环境描写","医院","寒冷","混乱","气氛","作用"],"thesis":"医院环境既是人物活动的现实空间，也映照出革命理想与落后现实之间的冲突。","points":[{"point":"寒冷和简陋写出物质条件的困难。","evidence":"陆萍在严寒中工作，脸被冻肿，脚后跟裂口。","location":"陆萍在冬天奔波的段落。","explain":"环境细节让她的坚持有了具体重量。","link":"环境也会影响人物对工作的感受。"},{"point":"医院管理的混乱营造压抑气氛。","evidence":"医疗条件、人员关系和制度问题不断显露。","location":"陆萍观察医院日常工作的情节。","explain":"环境描写把制度的落后和人际矛盾变得可见。","link":"环境由此成为冲突的推力。"},{"point":"环境与人物形成对照，突出理想主义的力量和困境。","evidence":"陆萍仍认真照顾病人，却不断遭到误解和阻力。","location":"陆萍救人、受挫和反思的连续情节。","explain":"外部环境越艰难，人物坚持与批判的价值越清楚。","link":"结尾回答环境描写如何服务人物和主题。"}],"traps":["只摘抄环境，不解释环境与人物的关系。","只写寒冷，忽略医院制度和人际环境。"]},{"id":"hospital-intellectual","work":"《在医院中》","workKey":"hospital","type":"人物关系","title":"知识分子与医院环境","prompt":"分析陆萍与医院环境的冲突。","keywords":["知识分子","医院","冲突","环境","改革","误解"],"thesis":"陆萍与医院的冲突，是青年知识分子的改革热情同落后环境、复杂人际关系之间的冲突。","points":[{"point":"陆萍带着改造现实的愿望进入医院。","evidence":"她主动观察问题、认真工作，希望改善医疗条件。","location":"陆萍到医院初期的工作表现。","explain":"愿望本身积极，但现实的复杂性超出她的预期。","link":"冲突不是个人恩怨，而是理想与环境的碰撞。"},{"point":"医院中的制度化问题和人际冷漠让她的努力受阻。","evidence":"管理混乱、责任不清、同事之间缺乏理解。","location":"陆萍与同事、管理者发生矛盾的情节。","explain":"环境没有为改革提供支持，反而消解个人热情。","link":"这让陆萍不得不重新思考怎样工作。"},{"point":"冲突最终推动陆萍成熟。","evidence":"她在挫折中反思自己的方式，并在老兵等人物身上获得新的理解。","location":"小说后段陆萍反思和转变的部分。","explain":"人物没有被失败打倒，而是在现实教育中成长。","link":"结尾要回扣知识分子如何面对现实。"}],"traps":["把冲突写成陆萍与某个人的私人矛盾。","只写环境落后，不写陆萍自身的成长。"]},{"id":"fortress-fang","work":"《围城》","workKey":"fortress","type":"人物形象","title":"方鸿渐的性格困境","prompt":"分析方鸿渐的人物形象。","keywords":["方鸿渐","性格","软弱","虚荣","围城","失败"],"thesis":"方鸿渐并非单纯的无能者，他有自省和善意，却缺少行动力，在爱情、事业和婚姻中不断被自己的软弱推入新的围城。","points":[{"point":"方鸿渐具有自省能力，却缺少改变现实的行动力。","evidence":"他能看清自己的处境和周围人的虚伪，却常常选择逃避或妥协。","location":"买假文凭、回国后面对家庭与工作安排的情节。","explain":"清醒与软弱同时存在，让人物既可悲又真实。","link":"这构成他反复进入围城的内在原因。"},{"point":"他的爱情选择体现犹豫和被动的性格。","evidence":"他在不同女性关系之间摇摆，既想得到认可，又害怕承担责任。","location":"方鸿渐与苏文纨、唐晓芙、孙柔嘉的关系变化。","explain":"感情失败不只是外部误会，也来自他不敢做出明确选择。","link":"爱情围城由此成为人物性格的投射。"},{"point":"他的事业困境体现知识分子的无力。","evidence":"在三闾大学任教期间，他既看到学术圈的虚伪，也无法真正摆脱其中的规则。","location":"方鸿渐赴三闾大学任教及婚姻开始的情节。","explain":"他希望改变处境，却总被环境推动，形成事业与婚姻的双重困境。","link":"结尾要把人物放回“围城”主题。"}],"traps":["只写方鸿渐懦弱，忽略他能自省、有善意的一面。","把人物失败全部归因于外部环境，不分析他的选择。"]},{"id":"fortress-satire","work":"《围城》","workKey":"fortress","type":"艺术手法","title":"讽刺艺术","prompt":"分析《围城》的讽刺艺术。","keywords":["讽刺","反讽","比喻","虚伪","知识分子","手法"],"thesis":"《围城》通过反讽、比喻和人物对照，揭示知识分子在社会生活中的虚荣、虚伪与无力。","points":[{"point":"假文凭情节讽刺知识分子的虚荣。","evidence":"方鸿渐用假文凭维持体面，外表光鲜与内在空虚形成反差。","location":"方鸿渐留学归来和求职初期相关情节。","explain":"反讽让学历、体面和真实能力之间的裂缝暴露出来。","link":"讽刺首先指向个体人格，也延伸到社会风气。"},{"point":"三闾大学的情节讽刺学术圈的虚伪。","evidence":"教师之间争权、互相算计，学术身份和实际品行并不一致。","location":"方鸿渐到三闾大学任教后的校园与人事情节。","explain":"把知识分子群体放进日常权力关系，能显出崇高称号背后的庸俗。","link":"这里体现作品对社会群体的批判。"},{"point":"婚姻围城和人物关系用比喻强化讽刺效果。","evidence":"“城外的人想进去，城里的人想出来”的围城隐喻贯穿爱情与婚姻选择。","location":"方鸿渐爱情、婚姻和职业连续受挫的情节线。","explain":"围城比喻把欲望、失望和现实困境压缩成一个可反复回扣的意象。","link":"结尾要点明讽刺不是搞笑，而是对人生处境的揭示。"}],"traps":["只写“运用比喻和讽刺”，没有解释讽刺指向什么。","把讽刺理解成单纯搞笑，忽略其中的社会批判。"]},{"id":"fortress-marriage","work":"《围城》","workKey":"fortress","type":"主题思想","title":"婚姻围城","prompt":"结合文本，分析《围城》中婚姻围城的含义。","keywords":["婚姻","围城","爱情","失望","选择","方鸿渐"],"thesis":"婚姻围城在小说中表现为对理想生活的想象和进入现实后的失望，方鸿渐与孙柔嘉的婚姻集中写出这种困境。","points":[{"point":"婚姻在人物想象中代表着理想和归属。","evidence":"方鸿渐希望通过爱情和婚姻获得稳定、体面和被认可的生活。","location":"方鸿渐与苏文纨、唐晓芙、孙柔嘉关系发展的情节。","explain":"婚姻寄托了他的期待，也暴露了他对自我和责任认识不足。","link":"期待越高，进入现实后的落差越明显。"},{"point":"进入婚姻后，日常矛盾和现实压力打破理想。","evidence":"方鸿渐与孙柔嘉的婚姻逐渐充满争执、误解和失望。","location":"方鸿渐与孙柔嘉结婚后相处的情节。","explain":"婚姻不是浪漫结局，而是另一种现实困境的开始。","link":"这正是围城隐喻在婚姻线上的体现。"},{"point":"婚姻围城与事业围城互相映照。","evidence":"婚姻问题和三闾大学的职业困境同时推进，形成双重压力。","location":"方鸿渐在三闾大学任教并进入婚姻阶段的情节。","explain":"个人在爱情、事业、家庭中不断进入新困境，构成更普遍的人生困局。","link":"结尾要回到“围城”作为人生困境的象征。"}],"traps":["只写某段感情失败，忽略婚姻围城的普遍含义。","只讲婚姻，不断开事业围城的互相映照。"]},{"id":"fortress-parallel","work":"《围城》","workKey":"fortress","type":"人物关系","title":"赵辛楣与方鸿渐","prompt":"分析赵辛楣与方鸿渐的平行关系及其作用。","keywords":["赵辛楣","方鸿渐","平行","对照","三闾大学","知识分子"],"thesis":"赵辛楣和方鸿渐构成平行对照关系，两人共同暴露知识分子的困境，也通过性格和处世方式的差异加深人物塑造与社会讽刺。","points":[{"point":"两人都卷入爱情和职业困境，构成平行线。","evidence":"他们在感情选择和三闾大学的工作环境中都面临挫折和现实压力。","location":"方鸿渐与赵辛楣在国内相处、赴三闾大学任教的情节线。","explain":"平行关系说明困境不只属于某个人，而是知识分子群体共同面对的问题。","link":"平行并不意味着人物完全相同。"},{"point":"两人的性格和处世方式形成对照。","evidence":"赵辛楣更有行动力和处世能力，方鸿渐更犹疑、被动。","location":"两人处理爱情、工作和人际关系的相关情节。","explain":"对照突出方鸿渐的软弱，也说明个人选择如何影响命运。","link":"人物关系因此承担塑造和讽刺的双重功能。"},{"point":"两人的关系映射三闾大学和知识圈的虚伪。","evidence":"他们在学术机构中共同经历权力、面子和利益关系。","location":"三闾大学教师群体和人事矛盾情节。","explain":"通过一对人物关系，作品把个人困境扩展到群体批判。","link":"结尾要回到作品对知识分子处境的整体表现。"}],"traps":["只并列写两个人，不说明二者如何对照。","把赵辛楣写成完人，忽略他也处在同样的社会困境中。"]}];
var WORKS={"saffi":"《莎菲女士的日记》","water":"《水》","hospital":"《在医院中》","fortress":"《围城》"};
var state={mode:"list",work:"all",query:"",selected:null,matchQuery:"",hide:false};
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function workName(k){return WORKS[k]||k}
function norm(s){return String(s||"").toLowerCase().replace(/[\s，。！？；：、“”‘’（）《》〈〉·,.!?;:'"()\[\]{}<>\/\\-]/g,"")}
function grams(s,n){s=norm(s);var out=[];for(var i=0;i<=s.length-n;i++)out.push(s.slice(i,i+n));return out}
function itemText(x){return [x.title,x.prompt,x.work,x.type,x.keywords.join(" "),x.thesis,x.points.map(function(p){return p.point+" "+p.evidence+" "+p.location}).join(" ")].join(" ")}
function scoreItem(x,q){q=norm(q);if(!q)return 0;var score=0;x.keywords.forEach(function(k){if(q.indexOf(norm(k))>=0)score+=18});if(q.indexOf(norm(x.title))>=0)score+=28;if(norm(x.prompt).indexOf(q)>=0)score+=28;var target=itemText(x);[2,3,4].forEach(function(n){grams(q,n).forEach(function(g){if(target.indexOf(g)>=0)score+=g.length*g.length})});return score}
function matchedKeywords(x,q){q=norm(q);return x.keywords.filter(function(k){return q.indexOf(norm(k))>=0})}
function listView(){var q=state.query;var arr=DATA.filter(function(x){return (state.work==="all"||x.workKey===state.work)&&(!q||itemText(x).indexOf(q)>=0)});var chips='<div class="chips"><button class="'+(state.work==="all"?"on":"")+'" data-work="all">全部</button>'+Object.keys(WORKS).map(function(k){return '<button class="'+(state.work===k?"on":"")+'" data-work="'+k+'">'+esc(WORKS[k])+'</button>'}).join("")+'</div>';var cards=arr.map(function(x){return '<div class="card" data-open="'+x.id+'"><div class="meta"><span class="tag">'+esc(workName(x.workKey))+'</span><span class="tag">'+esc(x.type)+'</span></div><h3>'+esc(x.title)+'</h3><p>'+esc(x.prompt)+'</p></div>'}).join("")||'<div class="empty">没有找到匹配的母题</div>';return '<input class="search" id="search" placeholder="搜索题目、作品或关键词" value="'+esc(q)+'">'+chips+'<div class="count">共 '+arr.length+' 道母题</div>'+cards}
function matchView(){var results=DATA.map(function(x){return {item:x,score:scoreItem(x,state.matchQuery)}}).filter(function(x){return x.score>0}).sort(function(a,b){return b.score-a.score}).slice(0,3);var html='<textarea class="matchBox" id="matchBox" placeholder="粘贴题目，例如：分析《围城》的讽刺艺术">'+esc(state.matchQuery)+'</textarea><button class="primary" id="doMatch">匹配母题</button>';if(state.matchQuery&&results.length){html+='<div class="hint">最接近的母题</div>'+results.map(function(r){var kws=matchedKeywords(r.item,state.matchQuery).join("、");return '<div class="result" data-open="'+r.item.id+'"><span class="score">匹配 '+r.score+'</span><h3>'+esc(r.item.title)+'</h3><p>'+esc(r.item.work)+' · '+esc(r.item.type)+(kws?' · '+esc(kws):'')+'</p><p>'+esc(r.item.thesis)+'</p></div>'}).join("")}else if(state.matchQuery){html+='<div class="empty">暂时没有匹配到母题，换一个题目关键词试试</div>'}return html}
function detailView(x){var points=x.points.map(function(p,i){return '<div class="point"><div class="pointTitle">论点 '+(i+1)+'：'+esc(p.point)+'</div><div class="field"><b>原文依据</b>'+esc(p.evidence)+'</div><div class="loc">定位：'+esc(p.location)+'</div><div class="field"><b>Explain</b>'+esc(p.explain)+'</div><div class="field"><b>Link</b>'+esc(p.link)+'</div></div>'}).join("");var traps=x.traps.map(function(t){return '<div class="warn">'+esc(t)+'</div>'}).join("");return '<span class="back" id="back">← 返回</span><div class="panel"><div class="meta"><span class="tag">'+esc(workName(x.workKey))+'</span><span class="tag">'+esc(x.type)+'</span></div><h2>'+esc(x.title)+'</h2><p>'+esc(x.prompt)+'</p><div class="thesis"><b>中心论点</b><br>'+esc(x.thesis)+'</div></div><div class="panel"><button class="ghost" id="toggleHide">'+(state.hide?"显示论点与原文定位":"先自己想，遮住答案")+'</button><div class="'+(state.hide?"hide":"")+'" id="answerBox" style="margin-top:12px"><h3>三个论点</h3>'+points+'</div></div><div class="panel"><h3>扣题提醒</h3>'+traps+'</div>'}
function render(){var app=document.getElementById("app");if(state.selected){var item=DATA.find(function(x){return x.id===state.selected});app.innerHTML=item?detailView(item):'<div class="empty">没有找到这道题</div>'}else{app.innerHTML=state.mode==="match"?matchView():listView()}bind()}
function bind(){document.querySelectorAll("#tabs button").forEach(function(b){b.className=b.dataset.mode===state.mode?"on":"";b.onclick=function(){state.mode=b.dataset.mode;state.selected=null;state.hide=false;render()}});var search=document.getElementById("search");if(search)search.oninput=function(){state.query=this.value.trim();render();var el=document.getElementById("search");if(el){el.focus();el.selectionStart=el.selectionEnd=el.value.length}};document.querySelectorAll("[data-work]").forEach(function(b){b.onclick=function(){state.work=b.dataset.work;render()}});document.querySelectorAll("[data-open]").forEach(function(el){el.onclick=function(){state.selected=el.dataset.open;state.hide=false;render();window.scrollTo(0,0)}});var box=document.getElementById("matchBox");if(box)box.oninput=function(){state.matchQuery=this.value};var doMatch=document.getElementById("doMatch");if(doMatch)doMatch.onclick=function(){state.matchQuery=document.getElementById("matchBox").value.trim();render()};var back=document.getElementById("back");if(back)back.onclick=function(){state.selected=null;render()};var toggle=document.getElementById("toggleHide");if(toggle)toggle.onclick=function(){state.hide=!state.hide;render()}}
render();
</script>
</body>
</html>
