<script>
var DATA=[{"id":"saffi-character","work":"《莎菲女士的日记》","workKey":"saffi","type":"人物形象","title":"莎菲的主体性矛盾","prompt":"分析莎菲女士的性格矛盾及其思想意义。","keywords":["莎菲","矛盾","灵肉冲突","觉醒","孤独","女性"],"thesis":"莎菲的矛盾体现五四新一代知识女性在身体欲望、精神道德、自我尊严与父权现实之间形成的主体性冲突，远超一般性格反复。","points":[{"point":"莎菲敢于承认欲望，开始以女性自身感受确认主体存在。","evidence":"“我压制住我那狂热的欲念，我未曾请求他多留一会儿。”","location":"莎菲认识凌吉士后，反复书写情感与欲望的日记段落。","explain":"这一心理瞬间把人物感受与自我约束同时呈现出来。她承认身体经验的存在，却在外部规范和自尊压力下收回行动，由此形成既渴望自主又不断自我审判的心理结构。莎菲的主体意识正是在这种张力中显现，她不再完全接受被规定的女性角色，也尚未获得无负担的自由。","link":"欲望的觉醒因此成为理解莎菲全部矛盾的前提。","page":"P61","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"她以精神契合和人格尊严为最高标准，拒绝让肉体欲望凌驾于道德判断。","evidence":"“当我明白了那使我爱慕的一个高贵的美形里，是安置着如此一个卑劣灵魂。”","location":"莎菲看清凌吉士真实面目后的心理转折。","explain":"外貌带来的吸引与人格判断发生冲突时，人物没有停在感官迷恋中。她对爱情对象的要求包含精神品质和人格尊严，因此仍会受吸引，却能重新收回感情。这一选择把私人恋爱提升为价值判断，显示新知识女性开始决定何种关系值得进入，也拒绝让身体欲望取代道德主体。","link":"她的拒绝因此是一次主体判断，同时也结束了一段无法继续的恋爱关系。","page":"P58","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"她的孤独来自主体觉醒后缺乏能够承载新女性的社会关系和共同体。","evidence":"“我总愿意有那么一个人能了解得我清清楚楚的。”","location":"莎菲与亲友、爱人相处时反复出现的失望和独处。","explain":"亲友的照料只触及生活层面，无法回应人物对深度理解的要求；爱情对象也缺少相称的精神能力。周围关系越密集，她越感到没有人能够真正进入自己的内心，孤独因而来自社会关系无法承接新的自我意识，不只来自个人性格。","link":"矛盾形象由此通向五四新女性的结构性困境。","page":"P40","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把莎菲的矛盾只解释为摇摆不定的性格。","只写灵肉冲突，不说明她为何拒绝凌吉士以及这一拒绝的道德意义。"]},{"id":"saffi-awakening","work":"《莎菲女士的日记》","workKey":"saffi","type":"主题思想","title":"觉醒后的困境","prompt":"结合文本，谈谈莎菲的觉醒与困境。","keywords":["觉醒","困境","五四","新女性","自由","现实"],"thesis":"莎菲的觉醒让她看清传统束缚，却也让她陷入无路可走的现实困境。","points":[{"point":"她在思想上已经不再接受传统女性角色。","evidence":"“一个女人这样放肆，是不会得到好结果的。”","location":"莎菲面对爱情、身体和社交规范时的日记独白。","explain":"这句评价把外部规训呈现为对命运的善意提醒。人物能够察觉其中不合理之处，说明她已不再把旧式女性标准当成自然真理；但她仍生活在会用羞辱和孤立执行这套标准的现实中，觉醒因此同时带来清醒和压力。","link":"但觉醒并不自动带来出路。","page":"P45","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"她的现实环境没有为她提供新的精神位置。","evidence":"“一个正经女人所做不出来的。”","location":"莎菲与朋友、凌吉士相处时产生的失望和疏离。","explain":"这一判断把私人选择改写成道德罪名，压力来自具体的人际评价与舆论环境。人物获得新意识后没有新的社会位置可以安放自己，只能在旧规范内部不断解释，困境因此属于个人与时代条件的错位。","link":"困境来自个人觉醒与社会条件之间的落差。","page":"P46","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"丁玲借莎菲写出五四女性的真实处境。","evidence":"“我总愿意有那么一个人能了解得我清清楚楚的。”","location":"全篇日记的情绪推进和结尾的失落感。","explain":"人物寻找的是能够准确理解其复杂内心的关系，一般陪伴无法满足这一要求。这样的期待在亲友和爱情中相继落空，私人愿望因此指向更广阔的社会缺失：五四女性已经产生新的精神需要，现实却没有提供相应的关系与公共空间。","link":"结论要回到“觉醒与困境并存”这一核心判断。","page":"P40","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把觉醒写成彻底解放，忽略觉醒后仍处于困境。","只谈五四背景，不引用莎菲的具体心理和行为。"]},{"id":"saffi-psychology","work":"《莎菲女士的日记》","workKey":"saffi","type":"艺术手法","title":"心理描写的作用","prompt":"分析《莎菲女士的日记》中心理描写的作用。","keywords":["心理描写","日记体","内心","手法","作用","独白"],"thesis":"丁玲用日记体心理描写把莎菲的欲望、羞耻、清醒与孤独直接呈现在读者面前，使人物矛盾具有真实的心理层次。","points":[{"point":"日记体让人物可以不断暴露真实想法。","evidence":"“谁能懂得我呢，便能懂得这只能表现我万分之一的日记。”","location":"全篇以莎菲第一人称写成的日记段落。","explain":"私人书写同时制造坦诚与隔膜。人物愿意把内心留下，却又意识到任何表达都无法完整呈现自我，于是读者看到她不断解释自己，却始终没有得到真正回应。第一人称因此把心理真实和无法沟通的孤独放进同一个形式中。","link":"这使作品不同于只写外部行动的叙事。","page":"P65","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"心理描写把抽象的灵肉冲突变成可读的情绪过程。","evidence":"“我恨不得用脚尖踢出他去，不过我又为了另一种情绪所支配，我向他摇了头，表示是不厌烦他的来到。”","location":"莎菲与凌吉士关系变化前后的反复书写。","explain":"同一瞬间容纳两种相反行动：怒火要求拒绝，另一股力量又迫使她掩饰。人物的决定先于清晰认识发生，身体、尊严和欲望同时拉扯，读者因此能够追踪内心冲突怎样转化为具体表情和动作，抽象的人性矛盾获得了过程感。","link":"手法分析要说明效果，不能只报“心理描写”这个术语。","page":"P61","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"心理描写同时承担揭示主题的功能。","evidence":"“我总愿意有那么一个人能了解得我清清楚楚的。”","location":"莎菲与亲友、爱人相处时反复出现的失望和独处。","explain":"莎菲真正渴望的是有人进入她的精神世界，准确理解她的欲望、羞耻和判断。现实中的关心停留在照料和劝告层面，她只能不断回到日记中自我说明，个人心理因此直接连接到五四新女性缺少理解与共同体的主题。","link":"心理描写由此承担揭示时代困境的功能。","page":"P40","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["只写“大量心理描写”，没有分析具体心理变化。","引用后不解释，直接下“人物很矛盾”的结论。"]},{"id":"saffi-love","work":"《莎菲女士的日记》","workKey":"saffi","type":"人物关系","title":"精神标准与世俗人格的冲突","prompt":"分析莎菲对凌吉士由倾慕转为鄙弃的原因及其思想意义。","keywords":["凌吉士","爱情","迷恋","厌恶","欲望","选择"],"thesis":"莎菲对凌吉士的否定体现新知识女性以精神契合、人格独立和道德自持为标准，抗拒以金钱、肉欲和自我享受为核心的世俗人格，意义已经超出普通爱情幻灭。","points":[{"point":"莎菲主动凝视并承认欲望，体现女性作为欲望主体的觉醒。","evidence":"“颀长的身躯，白嫩的面庞，薄薄的小嘴唇，柔软的头发。”","location":"莎菲初次接触并观察凌吉士的日记段落。","explain":"男性身体进入女性人物的观察范围，叙述位置随之改变。人物主动感受、选择和评价对方，不再只是被观看或被挑选的对象，欲望经验因此获得主体性。这一转变是新女性意识的重要部分，但它仍以恋爱关系为出口。","link":"欲望主体性的获得，为后文她拒绝凌吉士提供了精神前提。","page":"P43","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"凌吉士的卑劣在于把金钱、肉欲和自我享受当作人生目的，莎菲以精神契合和道德自持否定这种世俗人格。","evidence":"“当我明白了那使我爱慕的一个高贵的美形里，是安置着如此一个卑劣灵魂。”","location":"莎菲认清凌吉士真实面目后的心理转折。","explain":"外在吸引与内在人格发生剧烈冲突后，人物重新行使判断权。她仍承认欲望存在，却拒绝接受以金钱、肉欲和自我享乐为中心的人生态度，恋爱问题因此上升为道德和价值选择，女性的精神标准不再由男性或礼教代替制定。","link":"这场拒绝把恋爱问题提升为知识女性的人格选择。","page":"P58","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"拒绝凌吉士使她守住自我，却也因为没有新的社会出路而加深孤独。","evidence":"“你是在想念那高个儿的影子呢！”","location":"莎菲与凌吉士关系结束前后的日记内容。","explain":"独白承认依恋仍随拒绝之后延续，因此人物选择经过真实挣扎。她无法为了满足欲望重新接受一个精神上无法认同的人，只能独自承担失落。人格保全与情感代价同时出现，说明个人觉醒已经发生，新的生活出路仍未形成。","link":"这一矛盾使人物超越个人恋爱，指向新女性缺少社会支持的处境。","page":"P45","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["只把关系变化写成恋爱失败或“从爱到恨”。","只写灵肉冲突，不解释凌吉士的世俗人格和莎菲的道德标准。"]},{"id":"water-symbol","work":"《水》","workKey":"water","type":"意象象征","title":"水的多重象征","prompt":"分析《水》中“水”的象征意义。","keywords":["水","象征","洪水","灾难","压迫","反抗"],"thesis":"水既是自然灾害，也是社会压迫和群众力量的象征，丁玲借水的形态变化写出灾民的苦难与觉醒。","points":[{"point":"水首先表现为不可控制的自然灾害。","evidence":"“愁惨的天照着黄色的滔滔的大水，那一夜淹了汤家阙，又淹了一渡口的一片汪洋的大水。”","location":"第一部分开头：洪水逼近汤家阙、一渡口时的全景描写，重点找颜色、声音和吞没村庄的动词。","explain":"色彩、规模和破坏结果被连成整体，灾害因此具有压倒性的力量。它先摧毁生活空间，又把底层推入饥饿和流离失所，作品由此从生存危机进入社会观察，水的第一层意义是超出个人控制的自然暴力。","link":"但水的意义没有停留在自然灾害上。","page":"P226","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"水又象征官僚压迫下不断加剧的社会危机。","evidence":"“帆船却又带来了一些军火，并没有带救济米。”","location":"第二部分：灾民等待救济，帆船靠岸后发现运来军火而非米粮；重点找镇长和官员的话语与物资对比。","explain":"两种物资同船出现，权力机构在灾民最需要救助时的选择被直接暴露。水灾因此获得社会属性，自然灾害同时成为官僚控制和阶级压迫的现场，象征意义从环境描写推进到制度批判。","link":"这层象征把自然灾害推向社会批判。","page":"P231","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"水最终转化为群众觉醒和反抗的力量。","evidence":"“比水还凶猛的，朝镇上扑了过去。”","location":"第四部分结尾：灾民冲向长岭岗粮仓，裸身汉子带头行动；重点找“比水还凶猛”与前文洪水描写的呼应。","explain":"结尾把洪水的破坏力转写为人群的行动力。原本被迫承受灾难的底层开始冲击既有秩序，力量方向的改变完成意象反转，也把作品主题从苦难记录推向集体反抗。","link":"结论必须写成多重象征，不能只写“水代表灾难”。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["只写水是自然灾害，忽略社会压迫和群众力量。","象征分析只有结论，没有引文和情节定位。"]},{"id":"water-change","work":"《水》","workKey":"water","type":"主题思想","title":"从灾难到抗争","prompt":"结合文本，分析《水》中灾民由恐惧到反抗的变化。","keywords":["灾民","恐惧","反抗","觉醒","群众","变化"],"thesis":"《水》通过灾民由恐惧到联合反抗的变化，表现底层群众在灾难和压迫中逐渐觉醒。","points":[{"point":"灾难初期，灾民主要处于恐惧和无助中。","evidence":"“那些被骂着的女人，一批一批的，在无可奈何之中，含着眼泪，含着一线希望，扶老携幼向着相反的方向跑去，带着哭和叫，带着骚扰和不安，向原野的四方伸去。”","location":"第一部分：洪水到来时灾民逃难、哭喊、扶老携幼；重点看人物一开始的被动和恐惧。","explain":"群像动作同时包含求生本能和失序恐惧，家庭被卷入迁徙，个体只能向四方散开。灾难初期的描写强调被动和混乱，为后续态度转折提供起点。","link":"接下来的社会压迫改变了人物关系。","page":"P226","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"官僚冷漠和剥削让灾民看清现实。","evidence":"“帆船却又带来了一些军火，并没有带救济米。”","location":"第二至三部分：灾民等待救济、与镇长及官员交涉；重点找希望落空后态度怎样变化。","explain":"等待救助的期待被另一种现实物资击碎，人物开始认识灾害背后的权力关系。群众不再把困境理解为单纯天灾，怀疑和愤怒因此具有具体的社会原因。","link":"认识的变化推动群众走向联合。","page":"P231","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"结尾的反抗说明群众力量开始形成。","evidence":"“比水还凶猛的，朝镇上扑了过去。”","location":"第四部分结尾：群众冲向镇上粮仓，暴力行动与集体情绪形成高潮；重点看反抗如何由前面的压迫积累而成。","explain":"结尾的集体行动把此前分散的痛苦汇成同一力量。反抗由求生压力推动，却已经指向压迫秩序本身，群众开始成为推动主题转变的行动主体。","link":"结尾要点明群众觉醒与作品的社会意义。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["只概括变化，不写每个阶段的文本依据。","把反抗写成突然发生，忽略压迫推动变化的过程。"]},{"id":"water-hero","work":"《水》","workKey":"water","type":"人物形象","title":"裸身汉子与群众形象","prompt":"分析《水》中裸身汉子或群众形象。","keywords":["裸身汉子","群众","群像","反抗","力量","领袖"],"thesis":"裸身汉子集中体现群众力量逐渐形成，人物形象带有鲜明的集体行动色彩。","points":[{"point":"群众在灾难中承受最直接的苦难。","evidence":"“那些被骂着的女人，一批一批的，在无可奈何之中，含着眼泪，含着一线希望，扶老携幼向着相反的方向跑去，带着哭和叫，带着骚扰和不安，向原野的四方伸去。”","location":"第一部分：妇女、老人和儿童逃难，重点找“无可奈何”“一线希望”等群像细节。","explain":"灾难先以群体受难的方式出现，流离、哭声和家庭迁徙使底层处境获得可见的人性重量。受害经验构成后文觉醒的情感基础，也使集体反抗不至于成为抽象口号。","link":"苦难为后续反抗积蓄力量。","page":"P226","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"群体在压迫中逐渐由分散走向联合。","evidence":"“哭有什么用，死的死了，哭得转来吗？不死的总得鼓着气想法，未必也死去吗？”","location":"第二至三部分：王大保、李塌鼻等人物在灾民中讨论求生和前往长岭岗，重点看个人话语如何推动集体情绪。","explain":"连续反问把悲痛引向现实行动，灾民开始围绕生存资源形成共同判断。联合在危机逼迫下逐渐产生，因而具有紧迫的现实感。","link":"裸身汉子的行动正是这种转化的表现。","page":"P228","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"裸身汉子代表群体的行动意志。","evidence":"“比水还凶猛的，朝镇上扑了过去。”","location":"第四部分结尾：裸身汉子带领人群冲向镇上；重点找人物动作与群体行动之间的关系。","explain":"身体行动与群体意志合为一体，反抗不再属于单个英雄。灾难积累的力量被导向压迫秩序，群众由此成为推动情节和主题变化的主体。","link":"分析人物时要把他放回群众关系，不只写个人性格。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把裸身汉子写成传统个人英雄，忽略群众基础。","只描述人物动作，不解释动作的象征意义。"]},{"id":"water-theme","work":"《水》","workKey":"water","type":"主题思想","title":"灾难与社会批判","prompt":"分析《水》的主题思想。","keywords":["主题","灾难","社会批判","阶级","群众","觉醒"],"thesis":"《水》以洪水灾难为表层事件，揭示官僚压迫下底层群众的苦难、觉醒与反抗。","points":[{"point":"作品首先呈现自然灾害带来的生存危机。","evidence":"“愁惨的天照着黄色的滔滔的大水，那一夜淹了汤家阙，又淹了一渡口的一片汪洋的大水。”","location":"第一部分开头：洪水毁坏村庄和田地的全景描写，先建立自然灾害的生存危机。","explain":"具体生活空间被灾难吞没，作品把注意力放在村庄、田地和家庭的毁坏上。灾害成为观察底层贫困与社会脆弱性的起点，主题从自然危机展开。","link":"作品并未把灾难只当作自然现象。","page":"P226","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"官僚不作为把自然灾害推向社会悲剧。","evidence":"“帆船却又带来了一些军火，并没有带救济米。”","location":"第二至三部分：官员处理灾情、灾民求助受阻，帆船运来军火而非米粮。","explain":"权力机构在救灾时刻选择的物资方向，直接揭开天灾背后的人为因素。批判对象由洪水转向制度，作品的社会悲剧性质因此确立。","link":"社会压迫进一步推动群众态度变化。","page":"P231","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"群众觉醒和反抗是作品的主题方向。","evidence":"“比水还凶猛的，朝镇上扑了过去。”","location":"第四部分结尾：群众冲向粮仓并反抗官府与地主，观察主题如何由苦难推进到斗争。","explain":"底层从被动承受转为主动冲击，叙述也由揭露苦难走向想象变革。反抗成为小说的主题方向，并承担连接现实批判与革命叙事的任务。","link":"结论应同时覆盖灾难、批判和觉醒三层。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["只写灾难主题，删掉社会批判和群众觉醒。","只写主题判断，不回到情节和人物。"]},{"id":"hospital-luping","work":"《在医院中》","workKey":"hospital","type":"人物形象","title":"陆萍的多重主体与理想锋芒","prompt":"分析陆萍的人物形象及其复杂性。","keywords":["陆萍","性格","理想","批判","善良","坚持"],"thesis":"陆萍兼具新女性、现代医学知识者和共产党员三重身份；她以专业责任和革命理想进入医院，又在现实冲突中显出敏感、热烈、缺乏世故和强烈的批判精神。","points":[{"point":"陆萍带着现代教育理想和改变现实的热情进入医院。","evidence":"“她总是爱飞。总不满于现状。”","location":"第一部分：陆萍被分配到山沟医院，初入窑洞和病房；重点找她对环境、院长、同事的最初判断。","explain":"人物不断追求更高的可能，也持续检验现实的不合理。现代教育和革命热情让她对拖沓、落后状态格外敏感，行动锋芒由此获得思想来源。","link":"这种理想锋芒既推动她行动，也埋下与现实冲突的根源。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"她把专业责任落实为照顾病人和改善医疗的具体行动。","evidence":"“为了不愿病人产妇多受苦痛，便自己去替几个开刀了的，发炎的换药。”","location":"第二部分：陆萍替开刀和发炎的病人换药、照顾产妇和婴儿；重点记录她的具体劳动。","explain":"关怀落在护理、换药和奔走等具体劳动中，理想必须通过身体实践兑现。责任因此同时具有专业标准和情感基础，人物形象避免了单纯口号化。","link":"她的理想主义因具体行动而获得可信度。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"她坚持批判现实，因而在麻木环境中成为被排斥的异类。","evidence":"“她已经成为医院里小小的怪人，被大多数人用异样的眼睛看着。”","location":"第二至三部分：她提交意见书、被议论为“小小的怪人”，以及同事和病人用异样眼光看她的连续情节。","explain":"专业判断与群体习惯发生冲突后，提出意见的人被排除在正常关系之外。孤立既暴露环境对异见的排斥，也反衬人物责任感、正直和敏锐的知识分子气质。","link":"人物魅力与人物困境在这一点上同时成立。","page":"P387","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把陆萍写成毫无缺点、永远正确的英雄。","只写她受委屈，不分析她的专业责任、批判精神和理想锋芒。"]},{"id":"hospital-growth","work":"《在医院中》","workKey":"hospital","type":"主题思想","title":"愤怒、反思与未完成的成长","prompt":"分析陆萍在医院中的受挫、反思与成长。","keywords":["成长","变化","转折","老兵","挫折","理想"],"thesis":"陆萍敏感、热情、重感情，也把革命集体想象成彼此关爱的共同体。中毒事件让她亲眼看到同志间缺少基本关心，理想因此受创；她由愤怒、动摇和反思逐渐走向继续学习与实践。","points":[{"point":"陆萍的性格核心是敏感、热情和对人的关怀。","evidence":"“为了不愿病人产妇多受苦痛，便自己去替几个开刀了的，发炎的换药。”","location":"第二部分：陆萍在医院承担护理工作，主动替开刀和发炎的病人换药、照顾产妇和婴儿。","explain":"人物对他人的痛苦具有敏锐感受，并愿意以具体劳动回应。革命理想、个人情感和职业责任因此连在一起，她也期待集体同样珍惜人与人之间的关怀。","link":"人物的敏感和重感情，为后文受到集体冷漠冲击埋下原因。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"中毒事件最重的打击，是她发现身边的人缺少对同志的基本关心。","evidence":"“现实生活使她感到太可怕。她想为什么那晚有很多人在她身旁走过，却没有一个人援助她。她想院长为节省几十块钱，宁肯把病人、医生、看护来冒险。她回省她日常的生活，到底于革命有什么用？革命既然是为着广大的人类，为什么连最亲近的同志却这样缺少爱。”","location":"第四部分：陆萍在中毒事件后回想当晚无人援助，并追问医院管理和革命集体为何缺少关爱。","explain":"事件最深的伤害来自集体冷漠，而非单纯医疗事故。人物原先相信革命以保护人、关怀人为目的，却看到生命可以被省钱的逻辑牺牲，愤怒与动摇因此具有明确的价值基础。","link":"创伤来自身体中毒，也来自革命集体形象在她心中的破裂。","page":"待核","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"她经过动摇后选择把痛苦转化为继续成长的动力。","evidence":"“新的生活虽要开始，然而还有新的荆棘。人是要经过千锤百炼而不消溶才能真真有用。人是在艰苦中成长。”","location":"第四部分结尾：陆萍接受老同志的开导，重新思考革命道路和自己的成长方向。","explain":"结尾没有把受挫写成理想终结。人物承认困难仍会继续，同时要求自己在现实中保持完整、通过长期实践成为有用的人，成长因此获得开放而持续的方向。","link":"成长没有完成，人物的选择已经从情绪反抗转向更具韧性的实践。","page":"待核","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["只写中毒事件暴露制度问题，忽略它对陆萍性格和情感信念的打击。","把成长理解成陆萍被环境彻底驯服。","只写结尾振作，不分析中间的愤怒、动摇和反思。"]},{"id":"hospital-environment","work":"《在医院中》","workKey":"hospital","type":"艺术手法","title":"环境描写的作用","prompt":"分析《在医院中》环境描写的作用。","keywords":["环境描写","医院","寒冷","混乱","气氛","作用"],"thesis":"医院环境既是人物活动的现实空间，也映照出革命理想与落后现实之间的冲突。","points":[{"point":"寒冷和简陋写出物质条件的困难。","evidence":"“窗户外无声地飘着雪片。”","location":"陆萍在冬天奔波的段落。","explain":"冷寂天气营造封闭气氛，自然条件与医疗条件的落后互相映照。人物的行动始终承受身体和环境重量，环境描写参与塑造理想受挫的现实基础。","link":"环境也会影响人物对工作的感受。","page":"P390","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"医院管理的混乱营造压抑气氛。","evidence":"“她替她们要清洁的被袄，暖和的住室，滋补的营养，有次序的生活。”","location":"陆萍观察医院日常工作的情节。","explain":"反复争取的只是最基本的医疗与生活需要，越普通的条件越暴露管理的混乱。描写把制度问题落在病人日常处境中，环境因此直接承担批判功能。","link":"环境由此成为冲突的推力。","page":"P387","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"环境与人物形成对照，突出理想主义的力量和困境。","evidence":"“她已经成为医院里小小的怪人，被大多数人用异样的眼睛看着。”","location":"陆萍救人、受挫和反思的连续情节。","explain":"群体注视把环境压力转化成人物处境，越冷淡的周围反应越反衬人物坚持。医院空间、人物关系和主题冲突由此连成一体，环境不再只是背景。","link":"结尾回答环境描写如何服务人物和主题。","page":"P387","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["只摘抄环境，不解释环境与人物的关系。","只写寒冷，忽略医院制度和人际环境。"]},{"id":"hospital-intellectual","work":"《在医院中》","workKey":"hospital","type":"人物关系","title":"知识分子与医院环境","prompt":"分析陆萍与医院环境的冲突。","keywords":["知识分子","医院","冲突","环境","改革","误解"],"thesis":"陆萍与医院的冲突，是青年知识分子的改革热情同落后环境、复杂人际关系之间的冲突。","points":[{"point":"陆萍带着改造现实的愿望进入医院。","evidence":"“她常常为了他们的生活管理，和医疗的改善与很多人发生冲突。”","location":"陆萍到医院初期的工作表现。","explain":"人物与人发生矛盾，核心来自公共职责。她把病人的日常需要和医疗安全看得比人情往来更重要，现代医学标准进入边区医院后遭遇阻力，她的抗议因此具有明确专业理想。","link":"冲突由理想与环境的碰撞产生，已经超越个人恩怨。","page":"P387","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"医院中的制度化问题和人际冷漠让她的努力受阻。","evidence":"“小资产阶级意识、知识分子的英雄主义、自由主义等等的帽子都往她头上戴。”","location":"陆萍与同事、管理者发生矛盾的情节。","explain":"身份标签取代对具体问题的讨论，人物的意见失去正常回应渠道。机构以政治判断保护旧秩序，也失去自我修正能力，个人受阻与制度问题同时显现。","link":"这让陆萍不得不重新思考怎样工作。","page":"P394","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"冲突最终推动陆萍成熟。","evidence":"“她总是爱飞，总不满于现状。”","location":"小说后段陆萍反思和转变的部分。","explain":"人物在冲突后没有丢掉行动气质，却对环境和自身局限有了更复杂认识。她从冲动改革转向持续实践，韧性因此成为成长结果。","link":"结尾要回扣知识分子如何面对现实。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把冲突写成陆萍与某个人的私人矛盾。","只写环境落后，不写陆萍自身的成长。"]},{"id":"fortress-fang","work":"《围城》","workKey":"fortress","type":"人物形象","title":"方鸿渐的性格困境","prompt":"分析方鸿渐的人物形象。","keywords":["方鸿渐","性格","软弱","虚荣","围城","失败"],"thesis":"方鸿渐具有自省和善意，却缺少行动力，在爱情、事业和婚姻中不断被自己的软弱推入新的围城。","points":[{"point":"方鸿渐具有自省能力，却缺少改变现实的行动力。","evidence":"“小小一方纸能把一个人的空疏、寡陋、愚笨都掩盖起来。”","location":"第一至二章：方鸿渐在欧洲购买假文凭，回国前后面对家人和社交圈对博士身份的期待。","explain":"人物能够看清能力与身份之间的落差，也明白外在证明无法真正改变内在虚弱。清醒带来自嘲和不安，却没有自动变成行动，性格困境因此建立在认识与执行之间的断裂。","link":"这构成他反复进入围城的内在原因。","page":"P10","edition":"人民文学出版社软皮版","chapter":"第一章","searchPhrase":"小小一方纸","pdfPage":"19"},{"point":"他的爱情选择体现犹豫和被动的性格。","evidence":"“这姓方的不合式，气量太小，把钱看得太重。”","location":"第三至四章上海爱情线，以及第五至九章与孙柔嘉相识、结婚和婚后争执；重点看他面对选择时的拖延和回避。","explain":"婚恋评价掌握在他人和环境手中，人物缺少坚定选择和处理关系的能力。每次退让都加深被动，失败因此来自性格反复作用，而非一次偶然误会。","link":"爱情围城由此成为人物性格的投射。","page":"P44","edition":"人民文学出版社软皮版","chapter":"第二章","searchPhrase":"这姓方的不合式","pdfPage":"52"},{"point":"他的事业困境来自机构失信与个人行动力的双重不足。","evidence":"“怪不得贵老师高先生打电报聘我做教授，来了只给我个副教授。”","location":"第六章三闾大学任教期间：赵辛楣谈起学校如何改变承诺，方鸿渐用高松年聘他时改职称作例子。","explain":"职位承诺与实际安排直接冲突，机构失信暴露无遗；人物又只以抱怨回应，没有交涉或另寻道路。外部不公与个人软弱共同造成事业困境。","link":"事业失败因此同时指向环境问题与人物自身的行动力不足。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第六章","searchPhrase":"从没听过三闾大学","pdfPage":"223"}],"traps":["只写方鸿渐懦弱，忽略他能自省、有善意的一面。","把人物失败全部归因于外部环境，不分析他的选择。"]},{"id":"fortress-satire","work":"《围城》","workKey":"fortress","type":"艺术手法","title":"讽刺艺术","prompt":"分析《围城》的讽刺艺术。","keywords":["讽刺","反讽","比喻","虚伪","知识分子","手法"],"thesis":"《围城》通过反讽、比喻和人物对照，揭示知识分子在社会生活中的虚荣、虚伪与无力。","points":[{"point":"假文凭情节讽刺知识分子的虚荣。","evidence":"“小小一方纸能把一个人的空疏、寡陋、愚笨都掩盖起来。”","location":"第一至二章：假文凭和报纸吹捧把学历、体面与真实能力放在一起讽刺。","explain":"轻巧判断把证明形式与真实能力之间的差距推到读者眼前。人物依赖虚假身份获得体面，周围人也愿意相信外在凭证，讽刺因此同时落在个人虚荣与社会迷信上。","link":"讽刺首先指向个体人格，也延伸到社会风气。","page":"P10","edition":"人民文学出版社软皮版","chapter":"第一章","searchPhrase":"小小一方纸","pdfPage":"19"},{"point":"三闾大学的聘约处理讽刺学术机构的失信与权力任性。","evidence":"“高松年省他起稿子写信的麻烦，干脆不送聘约给他。”","location":"第八章：下学年聘约普遍发出，孙柔嘉也收到升薪聘书，高松年却故意不把方鸿渐的聘约送来。","explain":"重要职业决定被当作行政琐事处理，权力者甚至无需解释。程序表面存在，实际安排却随个人意志改变，学术机构的失信与专制由此暴露。","link":"学术机构表面讲制度，实际运行却依赖权力和私人关系。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第八章","searchPhrase":"这姓方的不合式","pdfPage":"273"},{"point":"婚姻围城和人物关系用比喻强化讽刺效果。","evidence":"“结婚仿佛金漆的鸟笼，笼子外面的鸟想住进去，笼内的鸟想飞出来。”","location":"第三至九章反复出现的爱情、职业和婚姻选择；重点找围城比喻、人物自嘲和事件反转形成的讽刺。","explain":"美丽外壳与封闭空间被压在同一形象中，欲望、进入和逃离形成循环。人物把关系想象成解决方案，进入后又急于离开，讽刺因此具有结构性和普遍性。","link":"结尾要点明讽刺对人生处境的揭示，避免写成单纯搞笑。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第三章","searchPhrase":"结婚仿佛金漆的鸟笼","pdfPage":"101"}],"traps":["只写“运用比喻和讽刺”，没有解释讽刺指向什么。","把讽刺理解成单纯搞笑，忽略其中的社会批判。"]},{"id":"fortress-marriage","work":"《围城》","workKey":"fortress","type":"主题思想","title":"婚姻围城","prompt":"结合文本，分析《围城》中婚姻围城的含义。","keywords":["婚姻","围城","爱情","失望","选择","方鸿渐"],"thesis":"婚姻围城在小说中表现为对理想生活的想象和进入现实后的失望，方鸿渐与孙柔嘉的婚姻集中写出这种困境。","points":[{"point":"婚姻在人物想象中代表着理想和归属。","evidence":"“结婚仿佛金漆的鸟笼，笼子外面的鸟想住进去，笼内的鸟想飞出来。”","location":"第三至四章上海爱情线，以及第五至九章方鸿渐与孙柔嘉相识、结婚和婚后生活；重点看人物对婚姻的想象如何变化。","explain":"人物把进入关系理解为获得归属和完整，外壳的体面感又加强这种想象。期待中缺少对责任和现实生活的准备，婚姻从一开始就承担了解决人生问题的幻想。","link":"期待越高，进入现实后的落差越明显。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第三章","searchPhrase":"结婚仿佛金漆的鸟笼","pdfPage":"101"},{"point":"进入婚姻后，日常矛盾和现实压力把幻想推向破裂。","evidence":"“好，咱们算散伙。行李衣服，你自己去办，别再来找我。”","location":"第九章：方鸿渐失业后与孙柔嘉在上海发生激烈争执，孙柔嘉提出散伙并回姑母家。","explain":"关系破裂被写成合作清算，情感退场后只剩具体事务的分割。日常压力不断累积，原先的期待被现实磨掉，新的束缚由此形成。","link":"婚姻困境与事业失败互相推动，使“围城”脱离单纯爱情比喻。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第九章","searchPhrase":"这姓方的不合式","pdfPage":"341"},{"point":"婚姻围城与事业围城互相映照。","evidence":"“城外的人想冲进去，城里的人想逃出来。”","location":"第五至七章三闾大学任教与第八至九章婚姻生活相互对照，重点看方鸿渐如何从想逃离一个环境又进入下一个困境。","explain":"同一结构在爱情、职业和婚姻中反复出现，人物总把进入当作出口，随后又面对失望。围城因此超出具体关系，指向欲望与现实之间的普遍循环。","link":"结尾要回到“围城”作为人生困境的象征。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第三章","searchPhrase":"城外的人想冲进去","pdfPage":"101"}],"traps":["只写某段感情失败，忽略婚姻围城的普遍含义。","只讲婚姻，不断开事业围城的互相映照。"]},{"id":"fortress-parallel","work":"《围城》","workKey":"fortress","type":"人物关系","title":"赵辛楣与方鸿渐","prompt":"分析赵辛楣与方鸿渐的平行关系及其作用。","keywords":["赵辛楣","方鸿渐","平行","对照","三闾大学","知识分子"],"thesis":"赵辛楣和方鸿渐构成同途殊态的对照关系。两人都追求爱情、职业和婚姻中的出路，却分别表现出主动精明与被动退让。作者借两人互相映照，既写出方鸿渐的软弱，也说明知识分子无论善于处世还是逃避现实，都难以真正走出社会与自我共同造成的围城。","points":[{"point":"初次见面时，赵辛楣精于社交、自信主动，方鸿渐敏感退让，两人的身份感和行动力立即显出高低。","evidence":"“赵辛楣和鸿渐拉拉手，傲兀地把他从头到脚看一下，好像鸿渐是页一览而尽的大字幼稚园读本。”“鸿渐诧异，这姓赵的怎会知道自己，忽然想也许这人看过《沪报》那条新闻，立刻局促难受。”","location":"第三章：苏文纨家中初见赵辛楣。重点找赵辛楣审视方鸿渐时的动作，以及方鸿渐随后的心理反应。","explain":"赵辛楣对社交位置的自觉掌控来自家世、留学和外事经历，他很快把潜在竞争变成审视和控制。方鸿渐在对方的目光中迅速怀疑自己，尚未正面交锋，心理上已经退到被动位置。两人的相似处境来自同一场爱情竞争，社会能力和性格力量却有明显差距。这一组对照先建立强弱关系，也为后文两人在爱情、职业和婚姻中的不同走向埋下性格基础。","link":"因此，平行关系首先表现为同一处境中的不同姿态，两人的差异使互相对照的作用更加清楚。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第三章","searchPhrase":"赵辛楣和鸿渐拉拉手","pdfPage":"59"},{"point":"苏文纨把两人的追求变成可以观看的竞争，赵辛楣和方鸿渐都卷入面子、欲望与爱情相互纠缠的角力。","evidence":"“她喜欢赵方二人斗法比武抢自己，但是她担心交战得太猛烈，顷刻就分胜负，二人只剩一人，自己身边就不热闹了。”","location":"第三章：苏文纨家中茶会及随后交往。重点找叙事者说明苏文纨如何观察并操纵赵辛楣与方鸿渐的竞争。","explain":"苏文纨不急于选择任何一个对象，而以两人的争夺维持自己的中心位置。赵辛楣把爱情当作可以争取的目标，方鸿渐则在猜疑、讨好和退缩之间反复摇摆，两种反应同时被同一场关系操纵。作者让两个知识男性的自尊、欲望和判断缺陷并置，所谓自由恋爱也因此在社交、面子和性别权力的游戏中失去真实性。","link":"两人的爱情困境由此得到具体呈现，对照关系也从性格差异进入情感与性别权力结构。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第三章","searchPhrase":"她喜欢赵方二人斗法比武抢自己","pdfPage":"62"},{"point":"赵辛楣的职业帮助显示他的精明、热心和资源，也使方鸿渐陷入依附处境，两人的友情带有明显的不对等。","evidence":"“鸿渐自知在学校的地位不稳固，又经辛楣细陈利害，刘东方恳切劝驾，居然大胆老脸、低头小心教起英文来。”","location":"第六章：三闾大学刘东方不愿继续代课，赵辛楣借机推荐方鸿渐。重点找方鸿渐对自身地位的判断和接受安排后的姿态。","explain":"面对职位不稳，方鸿渐没有能力自主争取，只能在赵辛楣分析利害和刘东方劝说之后接受安排。低头维持教学只能暂时保住位置，无法证明他真正获得职业能力。赵辛楣能够提供机会，说明他更懂人情和职场路径，也显示他的资源来自家世、学历和关系网络。善意提携与权力不对等同时存在，两人的关系因此进入知识分子生存结构的批判。","link":"这段关系揭示三闾大学的职位分配依赖人情、资源和派系，也使方鸿渐的依附性更加明显。","page":"待核","edition":"人民文学出版社软皮版","chapter":"第六章","searchPhrase":"鸿渐自知在学校的地位不稳固","pdfPage":"221"}],"traps":["只并列写两个人，不说明二者在哪些层面相似、哪些层面相反。","把赵辛楣写成完人，忽略他的精明、虚荣、权力表演和两面性。","把方鸿渐的困境全部归因于赵辛楣，忽略方鸿渐自身的犹豫和依附。"]},{"id":"saffi-loneliness","work":"《莎菲女士的日记》","workKey":"saffi","type":"主题思想","title":"莎菲的孤独","prompt":"分析莎菲孤独感的来源及其意义。","keywords":["孤独","寂寞","无人理解","疾病","蕴姊","新女性"],"thesis":"莎菲的孤独既来自病体和亲友的不理解，也来自她觉醒后找不到同路人的精神处境。","points":[{"point":"疾病和独居放大了莎菲的寂寞。","evidence":"“我总愿意有那么一个人能了解得我清清楚楚的。”","location":"莎菲日常生活中反复出现的独处与病中场景。","page":"P40","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"人物对关系质量的要求指向完整精神理解，照料和安慰无法替代。疾病与独处增加内省时间，也使她不断确认周围关怀的限度，寂寞由生活状态深化为精神困境。","link":"孤独因此成为人物心理和时代困境的共同表现。"},{"point":"亲友的照顾无法真正理解她的精神需求。","evidence":"“一个女人这样放肆，是不会得到好结果的。”","location":"莎菲与毓芳、云霖、苇弟相处的日记段落。","page":"P45","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"亲友的照顾仍伴随传统性别评价，接纳因此并不完整。人物越感到被误解，越退回私人感受，陪伴反而提醒她与周围人的精神距离。","link":"这使她不断退回日记和自我内部。"},{"point":"蕴姊之死让莎菲失去唯一可能理解自己的人。","evidence":"“谁能懂得我呢，便能懂得这只能表现我万分之一的日记。”","location":"关于蕴姊去世和莎菲继续写日记的段落。","page":"P65","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"重要亲友的死亡带走最可能理解她的人，留下的是精神空间的空缺。日记随后成为维持自我、对抗沉默的方式，孤独也成为觉醒后长期存在的处境。","link":"结尾应把个人孤独与五四新女性的处境联系起来。"}],"traps":["只写莎菲性格孤僻，忽略社会和时代原因。","把孤独和爱情困惑混为一谈，没有分层。"]},{"id":"saffi-diary-form","work":"《莎菲女士的日记》","workKey":"saffi","type":"艺术手法","title":"日记体的叙事效果","prompt":"分析《莎菲女士的日记》的日记体特征及其表达效果。","keywords":["日记体","第一人称","私人性","即时性","独语","真实感"],"thesis":"日记体让莎菲的私人情感、即时情绪和内心独语直接呈现，使人物矛盾具有现场感和真实感。","points":[{"point":"私人性使莎菲能够说出不愿公开的欲望与羞耻。","evidence":"“我恨不得用脚尖踢出他去，不过我又为了另一种情绪所支配，我向他摇了头，表示是不厌烦他的来到。”","location":"莎菲与凌吉士关系变化前后的日记，重点看同一瞬间的冲动和掩饰。","page":"P61","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"第一人称记录让莎菲可以同时写下愤怒、依恋和掩饰，不必先整理成符合社会期待的形象。读者看到的是未经外部审查的内心现场，羞耻、欲望与自我辩解彼此交叠，日记体的私人性因此带来强烈真实感。","link":"形式上的私密，使人物的矛盾能够直接暴露。"},{"point":"即时性让情绪变化呈现为连续过程。","evidence":"“我只得忍耐着，低下头去。”","location":"莎菲与凌吉士关系变化前后的日记。","page":"P43","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"同类情绪在不同日期持续回返，说明它形成长期心理状态。日期推进让期待、失望、羞愧和反抗各自占有一刻，读者能够追踪人物重新认识自己的过程。","link":"这使人物矛盾具有动态过程。"},{"point":"独语性把人物内心冲突写成两个自我的争辩。","evidence":"“一个女人这样放肆，是不会得到好结果的。”","location":"“难道我去找他吗”等内心争辩。","page":"P45","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"外部规范进入人物内心后，与自身欲望形成争辩。两种声音同时被记录，冲突不需要旁白解释，人物在自问自答中显出分裂而清醒的主体。","link":"结尾要回到形式与主题的统一。"}],"traps":["只写第一人称，不分析它对心理、节奏和主题的作用。","把日记体当作内容复述。"]},{"id":"water-contrast","work":"《水》","workKey":"water","type":"艺术手法","title":"《水》中的对比","prompt":"分析《水》中对比手法的运用。","keywords":["对比","官民","灾民","军火","希望","反抗"],"thesis":"《水》通过官与民、希望与失望、求生与反抗的对比，揭示天灾背后的人祸并推动群众觉醒。","points":[{"point":"灾民在灾难中的痛苦和流离构成人道关怀的起点。","evidence":"“那些被骂着的女人，一批一批的，在无可奈何之中，含着眼泪，含着一线希望，扶老携幼向着相反的方向跑去，带着哭和叫，带着骚扰和不安，向原野的四方伸去。”","location":"第一部分：洪水到来时妇女、老人和儿童逃难，重点看家庭被卷入迁徙的群像。","page":"P226","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"家庭、老人和孩子被卷入逃亡，表现一家一户失去住所和生存保障的过程。作品先呈现普通人的具体苦难，再进入官员和军队的冷漠，社会批判因此获得真实的人性基础。","link":"灾难后果与官民反差由此形成第一层对照。"},{"point":"赈济希望与军火现实形成反差。","evidence":"“帆船却又带来了一些军火，并没有带救济米。”","location":"第二部分：灾民等待船只和救济，船靠岸后却卸下军火；重点看期待与结果的同场反差。","page":"P231","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"具体希望被另一种现实物资取代，落差迫使群众重新理解自身位置。心理转折由现实证据推动，等待救助逐渐转向准备反抗。","link":"失望由此转化为愤怒。"},{"point":"水的凶猛与人群反抗形成力量对照。","evidence":"“比水还凶猛的，朝镇上扑过去。”","location":"第四部分结尾：洪水破坏村庄与群众冲向镇上形成前后对照，观察破坏力量怎样转为反抗力量。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"不可控灾难与组织行动被放入同一力量结构中，后者对前者形成反转。主题因此从承受苦难走向创造改变现实的力量。","link":"对比完成意象意义的反转。"}],"traps":["只列对比对象，不解释对比产生什么效果。","把官民对比写成简单善恶。"]},{"id":"water-wangdabao","work":"《水》","workKey":"water","type":"人物形象","title":"王大保和李塌鼻","prompt":"分析王大保和李塌鼻在灾民群体中的作用。","keywords":["王大保","李塌鼻","群众","求生","觉醒","组织"],"thesis":"王大保和李塌鼻分别以号召力和现实经验推动群众从绝望求生走向集体反抗。","points":[{"point":"王大保用直接有力的话语打破群体绝望。","evidence":"“哭有什么用，死的死去了，哭得转来吗？”","location":"第一部分洪水过后：灾民抱头大哭，王大保用反问打断绝望，重点记录他说了什么、群众怎样回应。","page":"P228","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"反问先否定无效悲痛，再把注意力拉回现实办法。人物语言承担社会动员功能，群体的绝望因此获得行动方向。","link":"他是群众情绪转折的推动者。"},{"point":"李塌鼻用对地主存粮的了解增强行动信心。","evidence":"“打开他们的仓，够我们一渡口的人吃几年。”","location":"第二至三部分：李塌鼻说明地主存粮，灾民商议前往长岭岗，重点找具体办法如何增强行动信心。","page":"P228","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"求生愿望被落实为具体方案，底层经验成为行动资源。人物提供的现实依据让反抗显得可行，语言具有实干色彩。","link":"他代表底层经验与实干力量。"},{"point":"两人共同推动群体从求生走向反抗。","evidence":"“老子们家破人亡，就留下这条命，还得算算账呢！”","location":"前往长岭岗及发现官府镇压灾民的前后情节，重点看两人的言论怎样汇入集体行动。","page":"P228","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"损失被明确转化为追讨意识，个人求救转入群体清算。两人的号召与现实判断合流，反抗获得情绪基础和组织方向。","link":"分析人物时要落到群体作用，不只写性格。"}],"traps":["把王大保写成孤胆英雄，忽略群众反应。","只写台词，不分析语言如何推动集体情绪。"]},{"id":"hospital-group","work":"《在医院中》","workKey":"hospital","type":"人物形象","title":"医院人物群像","prompt":"分析《在医院中》医院人物群像的作用。","keywords":["院长","黄守荣","张芳子","群像","官僚","冷漠"],"thesis":"医院人物群像分别代表外行领导、敷衍中层、麻木同事和疏离专业人员，共同构成陆萍改革受阻的现实环境。","points":[{"point":"医院管理层忽视基本医疗条件，官僚作风把病人和医护人员置于风险中。","evidence":"“手术室不装煤炉怎么行呢？”","location":"第三部分开头：陆萍提出手术室取暖问题，病人急需手术，只能临时烧木炭。","page":"P390","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"基本手术条件都得不到保障，说明医院管理已把行政便利和节省成本放在医疗安全之前。这个问题后来直接酿成中毒事故，院方的失职因此不只是一般疏忽，也揭示了边区医院制度建设的深层缺陷。","link":"这是陆萍改革受阻的外部原因，也为中毒事件埋下伏笔。"},{"point":"张芳子等同事代表麻木与随波逐流。","evidence":"“她已经成为医院里小小的怪人，被大多数人用异样的眼睛在看着。”","location":"陆萍与同事工作相处及提出意见的情节。","page":"P387","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"多数人的默认与旁观构成集体氛围。迫害未必都来自主动行为，随波逐流也能维持旧秩序，使个人热情无法转化为共同改变。","link":"群像揭示了环境改造的复杂。"},{"point":"群像共同突出陆萍的孤立与坚持，使她成为对照环境冷漠的行动者。","evidence":"“她仍然是那样兴致很浓厚的去照顾着那些产妇，那些婴儿，为着她们一点点的需索，去同管理员，总务处，秘书长，甚至院长去争执。”","location":"第三至四部分：中毒事件后陆萍仍为产妇和婴儿需要继续交涉。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）","explain":"周围人的默认和排斥没有让陆萍放弃病人和产妇，她仍为具体需要不断交涉。行动与群像态度形成反衬，使她既显出孤立，也显出改革愿望的公共价值。医院群像因此成为检验主角责任感和行动力的现实力量。","link":"人物与群像的张力由此推动陆萍重新理解现实和自己的工作。"}],"traps":["只列人物名字，不写他们各自代表的问题。","群像分析与陆萍无关，文章被拆成人物介绍。"]},{"id":"hospital-gas","work":"《在医院中》","workKey":"hospital","type":"主题思想","title":"手术室中毒事件与制度问题","prompt":"分析手术室中毒事件在小说中的作用。","keywords":["中毒","手术室","黎涯","冲突","成长","制度问题"],"thesis":"中毒事件把医疗条件、官僚管理、人际冷漠和陆萍的心理危机集中引爆，成为人物成长与作品社会批判的关键转折。","points":[{"point":"缺失煤炉使事故成为医疗条件长期落后的必然结果。","evidence":"“手术室不装煤炉怎么行呢？”","location":"第三部分开头：陆萍申请煤炉未及时获批，病人急需手术，只能临时烧木炭取暖。","explain":"基本医疗条件被反问点出缺口，事故不再是单纯偶然。资源分配和管理决策长期忽略安全，官僚与敷衍最终通过危机集中爆发。","link":"事件把个人抱怨变成具有公共性的制度问题。","page":"P390","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"事故后的标签化和流言把具体医疗问题转化为对个人的指责。","evidence":"“小资产阶级意识、知识分子的英雄主义、自由主义等等的帽子都往她头上戴。”","location":"第三至四部分：中毒事件后陆萍受到议论，她提出的医疗问题被解释成个人立场问题。","explain":"医院没有围绕设备、管理和责任展开讨论，反而用身份标签解释陆萍的批评。问题从公共治理被转移为个人立场，既使受害者承受二次伤害，也使机构失去修正错误的机会。","link":"中毒事件由此从医疗事故进一步暴露为组织内部的思想和管理危机。","page":"P394","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"事故之后继续寻找实践机会，使危机转化为成长动力。","evidence":"“她已经完全清楚，她需要静静的睡眠，可是被一种不知是什么东西压迫着，忍不住要哭要叫。”","location":"第三至四部分：陆萍醒来后情绪崩溃，继而反思医院管理、革命工作和自己的下一步选择。","explain":"人物被推到身体和精神低点后，只能直面自身与环境的关系。成长从此前的幻觉破灭开始，顺利成功无法承担这种转折。","link":"危机成为人物重新理解革命和自我的起点。","page":"P393","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["只复述中毒经过，不分析制度、人物和主题。","把事故当作偶然意外，忽略此前的资源申请和管理问题。"]},{"id":"hospital-ending","work":"《在医院中》","workKey":"hospital","type":"主题思想","title":"开放结尾与继续成长","prompt":"分析《在医院中》结尾对陆萍成长的意义。","keywords":["结尾","成长","革命","反思","机会","理想"],"thesis":"结尾让陆萍在痛苦反思后继续寻找学习和实践的机会，人物没有被现实击垮，也没有完成一次性改造，成长因此保持开放。","points":[{"point":"中毒事件后的压迫感使陆萍进入痛苦而清醒的反思。","evidence":"“她已经完全清楚，她需要静静的睡眠，可是被一种不知是什么东西压迫着，忍不住要哭要叫。”","location":"第三部分：手术室中毒后陆萍生病、哭泣、反思医院为何缺少关爱。","explain":"疲惫和压迫同时逼近，人物已经无法靠强撑解决全部问题。她开始追问环境为何冷漠、工作为何艰难，也面对理想、组织和自我之间的裂缝。","link":"反思使结尾不再停留在事件结果，而进入主体的重新选择。","page":"P393","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"朋友和老同志的劝解帮助她重新获得理解和行动方向。","evidence":"“她仍然是那样兴致很浓厚的去照顾着那些产妇，那些婴儿，为着她们一点点的需索，去同管理员，总务处，秘书长，甚至院长去争执。”","location":"第四部分：陆萍与郑鹏、黎涯及没有脚的老同志交流后，继续照顾病人并争取资源。","explain":"受挫后仍为具体需要奔走，说明关怀与责任没有消失。朋友的理解和老同志的经验让她看到，坚持理想还需要耐心和策略，成长离不开他人和群体。","link":"社会关系为陆萍从孤立走向继续实践提供支持。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"抓住新的学习机会，使结尾保持继续成长的开放性。","evidence":"“她准备着如何可以使自己不失去这一个机会。”","location":"第四部分结尾：陆萍准备继续工作和学习，读者应从她的行动选择判断成长方向。","explain":"重新获得的主动性表现为选择学习，人物已经离开单纯控诉和抱怨的位置。离开并不等于失败，它包含拒绝被环境同化，也承认成长需要新经验与更长时间。","link":"开放结尾回扣“人是在艰苦中成长”的主题。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把结尾理解成陆萍理想彻底破灭。","只写她离开医院，不分析离开后继续学习和实践的选择。"]},{"id":"fortress-diploma","work":"《围城》","workKey":"fortress","type":"主题思想","title":"假文凭的象征意义","prompt":"分析方鸿渐假文凭事件的讽刺意义。","keywords":["假文凭","克莱登","虚荣","学历","知识分子","围城"],"thesis":"假文凭既讽刺社会对学历的盲目崇拜，也象征方鸿渐用虚荣掩盖空疏、从而进入人生围城的起点。","points":[{"point":"假文凭掩盖了方鸿渐的空疏和无能。","evidence":"“小小一方纸能把一个人的空疏、寡陋、愚笨都掩盖起来。”","location":"第一至二章：方鸿渐在欧洲购买克莱登大学文凭，准备回国向家人交代的情节。","page":"P10","edition":"人民文学出版社软皮版","explain":"外在证明遮住了内在能力问题，人物明知虚假仍依赖它获得体面。凭证因此不只是骗局道具，也象征用身份包装弥补真实虚弱。","link":"虚荣因此成为人物悲剧的内在起点。","chapter":"第一章","searchPhrase":"小小一方纸","pdfPage":"19"},{"point":"社会对洋文凭的迷信使骗局得以成立。","evidence":"“顷由德国克莱登大学荣授哲学博士，将赴各国游历考察，秋凉回国，闻各大机关正争相礼聘云。”","location":"第二章：方鸿渐回国后，《沪报》刊登他的身份和学历，亲友与社会人士据此追捧。","page":"待核","edition":"人民文学出版社软皮版","explain":"报刊不但传播方鸿渐的学历，还主动为他加上名校、才学和机构争聘等光环。社会需要这样的留学神话来装点门面，个人谎言因此得到更大范围的确认；讽刺由方鸿渐的道德问题扩展到舆论和社会评价机制。","link":"骗局能够成立，依赖个人虚荣与社会崇拜共同维持。","chapter":"第一章","searchPhrase":"小小一方纸","pdfPage":"19"},{"point":"假文凭埋下的是诚信和身份认同的长期困境。","evidence":"“自己买张假文凭回去哄人，岂非也成了骗子？”","location":"第一章：方鸿渐收到爱尔兰人的假文凭广告后，犹豫是否购买并向家人撒谎。","page":"P10","edition":"人民文学出版社软皮版","explain":"自我怀疑说明人物清楚虚假身份会改变道德处境。此后获得体面与害怕揭穿并存，隐瞒持续制造羞耻和现实压力，身份认同难以稳定。","link":"假文凭的影响贯穿求学、求职和婚恋，成为人物困境的起点。","chapter":"第一章","searchPhrase":"克莱登法商专门学校函授部","pdfPage":"20"}],"traps":["只批判方鸿渐个人，不分析社会崇拜学历的现象。","把假文凭当作孤立事件，不联系职业和婚恋困境。"]},{"id":"fortress-intellectuals","work":"《围城》","workKey":"fortress","type":"主题思想","title":"三闾大学与知识分子群像","prompt":"分析《围城》中的知识分子群像。","keywords":["三闾大学","知识分子","虚伪","派系","李梅亭","韩学愈"],"thesis":"《围城》通过三闾大学的派系斗争和学者群像，讽刺知识分子在名利、权力和虚荣中的庸俗化。","points":[{"point":"三闾大学的聘约处理暴露权力任性和制度失信。","evidence":"“高松年省他起稿子写信的麻烦，干脆不送聘约给他。”","location":"第八章：下学年聘约陆续发出，方鸿渐却没有收到聘书，高松年对此不作正面解释。","page":"待核","edition":"人民文学出版社软皮版","explain":"职业前途被当作行政琐事，权力者甚至可以用沉默完成决定。机构表面有程序和制度，实际安排却由权力与好恶支配，相关知识者缺少保障。","link":"机构问题因此成为群像困境的直接来源。","chapter":"第八章","searchPhrase":"从没听过三闾大学","pdfPage":"273"},{"point":"课堂敷衍和学术准备不足，揭穿教师身份的体面外表。","evidence":"“他动不动就写黑板，黑板上写一个字要嘴里讲十个字那些时间。”","location":"第六章三闾大学：方鸿渐上英文课，用不断写黑板的方式拖延课堂，学生也缺乏兴趣。","page":"待核","edition":"人民文学出版社软皮版","explain":"课堂时间被形式消耗，教学内容和学生收获退居其次。人物准备不足，只能用表面动作维持体面，教师身份与真实能力形成强烈反差。","link":"知识分子的虚荣由课堂细节自然暴露，讽刺不依赖作者直接评判。","chapter":"第六章","searchPhrase":"从没听过三闾大学","pdfPage":"213"},{"point":"方鸿渐的自我怀疑写出知识分子缺少方向和专业根基。","evidence":"“自己毫无经验，更无准备，教的功课又非出自愿，要参考也没有书，当然教不好。”","location":"第六章三闾大学：方鸿渐发现自己的课不受欢迎，回想留学经历并承认教学准备严重不足。","page":"待核","edition":"人民文学出版社软皮版","explain":"经验、准备、意愿和资源连续缺失，所教内容也非自主选择。留学经历没有转化为专业能力，人物在机构安排与现实压力中只能接受失败。","link":"个人困境与教育体制的虚浮共同构成长篇群像批判。","chapter":"第六章","searchPhrase":"从没听过三闾大学","pdfPage":"213"}],"traps":["只罗列人物丑事，不分析群体象征。","把讽刺写成简单道德批判，忽略时代环境。"]},{"id":"fortress-metaphor","work":"《围城》","workKey":"fortress","type":"艺术手法","title":"比喻与围城意象","prompt":"分析《围城》中比喻和意象的艺术作用。","keywords":["比喻","意象","鸟笼","围城","人生困境","讽刺"],"thesis":"《围城》用鸟笼、城堡和围城等比喻，把婚姻、职业与人生困境具象化，使讽刺具有反复回扣的结构力量。","points":[{"point":"鸟笼比喻把婚姻中的进出欲具象化。","evidence":"“结婚仿佛金漆的鸟笼，笼子外面的鸟想住进去，笼内的鸟想飞出来。”","location":"第三至四章人物谈论爱情和婚姻，以及第五至九章方鸿渐婚恋经历；重点找鸟笼、围城等比喻出现的段落。","page":"待核","edition":"人民文学出版社软皮版","explain":"体面外壳与封闭空间被放在同一形象中，进入前的光亮掩盖进出后的限制。人物只看到想象中的幸福，比喻因此同时写出欲望与束缚。","link":"这一比喻构成全文围城主题的直观基础。","chapter":"第三章","searchPhrase":"结婚仿佛金漆的鸟笼","pdfPage":"101"},{"point":"围城比喻具有统摄全书的概括作用，提示人物在愿望和现实之间反复进出。","evidence":"“城外的人想冲进去，城里的人想逃出来。”","location":"小说题词及全书的爱情、职业和婚姻情节，用于观察同一比喻怎样统摄不同阶段。","page":"待核","edition":"人民文学出版社软皮版","explain":"开场比喻把追逐与逃离写成同一循环，为爱情、职业和婚姻提供统一框架。人物把进入新关系或新职位当作解决问题，获得之后又产生新的失望，作品因此由多个生活事件上升为普遍人生经验。","link":"围城由单一婚姻比喻扩展为整部小说的结构原则。","chapter":"第三章","searchPhrase":"结婚仿佛金漆的鸟笼","pdfPage":"101"},{"point":"比喻还承担讽刺人性欲望和婚后幻灭的功能。","evidence":"“狗为着追求水里肉骨头的影子，丧失了到嘴的肉骨头！跟爱人如愿以偿结了婚，恐怕那时候肉骨头下肚，倒要对水怅惜这不可再见的影子了。”","location":"第五章：方鸿渐与赵辛楣谈婚姻和人生选择，用动物追逐倒影说明得到之后的失望。","page":"待核","edition":"人民文学出版社软皮版","explain":"肉骨头代表已经得到的东西，水中影子代表想象中的更好选择。人物为了幻影失去现实拥有，婚后又怀念记忆中的欲望对象，讽刺人的贪求和永远不满足的心理。这个具体比喻让人性弱点可见，也避免作者直接出面下判断。","link":"比喻由此同时承担幽默效果和人性批判。","chapter":"第三章","searchPhrase":"城外的人想冲进去","pdfPage":"101"}],"traps":["只摘抄比喻，不解释比喻和行为、主题的关系。","把所有意象都说成围城，忽略具体语境。"]},{"id":"fortress-group-portrait","work":"《围城》","workKey":"fortress","type":"人物形象","title":"知识分子群像的病态","prompt":"结合方鸿渐及周围人物，分析《围城》如何塑造战时知识分子群像。","keywords":["群像","知识分子","方鸿渐","虚荣","三闾大学","病态"],"thesis":"小说以方鸿渐为线索，把学历、爱情和职业空间中的知识分子连成群像，写出他们在理想与现实之间的虚荣、摇摆和无力。","points":[{"point":"学历崇拜掩盖了人物精神上的空疏。","evidence":"“小小一方纸能把一个人的空疏、寡陋、愚笨都掩盖起来。”","location":"第一至二章：方鸿渐购买文凭、回国后被报刊和社交圈当成博士追捧，重点看学历崇拜如何形成群体气氛。","explain":"外在凭证遮住能力问题，群像宁愿依赖体面证明。学历崇拜表现的是精神虚弱，个人虚荣与社会评价体系互相维持。","link":"这为后文职业和婚恋中的困境埋下伏笔。","page":"P10","edition":"人民文学出版社软皮版"},{"point":"人物关系中的功利计算暴露出婚恋的世俗逻辑。","evidence":"“这姓方的不合式，气量太小，把钱看得太重。”","location":"第三至四章苏文纨、唐晓芙相关婚恋线，以及第五至九章孙柔嘉关系；重点找张家、苏家等人物对他家世、性情和金钱的评价。","explain":"婚恋评价被压缩成金钱和性情判断，个人感情受家世、体面和功利计算包围。私人选择因此反映群体标准，人物关系同时成为社会观察。","link":"个体婚恋困境由此扩展为群体和社会的讽刺。","page":"P44","edition":"人民文学出版社软皮版"},{"point":"人物互相映照，构成知识分子群体的普遍困境。","evidence":"“他的傲慢无礼，是学墨索里尼和希特勒接见小国外交代表开谈判时的态度。”","location":"第五章赴三闾大学途中，赵辛楣与方鸿渐初见并互相审视；第六至七章在三闾大学围绕职位、派系、婚姻和面子继续映照。","explain":"私人傲慢被夸大成政治权力表演，人物的自负显得可笑。不同人物的虚弱、算计与表演互相映照，共同构成知识分子的病态群像。","link":"分析群像时要说明人物关系如何共同揭示时代和精神问题。","page":"待核","edition":"人民文学出版社软皮版"}],"traps":["只介绍方鸿渐一个人物，没有群像之间的互相映照。","把人物缺点简单归为个人品行，忽略学历、职业和时代压力。"]},{"id":"fortress-language-satire","work":"《围城》","workKey":"fortress","type":"艺术手法","title":"语言讽刺的三种方式","prompt":"分析《围城》如何通过比喻、人物语言和叙事判断实现讽刺。","keywords":["语言讽刺","比喻","幽默","人物语言","叙事判断","围城"],"thesis":"钱钟书把比喻、人物语言和冷静的判断交织在一起，使讽刺既能制造幽默，也能揭露人物和社会的真实处境。","points":[{"point":"具象比喻把抽象的人生困境转成可感形象。","evidence":"“结婚仿佛金漆的鸟笼，笼子外面的鸟想住进去，笼内的鸟想飞出来。”","location":"第三至四章人物谈论婚姻与爱情，以及第五至九章方鸿渐婚恋经历；重点找金漆鸟笼、围城等比喻。","explain":"具体形象压缩了诱惑、体面和封闭感，读者先感到语言机趣，随后看见其中束缚。表达承担讽刺功能，抽象人生困境获得可感外形。","link":"比喻因此同时承担描写、讽刺和主题揭示功能。","page":"待核","edition":"人民文学出版社软皮版"},{"point":"人物语言的夸张反差暴露其虚伪和自负。","evidence":"“他的傲慢无礼，是学墨索里尼和希特勒接见小国外交代表开谈判时的态度。”","location":"第五章旅途初见和第六至七章三闾大学社交；重点找赵辛楣、李梅亭、高松年等人的夸张比喻和失度言辞。","explain":"宏大政治场景被用于私人交往，失衡的比例立即显出装腔作势。夸张没有直接评价，人物的虚伪和可笑却由语言自行暴露。","link":"讽刺通过语言自身完成，作者很少直接出面批评。","page":"待核","edition":"人民文学出版社软皮版"},{"point":"叙事判断把轻松语言引向严肃批判。","evidence":"“小小一方纸能把一个人的空疏、寡陋、愚笨都掩盖起来。”","location":"第一至二章假文凭、报刊吹捧和社交圈追捧；重点找轻巧句式中暴露学历社会和自我欺骗的句子。","explain":"轻巧语气与严肃指向形成落差，幽默为批判披上轻松外衣。读者笑过之后仍看到荒诞，讽刺同时服务阅读趣味和主题推进。","link":"结语应回到幽默与批判并存的语言特点。","page":"P10","edition":"人民文学出版社软皮版"}],"traps":["只摘比喻说有趣，不解释比喻揭穿了什么。","把讽刺理解为单纯搞笑，忽略其中的社会批判。"]},{"id":"fortress-concrete-balance","work":"《围城》","workKey":"fortress","type":"艺术手法","title":"讽刺的具象化与平衡视角","prompt":"分析《围城》如何通过具象化描写和平衡视角完成讽刺。","keywords":["具象化","平衡视角","隐喻","结构","冷峻","笑中带泪"],"thesis":"小说用具体物象承载抽象情绪，又以冷峻而有距离的视角观察不同人物，使讽刺不流于辱骂，而呈现出复杂的“笑中带泪”。","points":[{"point":"具体物象让抽象情感变得可见。","evidence":"“结婚仿佛金漆的鸟笼，笼子外面的鸟想住进去，笼内的鸟想飞出来。”","location":"第三至四章婚姻话题、第五至七章三闾大学任职和第八至九章婚姻生活；重点找把人生困境化作具体物象的比喻。","explain":"同一物件容纳欲望、限制和进退，抽象情感因此具有外形。比喻避免空泛议论，也让反复摇摆的复杂心理保持可感。","link":"具象化使讽刺具有画面和回味。","page":"待核","edition":"人民文学出版社软皮版"},{"point":"冷峻视角避免把人物简单分成善恶两方。","evidence":"“这姓方的不合式，气量太小，把钱看得太重。”","location":"第三至四章张家评价方鸿渐，以及苏家、方家等人物关系；重点看评价者和被评价者如何同时暴露局限。","explain":"评价既指向被评价者，也暴露评价者的势利和偏见。叙述让双方都受到审视，人物无法被简单分成善恶，群像更接近真实灰色状态。","link":"平衡视角让人物世界更接近真实的灰色状态。","page":"P44","edition":"人民文学出版社软皮版"},{"point":"结构上的反复让围城意象贯穿不同人生阶段。","evidence":"“城外的人想冲进去，城里的人想逃出来。”","location":"第三至四章爱情、第五至七章三闾大学、第八至九章婚姻；按同一围城结构寻找“想进入”和“想逃离”的重复场面。","explain":"同一结构跨越爱情、职业和婚姻，人物每次把进入当作解决，随后产生新的失望。重复使个人困境上升为普遍人生经验。","link":"结尾应回扣内容与形式统一的讽刺美学。","page":"待核","edition":"人民文学出版社软皮版"}],"traps":["只谈具象化，不分析平衡视角带来的复杂性。","把反讽写成简单的贬低或道德审判。"]},{"id":"saffi-imperfect-vanguard","work":"《莎菲女士的日记》","workKey":"saffi","type":"人物形象","title":"“不完美”莎菲的先锋性","prompt":"莎菲自我分裂、反复彷徨是否削弱了人物的先锋性？结合文本分析。","keywords":["不完美","先锋性","自我分裂","女性主义","主体","抵抗"],"thesis":"莎菲的先锋性不在于她成为道德完美的新女性，而在于她敢于承认欲望、行使对男性人格的精神评判权，并拒绝用物质和肉欲替代灵魂契合。","points":[{"point":"欲望和自我表达打破了传统女性的沉默。","evidence":"“我压制住我那狂热的欲念，我未曾请求他多留一会儿。”","location":"莎菲认识凌吉士后反复书写欲望与克制的日记段落。","explain":"人物承认身体经验，同时暴露规范造成的压抑。她展示新意识如何在旧秩序内部艰难生长，未完成状态使人物比单纯的觉醒符号更真实，也具有先锋性。","link":"“不完美”构成对虚假统一主体的拒绝，也让人物更具先锋性。","page":"P61","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"她拒绝凌吉士，是在行使女性对欲望对象进行精神评判和道德选择的权利。","evidence":"“当我明白了那使我爱慕的一个高贵的美形里，是安置着如此一个卑劣灵魂。”","location":"莎菲看清凌吉士真实面目后的心理转折。","explain":"人物没有因为欲望放弃判断，在发现对象的人格问题后主动收回感情。拒绝体现女性决定何种人值得进入关系、何种价值不能被交易的权利，与被迫失恋无关。","link":"先锋性由此从身体欲望推进到精神评判和道德主体。","page":"P58","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"日记中的独语构成女性自我空间的建构。","evidence":"“谁能懂得我呢，便能懂得这只能表现我万分之一的日记。”","location":"全篇以第一人称日记持续展开的内心独白。","explain":"私人书写承认表达永远不完整，却也是人物可以脱离社会角色说话的空间。她保留欲望、羞耻、反思和判断，拒绝被外界固定成单一形象，书写因此成为抵抗误解和建构自我的方式。","link":"这种私人空间使“不完美”获得了抵抗父权主体神话的意义。","page":"P65","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把莎菲的犹豫和反复只当作性格缺点。","只写女性欲望，不分析她拒绝凌吉士时所表现的精神标准和主体判断。"]},{"id":"saffi-awakening-tragedy","work":"《莎菲女士的日记》","workKey":"saffi","type":"主题思想","title":"觉醒之后的结构性悲剧","prompt":"分析莎菲觉醒后的精神困境及其结构性悲剧。","keywords":["觉醒","精神困境","悲剧","孤独","理解","爱情"],"thesis":"莎菲的悲剧源于个体解放思想先于社会结构变化：她获得了判断、拒绝和保持尊严的权利，却没有得到新的关系、女性共同体与社会出路。","points":[{"point":"觉醒使她拒绝旧规范，却无法摆脱外部评价和制度压力。","evidence":"“一个女人这样放肆，是不会得到好结果的。”","location":"莎菲面对爱情、身体和社交规范时的日记独白。","explain":"父权规范被包装成对命运的善意提醒，人物虽能质疑，却仍生活在会分配羞辱和孤立的环境中。意识越清楚，日常冲突越尖锐，觉醒因此伴随现实代价。","link":"觉醒没有自动带来自由，反而暴露了思想解放与社会条件之间的落差。","page":"P45","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"她渴望真正的精神理解，却没有女性共同体或社会力量承接她的觉醒。","evidence":"“我总愿意有那么一个人能了解得我清清楚楚的。”","location":"莎菲与蕴姊、毓芳及苇弟相处时的日记内容。","explain":"人物要求完整准确的理解，亲友照料无法进入精神世界，重要情感纽带又中断。作品中没有女性互助组织或公共力量承接这种觉醒，孤独属于结构性缺席。","link":"精神困境由此从私人关系上升到女性共同体的缺失。","page":"P40","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"离开和拒绝构成她的道德自救，同时无法解决矛盾的现实出路。","evidence":"“我又将一人寂寂寞寞地离开这古城了。”","location":"2026 May/June Paper 3 选文所取的莎菲离开北京前日记段落。","explain":"离开同时包含保存自我和无人同行两层处境。人物暂时摆脱需要妥协的关系，却没有改变造成困境的社会结构，道德自救因此无法完成真正解放。","link":"莎菲的悲剧性因此在于她只能退出，而不能改造世界。","page":"待核","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把悲剧归因于莎菲性格敏感、犹豫或不懂珍惜。","把离开写成彻底解放，忽略她缺少社会支持和现实出路。"]},{"id":"saffi-enlightenment-revolution","work":"《莎菲女士的日记》","workKey":"saffi","type":"主题思想","title":"自由恋爱的启蒙悖论","prompt":"结合启蒙与革命语境，分析莎菲的“自由恋爱”为什么没有带来真正解放。","keywords":["启蒙","革命","自由恋爱","个性解放","女性","悖论"],"thesis":"自由恋爱把个人从传统中解放出来，却没有提供能够承接女性主体性的社会结构和精神共同体；莎菲拒绝凌吉士，正暴露启蒙话语在性别和阶级层面的边界。","points":[{"point":"自由恋爱最初表现为女性主动追求个人欲望和情感选择。","evidence":"“颀长的身躯，白嫩的面庞，薄薄的小嘴唇，柔软的头发。”","location":"莎菲初次接触并观察凌吉士的日记段落。","explain":"女性从被选择和被观看的位置转为欲望主体，主动感受、选择和追求。自由恋爱因此首先是权利意识觉醒，但解放仍寄托在具体男性身上，尚未触及社会独立条件。","link":"启蒙给了她爱的自由，却没有同时给她独立的现实基础。","page":"P43","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"凌吉士的拜金、肉欲和自我享乐人格，暴露自由恋爱背后的资本主义男权逻辑。","evidence":"“当我明白了那使我爱慕的一个高贵的美形里，是安置着如此一个卑劣灵魂。”","location":"莎菲认清凌吉士真实面目后的心理转折。","explain":"爱情对象代表现代都市身份与情场魅力，其价值观仍以金钱、肉欲和自我享乐为中心。人物拒绝后，启蒙自由的局限被揭开，两性关系中的权力和欲望结构并未自动改变。","link":"恋爱自由因此显现出性别与阶级的双重边界。","page":"P58","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"找不到新的精神共同体，使个体只能退回日记并保持孤独。","evidence":"“谁能懂得我呢，便能懂得这只能表现我万分之一的日记。”","location":"莎菲与亲友、爱人关系受挫后继续写日记的段落。","explain":"私人书写保存不愿妥协的自我，却无法建立新的社会联系。女性没有共同体、公共空间或制度承接觉醒，自由只能由个人承担后果，思想解放因此留下精神漂流。","link":"莎菲的困境为丁玲及新文学主体其后转向革命提供了深层注脚。","page":"P65","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把自由恋爱写成纯粹的个性胜利。","只批判凌吉士个人道德，不分析他所代表的物质主义和男权逻辑。"]},{"id":"water-intellectual-stance","work":"《水》","workKey":"water","type":"主题思想","title":"《水》中的知识分子立场","prompt":"分析《水》如何体现作者的知识分子立场。","keywords":["知识分子立场","第三种声音","人道主义","隐含作者","群众","反思"],"thesis":"《水》在左翼革命叙事之外保留了知识分子的同情、观察和反思，使灾难书写不仅歌颂群众，也追问人的尊严和社会责任。","points":[{"point":"作品首先以人的苦难作为叙事起点。","evidence":"“那些被骂着的女人，一批一批的，在无可奈何之中，含着眼泪，含着一线希望，扶老携幼向着相反的方向跑去，带着哭和叫，带着骚扰和不安，向原野的四方伸去。”","location":"第一部分灾民逃难：重点找作者如何写眼泪、希望、妇女和儿童的具体处境。","explain":"群像细节先呈现具体生命的恐惧和挣扎，作者保留对个体尊严的关注。群众没有直接成为抽象革命力量，人的苦难构成知识分子立场的情感基础。","link":"人道关怀构成知识分子立场的基础。","page":"P226","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"人物语言呈现对现实原因的追问。","evidence":"“哭有什么用，死的死去了，哭得转来吗？”","location":"第一至二部分王大保讲话及灾民与官员交涉：人物语言如何把苦难引向对现实原因的追问。","explain":"人物语言把行动问题交给底层自己回答，提问同时追问灾害为何不断加重。读者因此看到具体权力关系，单一天灾解释无法覆盖社会根源。","link":"群众叙述和知识分子反思由此同时存在。","page":"P228","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"结尾的集体反抗仍保留作者对力量转向的观察。","evidence":"“比水还凶猛的，朝镇上扑了过去。”","location":"第四部分结尾：群众集体冲向镇上，重点看作者怎样肯定反抗力量，又保留对人物情感和处境的观察。","explain":"叙述肯定底层获得行动能力，也没有省略力量形成过程。作者既认可反抗，又持续观察恐惧、饥饿和愤怒如何转化，革命叙事中仍保留知识分子的反思。","link":"结论要把“向人”和“向左”连接起来。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["只把《水》解释成左翼口号，忽略人道关怀。","只谈灾害，不分析作者和隐含叙事者的立场。"]},{"id":"water-1930s-ecology","work":"《水》","workKey":"water","type":"比较阅读","title":"灾害书写与1930年代文学生态","prompt":"结合1930年代上海文学生态，分析《水》灾害书写中的左翼文学特征。","keywords":["1930年代","文学生态","灾害书写","左翼文学","比较","上海"],"thesis":"《水》把自然灾害、官僚压迫和群众觉醒接合起来，体现左翼文学关注底层和社会改造的方向，也显示1930年代文学思潮相互碰撞的多元生态。","points":[{"point":"灾害描写一开始就和社会环境连在一起。","evidence":"“愁惨的天照着黄色的滔滔的大水，那一夜淹了汤家阙，又淹了一渡口的一片汪洋的大水。”","location":"第一部分开头：洪水逼近并毁坏村庄，重点看自然环境怎样立即带出贫困和社会脆弱。","explain":"具体生活空间被灾难吞没，村庄、田地和家庭成为破坏对象。作品从生存危机进入底层贫困和社会脆弱性，灾害书写带有明显社会观察。","link":"灾害因此成为观察社会结构的入口。","page":"P226","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"官僚和军队的行为把天灾转化为社会悲剧。","evidence":"“帆船却又带来了一些军火，并没有带救济米。”","location":"第二至三部分：官府处理灾情、军火替代救济米，重点找权力和阶级关系。","explain":"权力机构在救灾时刻的实际选择揭示阶级立场。政治反差把灾害记录推向社会批判，并与左翼文学对权力结构的关注相连。","link":"这种问题意识与左翼文学的社会分析相呼应。","page":"P231","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"群众反抗体现文学从揭露问题走向行动想象。","evidence":"“比水还凶猛的，朝镇上扑了过去。”","location":"第四部分结尾：群众集体反抗，重点看作品如何从揭露问题走向社会改造想象。","explain":"灾害的破坏力被改写为集体行动力，作品从揭露问题走向行动想象。这种转向呼应1930年代左翼文学对社会出路的探索。","link":"结尾要说明它和1930年代多元文学思潮之间的互动。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把灾害小说仅仅当作灾难记录。","比较时只写共同点，不说明《水》的政治指向。"]},{"id":"water-discourse-tension","work":"《水》","workKey":"water","type":"主题思想","title":"个性话语与革命话语的张力","prompt":"分析《水》如何呈现个性话语与革命话语之间的张力。","keywords":["个性话语","革命话语","冯雪峰","左翼批评","群众","情感"],"thesis":"《水》一方面走向宏大的革命和群众叙事，另一方面仍保存个体恐惧、悲痛和复杂情感，文本因此留下个性话语与革命话语相互牵引的张力。","points":[{"point":"个体苦难仍然是革命叙事不可抹去的部分。","evidence":"“那些被骂着的女人，一批一批的，在无可奈何之中，含着眼泪，含着一线希望，扶老携幼向着相反的方向跑去，带着哭和叫，带着骚扰和不安，向原野的四方伸去。”","location":"第一部分灾民逃难：重点找妇女哭喊、扶老携幼等个体情感，看它们如何保留在革命叙事中。","explain":"逃亡、哭叫和家庭迁徙构成叙事最强的现实压力。革命叙事必须先承载个体痛苦，集体觉醒才有真实的人性根底。","link":"这构成文本中个性话语的留存。","page":"P226","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"革命话语通过政治反差把个人苦难引向社会批判。","evidence":"“帆船却又带来了一些军火，并没有带救济米。”","location":"第二至三部分：军火与救济米的反差把求生问题引向权力批判。","explain":"物资反差把个人求生引向权力质疑，革命话语从现实利益判断中生长。个体苦难获得社会批判方向，群众觉醒与现实处境相连。","link":"两种话语彼此依存并互相推动。","page":"P231","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"集体行动仍然包含鲜明的情感力量。","evidence":"“比水还凶猛的，朝镇上扑了过去。”","location":"第四部分结尾：群众行动由悲痛、饥饿和愤怒积聚而成，重点看集体行动中的情感动力。","explain":"集体行动的力量来自悲痛、饥饿和愤怒，群众保持具体情感，并未成为抽象主体。革命话语与个性话语因此互相依赖，也持续拉扯。","link":"结尾要说明革命转向背后的复杂情感动力。","page":"P240","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把个性话语和革命话语看作完全对立。","只讨论革命主题，不分析个体情感怎样进入集体叙事。"]},{"id":"hospital-individual-collective","work":"《在医院中》","workKey":"hospital","type":"主题思想","title":"个体理想与集体秩序","prompt":"分析《在医院中》如何思考个体理想与集体秩序之间的关系。","keywords":["个体","集体","理想","秩序","陆萍","改造"],"thesis":"医院同时是个体实践的场所和集体秩序的现场。小说把陆萍的专业理想、组织纪律和医院现实放在同一空间中，呈现个体需要实践、集体需要反思的双向磨合。","points":[{"point":"陆萍希望用专业标准改善医院，使个体理想服务于集体。","evidence":"“她总是爱飞。总不满于现状。”","location":"第一部分：陆萍到院后观察医疗条件和管理问题，希望以专业标准改善医院。","explain":"人物对病人和产妇的关切以及现代医学要求，共同塑造了进步理想。个体诉求指向公共服务，冲突来自改善现实的方式和节奏，无法被简单描述为个人对抗集体。","link":"冲突的起点是理想与现实之间的距离。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"集体中的标签化使工作问题无法被正常讨论。","evidence":"“小资产阶级意识、知识分子的英雄主义、自由主义等等的帽子都往她头上戴。”","location":"第二至三部分：她提出意见书、与同事和管理者发生冲突，并被贴上“小资产阶级意识”等标签。","explain":"身份判断取代具体分析，人物的意见失去被理解的机会。集体以标签维护旧秩序，也压抑专业改进可能，官僚和麻木成为内部阻力。","link":"个体需要调整，集体同样需要自我反思。","page":"P394","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"朋友、病人和老同志的帮助使陆萍转向更成熟的实践。","evidence":"“她仍然是那样兴致很浓厚的去照顾着那些产妇，那些婴儿，为着她们一点点的需索，去同管理员，总务处，秘书长，甚至院长去争执。”","location":"第四部分：陆萍与朋友、老同志交流后继续照顾病人并为资源交涉，观察个人行动方式的变化。","explain":"人物继续为具体需要奔走，并学会让理想适应现实节奏。个体与集体关系从单纯冲突转向实践调整，关怀仍处于核心。","link":"结论应落在个体与集体的双向成长。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把陆萍写成完全正确、集体完全错误的二元对立。","只谈组织纪律，不分析医院管理中的官僚主义和专业缺失。"]},{"id":"hospital-dual-luping","work":"《在医院中》","workKey":"hospital","type":"人物形象","title":"“产科助手”与“理想人物”的双重分裂","prompt":"为什么说陆萍是在“产科助手”与“理想人物”之间游移、分裂的形象？","keywords":["陆萍","产科助手","理想人物","双重分裂","身份","成长"],"thesis":"陆萍的复杂性来自现实中的产科助手、五四新女性、现代医学知识者和理想革命者等多重身份。创作理想不断要求她成为坚强人物，现实细节却不断暴露她的脆弱、热情和困惑。","points":[{"point":"理想自我要求她用理智压住脆弱，努力建设新的希望。","evidence":"“她竭力安慰自己，鼓励自己，骂自己，又替自己建筑着新的希望的楼阁，努力使自己在这楼阁中睡去。”","location":"第一部分：陆萍在窑洞中反复安慰自己、鼓励自己、骂自己，努力把不安压下去。","explain":"人物用多种方式要求自己维持坚强，希望因此带有自我麻醉成分。理想自我与现实感受没有真正调和，主体分裂在反复自我说服中显现。","link":"人物的坚强和脆弱在同一种自我调整中同时出现。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"产科助手的现实身份不断把她拉回具体、琐碎而疼痛的医疗工作。","evidence":"“为了不愿病人产妇多受苦痛，便自己去替几个开刀了的，发炎的换药。”","location":"第一部分至第二部分：她替开刀、发炎的病人换药，照料产妇和婴儿，把理想落实为产科助手的劳动。","explain":"理想期待无法替代护理和换药等实际劳动，具体工作让她看见病人、产妇和医疗条件的真实处境。现实身份给批判提供经验，也持续拉扯理想自我。","link":"两种身份的冲突推动人物由想象走向实践。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"受挫后的陆萍没有被彻底改造，却在继续行动中逐渐弥合主体裂隙。","evidence":"“她仍然是那样兴致很浓厚的去照顾着那些产妇，那些婴儿，为着她们一点点的需索，去同管理员，总务处，秘书长，甚至院长去争执。”","location":"第三至四部分：中毒事件后她情绪崩溃，随后仍照顾病人、争取资源，并准备继续学习和工作。","explain":"受挫后继续为具体需要奔走，说明理想并未被现实完全击碎。人物把愿望落实为可持续行动，分裂逐渐转向稳定责任意识，她从热血青年成长为实践者。","link":"成长的价值在于主体裂隙得到实践中的调整，人物并未被抹平。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把陆萍的分裂简单归因于性格前后矛盾。","只写她最终成为有用的人，忽略她保留的敏感、脆弱和主体复杂性。"]},{"id":"hospital-growth-useful","work":"《在医院中》","workKey":"hospital","type":"主题思想","title":"从迷惘青年到更清醒的实践者","prompt":"分析陆萍如何从迷惘青年走向“有用的人”。","keywords":["成长叙事","有用的人","多重主体","蜕变","革命","青年"],"thesis":"陆萍的成长体现一个复合主体从理想冲动走向现实实践的过程。她保留批判意识，也逐渐理解革命工作的艰难、策略和持续学习的重要性。","points":[{"point":"陆萍的多重身份使她既能发现问题，也容易与现实产生裂隙。","evidence":"“她总是爱飞。总不满于现状。”","location":"第一至二部分：陆萍初始改革热情与医院现实的第一次碰撞，重点找她的“爱飞”和专业责任感。","explain":"新女性意识、医学知识和政治身份共同塑造人物，使她敏锐、负责并追求进步。她也因此难以容忍慵懒、外行和冷漠，行动力量与对现实复杂性的准备不足同时存在。","link":"成长问题是多重主体如何与现实重新建立联系。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"外部误解和自我怀疑迫使她重新认识个人英雄主义的局限。","evidence":"“小资产阶级意识、知识分子的英雄主义、自由主义等等的帽子都往她头上戴。”","location":"第二至三部分：意见书被排斥、中毒事件爆发、流言和病痛叠加，重点看她如何重新认识自己。","explain":"身份化批评方式粗暴，却迫使人物面对个人热情的局限。她逐渐认识到改善机构和关系还需要理解群众、策略和长期实践。","link":"成长来自对自我与环境的双重认识。","page":"P394","edition":"浙江文艺出版社《丁玲小说》（标注版）"},{"point":"结尾选择继续学习和实践，使“有用的人”具有开放而积极的含义。","evidence":"“她准备着如何可以使自己不失去这一个机会。”","location":"第四部分结尾：陆萍接受朋友和老同志的开导，准备抓住新的工作与学习机会。","explain":"人物没有停在受害者位置，也不把离开视为成长失败，她继续寻找能够发挥价值的行动机会。有用因此意味着经历困难后仍保持责任、持续学习并选择实践。","link":"结尾把成长写成开放过程，而非封闭的成功或失败。","page":"P389","edition":"浙江文艺出版社《丁玲小说》（标注版）"}],"traps":["把“有用的人”简化为对组织的被动服从。","把开放结尾判定为完全失败，忽略人物的主动选择。"]}];

function grams(s,n){s=norm(s);var out=[];for(var i=0;i<=s.length-n;i++)out.push(s.slice(i,i+n));return out}

function predictionCard(x){var first=firstRelated(x);return '<div class="point"'+(first?' data-open="'+esc(first.id)+'" style="cursor:pointer"':'')+'><div class="meta"><span class="tag">'+esc(x.confidence)+'概率</span><span class="tag">预测方向</span></div><div class="pointTitle">'+esc(x.title)+'</div><div class="field"><b>题目在问什么</b>'+esc(x.plain||x.question)+'</div><div class="field"><b>考场设问</b>'+esc(x.question)+'</div>'+(first?'<div class="field"><b>写作起点</b>'+esc(first.thesis)+'</div><button type="button" class="primary" data-open="'+esc(first.id)+'">打开对应答题页</button><div class="hint">进入后查看完整母题和 Paper 3 写作路径。</div>':'')+'<div class="field"><b>判断依据</b>'+esc(x.basis)+'</div>'+relatedButtons(x.relatedIds)+'</div>'}
function pastView(){var chips='<div class="chips"><button class="'+(state.work==="all"?"on":"")+'" data-past-work="all">全部</button>'+Object.keys(WORKS).map(function(k){return '<button class="'+(state.work===k?"on":"")+'" data-past-work="'+k+'">'+esc(WORKS[k])+'</button>'}).join("")+'</div>';var past=PAST.past.filter(function(x){return state.work==="all"||x.workKey===state.work});var preds=PAST.predictions.filter(function(x){return state.work==="all"||x.workKey===state.work});return chips+'<div class="panel"><h2>历年真题与时考方向</h2><p>'+esc(PAST.coverageNote)+'</p><p style="margin-top:7px">'+esc(PAST.structureNote)+'</p><div class="hint">'+esc(PAST.sourceNote)+'</div></div><div class="panel"><h3>已考真题与官方样卷</h3>'+past.map(pastCard).join("")+'</div><div class="panel"><h3>高概率预测方向</h3>'+preds.map(predictionCard).join("")+'</div>'}
function drawView(){var pool=DATA.filter(function(x){return state.work==="all"||x.workKey===state.work});var remaining=pool.filter(function(x){return state.drawHistory.indexOf(x.id)<0});var chips='<div class="chips"><button class="'+(state.work==="all"?"on":"")+'" data-draw-work="all">全部</button>'+Object.keys(WORKS).map(function(k){return '<button class="'+(state.work===k?"on":"")+'" data-draw-work="'+k+'">'+esc(WORKS[k])+'</button>'}).join("")+'</div>';if(state.drawItem){var x=state.drawItem;return chips+'<div class="panel"><div class="meta"><span class="tag">'+esc(workName(x.workKey))+'</span><span class="tag">'+esc(x.type)+'</span></div><h2>'+esc(x.title)+'</h2><p>'+esc(x.prompt)+'</p><div class="hint">先自己想：对应哪几个论点？分别在原文哪里？</div><button class="primary" id="openDraw">看论点与原文定位</button><button class="ghost" id="drawAgain" style="margin-top:8px">再抽一道</button></div><div class="hint">本轮已抽 '+state.drawHistory.length+' 道</div>'}return chips+'<div class="panel"><h2>随机抽取一道文学赏析题</h2><p>抽题后先自己组织论点，再点开看原文定位。</p><button class="primary" id="doDraw">抽取题目</button></div>'+(remaining.length?'<div class="hint">当前范围还可抽 '+remaining.length+' 道</div>':'<div class="hint">当前范围已经抽完，再抽一轮会自动重新开始。</div>')}
function detailView(x){var points=x.points.map(function(p,i){var bits=[];if(p.chapter)bits.push('章节：'+esc(p.chapter));if(p.pdfPage)bits.push('电子版PDF页：P'+esc(p.pdfPage));if(p.searchPhrase)bits.push('检索：'+esc(p.searchPhrase));if(p.page)bits.push('纸质页码：'+esc(p.page)+(p.edition?'（'+esc(p.edition)+'）':''));var page=bits.length?' · '+bits.join(' · '):'';return '<div class="point"><div class="pointTitle">主体段 '+(i+1)+'｜论点句：'+esc(p.point)+'</div><div class="field"><b>引用原文</b>'+esc(p.evidence)+'</div><div class="loc">引文定位：'+esc(p.location)+page+'</div><div class="field"><b>文学论证</b>'+esc(p.explain)+'</div><div class="field"><b>回扣题目</b>'+esc(p.link)+'</div></div>'}).join("");var guide='<div class="panel"><h3>Paper 3 写作路径</h3><div class="field"><b>第一步 审题</b>确认题目要分析的对象、任务和限定语：'+esc(x.prompt)+'</div><div class="field"><b>第二步 定中心</b>开头直接给出文章判断：'+esc(x.thesis)+'</div><div class="field"><b>第三步 写主体段</b>每一段按照“论点句、引用原文、文学论证、回扣题目”的顺序推进。下面的三个主体段就是可以直接模仿的写法。</div><div class="field"><b>第四步 收束全文</b>结尾回答题目中的核心问题，并回扣人物、主题或时代意义，不再增加新的论点。</div></div>';var traps=x.traps.map(function(t){return '<div class="warn"><b>不扣题写法</b>'+esc(t)+'</div>'}).join("");var focus='<div class="good"><b>扣题写法</b>每一段都要回答题目：“'+esc(x.prompt)+'”。引用后必须说明这句话怎样证明中心判断：“'+esc(x.thesis)+'”。</div>';return '<span class="back" id="back">← 返回</span><div class="panel"><div class="meta"><span class="tag">'+esc(workName(x.workKey))+'</span><span class="tag">'+esc(x.type)+'</span></div><h2>'+esc(x.title)+'</h2><p>'+esc(x.prompt)+'</p><div class="thesis"><b>中心论点</b><br>'+esc(x.thesis)+'</div></div>'+guide+'<div class="panel"><button class="ghost" id="toggleHide">'+(state.hide?"显示论点与原文定位":"先自己想，遮住答案")+'</button><div class="'+(state.hide?"hide":"")+'" id="answerBox" style="margin-top:12px"><h3>三个主体段</h3>'+points+'</div></div><div class="panel"><h3>扣题检查</h3><div class="hint">下面的提醒都是容易导致扣题失败的写法，不是答案示例。</div>'+focus+traps+'</div>'}
function render(){var app=document.getElementById("app");if(state.selected){var item=DATA.find(function(x){return x.id===state.selected});app.innerHTML=item?detailView(item):'<div class="empty">没有找到这道题</div>'}else{app.innerHTML=state.mode==="match"?matchView():state.mode==="past"?pastView():state.mode==="draw"?drawView():listView()}bind()}
function bind(){document.querySelectorAll("#tabs button").forEach(function(b){b.className=b.dataset.mode===state.mode?"on":"";b.onclick=function(){state.mode=b.dataset.mode;state.selected=null;state.hide=false;render()}});var search=document.getElementById("search");if(search)search.oninput=function(){state.query=this.value.trim();render();var el=document.getElementById("search");if(el){el.focus();el.selectionStart=el.selectionEnd=el.value.length}};document.querySelectorAll("[data-work]").forEach(function(b){b.onclick=function(){state.work=b.dataset.work;render()}});document.querySelectorAll("[data-past-work]").forEach(function(b){b.onclick=function(){state.work=b.dataset.pastWork;render()}});document.querySelectorAll("[data-draw-work]").forEach(function(b){b.onclick=function(){state.work=b.dataset.drawWork;state.drawItem=null;render()}});document.querySelectorAll("[data-open]").forEach(function(el){el.onclick=function(e){e.stopPropagation();state.selected=el.dataset.open;state.hide=false;render();window.scrollTo(0,0)}});document.querySelectorAll("[data-open] a").forEach(function(a){a.onclick=function(e){e.stopPropagation()}});document.querySelectorAll("[data-related]").forEach(function(b){b.onclick=function(e){e.stopPropagation();state.selected=b.dataset.related;state.hide=false;render();window.scrollTo(0,0)}});var box=document.getElementById("matchBox");if(box)box.oninput=function(){state.matchQuery=this.value};var doMatch=document.getElementById("doMatch");if(doMatch)doMatch.onclick=function(){state.matchQuery=document.getElementById("matchBox").value.trim();render()};var doDraw=document.getElementById("doDraw");if(doDraw)doDraw.onclick=function(){var pool=DATA.filter(function(x){return state.work==="all"||x.workKey===state.work});var remaining=pool.filter(function(x){return state.drawHistory.indexOf(x.id)<0});if(!remaining.length){state.drawHistory=[];remaining=pool}state.drawItem=remaining[Math.floor(Math.random()*remaining.length)];state.drawHistory.push(state.drawItem.id);render();window.scrollTo(0,0)};var openDraw=document.getElementById("openDraw");if(openDraw)openDraw.onclick=function(){state.selected=state.drawItem.id;state.hide=false;render();window.scrollTo(0,0)};var drawAgain=document.getElementById("drawAgain");if(drawAgain)drawAgain.onclick=function(){state.drawItem=null;render()};var back=document.getElementById("back");if(back)back.onclick=function(){state.selected=null;render()};var toggle=document.getElementById("toggleHide");if(toggle)toggle.onclick=function(){state.hide=!state.hide;render()}}
render();
</script>
</body>
</html>
